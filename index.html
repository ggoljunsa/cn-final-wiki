   "용어"
  ],
  "body": "'''Mobile station(MS)''' 은 셀룰러망의 '''사용자 기기'''(휴대폰·스마트폰)다. 자기가 있는 [[cell]] 의 [[base station]] 과 무선으로 통신하고, 움직이면 BS 가 바뀐다([[handoff]]). L10 p.9 (p.12 필기 \"스마트폰\").\n\n{def}\"Each cellular service area is divided into small regions called cells that consist of: Base Station (BS) · '''Mobile Station (MS)'''.\" (p.9)\n\"① '''MS scans the band''' and sends the number on the strongest setup channel … ⑥ MSC assigns an unused voice channel; '''MS retunes'''\" (p.12)\ncell 은 BS 와 MS 로 구성된다. MS 는 대역을 scan 해 가장 강한 setup channel 로 번호를 보내고, 할당받은 voice channel 로 주파수를 다시 맞춘다.{/def}\n\n[[img:L10-12.png|p.12 Transmitting — 육각 cell 안의 MS(필기 \"스마트폰\")가 ① closest base station 으로 번호 송신, ⑥ MSC 가 voice channel 할당 (필기본)|medium]]\n\n== 이름에서 개념 끌어내기 ==\n* '''mobile''' = 움직이는. 고정된 [[base station]] 과의 대비. 셀룰러가 해결하려는 문제 자체가 \"'''움직이는''' station 을 어떻게 계속 서비스하나\"다 → [[handoff]] · [[roaming]].\n* '''station''' = 통신 장치. 교수(10/20): MS 는 \"'''individual user'''\" 를 나타낸다 — WiFi·Bluetooth 의 station 과 같은 용어.\n\nMS 가 하는 일\n{|\n! 상황 || MS 의 동작 || 슬라이드\n|-\n| 발신 || 대역 scan → '''strongest setup channel''' 로 번호 송신 → 할당된 voice channel 로 '''retune''' || p.12 ①⑥\n|-\n| 수신 || paging 에 '''응답'''(위치가 알려짐) → ringing 에 '''answer''' || p.13 ③⑤\n|-\n| 이동 || 신호 세기가 MSC 에 감시되고, MSC 지시로 채널 변경(handoff) || p.15\n|-\n| 통신사 영역 밖 || 이웃 통신사 cell 에서 roaming || p.17\n|}\n\n{analogy}🎭 '''택시 승객.''' 승객(MS)은 어디든 돌아다니고, 지역마다 그 지역 배차센터(BS)가 담당한다. 승객은 \"가장 잘 들리는\" 배차센터에 콜을 넣고(strongest setup channel), 배정받은 택시 번호(voice channel)로 갈아탄다(retune).{/analogy}\n\n== 관련 문서 ==\n* [[base station]] · [[cell]] · [[통화 발신 과정]] · [[통화 수신 과정]] · [[handoff]] · [[uplink와 downlink]]"
 },
 "MSC": {
  "title": "MSC (Mobile Switching Center, 이동 교환국)",
  "category": [
   "1강 셀룰러 동작",
   "용어"
  ],
  "body": "'''MSC(Mobile Switching Center)''' 는 셀룰러망의 '''두뇌'''다. 여러 [[base station]] 을 유선으로 묶고, 유선 전화망([[PSTN]])의 central office 와 연결한다. 통화 연결·voice channel 할당·[[paging]]·[[handoff]] 결정이 전부 MSC 의 일이다. L10 p.10.\n\n{def}\"'''Mobile Switching Center (MSC)''' — '''Coordinates communication between all BSs and the central office'''.\" (p.10)\nMSC 는 모든 BS 와 (유선 전화망의) central office 사이의 통신을 조정한다.{/def}\n\n[[img:L10-10.png|p.10 Cellular system — 가운데 연두색 Mobile switching center(MSC): 오른쪽 cell 의 BS 와, 아래 PSTN 과 연결. 필기 \"wired phone도 wireless에 연결 가능\" (필기본)|medium]]\n\n== 이름에서 개념 끌어내기 ==\n* '''Mobile''' — 이동 사용자(MS)를 위한.\n* '''Switching''' — '''교환'''. 전화망에서 switch 는 \"누구와 누구를 연결할지 회선을 바꿔 끼우는 것\"이다. MSC 는 MS 의 통화를 알맞은 BS·central office 로 바꿔 끼운다.\n* '''Center''' — 여러 BS 의 '''중심'''. 그림에서도 BS 들과 PSTN 사이 한가운데 있다.\n\n슬라이드에서 MSC 가 하는 일 (전부 모으면)\n{|\n! 동작 || MSC 의 역할 || 슬라이드\n|-\n| 발신 || BS 가 relay 한 번호를 central office 로 forward ③ → 결과 수신 ⑤ → '''unused voice channel 할당''' ⑥ || p.12\n|-\n| 수신 || central office 에서 번호 받음 ① → '''모든 cell 에 query(paging)''' ② → ringing ④ → voice channel 할당 ⑥ || p.13\n|-\n| handoff || '''every few seconds 신호 세기 감시''' → 약해지면 새 cell 탐색 → 통화 채널 변경 || p.15\n|-\n| hard/soft || 그림에서 BS1·BS2 둘 다 같은 MSC 아래 || p.16\n|-\n| roaming || MSC A ↔ MSC B 가 roaming contract 로 연결 || p.17\n|}\n\n{analogy}🎭 '''항공 관제탑.''' 각 활주로(BS)는 비행기(MS)와 직접 교신하지만, 누가 어느 활주로·어느 주파수를 쓸지, 관할 구역을 넘는 비행기를 옆 관제 구역에 넘길지(handoff)는 관제탑(MSC)이 정한다. 다른 공항(PSTN·다른 통신사 MSC)과의 연락도 관제탑이 맡는다.{/analogy}\n\n[[anim:cellular_architecture|BS 들이 유선으로 MSC 에 모이고, MSC 가 PSTN 에 연결되는 순간 — \"MSC = 모든 BS 와 central office 사이의 조정자\" 를 확인하라]]\n\n{exam}🎯 정의 문장 \"coordinates communication between '''all BSs''' and the '''central office'''\" 는 그대로 외운다. 시험에서 \"handoff 를 결정하는 주체\", \"paging 을 보내는 주체\", \"voice channel 을 할당하는 주체\" 를 물으면 답은 모두 '''MSC'''.{/exam}\n\n== 관련 문서 ==\n* [[base station]] · [[PSTN]] · [[paging]] · [[handoff]] · [[roaming]] · [[통화 발신 과정]] · [[통화 수신 과정]]\n* [[HLR]] (GSM 에서 MSC 가 가입자 위치를 찾는 데이터베이스)"
 },
 "PSTN": {
  "title": "PSTN (Public Switched Telephone Network, 공중 교환 전화망)",
  "category": [
   "1강 셀룰러 동작",
   "용어"
  ],
  "body": "'''PSTN''' 은 전 세계의 기존 '''유선 전화망'''이다 — 바로 [[telephone network]](local loop–end office–trunk–tandem–regional office). 셀룰러망의 [[MSC]] 는 PSTN 에 연결돼 있어서 '''휴대폰과 유선 전화(stationary phone)가 서로 통화'''할 수 있다. L10 p.9–10 그림.\n\n{def}그림 라벨: \"'''Public switched telephone network (PSTN)'''\" — MSC 와 '''Stationary phone''' 사이 (p.9–10).\np.12–13 의 \"'''Telephone central office'''\" 가 PSTN 쪽 입구다.\n공중 교환 전화망. MSC 와 유선 전화기를 잇는 기존 전화망이며, 셀룰러 통화는 central office 를 통해 이 망으로 들어간다.{/def}\n\n[[img:L10-10.png|p.10 MSC 아래 타원 \"Public switched telephone network (PSTN)\" — 왼쪽 Stationary phone 과 연결. 필기 \"wired phone도 wireless에 연결 가능\" (필기본)|medium]]\n\n== 이름에서 개념 끌어내기 ==\n* '''Public''' — 누구나 쓰는 공중망 (사설 내선망이 아님).\n* '''Switched''' — '''회선 교환(circuit switching)''' 망. 통화마다 교환기가 경로를 연결해 통화 동안 유지한다 → [[circuit switching과 packet switching]].\n* '''Telephone Network''' — 원래 음성용.\n\n{info}필기 \"'''wired phone도 wireless에 연결 가능'''\" (p.10) — 그림에서 stationary phone → PSTN → MSC → BS → MS 가 한 줄로 이어진다. 유선 전화로 휴대폰에 걸 수 있는 이유다. 수신(p.13)에서 \"Caller → Telephone central office → MSC\" 로 시작하는 것도 이 경로.{/info}\n\n{analogy}🎭 '''오래된 고속도로망에 새 진입로를 연결.''' 유선 전화망(PSTN)은 이미 전국에 깔린 고속도로다. 셀룰러는 새로 만든 동네 길(cell·BS)이고, MSC 가 그 동네 길을 고속도로에 잇는 IC 다. 덕분에 새 길에서 출발한 차(휴대폰 통화)도 고속도로를 타고 어디든 간다.{/analogy}\n\n== 관련 문서 ==\n* [[telephone network]] · [[MSC]] · [[통화 발신 과정]] · [[통화 수신 과정]] · [[cellular telephony]]"
 },
 "frequency reuse": {
  "title": "Frequency Reuse (주파수 재사용)",
  "category": [
   "1강 셀룰러 동작",
   "용어"
  ],
  "body": "'''Frequency reuse''' 는 셀룰러의 첫 번째 운영 원칙이다: '''이웃한 cell 은 같은 frequency set 을 쓰면 안 되고''', 충분히 떨어진 cell 끼리는 같은 set 을 '''다시 쓴다'''. N 개 cell 이 한 패턴(frequency reuse pattern)을 이루고, 그 N 이 '''[[reuse factor]]''' 다. L10 p.11 \"Operation: Frequency Reuse Principle\".\n\n{def}\"'''Neighboring cells cannot use the same set of frequencies''' for communication — '''Interference''' for the users located near the cell boundaries. A '''frequency reuse pattern''' is a configuration of N cells. '''N is the reuse factor'''.\" (p.11)\n이웃 cell 은 같은 주파수 set 을 쓸 수 없다 — cell 경계 근처 사용자에게 간섭이 생기기 때문. frequency reuse pattern 은 N 개 cell 의 배치이고, N 을 reuse factor 라 한다.{/def}\n\n[[img:L10-11.png|p.11 (a) Reuse factor of 4 — cell 1·2·3·4 가 한 패턴으로 반복 (b) Reuse factor of 7 — 가운데 1, 둘레 2–7. 필기 \"각 숫자가 frequency 하나\", 붙은 두 '1' 에 ✗ \"??\" (필기본)|large]]\n\n== 이름에서 개념 끌어내기 ==\n* '''frequency''' — 셀룰러 사업자가 쓸 수 있는 주파수 대역은 '''한정'''돼 있다(면허 대역, 예: AMPS 25 MHz → [[AMPS 대역과 채널]]).\n* '''reuse''' — 그 한정된 대역을 '''여러 번 다시 쓴다'''. 어디서? 서로 간섭하지 않을 만큼 '''멀리 떨어진 cell''' 에서.\n* 왜 필요한가: 재사용 없이 지역 전체에 채널을 한 번씩만 주면 동시 통화 수 = 채널 수 로 끝난다. cell 로 쪼개고 재사용하면 패턴이 반복될 때마다 같은 채널을 또 쓰니 '''수용 인원이 cell 수에 비례해 늘어난다'''. 이것이 \"'''cell'''ular\" 로 쪼개는 진짜 이유다.\n\n<pre class=\"ascii\">\n  N = 4 패턴 (p.11 a)              N = 7 패턴 (p.11 b)\n     ⬡2                                ⬡2\n  ⬡4    ⬡3                          ⬡7    ⬡3\n     ⬡1                                ⬡1\n  (이 4개 묶음이 반복)             ⬡6    ⬡4\n                                       ⬡5\n  같은 숫자 = 같은 frequency set. 같은 숫자 cell 은 '''절대 이웃하지 않는다'''\n<\/pre>\n\n{tip}'''필기 속 질문: \"각 숫자가 frequency 하나\" / 붙어 있는 두 '1' 육각형 ✗ \"??\"''' (p.11)\n① 숫자는 주파수 '''한 개'''가 아니라 '''frequency set 하나'''(여러 채널의 묶음, 즉 한 대역)다. 슬라이드도 \"the same '''set''' of frequencies\" 라고 쓰고, 교수도 \"the number represents a '''frequency band''' — you can think of this one as f1, f4, f3, f2\"(10/20 녹음 11:37)라고 했다(슬라이드 위 필기 f1–f4 의 출처). cell 1 에 배정된 set 안의 채널들을 cell 1 의 사용자들이 나눠 쓴다(1G 는 [[FDMA]], 2G 는 그 위에 [[TDMA]]).\n② 같은 번호 cell 두 개가 '''붙어 있으면 안 되는 것이 맞다(✗)'''. 두 cell 경계에 선 사용자는 두 BS 가 보내는 '''같은 주파수 신호를 동시에''' 받으니 둘이 섞여 구분할 수 없다 — 슬라이드의 \"Interference for the users located near the cell boundaries\", 교수: \"some '''edge devices on the border of cell''' could suffer from interferences from '''two base stations'''. It's very difficult to handle\"(녹음 12:15). 그래서 패턴은 같은 번호 사이에 반드시 다른 번호 cell 들을 끼워 넣어 거리를 벌린다. 그래도 멀리 있는 같은 번호 cell 에서 약하게 새어 오는 간섭이 남는데, 이것이 [[co-channel interference]] 다.{/tip}\n\n[[anim:frequency_reuse_hex|이웃 cell 이 같은 주파수면 경계에 빨간 ✗ → N=4 색칠 → N=7 색칠 → 마지막 IS-95(N=1, 코드로 구분)까지 보고, 같은 색 cell 사이 거리를 비교하라]]\n\n[[sim:reuse_pattern]]\n\n{analogy}🎭 '''학교 방송실 주파수 나눠 쓰기.''' 붙어 있는 교실 두 곳이 같은 무선 마이크 주파수를 쓰면 벽 근처에 앉은 학생은 두 선생님 목소리가 섞여 들린다. 그래서 옆 교실끼리는 다른 주파수, 복도 끝 멀리 떨어진 교실은 같은 주파수를 다시 쓴다. 마이크 주파수가 4 개뿐이어도 학교 전체 교실 수만큼 수업이 가능하다.{/analogy}\n\n{info}'''예고 — IS-95(CDMA)는 N = 1.''' CDMA 는 사용자를 주파수가 아니라 '''코드'''로 구분하므로 모든 cell 이 같은 대역을 쓴다 → [[IS-95 frequency reuse]] · [[CDMA]].{/info}\n\n{exam}🎯 교수(10/20): \"It looks complicated because it has some weird name, but '''it is very simple''' … just to avoid interference between neighbors.\" 정의 두 문장을 그대로: \"Neighboring cells '''cannot''' use the same set of frequencies (→ '''interference''' near the cell boundaries)\", \"A frequency reuse pattern is a configuration of N cells. '''N is the reuse factor'''.\" 그림 a = '''4''', b = '''7'''.{/exam}\n\n{quiz}Frequency reuse 원칙에서 이웃 cell 이 같은 frequency set 을 쓰면 안 되는 이유는? 그림 (b) 의 reuse factor 는?{/quiz}\n{answer}cell '''경계 근처 사용자'''가 두 BS 의 같은 주파수 신호를 동시에 받아 '''interference''' 가 생기기 때문(p.11). (b) 는 7 개 cell 이 한 패턴이므로 '''N = 7'''.{/answer}\n\n== 관련 문서 ==\n* [[reuse factor]] · [[co-channel interference]] · [[IS-95 frequency reuse]] · [[cell]] · [[CDMA]]\n* [[FDMA]] · [[mid:channelization]] · [[mid:FDM]]"
 },
 "reuse factor": {
  "title": "Reuse Factor (N, 재사용 계수)",
  "category": [
   "1강 셀룰러 동작",
   "용어"
  ],
  "body": "'''Reuse factor N''' 은 [[frequency reuse]] 패턴 하나를 이루는 cell 의 개수다. 전체 채널을 N 개 frequency set 으로 나눠 패턴 안의 cell 마다 하나씩 주고, 이 패턴을 지역 전체에 반복한다. 슬라이드 그림은 '''N = 4''' 와 '''N = 7''' (L10 p.11). 1G AMPS 는 7, IS-95 는 1.\n\n{def}\"A frequency reuse pattern is a configuration of '''N cells'''. '''N is the reuse factor'''.\" (p.11)\nfrequency reuse 패턴은 N 개 cell 의 배치이며, N 을 reuse factor 라 한다.{/def}\n\n[[img:L10-11.png|p.11 a. Reuse factor of 4, b. Reuse factor of 7 — 필기 \"N=4\", \"N=7\" (필기본)|medium]]\n\n== 이름에서 개념 끌어내기 ==\n* '''reuse factor''' = \"몇 cell 마다 같은 주파수가 '''다시''' 나오나\". N = 7 이면 7 개 cell 을 지나야 같은 set 이 또 나온다.\n* 그래서 N 은 '''주파수를 몇 조각으로 나누나'''와 같다: 전체 채널 수를 $C$ 라 하면 cell 하나가 쓰는 채널은\n$$\\text{cell 당 채널 수} = \\frac{C}{N}$$\n\n== N 의 trade-off ⭐⭐ ==\n{|\n! || N 작다 (예: 4) || N 크다 (예: 7)\n|-\n| cell 당 채널 수 $C/N$ || '''많다''' → 수용 인원↑ || 적다\n|-\n| 같은 set cell 사이 거리 || 가깝다 || '''멀다'''\n|-\n| [[co-channel interference]] || 크다 || '''작다'''\n|}\n* N 을 키우면 간섭은 줄지만 채널이 잘게 쪼개져 cell 당 사용자가 준다. 이 균형점을 고르는 것이 셀 설계다. (Forouzan 보충: 1G [[AMPS]] 는 N = 7, CDMA 인 [[IS-95]] 는 N = 1 — 코드로 구분하니 쪼갤 필요가 없다 → [[IS-95 frequency reuse]].)\n\n예 — AMPS voice channel 395 개(→ [[AMPS 대역과 채널]])를 나누면:\n<pre class=\"txt\">\nN = 7 : 395 / 7 = 56.4  → cell 당 약 56 voice channel\nN = 4 : 395 / 4 = 98.75 → cell 당 약 98 voice channel\nN = 1 : 395 / 1 = 395   → (FDMA 로는 불가능 — 이웃 cell 이 같은 주파수. CDMA 라야 가능)\n※ 395/7 ≈ 56 은 슬라이드에 없는 파생값(설명용)\n<\/pre>\n[[sim:reuse_pattern]]\n\n대역 → 채널 수 계산 자체(25 MHz ÷ 30 kHz = 832 …)는 [[AMPS 대역과 채널]] 의 `band_channels` 시뮬레이터에서 단계별로 볼 수 있다.\n\n{analogy}🎭 '''색연필 N 자루로 벌집 칠하기.''' 이웃한 칸은 같은 색이면 안 된다. 색연필이 4 자루면(N=4) 같은 색이 꽤 가까이 다시 나오고, 7 자루면(N=7) 훨씬 멀리서 나온다. 대신 색연필 한 자루(=frequency set)가 맡는 채널 수는 전체를 7 로 나눈 만큼으로 줄어든다.{/analogy}\n\n{quiz}전체 voice channel 이 395 개이고 reuse factor 가 7 이면 cell 하나가 쓸 수 있는 voice channel 은 대략 몇 개인가? N 을 4 로 줄이면 무엇이 좋아지고 무엇이 나빠지는가?{/quiz}\n{answer}$395/7 \\approx 56$ 개. N=4 로 줄이면 cell 당 채널이 약 98 개로 '''늘어나지만''', 같은 frequency set 을 쓰는 cell 사이 거리가 가까워져 '''co-channel interference 가 커진다'''.{/answer}\n\n== 관련 문서 ==\n* [[frequency reuse]] · [[co-channel interference]] · [[IS-95 frequency reuse]] · [[AMPS 대역과 채널]] · [[cell]]"
 },
 "co-channel interference": {
  "title": "Co-channel Interference (동일 채널 간섭)",
  "category": [
   "1강 셀룰러 동작",
   "용어"
  ],
  "body": "'''Co-channel interference''' 는 '''같은 frequency set(같은 채널)을 쓰는 서로 다른 cell''' 의 신호가 서로에게 섞여 드는 간섭이다. [[frequency reuse]] 를 하는 한 피할 수 없고, [[reuse factor]] N 을 키워 같은 set cell 사이 거리를 벌려 줄인다. 슬라이드(p.11)는 이 용어 대신 \"'''Interference''' for the users located near the cell boundaries\" 라고만 썼다 — 용어는 '''(교재 표준 용어 보충)'''.\n\n{def}\"Neighboring cells cannot use the same set of frequencies for communication — '''Interference''' for the users located near the cell boundaries.\" (p.11)\n같은 주파수 set 을 쓰는 cell 들 사이의 간섭. 이웃 cell 이 같은 set 을 쓰면 경계 사용자에게 심하고, 떨어뜨려 놓아도 약하게 남는다.{/def}\n\n[[img:L10-11.png|p.11 — 같은 번호(같은 frequency set) cell 사이의 거리가 co-channel interference 의 크기를 정한다. 필기: 붙은 두 '1' cell 에 ✗ (필기본)|medium]]\n\n== 이름에서 개념 끌어내기 ==\n* '''co-''' = 함께, 같은. '''co-channel''' = '''같은 채널'''을 쓰는 (cell 들). → \"같은 채널끼리의 간섭\".\n* 반대말 격: '''adjacent-channel interference'''(인접 채널 간섭) — 주파수가 바로 옆인 채널끼리 새는 간섭. [[mid:guard band]] 로 막는다. co-channel 은 '''주파수가 똑같아서''' guard band 로는 못 막고 '''거리'''로만 막는다.\n\n<pre class=\"ascii\">\n   cell 1 (BS_a)        cell 2,3,…         cell 1 (BS_b)\n     ))) f1            (다른 set)            f1 (((\n          ↘                                ↙  약하게 새어 옴\n            MS ← 자기 BS_a 의 f1 + 먼 BS_b 의 f1 = co-channel interference\n   거리 D 가 클수록(= N 이 클수록) 새어 오는 신호가 약해진다\n<\/pre>\n\n{|\n! 상황 || 간섭\n|-\n| 이웃 cell 이 같은 set (✗, p.11 필기) || 경계 사용자에게 '''심각''' — 통신 불가 수준\n|-\n| N = 4 패턴 || 같은 set cell 이 비교적 가까움 → 약간\n|-\n| N = 7 패턴 || 더 멀다 → 더 작음\n|-\n| N = 1 (IS-95 CDMA) || 모든 cell 이 같은 대역 — 대신 '''코드'''로 분리, 다른 사용자 신호는 잡음처럼 보임 → [[IS-95 frequency reuse]]\n|}\n\n{analogy}🎭 '''같은 노래를 트는 두 매장.''' 바로 옆 매장이 같은 라디오 채널을 크게 틀면 경계에 선 손님은 두 소리가 섞여 엉망이다. 몇 블록 떨어진 매장이면 아주 희미하게만 들린다. 소리를 막는 벽(guard band)은 다른 채널 소리엔 효과가 있지만, '''같은 채널'''은 거리만이 답이다.{/analogy}\n\n[[sim:reuse_pattern]]\n\n== 관련 문서 ==\n* [[frequency reuse]] · [[reuse factor]] · [[IS-95 frequency reuse]] · [[CDMA]] · [[mid:guard band]]"
 },
 "통화 발신 과정": {
  "title": "통화 발신 과정 (Transmitting — making a call, ①–⑦)",
  "category": [
   "1강 셀룰러 동작",
   "용어"
  ],
  "body": "'''통화 발신 과정''' 은 내 휴대폰(MS)이 전화를 '''걸 때''' 셀룰러망에서 일어나는 7 단계다. L10 p.12 \"Operation: Transmitting (making a call)\". 번호가 MS → BS → MSC → telephone central office → 상대로 가고, 결과가 MSC 로 돌아오면 MSC 가 '''unused voice channel''' 을 할당해 통화가 시작된다.\n\n{def}\"① MS '''scans the band''' and sends the number on the '''strongest setup channel''' ② BS '''relays''' the number to the MSC ③ MSC '''forwards''' it to the telephone central office ④ Central office connects the called party ('''if available''') ⑤ Result is relayed back to the MSC ⑥ MSC assigns an '''unused voice channel'''; MS '''retunes''' ⑦ Communication begins\" (p.12){/def}\n\n[[img:L10-12.png|p.12 Transmitting — MS →① BS →② MSC →③ Telephone central office →④ Called party, ⑤ 점선으로 MSC 에 결과, ⑥ MSC → MS, ⑦ Voice channel(초록). 필기 \"closest base station\", \"스마트폰\", \"통신을 위해 BS, MSC, central office 등 infrastructure 필요\", \"순서대로 살펴보기\" (필기본)|large]]\n\n== 단계별 풀이 ⭐⭐⭐ ==\n<pre class=\"txt\">\n단계  누가 → 누구        무엇을                                   핵심어\n ①   MS  → BS          대역 scan, 번호를 strongest setup channel 로  '''strongest setup channel''' (≈ closest BS)\n ②   BS  → MSC         번호 relay                                 BS 는 중계만\n ③   MSC → central off. 번호 forward                               유선 전화망([[PSTN]])으로 진입\n ④   central → 상대     상대 연결 (if available)                    상대가 통화 중이면 실패\n ⑤   central → MSC     결과 회신                                  (그림의 점선 화살표)\n ⑥   MSC → MS          '''unused voice channel''' 할당, MS retunes   setup channel → voice channel 로 주파수 변경\n ⑦   MS ↔ 상대          Communication begins                       초록 voice channel\n<\/pre>\n\n== 용어 끌어내기 ==\n* '''setup channel''' vs '''voice channel''' — 채널이 두 종류다. setup(=control) channel 은 '''통화를 연결하기 위한 신호용'''(번호 전달), voice channel 은 '''실제 통화'''용. 처음에는 모두가 공유하는 setup channel 로 요청하고, 연결되면 나만의 voice channel 을 받는다. (2G 이후 [[AMPS control channel]] 같은 이름으로 다시 나온다.)\n* '''strongest''' — MS 는 대역을 훑어(scan) 신호가 '''가장 센''' setup channel 을 고른다. 보통 '''가장 가까운 BS''' 의 것(필기 \"closest base station\"). 교수: \"sends the phone number to our closest base station. '''This is very important, closest one.''' In other words, … the strongest channel, which is mostly the closest one\"(10/20 녹음 15:53–16:28).\n* '''unused''' — 이미 다른 통화가 쓰는 채널은 줄 수 없다. 이 cell 에 배정된 frequency set([[frequency reuse]]) 중 비어 있는 것.\n* '''retunes''' — 라디오 다이얼을 돌리듯 MS 가 할당받은 voice channel 주파수로 '''다시 맞춘다'''. 교수: \"MSC assigns a channel, a voice channel, '''or it can be data channel''' in current cellular systems, and the mobile station tunes or switches its frequency band to the assigned one\"(녹음 18:07).\n\n[[anim:call_transmit|번호가 ①→②→③→④ 로 가고 ⑤ 결과가 돌아와 ⑥ voice channel 이 할당되는 순서를 따라가며, 각 화살표 번호를 슬라이드 문장과 짝지어라]]\n\n[[sim:call_flow]]\n\n{info}필기 \"'''통신을 위해 BS, MSC, central office 등 infrastructure 필요'''\" (p.12) — 내 폰은 상대 폰과 직접 통신하지 않는다. 무선 구간은 MS ↔ BS 한 hop 뿐이고, 나머지는 모두 통신사가 깔아 둔 유선 infrastructure 다. 교수(녹음 19:00): \"this connection is '''heavily dependent on the infrastructure''' … Without that, those services are almost impossible.\"{/info}\n\n{analogy}🎭 '''식당 예약 전화.''' ① 가장 잘 들리는 대표번호(strongest setup channel)로 전화해 \"○○ 테이블 부탁해요\" ② 접수원(BS)이 매니저(MSC)에게 전달 ③ 매니저가 본점(central office)에 연락 ④ 본점이 해당 테이블 확인(비어 있으면) ⑤ 결과를 매니저에게 회신 ⑥ 매니저가 \"7번 방으로 오세요\"(unused voice channel) — 손님은 그 방으로 이동(retune) ⑦ 식사 시작.{/analogy}\n\n{exam}🎯 발신과 수신의 차이를 묻는 문제가 가장 유력하다: 발신은 MS 가 '''스스로''' strongest setup channel 의 BS 에 접속하므로 위치를 찾을 필요가 없고, 수신은 MSC 가 MS 위치를 몰라 '''paging''' 이 필요하다 → [[통화 수신 과정]]. 공통점: 마지막에 '''MSC 가 voice channel 을 할당'''(⑥).{/exam}\n\n{quiz}발신 과정 ①에서 MS 가 번호를 보내는 채널은? ⑥에서 MSC 가 하는 일은?{/quiz}\n{answer}① 대역을 scan 해 찾은 '''strongest setup channel'''(보통 가장 가까운 BS). ⑥ MSC 가 '''unused voice channel''' 을 할당하고 MS 는 그 채널로 retune 한다(p.12).{/answer}\n\n== 관련 문서 ==\n* [[통화 수신 과정]] · [[paging]] · [[MSC]] · [[base station]] · [[PSTN]] · [[CH05 셀룰러 동작]]"
 },
 "통화 수신 과정": {
  "title": "통화 수신 과정 (Receiving, ①–⑦)",
  "category": [
   "1강 셀룰러 동작",
   "용어"
  ],
  "body": "'''통화 수신 과정''' 은 누군가 내 휴대폰(MS)으로 전화를 '''걸어올 때''' 의 7 단계다. L10 p.13 \"Operation: Receiving\". 발신과 결정적으로 다른 점은 ② '''[[paging]]''' — MSC 는 MS 가 어느 cell 에 있는지 모르므로 '''모든 cell''' 에 query 를 보내 찾는다.\n\n{def}\"① Central office sends the called number to the MSC ② MSC sends '''query signals to every cell''' ('''paging''') ③ MS responds; '''its location is found''' ④ MSC transmits a '''ringing signal''' ⑤ MS answers ⑥ MSC assigns a voice channel ⑦ Communication begins\" (p.13){/def}\n\n[[img:L10-13.png|p.13 Receiving — Caller → Telephone central office →① MSC →② Paging(빨간 점선, 세 cell 의 BS 모두로) ; MS ↔ MSC 사이 화살표 ③⑤(MS→MSC) / ④⑥(MSC→MS), ⑦ Voice channel. 필기 \"위의 5~6번 과정이랑 다른 거임?\" (필기본)|large]]\n\n== 단계별 풀이 ⭐⭐⭐ ==\n<pre class=\"txt\">\n단계  누가 → 누구           무엇을                          방향(그림)\n ①   central off. → MSC    called number 전달              ←\n ②   MSC → '''모든 cell'''    query signal = '''[[paging]]'''    빨간 점선 (전부)\n ③   MS → MSC              응답 → '''위치(cell) 확인'''        MS → MSC   ┐ 그림의 \"③ ⑤\"\n ④   MSC → MS              '''ringing signal''' (벨 울림)      MSC → MS   ┐ 그림의 \"④ ⑥\"\n ⑤   MS → MSC              사용자가 받음 (answers)          MS → MSC   ┘\n ⑥   MSC → MS              voice channel 할당               MSC → MS   ┘\n ⑦   MS ↔ caller           Communication begins            초록 voice channel\n<\/pre>\n\n{tip}'''필기 속 질문: \"위의 5~6번 과정이랑 다른 거임?\"''' (p.13)\n두 가지로 읽을 수 있어 둘 다 답한다.\n'''(1) 그림의 \"③ ⑤\" / \"④ ⑥\" 화살표가 무슨 뜻이냐''' — 화살표 두 개를 '''네 단계가 같이 쓰는''' 것이다. MS → MSC 방향 화살표 하나에 ③(paging 응답)과 ⑤(전화 받음)를, MSC → MS 방향 화살표 하나에 ④(ringing)와 ⑥(voice channel 할당)을 적었다. 단계는 ③④⑤⑥ 각각 다른 메시지다: ③ \"저 여기 있어요\"(위치) → ④ \"띠리링\"(벨) → ⑤ \"여보세요\"(사용자가 받음) → ⑥ \"이 채널로 통화하세요\".\n'''(2) 발신(p.12)의 ⑤⑥ 과 같은 거냐''' — '''⑥ 은 같고 ⑤ 는 다르다.'''\n{|\n! 단계 || 발신 (p.12) || 수신 (p.13) || 같은가\n|-\n| ⑤ || Result is relayed back to the MSC (central office → MSC: 상대 연결 결과) || MS answers (MS → MSC: 사용자가 전화를 받음) || '''다름''' — 보내는 쪽도 내용도 다름\n|-\n| ⑥ || MSC assigns an unused voice channel; MS retunes || MSC assigns a voice channel || '''같음''' — 둘 다 MSC 가 voice channel 할당\n|}\n즉 두 과정 모두 \"'''상대가 받을 수 있는지 확인(⑤) → MSC 가 voice channel 할당(⑥) → 통화(⑦)'''\" 로 끝나는 모양은 같지만, 발신에서 \"확인\"은 상대 쪽 central office 가 알려 주고, 수신에서는 내 MS 가 직접 답한다.{/tip}\n\n{exam}🎯 교수(10/20 녹음 21:39–23:52): \"MSC sends query signals to every cell '''because at this moment, MSC is not aware of where the corresponding receiver is located'''.\" ringing 은 \"'''a control signal''' to make a connection\". 그리고 \"'''Without this infrastructure, you cannot make even a single phone call.'''\" — 셀룰러에서는 device-to-device 로 직접 통신하지 않는다.{/exam}\n\n== 발신 vs 수신 ==\n{|\n! || [[통화 발신 과정|발신 (p.12)]] || 수신 (p.13)\n|-\n| 시작점 || MS (내가 검) || central office (상대가 검)\n|-\n| MS 위치 || MS 가 strongest setup channel 의 BS 를 '''스스로''' 고름 || MSC 가 '''모름''' → ② '''paging''' 으로 모든 cell 에 질의, ③ 응답으로 확인\n|-\n| 상대 확인 || ④ central office 가 상대 연결 → ⑤ 결과가 MSC 로 || ④ ringing → ⑤ MS answers\n|-\n| 채널 || ⑥ MSC 가 unused voice channel 할당, MS retunes || ⑥ MSC 가 voice channel 할당\n|}\n\n[[anim:call_receive|① 다음 paging 파동이 모든 cell 로 퍼지고, ③ 응답으로 위치가 잡힌 뒤 ④ ringing → ⑤ answer → ⑥ voice channel 이 오가는 순서를 보라. \"발신과 달리 MS 위치를 모르니 paging 이 필요\" 를 확인]]\n\n[[sim:call_flow]]\n\n{analogy}🎭 '''백화점 미아 찾기 방송.''' 안내데스크(MSC)는 엄마(caller)의 연락을 받았지만(①) 아이(MS)가 몇 층에 있는지 모른다. 그래서 '''전 층에''' 방송한다(② paging). 아이가 \"저 여기요!\"(③) → 직원이 \"엄마가 찾으셔\"(④ ringing) → 아이가 \"네\"(⑤) → \"3번 데스크로 가렴\"(⑥ voice channel) → 상봉(⑦).{/analogy}\n\n{quiz}수신 과정에 있고 발신 과정에는 없는 단계는? 왜 필요한가?{/quiz}\n{answer}② '''paging''' — MSC 가 '''모든 cell''' 에 query signal 을 보낸다. 수신 시점에 MSC 는 MS 가 어느 cell 에 있는지 '''모르기''' 때문에, 모든 cell 에 물어 ③ MS 의 응답으로 위치를 찾는다(p.13). 발신은 MS 가 스스로 BS 에 접속하므로 필요 없다.{/answer}\n\n== 관련 문서 ==\n* [[paging]] · [[통화 발신 과정]] · [[MSC]] · [[mobile station]] · [[CH05 셀룰러 동작]]"
 },
 "paging": {
  "title": "Paging (페이징 — 모든 cell 에 묻기)",
  "category": [
   "1강 셀룰러 동작",
   "용어"
  ],
  "body": "'''Paging''' 은 [[통화 수신 과정]] ② 단계에서 '''MSC 가 모든 cell 에 query signal 을 보내''' 착신 MS 를 찾는 것이다. 수신 시점에 MSC 는 MS 가 어느 cell 에 있는지 모르기 때문에 필요하다. MS 가 응답하면(③) 위치가 확인된다. L10 p.13.\n\n{def}\"② MSC sends '''query signals to every cell''' ('''paging''') ③ MS responds; its location is found\" (p.13)\nMSC 가 모든 cell 에 질의 신호를 보내는 것을 paging 이라 한다. MS 가 응답하면 위치를 알게 된다.{/def}\n\n[[img:L10-13.png|p.13 — 빨간 상자 \"Paging\" 과 MSC 에서 세 cell 의 BS 모두로 뻗는 빨간 점선 ② (필기본)|medium]]\n\n== 이름에서 개념 끌어내기 ==\n* '''page''' (동사) = (방송·호출기로) '''사람을 불러 찾다'''. 호텔·공항에서 \"○○○ 님, 안내데스크로 와 주십시오\" 방송이 paging, 옛날 '''삐삐'''의 영어 이름이 pager 다.\n* 교수의 비유(10/20 녹음 22:09): \"This is often called paging. Think about when you are trying to find something in your book, you keep '''forwarding your book pages'''.\" 책의 '''page''' 를 한 장씩 넘기며 찾듯, MSC 가 '''모든 cell 을 훑어''' MS 를 찾는다.\n* 핵심은 '''\"모른다\"''' — 위치를 알면 그 cell 에만 보내면 된다. 모르니까 '''전부(every cell)'''에 보낸다.\n\n<pre class=\"ascii\">\n                ┌─ BS(cell A) ··· \"MS#1234 있나요?\"   (응답 없음)\n   MSC ─paging─┼─ BS(cell B) ··· \"MS#1234 있나요?\"   ← MS: \"여기요!\" ③ → 위치 = cell B\n                └─ BS(cell C) ··· \"MS#1234 있나요?\"   (응답 없음)\n   이후 ④ ringing · ⑥ voice channel 은 cell B 로만\n<\/pre>\n\n[[anim:call_receive|MSC 에서 paging 파동이 모든 cell 로 동시에 퍼지고, 한 cell 의 MS 만 응답하는 장면을 보라]]\n\n[[sim:call_flow]]\n\n{analogy}🎭 '''학교 전체 방송.''' 교무실(MSC)에 학부모 전화가 왔는데 학생이 어느 교실에 있는지 모른다. 그래서 전교 방송으로 \"3학년 장민준 학생, 교무실 전화 받으세요\" (paging). 학생이 \"저 3반에 있어요\" 하고 응답하면 그다음부터는 3반으로만 연락한다.{/analogy}\n\n{info}(Forouzan 보충 — 슬라이드에 없음) 실제 시스템은 매번 전국 모든 cell 을 부르면 낭비가 크므로, MS 가 대략 어느 '''구역(location area)''' 에 있는지 미리 등록해 두고 그 구역의 cell 들에만 paging 한다. GSM 에서는 가입자 정보·위치를 '''[[HLR]]''' 같은 데이터베이스에 둔다. 슬라이드 수준에서는 \"every cell\" 로 외우면 된다.{/info}\n\n{exam}🎯 \"수신에만 있는 단계는?\" → '''paging'''. 이유: \"MSC 는 MS 의 위치를 모른다 → 모든 cell 에 query\" (p.13 ②). paging 을 보내는 주체는 '''MSC'''(BS 가 아님 — BS 는 자기 cell 에 전달만).{/exam}\n\n== 관련 문서 ==\n* [[통화 수신 과정]] · [[통화 발신 과정]] · [[MSC]] · [[cell]] · [[HLR]]"
 },
 "handoff": {
  "title": "Handoff (핸드오프 = handover)",
  "category": [
   "1강 셀룰러 동작",
   "용어"
  ],
  "body": "'''Handoff''' 는 사용자가 cell 경계를 넘어 움직일 때, 진행 중인 통화(active call)를 '''한 BS 에서 다른 BS 로 서비스 중단 없이 넘기는''' 과정이다. 이를 위해 '''MSC 가 every few seconds 신호 세기를 감시'''하다가 약해지면 더 나은 cell 을 찾아 통화 채널을 바꾼다. 종류는 [[hard handoff]] 와 [[soft handoff]]. L10 p.14–16.\n\n{def}\"Definition: Process of '''transferring an active call from one BS to another''' '''without interrupting service''' as a user moves across cells.\" (p.14)\n\"To this end: '''MSC monitors the level of the signal every few seconds'''. If the strength of the signal diminishes: The MSC '''seeks a new cell''' that can better accommodate the communication. Then it '''changes the channel carrying the call'''.\" (p.15)\n사용자가 cell 을 넘어갈 때 진행 중인 통화를 서비스 중단 없이 한 BS 에서 다른 BS 로 넘기는 과정. MSC 가 몇 초마다 신호 세기를 감시하다 약해지면 새 cell 을 찾아 통화 채널을 바꾼다.{/def}\n\n[[img:L10-15.png|p.15 Handoff — 밑줄 \"MSC monitors the level of the signal every few seconds\", 신호가 약해지면 MSC 가 새 cell 을 찾고 채널을 바꾼다 (필기본)|medium]]\n\n== 이름에서 개념 끌어내기 ==\n* '''hand off''' = (럭비·미식축구에서 공을) '''손에서 손으로 넘겨주다'''. 통화(공)를 BS1 의 손에서 BS2 의 손으로 넘긴다. 공을 떨어뜨리면(통화 끊김) 실패.\n* 정의의 세 조건: ① '''active call''' — 통화 '''중'''일 때의 이야기(대기 중 이동은 handoff 가 아님) ② '''from one BS to another''' — 같은 통신사 안 BS 사이(통신사가 바뀌면 [[roaming]]) ③ '''without interrupting service''' — 사용자는 몰라야 한다.\n\n{tip}'''필기 속 질문: \"Hand over (동일 개념)\"''' (p.14) — '''같은 개념이 맞다.''' 교수(10/20 녹음 26:17): \"in Korea it is also called '''hand-over'''. '''It is interchangeable''', hand-over or hand-off, but I prefer hand-off because it is easy to pronounce.\" '''handoff''' 는 북미식 용어(AMPS·IS-95, Forouzan 교재), '''handover''' 는 유럽·3GPP 식 용어(GSM·UMTS·LTE·5G 표준 문서)다. 시험 답안에는 슬라이드 용어인 handoff 를 쓰되, 5G 자료에서 handover 를 보면 같은 것으로 읽으면 된다.{/tip}\n\n== 누가, 언제, 무엇을 (p.15) ⭐⭐⭐ ==\n<pre class=\"txt\">\n누가   : '''MSC'''  (BS 도 MS 도 아님) — \"every transition decision is made by MSC, not by MS\" (녹음 33:09)\n언제   : '''every few seconds''' 신호 레벨을 감시하다가 → 신호 세기가 '''diminishes''' 하면\n무엇을 : ① 통화를 더 잘 수용할 '''새 cell 을 찾고''' (seeks a new cell)\n         ② 통화를 싣는 '''채널을 바꾼다''' (changes the channel carrying the call)\n         — 새 cell 은 다른 frequency set 을 쓰므로([[frequency reuse]]) 채널이 바뀌어야 한다\n<\/pre>\n\n[[anim:handoff_hard_soft|MS 가 BS1 cell → BS2 cell 로 이동할 때 아래 시간축의 BS1·BS2 연결 막대를 보라 — hard 는 틈, soft 는 겹침]]\n\n[[sim:handoff_signal]]\n\n== 두 종류 (p.16) ==\n{|\n! || [[hard handoff]] || [[soft handoff]]\n|-\n| 정의 || An MS only communicates '''with one BS''' || An MS can communicate '''with two BSs at the same time'''\n|-\n| 순서 || '''Break before make''' (먼저 끊고 붙음) || '''Make before break''' (먼저 붙고 끊음)\n|-\n| 그림 || BS1 막대 끝 → 빨간 틈 → BS2 막대 || BS1·BS2 막대가 초록 구간에서 겹침\n|-\n| 쓰인 곳 || '''Used in early systems''' (1G AMPS 등) || CDMA(2G [[IS-95]]) 이후 → [[IS-95 soft handoff]]\n|}\n\n{tip}'''필기 속 질문: \"SRT, KTX ??\"''' (p.16, 31:00 필기) — 빠른 기차는 cell 을 몇 초~십수 초마다 지나가므로 handoff 가 '''매우 자주''' 일어나고, 한 번이라도 늦거나 실패하면 통화가 끊기거나 데이터가 느려진다. 그래서 KTX·SRT 에서 끊김을 경험하는 것. 교수는 중간고사 범위 10/6 수업([[mid:station mobility]])에서 이미 \"disconnected or slow communication while you are in fast transportation such as '''KTX or SRT'''\" 를 예로 들며, 4G/5G 는 가장 가까운 BS 로 '''seamless''' 하게 바꿔 주는 매우 복잡한 표준(soft handoff)을 갖고 있다고 했다. 10/20 에도 같은 이야기(녹음 31:17): \"slow communication speed while you are in KTX or SRT … the trains are so fast that '''maintaining soft handoff is very difficult technically''' … the coverage of base stations could be limited to some few kilometers, so it happens a lot.\"{/tip}\n\n{exam}🎯 교수(10/20): \"'''Every transition decision is made by mobile switching center, not by mobile station.'''\"(33:09) / \"'''Nowadays, we never use hard handoff.''' In today's advanced communication systems, people always implement soft handoff\"(29:54).{/exam}\n\n{analogy}🎭 '''이어달리기 바통 터치.''' 주자(BS)가 바뀌어도 바통(통화)은 계속 앞으로 가야 한다. 감독(MSC)은 몇 초마다 앞 주자가 지쳤는지(신호 세기) 보고, 지쳤으면 다음 주자를 투입해 바통을 넘기게 한다. 바통을 놓고 나서 다음 주자가 잡으면 hard, 둘이 잠깐 같이 잡고 달리다 넘기면 soft.{/analogy}\n\n{info}WiFi 와 비교: 802.11 도 BSS 사이를 옮겨 다닐 수 있지만(BSS-transition) 통신 연속성을 '''보장하지 않는다'''. 셀룰러는 MSC 가 감시·결정하는 handoff 로 연속성을 지키는 것이 존재 이유다 → [[셀룰러와 WiFi 비교]].{/info}\n\n{quiz}Handoff 의 정의를 쓰고, handoff 를 결정하는 주체와 그 판단 근거를 쓰시오.{/quiz}\n{answer}\"Process of transferring an '''active call''' from one BS to another '''without interrupting service''' as a user moves across cells\"(p.14). 주체는 '''MSC''' — '''every few seconds''' 신호 레벨을 감시해 세기가 약해지면 더 나은 새 cell 을 찾고 통화 채널을 바꾼다(p.15).{/answer}\n\n== 관련 문서 ==\n* [[hard handoff]] · [[soft handoff]] · [[IS-95 soft handoff]] · [[pilot channel]] · [[MSC]] · [[roaming]]\n* [[셀룰러와 WiFi 비교]] · [[mid:station mobility]]"
 },

  "body": "'''Hard handoff''' 는 MS 가 '''한 번에 한 BS 와만''' 통신하는 [[handoff]] 방식이다. 새 BS 로 넘어가려면 옛 BS 와의 연결을 '''먼저 끊고(break)''' 새 BS 와 '''연결한다(make)''' — '''break before make'''. 그 사이 아주 짧은 끊김이 생긴다. 초기 시스템(early systems, 1G AMPS 등)이 썼다. L10 p.16 (a).\n\n{def}\"'''Hard handoff''' — An MS '''only communicates with one BS'''. '''Used in early systems'''.\" (p.16)\n그림 (a) 아래 문구: \"'''Break before make'''\".\nMS 가 하나의 BS 와만 통신하는 handoff. 초기 시스템에서 사용. 옛 연결을 끊은 뒤 새 연결을 맺는다.{/def}\n\n[[img:L10-16.png|p.16 (a) Hard handoff — BS1 막대(노랑)가 끝난 뒤 빨간 틈, 그다음 BS2 막대(초록) \"Break before make\" / (b) Soft handoff 와 비교. 필기 \"SRT, KTX ??\", \"break off connection ??\" (필기본)|large]]\n\n== 이름에서 개념 끌어내기 ==\n* '''hard''' = 딱딱한, 칼같이 '''한 번에 바뀌는'''. 연결 대상이 BS1 → BS2 로 '''뚝''' 끊겨 바뀐다(겹침 없음).\n* '''break before make''' — 전기 스위치 용어. 접점을 '''먼저 떼고(break)''' 다른 접점에 '''붙인다(make)'''. 동시에 두 곳에 붙는 순간이 없다.\n\n<pre class=\"txt\">\n시간 →      t0 ─────────── t1 ░░ t2 ─────────── t3\nBS1 연결 :  ███████████████                         ← t1 에서 끊음 (break)\nBS2 연결 :                     ████████████████     ← t2 에서 붙음 (make)\n                          ↑ t1~t2 : 아무 BS 와도 연결 안 됨 (빨간 틈)\n연결 BS 집합 :  {BS1}  →  {}  →  {BS2}\n<\/pre>\n\n{tip}'''필기 속 질문: \"break off connection ??\"''' (p.16) — \"break before make\" 의 '''break''' 가 바로 \"'''연결을 끊는다(break off the connection)'''\" 는 뜻이다. Hard handoff 는 ① BS1 과의 연결을 끊고 ② 그다음 BS2 와 연결한다. 그 사이(그림의 빨간 틈)는 MS 가 어느 BS 와도 연결되지 않은 짧은 구간이다. 교수(10/20 녹음 28:14): \"if this mobile station moves from BS1 to BS2, then it firstly '''experiences a break of communication''' … because MS can only communicate with one base station … it is '''inevitable''' … this is not that great.\"\n\"그럼 정의의 '''without interrupting service''' 와 모순 아닌가?\" — 틈이 수십~수백 ms 수준으로 짧아 '''통화는 유지'''된다(살짝 끊기는 소리 정도). 다만 새 BS 에 빈 채널이 없거나 신호가 너무 약해 make 에 실패하면 그대로 '''통화가 끊긴다(call drop)''' — KTX·SRT 처럼 handoff 가 잦을수록 이 위험이 커진다. 이 약점을 없앤 것이 [[soft handoff]].{/tip}\n\n{|\n! || hard handoff || [[soft handoff]]\n|-\n| 동시에 통신하는 BS 수 || '''1''' || '''2''' (잠시)\n|-\n| 순서 || '''break before make''' || make before break\n|-\n| 끊김 || 짧은 틈 있음 || 없음\n|-\n| 시스템 || '''early systems''' (1G [[AMPS]], [[FDMA]]/[[TDMA]] 계열) || [[CDMA]] ([[IS-95]] 이후)\n|}\n\n{info}(Forouzan 보충) 왜 초기 시스템은 hard 일 수밖에 없었나: [[FDMA]]/[[TDMA]] 에서는 이웃 cell 이 '''다른 주파수'''를 쓴다([[frequency reuse]]). MS 의 무전기는 한 번에 한 주파수에만 맞출 수 있으므로 BS1 의 주파수를 놓고 BS2 의 주파수로 '''retune''' 해야 한다 → 필연적으로 break before make. CDMA 는 모든 cell 이 같은 주파수라 두 BS 를 동시에 들을 수 있다 → soft.{/info}\n\n[[anim:handoff_hard_soft|위 줄(hard)에서 BS1 막대가 끝나고 빨간 틈 뒤에 BS2 막대가 시작하는 순간을 보라]]\n\n[[sim:handoff_signal]]\n\n{analogy}🎭 '''외나무다리 건너 타기.''' 한쪽 배(BS1)에서 다른 배(BS2)로 옮겨 탈 때, 판자가 하나뿐이라 '''한 발을 떼고 나서야''' 건너편에 발을 디딘다. 그 순간 잠깐 공중에 떠 있다(틈). 건너편 배가 꽉 차 있으면 물에 빠진다(call drop).{/analogy}\n\n{exam}🎯 \"An MS only communicates with '''one BS'''\", \"Used in '''early systems'''\", \"'''Break before make'''\" 세 표현을 짝으로 외운다. T/F 함정: \"hard handoff 는 두 BS 와 동시에 통신한다\" → 거짓(그건 soft). 교수: \"'''nowadays, we never use hard handoff'''\"(녹음 29:54).{/exam}\n\n== 관련 문서 ==\n* [[handoff]] · [[soft handoff]] · [[IS-95 soft handoff]] · [[AMPS]] · [[frequency reuse]]"
 },
 "soft handoff": {
  "title": "Soft Handoff (make before break)",
  "category": [
   "1강 셀룰러 동작",
   "용어"
  ],
  "body": "'''Soft handoff''' 는 MS 가 '''두 BS 와 동시에''' 통신할 수 있는 [[handoff]] 방식이다. 새 BS 와 '''먼저 연결(make)''' 한 뒤 옛 BS 와의 연결을 '''끊는다(break)''' — '''make before break'''. 겹치는 구간 동안 두 BS 가 함께 통화를 지탱하므로 끊김이 없다. CDMA 인 [[IS-95]] 부터 쓰였다 → [[IS-95 soft handoff]]. L10 p.16 (b).\n\n{def}\"'''Soft handoff''' — An MS can communicate '''with two BSs at the same time'''.\" (p.16)\n그림 (b) 아래 문구: \"'''Make before break'''\".\nMS 가 두 BS 와 동시에 통신할 수 있는 handoff. 새 연결을 맺은 뒤 옛 연결을 끊는다.{/def}\n\n[[img:L10-16.png|p.16 (b) Soft handoff — MS 가 BS1·BS2 둘 다와 선으로 연결, 아래 BS1·BS2 막대가 초록 구간에서 겹침 \"Make before break\" (필기본)|large]]\n\n== 이름에서 개념 끌어내기 ==\n* '''soft''' = 부드러운. 연결이 '''뚝 바뀌지 않고 서서히 옮겨 간다''' — BS1 만 → BS1+BS2 → BS2 만.\n* '''make before break''' — 새 접점에 '''먼저 붙이고(make)''' 옛 접점을 '''뗀다(break)'''. 연결이 0 개가 되는 순간이 없다.\n\n<pre class=\"txt\">\n시간 →      t0 ─────────── t1 ▓▓▓▓▓▓ t2 ─────────── t3\nBS1 연결 :  ████████████████████████                  ← t2 에서 끊음 (break)\nBS2 연결 :                 ███████████████████████    ← t1 에서 붙음 (make)\n                          ↑ t1~t2 : '''두 BS 와 동시에''' (초록 겹침)\n연결 BS 집합 :  {BS1}  →  {BS1, BS2}  →  {BS2}\n<\/pre>\n\n{tip}'''필기 속 질문: \"SRT, KTX ??\"''' (p.16) — 시속 300 km 로 달리면 cell 경계를 아주 자주 넘는다. hard handoff 면 넘을 때마다 짧은 틈과 call drop 위험이 생기지만, soft handoff 는 경계 구간에서 '''두 BS 가 동시에''' 통화를 잡고 있다가 넘겨 주므로 끊김이 없다. 교수(10/20 녹음 31:17): \"You may have some experience of slow communication speed while you are in KTX or SRT. This is because the trains are so fast that '''maintaining soft handoff is very difficult technically'''.\" 기지국 coverage 가 몇 km 에 불과해 handoff 가 너무 자주 일어나기 때문. 10/6 수업에서도 \"KTX 나 SRT 에서 끊기거나 느려지는 경험\" 을 들며 4G/5G 는 매우 복잡한 표준으로 seamless 한 soft handoff 를 해낸다고 한 그 이야기다 → [[mid:station mobility]]. 다만 기차처럼 빠르면 soft 로도 완벽하진 않아 여전히 끊김을 느낄 수 있다.{/tip}\n\n{|\n! || [[hard handoff]] || soft handoff\n|-\n| 동시에 통신하는 BS 수 || 1 || '''2'''\n|-\n| 순서 || break before make || '''make before break'''\n|-\n| 끊김 || 짧은 틈 || '''없음'''\n|-\n| 대가 || — || 경계 구간에서 채널(자원)을 두 BS 가 '''동시에''' 씀\n|-\n| 시스템 || early systems || [[CDMA]] — [[IS-95]], 3G\n|}\n\n{info}(Forouzan 보충) 왜 CDMA 라야 soft 가 쉬운가: CDMA([[IS-95 frequency reuse|IS-95 는 N = 1]])는 '''모든 cell 이 같은 주파수'''를 쓰고 사용자를 '''코드'''로 구분한다. 그래서 MS 는 주파수를 바꾸지 않고도 BS1·BS2 의 신호를 동시에 받을 수 있다. IS-95 에서는 MS 가 각 BS 의 '''[[pilot channel]]''' 세기를 재서 handoff 를 돕는다 → [[IS-95 soft handoff]].{/info}\n\n[[anim:handoff_hard_soft|아래 줄(soft)에서 BS1·BS2 막대가 겹치는 초록 구간 — 그동안 MS 가 두 BS 와 동시에 연결돼 있음을 보라]]\n\n[[sim:handoff_signal]]\n\n{analogy}🎭 '''그네에서 그네로 건너가기 (서커스 공중그네).''' 다음 그네(BS2)를 '''먼저 한 손으로 잡고''', 그다음 원래 그네(BS1)를 놓는다. 양손으로 두 그네를 잡은 순간이 있으니 떨어질 일이 없다. hard 는 손을 놓고 날아가서 잡는 방식이다.{/analogy}\n\n{exam}🎯 교수(10/20 녹음 29:54): \"In today's advanced communication systems, people '''always implement soft handoff''' … it is very hard to detect or experience some break of communication.\" \"An MS can communicate with '''two BSs at the same time'''\" + \"'''Make before break'''\". 비교 문제: hard = one BS · early systems · break before make / soft = two BSs · make before break. 3강의 [[IS-95 soft handoff]] 와 연결해서 출제될 수 있다.{/exam}\n\n{quiz}Soft handoff 에서 MS 가 연결된 BS 집합은 시간에 따라 어떻게 변하는가? hard handoff 와 비교하시오.{/quiz}\n{answer}soft: {BS1} → '''{BS1, BS2}''' → {BS2} (make before break, 끊김 없음). hard: {BS1} → '''{}''' → {BS2} (break before make, 짧은 끊김).{/answer}\n\n== 관련 문서 ==\n* [[handoff]] · [[hard handoff]] · [[IS-95 soft handoff]] · [[pilot channel]] · [[CDMA]] · [[IS-95]]"

 "roaming": {
  "title": "Roaming (로밍)",
  "category": [
   "1강 셀룰러 동작",
   "용어"
  ],
  "body": "'''Roaming''' 은 내 통신사(home provider)의 coverage 밖으로 나갔을 때 '''이웃 통신사(neighbor provider)''' 가 '''roaming contract''' 에 따라 대신 서비스해 주는 것이다. 통신사 하나의 coverage 는 한정돼 있으므로, 통신사들끼리 계약으로 서로의 망을 빌려 coverage 를 넓힌다. L10 p.17 \"Operation: Roaming\".\n\n{def}\"A user can have access to communication or can be reached '''where there is coverage'''. A service provider usually has '''limited coverage'''. '''Neighboring service providers''' can provide '''extended coverage''' through a '''roaming contract'''.\" (p.17)\n사용자는 coverage 가 있는 곳에서만 통신하거나 연락받을 수 있다. 통신사 하나의 coverage 는 보통 제한적이다. 이웃 통신사들이 roaming contract 를 통해 확장된 coverage 를 제공할 수 있다.{/def}\n\n[[img:L10-17.png|p.17 Roaming — 왼쪽 Provider A (home) 의 cell 들(노랑, MSC A), 오른쪽 Provider B (neighbor) 의 cell 들(초록, MSC B). \"User moves\" 점선으로 MS 가 B 쪽으로, MSC A ↔ MSC B 사이 빨간 점선 \"Roaming contract\" (필기본)|large]]\n\n== 이름에서 개념 끌어내기 ==\n* '''roam''' = (정처 없이) '''돌아다니다, 배회하다'''. 내 집(home) 밖을 돌아다니는 사용자를 남의 집(neighbor)이 받아 준다.\n* 정의의 두 동사 \"'''have access to communication'''\"(내가 걸 수 있음)과 \"'''can be reached'''\"(남이 나에게 걸 수 있음) — 발신·수신 둘 다 이어진다는 뜻.\n* '''contract''' — 기술이 아니라 '''사업 계약'''이 핵심이다. 그림에서도 연결선은 '''MSC A ↔ MSC B''' 사이(통신사 본부끼리)에 그어져 있다.\n\n== handoff 와 roaming 구분 ⭐⭐ ==\n{|\n! || [[handoff]] || roaming\n|-\n| 무엇을 넘나 || cell → cell (BS → BS) || '''provider → provider''' (통신사 → 통신사)\n|-\n| 같은 통신사? || 같은 통신사(같은 MSC 아래, p.16 그림) || '''다른''' 통신사 (MSC A ≠ MSC B)\n|-\n| 근거 || MSC 가 신호 세기 감시 (기술) || '''roaming contract''' (계약)\n|-\n| 예 || 통화하며 동네를 걸어감 || 해외 여행에서 현지 통신사 망 사용\n|}\n\n[[anim:roaming_anim|MS 가 Provider A(home) cell 들을 벗어나 Provider B(neighbor) cell 로 들어가는 순간, MSC A ↔ MSC B 의 roaming contract 선이 켜지며 서비스가 이어지는 것을 보라]]\n\n{analogy}🎭 '''도서관 상호대차 협약.''' 우리 학교 도서관 회원증(home provider)은 우리 학교에서만 통한다(limited coverage). 그런데 옆 대학 도서관과 협약(roaming contract)을 맺어 두면, 옆 대학에 가서도 같은 회원증으로 책을 빌릴 수 있다(extended coverage). 대출 기록은 두 도서관 본부(MSC A·B)가 서로 주고받는다.{/analogy}\n\n{exam}🎯 교수(10/20 녹음 33:23–35:56): \"we have to rely upon this one when we are about to '''travel'''.\" service provider 의 예로 '''LG U+, SK Telecom''' 등을 들고, \"even if … under different service providers, we can enjoy our communication if they have some '''roaming contract'''\" — 해외에서는 eSIM 을 설치하는 정도로 쓸 수 있지만 속도·효율은 home 망과 다를 수 있다.{/exam}\n\n{info}(Forouzan 보충 — 슬라이드에 없음) 로밍 사용자가 neighbor 망에 들어오면 neighbor 의 MSC 는 사용자의 home 망 데이터베이스(GSM 의 [[HLR]])에 \"이 사용자가 지금 우리 쪽에 있다\"고 알려 준다. 그래야 누군가 이 사용자에게 전화를 걸었을 때 home 망이 neighbor 쪽으로 연결해 줄 수 있다(\"can be reached\").{/info}\n\n{quiz}Roaming 이 필요한 이유와, 그것을 가능하게 하는 수단을 슬라이드 표현으로 쓰시오.{/quiz}\n{answer}\"A service provider usually has '''limited coverage'''\" 이기 때문. \"Neighboring service providers can provide '''extended coverage''' through a '''roaming contract'''\" (p.17).{/answer}\n\n== 관련 문서 ==\n* [[handoff]] · [[MSC]] · [[HLR]] · [[CH05 셀룰러 동작]]"
 },

  "body": "셀룰러에서 '''uplink''' 는 '''MS → BS''' 방향(폰이 탑으로 '''올려''' 보냄), '''downlink''' 는 '''BS → MS''' 방향(탑이 폰으로 '''내려''' 보냄)이다. 셀룰러 교재·슬라이드는 같은 것을 '''reverse'''(= uplink) / '''forward'''(= downlink) 라고도 부른다. 1G AMPS 부터 두 방향에 '''서로 다른 대역'''을 줘서 동시에 말하고 듣는다(FDD). 이 문서는 1강 구조(MS·BS)를 바탕으로 2강·3강의 대역 이야기를 미리 정리한다.\n\n{def}AMPS 대역 슬라이드(L10 p.19) 표현: MS 가 보내는 대역 '''824–849 MHz''' = '''reverse''' (mobile → base), BS 가 보내는 대역 '''869–894 MHz''' = '''forward''' (base → mobile). IS-95 블록도(p.29–30)도 forward / reverse 로 나뉜다.\nuplink(reverse) = MS → BS, downlink(forward) = BS → MS.{/def}\n\n[[img:L10-19.png|p.19 AMPS bands — 824–849 MHz (MS 송신 = reverse = uplink) 와 869–894 MHz (BS 송신 = forward = downlink), 각 25 MHz 를 30 kHz 채널로 나눔 (필기본, \"다시\" 표시)|medium]]\n\n== 이름에서 개념 끌어내기 ==\n* '''up / down''' — BS 탑은 높은 곳, 폰은 땅. 폰 → 탑은 '''위로(up)''', 탑 → 폰은 '''아래로(down)'''. 위성(지상국 → 위성 = uplink)에서 온 말이다.\n* '''forward / reverse''' — 망(BS)을 기준으로, 망이 사용자에게 '''앞으로 내보내는''' 방향이 forward, 사용자가 망으로 '''거슬러 보내는''' 방향이 reverse.\n\n{|\n! 방향 || 별칭 || 송신자 → 수신자 || AMPS 대역 (p.19) || IS-95 (p.29–30)\n|-\n| '''uplink''' || '''reverse''' || MS → BS || 824–849 MHz || reverse 전송 → [[IS-95 reverse 전송]]\n|-\n| '''downlink''' || '''forward''' || BS → MS || 869–894 MHz || forward 전송 → [[IS-95 forward 전송]]\n|}\n* 두 대역을 나눠 쓰는 것 = [[mid:duplexing과 multiple access|duplexing]] 의 한 방식인 '''FDD'''(frequency division duplexing). 같은 대역 안에서 사용자들을 나누는 것은 따로 [[FDMA]]·[[TDMA]]·[[CDMA]] — '''duplexing ≠ multiple access''' (중간고사 Bluetooth 에서 교수가 강조한 구분, Bluetooth 는 시간으로 나누는 TDD 였다 → [[mid:TDD-TDMA]]).\n* 1강 동작과의 연결: 발신 ①(MS → BS 번호 송신)은 '''uplink''', 수신 ②의 paging·④ ringing(BS → MS)은 '''downlink'''.\n\n{analogy}🎭 '''2차선 도로.''' 올라가는 차선(uplink)과 내려오는 차선(downlink)을 따로 깔아 두면 양쪽 차가 동시에 달린다(full-duplex). AMPS 는 두 차선 사이에 45 MHz 의 중앙분리대를 둔 셈이다(824→869, 849→894).{/analogy}\n\n[[anim:amps_bands|MS 가 uplink(824–849 MHz) 채널 하나와 downlink(869–894 MHz) 채널 하나를 짝으로 잡는 모습을 보라]]\n\n{quiz}AMPS 에서 BS 가 MS 에게 보내는 방향의 이름 두 가지와 그 대역은?{/quiz}\n{answer}'''downlink''' = '''forward''' (base → mobile), '''869–894 MHz''' (p.19).{/answer}\n\n== 관련 문서 ==\n* [[AMPS 대역과 채널]] · [[IS-95 forward 전송]] · [[IS-95 reverse 전송]] · [[base station]] · [[mobile station]]\n* [[mid:duplexing과 multiple access]] · [[mid:full-duplex]]"

 "CH05 1G–2G 셀룰러": {
  "title": "CH05 1G–2G 셀룰러 (2강 — AMPS · D-AMPS · GSM: FDMA 에서 TDMA 로)",
  "category": [
   "2강 1G–2G",
   "메인"
  ],
  "body": "'''CH05 1G–2G 셀룰러'''는 L10 덱(`CH05_Wide Area Networks (1).pdf`) p.18–26 이다. 앞 절([[CH05 셀룰러 동작]])에서 [[cell]] · [[base station]] · [[MSC]] · [[frequency reuse]] · [[handoff]] 로 '''셀룰러가 어떻게 돌아가는지'''를 봤다면, 이 절이 던지는 질문은 — '''\"한 cell 안의 여러 사용자가 같은 25 MHz 대역을 어떻게 나눠 쓰나? 그리고 세대가 바뀌면서 그 나누는 방법이 어떻게 진화했나?\"'''\n답: '''1G [[AMPS]]''' 는 아날로그 음성을 [[FM]] 으로 실어 '''주파수로만''' 나눴다([[FDMA]] — 30 kHz 채널 하나 = 사용자 한 명). '''2G''' 는 음성을 '''디지털'''로 바꾼 덕분에 한 주파수 채널을 '''시간으로 또 쪼갤''' 수 있게 됐다([[TDMA]]): [[D-AMPS]] 는 같은 30 kHz 채널에 3명, [[GSM]] 은 200 kHz 채널에 8명. (2G 의 또 다른 길 [[CDMA]] 기반 [[IS-95]] 는 다음 절 [[CH05 IS-95·3G·4G]].)\n\n페이지 번호는 PDF 페이지(= `_slides/L10-NN.png` 번호)다. 이 덱은 '''사용자의 GoodNotes 필기본'''이라 슬라이드마다 빨간 녹음 타임스탬프와 메모가 있다 — p.19(AMPS Bands)와 p.25(GSM Transmission)에 '''\"다시\"''', p.21(D-AMPS)의 7.95 kbps 옆에 '''\"기억 x\"''', p.19 의 416 channels 아래 '''\"? 다시\"''', p.25 에 '''\"analog? digital?\"''' 이 적혀 있다. 이 문서는 그 표시마다 쉬운 재설명과 답을 달았다.\n\n{exam}🎯 교수가 10/20 에 직접 정해 준 공부법 (녹음 41:33–42:57, 45:50–46:59)\n* '''숫자를 외우지 말고 trend 를 이해하라''': \"I'm not going to recommend you to memorize all these specific numbers … I would recommend you to understand '''how communication systems evolve across generations'''. That trend is important.\" (41:54) / \"'''You will not see some OX quizzes that ask these kind of specific numbers.'''\" (46:00)\n* 교수가 꼽은 '''세 가지 trend''' (46:34): '''analog → digital''' · '''voice → data''' · '''narrowband → wideband'''.\n* 단 '''uplink / downlink 는 외워라''': \"I would recommend you to memorize uplink and downlink\" (42:20) · \"You should memorize this terminology.\" (42:57) — '''downlink = BS → MS'''(송신 BS, 수신 MS) = forward, '''uplink = MS → BS''' = reverse. \"imagining this illustration\" — 아래로(down) BS→MS, 위로(up) MS→BS (40:00).\n* \"leading '''analog''', this is important\" (37:40) — 1G = analog. \"In 2G, almost all cellular systems are built upon '''digital''' communication\" (51:52).\n* 세대 × 접근 방식: 1G AMPS = analog + '''FDMA''' · 2G D-AMPS·GSM = digital + '''TDMA 와 FDMA 의 hybrid''' (53:41–54:28) · 2G IS-95 = '''CDMA'''.\n* AMPS 변조: voice = '''FM''' · control = '''FSK''' (\"they use digital communication for control\", 44:09).{/exam}\n\n{info}아래 본문의 채널 수(832/416/21/395)·bit rate(48.6, 270.8 kbps) 계산은 '''구조를 이해하기 위한 풀이'''로 남겨 둔다. 교수 말대로 수치 자체를 묻는 OX 는 나오지 않을 것이니 외우기보다 \"왜 이런 구조인가\"(대역 둘 = uplink/downlink, 디지털화 → TDMA → 채널당 사용자 증가)를 잡을 것.{/info}\n\n{analogy}🎭 '''아파트 단지의 공용 회의실(= 25 MHz 대역)을 나눠 쓰는 법.'''\n* '''1G (FDMA)''': 회의실을 칸막이로 832 칸 나누고 '''한 칸에 한 팀'''. 팀이 말을 안 하고 있어도 칸은 비워 둬야 한다.\n* '''2G (TDMA)''': 칸막이는 그대로 두되, 한 칸을 '''시간표'''로 나눈다 — \"0–1분 A팀, 1–2분 B팀, 2–3분 C팀, 다시 A팀…\". 각 팀이 하고 싶은 말을 '''녹음해서 압축'''(digitize)해 두었다가 자기 차례에 빨리 틀기 때문에 가능하다. 아날로그 생목소리는 압축도, 끊어서 몰아 보내기도 안 된다 — 그래서 '''디지털화가 TDMA 의 전제'''다.\n* '''2G CDMA (다음 절)''': 칸막이도 시간표도 없이 모두가 동시에 말하되 '''팀마다 다른 언어'''를 쓴다.{/analogy}\n\n[[anim:access_methods|FDMA(주파수 띠) → TDMA(같은 띠 안의 시간 슬롯) → CDMA(같은 시간·같은 주파수, code 로 구분) 순서로 그림이 바뀌는 동안, 각 장면이 어느 세대·어느 시스템인지(아래 요점 줄) 짝지어 보라]]\n\n== p.18 — 1st Generation (1G): AMPS ⭐ ==\n\n{def}\"1st Generation (1G): '''AMPS (Advanced Mobile Phone System)'''\n* One of the leading '''analog cellular systems''' in North America\n* AMPS uses '''FDMA''' to separate channels in a link\" (p.18){/def}\n\n[[img:L10-18.png|p.18 1G AMPS — cell tower 와 phone 사이는 \"just a regular radio, on a specific frequency (or range)\", tower 들은 cell carrier 망을 거쳐 일반 전화망에 유선 연결 (필기본: 36:05~)|medium]]\n\n* '''analog''': 음성 파형을 숫자로 바꾸지 않고 그대로 반송파([[mid:carrier|carrier]])에 싣는다 → [[FM]].\n* '''FDMA''': 링크(BS ↔ MS) 안의 채널들을 '''주파수로''' 분리한다. 그림 설명 그대로 — 폰과 tower 의 연결은 \"'''just a regular radio, on a specific frequency'''\". 라디오 방송국마다 주파수가 다르듯, 통화마다 30 kHz 주파수가 다르다. 자세히는 [[FDMA]], 선수 개념 [[mid:FDM]] · [[mid:channelization]].\n* 그림 위쪽 말풍선: \"When you move from one cell's range to another, the towers hand off your connection. Sometimes, this doesn't work and your call gets dropped.\" — 1G 의 [[handoff]] 는 [[hard handoff]] 였다(→ [[CH05 셀룰러 동작]] p.16).\n* 오른쪽: \"The towers are all wired directly to the cell carrier's network, which is bridged to the standard phone system\" — tower = [[base station]], 그 망의 중심 = [[MSC]], standard phone system = [[PSTN]].\n\n자세히는 [[1G]] · [[AMPS]].\n\n== p.19 — AMPS (1G): Bands ⭐⭐⭐ (필기 \"다시\") ==\n\n[[img:L10-19.png|p.19 AMPS Bands — MS band 824–849 MHz(reverse = uplink), BS band 869–894 MHz(forward = downlink), 각 25 MHz = 832 × 30 kHz (필기본: \"다시\", \"416 channels ? 다시\")|large]]\n\n{def}\"Each band is '''25 MHz''', made of '''832 30-kHz''' analog channels.\nForward communication: '''base to mobile''' · Reverse communication: '''mobile to base'''\nTwo providers can share an area, which means '''416 channels''' in each cell for each provider. Among 416, '''21 channels''' are used for control.\nAMPS has a frequency '''reuse factor of 7'''.\" (p.19){/def}\n\n[[anim:amps_bands|MS band(824–849, uplink)과 BS band(869–894, downlink)에서 한 MS 가 채널을 하나씩 짝으로 잡는 순간을 보고, \"왜 대역이 두 개인가\"를 한 문장으로 말해 보라]]\n\n{exam}🎯 '''uplink / downlink — 교수가 \"외워라\" 고 한 유일한 항목''' (40:00, 42:20, 42:57)\n* '''downlink''' = forward communication = '''BS → MS''' (transmitter BS, receiver MS). 교수: \"people in wireless communication prefer to call this one downlink.\"\n* '''uplink''' = reverse communication = '''MS → BS''' (transmitter MS, receiver BS).\n* 외우는 법(교수): 그림을 떠올려라 — 기지국 탑이 위, 폰이 아래. '''위에서 아래로 = down''', '''아래에서 위로 = up'''. (사용자 필기의 △BS / □MS 그림이 바로 이것.)\n* \"Almost every communication system operates two different frequency bands for downlink and uplink.\" (40:28) → [[uplink와 downlink]]{/exam}\n\n{warn}'''\"다시\" 표시 — 처음부터 쉽게.'''\n# AMPS 는 '''대역(band)을 두 개''' 쓴다. 하나는 MS 가 말하는 용도(824–849 MHz), 하나는 BS 가 말하는 용도(869–894 MHz). 이름 붙이는 기준은 '''\"누가 보내나\"''' — '''Mobile station band''' = mobile 이 송신하는 대역 = '''reverse = [[uplink와 downlink|uplink]]''', '''Base station band''' = base 가 송신하는 대역 = '''forward = downlink'''. (필기: \"Downlink = Forward: base to mobile\", \"uplink = Reverse: mobile to base\", 그리고 오른쪽 위 △BS–□MS 그림의 Down ↓ / up ↑.)\n# 대역이 둘인 이유: 통화는 동시에 말하고 듣는 '''full-duplex''' 다. 같은 주파수로 동시에 주고받으면 섞이니, 방향마다 다른 대역을 준다(주파수로 duplex — [[mid:duplexing과 multiple access|duplexing]]).\n# 각 대역 25 MHz 를 30 kHz 씩 자르면 832 칸. 통화 하나는 '''uplink 칸 1개 + downlink 칸 1개를 짝으로''' 쓴다. 그래서 \"832 채널\" = 양방향 짝 832 쌍.\n# 이후 계산(416 → 21 → 395)은 아래 표.{/warn}\n\n<pre class=\"txt\">\n'''AMPS 채널 수 — 손으로 푸는 순서'''\n1. 한 대역 폭           = 849 − 824 = 25 MHz   (BS 쪽도 894 − 869 = 25 MHz)\n2. 채널 폭              = 30 kHz\n3. 25 MHz ÷ 30 kHz      = 25,000 kHz ÷ 30 kHz = 833.3…  → 정수 칸 '''832''' 채널 (방향당)\n4. 한 지역을 '''2 provider''' 가 나눔 → 832 ÷ 2 = '''416''' 채널 / provider\n5. 그중 '''control 21''' 개        → voice = 416 − 21 = '''395''' 채널\n6. [[reuse factor]] N = '''7'''   → 한 cell 이 실제로 쓰는 voice ≈ 395 ÷ 7 ≈ 56   ← 슬라이드에 없는 파생값\n<\/pre>\n\n[[sim:band_channels]]\n\n{tip}'''필기 속 질문: \"416 channels ? 다시\" — 416 은 어디서 나온 숫자이고, 왜 \"in each cell\" 인가?'''\n* '''416 = 832 ÷ 2'''. 한 지역에 이동통신사(provider) '''두 곳'''이 경쟁하도록 미국 규제가 대역을 반으로 나눴다(A 사업자 / B 사업자 — Forouzan 보충). 832 개 양방향 채널을 반씩 → 사업자당 416.\n* 416 에는 '''control 21 + voice 395''' 가 다 들어 있다. control channel 은 통화 내용이 아니라 '''통화 설정·paging''' 용이다 → [[AMPS control channel]].\n* \"416 channels in each cell\" 이라는 슬라이드 표현은 '''\"한 사업자가 그 지역에서 가진 채널 총량\"''' 으로 읽어야 한다. reuse factor 7 이라 인접한 7 개 cell 이 이 416 개를 '''나눠''' 가지므로, 실제로 한 cell 에서 동시에 쓸 수 있는 voice 채널은 대략 395 / 7 ≈ 56 개다(Forouzan 도 \"only one-seventh of these 395 traffic channels are actually available in a cell\" 이라고 쓴다 — 보충). → [[frequency reuse]], [[reuse factor]]{/tip}\n\n자세히는 [[AMPS 대역과 채널]].\n\n== p.20 — AMPS (1G): Transmission ⭐⭐ ==\n\n{def}\"'''Voice''' channels are modulated using '''FM'''.\n'''Control''' channels use '''FSK''' to create 30 kHz analog signals.\" (p.20){/def}\n\n[[img:L10-20.png|p.20 AMPS Transmission — 3 kHz voice → FM → 30 kHz analog / 10 kbps control → FSK → 30 kHz analog, 832 channels 를 25-MHz band 안에 FDMA 로 나란히 (필기본: control 쪽에 \"Digital communication\")|large]]\n\n{|\n! 채널 종류 || 입력 || 변조 || 출력 || 변환 종류\n|-\n| Voice || '''3 kHz''' 아날로그 음성 || [[FM]] || 30 kHz analog || analog → analog\n|-\n| Control || '''10 kbps''' 디지털 데이터 || [[mid:FSK|FSK]] || 30 kHz analog || '''digital''' → analog ([[mid:digital-to-analog conversion|digital-to-analog]])\n|}\n\n* 그림 오른쪽 회색 상자가 '''FDMA''': 25-MHz band 를 30 kHz 칸으로 나눈 줄에서, 위 사용자는 첫 칸, 다음 사용자는 둘째 칸… 사용자마다 '''다른 칸(주파수)'''이 칠해져 있다.\n* 3 kHz 음성이 30 kHz 를 차지하는 이유: FM 은 진폭을 주파수 변화로 바꾸므로 원래 신호보다 '''훨씬 넓은 대역'''이 필요하다(FM bandwidth ≈ 원 신호의 수 배 — [[mid:변조 대역폭]] 참고).\n* 필기 \"'''Digital communication'''\"(control 쪽 빨간 상자): 맞다. AMPS 는 \"analog system\" 이지만 control channel 만은 '''10 kbps 비트'''를 보낸다. 통화 설정 명령(번호, 채널 할당 등)은 '''정확해야''' 하니 디지털로 보내고, 무선으로 내보낼 때만 FSK 로 아날로그 파형을 만든다. → [[AMPS control channel]]\n* 필기 \"Voice\" 네모 강조: '''FM 은 voice 에만''' 쓴다는 것이 출제 포인트. \"AMPS = FM\" 이라고 뭉뚱그리지 말 것.\n\n{warn}\"AMPS 는 analog 시스템이니까 모든 채널이 analog 데이터\" — '''틀림'''. 출력 신호는 전부 30 kHz analog 지만, '''control 채널의 입력은 10 kbps digital''' 이다. \"voice = FM, control = FSK\" 를 짝으로 외울 것.{/warn}\n\n== p.21 — 2nd Generation (2G): Digital AMPS (D-AMPS) ⭐⭐ ==\n\n{def}\"The evolution of the '''analog AMPS into a digital system'''.\nBand: The '''same bands and channels''' as AMPS\nTransmission: Voice channel is '''digitized''' to 7.95 kbps. '''Three''' digital voice channels are combined using '''TDMA''' (48.6 kbps with overhead).\" (p.21){/def}\n\n* '''같은 대역·같은 채널''' — 824–849 / 869–894 MHz, 30 kHz × 832 를 그대로 쓴다. 그래서 기지국 무선 설비·주파수 면허를 바꾸지 않고 디지털로 갈아탈 수 있었다(이름이 \"Digital AMPS\" 인 이유).\n* 바뀐 것은 '''채널 안을 쓰는 방법''': 음성을 digitize → 3명을 TDMA 로 합침.\n\n{info}'''필기 \"기억 x\" (7.95 kbps 옆) — 녹음으로 확정: 수치 암기 불필요.''' 교수는 AMPS Bands 에서 이미 \"I'm not going to recommend you to memorize all these specific numbers\"(41:54)라고 했고, 바로 이 D-AMPS 슬라이드에서 다시 \"'''I would not recommend you to memorize these specific numbers. You will not see some OX quizzes that ask these kind of specific numbers'''\"(45:50–46:07)라고 못 박았다. 외울 것은 수치가 아니라 '''trend''': \"Evolving from '''analog''' communication to '''digital'''\" — voice 를 digitize → TDMA 로 합침 → 같은 30 kHz 채널. → [[7.95 kbps 디지털 음성]]{/info}\n\n== p.22 — D-AMPS (2G): Transmission ⭐⭐⭐ ==\n\n[[img:L10-22.png|p.22 AMPS(왼쪽, voice: analog) vs D-AMPS(오른쪽, voice: digitized) — 3 kHz voice × 3 → Digitizer 7.95 kbps → TDMA 슬롯 1 2 3 1 2 3 → 48.6 kbps → QPSK → 30 kHz, Channel 001–832 를 FDMA (필기본)|large]]\n\n[[anim:damps_tdma_anim|왼쪽(AMPS)에서 음성 하나가 30 kHz 칸 하나를 차지하는 것과, 오른쪽(D-AMPS)에서 음성 셋이 슬롯 1·2·3 으로 끼워져 '같은' 30 kHz 칸에 들어가는 것을 비교하라]]\n\n<pre class=\"txt\">\n'''D-AMPS 한 채널 — 왼쪽에서 오른쪽으로'''\n1. 사용자 음성          3 kHz analog            × 3 명\n2. Digitizer           3 kHz → '''7.95 kbps'''        (사용자당)\n3. 3 명 합계            3 × 7.95 = 23.85 kbps\n4. TDMA 로 섞기         슬롯 1 2 3 1 2 3 …  + overhead(동기·제어 비트)\n                        → '''48.6 kbps'''              (overhead ≈ 48.6 − 23.85 = 24.75 kbps)\n5. [[QPSK]]              48.6 kbps digital → 30 kHz analog   (2 bits/symbol → 24.3 ksymbol/s — 파생값)\n6. FDMA                이런 채널이 Channel 001 … '''832'''\n→ 결과: 같은 30 kHz 채널에 '''3 명''' (AMPS 의 3 배)\n<\/pre>\n\n[[sim:damps_tdma]]\n\n* 필기 \"voice: analog\"(왼쪽) ↔ \"voice: digitized\"(오른쪽) ↔ '''TDMA''' 동그라미: 이 슬라이드의 요점 셋이 정확히 이 필기다. '''음성을 디지털로 바꾸니 → 시간으로 나눌(TDMA) 수 있고 → 같은 대역에 3배 사용자'''.\n* D-AMPS 는 TDMA '''만''' 쓰는 게 아니다. 오른쪽 아래 회색 상자에 여전히 '''FDMA''' 가 있다 — 832 개 주파수 채널(FDMA) 각각을 다시 3 개 시간 슬롯(TDMA)으로 쪼갠 '''FDMA + TDMA''' 이중 구조다. GSM 도 같다(p.25).\n* QPSK 는 [[mid:PSK|PSK]] 의 일종(위상 4 개, 심볼당 2 비트) — 자세히는 [[QPSK]] (IS-95 에서도 쓴다).\n\n{warn}\"2G D-AMPS = TDMA\" 로 외우되, '''FDMA 를 버린 게 아니라 FDMA 위에 TDMA 를 얹었다'''는 점을 서술형에서 놓치지 말 것. \"D-AMPS 는 832 개 30 kHz 채널을 FDMA 로 나누고, 각 채널을 TDMA 로 3 사용자가 공유한다.\"{/warn}\n\n자세히는 [[D-AMPS]] · [[TDMA]] · [[2G]].\n\n== p.23 — 2nd Generation: GSM ⭐ ==\n\n{def}\"'''GSM (Global System for Mobile Communication)''' — A '''European''' standard for a common 2G technology '''for all Europe'''.\" (p.23){/def}\n\n[[img:L10-23.png|p.23 GSM 구성 — Mobile Station(Phone) · Base Station (= cell, 필기 빨간 원) → MSC(Mobile-Services Switching Center) → PSTN → Telephone, MSC 에 HLR(Home Location Register) 연결 (필기본: 48:40~)|medium]]\n\n* 이름: '''Global''' System — 원래 목표는 \"유럽 전체의 공통 2G\". 당시 유럽은 나라마다 1G 방식이 달라 국경을 넘으면 폰이 안 됐다. 하나로 통일하자는 것이 출발점이고, 결과적으로 전 세계 표준이 되어 이름값을 했다(보충).\n* 그림의 구성은 [[CH05 셀룰러 동작]] p.9–10 과 같다: [[mobile station]] · [[base station]] 이 한 [[cell]](필기의 빨간 원 \"Cell\"), BS 들 → [[MSC]] → [[PSTN]] → 일반 전화.\n* 새로 등장한 것: '''[[HLR]] (Home Location Register)''' — MSC 옆의 데이터베이스(그림에는 \"HRL- Home Loaction Register\" 로 '''오타'''). 가입자 정보와 현재 위치를 저장 → [[paging]] · [[roaming]] 때 \"이 사용자가 지금 어디 있나\"를 찾는 곳.\n\n자세히는 [[GSM]].\n\n== p.24 — GSM (2G): Bands ⭐⭐ ==\n\n{def}\"Use two bands for (half) duplex communication\n* Forward ('''Downlink'''): BS → MS\n* Reverse ('''Uplink'''): BS ← MS\nBand = 25 MHz = 124 channels · Channel: 200 kHz · Reverse band 890–915 MHz · Forward band 935–960 MHz\" (p.24){/def}\n\n[[img:L10-24.png|p.24 GSM Bands — Reverse band(uplink) 890–915 MHz, Forward band(downlink) 935–960 MHz, 각 25 MHz = 124 × 200 kHz (필기본: uplink / downlink)|medium]]\n\n<pre class=\"txt\">\n'''GSM 채널 수'''\n1. 한 대역 폭      = 915 − 890 = 25 MHz   (forward: 960 − 935 = 25 MHz)\n2. 채널 폭         = 200 kHz\n3. 25 MHz ÷ 200 kHz = 25,000 ÷ 200 = 125\n4. 양 끝 [[mid:guard band|guard band]] 몫을 빼고 '''124''' 채널   ← 슬라이드 값\n5. 채널당 TDMA 8 slot → 124 × 8 = 992 사용자(통화)   ← 파생값 (Forouzan 보충)\n<\/pre>\n\n* AMPS 와 비교: AMPS 는 '''좁은 칸(30 kHz) × 많이(832)''', GSM 은 '''넓은 칸(200 kHz) × 적게(124)''' — 대신 GSM 은 한 칸을 8 명이 시간으로 나눠 쓴다.\n* 슬라이드의 \"(half) duplex\" 괄호: 방향마다 다른 대역을 쓰니 대역 차원에서는 duplex 지만, GSM 폰은 uplink 슬롯과 downlink 슬롯이 '''시간상 엇갈리도록'''(3 slot 차이) 짜여 있어 한 순간에 송신과 수신을 동시에 하지는 않는다(Forouzan 이외 보충 — 슬라이드에 설명 없음). 시험에서는 \"두 대역(uplink 890–915 / downlink 935–960)을 쓴다\"가 핵심.\n\n자세히는 [[GSM 대역]].\n\n== p.25 — GSM (2G): Transmission ⭐⭐ (필기 \"다시\") ==\n\n{def}\"Each slot carries '''156.25 bits'''. # of slots: '''8''' · # of frames: '''26''' · MultiFrame duration: '''120 ms''' · Channel bit rate: $(1/120\\text{ms}) \\times 26 \\times 8 \\times 156.25 = 270.8\\text{ kbps}$\" (p.25){/def}\n\n[[img:L10-25.png|p.25 GSM Transmission — 8 Users: 3 kHz voice → Digitizer 13 kbps → time slot → frame(8 slots) → 1 multiframe = 26 frames, Duration = 120 ms → 270.8 kbps → GMSK → 200 kHz, Channel 001–124 FDMA (필기본: \"52:15까지 다시\", \"analog? digital?\", time slot / frame / multiframe / TDMA / FDMA)|large]]\n\n{warn}'''\"다시\" 표시 — 그림을 왼쪽에서 오른쪽으로 한 번에 한 칸씩.'''\n# '''8 Users''': 사용자 8명이 각자 3 kHz 음성을 '''Digitizer''' 로 13 kbps 비트열로 만든다.\n# '''time slot''' (필기): 사용자 한 명의 비트 덩어리가 들어가는 '''칸 하나'''. 크기 156.25 bits.\n# '''frame''' (필기): 8 명의 slot 을 한 줄로 세운 것 = '''8 slots'''. \"8 명이 한 번씩 돌아가며 말하는 한 바퀴\".\n# '''multiframe''' (필기): frame 26 개를 묶은 것 = 노란 상자. 걸리는 시간이 '''120 ms'''.\n# 이 비트열이 '''270.8 kbps''' 로 흘러 [[GMSK]] 변조기로 들어가 '''200 kHz''' 아날로그 신호가 된다.\n# 그런 200 kHz 채널이 Channel 001 … '''124''' — 이 바깥 층이 '''FDMA''' (필기 동그라미). 교수: \"It uses a '''hybrid of TDMA and FDMA'''\" (54:05). GMSK 는 \"we did not discuss the detailed mechanism\" — 원리는 범위 밖.\n즉 '''안쪽 TDMA(8 명) + 바깥쪽 FDMA(124 채널)''' — D-AMPS 와 같은 구조에 숫자만 다르다.{/warn}\n\n[[anim:gsm_multiframe_anim|65 → 114 → 156.25 bits 로 slot 이 부풀고, slot 8 개가 frame, frame 26 개가 120 ms multiframe 이 되는 순서를 따라가면서, 아래에 완성되는 270.8 kbps 식의 각 숫자가 어느 층에서 왔는지 짚어 보라]]\n\n<pre class=\"txt\">\n'''GSM channel bit rate — 손으로 푸는 순서'''\n1. slot 하나              = 156.25 bits\n2. frame 하나 = 8 slots    = 8 × 156.25            = 1,250 bits\n3. multiframe = 26 frames = 26 × 1,250            = 32,500 bits\n4. multiframe 시간         = 120 ms = 0.12 s\n5. bit rate               = 32,500 bits ÷ 0.12 s  = 270,833.3 bps\n                          ≈ '''270.8 kbps'''\n   (한 줄 식: (1/120 ms) × 26 × 8 × 156.25 = 270.8 kbps)\n<\/pre>\n\n[[sim:gsm_bitrate]]\n\n{tip}'''필기 속 질문: \"analog? digital?\" — GSM 은 아날로그인가 디지털인가?'''\n'''디지털 시스템이다.''' 교수(51:41–52:14): \"Here we see digitization of voice channel — in other words, it is '''digital''' communication cellular systems, not analog communication. In 2G, almost all cellular systems are built upon digital communication.\" 정보(음성)가 Digitizer 에서 '''비트'''(13 kbps)로 바뀐 뒤, TDMA 로 섞이는 것도, 270.8 kbps 로 흐르는 것도 전부 비트다. 그림 맨 끝 [[GMSK]] 에서 200 kHz '''아날로그 파형'''으로 바뀌는 것은 '''전파로 내보내려면 어떤 시스템이든 아날로그 파형이 필요'''하기 때문이다([[mid:digital-to-analog conversion|digital-to-analog conversion]] — 중간고사 범위의 ASK/FSK/PSK 와 같은 단계).\n\"digital/analog 시스템\" 을 가르는 기준은 '''무선 신호의 모양이 아니라 정보를 무엇으로 표현하나'''다:\n* AMPS voice: 3 kHz 음성 → (FM) → 30 kHz — 정보가 '''처음부터 끝까지 연속 파형''' → analog\n* GSM: 3 kHz 음성 → '''13 kbps 비트''' → TDMA → (GMSK) → 200 kHz — 중간이 비트 → digital\n* D-AMPS 도 마찬가지(7.95 kbps → QPSK). AMPS 의 control channel(10 kbps → FSK)이 \"Digital communication\" 인 것도 같은 이유.{/tip}\n\n{info}슬라이드 그림의 Digitizer 출력 \"13 kbps\" 는 p.26 의 '''user data 65 bits''' 와 맞물린다: 한 사용자는 multiframe 마다 traffic frame 24 개에서 slot 1 개씩 → 65 × 24 = 1,560 bits / 120 ms = '''13 kbps'''. 나머지(114 − 65 = 49 bits error control, 156.25 − 114 = 42.25 bits TDMA control, 2 개 control frame)는 overhead 다. sim 의 \"순수 user data rate\" 옵션으로 확인.{/info}\n\n== p.26 — GSM (2G): Transmission – Multiframe components ⭐ ==\n\n[[img:L10-26.png|p.26 Multiframe components — 65 bits user data → 114 bits(+ error control) → 156.25 bits(+ TDMA control) = slot, Frame = 8 slots, 1 multiframe = 26 frames(24 traffic + 2 control) = 120 ms (54:30~)|large]]\n\n{|\n! 층 || 크기 || 무엇이 더해졌나\n|-\n| user data || 65 bits || 디지털 음성 그 자체\n|-\n| + error control || 114 bits || 오류 검출·정정용 redundancy (49 bits)\n|-\n| + TDMA control = '''slot''' || '''156.25 bits''' || 동기·guard 등 TDMA 운영 비트 (42.25 bits)\n|-\n| '''frame''' || 8 slots || 8 사용자가 한 바퀴\n|-\n| '''multiframe''' || 26 frames = '''24 traffic + 2 control''' || 120 ms\n|}\n\n* '''bits 가 왜 0.25 같은 소수?''' slot 끝의 guard period 가 8.25 bit 시간이라 평균이 156.25 가 된다(보충 — 슬라이드는 값만). 시험에서는 \"156.25 bits\" 그대로.\n* 65 → 156.25: 한 slot 의 비트 중 사용자 음성은 65 / 156.25 ≈ '''42 %''' 뿐 — 나머지는 오류 제어와 TDMA 제어. 중간고사 위키의 \"10 Gbps 는 체감 속도가 아니다\" 와 같은 이야기([[mid:throughput|throughput]] vs bit rate).\n\n자세히는 [[GSM 프레임 구조]] · [[GSM multiframe]] · [[GSM channel bit rate]].\n\n{quiz}GSM 의 multiframe 은 26 개 frame, frame 은 8 개 slot, slot 은 156.25 bits 이고 multiframe 의 길이는 120 ms 다. (a) channel bit rate 를 구하시오. (b) 사용자 한 명(slot 하나)이 차지하는 rate 는? (c) 순수 user data rate 는? (user data 65 bits, traffic frame 24 개){/quiz}\n{answer}<pre class=\"txt\">\n(a) 26 × 8 × 156.25 = 32,500 bits / 120 ms → 32,500 / 0.12 = 270,833 bps ≈ '''270.8 kbps'''\n(b) 270.8 kbps ÷ 8 slot = '''33.85 kbps'''    (= 26 × 156.25 / 0.12)\n(c) 65 bits × 24 frames / 0.12 s = 1,560 / 0.12 = '''13 kbps'''   (= p.25 Digitizer 출력)\n<\/pre>{/answer}\n\n== 정리: AMPS · D-AMPS · GSM 한눈에 ==\n\n{|\n! || [[AMPS]] (1G) || [[D-AMPS]] (2G) || [[GSM]] (2G)\n|-\n| 지역 || North America || North America || Europe (→ 전 세계)\n|-\n| 음성 || analog || '''digitized''' (7.95 kbps) || '''digitized''' (13 kbps)\n|-\n| 대역 (uplink / downlink) || 824–849 / 869–894 MHz || AMPS 와 같음 || 890–915 / 935–960 MHz\n|-\n| 채널 폭 × 개수 || 30 kHz × 832 || 30 kHz × 832 || 200 kHz × 124\n|-\n| 접근 방식 || [[FDMA]] || FDMA + [[TDMA]] (3 slot) || FDMA + TDMA (8 slot)\n|-\n| 채널당 사용자 || 1 || 3 || 8\n|-\n| 변조 || voice [[FM]] · control [[mid:FSK|FSK]] || [[QPSK]] || [[GMSK]]\n|-\n| 채널 bit rate || — (analog) || 48.6 kbps || 270.8 kbps\n|}\n\n[[anim:generations_timeline|1G → 4G 가 쌓이는 동안 이 절이 다룬 1G·2G 칸에서 '아날로그 → 디지털' 화살표가 어디서 꺾이는지 보라]]\n\n== 공식 모음 ==\n\n{|\n! 대상 || 식 || 값 || 슬라이드\n|-\n| AMPS 채널 수 (방향당) || $\\lfloor 25\\text{ MHz} / 30\\text{ kHz} \\rfloor$ → 832 || 832 || p.19\n|-\n| AMPS provider 당 || $832 / 2$ || 416 || p.19\n|-\n| AMPS voice 채널 || $416 - 21$ || 395 || p.19\n|-\n| AMPS cell 당 voice (파생) || $395 / 7$ || ≈ 56 || (p.19 에서 파생)\n|-\n| D-AMPS 채널 rate || $3 \\times 7.95 = 23.85$ kbps + overhead || 48.6 kbps || p.21–22\n|-\n| GSM 채널 수 || $25\\text{ MHz} / 200\\text{ kHz} = 125$ → guard 제외 || 124 || p.24\n|-\n| GSM channel bit rate || $\\frac{1}{120\\text{ ms}} \\times 26 \\times 8 \\times 156.25$ || 270.8 kbps || p.25\n|-\n| GSM 사용자당 rate (파생) || $270.8 / 8$ || 33.85 kbps || (p.25 에서 파생)\n|-\n| GSM user data rate (파생) || $65 \\times 24 / 120\\text{ ms}$ || 13 kbps || (p.25–26)\n|}\n\n== 🎙 실제 수업 기록 (10/20 화, 녹음본 기준) ==\n\n녹음 약 36:06–54:49 (p.18–26). 슬라이드 위 손글씨 타임스탬프: p.18 AMPS 36:05~ · p.19 Bands 38:25~ · p.20 Transmission 43:05~ · p.21 D-AMPS 44:45~ · p.22 D-AMPS Transmission 47:10~ · p.23 GSM 48:40~ · p.24 GSM Bands 50:20~ · p.25 GSM Transmission 51:05~ · p.26 Multiframe 54:30~. 영어 ASR 이라 숫자가 깨진 곳(\"30 GHz\"=30 kHz, \"460 channels\"=416, \"300 kHz\"=200 kHz, \"36 frames\"=26)은 슬라이드 값으로 바로잡았다.\n\n=== 1G 도입 (36:06–38:32, p.18) ===\n* \"From now on, I would like to present some specific cellular systems starting from the first generation.\" 지금의 4G·5G 는 매우 빠르고 편리하지만 초기 시스템은 \"very slow … people require some '''patience''' to use them.\"\n* \"There are more than one standard for each generation, but in this course, I would like to emphasize some few instances.\" — 세대마다 표준이 여럿이지만 대표 몇 개만 본다.\n* AMPS 이름에 대한 농담: \"Advanced Mobile Phone System. '''It is not advanced, but it is named''' (so).\"\n* ⭐ \"So leading '''analog''', '''this is important'''. Earlier ones, there are always something about analog. Today we are using digital communication systems, but previous ones are not identical to digital.\" (37:40) → 1G = analog.\n* \"an analog cellular system famously used in North America, and it deployed FDMA\" — 각 시스템마다 고유한 frequency band 와 transmission strategy 가 있다.\n\n=== AMPS Bands — uplink/downlink 를 외워라 (38:32–43:01, p.19) ===\n* 두 개의 band 를 쓴다. Forward communication = BS → MS, \"another interchangeable name … is '''downlink''' … people in wireless communication prefer to call this one downlink.\" Reverse communication(MS → BS) = '''uplink'''.\n* ⭐ \"'''I recommend you to memorize these uplink and downlink by imagining this illustration.''' Down from BS to MS, and up from MS to BS.\" (40:00) — 사용자 필기의 △BS–□MS 화살표 그림.\n* \"Almost every communication system operates two different frequency bands for downlink and uplink.\" (40:28)\n* 채널 수·control 21·reuse factor 7 을 읽은 뒤 바로: ⭐ \"Now you see many different numbers in this illustration, but I would recommend you to grasp or to understand the '''trends of evolution''' of communication systems. '''I'm not going to recommend you to memorize all these specific numbers''' … That trend is important. You don't have to memorize these … number of channels, or something else. '''But I would recommend you to memorize uplink and downlink.'''\" (41:33–42:26)\n* \"Downlink … the transmitter is BS and receiver is MS. On the other hand, uplink, transmitter is MS while the receiver is BS. '''You should memorize this terminology.'''\" (42:26–43:01)\n* → 사용자 필기 \"416 channels ? 다시\" 에 대해: 교수는 416 의 유래를 따로 설명하지 않고 '''숫자는 외우지 말라'''고 넘어갔다. 유래는 위 p.19 절의 \"필기 속 질문\" 박스 참고(832 ÷ 2 provider).\n\n=== AMPS Transmission (43:01–44:41, p.20) ===\n* \"All communication is about '''voice''' communication\" — 처음엔 통신이 voice 중심이었고, 점점 text·media 로 확장됐다(→ trend '''voice → data''').\n* Voice 는 FM. \"Control channels use FSK, meaning frequency shift keying that encodes some bits to analog signal. In other words, control signals are made of some '''digital''' information … '''they use digital communication for control'''.\" — 사용자 필기 \"Digital communication\" 이 이 말.\n* 채널 bandwidth 30 kHz 로 비교적 작고, 매체는 '''FDMA''' 로 사용자 간에 공유.\n\n=== D-AMPS — analog → digital trend (44:41–48:32, p.21–22) ===\n* \"As we can see from its name, it is an evolution, an improved version of AMPS, which is an analog one, into a digital system.\" 대역·채널은 AMPS 와 같고, 다른 점은 transmission — voice channel 이 '''digitized'''.\n* ⭐ \"'''I would not recommend you to memorize these specific numbers. You will not see some OX quizzes that ask these kind of specific numbers.''' Again, I ask you to understand the trend of evolution.\" (45:50–46:12) — 사용자 필기 \"기억 x\" 의 근거.\n* ⭐ 교수가 정리한 '''세 가지 key trend''' (46:12–46:59): \"Evolving from '''analog''' communication to '''digital''' … This is one big trend that is shared across every cellular system: from analog to digital, and from '''voice communication to data communication''', and from '''narrowband to wideband'''. These are key trends that we commonly see in wireless design.\"\n* p.22: 왼쪽 AMPS 의 voice 는 analog, 오른쪽 D-AMPS 의 voice 는 digital — \"These are key differences compared to AMPS.\" 또 하나의 차이는 변조가 '''QPSK''' 라는 것. 대역은 AMPS 와 같은 25 MHz / 30 kHz. \"It employs '''TDMA''' for sharing the medium across voice users.\"\n\n=== GSM (48:32–50:20, p.23) ===\n* \"Very famous standard … followed by Europe, specifically for Europe, and AMPS is specifically for North America. '''Different regions employ different standards.'''\" 매우 성공했지만 \"'''this one is not used in Korea''' — Korean version is IS-95\" (다음 절 [[IS-95]]).\n* 구성도: 앞에서 본 것과 비슷한 구조(BS, MSC, telephone network). \"Almost every cellular system, '''even nowadays''', shares this fundamental architecture.\"\n\n=== GSM Bands · Transmission (50:20–54:49, p.24–26) ===\n* GSM 도 두 band(uplink, downlink), band 당 25 MHz, 채널 200 kHz — \"larger than AMPS that uses 30 kHz\" (→ trend '''narrowband → wideband''').\n* TDMA frame 의 각 time slot 이 '''사용자 한 명'''에게 할당된다.\n* ⭐ 사용자 필기 \"analog? digital?\" / \"52:15까지 다시\" 의 답: \"Here we see digitization of voice channel — in other words, it is '''digital''' communication cellular systems, not analog communication. '''In 2G, almost all cellular systems are built upon digital communication''' instead of analog communication, as you saw in D-AMPS, which is contrary to AMPS that uses analog communication.\" (51:41–52:14)\n* slot 하나가 약 156.25 bits(\"almost 160 bits\"), slot 8 개 = 8 사용자가 공유 = frame, frame 26 개 = multiframe, 그리고 multiframe duration 으로 bit rate 를 계산하는 식을 짚었다(전사로는 계산을 칠판에서 따로 풀었는지 불분명).\n* \"This frame is converted to an analog signal by using '''GMSK''', '''which we did not discuss the detailed mechanism''', that is assigned to 200 kHz\" — GMSK 의 원리는 다루지 않음. 200 kHz 채널이 124 개.\n* ⭐ \"The medium of GSM is firstly shared with TDMA among 8 users … and has 124 different channels. It uses a '''hybrid of TDMA and FDMA'''. And this kind of multiple access was used in D-AMPS, right? It also uses a hybrid of TDMA and FDMA.\" (53:41–54:28)\n* p.26: 각 slot 에는 user data, error control bits, control information 이 들어 있다. 이후 54:49 부터 IS-95 → [[CH05 IS-95·3G·4G]].\n\n== 시험 대비 핵심 요약 ==\n\n# '''교수 지시: 숫자 말고 trend.''' 세대 진화의 세 trend = '''analog → digital''' · '''voice → data''' · '''narrowband → wideband''' (46:34). 채널 수·kbps 같은 specific number 는 OX 로 묻지 않는다고 했다(46:00).\n# '''uplink / downlink 는 외워라''' (42:20, 42:57): '''downlink = forward = BS → MS''' (송신 BS), '''uplink = reverse = MS → BS''' (송신 MS). 거의 모든 시스템이 두 방향에 '''서로 다른 frequency band''' 를 쓴다(AMPS·GSM 모두 band 2 개).\n# '''1G AMPS''' = North America 의 '''analog''' cellular(\"leading analog, this is important\"), '''FDMA''' 로 채널 분리. voice = '''FM''', control = '''FSK'''(control 만 digital).\n# '''2G D-AMPS''' = AMPS 의 '''digital''' 진화. '''대역·채널은 AMPS 와 같고''', voice 를 '''digitize''' 해서 여러 사용자를 '''TDMA''' 로 한 채널에 → '''TDMA + FDMA hybrid''', 변조 QPSK.\n# '''2G GSM''' = '''European''' 공통 2G 표준(한국은 GSM 이 아니라 IS-95). 채널이 AMPS 보다 넓다(200 kHz vs 30 kHz → narrowband → wideband).\n# GSM 구조를 말로: '''time slot''' 하나 = 사용자 한 명(user data + error control + TDMA control) → slot 8 개 = '''frame''' → frame 26 개(24 traffic + 2 control) = '''multiframe''' → channel bit rate = multiframe 하나의 비트 수 ÷ multiframe 시간 → '''GMSK''' 로 아날로그 신호. 역시 '''TDMA + FDMA hybrid'''.\n# \"'''In 2G, almost all cellular systems are built upon digital communication'''\" (51:52). digital/analog 구분은 정보를 비트로 다루는가 — 무선으로 나갈 때는 모두 아날로그 파형(FM/FSK/QPSK/GMSK).\n# 디지털화가 '''TDMA 의 전제''': 비트로 바꿔야 압축해서 짧은 slot 에 몰아 보낼 수 있다 → 같은 대역에 더 많은 사용자.\n# (참고, 외울 필요 없음) AMPS 832 → 416 → 21/395, reuse 7 · D-AMPS 48.6 kbps · GSM 124 채널, 270.8 kbps.\n\n== 관련 문서 ==\n\n* 앞 절: [[CH05 셀룰러 동작]] · 다음 절: [[CH05 IS-95·3G·4G]]\n* 세대: [[셀룰러 세대]] · [[1G]] · [[2G]] · [[셀룰러 세대 비교표]]\n* 1G: [[AMPS]] · [[AMPS 대역과 채널]] · [[AMPS control channel]] · [[FDMA]] · [[FM]]\n* 2G TDMA 계열: [[D-AMPS]] · [[7.95 kbps 디지털 음성]] · [[TDMA]] · [[GSM]] · [[GSM 대역]] · [[GSM 프레임 구조]] · [[GSM multiframe]] · [[GSM channel bit rate]] · [[GMSK]] · [[HLR]]\n* 2G CDMA 계열: [[IS-95]] · [[CDMA]]\n* 셀룰러 기초: [[cell]] · [[base station]] · [[MSC]] · [[frequency reuse]] · [[reuse factor]] · [[uplink와 downlink]] · [[handoff]]\n* 중간고사 선수 개념: [[mid:FDM|FDM]] · [[mid:TDM|TDM]] · [[mid:channelization|channelization]] · [[mid:FSK|FSK]] · [[mid:PSK|PSK]] · [[mid:guard band|guard band]] · [[mid:duplexing과 multiple access|duplexing과 multiple access]]\n* [[공식 모음]] · [[시험 정보]]"

  "body": "'''셀룰러 세대(generation, \"G\")'''는 [[cellular telephony]] 기술을 약 10 년 단위로 나눈 이름이다. L10 덱 p.18–36 이 1G 부터 4G 까지를 차례로 훑는다. 세대가 바뀔 때마다 바뀐 것은 크게 둘 — '''정보를 어떻게 표현하나'''(analog → digital → packet data → all-IP)와 '''대역을 사용자끼리 어떻게 나누나'''([[FDMA]] → [[TDMA]]/[[CDMA]] → wideband CDMA → …).\n\n{def}슬라이드의 세대별 첫 줄:\n* \"1st Generation (1G): AMPS — One of the leading '''analog''' cellular systems in North America. AMPS uses '''FDMA'''.\" (p.18)\n* \"2nd Generation (2G): Digital AMPS — The evolution of the analog AMPS into a '''digital''' system.\" (p.21) / GSM (p.23) / IS-95 \"Based on DSSS and CDMA\" (p.27)\n* \"3rd Generation: IMT-2000 — A '''blueprint''' of 3G issued by ITU\" (p.33)\n* \"4th Generation — Expected to be a complete evolution in wireless communications … '''All IP, packet-switched''', networks\" (p.36){/def}\n\n== 이름에서 개념 끌어내기 ==\n'''Generation''' = \"세대\". 부모 세대와 자식 세대가 같은 집(주파수 대역·기지국)을 물려받아 살면서 '''사는 방식'''을 바꾸듯, 셀룰러도 이전 세대의 망을 최대한 재활용하며 진화했다 — 대표 예가 [[D-AMPS]] 가 [[AMPS]] 의 대역·채널을 '''그대로''' 물려받은 것.\n\n{analogy}🎭 '''음악 매체의 세대교체.''' 1G = '''라디오 생방송'''(아날로그 파형 그대로, 주파수마다 한 방송 = FDMA). 2G = '''CD'''(소리를 비트로 — 디지털, 압축 가능). 3G = '''MP3 다운로드'''(음성뿐 아니라 데이터, 인터넷 연결). 4G = '''스트리밍 앱'''(모든 것이 인터넷 패킷 — all-IP).{/analogy}\n\n[[anim:generations_timeline|1G → 2G → 3G → 4G 가 왼쪽에서 쌓이는 동안, 각 칸의 '대표 시스템 · 접근 방식 · 데이터 속도' 세 줄을 소리 내어 읽고, 맨 아래 '아날로그 → 디지털 → 데이터 → all-IP' 화살표로 한 문장 요약을 만들어 보라]]\n\n== 세대별 요약 ==\n{|\n! 세대 || 핵심 변화 || 대표 시스템 || 접근 방식 || 슬라이드\n|-\n| [[1G]] || '''analog''' 음성 || [[AMPS]] (North America) || [[FDMA]] || p.18–20\n|-\n| [[2G]] || '''digital''' 음성 || [[D-AMPS]], [[GSM]] / [[IS-95]] || FDMA+[[TDMA]] / [[CDMA]] || p.21–32\n|-\n| [[3G]] || 데이터·인터넷 (144 k / 384 k / 2 Mbps), packet + circuit || [[IMT-2000]] ([[W-CDMA]], [[CDMA 2000]]) || wideband CDMA || p.33–35\n|-\n| [[4G]] || '''all-IP''', packet-switched, 100 Mbps(이동) / 1 Gbps(정지) || — || — || p.36\n|}\n\n{info}이 위키의 그룹 구분: 1G·2G TDMA 계열은 [[CH05 1G–2G 셀룰러]], 2G CDMA(IS-95)·3G·4G 는 [[CH05 IS-95·3G·4G]]. 세대 전체 비교는 [[셀룰러 세대 비교표]].{/info}\n\n{exam}교수(10/20, 46:12–46:59)가 꼽은 '''세대 진화의 세 trend''': \"from '''analog to digital''', and from '''voice communication to data communication''', and from '''narrowband to wideband'''. These are key trends that we commonly see in wireless design.\" 구체적 수치보다 이 trend 를 이해하라고 했다.{/exam}\n\n{exam}\"각 세대의 대표 시스템과 다중 접속 방식\" 짝짓기: 1G AMPS–FDMA · 2G D-AMPS/GSM–TDMA · 2G IS-95–CDMA · 3G IMT-2000–W-CDMA/CDMA 2000 · 4G–all-IP.{/exam}\n\n== 관련 문서 ==\n* [[1G]] · [[2G]] · [[3G]] · [[4G]]\n* [[셀룰러 세대 비교표]] · [[CH05 1G–2G 셀룰러]]\n* 접근 방식: [[FDMA]] · [[TDMA]] · [[CDMA]] · [[mid:channelization|channelization]]"
 },
 "1G": {
  "title": "1G (1st Generation — 아날로그 셀룰러)",
  "category": [
   "2강 1G–2G",
   "용어"
  ],
  "body": "'''1G(1st Generation)'''는 최초의 셀룰러 세대로, 음성을 '''아날로그 파형 그대로''' 무선으로 보냈다. 슬라이드의 대표는 북미의 [[AMPS]] 다(L10 p.18–20).\n\n{def}\"1st Generation (1G): AMPS (Advanced Mobile Phone System) — One of the leading '''analog cellular systems''' in North America. AMPS uses '''FDMA''' to separate channels in a link.\" (p.18){/def}\n\n== 이름에서 개념 끌어내기 ==\n\"1G\" 라는 말은 2G 가 나온 뒤에 붙은 '''뒤늦은 이름'''이다. 당시엔 그냥 \"cellular\" 였다. 그래서 1G 를 정의하는 특징은 '''2G 와의 차이''' — '''analog'''(2G 는 digital)와 '''FDMA 만'''(2G 는 그 위에 TDMA·CDMA)이다.\n\n{analogy}🎭 '''워키토키 수백 대를 채널 다이얼만 다르게 맞춰 놓은 것.''' 각 통화가 자기 주파수(30 kHz) 하나를 통째로 차지하고, 목소리는 [[FM]] 라디오처럼 파형 그대로 실린다. 말을 쉬는 동안에도 주파수는 그 통화 몫이다.{/analogy}\n\n== 특징 ==\n{|\n! 항목 || 1G (AMPS)\n|-\n| 정보 표현 || '''analog''' (voice → [[FM]])\n|-\n| 다중 접속 || [[FDMA]] — 30 kHz 채널 1개 = 사용자 1명\n|-\n| 대역 || 824–849 MHz (uplink) / 869–894 MHz (downlink), 각 25 MHz = 832 채널 → [[AMPS 대역과 채널]]\n|-\n| 제어 || control channel 21 개는 10 kbps 디지털 → [[mid:FSK|FSK]] → [[AMPS control channel]]\n|-\n| handoff || [[hard handoff]] (\"Used in early systems\", p.16)\n|-\n| reuse factor || 7 → [[reuse factor]]\n|}\n\n[[img:L10-20.png|p.20 AMPS Transmission — 1G 의 전형: 3 kHz voice → FM → 30 kHz 칸 하나 (FDMA)|medium]]\n\n* 약점: 대역 효율이 낮다(사용자당 30 kHz), 도청이 쉽다(FM 라디오처럼 수신기만 있으면 들림 — 보충), 데이터 서비스 없음. → 디지털 [[2G]] 로.\n\n== 관련 문서 ==\n* [[셀룰러 세대]] · [[2G]] · [[AMPS]] · [[FDMA]] · [[CH05 1G–2G 셀룰러]]"
 },
 "AMPS": {
  "title": "AMPS (Advanced Mobile Phone System — 1G)",
  "category": [
   "2강 1G–2G",
   "용어"
  ],
  "body": "'''AMPS(Advanced Mobile Phone System)'''는 북미의 대표적인 [[1G]] 아날로그 셀룰러 시스템이다. 대역을 30 kHz 채널로 잘라 '''한 통화에 한 채널'''을 주는 [[FDMA]] 방식이고, 음성은 [[FM]], 제어는 [[mid:FSK|FSK]] 로 보낸다. L10 p.18–20.\n\n{def}\"1st Generation (1G): '''AMPS (Advanced Mobile Phone System)''' — One of the leading analog cellular systems in North America. AMPS uses FDMA to separate channels in a link.\" (p.18)\n\"Each band is 25 MHz, made of 832 30-kHz analog channels.\" (p.19)\n\"Voice channels are modulated using FM. Control channels use FSK to create 30 kHz analog signals.\" (p.20){/def}\n\n== 이름에서 개념 끌어내기 ==\n'''A'''dvanced '''M'''obile '''P'''hone '''S'''ystem — 지금 보면 전혀 \"advanced\" 하지 않지만, 이름이 붙은 1970–80 년대(Bell Labs 개발, 1983 년 상용화 — 보충)에는 차량 전화 정도이던 이동전화를 '''cell 구조와 [[handoff]]''' 로 대중화한 첨단 기술이었다. 이름의 \"advanced\" 는 그 이전 세대(cell 개념 없는 단일 대형 송신탑 방식) 대비라는 뜻.\n\n{analogy}🎭 '''주차장 칸.''' 25 MHz 주차장을 30 kHz 폭 칸 832 개로 그어 놓고, 차(통화) 한 대가 들어오면 칸 하나를 '''통화가 끝날 때까지''' 내준다. 차가 잠깐 멈춰 있어도(말을 안 해도) 칸은 비울 수 없다. 2G 의 [[D-AMPS]] 는 같은 칸을 3 대가 시간을 나눠 쓰는 발레파킹이다.{/analogy}\n\n[[anim:amps_bands|두 대역(MS band = uplink, BS band = downlink)에서 한 통화가 칸을 하나씩 짝으로 잡는 장면을 보라]]\n\n== 한눈에 ==\n{|\n! 항목 || 값 || 문서\n|-\n| 세대·지역 || 1G, North America, '''analog''' || [[1G]]\n|-\n| 다중 접속 || [[FDMA]] — 30 kHz 채널 1개 = 통화 1개 || [[FDMA]]\n|-\n| 대역 || MS band 824–849 MHz (reverse / uplink), BS band 869–894 MHz (forward / downlink) || [[AMPS 대역과 채널]]\n|-\n| 채널 || 30 kHz × 832 (방향당) → provider 당 416 → control 21 + voice 395 || [[AMPS 대역과 채널]]\n|-\n| reuse factor || 7 || [[reuse factor]]\n|-\n| voice 변조 || 3 kHz → [[FM]] → 30 kHz analog || [[FM]]\n|-\n| control 변조 || 10 kbps → [[mid:FSK|FSK]] → 30 kHz analog || [[AMPS control channel]]\n|}\n\n[[img:L10-18.png|p.18 AMPS 개념도 — 폰과 tower 는 \"a regular radio, on a specific frequency\", tower 들은 유선으로 cell carrier 망 → 일반 전화망|medium]]\n\n{exam}AMPS 를 한 줄로: \"'''analog'''(교수: \"leading analog, this is important\", 37:40) · North America · '''FDMA''' · voice '''FM''' / control '''FSK'''(control 만 digital) · 두 band = '''downlink(BS→MS) / uplink(MS→BS)'''.\"{/exam}\n\n{info}채널 수(832 / 416 / 21 / 395)·reuse 7 같은 수치는 교수가 \"I'm not going to recommend you to memorize all these specific numbers … understand how communication systems evolve across generations\"(10/20, 41:54)라고 했다. 구조 이해용으로만.{/info}\n\n{warn}AMPS 와 [[D-AMPS]] 는 '''대역·채널이 똑같다'''. 차이는 채널 안: AMPS = 아날로그 음성 1명(FM), D-AMPS = 디지털 음성 3명(TDMA + QPSK).{/warn}\n\n== 관련 문서 ==\n* [[1G]] · [[AMPS 대역과 채널]] · [[AMPS control channel]] · [[FDMA]] · [[FM]]\n* 후속: [[D-AMPS]] · 전체: [[CH05 1G–2G 셀룰러]]"
 },
 "AMPS 대역과 채널": {
  "title": "AMPS 대역과 채널 (824–849 / 869–894 MHz, 832 → 416 → 395)",
  "category": [
   "2강 1G–2G",
   "용어"
  ],
  "body": "'''AMPS 대역과 채널'''은 [[AMPS]] 가 주파수를 어떻게 잘라 쓰는지에 대한 L10 p.19 의 내용이다. 방향마다 25 MHz 대역 하나씩(두 대역), 각 대역을 30 kHz 채널 832 개로 나누고, 한 지역의 두 provider 가 반씩(416) 가져가며, 그중 21 개는 control 용이다. 사용자가 '''\"다시\"''' 와 '''\"416 channels ? 다시\"''' 를 적어 둔 슬라이드다.\n\n{def}\"Each band is '''25 MHz''', made of '''832 30-kHz analog channels'''.\nForward communication: base to mobile. Reverse communication: mobile to base.\nTwo providers can share an area, which means '''416 channels in each cell for each provider'''. Among 416, '''21 channels are used for control'''.\nAMPS has a frequency '''reuse factor of 7'''.\" (p.19){/def}\n\n[[img:L10-19.png|p.19 AMPS Bands — Mobile station band 824–849 MHz, Base station band 869–894 MHz, 채널 30 kHz (필기본: Downlink = Forward, uplink = Reverse, \"다시\", \"416 channels ? 다시\")|large]]\n\n== 이름에서 개념 끌어내기 ==\n* '''Mobile station band''' — 이름이 \"누가 '''송신'''하나\"를 말한다: mobile 이 보내는 대역 → '''reverse''' = [[uplink와 downlink|uplink]].\n* '''Base station band''' — base 가 보내는 대역 → '''forward''' = downlink.\n* '''forward / reverse''' 는 '''기지국 관점'''의 이름이다: 망(기지국)에서 사용자 쪽으로 \"앞으로\" 내보내는 게 forward, 사용자에서 망으로 \"거꾸로\" 올라오는 게 reverse. ([[GSM 대역]] · IS-95 에서도 같은 이름을 쓴다.)\n\n{analogy}🎭 '''왕복 2 차선 도로.''' 하행선(downlink, 869–894)과 상행선(uplink, 824–849)이 따로 있고, 각 도로에 30 kHz 폭 차선이 832 개. 통화 한 건 = '''상행 차선 하나 + 하행 차선 하나'''를 짝으로 빌리는 것. 이 도로를 두 회사(provider)가 차선을 반씩(416) 나눠 운영하고, 각 회사는 21 개 차선을 '''안내 방송용'''(control)으로 남겨 둔다.{/analogy}\n\n[[anim:amps_bands|MS band(uplink)과 BS band(downlink)가 나란히 그려진 뒤 한 MS 가 두 대역에서 채널을 하나씩 짝으로 잡는 것을 보고, 각 대역이 25 MHz = 832 × 30 kHz 임을 확인하라]]\n\n{exam}교수(10/20, 40:00 · 42:20 · 42:57): \"'''I recommend you to memorize these uplink and downlink by imagining this illustration.''' Down from BS to MS, and up from MS to BS.\" / \"You should memorize this terminology.\" — downlink: 송신 BS, 수신 MS · uplink: 송신 MS, 수신 BS. \"Almost every communication system operates two different frequency bands for downlink and uplink.\"{/exam}\n\n{info}아래 채널 수 계산은 구조 이해용이다. 교수: \"Now you see many different numbers … I'm not going to recommend you to memorize all these specific numbers … You don't have to memorize these number of channels\"(41:33–42:20). 필기 \"416 channels ? 다시\" 도 수업에서는 따로 설명 없이 이 말로 넘어갔다.{/info}\n\n== 계산 ==\n<pre class=\"txt\">\n1. 대역 폭          849 − 824 = 25 MHz        (869–894 도 25 MHz)\n2. 채널 수          25,000 kHz ÷ 30 kHz = 833.3  → '''832''' 채널 (방향당; 남는 조각은 guard)\n3. provider 2 곳    832 ÷ 2 = '''416''' / provider\n4. control          '''21'''  →  voice = 416 − 21 = '''395'''\n5. reuse factor 7   cell 당 voice ≈ 395 ÷ 7 ≈ '''56'''   ← 파생값 (슬라이드에 없음)\n<\/pre>\n\n[[sim:band_channels]]\n\n{warn}'''\"다시\" — 헷갈리는 두 군데만.'''\n# '''방향 이름''': 슬라이드 그림에서 \"Forward: base to mobile\" 화살표가 BS 대역(오른쪽)에서 '''출발'''해 MS 로 간다. 즉 869–894 는 '''BS 가 보내는''' 대역 = downlink. 824–849 는 '''MS 가 보내는''' 대역 = uplink. 주파수가 낮은 쪽이 uplink 라고 외워도 된다(GSM 도 890–915 가 uplink).\n# '''832 는 \"한 방향\" 개수''': 양쪽 대역에 832 개씩 있고, 통화는 둘을 짝으로 쓴다. \"832 × 2 = 1664 통화\" 가 '''아니다''' — 양방향 통화 832 개.{/warn}\n\n{tip}'''필기 속 질문: \"416 channels ? 다시\"'''\n416 = 832 ÷ 2. 미국은 한 지역에 이동통신 사업자를 '''두 곳'''(A/B) 허가해 경쟁시켰고, 각자 대역의 절반을 받았다(보충). 그래서 '''한 provider 가 가진 채널 = 416'''. 416 안에서 21 개는 [[AMPS control channel|control]](통화 설정·[[paging]]), 395 개는 voice.\n슬라이드의 \"in each cell\" 은 느슨한 표현이다: reuse factor 7 이므로 이 416(정확히는 voice 395)을 '''인접한 7 개 cell 이 나눠''' 쓴다. 한 cell 이 동시에 쓸 수 있는 voice 채널은 대략 395 / 7 ≈ 56 개. → [[frequency reuse]], [[reuse factor]]{/tip}\n\n{quiz}AMPS 의 각 대역은 25 MHz, 채널 폭은 30 kHz 다. 두 provider 가 한 지역을 나눠 쓰고, provider 당 21 개 채널이 control 용이다. provider 당 voice 채널 수는?{/quiz}\n{answer}25 MHz / 30 kHz = 833.3 → 832 채널. 832 / 2 = 416. 416 − 21 = '''395''' voice 채널. (reuse factor 7 을 적용하면 cell 당 약 56 개 — 묻는다면 395/7.){/answer}\n\n== 관련 문서 ==\n* [[AMPS]] · [[AMPS control channel]] · [[FDMA]] · [[uplink와 downlink]] · [[reuse factor]]\n* 비교: [[GSM 대역]] · [[IS-95 대역과 채널]] · 전체: [[CH05 1G–2G 셀룰러]]"
 },
