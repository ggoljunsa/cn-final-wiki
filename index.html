   "용어"
  ],
  "body": "'''FDMA(Frequency-Division Multiple Access)'''는 공유 대역을 '''주파수 띠(채널)'''로 나눠 사용자마다 다른 띠를 주는 다중 접속 방식이다. 1G [[AMPS]] 의 방식이고(30 kHz × 832), 2G [[D-AMPS]] · [[GSM]] 도 '''바깥 층'''은 FDMA 다(그 안에 [[TDMA]]).\n\n{def}\"AMPS uses '''FDMA''' to separate channels in a link.\" (p.18)\np.20 · p.22 · p.25 그림의 회색 상자 \"FDMA\": 25-MHz band 를 같은 폭(30 kHz / 200 kHz)의 채널로 나누고 사용자(또는 사용자 묶음)마다 다른 채널이 칠해져 있다.{/def}\n\n== 이름에서 개념 끌어내기 ==\n'''F'''requency-'''D'''ivision = 주파수로 나눔, '''M'''ultiple '''A'''ccess = 여러 사용자가 하나의 매체에 접근. 중간고사 범위의 [[mid:FDM|FDM]](Frequency-Division '''Multiplexing''')과 원리는 같다. 차이는 '''누가''' 나누느냐:\n* FDM: 한 장비(MUX)가 여러 입력을 '''한 링크에 합치는''' physical-layer 기술\n* FDMA: '''서로 다른 사용자'''(MS 들)가 공유 매체를 나눠 쓰는 data-link 의 [[mid:channelization|channelization]] 방법\n교재(Forouzan)도 \"FDMA 는 data-link layer 의 access method, FDM 은 physical layer 기술\" 이라고 구분한다(보충).\n\n{analogy}🎭 '''라디오 방송국.''' FM 89.1, 91.9, 95.1 … 방송국마다 주파수가 다르니 동시에 방송해도 섞이지 않는다. AMPS 에서는 통화 하나하나가 방송국 하나다. 단, 방송국(통화)이 쉬는 동안에도 그 주파수는 다른 사람이 쓸 수 없다 — FDMA 의 낭비.{/analogy}\n\n[[anim:access_methods|첫 장면(FDMA)에서 주파수 축이 띠로 나뉘는 것을 보고, 다음 장면 TDMA·CDMA 와 무엇이 다른지 한 줄씩 적어 보라]]\n\n[[img:L10-20.png|p.20 AMPS Transmission — 오른쪽 회색 상자 \"FDMA\": 25-MHz band 를 30 kHz 채널 832 개로, 사용자마다 다른 칸|medium]]\n\n== 셀룰러에서의 FDMA ==\n{|\n! 시스템 || 채널 폭 || 채널 수 || 한 채널 안\n|-\n| [[AMPS]] (1G) || 30 kHz || 832 || 사용자 1명 (FDMA 만)\n|-\n| [[D-AMPS]] (2G) || 30 kHz || 832 || TDMA 로 3명\n|-\n| [[GSM]] (2G) || 200 kHz || 124 || TDMA 로 8명\n|-\n| [[IS-95]] (2G) || 1.228 MHz || 20 (provider 당 10) || [[CDMA]] 로 64 code\n|}\n\n{warn}\"2G = TDMA 니까 FDMA 는 1G 만\" — '''틀림'''. D-AMPS·GSM·IS-95 모두 대역을 먼저 '''주파수 채널로 나눈 뒤'''(FDMA) 그 안을 TDMA/CDMA 로 다시 나눈다. 순수 FDMA 만 쓰는 것이 1G AMPS 다.{/warn}\n\n* 장점: 단순하다, 동기화가 필요 없다(시간 슬롯이 없으니). 단점: 채널 사이 [[mid:guard band|guard band]] 낭비, 쉬는 채널도 점유, 채널당 사용자 1명이라 용량이 작다.\n\n== 관련 문서 ==\n* [[TDMA]] · [[CDMA]] · [[AMPS]] · [[셀룰러 세대]]\n* 중간고사: [[mid:FDM|FDM]] · [[mid:channelization|channelization]] · [[mid:guard band|guard band]]"
 },
 "FM": {
  "title": "FM (Frequency Modulation — AMPS voice 채널의 변조)",
  "category": [
   "2강 1G–2G",
   "용어"
  ],
  "body": "'''FM(Frequency Modulation, 주파수 변조)'''은 아날로그 신호(음성)의 '''크기 변화를 반송파의 주파수 변화'''로 바꿔 싣는 analog-to-analog 변조다. 1G [[AMPS]] 의 '''voice 채널'''이 FM 으로 3 kHz 음성을 30 kHz 아날로그 신호로 만든다(L10 p.20).\n\n{def}\"'''Voice''' channels are modulated using '''FM'''.\" (p.20)\n그림: \"3 kHz Voice → [FM] → 30 kHz Analog\" × (voice 채널 수){/def}\n\n== 이름에서 개념 끌어내기 ==\n'''Frequency''' '''Modulation''' = \"주파수를 조절(변조)\". [[mid:carrier|carrier]](반송파)의 세 성질(amplitude · frequency · phase) 중 '''frequency''' 를 입력 신호에 따라 흔든다. 입력이 커지면 주파수가 올라가고, 작아지면 내려간다. 같은 원리를 '''디지털 입력'''(0/1)에 쓰면 중간고사에서 배운 [[mid:FSK|FSK]](Frequency Shift Keying) — 그래서 AMPS 의 control 채널(10 kbps)은 FSK 다. '''FM ↔ FSK = 입력이 analog 냐 digital 이냐'''의 차이일 뿐 같은 가족이다.\n\n{analogy}🎭 '''사이렌.''' 사이렌 소리의 크기는 일정한데 음 높이가 오르내린다 — 정보가 \"높낮이(주파수)\"에 실려 있다. FM 라디오도, AMPS 통화도 같다. 그래서 잡음이 진폭을 흔들어도 높낮이는 덜 흔들려 '''잡음에 강하다'''(AM 대비 — 보충).{/analogy}\n\n[[img:L10-20.png|p.20 AMPS Transmission — voice(빨간 네모 필기)는 FM, control 은 FSK|medium]]\n\n== 왜 3 kHz 가 30 kHz 가 되나 ==\nFM 신호의 대역폭은 원 신호보다 '''훨씬 넓다'''. 카슨 규칙(보충 — 슬라이드에 없음) $B_{FM} \\approx 2(1+\\beta)B$ 에서 음성 $B = 3$ kHz, 변조 지수 $\\beta$ 가 4 정도면 $2 \\times 5 \\times 3 = 30$ kHz. 넓은 대역을 쓰는 대신 음질이 좋고 잡음에 강하다. 이 \"대역 낭비\"를 디지털 압축 + [[TDMA]] 로 줄인 것이 [[D-AMPS]] 다.\n\n{info}중간고사 위키는 digital-to-analog(ASK/FSK/PSK/QAM)만 다뤘고 analog-to-analog(AM/FM/PM)는 다루지 않았다. 이 과목에서 FM 은 \"AMPS voice 채널의 변조\" 로만 나온다. → [[mid:modulation|modulation]]{/info}\n\n{exam}AMPS: '''voice = FM''', '''control = FSK'''. 둘을 바꿔 쓰는 함정 주의.{/exam}\n\n== 관련 문서 ==\n* [[AMPS]] · [[AMPS control channel]] · [[1G]]\n* 중간고사: [[mid:FSK|FSK]] · [[mid:modulation|modulation]] · [[mid:carrier|carrier]]\n* 2G 의 변조와 비교: [[QPSK]] (D-AMPS) · [[GMSK]] (GSM)"
 },
 "AMPS control channel": {
  "title": "AMPS control channel (21 개, 10 kbps → FSK)",
  "category": [
   "2강 1G–2G",
   "용어"
  ],
  "body": "'''AMPS control channel'''은 [[AMPS]] 에서 provider 당 416 채널 중 '''21 개'''를 차지하는 제어 전용 채널이다. 음성이 아니라 통화 설정·[[paging]]·채널 할당 같은 '''명령'''을 나르며, 10 kbps '''디지털''' 데이터를 [[mid:FSK|FSK]] 로 30 kHz 아날로그 신호로 만들어 보낸다. L10 p.19–20.\n\n{def}\"Among 416, '''21 channels are used for control'''.\" (p.19)\n\"'''Control channels use FSK''' to create 30kHz analog signals.\" (p.20) — 그림: \"10 kbps control → [FSK] → 30 kHz Analog\"{/def}\n\n== 이름에서 개념 끌어내기 ==\n'''control''' = 대화 내용이 아니라 대화를 '''관리'''하는 신호. 셀룰러 동작에서 MS 가 \"가장 강한 '''setup channel'''\" 을 scan 해 번호를 보내고([[통화 발신 과정]]), MSC 가 모든 cell 에 query 를 날리는 것([[통화 수신 과정]], [[paging]])이 바로 이 채널 위에서 일어난다. voice channel 은 그 뒤 MSC 가 '''할당'''해 준다.\n\n{analogy}🎭 '''식당의 카운터(control)와 테이블(voice).''' 손님(MS)은 먼저 카운터에 가서 \"2 명이요\"(번호) 라고 말하고, 직원(MSC)이 빈 테이블(unused voice channel)을 배정한다. 식사(통화)는 테이블에서 한다. 카운터는 21 개뿐이지만 짧은 대화만 하니 충분하다.{/analogy}\n\n[[img:L10-20.png|p.20 아래 두 줄 — 10 kbps control → FSK → 30 kHz Analog (필기본: 빨간 상자 \"Digital communication\")|medium]]\n\n== 왜 control 만 디지털인가 ==\n* 필기 \"'''Digital communication'''\" 이 핵심. AMPS 는 \"analog system\" 이지만 control 정보(전화번호, 채널 번호, 명령)는 '''비트'''다. 음성은 조금 찌그러져도 알아듣지만, 채널 번호가 한 자리 틀리면 통화가 엉뚱한 채널로 간다 → '''정확성이 중요한 정보는 디지털'''.\n* 비트를 무선으로 보내려면 [[mid:digital-to-analog conversion|digital-to-analog conversion]] 이 필요하다 → [[mid:FSK|FSK]](0/1 을 두 주파수로).\n* 출력은 voice 채널과 같은 '''30 kHz''' 칸 — FDMA 격자 안에 그대로 들어간다.\n\n{|\n! || voice channel || control channel\n|-\n| 개수 (provider 당) || 395 || '''21'''\n|-\n| 입력 || 3 kHz analog 음성 || '''10 kbps digital'''\n|-\n| 변조 || [[FM]] || [[mid:FSK|FSK]]\n|-\n| 출력 || 30 kHz analog || 30 kHz analog\n|-\n| 용도 || 통화 내용 || 통화 설정, paging, 채널 할당\n|}\n\n== 관련 문서 ==\n* [[AMPS]] · [[AMPS 대역과 채널]] · [[FM]]\n* [[통화 발신 과정]] · [[통화 수신 과정]] · [[paging]]"
 },
 "2G": {
  "title": "2G (2nd Generation — 디지털 셀룰러)",
  "category": [
   "2강 1G–2G",
   "용어"
  ],
  "body": "'''2G(2nd Generation)'''는 음성을 '''디지털화'''한 셀룰러 세대다. 슬라이드는 세 시스템을 다룬다 — 북미의 [[D-AMPS]](TDMA), 유럽의 [[GSM]](TDMA), 북미·한국의 [[IS-95]](CDMA). L10 p.21–32.\n\n{def}\"2nd Generation (2G): Digital AMPS (D-AMPS) — The evolution of the analog AMPS into a '''digital''' system.\" (p.21)\n\"2nd Generation: GSM — A European standard for a common 2G technology for all Europe.\" (p.23)\n\"2nd Generation: IS-95 — One of the dominant 2G standards in North America (and South Korea). Based on DSSS and CDMA.\" (p.27){/def}\n\n== 이름에서 개념 끌어내기 ==\n1G 와 2G 를 가르는 단어는 단 하나 — '''digital'''. 음성을 비트로 바꾸자 세 가지가 가능해졌다: ① '''압축'''(3 kHz 음성 → 수 kbps), ② 압축한 비트를 짧은 시간 슬롯에 '''몰아 보내기'''([[TDMA]]) 또는 코드로 '''퍼뜨리기'''([[CDMA]]), ③ '''오류 제어 비트'''를 붙이기(GSM 의 65 → 114 bits). 결과는 같은 대역에서 '''더 많은 사용자'''.\n\n{analogy}🎭 '''손편지(1G) → 이메일(2G).''' 손편지는 한 장에 한 사람 글씨가 그대로 담기지만(아날로그), 이메일은 글자를 비트로 바꾸니 압축·암호화·오류 검사를 할 수 있고, 한 회선으로 여러 사람의 메일을 번갈아 보낼 수 있다.{/analogy}\n\n[[anim:generations_timeline|2G 칸에 D-AMPS·GSM(TDMA)과 IS-95(CDMA) 두 갈래가 함께 쌓이는 것을 보라]]\n\n== 2G 세 시스템 ==\n{|\n! || [[D-AMPS]] || [[GSM]] || [[IS-95]]\n|-\n| 지역 || North America || Europe || North America, South Korea\n|-\n| 다중 접속 || FDMA + '''TDMA''' (3) || FDMA + '''TDMA''' (8) || FDMA + '''CDMA''' (64 code)\n|-\n| 채널 폭 || 30 kHz (AMPS 와 같음) || 200 kHz || 1.228 MHz\n|-\n| 변조 || [[QPSK]] || [[GMSK]] || [[QPSK]]\n|-\n| 디지털 음성 || 7.95 kbps || 13 kbps || 9.6 kbps\n|}\n\n[[img:L10-22.png|p.22 AMPS(analog) vs D-AMPS(digitized) — 1G → 2G 의 차이가 한 장에|medium]]\n\n{exam}\"2G 의 핵심 변화는?\" → '''analog → digital'''. 그 덕에 '''TDMA'''(D-AMPS, GSM) 또는 '''CDMA'''(IS-95) 로 한 주파수 채널을 여러 사용자가 공유.{/exam}\n\n== 관련 문서 ==\n* [[셀룰러 세대]] · [[1G]] · [[3G]]\n* [[D-AMPS]] · [[GSM]] · [[IS-95]] · [[TDMA]] · [[CDMA]]\n* [[CH05 1G–2G 셀룰러]] · [[CH05 IS-95·3G·4G]]"
 },
 "D-AMPS": {
  "title": "D-AMPS (Digital AMPS — 2G, TDMA)",
  "category": [
   "2강 1G–2G",
   "용어"
  ],
  "body": "'''D-AMPS(Digital AMPS)'''는 [[AMPS]] 를 디지털로 진화시킨 북미의 [[2G]] 시스템이다. AMPS 와 '''같은 대역·같은 30 kHz 채널'''을 그대로 쓰면서, 음성을 디지털화해 '''3 명을 [[TDMA]] 로''' 한 채널에 넣는다(48.6 kbps → [[QPSK]] → 30 kHz). L10 p.21–22.\n\n{def}\"2nd Generation (2G): Digital AMPS (D-AMPS) — The '''evolution of the analog AMPS into a digital system'''.\nBand: The '''same bands and channels''' as AMPS.\nTransmission: Voice channel is '''digitized''' to 7.95 kbps. '''Three''' digital voice channels are combined using '''TDMA''' (48.6 kbps with overhead).\" (p.21){/def}\n\n== 이름에서 개념 끌어내기 ==\n'''D'''igital + '''AMPS''' — 이름이 정의 그 자체다. \"AMPS 인데 디지털\". AMPS 의 무엇을 그대로 두고 무엇을 바꿨는지가 이름에 다 들어 있다: '''AMPS'''(대역·채널·cell 구조 유지) + '''Digital'''(채널 안의 음성 처리 방식 변경). 기존 기지국 주파수 면허와 대역 계획을 버리지 않고 용량을 3 배로 올리는 '''점진적 업그레이드'''.\n\n{analogy}🎭 '''같은 차선, 버스 전용 차로화.''' 30 kHz 차선(채널)은 그대로인데, 승용차(아날로그 통화) 한 대가 달리던 차선에 3 명을 태운 버스(TDMA 프레임)를 다니게 했다. 도로 공사(대역 변경) 없이 수송량 3 배.{/analogy}\n\n[[anim:damps_tdma_anim|왼쪽 AMPS(음성 1 → FM → 30 kHz)와 오른쪽 D-AMPS(음성 3 → digitizer → 슬롯 1·2·3 → QPSK → 같은 30 kHz)를 나란히 보고 '같은 대역에서 3 배 사용자'를 확인하라]]\n\n[[img:L10-22.png|p.22 D-AMPS Transmission — 3 kHz Voice → Digitizer 7.95 kbps × 3 → TDMA(1 2 3 1 2 3) 48.6 kbps → QPSK → 30 kHz, Channel 001 … 832 FDMA (필기본: \"voice: digitized\", TDMA 동그라미)|large]]\n\n== 전송 과정 ⭐⭐ ==\n<pre class=\"txt\">\n1. 3 kHz analog 음성 × 3 사용자\n2. Digitizer            → 사용자당 7.95 kbps        ([[7.95 kbps 디지털 음성]])\n3. 3 명 합              → 3 × 7.95 = 23.85 kbps\n4. [[TDMA]] (+ overhead) → '''48.6 kbps'''              (슬롯 1 2 3 1 2 3 …)\n5. [[QPSK]]              → '''30 kHz''' analog 신호\n6. FDMA                 → Channel 001 … 832 중 하나\n<\/pre>\n\n[[sim:damps_tdma]]\n\n{|\n! || [[AMPS]] (1G) || D-AMPS (2G)\n|-\n| 대역·채널 || 824–849 / 869–894 MHz, 30 kHz × 832 || '''같음'''\n|-\n| 음성 || analog || '''digitized''' (7.95 kbps)\n|-\n| 채널당 사용자 || 1 || '''3'''\n|-\n| 다중 접속 || [[FDMA]] || FDMA + '''TDMA'''\n|-\n| 변조 || voice [[FM]] / control FSK || [[QPSK]]\n|}\n\n{warn}D-AMPS 는 \"TDMA 시스템\" 이지만 FDMA 를 버리지 않았다. '''832 개 30 kHz 채널(FDMA) 각각을 3 개 시간 슬롯(TDMA)으로''' 나눈다.{/warn}\n\n{info}필기 \"기억 x\"(7.95 kbps 옆) — '''녹음으로 확정''': \"I would not recommend you to memorize these specific numbers. You will not see some OX quizzes that ask these kind of specific numbers.\" (10/20, 45:50–46:07; AMPS Bands 에서도 41:54). 기억할 것은 trend — \"Evolving from '''analog''' communication to '''digital'''\" — 와 \"같은 대역 · voice digitized · TDMA\".{/info}\n\n{exam}교수(10/20): D-AMPS 는 \"an evolution … of AMPS, which is an analog one, into a '''digital''' system\". AMPS 대비 key differences = voice 가 digital · 변조 QPSK · '''TDMA''' 로 voice user 공유(FDMA 와 hybrid). 대역은 AMPS 와 같다.{/exam}\n\n== 관련 문서 ==\n* [[AMPS]] · [[TDMA]] · [[7.95 kbps 디지털 음성]] · [[QPSK]] · [[2G]]\n* 같은 TDMA 계열: [[GSM]] · 전체: [[CH05 1G–2G 셀룰러]]"
 },
 "7.95 kbps 디지털 음성": {
  "title": "7.95 kbps 디지털 음성 (D-AMPS 의 digitized voice)",
  "category": [

   "용어"
  ],
  "body": "'''7.95 kbps 디지털 음성'''은 [[D-AMPS]] 가 3 kHz 아날로그 음성을 '''digitize''' 한 결과의 bit rate 다. 이 사용자 3 명분을 [[TDMA]] 로 묶으면(overhead 포함) 48.6 kbps 가 된다. L10 p.21–22. 사용자가 이 수치 옆에 '''\"기억 x\"''' 라고 적어 두었다.\n\n{def}\"Voice channel is '''digitized to 7.95 kbps'''. Three digital voice channels are combined using TDMA (48.6 kbps with overhead).\" (p.21)\n그림: \"3 kHz Voice → [Digitizer] → 7.95 kbps\" × 3 (p.22){/def}\n\n{info}'''필기 \"기억 x\" — 녹음으로 확정: 수치 암기 불필요.''' 교수(10/20, 45:50–46:07): \"I would not recommend you to memorize these specific numbers. '''You will not see some OX quizzes that ask these kind of specific numbers.''' Again, I ask you to understand the trend of evolution.\" (AMPS Bands 에서도 41:54 에 같은 말.) 시험에서 기억할 것은 \"'''voice 를 digitize 한다 → 그래서 TDMA 로 3 명을 묶을 수 있다'''\" 는 흐름과, 결과 '''48.6 kbps''' 가 30 kHz 채널 하나에 들어간다는 것.{/info}\n\n== 이름에서 개념 끌어내기 ==\n'''digitized''' = 연속 파형을 숫자(비트) 열로 바꿈. 중간고사에서 배운 [[mid:PCM|PCM]](sampling → quantization → encoding)이 기본 방법이다. 그런데 PCM 으로 전화 음성을 바꾸면 보통 8,000 samples/s × 8 bits = '''64 kbps''' 다. 7.95 kbps 는 그 '''1/8''' 수준 — D-AMPS 의 digitizer 는 단순 PCM 이 아니라 사람 목소리의 특징만 뽑아 보내는 '''음성 압축 코덱'''(vocoder, VSELP)이기 때문이다(보충 — 슬라이드는 \"Digitizer\" 상자 하나로만 그림).\n\n{analogy}🎭 '''녹음 파일(64 kbps PCM)과 음성 메모 앱의 압축 파일(7.95 kbps).''' 같은 목소리라도 사람 말소리에 필요한 정보만 남기면 훨씬 작아진다. 작아진 덕에 3 명분을 한 30 kHz 채널에 돌아가며 실을 수 있다.{/analogy}\n\n[[img:L10-21.png|p.21 D-AMPS — \"Voice channel is digitized to 7.95 kbps\" (필기본: 7.95 kbps 옆 \"기억 x\")|medium]]\n\n== 숫자 흐름 ==\n<pre class=\"txt\">\n3 kHz analog voice\n  → Digitizer               7.95 kbps / 사용자\n  → × 3 사용자               23.85 kbps\n  → TDMA + overhead         48.6 kbps          (overhead ≈ 24.75 kbps — 파생값)\n  → [[QPSK]]                  30 kHz analog 채널\n<\/pre>\n\n[[sim:damps_tdma]]\n\n[[anim:damps_tdma_anim|digitizer 상자에서 7.95 kbps 비트열이 나와 TDMA 슬롯으로 끼워지는 순간을 보라]]\n\n* 비교: [[GSM]] 의 digitizer 출력은 13 kbps(p.25), [[IS-95]] 는 9.6 kbps. 세 값 모두 \"2G 는 음성을 수~십수 kbps 로 디지털화\" 정도로 이해하면 충분하다.\n\n== 관련 문서 ==\n* [[D-AMPS]] · [[TDMA]] · [[2G]]\n* 중간고사: [[mid:PCM|PCM]] · [[mid:sampling|sampling]] · [[mid:bit rate|bit rate]]"
 },
 "TDMA": {
  "title": "TDMA (Time-Division Multiple Access)",
  "category": [
   "2강 1G–2G",
   "용어"
  ],
  "body": "'''TDMA(Time-Division Multiple Access)'''는 하나의 채널을 '''시간 슬롯'''으로 나눠 사용자들이 차례로 쓰는 다중 접속 방식이다. 2G [[D-AMPS]](30 kHz 채널을 3 명)와 [[GSM]](200 kHz 채널을 8 명)이 TDMA 이며, 둘 다 바깥 층은 [[FDMA]] 다. L10 p.21–22, p.25–26.\n\n{def}\"Three digital voice channels are combined using '''TDMA''' (48.6 kbps with overhead).\" (p.21, D-AMPS)\np.22 그림: 슬롯 \"1 2 3 1 2 3 — TDMA\". p.25 그림: \"time slot → frame(8 slots) → multiframe(26 frames)\" 를 감싼 점선 상자에 세로로 \"T D M A\".{/def}\n\n== 이름에서 개념 끌어내기 ==\n'''T'''ime-'''D'''ivision = 시간으로 나눔, '''M'''ultiple '''A'''ccess = 여러 사용자의 접근. 중간고사의 [[mid:TDM|TDM]](Time-Division Multiplexing)과 원리가 같고, FDM↔[[FDMA]] 관계처럼 TDM 은 physical-layer 의 합치기 기술, TDMA 는 서로 다른 사용자가 매체를 나누는 [[mid:channelization|channelization]] 방법이다. Bluetooth 의 [[mid:TDD-TDMA|TDD-TDMA]] 에서 이미 TDMA 를 한 번 봤다.\n\n{analogy}🎭 '''돌림 노래 마이크 한 개.''' 마이크(30 kHz 채널)는 하나인데 세 사람이 1 초씩 돌아가며 말한다. 각자 할 말을 미리 '''압축해 적어 두었다가'''(digitize) 자기 차례에 빨리 읽으니, 듣는 쪽에서는 세 명 모두 끊김 없이 말하는 것처럼 들린다.{/analogy}\n\n[[anim:access_methods|두 번째 장면(TDMA)에서 같은 주파수 띠가 시간 슬롯 user 1·2·3 으로 나뉘는 것을 보고 FDMA 장면과 비교하라]]\n\n[[img:L10-25.png|p.25 GSM — time slot / frame / multiframe 을 감싼 점선이 TDMA, 그 바깥 200 kHz × 124 가 FDMA (필기본)|medium]]\n\n== 왜 2G 에서야 TDMA 가 가능했나 ⭐⭐ ==\n아날로그 음성은 '''끊기지 않는 연속 파형'''이라 \"1/3 시간만 보내라\" 가 안 된다. 디지털 비트는 '''버퍼에 모았다가 짧은 슬롯에 몰아서(빠른 rate 로) 보내고''', 수신 측에서 다시 원래 속도로 풀 수 있다. 그래서 '''digitization 이 TDMA 의 전제'''다 — [[1G]] 가 FDMA 뿐이고 [[2G]] 에서 TDMA 가 등장한 이유.\n\n{|\n! 시스템 || 채널 (FDMA) || 채널당 슬롯 (TDMA) || 채널 rate\n|-\n| [[D-AMPS]] || 30 kHz × 832 || 3 || 48.6 kbps\n|-\n| [[GSM]] || 200 kHz × 124 || 8 || 270.8 kbps\n|}\n\n[[sim:damps_tdma]]\n\n{warn}TDMA 시스템도 '''동기화'''가 필요하고(각 MS 가 자기 슬롯 시각을 정확히 지켜야 함), 슬롯마다 '''TDMA control bits'''(동기·guard)가 붙는다 — GSM 에서 114 → 156.25 bits 로 늘어나는 부분. 이것이 \"48.6 kbps '''with overhead'''\" 의 overhead 다.{/warn}\n\n{exam}\"D-AMPS 와 GSM 의 다중 접속 방식은?\" → '''TDMA'''(FDMA 위에). IS-95 는 '''CDMA'''. AMPS 는 '''FDMA'''.{/exam}\n\n== 관련 문서 ==\n* [[FDMA]] · [[CDMA]] · [[D-AMPS]] · [[GSM]] · [[GSM 프레임 구조]]\n* 중간고사: [[mid:TDM|TDM]] · [[mid:TDD-TDMA|TDD-TDMA]] · [[mid:channelization|channelization]]"
 },
 "GSM": {
  "title": "GSM (Global System for Mobile Communication — 2G, 유럽)",
  "category": [
   "2강 1G–2G",
   "용어"
  ],
  "body": "'''GSM(Global System for Mobile Communication)'''은 유럽 전체의 공통 [[2G]] 표준으로 만든 디지털 셀룰러 시스템이다. 대역은 890–915 MHz(uplink) / 935–960 MHz(downlink), 각 25 MHz 를 200 kHz × 124 채널로 나누고([[FDMA]]), 채널마다 8 명이 [[TDMA]] 로 공유한다. 채널 bit rate 270.8 kbps, 변조 [[GMSK]]. L10 p.23–26.\n\n{def}\"2nd Generation: GSM (Global System for Mobile Communication) — A '''European''' standard for a common 2G technology '''for all Europe'''.\" (p.23){/def}\n\n== 이름에서 개념 끌어내기 ==\n'''G'''lobal '''S'''ystem for '''M'''obile communication. 원래 약자는 프랑스어 ''Groupe Spécial Mobile''(표준을 만든 위원회 이름)이었고, 나중에 영어 이름으로 바꿨다(보충). 출발점은 \"'''for all Europe'''\" — 1G 시절 유럽은 나라마다 방식이 달라 국경을 넘으면 폰이 안 됐다. 하나의 공통 표준을 만들자 → 결국 전 세계로 퍼져 이름처럼 '''global''' 해졌다.\n\n{analogy}🎭 '''유로화.''' 나라마다 다른 화폐(1G 방식)를 쓰다가 하나의 통화(GSM)로 통일하니 국경을 넘어도 그대로 쓸 수 있다 — GSM 의 [[roaming]] 이 유럽에서 자연스러웠던 이유.{/analogy}\n\n[[img:L10-23.png|p.23 GSM 구성 — MS · BS(= Cell) → MSC(Mobile-Services Switching Center) → PSTN → Telephone, MSC 옆에 HLR (그림의 \"HRL- Home Loaction Register\" 는 오타) (필기본)|medium]]\n\n== 구성 (p.23) ==\n* [[mobile station]] + [[base station]] = 한 [[cell]] (필기 빨간 원)\n* [[MSC]] — 그림에서는 '''Mobile-Services Switching Center''' (일반 셀룰러 용어 Mobile Switching Center 와 같은 장비)\n* [[HLR]] — 가입자·위치 데이터베이스\n* [[PSTN]] — 일반 전화망으로 연결\n\n== 수치 한눈에 (참고 — 암기 불필요) ==\n{|\n! 항목 || 값 || 문서\n|-\n| 대역 || uplink 890–915 MHz · downlink 935–960 MHz (각 25 MHz) || [[GSM 대역]]\n|-\n| 채널 || 200 kHz × '''124''' || [[GSM 대역]]\n|-\n| 음성 || 3 kHz → Digitizer → 13 kbps || [[GSM multiframe]]\n|-\n| slot || '''156.25 bits''' (user 65 → 114 → 156.25) || [[GSM 프레임 구조]]\n|-\n| frame || '''8 slots''' (8 사용자) || [[GSM 프레임 구조]]\n|-\n| multiframe || '''26 frames''' (24 traffic + 2 control) = '''120 ms''' || [[GSM multiframe]]\n|-\n| channel bit rate || '''270.8 kbps''' || [[GSM channel bit rate]]\n|-\n| 변조 || [[GMSK]] → 200 kHz analog || [[GMSK]]\n|}\n\n[[anim:gsm_multiframe_anim|slot → frame → multiframe → 270.8 kbps 식이 완성되는 순서를 보라]]\n\n[[sim:gsm_bitrate]]\n\n{info}Forouzan 보충(슬라이드에 없음): GSM 의 reuse factor 는 3 정도까지 가능하다고 교재는 쓴다(디지털 + 오류 제어 덕에 간섭에 강함). AMPS 의 7 과 비교해 같은 대역을 더 촘촘히 재사용한다.{/info}\n\n{exam}GSM = '''European''' 표준(교수: AMPS 는 North America, \"different regions employ different standards\"; GSM 은 \"very successful\" 이지만 '''한국에서는 안 쓰고 IS-95''') · '''digital''' · '''TDMA 와 FDMA 의 hybrid''' (54:05) · 채널이 AMPS 보다 넓음(200 kHz vs 30 kHz) · 변조 GMSK. 수치(124, 270.8 kbps)는 외울 필요 없다고 했다(41:54, 46:00).{/exam}\n\n== 관련 문서 ==\n* [[GSM 대역]] · [[GSM 프레임 구조]] · [[GSM multiframe]] · [[GSM channel bit rate]] · [[GMSK]] · [[HLR]]\n* 같은 TDMA 계열: [[D-AMPS]] · [[TDMA]] · [[2G]] · 전체: [[CH05 1G–2G 셀룰러]]"
 },
 "GSM 대역": {
  "title": "GSM 대역 (890–915 / 935–960 MHz, 200 kHz × 124)",
  "category": [
   "2강 1G–2G",
   "용어"
  ],
  "body": "'''GSM 대역'''은 [[GSM]] 이 쓰는 두 주파수 대역이다. reverse(uplink, MS → BS) 890–915 MHz, forward(downlink, BS → MS) 935–960 MHz, 각 25 MHz 를 200 kHz 채널 124 개로 나눈다. L10 p.24.\n\n{def}\"Use '''two bands''' for (half) duplex communication\n* Forward ('''Downlink'''): BS → MS\n* Reverse ('''Uplink'''): BS ← MS\"\n그림: \"Band = 25 MHz = 124 channels\", \"Channel: 200 kHz\", \"Reverse band: 124 channels (890–915 MHz)\", \"Forward band: 124 channels (935–960 MHz)\" (p.24){/def}\n\n[[img:L10-24.png|p.24 GSM Bands — Reverse band 890–915 MHz(필기 uplink), Forward band 935–960 MHz(필기 downlink), 각 124 × 200 kHz|medium]]\n\n== 이름에서 개념 끌어내기 ==\n'''forward / reverse''' 는 [[AMPS 대역과 채널|AMPS]] 와 같은 기지국 관점 이름이다 — 망에서 사용자로 \"앞으로\" = forward = downlink, 사용자에서 망으로 \"거꾸로\" = reverse = uplink. 낮은 주파수 쪽(890–915)이 uplink 인 것도 AMPS(824–849 uplink)와 같은 패턴. → [[uplink와 downlink]]\n\n{analogy}🎭 AMPS 가 '''좁은 차선(30 kHz) 832 개''' 도로라면, GSM 은 '''넓은 차선(200 kHz) 124 개''' 도로다. 대신 GSM 의 넓은 차선에는 8 칸짜리 버스(TDMA frame)가 다닌다.{/analogy}\n\n== 계산 ⭐⭐ ==\n<pre class=\"txt\">\n1. 대역 폭          915 − 890 = 25 MHz   (960 − 935 = 25 MHz)\n2. 채널 폭          200 kHz\n3. 25,000 kHz ÷ 200 kHz = 125\n4. 양 끝 [[mid:guard band|guard band]] 몫 1 채널 제외 → '''124''' 채널        ← 슬라이드 값\n5. 채널당 8 slot (TDMA)  → 124 × 8 = 992 동시 통화 (provider 구분 전 — 파생값)\n<\/pre>\n\n[[sim:band_channels]]\n\n{|\n! || [[AMPS]] · [[D-AMPS]] || GSM\n|-\n| uplink || 824–849 MHz || 890–915 MHz\n|-\n| downlink || 869–894 MHz || 935–960 MHz\n|-\n| 대역 폭 || 25 MHz || 25 MHz\n|-\n| 채널 폭 × 개수 || 30 kHz × 832 || 200 kHz × 124\n|-\n| 채널당 사용자 || 1 (AMPS) / 3 (D-AMPS) || 8\n|}\n\n{info}'''\"(half) duplex\" 괄호에 대해''': 대역은 방향별로 따로라 주파수로는 동시에 주고받을 수 있다(full-duplex 처럼 보임). 그러나 GSM 폰은 uplink 슬롯을 downlink 슬롯보다 '''3 slot 늦게''' 쓰도록 짜여 있어 한 순간에 송신·수신을 동시에 하지 않는다 — 그래서 슬라이드가 \"(half)\" 를 괄호로 붙인 것으로 보인다(보충 — 슬라이드 설명 없음). 중간고사 개념: [[mid:half-duplex|half-duplex]] · [[mid:full-duplex|full-duplex]] · [[mid:duplexing과 multiple access|duplexing과 multiple access]].{/info}\n\n== 관련 문서 ==\n* [[GSM]] · [[GSM 프레임 구조]] · [[uplink와 downlink]] · [[FDMA]]\n* 비교: [[AMPS 대역과 채널]] · [[IS-95 대역과 채널]]"
 },
 "GSM 프레임 구조": {
  "title": "GSM 프레임 구조 (slot 156.25 bits → frame 8 slots)",
  "category": [
   "2강 1G–2G",
   "용어"
  ],
  "body": "'''GSM 프레임 구조'''는 [[GSM]] 의 TDMA 계층 구조 중 아래 두 층 — '''slot'''(사용자 한 명의 비트 덩어리, 156.25 bits)과 '''frame'''(8 slots = 8 사용자 한 바퀴) — 이다. frame 26 개가 모이면 [[GSM multiframe]](120 ms). L10 p.25–26.\n\n{def}\"Each slot carries '''156.25 bits'''. # of slots: '''8'''\" (p.25)\np.26: \"65 bits — User data → 114 bits — User data plus '''error control bits''' → 156.25 bits — User data plus error control bits and '''TDMA control bits'''\" · \"Frame = 8 slots\"{/def}\n\n[[img:L10-26.png|p.26 Multiframe components — 65 → 114 → 156.25 bits 가 slot 하나, slot 8 개가 frame, frame 26 개가 multiframe(120 ms)|large]]\n\n== 이름에서 개념 끌어내기 ==\n* '''slot''' = \"자리, 칸\". 시간 축 위의 사용자 한 명 몫의 칸 (필기: \"time slot\").\n* '''frame''' = \"틀\". 8 개의 칸을 담는 한 틀 = TDMA 가 8 사용자를 '''한 바퀴''' 도는 단위 (필기: \"frame\").\n* 데이터 링크에서 배운 \"frame\" 과 이름은 같지만 여기서는 '''시간 슬롯의 묶음'''이다.\n\n{analogy}🎭 '''회전초밥 레일.''' 접시(slot) 하나에 한 손님(사용자)의 초밥(65 bits)이 올라가는데, 접시에는 뚜껑(error control)과 이름표(TDMA control)도 같이 실린다 → 156.25. 접시 8 개가 한 바퀴(frame)를 이루고 손님 8 명이 한 번씩 받는다.{/analogy}\n\n[[anim:gsm_multiframe_anim|65 bits 상자가 114, 156.25 bits 로 부풀어 slot 이 되고, slot 8 개가 frame 이 되는 앞부분을 집중해서 보라]]\n\n== slot 한 칸의 내용 ⭐ ==\n<pre class=\"txt\">\nuser data                      65 bits\n+ error control bits           49 bits   → 114 bits\n+ TDMA control bits         42.25 bits   → '''156.25 bits''' = slot 하나\nframe = 8 slots = 8 × 156.25 = 1,250 bits\n사용자 음성 비율 = 65 / 156.25 ≈ 42 %\n<\/pre>\n\n* '''error control bits''': 무선 채널의 비트 오류를 검출·정정하기 위한 redundancy(중간고사 CH03 [[mid:redundancy|redundancy]] 와 같은 개념).\n* '''TDMA control bits''': TDMA 를 굴리기 위한 비트 — 동기(training sequence), 경계 표시, guard period 등. 156.25 의 0.25 는 guard period 가 8.25 비트 시간이라 생기는 소수다(보충).\n\n[[sim:gsm_bitrate]]\n\n{warn}\"frame = 26\" 이라고 헷갈리지 말 것. '''frame = 8 slots''', '''multiframe = 26 frames'''. 슬라이드 p.25 의 \"# of slots: 8 · # of frames: 26\" 은 \"frame 당 slot 8 개, multiframe 당 frame 26 개\" 라는 뜻이다.{/warn}\n\n== 관련 문서 ==\n* [[GSM multiframe]] · [[GSM channel bit rate]] · [[TDMA]] · [[GSM]]"
 },
 "GSM multiframe": {
  "title": "GSM multiframe (26 frames = 24 traffic + 2 control, 120 ms)",
  "category": [
   "2강 1G–2G",
   "용어"
  ],
  "body": "'''GSM multiframe'''은 [[GSM 프레임 구조|frame]] 26 개를 묶은 GSM TDMA 의 가장 큰 단위다. 26 개 중 '''24 개는 traffic'''(음성), '''2 개는 control''' 이고, 한 multiframe 의 길이는 '''120 ms''' 다. [[GSM channel bit rate]] 270.8 kbps 는 이 120 ms 동안 흐르는 비트 수에서 나온다. L10 p.25–26.\n\n{def}\"# of frames: '''26''' · MultiFrame duration: '''120 ms'''\" (p.25)\n\"1 multiframe = 26 frames — '''24 traffic frames + 2 control frames''' — 120 ms\" (p.26){/def}\n\n[[img:L10-25.png|p.25 GSM Transmission — 노란 상자 \"1 multiframe = 26 frames, Duration = 120 ms\" (필기본: time slot / frame / multiframe)|large]]\n\n== 이름에서 개념 끌어내기 ==\n'''multi'''-'''frame''' = \"frame 여러 개\". 왜 frame 위에 한 층이 더 필요한가? 8 사용자가 한 바퀴 도는 frame(약 4.6 ms)마다 제어 정보를 넣으면 낭비가 크다. 그래서 '''26 바퀴 중 2 바퀴만 control''' 로 쓰도록 큰 주기를 정의한 것 — 그 주기가 multiframe.\n\n{analogy}🎭 '''지하철 노선 운행표.''' 열차 한 편(frame)에 8 칸(slot). 26 편을 한 운행 주기(multiframe, 120 ms)로 묶고, 그중 2 편은 승객 대신 '''점검 열차'''(control frame)로 돌린다.{/analogy}\n\n[[anim:gsm_multiframe_anim|frame 26 개가 모여 노란 120 ms 상자가 되는 장면에서 24 traffic + 2 control 표시를 확인하고, 아래 270.8 kbps 식이 완성될 때까지 보라]]\n\n== 숫자 (참고) ==\n<pre class=\"txt\">\nmultiframe = 26 frames × 8 slots × 156.25 bits = 32,500 bits\n길이       = 120 ms\nframe 하나 = 120 ms ÷ 26 ≈ 4.615 ms            (파생값)\nslot 하나  = 4.615 ms ÷ 8 ≈ 0.577 ms           (파생값)\ntraffic    = 24 frames,  control = 2 frames\n한 사용자 user data = 65 bits × 24 / 120 ms = '''13 kbps'''  (= p.25 Digitizer 출력)\n<\/pre>\n\n[[sim:gsm_bitrate]]\n\n{warn}channel bit rate 계산에는 '''26'''(control frame 포함 전체)을 쓴다 — 채널 위를 실제로 흐르는 비트이므로. 순수 사용자 데이터 rate 를 물으면 '''24'''(traffic 만)와 '''65'''(user data 만)를 쓴다. 어느 쪽을 묻는지 문제를 확인할 것.{/warn}\n\n== 관련 문서 ==\n* [[GSM 프레임 구조]] · [[GSM channel bit rate]] · [[GSM]] · [[TDMA]]"
 },
 "GSM channel bit rate": {
  "title": "GSM channel bit rate (270.8 kbps)",
  "category": [
   "2강 1G–2G",
   "용어"
  ],
  "body": "'''GSM channel bit rate'''는 [[GSM]] 의 200 kHz 채널 하나 위를 흐르는 총 비트 속도로, $\\frac{1}{120\\text{ ms}} \\times 26 \\times 8 \\times 156.25 = 270.8\\text{ kbps}$ 다. 이 비트열이 [[GMSK]] 로 변조되어 200 kHz 아날로그 신호가 된다. L10 p.25. 사용자가 이 슬라이드에 '''\"다시\"''' 를 적어 두었다.\n\n{def}\"Channel bit rate: '''(1/120ms) × 26 × 8 × 156.25 = 270.8 kbps'''\" (p.25){/def}\n\n[[img:L10-25.png|p.25 GSM Transmission — 8 Users → 13 kbps → TDMA(slot/frame/multiframe) → 270.8 kbps → GMSK → 200 kHz (필기본: \"다시\")|large]]\n\n== 이름에서 개념 끌어내기 ==\n'''channel''' bit rate — \"사용자\" bit rate 가 아니라 '''채널''' 하나의 bit rate. 즉 8 명분 + 오류 제어 + TDMA 제어 + control frame 까지 '''전부''' 포함한 값이다. bit rate 의 정의(초당 비트 수, [[mid:bit rate|bit rate]])를 그대로 적용하면 된다: '''(일정 시간 동안 보낸 비트 수) ÷ (그 시간)'''. 그 \"일정 시간\" 으로 가장 편한 것이 한 주기, 즉 [[GSM multiframe|multiframe]] 120 ms.\n\n{analogy}🎭 '''택배 트럭의 시간당 운송량.''' 트럭 한 대(multiframe)에 상자 26 줄 × 8 칸 × 칸당 156.25 kg 을 싣고 120 ms 마다 출발한다. 시간당 운송량 = 한 트럭 적재량 ÷ 배차 간격.{/analogy}\n\n[[anim:gsm_multiframe_anim|애니메이션 끝에 완성되는 식에서 1/120 ms · 26 · 8 · 156.25 각 숫자가 어느 층(multiframe 시간 · frame 수 · slot 수 · slot 비트)에서 왔는지 짚어 보라]]\n\n{info}교수(10/20)는 이 슬라이드에서 slot · frame · multiframe 의 구조와 bit rate 를 계산하는 식을 짚었지만, 수업 전체에 걸쳐 \"specific numbers 는 외우지 말고 trend 를 이해하라\"(41:54, 46:00)고 했다. 270.8 이라는 값보다 '''\"한 주기(multiframe)의 비트 수 ÷ 주기 시간\"''' 이라는 계산 원리와 TDMA + FDMA hybrid 구조를 잡을 것.{/info}\n\n== 손으로 푸는 순서 ⭐ ==\n<pre class=\"txt\">\n1. slot          = 156.25 bits\n2. frame         = 8 slots            → 8 × 156.25   = 1,250 bits\n3. multiframe    = 26 frames          → 26 × 1,250   = 32,500 bits\n4. multiframe 시간 = 120 ms = 0.12 s\n5. channel bit rate = 32,500 ÷ 0.12   = 270,833.3 bps ≈ '''270.8 kbps'''\n\n[파생]\n6. 사용자 1 명(slot 1 개) 몫  = 270.8 ÷ 8           ≈ 33.85 kbps\n7. 순수 user data rate        = 65 × 24 ÷ 0.12      = 13 kbps\n<\/pre>\n\n[[sim:gsm_bitrate]]\n\n{warn}'''\"다시\" — 왜 이 식인지 한 줄로.''' \"bit rate = 비트 수 ÷ 시간\" 이고, GSM 은 120 ms 마다 같은 모양(26 frame × 8 slot × 156.25 bit)이 반복되니 '''한 번 반복분의 비트 수를 120 ms 로 나눈 것'''이다. $\\frac{1}{120\\text{ ms}}$ 는 \"120 ms 로 나누기\" 를 곱셈으로 쓴 것일 뿐. 단위: bits / ms = kbps (32,500 / 120 = 270.8).{/warn}\n\n{quiz}GSM 에서 multiframe 길이가 120 ms, frame 26 개, frame 당 slot 8 개, slot 당 156.25 bits 일 때 channel bit rate 는? 그리고 이 값은 몇 명의 사용자를 나르는가?{/quiz}\n{answer}$26 \\times 8 \\times 156.25 = 32{,}500$ bits, $32{,}500 / 0.12\\text{ s} = 270{,}833 \\approx$ '''270.8 kbps'''. frame 당 slot 8 개 = '''8 사용자'''(사용자당 약 33.85 kbps, 그중 순수 음성 13 kbps).{/answer}\n\n== 관련 문서 ==\n* [[GSM multiframe]] · [[GSM 프레임 구조]] · [[GMSK]] · [[GSM]]\n* [[공식 모음]] · 중간고사: [[mid:bit rate|bit rate]]"
 },
 "GMSK": {
  "title": "GMSK (Gaussian Minimum Shift Keying — GSM 의 변조)",
  "category": [
   "2강 1G–2G",
   "용어"
  ],
  "body": "'''GMSK(Gaussian Minimum Shift Keying)'''는 [[GSM]] 이 270.8 kbps 디지털 비트열을 200 kHz 아날로그 신호로 바꿀 때 쓰는 변조 방식이다. [[mid:FSK|FSK]] 의 개량형이다. L10 p.25.\n\n{def}p.25 그림: \"270.8 kbps → [GMSK] → 200 kHz\" — Channel 001 … 124 (FDMA){/def}\n\n== 이름에서 개념 끌어내기 ==\n이름을 오른쪽부터 읽으면 된다.\n* '''Shift Keying''' — 디지털 비트(0/1)에 따라 반송파의 성질을 바꾸는(shift) 방식. 중간고사의 ASK·[[mid:FSK|FSK]]·[[mid:PSK|PSK]] 와 같은 \"Keying\" 가족.\n* '''Minimum Shift''' — FSK 의 일종인데, 두 주파수의 간격을 '''서로 구분 가능한 최소한'''(bit rate 의 절반)으로 좁히고 위상이 끊기지 않게 이어 붙인다 → 대역을 적게 쓴다 (MSK).\n* '''Gaussian''' — 비트 경계의 급격한 변화를 Gaussian 필터로 부드럽게 다듬어 옆 채널로 새는 에너지를 더 줄인다.\n{info}교수(10/20, 53:07): \"converted to an analog signal by using GMSK, '''which we did not discuss the detailed mechanism'''\" — GMSK 의 동작 원리는 범위 밖. \"GSM 의 비트열을 200 kHz 아날로그 신호로 바꾸는 변조\" 라는 역할만 알면 된다.{/info}\n\n→ '''\"좁은 200 kHz 칸에 270.8 kbps 를 옆 칸 침범 없이 넣기 위해 FSK 를 최대한 날씬하게 만든 것\"'''. (세부는 보충 — 슬라이드는 상자 이름만.)\n\n{analogy}🎭 FSK 가 '''계단'''(주파수가 뚝뚝 바뀜)이라면 GMSK 는 '''경사로'''다. 같은 높이를 오르지만 모서리가 없어 옆 차선(인접 채널)으로 튀지 않는다.{/analogy}\n\n[[img:L10-25.png|p.25 270.8 kbps 가 GMSK 상자를 지나 200 kHz 채널(FDMA)로 (필기본)|medium]]\n\n{|\n! 시스템 || 디지털 입력 || 변조 || 출력\n|-\n| [[AMPS]] control || 10 kbps || [[mid:FSK|FSK]] || 30 kHz\n|-\n| [[D-AMPS]] || 48.6 kbps || [[QPSK]] || 30 kHz\n|-\n| GSM || 270.8 kbps || '''GMSK''' || 200 kHz\n|}\n\n{tip}이 단계가 바로 필기 질문 \"'''analog? digital?'''\" 의 답의 절반이다: GSM 은 '''디지털 시스템'''이지만, 무선으로 내보내는 마지막 단계(GMSK)에서는 '''아날로그 파형'''을 만든다. 모든 무선 시스템은 결국 아날로그 전파를 쏜다 — 디지털/아날로그 구분은 그 이전, 정보를 비트로 다루느냐로 한다. → [[CH05 1G–2G 셀룰러]]{/tip}\n\n== 관련 문서 ==\n* [[GSM]] · [[GSM channel bit rate]] · [[QPSK]] · [[FM]]\n* 중간고사: [[mid:FSK|FSK]] · [[mid:digital-to-analog conversion|digital-to-analog conversion]] · [[mid:GFSK|GFSK]] (Bluetooth 의 Gaussian FSK — 같은 Gaussian 아이디어)"
 },
 "HLR": {
  "title": "HLR (Home Location Register)",
  "category": [
   "2강 1G–2G",
   "용어"
  ],
  "body": "'''HLR(Home Location Register)'''은 [[GSM]] 망에서 [[MSC]] 에 붙어 있는 '''가입자 데이터베이스'''다. 가입자의 정보(번호, 가입 서비스)와 '''현재 어디에 있는지'''(어느 MSC 관할인지)를 저장한다. L10 p.23 그림에 등장한다 — 그림에는 '''\"HRL- Home Loaction Register\"''' 로 두 군데 오타가 있다(HRL → HLR, Loaction → Location).\n\n{def}p.23 그림: MSC(Mobile-Services Switching Center) 위에 원통(데이터베이스) 기호로 \"'''HLR - Home Location Register'''\" (슬라이드 표기는 \"HRL- Home Loaction Register\"). 슬라이드에 별도 설명은 없다.{/def}\n\n== 이름에서 개념 끌어내기 ==\n* '''Home''' — 가입자가 계약한 \"본거지\" 망.\n* '''Location''' — 그 가입자가 지금 있는 위치.\n* '''Register''' — 기록부(데이터베이스).\n→ \"본거지 망이 갖고 있는, 내 가입자들의 위치 기록부\". (Forouzan·GSM 표준 보충 — 슬라이드는 그림뿐)\n\n{analogy}🎭 '''본가의 주소록.''' 자취하는 학생(MS)이 어디로 이사 가든(다른 cell·다른 망으로 [[roaming]]), 본가(HLR)에 \"지금 여기 산다\" 고 알려 둔다. 누가 그 학생을 찾으면(수신 전화) 먼저 본가에 물어본다.{/analogy}\n\n[[img:L10-23.png|p.23 GSM 구성 — MSC 위 원통이 HLR (그림 표기 \"HRL- Home Loaction Register\" 는 오타)|medium]]\n\n== 어디에 쓰이나 ==\n* '''수신 전화''' ([[통화 수신 과정]]): 전화가 오면 망은 HLR 에서 그 가입자가 지금 어느 MSC 관할에 있는지 찾고, 그 MSC 가 관할 cell 들에 [[paging]] 한다. HLR 덕분에 '''전국의 모든 cell 에 paging 할 필요가 없다'''.\n* '''[[roaming]]''': 다른 provider 망에 들어간 사용자의 위치를 home 망의 HLR 이 기록해 두어 전화가 따라갈 수 있다. (방문한 망 쪽 임시 기록부 VLR 도 있다 — 보충.)\n\n== 관련 문서 ==\n* [[GSM]] · [[MSC]] · [[paging]] · [[roaming]] · [[통화 수신 과정]]"
 },
 "CH05 IS-95·3G·4G": {
  "title": "CH05 IS-95·3G·4G (3강 — CDMA: 같은 주파수, 같은 시간, 다른 코드)",
  "category": [
   "3강 CDMA–4G",
   "메인"
  ],
  "body": "{warn}'''10/20(화) 수업 p.27–36 반영 (슬라이드 기준).''' 녹음본(`1020_컴네.txt`) '''54:50(p.27) ~ 73:22(끝)''' 반영 — 맨 아래 `🎙 실제 수업 기록` 절. '''교수: \"구체적 숫자를 외우지 말고 세대별 진화 trend 를 이해하라\"(41:54)''' → 이 문서의 수치는 \"원리를 보여 주는 예\"로 읽고, 외울 것은 아래 {exam} 박스의 원리·trend 다.{/warn}\n\n'''CH05 IS-95·3G·4G''' 는 L10 덱(`CH05_Wide Area Networks (1).pdf`, 36쪽)의 마지막 구간 p.27–36 이다. [[CH05 1G–2G 셀룰러]] 에서 2G 의 TDMA 계열([[D-AMPS]], [[GSM]])을 봤다면, 여기서는 2G 의 '''다른 한 갈래''' — 한국이 쓴 '''[[IS-95]]''' ([[CDMA]]) — 와 그 뒤의 [[3G]]([[IMT-2000]]), [[4G]] 를 본다.\n이 구간이 던지는 질문은 — '''\"FDMA 는 주파수로, TDMA 는 시간으로 사용자를 나눴다. 주파수도 시간도 나누지 않고 모두가 동시에 같은 대역에서 말하면 어떻게 구별하나?\"'''\n답: '''코드(code)로 나눈다.''' 각 사용자의 비트에 서로 [[Walsh code|직교하는 칩열]]을 곱해 넓게 퍼뜨리고([[DSSS]]), 수신자는 자기 코드를 다시 곱해 자기 신호만 꺼낸다([[CDMA]]). 이 덕분에 '''이웃 cell 도 같은 주파수를 쓸 수 있고'''([[IS-95 frequency reuse|reuse factor = 1]]), 이웃 BS 의 [[pilot channel]] 을 들으면서 '''끊김 없는 handoff'''([[IS-95 soft handoff]])가 가능해진다. 3G 는 이 CDMA 를 넓힌 것(W-CDMA, CDMA 2000), 4G 는 전부 IP 패킷으로 바꾼 것([[all-IP]])이다.\n\n페이지 번호는 슬라이드 인쇄 번호(= PDF 페이지)다. 캡처는 내 GoodNotes '''필기본'''이라 빨간 손글씨가 있다.\n\n== 한눈에 보기 ==\n=== ① 세 가지 multiple access — 무엇으로 나누나 ===\n{|\n! 방식 || 나누는 자원 || 한 사용자가 쓰는 것 || 이 덱에서 || 비유\n|-\n| [[FDMA]] || 주파수 || 좁은 주파수 띠 하나를 '''항상''' || [[1G]] [[AMPS]] (30 kHz) || 방마다 다른 방\n|-\n| [[TDMA]] || 시간 || 넓은 띠를 '''차례로''' 잠깐씩 || [[2G]] [[D-AMPS]] (30 kHz), [[GSM]] (200 kHz) || 한 방에서 돌아가며 말하기\n|-\n| '''[[CDMA]]''' || '''코드''' || 넓은 띠 '''전체'''를 '''항상, 모두 동시에''' || [[2G]] '''[[IS-95]]''' (1.228 MHz), 3G || 한 방에서 모두 동시에, 각자 다른 언어로\n|}\n세 방식 모두 중간고사의 [[mid:channelization|channelization]] 세 가지 그대로다 — 이번에는 그것을 셀룰러 표준이 실제로 어떻게 쓰는지 본다.\n\n[[anim:access_methods|FDMA(주파수 띠) → TDMA(시간 슬롯) → CDMA(같은 시간·같은 주파수에 code 층이 쌓임) 순서로 보고, 축 세 개 중 무엇이 \"칸막이\"인지 말해 보라]]\n\n=== ② IS-95 한 장 요약 ===\n<pre class=\"txt\">\n[[IS-95]] = 2G, 북미 + 한국,  [[DSSS]] 로 퍼뜨리고 [[CDMA]] 로 나눈다\n대역   : 두 대역(duplex) — ISM 800 MHz, ISM 1,900 MHz              ([[IS-95 대역과 채널]])\n채널   : 한 대역 = 1.228 MHz 채널 20 개 (guard band 로 분리) → provider 당 10 개\n동기화 : BS 들이 [[GPS 동기화|GPS]] 로 시계를 맞춘다\nforward(BS→MS): 64 digital channel 을 [[Walsh code]] W0–W63 로 구분, W0 = [[pilot channel]](all 1s)\n               9.6 kbps → 19.2 ksps → ×64 chips → '''1.228 Mcps''' → [[QPSK]]        ([[IS-95 forward 전송]])\nreverse(MS→BS): 9.6 kbps → 28.8 ksps → 6-to-64 → 307.2 kcps → ×4 → '''1.228 Mcps''' → QPSK ([[IS-95 reverse 전송]])\nreuse factor : '''normally 1''' — 이웃 cell 도 같은 대역                     ([[IS-95 frequency reuse]])\nhandoff      : pilot 를 듣고 '''soft handoff'''                             ([[IS-95 soft handoff]])\n<\/pre>\n\n=== ③ 세대 흐름 ===\n{|\n! 세대 || 대표 || 접근 방식 || 핵심 단어\n|-\n| [[1G]] || [[AMPS]] || [[FDMA]] || analog voice\n|-\n| [[2G]] || [[D-AMPS]] · [[GSM]] / '''[[IS-95]]''' || [[TDMA]] / '''[[CDMA]]''' || digital voice\n|-\n| '''[[3G]]''' || '''[[IMT-2000]]''' ([[W-CDMA]] · [[CDMA 2000]] 등 5 표준) || 주로 CDMA || '''144 k / 384 k / 2 M bps''', packet + circuit\n|-\n| '''[[4G]]''' || (슬라이드에 표준 이름 없음) || — || '''100 Mbps 이동 / 1 Gbps 정지''', '''[[all-IP]]''', packet-switched\n|}\n\n[[anim:generations_timeline|1G → 2G → 3G → 4G 가 쌓이는 동안 아래 화살표 \"아날로그 → 디지털 → 데이터 → all-IP\" 를 따라가며, 각 세대의 data rate 를 소리 내어 읽어 보라]]\n\n{exam}🎯 출제 예상 자리 — 교수(10/20)는 \"'''구체적 숫자를 외우지 말고 세대별 진화 trend 를 이해하라'''\"(41:54), CDMA 는 \"'''세부 블록은 몰라도 된다, code 로 공유한다는 것을 기억하라'''\"(64:45)고 했다. 그래서 원리·이유 중심으로:\n* '''CDMA 의 원리''': 매체를 '''frequency 도 time 도 아닌 code''' 로 나눈다 — 같은 시간·같은 주파수. DSSS 로 '''넓게 퍼뜨려 간섭을 피한다'''. 퍼뜨려도 '''정보량은 같다''' (p.27, 57:15)\n* '''IS-95 = DSSS + CDMA''' — DSSS 는 \"signal-spreading '''modulation''' technique\", CDMA 는 \"an '''MA method''' based on DSSS\". 퍼뜨리는 이유 = '''multiple access 구현''' (p.27)\n* '''이전 세대와의 important distinction = bandwidth''': 30 kHz·200 kHz → 훨씬 넓은 채널, '''CDMA 가 spectrum 을 퍼뜨리기 때문''' (p.28, 61:15)\n* '''여러 사용자(64)의 신호가 code 로 합쳐져 넓은 한 채널에''' — \"large bandwidth aggregated across users\" (p.29–30). W0 = pilot channel\n* '''\"The beauty of CDMA\" = reuse factor 1''' — 이웃 cell 도 같은 주파수(이전 시스템에서는 불가), code 로 구분 → frequency·time 효율 ↑ (p.31, 65:15)\n* '''soft handoff 가 가능한 이유 = pilot channel''' + reuse factor 1 (p.32)\n* '''2G → 3G key point = voice 를 넘어 text·data''' = universal personal communication. IMT-2000 = ITU 의 '''blueprint, not actual standard''' (p.33)\n* '''Trend''': 세대가 갈수록 '''더 넓은 bandwidth·더 높은 frequency''' → 더 높은 data rate·더 많은 사용자. 5G 는 huge bandwidth + '''many base stations''' (p.33·36 구두)\n* IMT-DS = '''W-CDMA''' (Europe, '''한국이 쓰는 3G''') · IMT-MC = '''CDMA 2000''' (IS-95 개선판, North America) (p.35)\n* 4G: '''All IP, packet-switched''' (p.36)\n* GPS 동기화는 교수가 \"'''not that important'''\" (62:29){/exam}\n\n{analogy}🎭 '''시끄러운 국제 파티.''' FDMA 는 대화하는 쌍마다 다른 방을 주는 것(방=주파수), TDMA 는 한 방에서 마이크를 돌려 가며 말하는 것(차례=시간 슬롯)이다. CDMA 는 '''모두가 한 방에서 동시에 말하되, 쌍마다 다른 언어를 쓰는''' 파티다. 한국어 쌍은 한국어만 알아듣고, 옆에서 들리는 스페인어·독일어는 그냥 웅성거림(잡음)으로 흘려들린다. 방도 하나, 시간도 동시인데 대화가 섞이지 않는다 — 이 \"언어\"가 [[Walsh code]] 이고, 서로 다른 언어가 서로를 방해하지 않는 성질이 '''직교(orthogonal)''' 다. 그리고 옆 건물(이웃 cell)에서도 같은 방(주파수)을 써도 된다 — 어차피 언어로 구분되니까([[IS-95 frequency reuse|reuse factor 1]]).{/analogy}\n\n== p.27 — 2nd Generation: IS-95 (Interim Standard 95) ⭐⭐⭐ ==\n[[img:L10-27.png|p.27 IS-95 — Base Station 의 forward link 는 \"a composite signal which is transmitted to all users and differentiated by codes\"(Code1…CodeN), 오른쪽 FDMA/TDMA/CDMA 비교 그림 (필기본: W1≪W2 스케치, user 1·2·3 / code 1·2·3, \"다시\", \"ETRI가 개발?\")|large]]\n\n{def}\"'''IS-95 (Interim Standard 95)''': One of the dominant 2G standards in '''North America (and South Korea)'''. Based on '''DSSS and CDMA'''.\n* '''DSSS (Direct-Sequence Spread Spectrum)''': a '''signal-spreading modulation technique'''\n* '''CDMA (Code-Division Multiple Access)''': an '''MA method based on DSSS'''\" (p.27)\n→ IS-95 는 북미·한국의 2G 표준. 신호를 넓게 퍼뜨리는 변조 기법 DSSS 위에, 코드로 사용자를 나누는 다중 접속 CDMA 를 얹은 것.{/def}\n\n* 그림 왼쪽: 기지국이 '''하나의 합성 신호(composite signal)'''를 모든 MS 에게 보내고, 각 MS 는 '''자기 code(Code1, Code2, …, CodeN)'''로 자기 몫만 꺼낸다. 이것이 forward link 의 CDMA.\n* 그림 오른쪽: '''FDMA'''(주파수 축으로 막대가 나뉨) · '''TDMA'''(시간 축으로 나뉨 — 필기 user 1·2·3) · '''CDMA'''(시간·주파수 전체를 덮는 판이 '''code 별로 겹쳐 쌓임''' — 필기 code 1·2·3).\n* 필기 스케치 '''\"W1 ≪ W2\"''': 원래 신호는 f1 근처의 좁은 폭 W1 인데, DSSS 를 거치면 훨씬 넓은 폭 W2 로 퍼진다. 이게 '''spread spectrum''' 의 뜻 그대로다 → [[spread spectrum]], [[DSSS]].\n\n{warn}⚠️ '''\"다시\" 표시한 곳 — DSSS 와 CDMA, 아주 쉽게 다시.'''\n# '''DSSS 는 \"퍼뜨리기\"''' — 1 비트를 보내는 대신, 그 비트에 '''짧은 ±1 패턴(칩, chip) 여러 개'''를 곱해서 보낸다. 비트 1 개 → 칩 64 개(IS-95 forward). 같은 시간에 64 배 많은 기호를 보내니 '''대역폭이 64 배로 넓어진다'''(필기 W1 → W2). 이게 \"signal-spreading '''modulation''' technique\".\n# '''CDMA 는 \"나누기\"''' — 사용자마다 '''서로 다른 칩 패턴'''([[Walsh code]])을 준다. 모두가 퍼뜨린 신호가 공중에서 '''더해져도''', 수신자가 자기 패턴을 곱해 평균하면 남의 신호는 '''정확히 0''' 이 되고 자기 비트만 남는다. 이게 \"an '''MA(multiple access) method''' based on DSSS\".\n# 그래서 순서는 '''DSSS(기법) 위에 CDMA(접근 방식)''' — DSSS 가 없으면 CDMA 도 없다. 중간고사의 [[mid:FHSS|FHSS]] 가 \"주파수를 뛰어다니며 퍼뜨리기\" 였다면 DSSS 는 \"칩을 곱해서 퍼뜨리기\"다.\n숫자로 직접 해 보기 → 아래 [[sim:cdma_walsh]].{/warn}\n\n[[anim:cdma_spreading|스테이션 3개의 비트가 각자 Walsh code 와 곱해져 채널에서 더해지는 장면, 그리고 수신자 2가 자기 code 를 곱했을 때 남의 신호가 0 으로 사라지는 장면을 차례로 보라]]\n\n=== 숫자로 보는 CDMA (Forouzan 보충 — 슬라이드에 없음) ===\np.27 그림의 \"Code1, Code2, …, CodeN\" 을 칩 4 개짜리 Walsh code 로 바꾸면 이렇다. 비트 1 → +1, 비트 0 → −1, 말 안 함 → 0.\n<pre class=\"txt\">\n코드 :  c1 = [+1 +1 +1 +1]   c2 = [+1 −1 +1 −1]   c3 = [+1 +1 −1 −1]   c4 = [+1 −1 −1 +1]\n데이터: d1 = −1 (bit 0)      d2 = −1 (bit 0)      d3 = 0 (silent)      d4 = +1 (bit 1)\n\n1. 각자 퍼뜨리기 (d_i × c_i)\n   d1·c1 = [−1 −1 −1 −1]\n   d2·c2 = [−1 +1 −1 +1]\n   d3·c3 = [ 0  0  0  0]\n   d4·c4 = [+1 −1 −1 +1]\n2. 공중에서 더해짐 (채널)  =  [−1 −1 −3 +1]\n3. 수신자 2: 채널 · c2 = (−1)(+1) + (−1)(−1) + (−3)(+1) + (+1)(−1)\n                      = −1 + 1 − 3 − 1 = −4\n4. ÷ 칩 수 4  →  −1  →  '''bit 0'''  (= d2 복원)\n   수신자 3: 채널 · c3 = −1 − 1 + 3 − 1 = 0 → ÷4 = 0 → '''silent'''\n<\/pre>\n다른 코드끼리 내적이 0([[Walsh code|직교]])이라 남의 몫은 정확히 사라진다.\n\n[[sim:cdma_walsh]]\n\n{tip}💡 '''필기 속 질문: \"ETRI가 개발?\"''' — 반은 맞다. '''CDMA(IS-95) 원천 기술은 미국 Qualcomm''' 이 만들었고, 한국의 '''[[ETRI]](한국전자통신연구원)''' 가 1990 년대 초 Qualcomm 과 공동 개발 계약을 맺고 '''상용 시스템을 개발'''해, 한국이 '''1996 년 세계 최초로 CDMA 를 상용화'''했다. 슬라이드에 \"(and South Korea)\" 가 괄호로 붙은 이유가 이것이다. (Qualcomm·1996 은 슬라이드에 없는 배경.) '''교수(59:55)''': \"Koreans contributed a lot to invent CDMA … an institution called '''ETRI''' … government research institute that contributed a lot in inventing CDMA, and they earned money a lot\" — 교수는 \"invent\" 라고 표현했다. 시험 답안에서는 '''\"ETRI(한국 정부출연 연구소)가 CDMA 개발·상용화에 크게 기여\"''' 정도로 쓰면 안전하다.{/tip}\n\n== p.28 — IS-95: Bands, Channels and Synchronization ⭐⭐⭐ ==\n[[img:L10-28.png|p.28 IS-95 Bands, Channels and Synchronization — 1.228 MHz 밑줄 (필기본: 옆에 \"30 kHz D-AMPS / 200 kHz GSM\" 채널 폭 비교)|medium]]\n\n{def}\"'''Bands and Channels''': Use '''two bands for duplex''' communication. '''ISM 800-MHz, ISM 1,900-MHz'''. Each band is divided into '''20 channels of 1.228 MHz''' separated by '''guard bands'''. Each service provider is allotted '''10 channels'''.\n'''Synchronization''': To provide synchronization, '''BSs use the service of GPS'''.\" (p.28){/def}\n\n<pre class=\"txt\">\n한 대역에 들어간 채널 폭 합 = 20 × 1.228 MHz = 24.56 MHz\n대역 폭 (p.29 그림)         = 25 MHz\n남는 폭                      = 25 − 24.56 = 0.44 MHz  → 채널 사이 [[mid:guard band|guard band]] 몫\nprovider 당                  = 20 ÷ 2 = '''10 채널'''\n<\/pre>\n\n필기의 채널 폭 비교가 이 슬라이드의 요점을 한 줄로 보여 준다:\n{|\n! 표준 || 채널 하나의 폭 || 한 채널을 나누는 방법\n|-\n| [[AMPS]] / [[D-AMPS]] || '''30 kHz''' || AMPS: 1 사용자 · D-AMPS: 시간 슬롯 3 개 ([[TDMA]])\n|-\n| [[GSM]] || '''200 kHz''' || 시간 슬롯 8 개 ([[TDMA]])\n|-\n| '''[[IS-95]]''' || '''1.228 MHz''' || '''Walsh code 64 개''' ([[CDMA]])\n|}\nCDMA 는 신호를 퍼뜨리므로 채널이 '''훨씬 넓다'''(D-AMPS 의 약 40 배). 대신 채널 수는 20 개뿐이고, 한 채널 안을 코드로 잘게 나눈다. 채널을 넓게 나누는 이 바깥 단계는 여전히 '''FDMA''' 다 (p.29 그림 오른쪽 \"FDMA\" 상자) → [[IS-95 대역과 채널]].\n\n* '''GPS 동기화''': IS-95 의 BS 들은 [[GPS 동기화|GPS 위성 시계]]로 모두 같은 시각을 공유한다. 교수: \"'''this one is not that important'''\" (62:29).\n\n[[sim:is95_rates]]\n\n== p.29 — IS-95: Forward Transmission (Downlink) ⭐⭐⭐ ==\n[[img:L10-29.png|p.29 IS-95 forward(BS→MS) 블록도 — Digitizer → error correcting → long code(ESN, decimator)로 scramble → W0…W63 곱 → Σ → 1.228 Mcps → QPSK → 20 채널 중 하나(FDMA) (필기본: \"CDMA\" 동그라미, \"64 user\")|large]]\n\n왼쪽에서 오른쪽으로, 한 사용자(digital channel 하나)의 음성이 겪는 일:\n<pre class=\"txt\">\n1. 음성 3 kHz  → Digitizer                         → 9.6 kbps\n2. Error correcting, repeating, interleaving       → 19.2 ksps   (2 배: 오류 정정용 [[mid:redundancy|redundancy]])\n3. 사용자 고유 [[long code와 ESN|long code]] 를 더함(⊕, scramble)\n     ESN → Long code generator (1.228 Mcps) → Decimator (1/64 로 솎아냄) → 19.2 ksps  ← 속도를 맞춤\n4. Walsh code W_i (64 chips) 를 곱함                 → 19.2 k × 64 = '''1.2288 Mcps''' ≈ 1.228 Mcps\n5. 64 개 digital channel 을 Σ 로 더함 (W0 = Pilot channel, all 1s · W1 … W63)\n6. [[QPSK]] 로 반송파에 실음                          → 1.228 MHz 아날로그 채널\n7. 25-MHz band 안의 20 채널 중 하나에 배치 ('''FDMA''')\n<\/pre>\n* 점선 상자 \"CDMA\"(필기 동그라미): '''W0~W63 로 곱하고 더하는 부분''' — 한 1.228 MHz 채널 안에서 64 개 digital channel 을 '''코드로''' 나눈다.\n* 점선 상자 \"FDMA\": 25 MHz 를 1.228 MHz 채널 20 개로 '''주파수로''' 나눈다.\n* 즉 IS-95 forward 는 '''FDMA(바깥) + CDMA(안쪽)''' 2 단 구조다.\n* 필기 스케치(W1, W2 가로선 겹침): 같은 주파수 띠 위에 코드 W1, W2, … 의 신호가 층층이 겹친다 — p.27 오른쪽 CDMA 그림과 같은 모습.\n\n{tip}💡 '''필기 속 질문: \"64 user\" — 한 채널에 정말 64 명?''' '''Walsh code 가 64 개 → digital channel 이 64 개'''라는 뜻이다. 그런데 슬라이드에서 '''digital channel 0 (W0) 은 pilot channel(all 1s)''' 이라 사용자 몫이 아니다 → 많아야 '''63'''. 실제 표준은 W32 를 synchronization, W1–W7 을 paging 에도 쓰므로 traffic(음성) 채널은 '''55 개''' 정도다 (Forouzan 보충 — 슬라이드에 없음). 교수(63:16)도 \"these aggregated '''64 user''' signals … 64 different users in this one bag, W1, W2, W3 …\" 라고 '''64 user''' 로 말했다 — 필기는 이 말을 받아 적은 것. 시험 답안에는 \"1.228 MHz 채널 하나에 code 64 개로 64 digital channel(사용자)의 신호가 합쳐짐, W0 = pilot\" 으로 쓰면 된다. → [[Walsh code]], [[pilot channel]]{/tip}\n\n자세히 → [[IS-95 forward 전송]], [[chip rate]], [[long code와 ESN]].\n\n== p.30 — IS-95: Reverse Transmission (Uplink) ⭐⭐ ==\n[[img:L10-30.png|p.30 IS-95 reverse(MS→BS) 블록도 — 9.6 kbps → 28.8 ksps → 6 to 64 symbol modulation → 307.2 kcps → long code(1.228 Mcps)로 DSSS → QPSK → 20 채널 중 하나 (\"94 digital channels DSSS\", 필기본: \"DSSS\" 동그라미)|large]]\n\n<pre class=\"txt\">\n1. 음성 3 kHz → Digitizer                          → 9.6 kbps\n2. Error correcting, repetition, interleaving      → 28.8 ksps   (3 배 — forward 의 2 배보다 더 튼튼하게)\n3. 6 to 64 symbol modulation: 6 symbol 묶음 → 64 chip 하나\n     28.8 k ÷ 6 = 4.8 k 묶음/s,  4.8 k × 64          → '''307.2 kcps'''\n4. ESN 의 long code (1.228 Mcps) 와 ⊕ — 칩 1 개당 long code 칩 4 개\n     307.2 k × 4                                    → '''1.2288 Mcps''' ≈ 1.228 Mcps   ← 여기가 DSSS\n5. QPSK → 1.228 MHz 채널 → Σ → 25-MHz band 의 20 채널 중 하나 (FDMA)\n<\/pre>\n\n{|\n! || forward (p.29, BS→MS) || reverse (p.30, MS→BS)\n|-\n| error correcting 후 || 19.2 ksps (×2) || 28.8 ksps (×3)\n|-\n| 사용자를 나누는 것 || '''Walsh code''' W0–W63 (점선 상자 \"CDMA\") || '''long code''' (점선 상자 \"DSSS\")\n|-\n| Walsh code 의 역할 || 사용자 구분용 코드 || 6 → 64 '''symbol modulation''' (변조용)\n|-\n| pilot || W0 = pilot channel || 없음\n|-\n| 최종 chip rate || 1.228 Mcps || 1.228 Mcps\n|-\n| 슬라이드 채널 수 || 64 digital channels || '''94 digital channels''' DSSS\n|}\n\n{info}왜 reverse 는 Walsh code 로 사용자를 나누지 않나? Walsh code 의 직교성은 '''모든 신호의 칩 경계가 정확히 맞을 때'''만 성립한다. forward 는 BS 한 곳에서 64 개를 동시에 만들어 보내니 맞지만, reverse 는 MS 들이 '''각자 다른 거리'''에서 보내 도착 시각이 제각각이다. 그래서 reverse 는 사용자마다 다른 '''long code''' 로 퍼뜨려(DSSS) 구분한다 (Forouzan 보충 — 슬라이드에 없음). → [[IS-95 reverse 전송]]{/info}\n\n== p.31–32 — IS-95: Frequency Reuse Factor and Handoff ⭐⭐⭐ ==\n[[img:L10-31.png|p.31 Frequency reuse factor — \"Normally 1 → Neighboring cells can use the same freq. band!\" (필기본: ① 동그라미, 육각형 1·1·1 \"가능해짐\")|medium]]\n\n{def}\"'''Frequency reuse factor''': '''Normally 1''' → '''Neighboring cells can use the same freq. band!''' Why? The interference from '''neighboring cells cannot affect CDMA or DSSS''' transmission.\" (p.31){/def}\n\n* [[CH05 셀룰러 동작]] 의 [[frequency reuse]]: FDMA/TDMA 에서는 이웃 cell 이 같은 주파수를 쓰면 [[co-channel interference]] 가 생기므로, cell 들을 N 개 그룹으로 나눠 같은 주파수 cell 을 떨어뜨렸다(AMPS [[reuse factor]] 7).\n* IS-95 는 '''N = 1''': '''모든 cell 이 같은 대역을 쓴다'''. 이웃 cell 의 신호는 내 코드로 곱하면 상관이 없어(다른 코드 → 내적 ≈ 0) 약한 잡음처럼 퍼져 버리기 때문이다.\n* 필기 '''육각형 1 · 1 · 1 \"가능해짐\"''' = 바로 이 그림. FDMA 라면 이웃끼리 1·2·3… 처럼 번호가 달라야 했는데, CDMA 라서 '''전부 1 이 가능해졌다'''.\n\n{tip}💡 '''필기 속 질문: \"Normally ①\" — 왜 \"normally\" 인가?''' 원칙적으로는 N=1 로 '''모든 cell 이 같은 1.228 MHz 채널'''을 쓸 수 있다는 뜻이다. \"normally\" 는 '''보통은 그렇게 운영한다'''는 단서 — provider 가 10 개 채널을 가지고 있으니 트래픽이 많은 곳에서 채널을 더 얹는 식의 예외 운용이 가능하다는 정도로 읽으면 된다. 시험 답은 슬라이드 문장 그대로 \"'''normally 1 — neighboring cells can use the same frequency band'''\" + 이유 \"'''interference from neighboring cells cannot affect CDMA or DSSS'''\".{/tip}\n\n[[anim:frequency_reuse_hex|이웃 cell 이 같은 주파수를 쓰면 경계에서 간섭(빨간 ✗) → N=4, N=7 로 떨어뜨리는 FDMA 방식 → 마지막 장면에서 IS-95 는 모든 cell 이 같은 색이지만 사용자마다 code 무늬가 다른 것을 확인하라]]\n\n[[sim:reuse_pattern]]\n위 시뮬레이터에서 옵션 '''N = 1 (IS-95 CDMA)''' 을 골라 N = 4 · 7 과 비교하라 — cell 당 쓸 수 있는 대역이 '''전 대역'''이 된다.\n\n[[img:L10-32.png|p.32 Soft handoff — \"Every BS continuously broadcasts signals using its pilot channel. MS can detect the pilot signal from its cell and neighboring cells → Enabling an MS to do a soft handoff.\"|medium]]\n\n{def}\"'''Soft handoff''': Every BS '''continuously broadcasts''' signals using its '''pilot channel'''. MS can '''detect the pilot signal from its cell and neighboring cells'''. → '''Enabling an MS to do a soft handoff'''.\" (p.32){/def}\n\n* [[soft handoff]] = '''make before break''': 새 BS 와 먼저 연결하고 나서 옛 BS 를 끊는다 (반대는 [[hard handoff]] = break before make).\n* IS-95 에서 이게 '''가능한 이유''' 두 가지가 p.31–32 에 함께 있다:\n# '''reuse factor 1''' — 이웃 BS 도 '''같은 주파수'''라서 MS 가 주파수를 바꾸지 않고도 두 BS 를 '''동시에''' 들을 수 있다.\n# '''pilot channel''' — 모든 BS 가 W0(all 1s) pilot 을 계속 방송하니, MS 는 이웃 BS 의 pilot 세기를 늘 재고 있다가 충분히 세지면 그 BS 를 추가한다.\n* FDMA/TDMA(AMPS, GSM)는 이웃 cell 주파수가 달라서 무선기를 새 주파수로 '''갈아타야''' 하므로 hard handoff 가 된다.\n\n[[anim:handoff_hard_soft|위 줄 hard handoff 에서 BS1 막대가 끝난 뒤 BS2 가 시작되는 빨간 틈을, 아래 줄 soft handoff 에서 두 막대가 겹치는 구간을 비교하라 — IS-95 는 아래 줄]]\n\n자세히 → [[IS-95 frequency reuse]], [[IS-95 soft handoff]], [[pilot channel]].\n\n== p.33 — 3rd Generation: IMT-2000 ⭐⭐⭐ ==\n[[img:L10-33.png|p.33 IMT-2000 — \"A blueprint of 3G issued by ITU\", Key Features(데이터율 144 k / 384 k / 2 M, packet + circuit, 2 GHz band, 2 MHz bandwidth), Main goal: universal personal communication (필기본: \"blue print, not actual standard\")|large]]\n\n{def}\"'''IMT-2000''' (Internet Mobile Telecommunications 2000): '''A blueprint of 3G''' issued by '''ITU''' (International Telecommunication Union).\nKey Features:\n* Voice quality comparable to that of the existing public telephone network\n* Data rate: '''144 kbps''' for access in a moving vehicle (car) · '''384 kbps''' for access as the user walks (pedestrians) · '''2 Mbps''' for the stationary user (office or home)\n* Support for '''packet-switched and circuit-switched''' data services\n* A band of '''2 GHz''' · Bandwidths of '''2 MHz''' · Interface to the Internet\nMain goal: provision of '''universal personal communication'''.\" (p.33){/def}\n\n{|\n! 사용자 상태 || 데이터율 || 외우는 법\n|-\n| moving vehicle (car) || '''144 kbps''' || 빨리 움직일수록 느리다\n|-\n| pedestrians (walking) || '''384 kbps''' ||\n|-\n| stationary (office, home) || '''2 Mbps''' || 가만히 있을수록 빠르다\n|}\n\n{tip}💡 '''필기 속 질문: \"blue print, not actual standard\"''' — 정확히 받아 적었다. IMT-2000 은 '''\"3G 라면 이 정도는 돼야 한다\"는 요구 사항 목록(청사진)'''이지, 그 자체가 장비를 만들 수 있는 규격이 아니다. ITU 가 기준(데이터율, 2 GHz 대역, packet/circuit 지원 …)을 내놓으면, 각 지역 단체가 그 기준을 만족하는 '''실제 표준'''을 만든다 — 그것이 다음 슬라이드의 '''5 개 표준'''(IMT-DS = W-CDMA, IMT-MC = CDMA 2000, …)이다. 비유하면 IMT-2000 은 \"방 3 개, 화장실 2 개, 30 평\" 이라는 '''설계 조건''', W-CDMA 와 CDMA 2000 은 그 조건으로 지은 '''실제 집''' 두 채. → [[IMT-2000]], [[IMT-2000 표준]]{/tip}\n\n{warn}⚠️ 슬라이드 제목의 풀네임은 '''\"Internet''' Mobile Telecommunications 2000\"이다. ITU 공식 명칭은 '''\"International''' Mobile Telecommunications-2000\"이다 (슬라이드에 없음). 시험에 풀네임이 나오면 슬라이드 표기를 쓰되, 공식 명칭도 알아 둘 것.{/warn}\n\n* '''packet-switched + circuit-switched''': 2G 까지는 통화마다 회선을 잡는 circuit switching 이었는데, 3G 는 인터넷 데이터용 '''packet switching''' 을 함께 지원한다 → [[circuit switching과 packet switching]]. 4G 에서는 circuit 이 사라지고 '''packet 만''' 남는다(p.36).\n* [[ITU]] = UN 산하 국제 전기통신 연합 — 전 세계 주파수·표준을 조율한다.\n\n== p.34–35 — IMT-2000 (3G): Standards ⭐⭐⭐ ==\n[[img:L10-34.png|p.34 IMT-2000 5 표준 — IMT-DS(Direct sequence, CDMA) · IMT-MC(Multicarrier, CDMA) · IMT-TC(Time code, CDMA & TDMA) · IMT-SC(Single carrier, TDMA) · IMT-FT(Frequency time, TDMA & FDMA)|large]]\n\n{|\n! 표준 || 풀이 (p.34) || 접근 방식 || p.35 상세\n|-\n| '''IMT-DS''' || '''D'''irect '''S'''equence || CDMA || '''W-CDMA''' (wideband CDMA), '''5 MHz''', '''Europe'''\n|-\n| '''IMT-MC''' || '''M'''ulti'''c'''arrier || CDMA || '''CDMA 2000''' (IS-95 CDMA 의 진화), 15 MHz wideband + 1.25 MHz narrowband, '''North America'''\n|-\n| IMT-TC || '''T'''ime '''C'''ode || CDMA & TDMA || (상세 없음)\n|-\n| IMT-SC || '''S'''ingle '''C'''arrier || TDMA || (상세 없음)\n|-\n| IMT-FT || '''F'''requency '''T'''ime || TDMA & FDMA || (상세 없음)\n|}\n이름에서 접근 방식이 나온다 — '''Direct sequence''' 는 DSSS 의 DS 라서 CDMA, '''Multicarrier''' 는 여러 반송파 + CDMA, '''Time code''' 는 시간(TDMA)+코드(CDMA), '''Single carrier''' 는 반송파 하나를 시간으로(TDMA), '''Frequency time''' 은 주파수(FDMA)+시간(TDMA). 5 개 중 '''CDMA 가 들어간 것이 3 개''' — 3G 의 주류가 CDMA 라는 뜻이다.\n\n[[img:L10-35.png|p.35 IMT-DS 와 IMT-MC 상세 (빨간 상자로 두 개 강조, 필기본: IMT-DS 옆 \"South Korea 3G\")|large]]\n\n{def}\"'''IMT-DS''': Use a version of CDMA: '''wideband CDMA (W-CDMA)'''. Use a '''5 MHz''' bandwidth. Developed in '''Europe'''.\n'''IMT-MC''': An '''evolution of CDMA used in IS-95''' channels: '''CDMA 2000'''. Combine the new '''wideband (15 MHz)''' spread spectrum with the '''narrowband (1.25 MHz) CDMA of IS-95'''. Developed in '''North America'''.\" (p.35){/def}\n\n{tip}💡 '''필기 속 질문: \"South Korea 3G\" — 한국 3G 는 IMT-DS(W-CDMA)?''' '''둘 다 썼다'''(슬라이드에 없는 배경). 한국은 2G 가 IS-95 라 처음에는 그 진화형인 '''CDMA 2000'''(IMT-MC; CDMA2000 1x, EV-DO)을 깔았고, 이후 SK텔레콤·KT 가 유럽식 '''W-CDMA'''(IMT-DS)로 3G 를 본격 전개해 이것이 한국 3G 의 주력이 되었다(LG U+ 는 CDMA 2000 계열 유지). '''교수(69:05)''': IMT-DS 는 \"'''used in South Korea. We use this one.'''\" — 즉 필기의 \"South Korea 3G\" 는 '''W-CDMA(IMT-DS)''' 를 가리킨다. 시험 답은 \"IMT-DS = W-CDMA, 한국이 쓴 3G\".{/tip}\n\n* '''W-CDMA vs CDMA 2000''' — 둘 다 CDMA 를 넓힌 것이지만 출신이 다르다: W-CDMA 는 '''유럽(GSM 진영)'''에서 새로 만든 5 MHz CDMA, CDMA 2000 은 '''북미 IS-95 를 그대로 이어받은''' 진화형(IS-95 의 1.25 MHz 채널과 호환). → [[W-CDMA]], [[CDMA 2000]]\n* 1.25 MHz 는 IS-95 채널 폭(p.28 의 1.228 MHz 를 반올림해 부르는 값)이다.\n\n== p.36 — 4th Generation ⭐⭐ ==\n[[img:L10-36.png|p.36 4th Generation — 100 Mbps(moving car) / 1 Gbps(stationary), smooth handoff across heterogeneous networks, All IP packet-switched (필기본: 기지국 △ 여러 개와 단말 □ 사이 화살표 — 교수가 말한 \"many base stations\" 스케치)|medium]]\n\n{def}\"'''4th Generation''': Expected to be a '''complete evolution''' in wireless communications.\n* A '''spectrally efficient''' system · '''High network capacity'''\n* Data rate of '''100 Mbps''' for access in a moving car and '''1 Gbps''' for stationary users\n* Data rate of at least 100 Mbps between any two points in the world\n* '''Smooth handoff across heterogeneous networks'''\n* High quality of service for next generation multimedia support\n* Interoperability with existing wireless standards\n* '''All IP, packet-switched, networks'''\" (p.36){/def}\n\n<pre class=\"txt\">\n3G → 4G 데이터율 비교\n  이동(car)   : 144 kbps → 100 Mbps   ≈ 100,000 / 144 ≈ 694 배\n  정지        :   2 Mbps →   1 Gbps   = 1,000 / 2     = 500 배\n<\/pre>\n* '''All IP, packet-switched''': 음성까지 IP 패킷으로 보낸다. 3G 의 \"packet + circuit\" 에서 circuit 이 빠졌다 → [[all-IP]], [[circuit switching과 packet switching]].\n* '''Smooth handoff across heterogeneous networks''': 셀룰러 ↔ WiFi 처럼 '''종류가 다른 망 사이'''에서도 끊김 없이 넘어간다.\n* 필기의 △(기지국) 여럿과 □(단말) 사이 화살표 스케치는 교수가 4G/5G trend 로 말한 '''\"use many base stations\"'''(71:46) 그림이다 — BS 를 촘촘히 깔면 MS–BS 거리가 줄고, 무선의 [[mid:attenuation|attenuation]] 이 줄어 data rate 가 올라간다 (아래 🎙 절).\n* 슬라이드는 4G 의 실제 표준 이름(LTE 등)을 주지 않는다. \"Expected to be\" 라는 표현처럼 '''요구 사항 목록''' 형태 → [[4G]].\n\n== 2G 세 표준 비교 — TDMA 계열 vs CDMA ⭐⭐⭐ ==\n{|\n! || [[D-AMPS]] || [[GSM]] || '''[[IS-95]]'''\n|-\n| 지역 || 북미 || 유럽 || 북미 + '''한국'''\n|-\n| 채널 폭 || 30 kHz || 200 kHz || '''1.228 MHz'''\n|-\n| 한 채널 안을 나누는 방법 || TDMA 3 slot || TDMA 8 slot || '''CDMA, Walsh code 64'''\n|-\n| 바깥(채널 사이) || FDMA || FDMA || FDMA (20 채널)\n|-\n| reuse factor || 7 (Forouzan 보충 — AMPS 와 같음; 슬라이드는 AMPS 7 만 명시) || 3 (Forouzan 보충 — 슬라이드에 없음) || '''normally 1''' (p.31)\n|-\n| handoff || hard (주파수를 갈아타야 함) || hard (〃) || '''soft''' (pilot channel, p.32)\n|-\n| 변조 || QPSK || GMSK || QPSK\n|}\n\n== 🎙 실제 수업 기록 (10/20 화, 녹음본 기준) ==\n녹음 `1020_컴네.txt` 54:50–73:22 (손글씨 타임스탬프: p.27 54:50 · p.28 1:00:50 · p.29 1:02:30 · p.30 1:04:10 · p.31 1:05:15 · p.32 1:06:20 · p.33 1:06:35 · p.34 1:08:50 · p.35 1:09:05 · p.36 1:10:15). 영어 ASR 이라 용어가 깨져 있다(\"ATRI\" = ETRI, \"IMT-270\" = IMT-2000, \"XDMA\" = FDMA, \"DSFF\" = DSSS) — 슬라이드 용어로 복원했다. 학생 질문은 이 구간에 없었다.\n\n{info}'''암기 범위 (41:54, 앞 구간 AMPS 설명 중):''' \"I'm '''not''' going to recommend you to memorize all these specific numbers, but instead … understand how communication systems '''evolve across generations'''. That '''trend''' is important.\" 단 \"'''uplink and downlink'''\" 는 외우라고 했다(BS→MS = downlink, MS→BS = uplink). → 이 문서의 1.228 MHz, 9.6 kbps, 307.2 kcps 같은 숫자는 '''원리를 보여 주는 예'''로 읽는다.{/info}\n\n=== p.27 IS-95 — DSSS 와 CDMA (54:50–1:00:43) ===\n* IS-95 는 \"North America and South Korea\" 의 2G. GSM 과의 '''big difference''' 는 \"based on '''DSSS''' … and '''CDMA'''\". \"CDMA … was very famous in Korea.\"\n* DSSS: 필기 스케치 그대로 칠판에 그림 — 대역폭 W1 인 신호를 '''W2 로 퍼뜨리는''' 것이 spread spectrum. \"'''the information contained in this one and this one are the same'''\" — 퍼뜨려도 정보량은 같다(강조).\n* 왜 퍼뜨리나: \"'''for implementing multiple access'''\" — DSSS 로 구현한 MA 가 CDMA. \"if we multiply a '''code''' to these signals … This is why we call it code.\"\n* 오른쪽 그림: FDMA 는 주파수로, TDMA 는 시간으로 매체를 나누고, CDMA 는 \"spread over time and frequency … shared by users at the '''same time and same frequency'''\". 색깔 판 하나하나가 code 1, 2, 3 — \"'''divided by code, not frequency, nor time'''.\"\n* '''ETRI''' (59:55): \"Koreans contributed a lot to invent CDMA … ETRI … government research institute … they earned money a lot.\" → [[ETRI]]\n* \"And the '''beauty of CDMA''', we will see shortly.\" (→ p.31 reuse factor 1)\n\n=== p.28 Bands, channels, sync (1:00:47–1:02:32) ===\n{exam}🎯 '''\"One important distinction to previous ones is its bandwidth\"''' (61:15). AMPS/D-AMPS 30 kHz, GSM 200 kHz 에 비해 IS-95 는 \"'''a lot bigger bandwidth'''\" — \"'''because of CDMA that spreads spectrum'''\". 숫자(1.228 MHz)보다 '''\"CDMA 는 퍼뜨리므로 채널이 훨씬 넓다\"는 이유'''가 요점.{/exam}\n* 두 대역으로 동시에 송수신(duplex) — 이전 세대와 같음.\n* GPS 로 BS·MS 동기화 — 바로 이어서 \"'''But this one is not that important.'''\" (62:29)\n\n=== p.29–30 Forward / reverse (1:02:32–1:05:15) ===\n{exam}🎯 '''\"The important part is: to implement DSSS, IS-95 introduces these blocks\"''' (62:32). 사용자마다 다른 code → 하나의 신호로 합쳐짐 → \"these aggregated '''64 user''' signals\" 가 QPSK 로 '''한 1.228 MHz 주파수 채널'''에 실림 — \"64 different users in this one … bag, W1, W2, W3 …\" (필기 \"64 user\" 가 이 말). reverse 도 \"user-specific … '''direct sequence spread spectrum from user to base station'''\".\n'''\"The key point is that they use large bandwidth aggregated across different users.\"''' (64:36){/exam}\n{info}'''세부 블록은 몰라도 된다''' (64:45): \"You don't have to understand the different technical details on CDMA because I did not tell you anything about the details, but you have to remember that '''the medium is shared across so-called codes''', to '''spread the spectrum wide to avoid interference'''.\" → 블록도 rate(9.6 → 19.2 → 1.228 M 등)는 원리 확인용. 외울 것은 \"code 로 공유, 넓게 퍼뜨려 간섭 회피\".{/info}\n\n=== p.31–32 Reuse factor 1, soft handoff (1:05:15–1:06:35) ===\n{exam}🎯 '''\"The beauty of CDMA\"''' = '''frequency reuse factor 1''' (65:15): \"neighboring cells can use the same frequency, '''which is not allowed in previous communication systems'''.\" 이유: \"They don't have to differentiate frequency or time, except they '''differentiate by code'''.\" 결과: \"'''very efficient in terms of frequency and also time'''.\" + \"it also serves '''soft handoff'''.\"{/exam}\n* \"Normally\" 의 단서는 따로 설명하지 않았다.\n\n=== p.33 3G IMT-2000 (1:06:35–1:08:41) ===\n{exam}🎯 '''2G → 3G 의 key point''' (66:35): \"providing communication '''more than voice''', from voice to '''text and data'''. That is what we call '''universal personal communication'''.\"\n'''Trend''' (67:16–68:10): \"larger bandwidth and larger frequency … the speed and efficiency of communication is heavily depending on the '''amount of frequency and time''' … Larger frequency bandwidth enables more users to cover, and that is '''one common trend of advancement''' seen in wireless communications.\"{/exam}\n* 데이터율(144 k/384 k/2 M)은 \"peak data rates\" 로만 언급. \"these features are described by a '''blueprint''' of 3G, '''not actual standards'''\" (필기 그대로) — '''IMT-2000''', \"invented by '''ITU''', a very famous group for communications\".\n\n=== p.34–35 Standards (1:08:41–1:10:18) ===\n* \"actual standards … five representative standards\" — 그중 '''DS 와 MC 두 개에 집중'''.\n* '''IMT-DS''': \"'''used in South Korea. We use this one.'''\" 다른 이름 W-CDMA. \"As we can expect from each name\" — CDMA with large bandwidth 5 MHz, developed in Europe.\n* '''IMT-MC''': \"an improved version of IS-95 … simply called '''CDMA 2000'''\", North America, large bandwidth (슬라이드 15 MHz; ASR 은 \"50\").\n\n=== p.36 4G — 그리고 5G trend (1:10:18–1:12:58) ===\n* \"This is the last slide of today's lecture.\" 지금은 4G·5G 를 쓰지만 \"'''Forouzan's book is an old book'''\" 이라 4G 는 '''expectation''' 으로만 적혀 있다.\n* '''Natural trend''': \"more data rate, and to do that, we need '''more bandwidth''' and more advanced techniques to improve '''frequency efficiency'''.\"\n* '''5G''' (슬라이드에 없음, 교수 구두): \"use '''huge bandwidth'''\" — \"extremely high frequency bands over 10 GHz or a few hundred GHz\", 수 GHz 의 대역폭.\n* '''\"Use many base stations\"''' (71:46): BS 가 많으면 MS–BS 거리가 줄고, 무선은 [[mid:attenuation|attenuation]](신호 세기 감소)을 겪으므로 '''data rate 가 올라간다''' — 필기의 △(BS) 여럿 + □(MS) 스케치.\n* 서비스도 voice → text, data → video, file transfer 로.\n\n=== 공지 (73:00) ===\n* \"From the next course, on '''Thursday''', we will study '''satellite networks''', which is the '''last part of WAN''', and move on to the '''network layer''' … one of the most crucial parts in this course.\"\n\n== 시험 대비 핵심 요약 ==\n교수 기준(41:54·64:45): '''숫자보다 원리와 세대별 trend'''. 1–8 이 우선, 9 의 숫자는 \"알면 좋은\" 참고.\n# '''CDMA''' = 매체를 '''code''' 로 나눈다 — '''frequency 도 time 도 아니다'''. 모든 사용자가 '''같은 시간·같은 주파수'''를 쓰고, 서로 직교인 code 로 자기 신호만 꺼낸다.\n# '''DSSS''' = 좁은 신호(W1)를 넓은 대역(W2)으로 '''퍼뜨리는''' modulation technique. 퍼뜨려도 '''정보는 같다'''. 퍼뜨리는 이유 = '''multiple access(CDMA) 구현''' + '''간섭 회피'''. CDMA 는 \"an MA method based on DSSS\".\n# '''IS-95''' = 북미 + '''한국'''의 2G, '''DSSS + CDMA'''. GSM(TDMA)과의 big difference. 한국 '''ETRI''' 가 CDMA 에 크게 기여.\n# 이전 세대와의 '''important distinction = bandwidth''' — IS-95 채널은 30 kHz(AMPS)·200 kHz(GSM)보다 훨씬 넓다. '''CDMA 가 spectrum 을 퍼뜨리기 때문'''.\n# 한 넓은 채널에 '''여러 사용자(64 code)의 신호가 합쳐져''' 실린다(large bandwidth aggregated across users). forward 는 code(W0–W63, '''W0 = pilot''')로, reverse 는 사용자별 DSSS 로.\n# '''\"The beauty of CDMA\" = reuse factor 1''' — 이웃 cell 도 같은 주파수(이전 시스템에서는 불가). code 로 구분하므로 이웃 cell 간섭이 영향을 못 줌 → frequency·time 효율 ↑.\n# '''soft handoff''': 모든 BS 가 '''pilot channel''' 을 계속 방송 → MS 가 이웃 cell pilot 감지 → make before break. (이웃도 같은 주파수라 동시에 들을 수 있음)\n# '''2G → 3G''' = voice 를 넘어 '''text·data''' = '''universal personal communication''', packet + circuit. '''IMT-2000''' = '''ITU''' 의 '''blueprint, not actual standard'''. 실제 표준 5 개 중 '''IMT-DS = W-CDMA'''(Europe, '''한국이 쓰는 3G''') · '''IMT-MC = CDMA 2000'''(IS-95 개선판, North America). '''4G''' = '''All IP, packet-switched'''.\n# '''Trend''': 세대가 갈수록 '''bandwidth 와 frequency 를 더 크게''' → data rate·사용자 수 ↑, frequency efficiency ↑. 5G: huge bandwidth(10 GHz 이상 대역) + '''many base stations'''(거리 ↓ → attenuation ↓ → data rate ↑).\n# (참고 숫자) IS-95 채널 1.228 MHz × 20, provider 당 10, chip rate 1.228 Mcps, GPS 동기화(\"not that important\") · 3G 144 k / 384 k / 2 M bps · W-CDMA 5 MHz · 4G 100 Mbps / 1 Gbps.\n\n== 공식 모음 ==\n{|\n! 대상 || 식 || 값\n|-\n| IS-95 forward chip rate || $19.2\\text{ ksps} \\times 64$ || $1.2288\\text{ Mcps} \\approx 1.228\\text{ Mcps}$\n|-\n| IS-95 reverse (6-to-64) || $28.8\\text{ ksps} \\div 6 \\times 64$ || $307.2\\text{ kcps}$\n|-\n| IS-95 reverse chip rate || $307.2\\text{ kcps} \\times 4$ || $1.2288\\text{ Mcps}$\n|-\n| forward 오류정정 배수 || $19.2 \\div 9.6$ || $2$\n|-\n| reverse 오류정정 배수 || $28.8 \\div 9.6$ || $3$\n|-\n| 한 대역의 채널 폭 합 || $20 \\times 1.228\\text{ MHz}$ || $24.56\\text{ MHz}$ (25 MHz 중)\n|-\n| CDMA 복원 || $d_i = \\frac{1}{N}\\sum_k (\\text{채널})_k \\cdot c_{i,k}$ || 다른 코드 몫은 0\n|}\n\n== 관련 문서 ==\n* 앞 구간: [[CH05 셀룰러 동작]] · [[CH05 1G–2G 셀룰러]] · [[셀룰러 세대]] · [[셀룰러 세대 비교표]]\n* IS-95: [[IS-95]] · [[DSSS]] · [[CDMA]] · [[Walsh code]] · [[chip rate]] · [[IS-95 대역과 채널]] · [[GPS 동기화]] · [[IS-95 forward 전송]] · [[IS-95 reverse 전송]] · [[pilot channel]] · [[long code와 ESN]] · [[QPSK]] · [[IS-95 frequency reuse]] · [[IS-95 soft handoff]]\n* 3G·4G: [[3G]] · [[IMT-2000]] · [[ITU]] · [[IMT-2000 표준]] · [[W-CDMA]] · [[CDMA 2000]] · [[circuit switching과 packet switching]] · [[4G]] · [[all-IP]] · [[ETRI]]\n* 용어: [[spread spectrum]] · [[FDMA]] · [[TDMA]] · [[soft handoff]] · [[frequency reuse]]\n* 중간고사: [[mid:channelization]] · [[mid:FHSS]] · [[mid:PSK]] · [[mid:guard band]]"
 },
 "IS-95": {
  "title": "IS-95 (Interim Standard 95)",
  "category": [
   "3강 CDMA–4G",
   "용어"
  ],
  "body": "'''IS-95 (Interim Standard 95)''' 는 '''북미와 한국'''에서 쓰인 [[2G]] 셀룰러 표준으로, [[DSSS]] 로 신호를 퍼뜨리고 [[CDMA]] 로 사용자를 나눈다. 같은 2G 인 [[D-AMPS]]·[[GSM]] 이 시간([[TDMA]])으로 나눈 것과 달리 '''코드'''로 나눈다는 점이 핵심이다. L10 p.27–32.\n\n{def}\"'''IS-95 (Interim Standard 95)''': One of the dominant 2G standards in '''North America (and South Korea)'''. Based on '''DSSS and CDMA'''. DSSS (Direct-Sequence Spread Spectrum): a signal-spreading modulation technique. CDMA (Code-Division Multiple Access): an MA method based on DSSS.\" (p.27)\n→ 북미·한국의 대표 2G 표준. DSSS(퍼뜨리는 변조) + CDMA(코드로 나누는 다중 접속).{/def}\n\n[[img:L10-27.png|p.27 IS-95 — forward link 는 code 로 구분되는 합성 신호, 오른쪽 FDMA/TDMA/CDMA 비교 (필기본)|medium]]\n\n== 이름에서 개념 끌어내기 ==\n* '''Interim''' = '''임시의, 잠정적인'''. 미국 TIA(통신산업협회)가 정식 표준이 확정되기 전 \"임시 표준 95 번\"으로 낸 이름이다 (Forouzan 보충 — 슬라이드에 없음). 이름은 임시였지만 북미·한국 2G 의 주력이 됐다.\n* 다른 이름으로 '''cdmaOne''' 이라고도 부른다 (보충). 한국에서 \"CDMA 폰\" 이라고 하면 이것.\n\n== 한 장 요약 ==\n{|\n! 항목 || 값 || 문서\n|-\n| 기술 || DSSS + CDMA || [[DSSS]], [[CDMA]]\n|-\n| 대역 || 두 대역(duplex): ISM 800 MHz, ISM 1,900 MHz || [[IS-95 대역과 채널]]\n|-\n| 채널 || 1.228 MHz × 20 (guard band), provider 당 10 || [[IS-95 대역과 채널]]\n|-\n| 동기화 || BS 가 GPS 사용 || [[GPS 동기화]]\n|-\n| forward (BS→MS) || Walsh code 64 개로 구분, W0 = pilot || [[IS-95 forward 전송]], [[Walsh code]], [[pilot channel]]\n|-\n| reverse (MS→BS) || long code 로 DSSS || [[IS-95 reverse 전송]], [[long code와 ESN]]\n|-\n| chip rate || 1.228 Mcps || [[chip rate]]\n|-\n| 변조 || QPSK || [[QPSK]]\n|-\n| reuse factor || normally 1 || [[IS-95 frequency reuse]]\n|-\n| handoff || soft || [[IS-95 soft handoff]]\n|}\n\n[[anim:cdma_spreading|IS-95 의 핵심 원리 — 여러 사용자의 비트가 코드와 곱해져 더해지고, 수신자가 자기 코드로 자기 비트만 꺼내는 장면을 보라]]\n\n{tip}💡 '''필기 속 질문: \"ETRI가 개발?\"''' — 원천 기술은 미국 '''Qualcomm''', 한국 '''[[ETRI]]''' 가 Qualcomm 과 공동으로 '''상용 시스템을 개발'''해 한국이 1996 년 세계 최초로 CDMA 를 상용화했다. 그래서 슬라이드가 \"North America '''(and South Korea)'''\" 라고 쓴다. (슬라이드에 없는 배경){/tip}\n\n{analogy}🎭 2G 의 세 표준을 식당 좌석으로 보면: [[D-AMPS]] 는 작은 테이블(30 kHz) 하나를 3 명이 '''교대로''' 쓰고, [[GSM]] 은 조금 큰 테이블(200 kHz)을 8 명이 교대로 쓴다. IS-95 는 '''큰 홀(1.228 MHz) 하나에 수십 명이 동시에''' 앉되, 테이블마다 '''다른 언어'''로 말해서 서로 방해가 안 된다.{/analogy}\n\n{exam}🎯 \"IS-95 is based on ___ and ___\" → '''DSSS, CDMA'''. DSSS 와 CDMA 중 어느 것이 '''modulation technique''' 이고 어느 것이 '''MA method''' 인지 바꿔 내는 O/X 가 나오기 좋다 (DSSS = modulation, CDMA = MA).{/exam}\n\n{quiz}IS-95 가 같은 2G 인 GSM 과 다른 점을 '''multiple access 방식, reuse factor, handoff''' 세 측면에서 쓰시오.{/quiz}\n{answer}* multiple access: GSM = '''TDMA'''(200 kHz 채널을 8 slot 으로) / IS-95 = '''CDMA'''(1.228 MHz 채널을 Walsh code 64 개로)\n* reuse factor: GSM 은 1 보다 큼(이웃 cell 은 다른 주파수) / IS-95 는 '''normally 1'''(이웃 cell 도 같은 대역)\n* handoff: GSM 은 hard / IS-95 는 pilot channel 덕분에 '''soft handoff'''{/answer}\n\n== 관련 문서 ==\n* [[CH05 IS-95·3G·4G]] · [[CDMA]] · [[DSSS]] · [[2G]] · [[GSM]] · [[D-AMPS]] · [[CDMA 2000]] (IS-95 의 3G 진화형)"
 },
 "DSSS": {
  "title": "DSSS (Direct-Sequence Spread Spectrum)",
  "category": [
   "3강 CDMA–4G",
   "용어"
  ],
  "body": "'''DSSS (direct-sequence spread spectrum)''' 는 데이터 비트 하나하나에 '''빠른 ±1 칩열(spreading code)'''을 곱해서, 원래 좁았던 신호를 '''넓은 대역으로 퍼뜨리는''' 변조 기법이다. [[IS-95]] 는 DSSS 위에 [[CDMA]] 를 얹었다. 중간고사 [[mid:FHSS|FHSS]] 와 함께 [[spread spectrum]] 의 두 방식 중 하나. L10 p.27, p.30.\n\n{def}\"'''DSSS (Direct-Sequence Spread Spectrum)''': a '''signal-spreading modulation technique'''.\" (p.27)\n→ 신호를 넓게 퍼뜨리는 변조 기법.{/def}\n\n== 이름에서 개념 끌어내기 ==\n* '''Spread Spectrum''' — 스펙트럼(주파수 폭)을 '''퍼뜨린다'''. 필기 스케치 \"'''W1 ≪ W2'''\" 가 정확히 이것: 원래 폭 W1 → 퍼진 폭 W2.\n* '''Direct-Sequence''' — 칩 '''수열(sequence)'''을 데이터에 '''직접(direct)''' 곱한다. 주파수를 바꾸는 게 아니라 비트 자체를 칩 여러 개로 바꾼다.\n* 대비: [[mid:FHSS|FHSS]] = '''Frequency-Hopping''' — 주파수를 '''뛰어다니며''' 퍼뜨린다. 둘 다 결과는 \"넓은 대역\"이지만 방법이 다르다.\n\n{exam}🎯 교수(10/20, 56:09–57:39): 칠판에 W1 → W2 로 퍼뜨리는 그림(필기 스케치) — \"'''the information contained in this one and this one are the same'''\", 그리고 퍼뜨리는 이유는 \"'''for implementing multiple access'''\" (그것이 CDMA).{/exam}\n\n== 동작 ==\n<pre class=\"txt\">\n비트 1 개   (+1)        ──×  칩열 [+1 −1 +1 +1 −1 …] (n 칩)\n               ↓\n칩 n 개     [+1 −1 +1 +1 −1 …]         ← 같은 시간에 n 배 많은 기호\n               ↓\n대역폭 ≈ n 배로 넓어짐   (W1 → W2 = n·W1)\n\nIS-95 forward : 19.2 ksps × 64 chips = 1.228 Mcps   → 확산 배수 64\nIS-95 reverse : 307.2 kcps × 4       = 1.228 Mcps   → long code 로 DSSS (p.30 점선 상자 \"DSSS\")\n<\/pre>\n* 수신자는 '''같은 칩열을 다시 곱하면''' 원래 비트로 돌아온다($(+1)(+1)=1$, $(-1)(-1)=1$). 다른 칩열로 곱한 신호(남의 신호, 이웃 cell 의 간섭)는 퍼진 채로 남아 '''약한 잡음'''이 된다 → 이게 [[IS-95 frequency reuse|reuse factor 1]] 의 이유.\n\n[[img:L10-30.png|p.30 IS-95 reverse — 점선 상자 \"DSSS\"(필기 동그라미): long code 1.228 Mcps 로 퍼뜨린 뒤 QPSK|medium]]\n\n[[anim:cdma_spreading|비트(+1/−1)가 칩열과 곱해져 잘게 쪼개지는 첫 장면이 DSSS, 그 뒤 여럿이 더해지고 분리되는 장면이 CDMA 다 — 둘의 경계를 찾아보라]]\n\n{warn}⚠️ '''\"다시\" 표시한 곳.''' DSSS 와 CDMA 를 한 문장씩: '''DSSS = 비트 하나를 칩 여러 개로 바꿔 대역을 넓히는 \"기법\"(modulation technique). CDMA = 사용자마다 다른 칩열을 줘서 같은 대역을 나눠 쓰게 하는 \"다중 접속\"(MA method), DSSS 를 기반으로 한다.''' DSSS 만 있고 사용자가 한 명이어도 DSSS 는 DSSS 다(예: 원조 802.11 의 DSSS). 여러 사용자가 코드로 나눠 쓸 때 비로소 CDMA.{/warn}\n\n{info}DSSS 는 WiFi 에도 나왔다 — 원조 IEEE 802.11 physical layer 의 DSSS(11 칩 Barker sequence, Forouzan 보충 — 슬라이드에 없음) → [[mid:802.11 physical layer]].{/info}\n\n{analogy}🎭 '''한 글자를 길게 늘여 쓰는 암호.''' \"가\" 한 글자를 보내는 대신 미리 정한 64 글자짜리 문장으로 바꿔 보낸다. 받는 사람은 그 문장을 알고 있으니 \"아, 이건 '가'구나\" 하고 되돌린다. 보내는 글자 수(칩 수)가 64 배가 되니 더 넓은 길(대역)이 필요하지만, 중간에 몇 글자가 잡음에 묻혀도 전체 문장으로 알아볼 수 있다.{/analogy}\n\n{quiz}DSSS 에서 데이터율이 19.2 ksps 이고 각 symbol 을 64 chips 로 퍼뜨리면 chip rate 는? 대역폭은 대략 몇 배가 되나?{/quiz}\n{answer}<pre class=\"txt\">\n19.2 ksps × 64 = 1,228.8 kcps = 1.2288 Mcps ≈ 1.228 Mcps\n대역폭 ≈ 64 배\n<\/pre>{/answer}\n\n== 관련 문서 ==\n* [[spread spectrum]] · [[CDMA]] · [[chip rate]] · [[Walsh code]] · [[long code와 ESN]] · [[IS-95]] · [[mid:FHSS]]"
 },

   "용어"
