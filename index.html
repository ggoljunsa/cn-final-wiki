    s += during(3.4, D, txt(126, 240, "채널 하나 = 1 명", 12, C.a, ' font-weight="700" text-anchor="start"'));

    // ================= D-AMPS (오른쪽) =================
    var RY = [96, 136, 176];
    var SX = 500, SW = 32, SY = 210, SH = 22;      // TDMA 슬롯 6칸
    function slotC(k) { return SX + k * SW + SW / 2; }
    RY.forEach(function (y, i) {
      s += phone(318, y - 12, UC[i][0], UC[i][1]);
      s += txt(340, y - 2, "3 kHz", 10, "#222", ' text-anchor="start"') + txt(340, y + 10, "Voice", 10, "#222", ' text-anchor="start"');
      s += boxT(372, y - 12, 60, 24, "Digitizer", UC[i][1], UC[i][0]);
      s += txt(438, y - 5, "7.95 kbps", 11, UC[i][0], ' font-weight="700" text-anchor="start"');
      // 가로선 → 두 슬롯(i, i+3)으로 내려감
      var xa = slotC(i), xb = slotC(i + 3);
      s += '<path d="M432,' + y + ' L' + xb + ',' + y + '" fill="none" stroke="#555" stroke-width="1.3"/>';
      s += '<path d="M' + xa + ',' + y + ' L' + xa + ',' + (SY - 2) + '" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#da_arr)"/>';
      s += '<path d="M' + xb + ',' + y + ' L' + xb + ',' + (SY - 2) + '" fill="none" stroke="#555" stroke-width="1.3" marker-end="url(#da_arr)"/>';
      // 디지털 음성 패킷: 디지타이저 → 두 슬롯
      s += during(4.7 + i * 0.3, 6.8, '<rect x="372" y="' + (y - 12) + '" width="60" height="24" rx="4" fill="none" stroke="' + C.hot + '" stroke-width="2.5"/>');
      s += packet("M432," + y + " L" + xa + "," + y + " L" + xa + "," + (SY - 6), UC[i][0], 5.2 + i * 0.25, 1.2);
      s += packet("M432," + y + " L" + xb + "," + y + " L" + xb + "," + (SY - 6), UC[i][0], 5.4 + i * 0.25, 1.3);
    });
    // TDMA 프레임
    for (var k = 0; k < 6; k++) {
      var u = k % 3;
      s += '<rect x="' + (SX + k * SW) + '" y="' + SY + '" width="' + SW + '" height="' + SH + '" fill="#fff" stroke="#555"/>';
      s += during(6.9 + k * 0.3, D, '<rect x="' + (SX + k * SW) + '" y="' + SY + '" width="' + SW + '" height="' + SH + '" fill="' + UC[u][0] + '" stroke="#555"/>' +
        txt(slotC(k), SY + 16, String(u + 1), 12, "#fff", ' font-weight="700"'));
    }
    s += txt(SX + 6 * SW + 8, SY + 16, "TDMA", 12, C.hot, ' font-weight="700" text-anchor="start"');
    s += '<path d="M' + SX + ',' + (SY + SH + 6) + ' L' + SX + ',' + (SY + SH + 12) + ' L' + (SX + 6 * SW) + ',' + (SY + SH + 12) + ' L' + (SX + 6 * SW) + ',' + (SY + SH + 6) + '" fill="none" stroke="#333"/>';
    s += during(8.3, D, txt(SX + 3 * SW, SY + SH + 27, "48.6 kbps", 12, C.hot, ' font-weight="700"'));
    // 프레임 → QPSK → 대역
    s += '<path d="M' + SX + ',' + (SY + SH / 2) + ' L360,' + (SY + SH / 2) + ' L360,286 L372,286" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#da_arr)"/>';
    s += boxT(374, 274, 50, 24, "QPSK", "#efe9f6", C.dev);
    s += '<line x1="424" y1="286" x2="466" y2="286" stroke="#555" stroke-width="1.5" marker-end="url(#da_arr)"/>';
    s += txt(445, 278, "30 kHz", 11, "#222");
    // 3색 혹 (TDMA 로 공유)
    var fillD = '<g clip-path="url(#da_hump)"><rect x="0" y="-22" width="9" height="22" fill="' + C.a + '"/><rect x="9" y="-22" width="8" height="22" fill="' + C.b + '"/><rect x="17" y="-22" width="9" height="22" fill="' + C.c + '"/></g><path d="' + HUMP + '" fill="none" stroke="#555"/>';
    var bD = bandStrip(472, 300, 268, 0, fillD, 9.9);
    s += bD.svg;
    s += packet("M" + SX + "," + (SY + SH / 2) + " L360," + (SY + SH / 2) + " L360,286 L372,286", C.hot, 9.2, 0.7) + packet("M424,286 L" + (bD.x) + ",286", C.hot, 9.9, 0.4);

    // ---- 비교 배지 ----
    s += during(11.3, D, '<rect x="166" y="104" width="112" height="40" rx="6" fill="' + C.aL + '" stroke="' + C.a + '"/>' + txt(222, 120, "AMPS", 11, C.a, ' font-weight="700"') + txt(222, 136, "1 user / 30 kHz", 11, C.a, ' font-weight="700"'));
    s += during(11.3, D, '<rect x="316" y="304" width="140" height="34" rx="6" fill="#fdeef0" stroke="' + C.hot + '"/>' + txt(386, 318, "D-AMPS", 11, C.hot, ' font-weight="700"') + txt(386, 332, "3 users / 30 kHz", 11, C.hot, ' font-weight="700"'));

    // ---- 요점 ----
    s += txt(380, 366, "같은 대역·같은 30 kHz 채널에서 디지털화 + TDMA 로 3 배 사용자 — 2G 의 핵심", 12, C.muted);
    s += '</svg>';
    return s;
  }
};

// ===== anims/frequency_reuse_hex.js =====
// ============================================================
// frequency_reuse_hex — L10 p.11 (frequency reuse principle, reuse factor N=4 / N=7) + IS-95 의 N=1
// 0–1.5 빈 cell 격자 → 1.5–4 모두 같은 주파수 → 경계 interference ✗ → 4–7 N=4 색칠
//   → 7–10 N=7 색칠 → 10–14 IS-95: 모두 같은 주파수(N=1), 사용자는 code 로 구분
// ============================================================
window.ANIMS = window.ANIMS || {};
ANIMS["frequency_reuse_hex"] = {
  title: "Frequency reuse — 이웃 cell 은 다른 주파수, N 개마다 재사용, 14초",
  desc: "인접 cell 이 같은 주파수를 쓰면 경계의 사용자에게 [[co-channel interference|interference]]. 그래서 N 개 cell 을 한 pattern 으로 묶어 주파수를 나눠 쓰고, pattern 마다 재사용한다 — N 이 [[reuse factor]]. [[IS-95 frequency reuse|IS-95]] 는 CDMA 라서 N=1",
  duration: 14,
  build: function () {
    var D = 14;
    var C = {
      a: "#1d65b3", aL: "#dbe8f7", b: "#2e9e4f", bL: "#dff3e4", c: "#e09a40", cL: "#fdeec2",
      dev: "#3b2f4a", devL: "#efe9f6", red: "#d6465f", muted: "#777", ink: "#222",
      cell: "#c9a227", cellL: "#fdf3c4"
    };
    function r2(v) { return Math.round(v * 100) / 100; }
    function r4(v) { return Math.round(v * 10000) / 10000; }
    function txt(x, y, s, size, fill, extra) {
      return '<text x="' + r2(x) + '" y="' + r2(y) + '" font-size="' + (size || 13) + '" fill="' + (fill || C.ink) + '"' + (/text-anchor/.test(extra || "") ? "" : ' text-anchor="middle"') + (extra || "") + '>' + s + '</text>';
    }
    // from~to 초에만 보이기 (0.12s 페이드)
    function show(from, to) {
      var f = 0.12 / D, a = r4(from / D), b = r4(Math.min(from / D + f, (from + to) / 2 / D));
      if (to >= D) return '<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;' + a + ';' + b + ';1" dur="' + D + 's" fill="freeze"/>';
      var c = r4(Math.max(b, to / D - f)), d = r4(to / D);
      return '<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;' + a + ';' + b + ';' + c + ';' + d + ';1" dur="' + D + 's" fill="freeze"/>';
    }
    function vis(from, to, inner) { return '<g opacity="0">' + inner + show(from, to) + '</g>'; }
    function caps(list) {
      return list.map(function (c) { return vis(c[0], c[1], txt(380, 26, c[2], 14, C.ink, ' font-weight="700"')); }).join("");
    }
    function hexPts(cx, cy, r, pointy) {
      var p = [];
      for (var i = 0; i < 6; i++) {
        var a = Math.PI / 180 * (60 * i + (pointy ? 30 : 0));
        p.push(r2(cx + r * Math.cos(a)) + "," + r2(cy + r * Math.sin(a)));
      }
      return p.join(" ");
    }
    function hex(cx, cy, r, fill, stroke, pointy, extra) {
      return '<polygon points="' + hexPts(cx, cy, r, pointy) + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.5"' + (extra || "") + '/>';
    }
    function rbox(x, y, w, h, fill, stroke, lines, size, col) {
      var s = '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="6" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.8"/>';
      lines = [].concat(lines || []);
      var n = lines.length, fs = size || 13;
      lines.forEach(function (l, i) { s += txt(x + w / 2, y + h / 2 + (i - (n - 1) / 2) * (fs + 3) + fs * 0.36, l, fs, col || C.ink, ' font-weight="700"'); });
      return s;
    }
    // 기지국 탑: (x, y) = 밑변 가운데, 높이 26
    function tower(x, y, col) {
      col = col || C.dev;
      return '<path d="M' + r2(x - 7) + ',' + r2(y) + ' L' + r2(x) + ',' + r2(y - 26) + ' L' + r2(x + 7) + ',' + r2(y) + ' Z" fill="#fff" stroke="' + col + '" stroke-width="1.8" stroke-linejoin="round"/>' +
        '<line x1="' + r2(x - 4) + '" y1="' + r2(y - 10) + '" x2="' + r2(x + 4) + '" y2="' + r2(y - 10) + '" stroke="' + col + '" stroke-width="1.4"/>';
    }
    // 휴대폰(MS): 중심 (x, y), 12×22
    function phone(x, y, col, fill) {
      col = col || C.ink;
      return '<rect x="' + r2(x - 6) + '" y="' + r2(y - 11) + '" width="12" height="22" rx="2.5" fill="' + (fill || "#fff") + '" stroke="' + col + '" stroke-width="1.6"/>' +
        '<line x1="' + r2(x - 2.5) + '" y1="' + r2(y - 7) + '" x2="' + r2(x + 2.5) + '" y2="' + r2(y - 7) + '" stroke="' + col + '" stroke-width="1.4"/>';
    }
    function line(x1, y1, x2, y2, col, w, extra) {
      return '<line x1="' + r2(x1) + '" y1="' + r2(y1) + '" x2="' + r2(x2) + '" y2="' + r2(y2) + '" stroke="' + col + '" stroke-width="' + (w || 2) + '"' + (extra || "") + '/>';
    }
    function pth(d, col, w, extra) {
      return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + (w || 2) + '"' + (extra || "") + '/>';
    }
    // 경로를 따라 움직이는 점 (begin~begin+dur 동안만 보임)
    function dot(d, begin, dur, col, rad) {
      return '<circle r="' + (rad || 5) + '" fill="' + col + '" opacity="0"><animateMotion begin="' + begin + 's" dur="' + dur + 's" fill="freeze" path="' + d + '"/>' + show(begin, begin + dur) + '</circle>';
    }
    function marker(id, col) {
      return '<marker id="' + id + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="' + col + '"/></marker>';
    }

    var s = '<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="frequency reuse 패턴 N=4, N=7, IS-95 N=1 애니메이션">';
    s += '<defs>' + marker("fr_arR", C.red) + '</defs>';

    s += caps([
      [0, 1.5, "서비스 지역을 cell 로 나누고, cell 마다 주파수 묶음(frequency set)을 준다"],
      [1.5, 4, "인접 cell 이 같은 주파수를 쓰면 → cell 경계의 사용자에게 interference"],
      [4, 7, "reuse factor N=4: 4개 cell 이 한 pattern — 같은 번호(같은 주파수) cell 은 떨어져 있다"],
      [7, 10, "N=7: pattern 이 클수록 같은 주파수 cell 사이가 멀다 → 간섭 ↓, 대신 cell 당 채널 ↓"],
      [10, D, "IS-95(CDMA): 모든 cell 이 같은 주파수(N=1) — 사용자마다 다른 code 로 구분"]
    ]);

    var R = 27, SQ = Math.sqrt(3), X0 = 112, Y0 = 82;
    var PAL = ["#fff3b0", "#cdeac0", "#f8c8d8", "#cfe0f5", "#fde0c2", "#e3d4f2", "#c9efe9"];
    var SAME = "#fff3b0";
    function md(a, n) { return ((a % n) + n) % n; }
    var cells = [];
    for (var c = 0; c < 9; c++) {
      for (var k = 0; k < 4; k++) {
        var q = c, r = k - (c - (c & 1)) / 2;
        cells.push({ x: X0 + 1.5 * R * c, y: Y0 + SQ * R * (k + (c & 1) / 2), n4: md(q, 2) + 2 * md(r, 2), n7: md(q + 3 * r, 7) });
      }
    }
    var kt = '0;' + r4(1.5 / D) + ';' + r4(4 / D) + ';' + r4(7 / D) + ';' + r4(10 / D);
    var d4 = '', d7 = '', h4 = '', h7 = '';
    cells.forEach(function (e) {
      s += '<polygon points="' + hexPts(e.x, e.y, R, false) + '" fill="#fafafa" stroke="#9a8a4a" stroke-width="1.3">' +
        '<animate attributeName="fill" calcMode="discrete" values="#fafafa;' + SAME + ';' + PAL[e.n4] + ';' + PAL[e.n7] + ';' + SAME + '" keyTimes="' + kt + '" dur="' + D + 's" fill="freeze"/></polygon>';
      d4 += txt(e.x, e.y + 5, e.n4 + 1, 13, "#444", ' font-weight="700"');
      d7 += txt(e.x, e.y + 5, e.n7 + 1, 13, "#444", ' font-weight="700"');
      if (e.n4 === 0) h4 += '<polygon points="' + hexPts(e.x, e.y, R - 2, false) + '" fill="none" stroke="' + C.dev + '" stroke-width="3"/>';
      if (e.n7 === 0) h7 += '<polygon points="' + hexPts(e.x, e.y, R - 2, false) + '" fill="none" stroke="' + C.dev + '" stroke-width="3"/>';
    });
    s += vis(4, 7, d4) + vis(7, 10, d7);
    s += vis(5.4, 7, h4) + vis(8.4, 10, h7);

    // ---- 같은 주파수 → interference (1.5–4) ----
    var A = cells[3 * 4 + 1], B = cells[4 * 4 + 1];   // (c=3,k=1) 과 (c=4,k=1) 은 인접
    var mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2;
    function xmark(x, y, sz) {
      return line(x - sz, y - sz, x + sz, y + sz, C.red, 3.2, ' stroke-linecap="round"') + line(x - sz, y + sz, x + sz, y - sz, C.red, 3.2, ' stroke-linecap="round"');
    }
    s += vis(2.3, 4, xmark(mx, my, 7));
    var P = cells[1 * 4 + 2], Q = cells[2 * 4 + 2], U = cells[6 * 4 + 0], V = cells[7 * 4 + 0];
    s += vis(2.8, 4, xmark((P.x + Q.x) / 2, (P.y + Q.y) / 2, 6) + xmark((U.x + V.x) / 2, (U.y + V.y) / 2, 6));

    // ---- IS-95: code 로 구분 (10–14) ----
    var users = [[0, 1], [2, 2], [3, 0], [5, 3], [6, 1], [8, 2]];
    var ucol = [C.a, C.b, C.c, C.red, C.dev, "#0f8a8a"];
    var u = '';
    users.forEach(function (p, i) {
      var e = cells[p[0] * 4 + p[1]];
      u += phone(e.x - 8, e.y + 2, ucol[i], "#fff") + txt(e.x + 10, e.y - 6, "c" + (i + 1), 11, ucol[i], ' font-weight="700"');
    });
    s += vis(10.4, D, u);

    // ---- 오른쪽 설명 패널 ----
    var PX = 610;
    s += '<rect x="495" y="56" width="250" height="218" rx="10" fill="#fff" stroke="#ddd" stroke-width="1.5"/>';
    s += vis(0, 1.5, txt(PX, 150, "cell 마다", 15, C.ink, ' font-weight="700"') + txt(PX, 172, "frequency set 하나", 15, C.ink, ' font-weight="700"'));
    // 확대 그림: 같은 f1 을 쓰는 이웃 cell 둘, 경계의 사용자
    var Z1x = 578, Z1y = 160, Z2x = 640, Z2y = 194.64, zmx = (Z1x + Z2x) / 2, zmy = (Z1y + Z2y) / 2;
    s += vis(1.5, 4,
      txt(PX, 86, "모든 cell 이 같은 f 라면?", 15, C.red, ' font-weight="700"') +
      hex(Z1x, Z1y, 40, SAME, "#9a8a4a", false) + hex(Z2x, Z2y, 40, SAME, "#9a8a4a", false) +
      txt(Z1x - 14, Z1y - 18, "f1", 13, "#444", ' font-weight="700"') + txt(Z2x + 16, Z2y + 30, "f1", 13, "#444", ' font-weight="700"') +
      tower(Z1x - 6, Z1y + 8, C.dev) + tower(Z2x + 6, Z2y + 8, C.dev) +
      line(Z1x, Z1y - 6, zmx - 9, zmy - 3, C.red, 2, ' stroke-dasharray="4 3" marker-end="url(#fr_arR)"') +
      line(Z2x, Z2y - 6, zmx + 9, zmy + 1, C.red, 2, ' stroke-dasharray="4 3" marker-end="url(#fr_arR)"') +
      phone(zmx, zmy + 4, C.a, C.aL) +
      txt(PX, 262, "경계의 사용자 → interference ✗", 13, C.red, ' font-weight="700"'));
    s += vis(4, 7,
      txt(PX, 110, "N = 4", 28, C.dev, ' font-weight="700"') +
      txt(PX, 148, "번호 = 주파수 묶음", 13, C.ink) +
      txt(PX, 172, "같은 번호는 이웃하지 않음", 13, C.ink) +
      txt(PX, 212, "cell 당 채널 = 전체 / 4", 13, C.a, ' font-weight="700"') +
      txt(PX, 240, "굵은 테두리 = 1번 묶음", 11, C.muted));
    s += vis(7, 10,
      txt(PX, 110, "N = 7", 28, C.dev, ' font-weight="700"') +
      txt(PX, 148, "같은 번호 cell 사이가 더 멂", 13, C.ink) +
      txt(PX, 172, "→ 간섭 ↓", 13, C.b, ' font-weight="700"') +
      txt(PX, 212, "cell 당 채널 = 전체 / 7 ↓", 13, C.a, ' font-weight="700"') +
      txt(PX, 240, "(AMPS 의 reuse factor = 7)", 11, C.muted));
    s += vis(10, D,
      txt(PX, 106, "N = 1", 28, C.dev, ' font-weight="700"') +
      txt(PX, 132, "(IS-95, CDMA)", 13, C.muted) +
      txt(PX, 168, "모든 cell 이 같은 주파수", 13, C.ink) +
      txt(PX, 192, "사용자는 code(c1, c2 …)로 구분", 13, C.ink) +
      txt(PX, 232, "→ 전체 대역을 모든 cell 이 사용", 13, C.b, ' font-weight="700"'));

    // ---- 요점 ----
    s += txt(380, 318, "N(reuse factor) = 한 frequency reuse pattern 의 cell 수 — 인접 cell 은 다른 주파수, 떨어진 cell 은 재사용", 12, C.muted);
    s += '</svg>';
    return s;
  }
};

// ===== anims/generations_timeline.js =====
// ============================================================
// generations_timeline — 셀룰러 1G → 2G → 3G → 4G 가 왼쪽부터 쌓이고, 아래에 아날로그→디지털→데이터→all-IP
// CONTRACT §7. 슬라이드 L10 1G AMPS · 2G D-AMPS/GSM/IS-95 · 3G IMT-2000 · 4G.
// 시간축(초): 0 빈 카드 → 1.2 1G → 3.4 2G → 5.6 3G → 7.8 4G → 10 아래 화살표 완성 → 12 끝
// ============================================================
window.ANIMS = window.ANIMS || {};
ANIMS["generations_timeline"] = {
  title: "셀룰러 세대 1G → 4G — 아날로그에서 all-IP 까지",
  desc: "[[1G]]([[AMPS]], analog, [[FDMA]]) → [[2G]](digital: [[D-AMPS]]·[[GSM]] = [[TDMA]], [[IS-95]] = [[CDMA]]) → [[3G]]([[IMT-2000]]: 144 kbps / 384 kbps / 2 Mbps) → [[4G]](100 Mbps / 1 Gbps, [[all-IP]])",
  duration: 12,
  build: function () {
    var D = 12;
    var C = { a: "#1d65b3", aL: "#dbe8f7", b: "#2e9e4f", bL: "#dff3e4", c: "#e09a40", cL: "#fdeec2", d: "#8a5cc4", dL: "#efe6fa", dev: "#3b2f4a", devL: "#efe9f6", hot: "#d6465f", muted: "#777" };
    function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    function txt(x, y, s, size, fill, extra) {
      return '<text x="' + x + '" y="' + y + '" font-size="' + (size || 13) + '" fill="' + (fill || "#222") + '"' + (/text-anchor/.test(extra || "") ? "" : ' text-anchor="middle"') + (extra || "") + '>' + esc(s) + '</text>';
    }
    function show(a, b) {
      var k = [0], v = [a <= 0 ? 1 : 0];
      if (a > 0) { k.push(a / D, Math.min(1, (a + 0.15) / D)); v.push(0, 1); }
      if (b < D) { k.push(b / D, Math.min(1, (b + 0.15) / D)); v.push(1, 0); }
      if (k[k.length - 1] < 1) { k.push(1); v.push(v[v.length - 1]); }
      return '<animate attributeName="opacity" values="' + v.join(";") + '" keyTimes="' + k.map(function (x) { return +x.toFixed(4); }).join(";") + '" dur="' + D + 's" fill="freeze"/>';
    }
    function during(a, b, inner) { return '<g opacity="' + (a <= 0 ? 1 : 0) + '">' + inner + show(a, b) + '</g>'; }

    var s = '<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="셀룰러 세대 타임라인 애니메이션">';
    s += '<defs><marker id="gt_arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="' + C.dev + '"/></marker></defs>';

    // ---- 단계 자막 ----
    var caps = [
      [0, 1.2, "셀룰러 이동통신은 세대(generation)마다 무엇이 바뀌었나"],
      [1.2, 3.4, "1G: AMPS — analog 음성, FDMA (30 kHz 채널)"],
      [3.4, 5.6, "2G: digital 음성 — D-AMPS · GSM 은 TDMA, IS-95 는 CDMA"],
      [5.6, 7.8, "3G: IMT-2000 — 데이터: 144 kbps 차량 / 384 kbps 보행 / 2 Mbps 정지"],
      [7.8, 10, "4G: 100 Mbps 이동 / 1 Gbps 정지, all-IP packet-switched network"],
      [10, D, "아날로그 → 디지털 → 데이터 → all-IP"]
    ];
    caps.forEach(function (c) { s += during(c[0], c[1], txt(380, 26, c[2], 14, "#222", ' font-weight="700"')); });

    // ---- 카드 4장 ----
    var cards = [
      { g: "1G", sub: "AMPS", col: C.a, colL: C.aL, t: 1.2, lines: [["analog", 1], ["FDMA", 1], ["30 kHz 채널, FM", 0], ["voice 만", 0], ["북미 대표 시스템", 0]] },
      { g: "2G", sub: "D-AMPS · GSM · IS-95", col: C.b, colL: C.bL, t: 3.4, lines: [["digital", 1], ["D-AMPS · GSM", 0], ["→ TDMA", 1], ["IS-95", 0], ["→ CDMA (DSSS)", 1]] },
      { g: "3G", sub: "IMT-2000 (ITU)", col: C.c, colL: C.cL, t: 5.6, lines: [["144 kbps 차량", 1], ["384 kbps 보행", 1], ["2 Mbps 정지", 1], ["packet + circuit", 0], ["W-CDMA · CDMA 2000", 0]] },
      { g: "4G", sub: "all-IP", col: C.d, colL: C.dL, t: 7.8, lines: [["100 Mbps 이동", 1], ["1 Gbps 정지", 1], ["all-IP", 1], ["packet-switched", 0], ["smooth handoff", 0]] }
    ];
    var CW = 170, GAP = 14, X0 = 18, CY = 44, CH = 220;
    cards.forEach(function (c, i) {
      var x = X0 + i * (CW + GAP), cx = x + CW / 2;
      s += '<rect x="' + x + '" y="' + CY + '" width="' + CW + '" height="' + CH + '" rx="10" fill="#fafbfd" stroke="#dfe3ea" stroke-dasharray="5 4"/>';
      s += txt(cx, CY + CH / 2, c.g, 28, "#d9dde5", ' font-weight="700"');
      var g = '<rect x="' + x + '" y="' + CY + '" width="' + CW + '" height="' + CH + '" rx="10" fill="#fff" stroke="' + c.col + '" stroke-width="2"/>';
      g += '<path d="M' + (x + 10) + ',' + CY + ' L' + (x + CW - 10) + ',' + CY + ' Q' + (x + CW) + ',' + CY + ' ' + (x + CW) + ',' + (CY + 10) + ' L' + (x + CW) + ',' + (CY + 52) + ' L' + x + ',' + (CY + 52) + ' L' + x + ',' + (CY + 10) + ' Q' + x + ',' + CY + ' ' + (x + 10) + ',' + CY + ' Z" fill="' + c.colL + '" stroke="' + c.col + '" stroke-width="2"/>';
      g += txt(cx, CY + 26, c.g, 20, c.col, ' font-weight="700"');
      g += txt(cx, CY + 44, c.sub, 12, c.col, ' font-weight="700"');
      c.lines.forEach(function (L, k) {
        g += txt(cx, CY + 82 + k * 30, L[0], L[1] ? 13 : 12, L[1] ? "#222" : "#555", L[1] ? ' font-weight="700"' : "");
      });
      // 현재 세대 강조 테두리
      s += during(c.t, D, g);
      s += during(c.t, c.t + 2.2, '<rect x="' + (x - 3) + '" y="' + (CY - 3) + '" width="' + (CW + 6) + '" height="' + (CH + 6) + '" rx="12" fill="none" stroke="' + C.hot + '" stroke-width="2.5"/>');
      // 다음 카드로 화살표
      if (i < 3) s += during(c.t + 1.6, D, '<path d="M' + (x + CW + 2) + ',' + (CY + 26) + ' L' + (x + CW + GAP - 2) + ',' + (CY + 26) + '" stroke="' + C.dev + '" stroke-width="2" marker-end="url(#gt_arr)"/>');
    });

    // ---- 아래 진화 화살표 ----
    var stages = ["아날로그", "디지털", "데이터", "all-IP"];
    var AY = 282;
    s += during(1.4, D, '<path d="M' + X0 + ',' + (AY + 4) + ' L' + (X0 + 4 * CW + 3 * GAP - 18) + ',' + (AY + 4) + ' L' + (X0 + 4 * CW + 3 * GAP - 18) + ',' + (AY - 6) + ' L' + (X0 + 4 * CW + 3 * GAP) + ',' + (AY + 14) + ' L' + (X0 + 4 * CW + 3 * GAP - 18) + ',' + (AY + 34) + ' L' + (X0 + 4 * CW + 3 * GAP - 18) + ',' + (AY + 24) + ' L' + X0 + ',' + (AY + 24) + ' Z" fill="#f2eef7" stroke="' + C.dev + '" stroke-width="1.2"/>');
    var segCol = [C.a, C.b, C.c, C.d];
    stages.forEach(function (st, i) {
      var cx = X0 + i * (CW + GAP) + CW / 2;
      s += during(cards[i].t + 0.6, D, txt(cx, AY + 19, st, 13, segCol[i], ' font-weight="700"') +
        (i < 3 ? txt(X0 + (i + 1) * (CW + GAP) - GAP / 2, AY + 19, "→", 13, C.dev, ' font-weight="700"') : ""));
    });
    s += during(10, D, txt(380, 334, "다중접속: FDMA → TDMA / CDMA → W-CDMA · CDMA 2000 · 전송: circuit → packet + circuit → all-IP packet", 12, C.dev, ' font-weight="700"'));

    // ---- 요점 ----
    s += txt(380, 352, "세대가 올라갈수록 아날로그 음성 → 디지털 음성 → 데이터 → 모든 것을 IP 패킷으로", 11, C.muted);
    s += '</svg>';
    return s;
  }
};

// ===== anims/gsm_multiframe_anim.js =====
// ============================================================
// gsm_multiframe_anim — GSM: 65 → 114 → 156.25 bits slot → 8 slot frame → 26 frame multiframe(120 ms) → 270.8 kbps
// CONTRACT §7. 슬라이드 L10 "GSM (2G): Transmission" · "Multiframe components".
// 시간축(초): 0 65 bits → 1.4 114 bits → 2.8 156.25 bits(slot) → 4.2 frame = 8 slots
//   → 6.2 multiframe = 26 frames → 8.2 120 ms → 9.6 식 조립 → 11.6 결과 유지 → 13 끝
// ============================================================
window.ANIMS = window.ANIMS || {};
ANIMS["gsm_multiframe_anim"] = {
  title: "GSM multiframe — 156.25 bits 슬롯에서 270.8 kbps 까지",
  desc: "[[GSM 프레임 구조]]: user data 65 bits → error control 붙여 114 bits → TDMA control 붙여 156.25 bits = slot 하나 → 8 slots = frame → 26 frames(24 traffic + 2 control) = [[GSM multiframe|multiframe]] 120 ms → [[GSM channel bit rate|channel bit rate]] 270.8 kbps",
  duration: 13,
  build: function () {
    var D = 13;
    var C = { a: "#1d65b3", aL: "#dbe8f7", b: "#2e9e4f", c: "#e09a40", dev: "#3b2f4a", devL: "#efe9f6", hot: "#d6465f", muted: "#777", slot: "#f9c6dc", slotS: "#b0587f", ctl: "#8a8a8a" };
    function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
    function txt(x, y, s, size, fill, extra) {
      return '<text x="' + x + '" y="' + y + '" font-size="' + (size || 13) + '" fill="' + (fill || "#222") + '"' + (/text-anchor/.test(extra || "") ? "" : ' text-anchor="middle"') + (extra || "") + '>' + esc(s) + '</text>';
    }
    function show(a, b) {
      var k = [0], v = [a <= 0 ? 1 : 0];
      if (a > 0) { k.push(a / D, Math.min(1, (a + 0.15) / D)); v.push(0, 1); }
      if (b < D) { k.push(b / D, Math.min(1, (b + 0.15) / D)); v.push(1, 0); }
      if (k[k.length - 1] < 1) { k.push(1); v.push(v[v.length - 1]); }
      return '<animate attributeName="opacity" values="' + v.join(";") + '" keyTimes="' + k.map(function (x) { return +x.toFixed(4); }).join(";") + '" dur="' + D + 's" fill="freeze"/>';
    }
    function during(a, b, inner) { return '<g opacity="' + (a <= 0 ? 1 : 0) + '">' + inner + show(a, b) + '</g>'; }
    function rect(x, y, w, h, fill, stroke, extra) {
      return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.5"' + (extra || "") + '/>';
    }
    function hl(x, y, w, h, a, b) {   // 빨간 강조 테두리
      return during(a, b, '<rect x="' + (x - 3) + '" y="' + (y - 3) + '" width="' + (w + 6) + '" height="' + (h + 6) + '" rx="3" fill="none" stroke="' + C.hot + '" stroke-width="2.5"/>');
    }

    var s = '<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GSM multiframe 애니메이션">';
    s += '<defs><marker id="gm_arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>';

    // ---- 단계 자막 ----
    var caps = [
      [0, 1.4, "디지털화한 음성: user data 65 bits"],
      [1.4, 2.8, "error control bits 를 붙여 114 bits"],
      [2.8, 4.2, "TDMA control bits 까지 붙이면 156.25 bits — 이것이 slot 하나"],
      [4.2, 6.2, "slot 8 개 = frame 하나 (8 사용자가 TDMA 로 나눠 씀)"],
      [6.2, 8.2, "frame 26 개 = multiframe 하나 (24 traffic frames + 2 control frames)"],
      [8.2, 9.6, "multiframe 하나의 길이 = 120 ms"],
      [9.6, D, "channel bit rate = (1/120 ms) × 26 × 8 × 156.25 = 270.8 kbps"]
    ];
    caps.forEach(function (c) { s += during(c[0], c[1], txt(380, 24, c[2], 14, "#222", ' font-weight="700"')); });

    // ---- 비트 쌓기 (위) ----
    var CX = 250;
    var lv = [
      { w: 70, y: 42, lab: "65 bits", note: "User data", t: 0 },
      { w: 112, y: 76, lab: "114 bits", note: "User data + error control bits", t: 1.4 },
      { w: 154, y: 110, lab: "156.25 bits", note: "+ error control bits + TDMA control bits", t: 2.8 }
    ];
    lv.forEach(function (L, i) {
      var x = CX - L.w / 2;
      var g = rect(x, L.y, L.w, 26, i === 2 ? C.slot : "#fff", i === 2 ? C.slotS : "#333") + txt(CX, L.y + 18, L.lab, 13, "#222", ' font-weight="700"');
      g += txt(CX + 88, L.y + 18, L.note, 12, i === 0 ? C.a : (i === 1 ? C.b : C.c), ' font-weight="700" text-anchor="start"');
      if (i > 0) {   // 윗 상자 양끝에서 내려오는 연결선
        var pw = lv[i - 1].w;
        g += '<path d="M' + (CX - pw / 2) + ',' + (lv[i - 1].y + 26) + ' L' + (CX - pw / 2) + ',' + (L.y - 2) + ' M' + (CX + pw / 2) + ',' + (lv[i - 1].y + 26) + ' L' + (CX + pw / 2) + ',' + (L.y - 2) + '" stroke="#333" stroke-width="1.2"/>';
      }
      s += during(L.t, D, g);
    });
    s += hl(CX - 77, 110, 154, 26, 2.8, 4.2);

    // ---- frame = 8 slots ----
    var FX = 120, FY = 166, SW = 40, SH = 26;
    var fr = "";
    for (var k = 0; k < 8; k++) fr += during(4.3 + k * 0.18, D, rect(FX + k * SW, FY, SW, SH, C.slot, C.slotS) + txt(FX + k * SW + SW / 2, FY + 18, String(k + 1), 11, C.slotS, ' font-weight="700"'));
    s += fr;
    s += during(4.2, D, '<path d="M' + (CX - 77) + ',136 L' + FX + ',' + (FY - 2) + ' M' + (CX + 77) + ',136 L' + (FX + SW) + ',' + (FY - 2) + '" stroke="#333" stroke-dasharray="5 4" stroke-width="1.2"/>');
    s += during(5.8, D, txt(FX + 8 * SW + 12, FY + 18, "Frame = 8 slots", 12, "#222", ' font-weight="700" text-anchor="start"'));
    s += hl(FX, FY, 8 * SW, SH, 10.8, 11.6);

    // ---- multiframe = 26 frames ----
    var MX = 42, MY = 238, MW = 25, MH = 24, GAP = 1.5;
    var mf = "";
    for (var j = 0; j < 26; j++) {
      var isCtl = (j === 12 || j === 25);
      var x = +(MX + j * (MW + GAP)).toFixed(1);
      mf += during(6.3 + j * 0.06, D, rect(x, MY, MW, MH, isCtl ? C.ctl : C.slot, isCtl ? "#555" : C.slotS) + txt(x + MW / 2, MY + 16, String(j + 1), 10, isCtl ? "#fff" : C.slotS, ' font-weight="700"'));
    }
    s += mf;
    var MEND = +(MX + 26 * (MW + GAP) - GAP).toFixed(1);
    s += during(6.2, D, '<path d="M' + FX + ',' + (FY + SH) + ' L' + MX + ',' + (MY - 2) + ' M' + (FX + 8 * SW) + ',' + (FY + SH) + ' L' + (MX + MW) + ',' + (MY - 2) + '" stroke="#333" stroke-dasharray="5 4" stroke-width="1.2"/>');
    s += during(7.6, D, txt(MEND, MY - 8, "1 multiframe = 26 frames: 24 traffic + 2 control (회색)", 12, "#222", ' font-weight="700" text-anchor="end"'));
    s += hl(MX, MY, MEND - MX, MH, 10.3, 11.1);
    // 120 ms 화살표
    s += during(8.2, D, '<line x1="' + MX + '" y1="' + (MY + MH + 12) + '" x2="' + MEND + '" y2="' + (MY + MH + 12) + '" stroke="#333" stroke-width="1.5" marker-start="url(#gm_arr)" marker-end="url(#gm_arr)"/>' +
      '<rect x="' + ((MX + MEND) / 2 - 34) + '" y="' + (MY + MH + 3) + '" width="68" height="18" fill="#fff"/>' +
      txt((MX + MEND) / 2, MY + MH + 17, "120 ms", 13, C.hot, ' font-weight="700"'));
    // 156.25 강조 (식의 마지막 항)
    s += hl(CX - 77, 110, 154, 26, 11.3, 12.1);

    // ---- 식 조립 (아래) ----
    s += during(9.6, D, '<rect x="110" y="304" width="540" height="34" rx="8" fill="#fff6b0" stroke="#b9a520" stroke-width="1.5"/>');
    var parts = [
      ["(1/120 ms)", 229, 9.8], ["× 26", 307, 10.3], ["× 8", 347, 10.8], ["× 156.25", 379, 11.3], ["= 270.8 kbps", 445, 11.8]
    ];
    parts.forEach(function (p, i) {
      s += during(p[2], D, txt(p[1], 327, p[0], 15, i === 4 ? C.hot : "#222", ' font-weight="700" text-anchor="start"'));
    });

    // ---- 요점 ----
    s += txt(380, 364, "slot(156.25 bits) × 8 = frame, frame × 26 = multiframe(120 ms) → GSM channel 하나 = 270.8 kbps", 12, C.muted);
    s += '</svg>';
    return s;
  }
};

// ===== anims/handoff_hard_soft.js =====
// ============================================================
// handoff_hard_soft — L10 p.14–16 (handoff, hard vs soft)
// 왼쪽 (a) hard / 오른쪽 (b) soft 를 같은 시간축으로 나란히. MS 는 1.5→11.5s 동안 BS1 cell → BS2 cell.
//   hard: BS1 1.5–6.2, 끊김 6.2–7.2, BS2 7.2–   (break before make)
//   soft: BS1 1.5–7.8, BS2 5.4–  → 5.4–7.8 겹침 (make before break)
// ============================================================
window.ANIMS = window.ANIMS || {};
ANIMS["handoff_hard_soft"] = {
  title: "Handoff — hard(break before make) vs soft(make before break), 14초",
  desc: "[[handoff]] = 이동 중인 통화를 끊지 않고 한 BS 에서 다른 BS 로 넘기는 과정. [[MSC]] 가 every few seconds 신호 세기를 감시하다가 약해지면 더 나은 cell 로 채널을 바꾼다. [[hard handoff]] 는 BS 하나와만, [[soft handoff]] 는 두 BS 와 동시에 통신",
  duration: 14,
  build: function () {
    var D = 14;
    var C = {
      a: "#1d65b3", aL: "#dbe8f7", b: "#2e9e4f", bL: "#dff3e4", c: "#e09a40", cL: "#fdeec2",
      dev: "#3b2f4a", devL: "#efe9f6", red: "#d6465f", muted: "#777", ink: "#222",
      cell: "#c9a227", cellL: "#fdf3c4"
    };
    function r2(v) { return Math.round(v * 100) / 100; }
    function r4(v) { return Math.round(v * 10000) / 10000; }
    function txt(x, y, s, size, fill, extra) {
      return '<text x="' + r2(x) + '" y="' + r2(y) + '" font-size="' + (size || 13) + '" fill="' + (fill || C.ink) + '"' + (/text-anchor/.test(extra || "") ? "" : ' text-anchor="middle"') + (extra || "") + '>' + s + '</text>';
    }
    // from~to 초에만 보이기 (0.12s 페이드)
    function show(from, to) {
      var f = 0.12 / D, a = r4(from / D), b = r4(Math.min(from / D + f, (from + to) / 2 / D));
      if (to >= D) return '<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;' + a + ';' + b + ';1" dur="' + D + 's" fill="freeze"/>';
      var c = r4(Math.max(b, to / D - f)), d = r4(to / D);
      return '<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;' + a + ';' + b + ';' + c + ';' + d + ';1" dur="' + D + 's" fill="freeze"/>';
    }
    function vis(from, to, inner) { return '<g opacity="0">' + inner + show(from, to) + '</g>'; }
    function caps(list) {
      return list.map(function (c) { return vis(c[0], c[1], txt(380, 26, c[2], 14, C.ink, ' font-weight="700"')); }).join("");
    }
    function hexPts(cx, cy, r, pointy) {
      var p = [];
      for (var i = 0; i < 6; i++) {
        var a = Math.PI / 180 * (60 * i + (pointy ? 30 : 0));
        p.push(r2(cx + r * Math.cos(a)) + "," + r2(cy + r * Math.sin(a)));
      }
      return p.join(" ");
    }
    function hex(cx, cy, r, fill, stroke, pointy, extra) {
      return '<polygon points="' + hexPts(cx, cy, r, pointy) + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.5"' + (extra || "") + '/>';
    }
    function rbox(x, y, w, h, fill, stroke, lines, size, col) {
      var s = '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="6" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.8"/>';
      lines = [].concat(lines || []);
      var n = lines.length, fs = size || 13;
      lines.forEach(function (l, i) { s += txt(x + w / 2, y + h / 2 + (i - (n - 1) / 2) * (fs + 3) + fs * 0.36, l, fs, col || C.ink, ' font-weight="700"'); });
      return s;
    }
    // 기지국 탑: (x, y) = 밑변 가운데, 높이 26
    function tower(x, y, col) {
      col = col || C.dev;
      return '<path d="M' + r2(x - 7) + ',' + r2(y) + ' L' + r2(x) + ',' + r2(y - 26) + ' L' + r2(x + 7) + ',' + r2(y) + ' Z" fill="#fff" stroke="' + col + '" stroke-width="1.8" stroke-linejoin="round"/>' +
        '<line x1="' + r2(x - 4) + '" y1="' + r2(y - 10) + '" x2="' + r2(x + 4) + '" y2="' + r2(y - 10) + '" stroke="' + col + '" stroke-width="1.4"/>';
    }
    // 휴대폰(MS): 중심 (x, y), 12×22
    function phone(x, y, col, fill) {
      col = col || C.ink;
      return '<rect x="' + r2(x - 6) + '" y="' + r2(y - 11) + '" width="12" height="22" rx="2.5" fill="' + (fill || "#fff") + '" stroke="' + col + '" stroke-width="1.6"/>' +
        '<line x1="' + r2(x - 2.5) + '" y1="' + r2(y - 7) + '" x2="' + r2(x + 2.5) + '" y2="' + r2(y - 7) + '" stroke="' + col + '" stroke-width="1.4"/>';
    }
    function line(x1, y1, x2, y2, col, w, extra) {
      return '<line x1="' + r2(x1) + '" y1="' + r2(y1) + '" x2="' + r2(x2) + '" y2="' + r2(y2) + '" stroke="' + col + '" stroke-width="' + (w || 2) + '"' + (extra || "") + '/>';
    }
    function pth(d, col, w, extra) {
      return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + (w || 2) + '"' + (extra || "") + '/>';
    }
    // 경로를 따라 움직이는 점 (begin~begin+dur 동안만 보임)
    function dot(d, begin, dur, col, rad) {
      return '<circle r="' + (rad || 5) + '" fill="' + col + '" opacity="0"><animateMotion begin="' + begin + 's" dur="' + dur + 's" fill="freeze" path="' + d + '"/>' + show(begin, begin + dur) + '</circle>';
    }
    function marker(id, col) {
      return '<marker id="' + id + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="' + col + '"/></marker>';
    }

    var s = '<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="hard handoff 와 soft handoff 비교 애니메이션">';
    s += '<defs>' + marker("ho_ar", "#555") + '</defs>';

    s += caps([
      [0, 1.5, "통화 중인 MS 가 BS1 의 cell 에서 BS2 의 cell 쪽으로 이동한다"],
      [1.5, 5.4, "MSC 가 every few seconds 신호 세기를 감시 — 멀어질수록 BS1 신호가 약해진다"],
      [5.4, 6.2, "신호가 약해지면 MSC 가 더 나은 cell(BS2)을 찾아 통화 채널을 바꾼다 = handoff"],
      [6.2, 8.4, "(a) hard: BS1 을 먼저 끊고 BS2 에 연결 → 잠깐 끊김 (break before make)"],
      [8.4, 11, "(b) soft: BS2 를 먼저 잡은 뒤 BS1 을 놓는다 → 겹치는 구간 (make before break)"],
      [11, D, "hard = MS 가 BS 하나와만 통신(early systems) · soft = 두 BS 와 동시에 통신"]
    ]);

    var R = 46, W3 = R * Math.sqrt(3);
    var Y1 = 1.5, Y2 = 11.5, X0 = 132, X1 = 248;   // MS x: 132 → 248 (왼쪽 패널 기준)
    var BS1C = "#b8901a", BS2C = C.b;
    function TX(t) { return 60 + (t - Y1) * 26; }               // 시간 → 타임라인 x

    function panel(ox, hard) {
      var p = '';
      var c1 = 150 + ox, c2 = 150 + W3 + ox, cy = 140;
      var t1x = c1 - 8, t2x = c2 - 8, tb = 148;
      // MSC
      p += rbox(145 + ox, 40, 90, 28, C.aL, C.a, "MSC", 13, C.a);
      p += line(190 + ox, 68, t1x, tb - 26, "#555", 1.4) + line(190 + ox, 68, t2x, tb - 26, "#555", 1.4);
      // cells
      p += hex(c1, cy, R, C.cellL, C.cell, true) + hex(c2, cy, R, C.bL, C.b, true);
      p += tower(t1x, tb, C.dev) + tower(t2x, tb, C.dev);
      p += txt(c1 + 4, cy - 18, "BS1", 12, "#8a6a10", ' font-weight="700" text-anchor="start"') + txt(c2 + 4, cy - 18, "BS2", 12, "#1d6b2a", ' font-weight="700" text-anchor="start"');
      // 신호 세기 감시 펄스 (every few seconds)
      [2, 4, 6, 8, 10].forEach(function (b) {
        p += dot("M" + (190 + ox) + ",68 L" + t1x + "," + (tb - 26), b, 0.6, C.a, 3);
        p += dot("M" + (190 + ox) + ",68 L" + t2x + "," + (tb - 26), b, 0.6, C.a, 3);
      });
      // 무선 링크 (끝점이 MS 를 따라간다)
      function link(tx, col, from, to, fade) {
        var l = '<line x1="' + tx + '" y1="' + (tb - 20) + '" x2="' + (X0 + ox) + '" y2="152" stroke="' + col + '" stroke-width="3" stroke-linecap="round">' +
          '<animate attributeName="x2" values="' + (X0 + ox) + ';' + (X1 + ox) + '" begin="' + Y1 + 's" dur="' + (Y2 - Y1) + 's" fill="freeze"/>' +
          (fade ? '<animate attributeName="stroke-opacity" values="1;0.35" begin="' + Y1 + 's" dur="' + 4.5 + 's" fill="freeze"/>' : '') + '</line>';
        return vis(from, to, l);
      }
      if (hard) { p += link(t1x, BS1C, 0, 6.2, true) + link(t2x, BS2C, 7.2, D, false); }
      else { p += link(t1x, BS1C, 0, 7.8, true) + link(t2x, BS2C, 5.4, D, false); }
      // MS
      var ms = phone(X0 + ox, 160, C.a, C.aL);
      if (hard) ms += vis(6.2, 7.2, '<circle cx="' + (X0 + ox) + '" cy="160" r="15" fill="none" stroke="' + C.red + '" stroke-width="2.5"/>' + txt(X0 + ox, 192, "끊김!", 12, C.red, ' font-weight="700"'));
      else ms += vis(5.4, 7.8, '<circle cx="' + (X0 + ox) + '" cy="160" r="15" fill="none" stroke="' + C.b + '" stroke-width="2.5"/>');
      p += '<g>' + ms + '<animateTransform attributeName="transform" type="translate" values="0,0;' + (X1 - X0) + ',0" begin="' + Y1 + 's" dur="' + (Y2 - Y1) + 's" fill="freeze"/></g>';

      // ---- 타임라인 ----
      p += txt(52 + ox, 219, "BS1", 12, "#8a6a10", ' font-weight="700" text-anchor="end"');
      p += txt(52 + ox, 241, "BS2", 12, "#1d6b2a", ' font-weight="700" text-anchor="end"');
      p += line(58 + ox, 256, 338 + ox, 256, "#555", 1.5, ' marker-end="url(#ho_ar)"') + txt(340 + ox, 270, "Time", 11, "#555", ' text-anchor="end"');
      function bar(y, t0, t1, fill, stroke) {
        return '<rect x="' + r2(TX(t0) + ox) + '" y="' + y + '" width="0" height="11" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.3">' +
          '<animate attributeName="width" values="0;' + r2(TX(t1) - TX(t0)) + '" begin="' + t0 + 's" dur="' + r2(t1 - t0) + 's" fill="freeze"/></rect>';
      }
      if (hard) {
        p += vis(6.2, D, '<rect x="' + r2(TX(6.2) + ox) + '" y="203" width="' + r2(TX(7.2) - TX(6.2)) + '" height="46" fill="' + C.red + '" fill-opacity="0.22"/>');
        p += bar(209, Y1, 6.2, C.cellL, BS1C) + bar(231, 7.2, Y2, C.bL, BS2C);
        p += vis(6.4, D, txt(TX(6.7) + ox, 274, "Break before make", 12, C.red, ' font-weight="700"'));
      } else {
        p += '<rect x="' + r2(TX(5.4) + ox) + '" y="203" width="0" height="46" fill="' + C.b + '" fill-opacity="0.2">' +
          '<animate attributeName="width" values="0;' + r2(TX(7.8) - TX(5.4)) + '" begin="5.4s" dur="2.4s" fill="freeze"/></rect>';
        p += bar(209, Y1, 7.8, C.cellL, BS1C) + bar(231, 5.4, Y2, C.bL, BS2C);
        p += vis(7.8, D, txt(TX(6.6) + ox, 274, "Make before break", 12, C.b, ' font-weight="700"'));
      }
      p += txt(190 + ox, 296, hard ? "(a) Hard handoff" : "(b) Soft handoff", 14, C.ink, ' font-weight="700"');
      p += txt(190 + ox, 313, hard ? "MS 는 BS 하나와만 통신 · early systems" : "MS 가 두 BS 와 동시에 통신", 11, C.muted);
      return p;
    }
    s += panel(0, true);
    s += line(380, 46, 380, 312, "#ddd", 1.5);
    s += panel(380, false);

    // ---- 요점 ----
    s += txt(380, 334, "handoff = 이동 중 통화를 끊지 않고 BS 를 바꾸는 것 — MSC 가 every few seconds 신호 세기를 보고 결정", 12, C.muted);
    s += '</svg>';
    return s;
  }
};

// ===== anims/roaming_anim.js =====
// ============================================================
// roaming_anim — L10 p.17 (Operation: Roaming)
// 0–2 home(A) 에서 통신 → 2–6 A 의 cell 밖으로 이동(2.5–5.5 coverage 없음) → 6–8.5 B 의 cell 도착,
//   MSC B ↔ MSC A roaming contract → 8.5–12 B 가 A 가입자에게 서비스 계속
// ============================================================
window.ANIMS = window.ANIMS || {};
ANIMS["roaming_anim"] = {
  title: "Roaming — 이웃 provider 의 coverage 로 이어 쓰기, 12초",
  desc: "한 service provider 의 coverage 는 제한적이다. 이웃 provider 끼리 '''roaming contract''' 를 맺어 두면, home(A) 가입자가 B 의 cell 로 가도 B 의 network 로 통신할 수 있다([[roaming]])",
  duration: 12,
  build: function () {
    var D = 12;
    var C = {
      a: "#1d65b3", aL: "#dbe8f7", b: "#2e9e4f", bL: "#dff3e4", c: "#e09a40", cL: "#fdeec2",
      dev: "#3b2f4a", devL: "#efe9f6", red: "#d6465f", muted: "#777", ink: "#222",
      cell: "#c9a227", cellL: "#fdf3c4"
    };
    function r2(v) { return Math.round(v * 100) / 100; }
    function r4(v) { return Math.round(v * 10000) / 10000; }
    function txt(x, y, s, size, fill, extra) {
      return '<text x="' + r2(x) + '" y="' + r2(y) + '" font-size="' + (size || 13) + '" fill="' + (fill || C.ink) + '"' + (/text-anchor/.test(extra || "") ? "" : ' text-anchor="middle"') + (extra || "") + '>' + s + '</text>';
    }
    // from~to 초에만 보이기 (0.12s 페이드)
    function show(from, to) {
      var f = 0.12 / D, a = r4(from / D), b = r4(Math.min(from / D + f, (from + to) / 2 / D));
      if (to >= D) return '<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;' + a + ';' + b + ';1" dur="' + D + 's" fill="freeze"/>';
      var c = r4(Math.max(b, to / D - f)), d = r4(to / D);
      return '<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;' + a + ';' + b + ';' + c + ';' + d + ';1" dur="' + D + 's" fill="freeze"/>';
    }
    function vis(from, to, inner) { return '<g opacity="0">' + inner + show(from, to) + '</g>'; }
    function caps(list) {
      return list.map(function (c) { return vis(c[0], c[1], txt(380, 26, c[2], 14, C.ink, ' font-weight="700"')); }).join("");
    }
    function hexPts(cx, cy, r, pointy) {
      var p = [];
      for (var i = 0; i < 6; i++) {
        var a = Math.PI / 180 * (60 * i + (pointy ? 30 : 0));
        p.push(r2(cx + r * Math.cos(a)) + "," + r2(cy + r * Math.sin(a)));
      }
      return p.join(" ");
    }
    function hex(cx, cy, r, fill, stroke, pointy, extra) {
      return '<polygon points="' + hexPts(cx, cy, r, pointy) + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.5"' + (extra || "") + '/>';
    }
    function rbox(x, y, w, h, fill, stroke, lines, size, col) {
      var s = '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="6" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.8"/>';
      lines = [].concat(lines || []);
      var n = lines.length, fs = size || 13;
      lines.forEach(function (l, i) { s += txt(x + w / 2, y + h / 2 + (i - (n - 1) / 2) * (fs + 3) + fs * 0.36, l, fs, col || C.ink, ' font-weight="700"'); });
      return s;
    }
    // 기지국 탑: (x, y) = 밑변 가운데, 높이 26
    function tower(x, y, col) {
      col = col || C.dev;
      return '<path d="M' + r2(x - 7) + ',' + r2(y) + ' L' + r2(x) + ',' + r2(y - 26) + ' L' + r2(x + 7) + ',' + r2(y) + ' Z" fill="#fff" stroke="' + col + '" stroke-width="1.8" stroke-linejoin="round"/>' +
        '<line x1="' + r2(x - 4) + '" y1="' + r2(y - 10) + '" x2="' + r2(x + 4) + '" y2="' + r2(y - 10) + '" stroke="' + col + '" stroke-width="1.4"/>';
    }
    // 휴대폰(MS): 중심 (x, y), 12×22
    function phone(x, y, col, fill) {
      col = col || C.ink;
      return '<rect x="' + r2(x - 6) + '" y="' + r2(y - 11) + '" width="12" height="22" rx="2.5" fill="' + (fill || "#fff") + '" stroke="' + col + '" stroke-width="1.6"/>' +
        '<line x1="' + r2(x - 2.5) + '" y1="' + r2(y - 7) + '" x2="' + r2(x + 2.5) + '" y2="' + r2(y - 7) + '" stroke="' + col + '" stroke-width="1.4"/>';
    }
    function line(x1, y1, x2, y2, col, w, extra) {
      return '<line x1="' + r2(x1) + '" y1="' + r2(y1) + '" x2="' + r2(x2) + '" y2="' + r2(y2) + '" stroke="' + col + '" stroke-width="' + (w || 2) + '"' + (extra || "") + '/>';
    }
    function pth(d, col, w, extra) {
      return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + (w || 2) + '"' + (extra || "") + '/>';
    }
    // 경로를 따라 움직이는 점 (begin~begin+dur 동안만 보임)
    function dot(d, begin, dur, col, rad) {
      return '<circle r="' + (rad || 5) + '" fill="' + col + '" opacity="0"><animateMotion begin="' + begin + 's" dur="' + dur + 's" fill="freeze" path="' + d + '"/>' + show(begin, begin + dur) + '</circle>';
    }
    function marker(id, col) {
      return '<marker id="' + id + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="' + col + '"/></marker>';
    }

    var s = '<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="roaming 애니메이션">';
    s += '<defs>' + marker("ro_arR", C.red) + marker("ro_ar", "#555") + '</defs>';

    s += caps([
      [0, 2, "사용자(MS)는 home provider A 의 coverage 안에서 통신한다"],
      [2, 4, "한 service provider 의 coverage 는 제한적 — 사용자가 A 의 cell 밖으로 이동"],
      [4, 6, "A 의 coverage 밖: 연결 끊김 — 통신은 coverage 가 있는 곳에서만 가능"],
      [6, 8.5, "이웃 provider B 의 cell 에 도착 → MSC B 와 MSC A 사이의 roaming contract 확인"],
      [8.5, D, "B 의 network 가 A 의 가입자에게 서비스 → extended coverage (roaming)"]
    ]);

    var R = 40, W3 = R * Math.sqrt(3);
    function cluster(cx, fill, stroke) {
      var p = '', cs = [[cx, 150], [cx - W3 / 2, 210], [cx + W3 / 2, 210]];
      cs.forEach(function (c) { p += hex(c[0], c[1], R, fill, stroke, true); });
      cs.forEach(function (c) { p += tower(c[0], c[1] + 12, C.dev); });
      return p;
    }
    var AX = 185, BX = 570;

    // ---- MSC 와 cell 들 ----
    s += rbox(AX - 55, 52, 110, 30, C.aL, C.a, "MSC A", 14, C.a);
    s += rbox(BX - 55, 52, 110, 30, C.aL, C.a, "MSC B", 14, C.a);
    s += line(AX, 82, AX, 110, "#555", 1.6) + line(BX, 82, BX, 110, "#555", 1.6);
    s += cluster(AX, C.cellL, C.cell) + cluster(BX, C.bL, C.b);
    s += txt(AX, 280, "Provider A (home)", 14, "#8a6a10", ' font-weight="700"');
    s += txt(BX, 280, "Provider B (neighbor)", 14, "#1d6b2a", ' font-weight="700"');

    // ---- roaming contract (평소엔 흐린 점선, 6s 부터 빛남) ----
    s += '<line x1="242" y1="67" x2="513" y2="67" stroke="' + C.red + '" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#ro_arR)" marker-end="url(#ro_arR)">' +
      '<animate attributeName="stroke-opacity" values="0.3;0.3;1;1" keyTimes="0;' + r4(6 / D) + ';' + r4(6.2 / D) + ';1" dur="' + D + 's" fill="freeze"/>' +
      '<animate attributeName="stroke-width" values="2;4.5;2" begin="6s" dur="0.8s" repeatCount="3"/></line>';
    s += '<g><rect x="322" y="44" width="112" height="18" rx="4" fill="#fff" stroke="' + C.red + '" stroke-width="1.5"/>' +
      txt(378, 57, "Roaming contract", 12, C.red, ' font-weight="700"') +
      '<animate attributeName="opacity" values="0.4;0.4;1;1" keyTimes="0;' + r4(6 / D) + ';' + r4(6.2 / D) + ';1" dur="' + D + 's" fill="freeze"/></g>';

    // ---- User moves ----
    s += vis(2, D, line(262, 258, 493, 258, "#555", 1.4, ' stroke-dasharray="4 3" marker-end="url(#ro_ar)"') + txt(378, 274, "User moves", 12, "#555"));

    // ---- MS 이동 (2→6s) + 무선 링크 ----
    var M0 = 240, M1 = 518, MY = 232;
    var aTx = AX + W3 / 2, bTx = BX - W3 / 2;           // A 오른쪽 아래 / B 왼쪽 아래 탑
    s += vis(0, 2.5, '<line x1="' + r2(aTx) + '" y1="' + (210 - 8) + '" x2="' + M0 + '" y2="' + (MY - 8) + '" stroke="' + C.cell + '" stroke-width="3" stroke-linecap="round">' +
      '<animate attributeName="x2" values="' + M0 + ';' + M1 + '" begin="2s" dur="4s" fill="freeze"/></line>');
    s += vis(6, D, line(bTx, 210 - 8, M1, MY - 8, C.b, 3, ' stroke-linecap="round"'));
    var ms = phone(M0, MY, C.a, C.aL);
    ms += vis(2.6, 5.5, '<circle cx="' + M0 + '" cy="' + MY + '" r="15" fill="none" stroke="' + C.red + '" stroke-width="2.5"/>');
    s += vis(2.6, 5.5, txt(378, 190, "✗ coverage 밖 — no service", 13, C.red, ' font-weight="700"'));
    s += vis(6.2, D, txt(378, 190, "✓ B 의 cell 에서 통신 계속", 13, C.b, ' font-weight="700"'));
    s += '<g>' + ms + '<animateTransform attributeName="transform" type="translate" values="0,0;' + (M1 - M0) + ',0" begin="2s" dur="4s" fill="freeze"/></g>';
    s += vis(6, D, txt(M1 - 10, MY + 4, "MS", 12, C.a, ' font-weight="700" text-anchor="end"'));

    // ---- contract 확인: MSC B → MSC A → MSC B ----
    s += dot("M513,72 L242,72", 6.3, 0.9, C.red, 5);
    s += dot("M242,72 L513,72", 7.3, 0.9, C.b, 5);
    s += vis(6.3, 8.5, txt(378, 96, "B: 이 사용자는 A 의 가입자? → A: 확인", 12, C.red, ' font-weight="700"'));
    // ---- 서비스: MS → BS(B) → MSC B → MSC A ----
    var svc = "M" + M1 + "," + (MY - 8) + " L" + r2(bTx) + ",202 L" + BX + ",110 L" + BX + ",82 L513,67 L242,67";
    s += vis(8.5, D, pth(svc, C.b, 3, ' stroke-opacity="0.35"'));
    s += dot(svc, 8.6, 1.8, C.b, 5);
    s += vis(8.6, D, txt(378, 96, "A 의 가입자가 B 의 network 로 통신 (extended coverage)", 12, C.b, ' font-weight="700"'));

    // ---- 요점 ----
    s += txt(380, 318, "roaming = 이웃 service provider 끼리 roaming contract 로 coverage 를 넓혀 주는 것", 12, C.muted);
    s += '</svg>';
    return s;
  }
};

      var p = [];
      for (var i = 0; i < 6; i++) {
        var a = Math.PI / 180 * (60 * i + (pointy ? 30 : 0));
        p.push(r2(cx + r * Math.cos(a)) + "," + r2(cy + r * Math.sin(a)));
      }
      return p.join(" ");
    }
    function hex(cx, cy, r, fill, stroke, pointy, extra) {
      return '<polygon points="' + hexPts(cx, cy, r, pointy) + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.5"' + (extra || "") + '/>';
    }
    function rbox(x, y, w, h, fill, stroke, lines, size, col) {
      var s = '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="6" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.8"/>';
      lines = [].concat(lines || []);
      var n = lines.length, fs = size || 13;
      lines.forEach(function (l, i) { s += txt(x + w / 2, y + h / 2 + (i - (n - 1) / 2) * (fs + 3) + fs * 0.36, l, fs, col || C.ink, ' font-weight="700"'); });
      return s;
    }
    // 기지국 탑: (x, y) = 밑변 가운데, 높이 26
    function tower(x, y, col) {
      col = col || C.dev;
      return '<path d="M' + r2(x - 7) + ',' + r2(y) + ' L' + r2(x) + ',' + r2(y - 26) + ' L' + r2(x + 7) + ',' + r2(y) + ' Z" fill="#fff" stroke="' + col + '" stroke-width="1.8" stroke-linejoin="round"/>' +
        '<line x1="' + r2(x - 4) + '" y1="' + r2(y - 10) + '" x2="' + r2(x + 4) + '" y2="' + r2(y - 10) + '" stroke="' + col + '" stroke-width="1.4"/>';
    }
    // 휴대폰(MS): 중심 (x, y), 12×22
    function phone(x, y, col, fill) {

        '<line x1="' + r2(x - 2.5) + '" y1="' + r2(y - 7) + '" x2="' + r2(x + 2.5) + '" y2="' + r2(y - 7) + '" stroke="' + col + '" stroke-width="1.4"/>';
    }
    function line(x1, y1, x2, y2, col, w, extra) {

    }
    function pth(d, col, w, extra) {
      return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + (w || 2) + '"' + (extra || "") + '/>';
    }
    // 경로를 따라 움직이는 점 (begin~begin+dur 동안만 보임)
    function dot(d, begin, dur, col, rad) {
      return '<circle r="' + (rad || 5) + '" fill="' + col + '" opacity="0"><animateMotion begin="' + begin + 's" dur="' + dur + 's" fill="freeze" path="' + d + '"/>' + show(begin, begin + dur) + '</circle>';
    }
    function marker(id, col) {

    var s = '<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="WAN 분류 트리 애니메이션">';

    // ---- 뿌리 ----

      rbox(470, 52, 270, 32, "#fde7eb", C.red, "이번 강의 focus: wireless WAN", 13, C.red));
    s += vis(8.5, D, line(605, 84, 605, 124, C.red, 2, ' marker-end="url(#wc_arR)"'));

    // ---- 요점 ----

};

// ===== renderer =====
// ============================================================
// 컴네위키(기말) renderer — 위키 문법 → HTML, 네비/검색/목차/시뮬레이터
// ARTICLES, NAV_ORDER 는 build.py 가 앞쪽에 삽입한다.
// ============================================================

var BOX_TYPES = ["info", "warn", "tip", "joke", "analogy", "def", "quiz", "exam"];

function renderNav(active) {
  var nav = document.getElementById("navList");
  nav.innerHTML = "";
  (typeof NAV_ORDER !== "undefined" ? NAV_ORDER : []).forEach(function (group) {
    var groupHeader = document.createElement("li");
    var gdiv = document.createElement("div");
    gdiv.style.cssText = "font-weight:700; color:#34466b; padding:6px 4px 2px; font-size:12px;";
    gdiv.textContent = group.group;
    groupHeader.appendChild(gdiv);
    nav.appendChild(groupHeader);
    group.items.forEach(function (key) {
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.href = "#" + encodeURIComponent(key);
      a.textContent = ARTICLES[key] ? ARTICLES[key].title : key;
      if (key === active) a.classList.add("active");
      li.appendChild(a);
      nav.appendChild(li);
    });
  });
}

function renderArticle(key) {
  var art = ARTICLES[key] || ARTICLES["main"];
  var area = document.getElementById("articleArea");

  if (!art) {
    area.innerHTML = '<h1>문서 없음</h1><p>아직 작성되지 않은 문서입니다.</p>';
    renderNav(key);
    renderTOC();
    return;
  }

  var cats = (art.category || []).map(function (c) {
    return '<span class="cat-tag">' + c + "</span>";
  }).join("");

  var html = "";
  if (key !== "main") {
    html += '<div class="breadcrumb"><a href="#main">컴네위키 기말</a> &gt; ' + art.title + "</div>";
  }
  html += "<h1>" + art.title + "</h1>";
  html += '<div class="meta">분류: ' + cats + "</div>";
  html += renderWikiText(art.body);
  html += '<div class="categories">분류: ' + cats + "</div>";

  area.innerHTML = html;

  mountSims(area);
  mountAnims(area);
  renderMath(area);

  renderNav(key);
  renderTOC();
  window.scrollTo(0, 0);
}

function mountSims(scope) {
  var nodes = scope.querySelectorAll(".sim[data-sim]");
  for (var i = 0; i < nodes.length; i++) {
    var node = nodes[i];
    var name = node.getAttribute("data-sim");
    if (typeof SimEngine !== "undefined" && SimEngine && typeof SimEngine.mount === "function") {
      SimEngine.mount(node, name);
    } else {
      node.className = "sim-missing";
      node.textContent = "시뮬레이터 없음: " + name;
    }
  }
}

function mountAnims(scope) {
  var nodes = scope.querySelectorAll(".anim[data-anim]");
  for (var i = 0; i < nodes.length; i++) {
    var node = nodes[i];
    var name = node.getAttribute("data-anim");
    if (typeof AnimEngine !== "undefined" && AnimEngine && typeof AnimEngine.mount === "function") {
      AnimEngine.mount(node, name, node.getAttribute("data-caption") || "");
    } else {
      node.className = "anim-missing";
      node.textContent = "움직이는 그림 없음: " + name;
    }
  }
}

function renderMath(scope) {
  if (typeof renderMathInElement !== "function") return;
  try {
    renderMathInElement(scope, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "$", right: "$", display: false }
      ],
      throwOnError: false
    });
  } catch (e) { /* 수식 실패는 무시 */ }
}

// ------------------------------------------------------------
// 블록 단위 파서
// ------------------------------------------------------------
function renderWikiText(text) {
  var lines = String(text == null ? "" : text).split("\n");
  var html = "";
  var inTable = false;
  var tableRows = [];
  var inPre = false;
  var preContent = "";
  var preClass = "";
  var listStack = [];

  function flushTable() {
    if (tableRows.length === 0) { inTable = false; return; }
    var t = "<div class=\"tablewrap\"><table>";
    tableRows.forEach(function (row) {
      t += "<tr>";
      row.cells.forEach(function (c) {
        var tag = c.header ? "th" : "td";
        t += "<" + tag + ">" + inlineFormat(c.text.trim()) + "</" + tag + ">";
      });
      t += "</tr>";
    });
    t += "</table></div>";
    html += t;
    tableRows = [];
    inTable = false;
  }
  function closeList() {
    while (listStack.length) html += "</" + listStack.pop() + ">";
  }
  function escapeCode(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];

    // ---- 코드블록 ----
    if (!inPre && /^<pre\b/.test(line)) {
      closeList(); flushTable();
      inPre = true;
      var cm = line.match(/class\s*=\s*"([^"]*)"/);
      preClass = cm ? cm[1] : "";
      preContent = "";
      continue;
    }
    if (inPre) {
      if (line.indexOf("</pre>") === 0) {
        html += '<pre class="' + preClass + '">' + formatPre(preContent.replace(/\n$/, ""), preClass) + "</pre>";
        inPre = false;
      } else {
        preContent += line + "\n";
      }
      continue;
    }

    // ---- 박스 (한 줄 / 여러 줄 공통) ----
    var boxStart = line.match(/^\{(info|warn|tip|joke|analogy|def|quiz|exam|answer)\}([\s\S]*)$/);
    if (boxStart) {
      closeList(); flushTable();
      var cls = boxStart[1];
      var closeRe = new RegExp("\\{/" + cls + "\\}\\s*$");
      var content;
      if (closeRe.test(line)) {
        // 같은 줄에서 열고 닫는 경우
        content = boxStart[2].replace(closeRe, "");
      } else {
        content = boxStart[2];
        while (++i < lines.length) {
          var next = lines[i];
          if (closeRe.test(next)) {           // 닫는 태그는 본문 줄 끝에 붙어도 된다
            content += "\n" + next.replace(closeRe, "");
            break;
          }
          content += "\n" + next;
        }
      }
      var inner = renderBoxBody(content);
      if (cls === "answer") {
        html += '<details class="answer"><summary>정답 보기</summary>' + inner + "</details>";
      } else {
        html += '<div class="' + cls + '">' + inner + "</div>";
      }
      continue;
    }

    // ---- footnotes ----
    if (line.trim() === "{footnotes}") { closeList(); flushTable(); html += '<div class="footnote">'; continue; }
    if (line.trim() === "{/footnotes}") { closeList(); flushTable(); html += "</div>"; continue; }

    // ---- 표 ----
    if (line.indexOf("{|") === 0) { closeList(); inTable = true; tableRows = []; continue; }
    if (line.indexOf("|}") === 0) { flushTable(); continue; }
    if (inTable) {
      if (line.indexOf("|-") === 0) continue;
      if (line.indexOf("!") === 0) {
        tableRows.push({ cells: line.substring(1).split("||").map(function (c) { return { text: c, header: true }; }) });
      } else if (line.indexOf("|") === 0) {
        tableRows.push({ cells: line.substring(1).split("||").map(function (c) { return { text: c, header: false }; }) });
      }
      continue;
    }

    // ---- 헤딩 ----
    if (line.indexOf("==== ") === 0 && /\s====$/.test(line)) {
      closeList(); flushTable();
      var t4 = line.slice(5, -5);
      html += '<h4 id="' + headingId(t4) + '">' + inlineFormat(t4) + "</h4>";
      continue;
    }
    if (line.indexOf("=== ") === 0 && /\s===$/.test(line)) {
      closeList(); flushTable();
      var t3 = line.slice(4, -4);
      html += '<h3 id="' + headingId(t3) + '">' + inlineFormat(t3) + "</h3>";
      continue;
    }
    if (line.indexOf("== ") === 0 && /\s==$/.test(line)) {
      closeList(); flushTable();
      var t2 = line.slice(3, -3);
      html += '<h2 id="' + headingId(t2) + '">' + inlineFormat(t2) + "</h2>";
      continue;
    }

    // ---- 수평선 ----
    if (/^----+\s*$/.test(line)) {
      closeList(); flushTable();
      html += "<hr>";
      continue;
    }

    // ---- 목록 (중첩 1단계까지) ----
    var lm = line.match(/^(\*{1,2}|#{1,2})\s+(.*)$/);
    if (lm) {
      flushTable();
      var depth = lm[1].length;
      var type = lm[1].charAt(0) === "*" ? "ul" : "ol";
      while (listStack.length > depth) html += "</" + listStack.pop() + ">";
      if (listStack.length === depth && listStack[depth - 1] !== type) {
        html += "</" + listStack.pop() + ">";
      }
      while (listStack.length < depth) { html += "<" + type + ">"; listStack.push(type); }
      html += "<li>" + inlineFormat(lm[2]) + "</li>";
      continue;
    }
    closeList();

    if (line.trim() === "") continue;

    // ---- 블록 레벨 단독 태그 ----
    var trimmed = line.trim();
    if (/^\[\[(img|sim|anim):.*\]\]$/.test(trimmed)) {
      html += inlineFormat(trimmed);
      continue;
    }

    html += "<p>" + inlineFormat(line) + "</p>";
  }
  closeList(); flushTable();
  if (inPre) html += '<pre class="' + preClass + '">' + formatPre(preContent, preClass) + "</pre>";
  return html;
}

// 제목에 위키 문법이 섞여 있어도 id 에는 남기지 않는다 ('''굵게''', [[링크]], `code`)
function headingId(text) {
  var t = String(text)
    .replace(/\[\[(?:img|sim|anim):[^\]]*\]\]/g, "")
    .replace(/\[\[(?:[^\]\|]*\|)?([^\]]+)\]\]/g, "$1")
    .replace(/'''/g, "")
    .replace(/''/g, "")
    .replace(/`/g, "");
  return "h_" + t.trim().replace(/\s/g, "_");
}

// 박스 본문: 블록 문법(표/목록/코드/중첩 박스/헤딩/수평선)이 있으면 renderWikiText 로 재귀,
// 없으면 기존처럼 인라인 + <br> (한 줄짜리 박스의 모양을 그대로 유지하기 위함).
var BLOCK_IN_BOX = /^(?:\{\||\*+\s|#+\s|<pre\b|=+\s|----+\s*$|\{(?:info|warn|tip|joke|analogy|def|quiz|exam|answer)\})/;

function renderBoxBody(content) {
  var lines = String(content == null ? "" : content).split("\n");
  var block = false;
  for (var i = 0; i < lines.length; i++) {
    if (BLOCK_IN_BOX.test(lines[i])) { block = true; break; }
  }
  if (block) return renderWikiText(content);
  return inlineFormat(content).replace(/\n/g, "<br>");
}

// <pre> 본문: 항상 HTML 이스케이프한 뒤, txt/ascii 클래스에 한해
// '''굵게''' 와 [[링크]] / [[키|표시]] 만 추가로 처리한다 (c/asm/sh/무클래스는 완전 raw).
function formatPre(src, cls) {
  var out = String(src == null ? "" : src)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  var classes = String(cls || "").split(/\s+/);
  if (classes.indexOf("txt") === -1 && classes.indexOf("ascii") === -1) return out;

  out = out.replace(/\[\[([^\|\]\n]+)\|([^\]\n]+)\]\]/g, function (m, key, label) {
    return wikiLink(key, label);
  });
  out = out.replace(/\[\[([^\]\n]+)\]\]/g, function (m, key) {
    return wikiLink(key, null);
  });
  out = out.replace(/'''([\s\S]+?)'''/g, "<strong>$1</strong>");
  return out;
}

function wikiLink(key, label) {
  key = key.trim();
  var exists = typeof ARTICLES !== "undefined" && !!ARTICLES[key];
  // 표시 문구가 없으면 key 를 그대로 보여 주고(제목이 길어 문장이 깨지는 것 방지), 전체 제목은 툴팁으로.
  var tip = exists ? ARTICLES[key].title : key;
  if (label === null || label === undefined) label = key;
  return '<a href="#' + encodeURIComponent(key) + '" class="' +
    (exists ? "wiki" : "wiki wiki-stub") + '" title="' + String(tip).replace(/"/g, "&quot;") + '">' + label + "</a>";
}

// ------------------------------------------------------------
// 인라인 문법
// ------------------------------------------------------------
function inlineFormat(text) {
  text = String(text == null ? "" : text);

  // [[sim:name]] — 시뮬레이터 자리
  text = text.replace(/\[\[sim:([^\]\|]+)\]\]/g, function (m, name) {
    return '<div class="sim" data-sim="' + name.trim() + '"></div>';
  });

  // [[anim:name|caption]] — 움직이는 그림 자리 (caption 은 인라인 위키 문법 허용)
  text = text.replace(/\[\[anim:([^\]\|\n]+)(?:\|([^\n]*?))?\]\]/g, function (m, name, caption) {
    var cap = (caption || "").replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
    return '<div class="anim" data-anim="' + name.trim() + '" data-caption="' + cap + '"></div>';
  });

  // [[img:file|caption|size]] — caption 안에 ']' 가 들어갈 수 있다 (예: prio_to_weight[40])
  text = text.replace(/\[\[img:([^\|\]\n]+)(?:\|([^\n]*?))?(?:\|(small|medium|large))?\]\]/g,
    function (m, fname, caption, size) {
      var cls = size || "medium";
      var cap = caption ? "<figcaption>" + caption + "</figcaption>" : "";
      return '<figure class="pdf-img ' + cls + '"><img src="images/' + fname.trim() +
        '" alt="' + (caption || fname) + '" loading="lazy">' + cap + "</figure>";
    });

  // [[mid:키|표시]] — 중간고사 컴네위키(cn-wiki) 문서로 가는 외부 링크 (선수 개념)
  text = text.replace(/\[\[mid:([^\|\]]+)(?:\|([^\]]+))?\]\]/g, function (m, key, label) {
    key = key.trim();
    return '<a href="https://ggoljunsa.github.io/cn-wiki/#' + encodeURIComponent(key) +
      '" class="wiki wiki-mid" target="_blank" rel="noopener" title="중간고사 컴네위키: ' + key.replace(/"/g, "&quot;") + '">' +
      (label || key) + '<sup>↗중간</sup></a>';
  });

  // [[key|label]]
  text = text.replace(/\[\[([^\|\]]+)\|([^\]]+)\]\]/g, function (m, key, label) {
    return wikiLink(key, label);
  });
  // [[key]]
  text = text.replace(/\[\[([^\]]+)\]\]/g, function (m, key) {
    return wikiLink(key, null);
  });

  // 굵게 먼저(3따옴표), 그 다음 기울임(2따옴표).
  // 본문에 아포스트로피가 섞여도(We'll, Don't, Little's) 끊기지 않도록 lazy 매칭.
  text = text.replace(/'''([\s\S]+?)'''/g, "<strong>$1</strong>");
  text = text.replace(/''([^\n'](?:[\s\S]*?[^\n'])?)''/g, "<em>$1</em>");
  text = text.replace(/`([^`]+)`/g, function (m, code) {
    return "<code>" + code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") + "</code>";
  });
  return text;
}
if (typeof window !== "undefined") window.inlineFormat = inlineFormat;

// ------------------------------------------------------------
// 목차 / 검색 / 라우팅
// ------------------------------------------------------------
// 목차용 제목 텍스트: KaTeX 가 렌더된 뒤에는 접근성용 MathML 중복을 빼고, 아직이면 $…$ 를 읽을 수 있게 정리.
function tocText(h) {
  var c = h.cloneNode(true);
  c.querySelectorAll(".katex-mathml").forEach(function (e) { e.parentNode.removeChild(e); });
  var t = c.textContent || "";
  if (t.indexOf("$") >= 0) {
    t = t.replace(/\$\$?([^$]+)\$\$?/g, function (m, x) {
      return x.replace(/\\geq?/g, "≥").replace(/\\leq?/g, "≤").replace(/\\times/g, "×")
              .replace(/\\(mathrm|text|mathbf)/g, "").replace(/\\[a-zA-Z]+/g, "").replace(/[{}]/g, "");
    });
  }
  return t;
}

function renderTOC() {
  var tocList = document.getElementById("tocList");
  if (!tocList) return;
  var headings = document.querySelectorAll("main h2, main h3");
  tocList.innerHTML = "";
  headings.forEach(function (h) {
    var li = document.createElement("li");
    li.className = "toc-item " + (h.tagName === "H2" ? "l2" : "l3");
    var a = document.createElement("a");
    a.href = "#" + h.id;
    a.textContent = tocText(h);
    a.style.color = "#1d65b3";
    a.style.textDecoration = "none";
    a.style.fontSize = "12px";
    a.addEventListener("click", function (ev) {
      ev.preventDefault();
      var target = document.getElementById(h.id);
      if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
    });
    li.appendChild(a);
    tocList.appendChild(li);
  });
}

document.getElementById("searchBox").addEventListener("input", function (e) {
  var q = e.target.value.trim().toLowerCase();
  var nav = document.getElementById("navList");
  if (q === "") { renderNav(currentArticle()); return; }
  nav.innerHTML = "";
  var hits = 0;
  Object.keys(ARTICLES).forEach(function (key) {
    var art = ARTICLES[key];
    var haystack = (key + " " + art.title + " " + art.body).toLowerCase();
    if (haystack.indexOf(q) !== -1) {
      hits++;
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.href = "#" + encodeURIComponent(key);
      a.textContent = art.title;
      li.appendChild(a);
      nav.appendChild(li);
    }
  });
  if (!hits) {
    var li0 = document.createElement("li");
    li0.style.cssText = "color:#999; font-size:12px; padding:6px 4px;";
    li0.textContent = "검색 결과 없음";
    nav.appendChild(li0);
  }
});

function currentArticle() {
  var hash = decodeURIComponent(location.hash.substring(1));
  return ARTICLES[hash] ? hash : "main";
}

// 디버그/검증용: index.html?anim=이름&animt=초  → 그 애니메이션 하나만 그 시각에 멈춘 상태로 렌더
//              index.html?animt=초#문서    → 문서 안의 모든 애니메이션을 t초에 멈춤 (스크린샷용)
var QUERY = (function () {
  var q = {};
  try {
    String(location.search || "").replace(/^\?/, "").split("&").forEach(function (kv) {
      if (!kv) return;
      var i = kv.indexOf("=");
      q[decodeURIComponent(i < 0 ? kv : kv.slice(0, i))] = decodeURIComponent(i < 0 ? "" : kv.slice(i + 1));
    });
  } catch (e) { /* ignore */ }
  return q;
})();
if (typeof window !== "undefined") window.ANIM_FREEZE_AT = (QUERY.animt !== undefined) ? parseFloat(QUERY.animt) : null;

function renderSingleAnim(name) {
  var area = document.getElementById("articleArea");
  area.innerHTML = "";
  if (!/^[a-z0-9_]+$/.test(name)) { area.textContent = "잘못된 anim 이름"; return; }
  var node = document.createElement("div");
  node.className = "anim";
  node.setAttribute("data-anim", name);
  area.appendChild(node);
  mountAnims(area);
  renderNav("main");
  renderTOC();
}

window.addEventListener("hashchange", function () { renderArticle(currentArticle()); });
if (QUERY.anim) renderSingleAnim(QUERY.anim); else renderArticle(currentArticle());

// KaTeX 는 defer 로 로드되므로, 첫 렌더 시점엔 아직 없을 수 있다 → load 후 한 번 더.
window.addEventListener("load", function () {
  renderMath(document.getElementById("articleArea"));
  renderTOC();
});

// 모바일 문서 목록 토글 (☰). 문서로 이동하면 자동으로 닫는다.
(function(){
  const btn=document.getElementById("navToggle");
  if(!btn) return;
  btn.addEventListener("click",()=>document.body.classList.toggle("nav-open"));
  window.addEventListener("hashchange",()=>document.body.classList.remove("nav-open"));
})();
