<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>컴네위키 기말 — DGIST CSE403 Computer Network Final Wiki</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c2840">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #f5f5f5;
    --paper: #ffffff;
    --text: #222;
    --muted: #777;
    --link: #1d65b3;
    --link-visited: #6a4fa3;
    --header: #2a3b5a;
    --header-text: #fff;
    --border: #d8d8d8;
    --code-bg: #f3f3f3;
    --info-bg: #fff8d8;
    --info-border: #e0c060;
    --warn-bg: #ffe9e9;
    --warn-border: #d68080;
    --tip-bg: #e8f3ff;
    --tip-border: #80a8d6;
    --analogy-bg: #f0ecff;
    --analogy-border: #8a74d8;
    --def-bg: #e9f8ea;
    --def-border: #62b36a;
    --quiz-bg: #fff2e0;
    --quiz-border: #e09a40;
    --exam-bg: #ffe4ea;
    --exam-border: #d6465f;
    --table-head: #ecf0f6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.65;
    overflow-wrap: break-word;
  }
  header.top {
    background: var(--header);
    color: var(--header-text);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 3px solid #1c2840;
  }
  header.top .logo {
    font-weight: 700;
    font-size: 18px;
    cursor: pointer;
    color: #fff;
    text-decoration: none;
    white-space: nowrap;
  }
  header.top .logo span { color: #ffd75e; }
  header.top .search { flex: 1; min-width: 160px; max-width: 420px; }
  header.top .search input {
    width: 100%;
    padding: 6px 10px;
    border-radius: 3px;
    border: 1px solid #1c2840;
    background: #fff;
    color: #222;
    font-size: 14px;
  }
  .nav-toggle {
    display: none; background: #1c2840; color: #fff; border: 1px solid #3a4a6a;
    border-radius: 3px; padding: 5px 9px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .offline-btn {
    background: #1c2840; color: #ffd75e; border: 1px solid #3a4a6a; border-radius: 3px;
    padding: 5px 9px; font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .offline-btn.done { color: #9be59b; border-color: #2e6b3a; }
  .offline-btn.busy { color: #c8d4e6; }
  header.top .tagline {
    margin-left: auto;
    color: #c8d4e6;
    font-size: 12px;
  }

  .layout {
    display: grid;
    grid-template-columns: 220px 1fr 220px;
    gap: 18px;
    max-width: 1280px;
    margin: 16px auto;
    padding: 0 16px;
  }
  @media (max-width: 1100px) {
    .layout { grid-template-columns: 200px 1fr; }
    .toc-side { display: none; }
  }
  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; gap: 12px; padding: 0 12px; }
    /* 폰에서는 문서 목록을 기본 접고 ☰ 버튼으로 연다 (aside.nav-side 규칙보다 우선하도록 선택자 명시) */
    aside.nav-side { display: none; position: static; max-height: 60vh; }
    body.nav-open aside.nav-side { display: block; }
    .nav-toggle { display: inline-block; }
    header.top { padding: 8px 12px; gap: 8px; }
    header.top .tagline { display: none; }
    main.article { padding: 16px 14px 40px; }
    main h1 { font-size: 22px; }
    main h2 { font-size: 17px; }
  }

  aside.nav-side, aside.toc-side {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px;
    font-size: 13px;
    align-self: start;
    position: sticky;
    top: 70px;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
  }
  aside h3 {
    margin: 0 0 8px;
    font-size: 13px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }
  aside ul { list-style: none; padding: 0; margin: 0; }
  aside ul li { padding: 3px 0; }
  aside ul li a {
    color: var(--link);
    text-decoration: none;
    display: block;
    padding: 2px 4px;
    border-radius: 3px;
  }
  aside ul li a:hover { background: #f0f4fa; text-decoration: underline; }
  aside ul li a.active { background: var(--header); color: #fff; font-weight: 600; }
  aside .cat { color: var(--muted); font-size: 11px; margin-top: 10px; }
  aside.toc-side .toc-item { padding-left: 0; }
  aside.toc-side .toc-item.l2 { padding-left: 12px; }
  aside.toc-side .toc-item.l3 { padding-left: 24px; }
  aside.toc-side .toc-item a { font-size: 12px; }

  main.article {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 24px 32px 60px;
    min-height: 70vh;
    min-width: 0;
  }
  main h1 {
    margin: 0 0 4px;
    font-size: 28px;
    border-bottom: 2px solid var(--header);
    padding-bottom: 8px;
  }
  main .meta { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
  main h2 {
    margin-top: 28px;
    font-size: 20px;
    background: #f0f4fa;
    padding: 6px 10px;
    border-left: 4px solid var(--header);
  }
  main h3 {
    margin-top: 18px;
    font-size: 16px;
    color: #34466b;
    border-bottom: 1px dashed #ccc;
    padding-bottom: 4px;
  }
  main h4 { margin-top: 14px; font-size: 14px; color: #34466b; }
  main p { margin: 8px 0; }
  main a { color: var(--link); text-decoration: none; }
  main a:hover { text-decoration: underline; }
  main a.wiki { font-weight: 500; }
  main a.wiki-stub { color: #888; font-style: italic; }
  main a.wiki-mid { color: #7a4fb0; } main a.wiki-mid sup { font-size: .65em; margin-left: 1px; color: #9b7cc6; }
  main ul, main ol { padding-left: 22px; }
  main li { margin: 3px 0; }
  main ul ul { margin: 3px 0; }

  main hr {
    border: 0;
    border-top: 1px solid var(--border);
    margin: 20px 0;
  }

  main code {
    background: var(--code-bg);
    padding: 1px 5px;
    border-radius: 3px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
  }
  main pre {
    background: #2b2b2b;
    color: #d0d4d8;
    padding: 12px 14px;
    border-radius: 4px;
    overflow-x: auto;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
  }
  main pre.c, main pre.asm, main pre.sh, main pre.txt {
    background: #2b2b2b;
    color: #d0d4d8;
  }
  main pre.ascii {
    background: #f8f8f4;
    color: #222;
    border: 1px solid var(--border);
  }

  main table {
    border-collapse: collapse;
    margin: 10px 0;
    width: 100%;
    font-size: 14px;
  }
  main table th, main table td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
    vertical-align: top;
  }
  main table th { background: var(--table-head); font-weight: 600; }

  .info, .warn, .tip, .analogy, .def, .quiz, .exam {
    border-left: 4px solid;
    padding: 10px 14px;
    margin: 12px 0;
    border-radius: 0 4px 4px 0;
    font-size: 14px;
  }
  .info { background: var(--info-bg); border-color: var(--info-border); }
  .warn { background: var(--warn-bg); border-color: var(--warn-border); }
  .tip  { background: var(--tip-bg);  border-color: var(--tip-border); }
  .info::before { content: "📝 참고  "; font-weight: 700; }
  .warn::before { content: "⚠ 주의  "; font-weight: 700; }
  .tip::before  { content: "💡 팁  "; font-weight: 700; }

  .analogy { background: var(--analogy-bg); border-color: var(--analogy-border); }
  .analogy::before { content: "🎭 비유  "; font-weight: 700; color: #5b45a8; }
  .def { background: var(--def-bg); border-color: var(--def-border); }
  .def::before { content: "📖 정의  "; font-weight: 700; color: #2f7a38; }
  .quiz { background: var(--quiz-bg); border-color: var(--quiz-border); }
  .quiz::before { content: "❓ 예상문제  "; font-weight: 700; color: #a8650c; }
  .exam {
    background: var(--exam-bg);
    border-color: var(--exam-border);
    border-left-width: 6px;
    border-top: 1px solid var(--exam-border);
    border-right: 1px solid var(--exam-border);
    border-bottom: 1px solid var(--exam-border);
    box-shadow: 0 1px 3px rgba(214,70,95,0.18);
  }
  .exam::before { content: "🎯 출제 포인트  "; font-weight: 700; color: #b32741; }

  /* 박스 안에 표·목록 같은 블록이 오면 본문이 renderWikiText 로 재귀 렌더된다.
     첫 문단만 inline 으로 두어 "📝 참고" 라벨과 같은 줄에 붙게 한다. */
  .info > p:first-child, .warn > p:first-child, .tip > p:first-child,
  .joke > p:first-child, .analogy > p:first-child, .def > p:first-child,
  .quiz > p:first-child, .exam > p:first-child { display: inline; }
  .info > :last-child, .warn > :last-child, .tip > :last-child,
  .joke > :last-child, .analogy > :last-child, .def > :last-child,
  .quiz > :last-child, .exam > :last-child { margin-bottom: 0; }
  .info > table, .warn > table, .tip > table, .joke > table,
  .analogy > table, .def > table, .quiz > table, .exam > table { background: #fff; }

  details.answer {
    background: #f4f4f4;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 12px;
    margin: 4px 0 14px;
    font-size: 14px;
  }
  details.answer > summary {
    cursor: pointer;
    font-weight: 700;
    color: #2f6d33;
    list-style: none;
    user-select: none;
  }
  details.answer > summary::-webkit-details-marker { display: none; }
  details.answer > summary::before { content: "▸ "; }
  details.answer[open] > summary::before { content: "▾ "; }
  details.answer[open] > summary { margin-bottom: 6px; border-bottom: 1px dashed #bbb; }

  .joke {
    background: #f5e8ff;
    border-left: 4px solid #a466d6;
    padding: 8px 14px;
    margin: 12px 0;
    font-size: 13px;
    color: #555;
    border-radius: 0 4px 4px 0;
  }
  .joke::before { content: "💬 여담  "; font-weight: 700; color: #7440a8; }

  .footnote {
    font-size: 12px;
    color: var(--muted);
    border-top: 1px solid var(--border);
    padding-top: 12px;
    margin-top: 24px;
  }
  .footnote-ref { font-size: 10px; vertical-align: super; color: var(--link); cursor: pointer; }

  .categories {
    margin-top: 30px;
    padding-top: 14px;
    border-top: 2px solid var(--border);
    font-size: 13px;
    color: var(--muted);
  }
  .categories .cat-tag, main .meta .cat-tag {
    display: inline-block;
    background: #e8e8e8;
    color: #444;
    padding: 2px 8px;
    border-radius: 10px;
    margin-right: 6px;
    font-size: 12px;
  }

  .diagram {
    background: #fafafa;
    border: 1px solid var(--border);
    padding: 10px;
    margin: 12px 0;
    text-align: center;
    border-radius: 4px;
  }
  .diagram .caption { color: var(--muted); font-size: 12px; margin-top: 6px; }
  figure.pdf-img {
    margin: 16px auto;
    text-align: center;
    background: #fafafa;
    border: 1px solid var(--border);
    padding: 12px;
    border-radius: 4px;
    max-width: 100%;
  }
  figure.pdf-img img { width: auto; max-width: 100%; height: auto; border: 1px solid #ddd; background: white; }
  figure.pdf-img figcaption { color: var(--muted); font-size: 12px; margin-top: 8px; font-style: italic; }
  /* 크기 옵션은 상한만 정한다 — 본문 칸보다 넓어지지 않도록 100% 와 min() */
  figure.pdf-img.small img  { max-width: min(400px, 100%); }
  figure.pdf-img.medium img { max-width: min(600px, 100%); }
  figure.pdf-img.large img  { max-width: min(850px, 100%); }
  /* grid 자식이 내용물 폭에 끌려 늘어나지 않게 */
  main.article { min-width: 0; overflow-x: hidden; }
  main.article .sim { max-width: 100%; }
  /* 표는 칸보다 넓어지면 가로 스크롤 (폰) */
  .tablewrap { overflow-x: auto; max-width: 100%; margin: 10px 0; }
  .katex-display { overflow-x: auto; overflow-y: hidden; max-width: 100%; padding: 2px 0; }
  .katex { white-space: normal; }
  .tablewrap table { margin: 0; }

  .stub-banner {
    background: #fff3cd;
    border: 1px dashed #d4a017;
    padding: 8px 12px;
    color: #6a5000;
    font-size: 13px;
    border-radius: 4px;
    margin-bottom: 12px;
  }

  .breadcrumb { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .breadcrumb a { color: var(--link); text-decoration: none; }

  footer.page { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }

  /* ============================================================
     SimEngine — 단계별 시뮬레이터
     ============================================================ */
  .sim {
    border: 2px solid #3a5480;
    border-radius: 6px;
    background: #fbfcfe;
    margin: 18px 0;
    padding: 0;
    overflow: hidden;
  }
  .sim:focus { outline: 2px solid #ffd75e; }
  .sim .sim-head {
    background: #3a5480;
    color: #fff;
    padding: 8px 12px;
  }
  .sim .sim-head .sim-title { font-weight: 700; font-size: 15px; }
  .sim .sim-head .sim-title::before { content: "🧪 "; }
  .sim .sim-head .sim-subtitle { font-size: 12px; color: #d3ddec; margin-top: 2px; }

  .sim .sim-body { padding: 10px 12px 14px; }

  .sim .sim-opts {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 16px;
    align-items: center;
    padding-bottom: 8px;
    border-bottom: 1px dashed var(--border);
    margin-bottom: 8px;
  }
  .sim .sim-opt { font-size: 12px; color: #34466b; }
  .sim .sim-opt label { font-weight: 600; margin-right: 5px; }
  .sim select {
    font-size: 12px;
    padding: 3px 5px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: #fff;
    color: #222;
    max-width: 100%;
  }

  .sim .sim-ctrl {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    margin-bottom: 10px;
  }
  .sim .sim-btn {
    font-size: 14px;
    line-height: 1;
    padding: 6px 10px;
    border: 1px solid #3a5480;
    background: #fff;
    color: #2a3b5a;
    border-radius: 4px;
    cursor: pointer;
    min-width: 36px;
  }
  .sim .sim-btn:hover:not(:disabled) { background: #eef2f8; }
  .sim .sim-btn:disabled { opacity: 0.35; cursor: default; }
  .sim .sim-btn.playing { background: #3a5480; color: #fff; }
  .sim .sim-range { flex: 1; min-width: 100px; accent-color: #3a5480; }
  .sim .sim-count {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    color: #34466b;
    white-space: nowrap;
    min-width: 62px;
    text-align: right;
  }

  .sim .sim-panels {
    display: flex;
    gap: 10px;
    align-items: stretch;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .sim .sim-panel {
    flex: 1 1 260px;
    min-width: 0;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #fff;
    display: flex;
    flex-direction: column;
  }
  .sim .sim-panel-head {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 8px;
    background: #eef2f8;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 700;
    color: #34466b;
  }
  .sim .sim-badge {
    margin-left: auto;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 7px;
    border-radius: 9px;
    background: #ddd;
    color: #444;
    white-space: nowrap;
  }
  .sim .sim-badge.running { background: #cdefd2; color: #1d6b2a; }
  .sim .sim-badge.ready { background: #fdeec2; color: #8a6000; }
  .sim .sim-badge.spinning { background: #ffd9d9; color: #a52f2f; }
  .sim .sim-badge.blocked, .sim .sim-badge.parked, .sim .sim-badge.sleeping { background: #dcdcf2; color: #3c3c88; }
  .sim .sim-badge.done, .sim .sim-badge.finished { background: #d8d8d8; color: #555; }

  .sim .sim-code {
    position: relative;
    min-width: 0; max-width: 100%;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 12px;
    line-height: 1.55;
    padding: 6px 0;
    overflow: auto;
    max-height: 280px;
  }
  .sim .sim-line { display: flex; padding: 0 8px; white-space: pre; }
  .sim .sim-line .sim-ln {
    color: #aaa;
    width: 2.4em;
    flex: 0 0 auto;
    text-align: right;
    margin-right: 8px;
    user-select: none;
  }
  .sim .sim-line .sim-mark { width: 1.1em; flex: 0 0 auto; color: #c0392b; font-weight: 700; }
  .sim .sim-line .sim-src { flex: 1 1 auto; }
  .sim .sim-line.cur { background: #fff3bf; }
  .sim .sim-line.cur .sim-src { font-weight: 700; color: #6b4a00; }

  .sim .sim-vars { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 10px; }
  .sim .sim-vars th, .sim .sim-vars td {
    border: 1px solid var(--border);
    padding: 3px 8px;
    text-align: left;
  }
  .sim .sim-vars th { background: #eef2f8; font-weight: 600; width: 40%; }
  .sim .sim-vars tr.sim-group th {
    background: #dde5f0;
    color: #34466b;
    font-size: 11px;
    letter-spacing: 0.03em;
  }
  .sim .sim-vars td {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    background: #fff;
  }
  .sim .sim-vars td.changed { background: #fff3bf; font-weight: 700; }
  .sim .sim-vars td .sim-prev { font-size: 10px; color: #9a7b1f; font-weight: 400; margin-right: 4px; }

  .sim .sim-descbox {
    background: #eef4fb;
    border-left: 4px solid #3a5480;
    padding: 8px 12px;
    font-size: 13.5px;
    border-radius: 0 4px 4px 0;
    margin-bottom: 8px;
  }
  .sim .sim-descbox .sim-stepno { font-weight: 700; color: #3a5480; margin-right: 6px; }
  .sim .sim-note {
    background: var(--warn-bg);
    border-left: 4px solid var(--warn-border);
    padding: 8px 12px;
    font-size: 13px;
    border-radius: 0 4px 4px 0;
    margin-bottom: 8px;
  }
  .sim .sim-note::before { content: "⚠ "; font-weight: 700; }
  .sim .sim-svgbox { text-align: center; overflow-x: auto; margin-top: 4px; }
  .sim .sim-svgbox svg { max-width: 100%; height: auto; }
  .sim .sim-hint { font-size: 11px; color: var(--muted); margin-top: 6px; }

  .sim-missing {
    border: 2px dashed #d6465f;
    background: #ffe4ea;
    color: #b32741;
    padding: 12px;
    border-radius: 4px;
    margin: 14px 0;
    font-weight: 700;
    font-size: 14px;
  }

  @media (max-width: 720px) {
    .sim .sim-panels { flex-direction: column; }
    .sim .sim-panel { flex: 1 1 auto; width: 100%; max-width: 100%; }
    .sim .sim-code { max-height: 220px; }
  }

  /* ---------- 움직이는 그림 (AnimEngine, [[anim:]]) ---------- */
  main.article .anim { max-width: 100%; }
  .anim {
    border: 1px solid #b9c4d8;
    border-left: 5px solid #d6465f;
    border-radius: 6px;
    background: #fff;
    margin: 16px 0;
    overflow: hidden;
    font-size: 13px;
  }
  .anim .anim-head {
    background: #3b2f4a;
    color: #fff;
    padding: 8px 12px;
  }

(function () {

  function cacheName() { return "wiki-" + (typeof OFFLINE_VER !== "undefined" ? OFFLINE_VER : "0"); }
  function setState(cls, text) { btn.className = "offline-btn " + cls; btn.textContent = text; }
  function checkDone() {
    if (!window.caches || typeof OFFLINE_IMAGES === "undefined") return;
    caches.open(cacheName()).then(function (c) { return c.keys(); }).then(function (keys) {
      var have = {}; keys.forEach(function (r) { have[new URL(r.url).pathname.split("/").slice(-2).join("/")] = 1; });
      var n = OFFLINE_IMAGES.filter(function (p) { return have[p]; }).length;
      if (n >= OFFLINE_IMAGES.length && keys.length) setState("done", "✓ 오프라인 준비됨");
      else if (n > 0) setState("", "📥 오프라인 저장 (" + n + "/" + OFFLINE_IMAGES.length + ")");
    }).catch(function () {});
  }
  navigator.serviceWorker.register("sw.js").then(function () { checkDone(); }).catch(function () { btn.style.display = "none"; });
  btn.addEventListener("click", function () {
    if (typeof OFFLINE_IMAGES === "undefined") return;
    var list = ["./index.html", "./manifest.webmanifest", "./icon.svg"].concat(OFFLINE_IMAGES);
    var done = 0, fail = 0;
    setState("busy", "저장 중 0/" + list.length);
    caches.open(cacheName()).then(function (c) {
      var i = 0;
      function next() {
        if (i >= list.length) {
          // KaTeX 폰트: CSS 가 참조하는 woff2 를 미리 받아 둔다 (css 가 이미 캐시돼 있으면 파싱)
          return c.match("https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css").then(function (r) { return r ? r.text() : ""; })
            .then(function (css) {
              var fonts = (css.match(/fonts\/[A-Za-z0-9_-]+\.woff2/g) || []).filter(function (v, k, a) { return a.indexOf(v) === k; })
                .map(function (f) { return "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/" + f; });
              return Promise.all(fonts.map(function (u) { return c.add(new Request(u, { mode: "cors" })).catch(function () {}); }));
            }).catch(function () {})
            .then(function () { setState(fail ? "" : "done", fail ? "⚠ " + fail + "개 실패 — 다시 누르기" : "✓ 오프라인 준비됨"); });
        }
        var batch = list.slice(i, i + 6); i += 6;
        return Promise.all(batch.map(function (u) {
          return c.add(u).then(function () { done++; }).catch(function () { fail++; });
        })).then(function () { setState("busy", "저장 중 " + (done + fail) + "/" + list.length); return next(); });
      }
      return next();

const ARTICLES = {
 "main": {
  "title": "컴네위키 기말 — DGIST CSE403 Computer Network 기말고사",
  "category": [

  ],
  "body": "'''컴네위키 기말'''은 DGIST [CSE403] Computer Network (Prof. Soobin Um, 2026 Fall) '''기말고사 범위''' — 지금은 '''CH05 Wide Area Networks (1) Cellular Telephony''' — 를 나무위키 스타일로 정리한 학습 위키다. 중간고사 범위(CH01–CH04)는 전편 [[mid:main|컴네위키]]에 있고, 이 위키에서 보라색 ↗중간 표시가 붙은 링크는 그쪽 문서로 넘어간다(새 탭).\n\n중간고사 위키와 똑같이 세 가지를 약속한다.\n\n# '''용어를 까먹으면 클릭한다.''' [[cell]], [[MSC]], [[reuse factor]], [[handoff]], [[GSM multiframe]] 같은 말에는 전부 사전 문서가 있다.\n# '''계산이 나오면 옆에서 값이 바뀌는 걸 본다.''' GSM 270.8 kbps, AMPS 832→416 채널, IS-95 1.228 Mcps, CDMA 복원 과정을 한 단계씩 밟는 '''시뮬레이터'''(◀ ▶).\n# '''보고만 있어도 흐름이 들어온다.''' 발신·수신, hard/soft handoff, frequency reuse, FDMA/TDMA/CDMA 를 '''움직이는 그림'''과 실제 슬라이드 캡처로 보여 준다.\n\n[[anim:generations_timeline|이 강의의 지도. 1G 아날로그 FDMA → 2G 디지털 TDMA/CDMA → 3G IMT-2000 → 4G all-IP. 세대마다 \"무엇으로 사용자를 나누는가\"를 기억하면 덱 전체가 정리된다]]\n\n== 어디서부터 읽나 ==\n\n* 처음이면 → [[읽는 순서]] (슬라이드 순서대로, 메인 문서 3편 + 딸린 사전 문서)\n* 세대가 헷갈리면 → [[셀룰러 세대 비교표]] (1G–4G 를 한 장에)\n* 시험이 코앞이면 → [[공식 모음]] → [[자주 틀리는 함정 모음]]\n* FDM·TDM·FSK·FHSS 가 기억 안 나면 → [[중간고사 선수 개념]]\n* 시험 날짜·범위 → [[시험 정보]] (기말 비중 40%, 날짜·범위 미공지)\n\n== 강의별 메인 문서 ==\n\n{|\n! 구간 || 메인 문서 || 한 줄 요약 || 핵심 시뮬레이터 / 그림\n|-\n| CH05 (1) p.1–17 || [[CH05 셀룰러 동작]] || WAN 분류, [[cell]]·[[base station]]·[[mobile station]]·[[MSC]], '''[[frequency reuse]]'''([[reuse factor]]), [[통화 발신 과정]]·[[통화 수신 과정]]([[paging]]), '''[[handoff]]'''([[hard handoff]]/[[soft handoff]]), [[roaming]] || `sim:call_flow` · `sim:handoff_signal` · `sim:reuse_pattern` · `anim:cellular_architecture` · `anim:handoff_hard_soft`\n|-\n| CH05 (1) p.18–26 || [[CH05 1G–2G 셀룰러]] || [[1G]] [[AMPS]]([[FDMA]], 832 채널, reuse 7), [[2G]] [[D-AMPS]]([[TDMA]] 3 사용자), '''[[GSM]]'''([[GSM multiframe]] → 270.8 kbps) || `sim:band_channels` · `sim:gsm_bitrate` · `sim:damps_tdma` · `anim:amps_bands` · `anim:gsm_multiframe_anim`\n|-\n| CH05 (1) p.27–36 || [[CH05 IS-95·3G·4G]] || '''[[IS-95]]'''([[DSSS]]·[[CDMA]], [[Walsh code]], reuse factor 1, [[pilot channel]]로 soft handoff), [[3G]] [[IMT-2000]]([[W-CDMA]]·[[CDMA 2000]]), [[4G]]([[all-IP]]) || `sim:is95_rates` · `sim:cdma_walsh` · `anim:cdma_spreading` · `anim:access_methods`\n|}\n\n== 이 위키를 읽는 법 ==\n\n{tip}\n* 📖 '''정의 박스'''는 슬라이드 영어 원문이 먼저 온다. \"정의 → 용어 이름\" 유형에 대비해 영어 문장을 그대로 외운다.\n* 🎯 '''출제 포인트 박스'''는 교수가 수업(10/20 녹음)에서 강조한 것이다.\n* ✍️ 슬라이드 캡처에는 '''내 GoodNotes 필기'''(빨간 글씨)가 그대로 있다. 필기에 \"??\"로 남긴 질문은 해당 문서의 💡 \"필기 속 질문\" 박스에서 답했고, \"다시\" 표시한 곳은 ⚠️ 박스로 쉽게 다시 설명했다.\n* 🎭 '''비유 박스'''는 이해가 안 될 때 먼저 읽는다.\n* ❓ '''예상문제'''는 정답이 접혀 있다. 먼저 답을 써 보고 펼친다.\n* 시뮬레이터는 ◀ ▶ 또는 키보드 ← → 로 한 단계씩 넘긴다. 움직이는 그림은 슬라이더로 멈춰 놓고 자막을 읽는다.\n{/tip}\n\n{analogy}\n셀룰러 망은 '''전국에 깔린 동네 우체국망'''이다. 동네(cell)마다 우체국(base station)이 있고, 우체국들은 중앙 집배센터(MSC)에 묶여 있다. 이웃 동네는 같은 배달 차량 번호(주파수)를 쓰면 헷갈리니 몇 동네 건너서만 다시 쓰고(frequency reuse), 내가 이사 가는 중에도 편지가 끊기지 않게 담당 우체국을 넘겨준다(handoff). 다른 회사 우체국 구역에 가도 제휴 덕분에 받을 수 있다(roaming).\n{/analogy}\n\n== 관련 문서 ==\n* [[읽는 순서]] · [[시험 정보]] · [[공식 모음]] · [[셀룰러 세대 비교표]] · [[중간고사 선수 개념]]\n* 전편: [[mid:main|컴네위키 (중간고사)]] · [[mid:WAN|WAN (CH01)]] · [[mid:LAN|LAN]]"

음]] → [[자주 틀리는 함정 모음]]"

  "body": "OX·객관식에서 헷갈리기 쉬운 짝을 모았다. 각 줄의 '''틀린 생각 → 맞는 사실''' 을 읽고, 이유가 바로 떠오르지 않으면 링크된 문서로 간다. 교수는 \"숫자를 묻는 OX 는 안 낸다\"(46:00)고 했으니, 함정은 대부분 '''개념의 방향·짝짓기'''에서 나온다.\n\n{analogy}\n함정 문제는 '''쌍둥이 구별하기'''다. uplink 와 downlink, hard 와 soft, FDMA 와 TDMA 는 얼굴이 닮았지만 \"누가 보내나\", \"끊고 잇나 / 잇고 끊나\", \"무엇으로 나누나\" 같은 점 하나로 구별된다. 그 점 하나만 정확히 기억하면 된다.\n{/analogy}\n\n== 방향과 이름 ==\n{|\n! 틀린 생각 || 맞는 사실 || 문서\n|-\n| downlink = MS 가 BS 로 보내는 것 || '''downlink = forward = BS → MS''', uplink = reverse = MS → BS. 교수: \"uplink/downlink 는 외워라\" || [[uplink와 downlink]]\n|-\n| AMPS 의 824–849 MHz 는 BS 가 쓰는 대역 || 824–849 MHz 는 '''Mobile station band'''(MS 가 송신 = reverse). BS 는 869–894 MHz 로 송신 || [[AMPS 대역과 채널]]\n|-\n| handoff 와 handover 는 다른 절차 || 같은 개념이다 (교수 26:27) || [[handoff]]\n|-\n| base station 과 WiFi 의 AP 는 전혀 다른 것 || 역할은 같다 — 교수: \"interchangeable\"(8:39). 규모·표준·MSC 유무가 다를 뿐 || [[셀룰러와 WiFi 비교]]\n|}\n\n== 구조와 동작 ==\n{|\n! 틀린 생각 || 맞는 사실 || 문서\n|-\n| handoff 를 결정하는 것은 MS || '''MSC''' 가 every few seconds 신호 세기를 감시하고 새 cell 을 찾아 채널을 바꾼다 (교수 33:09 \"made by MSC, not by MS\") || [[handoff]] · [[MSC]]\n|-\n| 전화를 받을 때도 걸 때처럼 MS 가 먼저 신호를 보낸다 || 수신은 MS 위치를 모르므로 MSC 가 '''모든 cell 에 paging''' 을 보내야 한다 || [[통화 수신 과정]] · [[paging]]\n|-\n| 발신 때 MS 는 아무 BS 에나 번호를 보낸다 || 대역을 scan 해 '''가장 강한(closest) setup channel''' 로 보낸다 — 교수 \"very important\"(16:10) || [[통화 발신 과정]]\n|-\n| hard handoff 는 두 BS 와 동시에 통신 || 반대다. hard = '''BS 하나와만''' (break before make), soft = '''두 BS 와 동시에''' (make before break) || [[hard handoff]] · [[soft handoff]]\n|-\n| 요즘도 hard handoff 를 주로 쓴다 || hard 는 early systems. 교수: \"nowadays we never use hard handoff\"(29:54) || [[hard handoff]]\n|-\n| 인접 cell 이 같은 주파수를 써도 언제나 괜찮다 || FDMA/TDMA 계열에서는 경계의 사용자가 간섭을 받으므로 금지. '''CDMA(IS-95)만 reuse factor 1''' 이 가능 || [[frequency reuse]] · [[IS-95 frequency reuse]]\n|-\n| reuse factor N 은 cell 하나가 쓰는 주파수 개수 || N 은 '''reuse pattern 을 이루는 cell 의 개수'''. N 이 클수록 같은 주파수 cell 이 멀어진다 || [[reuse factor]]\n|-\n| roaming 은 같은 통신사 안에서 cell 을 옮기는 것 || 그건 handoff. roaming 은 '''다른 service provider''' 구역에서 roaming contract 로 서비스를 받는 것 || [[roaming]]\n|}\n\n== 세대 ==\n{|\n! 틀린 생각 || 맞는 사실 || 문서\n|-\n| AMPS 는 이름처럼 advanced 한 디지털 시스템 || AMPS 는 '''analog''' 1G 시스템, FDMA. 교수: \"it is not advanced, but it is named\" || [[AMPS]]\n|-\n| AMPS 는 voice 와 control 모두 FM || voice 는 '''FM''', control 은 '''FSK''' (10 kbps 디지털 데이터) || [[AMPS control channel]] · [[FM]]\n|-\n| D-AMPS 는 AMPS 와 다른 새 대역을 쓴다 || '''같은 bands and channels''' 를 쓰고, 음성을 디지털화해 TDMA 로 채널당 3 명 || [[D-AMPS]]\n|-\n| GSM 은 순수 TDMA || D-AMPS 처럼 '''TDMA + FDMA''' (124 개 200 kHz 채널을 FDMA 로, 그 안을 8 slot TDMA 로) || [[GSM]] · [[TDMA]]\n|-\n| 한국 2G 는 GSM || 한국은 '''IS-95 (CDMA)'''. GSM 은 유럽 표준 || [[IS-95]] · [[GSM]]\n|-\n| IS-95 는 FDMA 를 전혀 안 쓴다 || 대역을 1.228 MHz 채널 20 개로 나누는 것은 FDMA, 채널 안에서 사용자를 CDMA 로 나눈다 || [[IS-95 대역과 채널]]\n|-\n| IS-95 의 BS 동기화는 MSC 가 맞춘다 || '''GPS''' 서비스를 쓴다 || [[GPS 동기화]]\n|-\n| soft handoff 는 아무 시스템이나 된다 || IS-95 에서는 BS 가 '''pilot channel''' 을 계속 broadcast 해서 MS 가 이웃 cell 을 감지할 수 있기 때문에 가능 || [[IS-95 soft handoff]] · [[pilot channel]]\n|-\n| IMT-2000 은 하나의 구체적 표준 || ITU 가 낸 '''blueprint''' (요구사항). 그 아래 5 개 표준(IMT-DS, MC, TC, SC, FT) || [[IMT-2000]] · [[IMT-2000 표준]]\n|-\n| 3G 는 packet-switched 만 || 3G(IMT-2000)는 '''packet + circuit''' 둘 다 지원. '''all-IP packet-switched''' 는 4G || [[3G]] · [[4G]] · [[circuit switching과 packet switching]]\n|}\n\n{quiz}\nOX: ① uplink 는 forward communication 이다. ② soft handoff 에서 MS 는 두 BS 와 동시에 통신할 수 있다. ③ AMPS 의 control channel 은 FM 으로 변조된다. ④ IS-95 는 neighboring cell 이 같은 주파수 대역을 쓸 수 있다. ⑤ handoff 결정은 MS 가 한다.\n{/quiz}\n{answer}\n① ✗ (uplink = reverse, MS → BS) ② ○ ③ ✗ (control = FSK, voice = FM) ④ ○ (reuse factor 1, CDMA) ⑤ ✗ (MSC 가 신호 세기를 감시하고 결정)\n{/answer}\n\n== 관련 문서 ==\n* [[공식 모음]] · [[셀룰러 세대 비교표]] · [[시험 정보]]"
 },
 "공식 모음": {
  "title": "공식 모음 — CH05 의 계산과 참고 수치",
  "category": [
   "안내"
  ],
  "body": "CH05 (1)은 공식이 많은 장이 아니다. 계산은 '''[[GSM channel bit rate]]''' 하나가 슬라이드에 식으로 나오고, 나머지는 \"대역 ÷ 채널 폭\" 같은 나눗셈이다.\n\n{exam}\n🎙 10/20 수업 41:54 — \"I'm not going to recommend you to memorize all these specific numbers, but instead, I would recommend you to '''understand how communication systems evolve across generations'''. That trend is important. … But I would recommend you to '''memorize uplink and downlink'''.\"\n→ 아래 수치는 '''암기 대상이 아니라 세대 차이를 이해하는 재료'''다. 반대로 [[uplink와 downlink]](= reverse / forward, 누가 보내는가)는 반드시 외운다.\n{/exam}\n\n== 계산 ==\n{|\n! 무엇 || 식 || 값 || 시뮬레이터\n|-\n| [[GSM channel bit rate]] || $\\frac{1}{120\\text{ ms}} \\times 26 \\times 8 \\times 156.25$ || '''270.8 kbps''' || `sim:gsm_bitrate`\n|-\n| GSM 사용자 1명(slot 1개) || $270.8 / 8$ || ≈ 33.85 kbps || `sim:gsm_bitrate`\n|-\n| GSM 순수 user data || $65 \\times 24 / 120\\text{ ms}$ || 13 kbps (p.25 그림의 Digitizer 값; 65×24/120 ms 로 검산) || `sim:gsm_bitrate`\n|-\n| [[AMPS 대역과 채널|AMPS 채널 수]] || $25\\text{ MHz} / 30\\text{ kHz} \\approx 833$ || 832 채널 → provider 당 416 (control 21, voice 395) || `sim:band_channels`\n|-\n| GSM 채널 수 || $25\\text{ MHz} / 200\\text{ kHz} = 125$ || 124 채널 (방향당) || `sim:band_channels`\n|-\n| [[D-AMPS]] 한 채널 || $3 \\times 7.95\\text{ kbps} = 23.85\\text{ kbps}$ || overhead 포함 48.6 kbps || `sim:damps_tdma`\n|-\n| [[IS-95 forward 전송|IS-95 forward]] [[chip rate]] || $19.2\\text{ ksps} \\times 64$ || 1.2288 Mcps ≈ 1.228 Mcps || `sim:is95_rates`\n|-\n| [[IS-95 reverse 전송|IS-95 reverse]] chip rate || $28.8 \\to 307.2\\text{ kcps} \\times 4$ || 1.2288 Mcps || `sim:is95_rates`\n|-\n| cell 당 채널 ([[reuse factor]] N) || $\\text{전체 채널} / N$ || AMPS voice 395/7 ≈ 56 (파생값, 슬라이드에 없음) || `sim:reuse_pattern`\n|}\n\n<pre class=\"txt\">\nGSM channel bit rate — 손으로 푸는 순서\n1. slot 1개 = '''156.25 bits'''\n2. frame 1개 = 8 slots      → 8 × 156.25 = 1250 bits\n3. multiframe = 26 frames   → 26 × 1250 = 32,500 bits\n4. multiframe 길이 = 120 ms → 32,500 / 0.120 s = 270,833 bps ≈ '''270.8 kbps'''\n<\/pre>\n\n== 참고 수치 (암기 불필요 — trend 이해용) ==\n{|\n! 세대 || 수치\n|-\n| AMPS || 824–849 MHz (MS→BS, reverse/uplink) · 869–894 MHz (BS→MS, forward/downlink) · 각 25 MHz · 30 kHz · 832 채널 · 416/provider · control 21 · reuse factor 7\n|-\n| D-AMPS || 7.95 kbps · 3 채널 TDMA · 48.6 kbps\n|-\n| GSM || 890–915 MHz (uplink) · 935–960 MHz (downlink) · 200 kHz · 124 채널 · 156.25 bits · 8 slot · 26 frame (24 traffic + 2 control) · 120 ms · 270.8 kbps\n|-\n| IS-95 || 800 MHz · 1,900 MHz ISM · 1.228 MHz × 20 채널 · 10/provider · reuse factor 1 · GPS 동기화 · Walsh code 64 개 (W0 = pilot)\n|-\n| IMT-2000 || 144 kbps (차량) · 384 kbps (보행) · 2 Mbps (정지) · 2 GHz 대역 · 2 MHz 대역폭 · W-CDMA 5 MHz · CDMA 2000 15 MHz + 1.25 MHz\n|-\n| 4G || 100 Mbps (이동) · 1 Gbps (정지) · 어디서든 100 Mbps 이상\n|}\n\n{analogy}\n이 표는 '''역사책의 연표'''다. 연도를 하나하나 외우는 것보다 \"아날로그 → 디지털 → 데이터 → all-IP\" 라는 흐름을 아는 게 시험에 더 쓸모 있다. 숫자는 그 흐름을 실감하는 재료로만 쓴다(채널 폭 30 kHz → 200 kHz → 1.228 MHz → 5 MHz 처럼 '''점점 넓어진다''').\n{/analogy}\n\n== 관련 문서 ==\n* [[셀룰러 세대 비교표]] · [[GSM multiframe]] · [[AMPS 대역과 채널]] · [[자주 틀리는 함정 모음]]"
 },
 "셀룰러 세대 비교표": {
  "title": "셀룰러 세대 비교표 — 1G부터 4G까지 한 장에",
  "category": [
   "안내"
  ],
  "body": "CH05 (1) p.18–36 을 표 하나로 압축했다. 시험 직전에 이 표만 보고 각 칸을 설명할 수 있으면 세대 부분은 끝난 것이다. 칸마다 사전 문서로 들어갈 수 있다.\n\n[[anim:access_methods|FDMA(주파수로 나눔) → TDMA(시간으로 나눔) → CDMA(코드로 나눔). 표의 \"다중 접속\" 열이 이 그림이다]]\n\n== 세대별 표준 비교 ==\n{|\n! 세대 || 표준 || 아날로그/디지털 || 다중 접속 || 대역·채널 || 핵심 수치 || 슬라이드\n|-\n| [[1G]] || [[AMPS]] (북미) || 아날로그 || [[FDMA]] || 824–849 / 869–894 MHz, 30 kHz 채널 832 개 || provider 당 416 채널(control 21), reuse factor 7, voice=[[FM]], control=[[mid:FSK|FSK]] || p.18–20\n|-\n| [[2G]] || [[D-AMPS]] (북미) || 디지털 || [[TDMA]] (+FDMA) || AMPS 와 같은 대역·채널 || 음성 7.95 kbps × 3 → 48.6 kbps (overhead 포함) || p.21–22\n|-\n| 2G || [[GSM]] (유럽) || 디지털 || TDMA (+FDMA) || 890–915 / 935–960 MHz, 200 kHz 채널 124 개 || slot 156.25 bits, 8 slot/frame, 26 frame/multiframe = 120 ms → '''270.8 kbps''' || p.23–26\n|-\n| 2G || [[IS-95]] (북미·한국) || 디지털 || '''[[CDMA]]''' ([[DSSS]]) (+FDMA) || 800 / 1,900 MHz, 1.228 MHz 채널 20 개, provider 당 10 || '''reuse factor 1''', GPS 동기화, [[pilot channel]] → soft handoff || p.27–32\n|-\n| [[3G]] || [[IMT-2000]] (ITU 청사진) || 디지털 || 표준마다 다름 ([[W-CDMA]]·[[CDMA 2000]] 등 5종) || 2 GHz 대역, 2 MHz 대역폭 || 144 kbps(차량) / 384 kbps(보행) / 2 Mbps(정지), packet+circuit || p.33–35\n|-\n| [[4G]] || (요구사항) || 디지털 || — || — || 100 Mbps(이동) / 1 Gbps(정지), '''[[all-IP]]''' packet-switched || p.36\n|}\n\n== handoff·reuse 비교 ==\n{|\n! || FDMA/TDMA 계열 (AMPS, D-AMPS, GSM) || CDMA 계열 (IS-95)\n|-\n| [[reuse factor]] || 7 같은 값 — 이웃 cell 은 다른 주파수 || '''1''' — 이웃 cell 이 같은 대역을 써도 된다\n|-\n| 이유 || 같은 주파수면 경계에서 [[co-channel interference]] || 이웃 cell 의 간섭이 CDMA/DSSS 전송에 영향을 못 준다\n|-\n| [[handoff]] || [[hard handoff]] (BS 하나와만 통신, 초기 시스템) || [[soft handoff]] — pilot channel 로 이웃 BS 를 미리 감지\n|}\n\n{analogy}\n세대 변화는 '''한 강의실을 여러 명이 쓰는 방법'''의 변화다. 1G 는 강의실을 칸막이로 나눠 각자 한 칸(FDMA), 2G TDMA 는 한 칸을 시간표로 돌려 씀, CDMA 는 칸막이 없이 모두 동시에 말하되 각자 다른 언어로 말해서 자기 언어만 알아듣는 것. 그래서 CDMA 는 옆 강의실과 같은 방을 써도(reuse factor 1) 괜찮다.\n{/analogy}\n\n{quiz}\n① 1G 와 2G 를 가르는 가장 큰 차이는? ② IS-95 의 reuse factor 가 1 일 수 있는 이유는? ③ GSM 의 channel bit rate 270.8 kbps 를 계산식으로 쓰라.\n{/quiz}\n{answer}\n① 아날로그 → 디지털 (AMPS 는 analog, D-AMPS 는 AMPS 를 digital 로 진화시킨 것).\n② 이웃 cell 에서 오는 간섭이 CDMA/DSSS 전송에 영향을 주지 못하기 때문 (사용자를 주파수가 아니라 code 로 구분).\n③ $\\frac{1}{120\\text{ ms}} \\times 26 \\times 8 \\times 156.25 = 270.8\\text{ kbps}$ (26 frame × 8 slot × 156.25 bits 가 120 ms 마다).\n{/answer}\n\n== 관련 문서 ==\n* [[셀룰러 세대]] · [[CH05 1G–2G 셀룰러]] · [[CH05 IS-95·3G·4G]] · [[공식 모음]]"
 },
 "중간고사 선수 개념": {
  "title": "중간고사 선수 개념 — CH05 를 읽기 전에 다시 볼 것",
  "category": [
   "안내"
  ],
  "body": "CH05 셀룰러는 중간고사 범위에서 배운 도구를 '''그대로 다시 쓴다'''. 1G 는 FDM 을, 2G 는 TDM 을, Bluetooth 에서 본 FHSS 의 사촌이 IS-95 의 DSSS 다. 아래 표에서 기억이 흐린 줄만 골라 중간고사 위키(↗중간)로 넘어가 복습하고 돌아온다.\n\n{|\n! 중간고사에서 배운 것 || 어디서 배웠나 || CH05 에서 어디에 쓰이나\n|-\n| [[mid:WAN|WAN]] · [[mid:LAN|LAN]] || CH01 || [[WAN 분류]] — 이번 장 전체의 출발점\n|-\n| [[mid:FDM|FDM]] · [[mid:guard band|guard band]] || CH02 Multiplexing || [[FDMA]] — [[AMPS]] 의 30 kHz 채널, [[GSM 대역]] 200 kHz, [[IS-95 대역과 채널]] 1.228 MHz 사이의 guard band\n|-\n| [[mid:TDM|TDM]] || CH02 Multiplexing || [[TDMA]] — [[D-AMPS]] 3 슬롯, [[GSM 프레임 구조]] 8 슬롯\n|-\n| [[mid:channelization|channelization]] (FDMA/TDMA/CDMA) || CH03 MAC || 세대 구분 그 자체: 1G=FDMA, 2G=TDMA/CDMA\n|-\n| [[mid:duplexing과 multiple access|duplexing과 multiple access]] · [[mid:TDD-TDMA|TDD-TDMA]] || CH04 Bluetooth || 셀룰러는 '''두 대역'''(uplink/downlink)으로 duplex: [[uplink와 downlink]]\n|-\n| [[mid:FSK|FSK]] · [[mid:PSK|PSK]] · [[mid:modulation|modulation]] || CH02 Analog Transmission || [[AMPS control channel]]=FSK, [[FM]], [[QPSK]], [[GMSK]]\n|-\n| [[mid:PCM|PCM]] · [[mid:sampling|sampling]] || CH02 Digital Transmission || 음성 디지털화: [[7.95 kbps 디지털 음성]], IS-95 의 9.6 kbps digitizer\n|-\n| [[mid:FHSS|FHSS]] || CH04 Bluetooth || [[spread spectrum]]의 다른 방식 → [[DSSS]]\n|-\n| [[mid:bit rate|bit rate]] · [[mid:bandwidth|bandwidth]] || CH02 || [[GSM channel bit rate]], [[chip rate]]\n|-\n| [[mid:station mobility|station mobility]] · [[mid:BSS|BSS]] · [[mid:distribution system|distribution system]] || CH04 WiFi || [[셀룰러와 WiFi 비교]] — cell ↔ BSS, MSC ↔ distribution system, handoff ↔ BSS-transition\n|}\n\n{analogy}\n선수 개념은 '''레고 블록'''이다. 중간고사 때 FDM·TDM·FSK 블록을 만들어 뒀고, CH05 는 그 블록을 조립해 \"휴대폰 세대\"라는 완성품을 보여 준다. 블록 모양이 기억 안 나면 조립 설명서(↗중간)로 돌아간다.\n{/analogy}\n\n== 관련 문서 ==\n* [[읽는 순서]] · [[셀룰러 세대 비교표]] · [[FDMA]] · [[TDMA]] · [[CDMA]]"
 },

  "category": [

  "body": "'''CH05 셀룰러 동작''' 은 L10 덱(`CH05_Wide Area Networks (1).pdf`, 36쪽) 중 p.1–17 이다. 10/20(화) 수업의 앞 절반(녹음 0:35 ~ 약 34분)이 여기다. p.18 부터의 세대(1G~4G) 이야기는 [[CH05 1G–2G 셀룰러]]·[[CH05 IS-95·3G·4G]] 로 이어진다.\n\n이 덱이 던지는 질문은 — '''\"LAN 보다 훨씬 넓은 지역(도시·나라·세계)을, 그것도 무선으로 덮으려면 어떻게 해야 하나? 사용자가 움직이면?\"'''\n답: 넓은 지역을 육각형 '''[[cell]]''' 로 잘게 나누고, cell 마다 '''[[base station]]'''(BS)을 하나 세운다. BS 들은 '''[[MSC]]''' 가 묶어서 지휘하고, MSC 는 유선 전화망 '''[[PSTN]]''' 에 붙는다. 이웃 cell 은 서로 다른 주파수를 써야 간섭이 없다('''[[frequency reuse]]''', 패턴 크기 = '''[[reuse factor]]''' N). 전화를 걸 때(발신)와 받을 때(수신, '''[[paging]]''')의 절차가 다르고, 통화 중에 cell 경계를 넘으면 MSC 가 통화를 옆 BS 로 넘긴다('''[[handoff]]''' — [[hard handoff]] / [[soft handoff]]). 내 통신사 영역 밖으로 나가면 이웃 통신사가 계약으로 서비스해 준다('''[[roaming]]''').\n\n페이지 번호는 슬라이드 인쇄 번호(= PDF 페이지)다. 이 PDF 는 수강생의 GoodNotes 필기본이라 슬라이드마다 빨간 녹음 타임스탬프와 메모가 있다.\n\n== 한눈에 보기 ==\n기호를 까먹었을 때 이 절만 다시 읽으면 된다. 등장인물: '''MS = 내 폰, BS = 기지국(탑), MSC = BS 들의 지휘소, central office = 유선 전화국, PSTN = 유선 전화망.'''\n\n=== ① 구조 ===\n<pre class=\"ascii\">\n   (육각형 '''[[cell]]''')          (유선)                 (유선)\n   ┌─────────────┐\n   │  '''[[mobile station|MS]]''' ))) '''[[base station|BS]]''' ├─────── '''[[MSC]]''' ─────── '''[[PSTN]]''' ──── stationary phone\n   └─────────────┘           │  (모든 BS 와\n   ┌─────────────┐           │   central office\n   │  MS ))) BS  ├───────────┘   사이를 조정)\n   └─────────────┘\n  무선 구간은 MS ↔ BS 한 hop 뿐. 그 뒤는 전부 '''유선 infrastructure'''.\n<\/pre>\n\n=== ② 동작 다섯 가지 (p.11–17) ===\n{|\n! 동작 || 한 줄 요약 || 키워드 || 슬라이드\n|-\n| [[frequency reuse]] || 이웃 cell 은 다른 주파수 set, 멀리 떨어진 cell 은 같은 set 재사용 || reuse factor N (4, 7) || p.11\n|-\n| [[통화 발신 과정|Transmitting]] || MS → 가장 강한 setup channel → BS → MSC → central office → 상대 || strongest setup channel, unused voice channel || p.12\n|-\n| [[통화 수신 과정|Receiving]] || central office → MSC → '''모든 cell 에 paging''' → MS 응답 → ringing → voice channel || [[paging]] || p.13\n|-\n| [[handoff]] || 통화 중 cell 을 넘으면 MSC 가 통화를 새 BS 로 넘김 || every few seconds, hard / soft || p.14–16\n|-\n| [[roaming]] || 내 통신사 coverage 밖에서 이웃 통신사가 서비스 || roaming contract || p.17\n|}\n\n{exam}🎯 출제 예상 자리\n* 구성 요소 4개의 역할: '''cell'''(작은 영역) · '''BS'''·'''MS'''(cell 의 구성원) · '''MSC'''(\"coordinates communication between all BSs and the central office\").\n* '''Frequency reuse''': \"Neighboring cells '''cannot''' use the same set of frequencies\" — 이유 = cell 경계 사용자의 '''interference'''. \"N is the '''reuse factor'''\" (그림 N=4, N=7).\n* '''발신 ①–⑦ vs 수신 ①–⑦''' 의 차이: 수신에는 '''paging'''(MSC 가 MS 위치를 모르니 모든 cell 에 query)이 있다.\n* '''Hard handoff = 한 BS 와만 = break before make (early systems)''' vs '''soft handoff = 동시에 두 BS = make before break'''.\n* 이 모든 동작이 '''infrastructure 에 heavily dependent''' — 교수가 발신·수신 두 번 다 강조(🎙 절, p.12 필기 \"통신을 위해 BS, MSC, central office 등 infrastructure 필요\").\n* '''\"Every transition decision is made by MSC, not by MS\"''' (🎙 33:09) · \"nowadays we never use hard handoff … always soft handoff\" (🎙 29:54).{/exam}\n\n{analogy}🎭 '''택배 회사의 지역 영업소 체계.''' 전국(서비스 지역)을 동네 단위 구역(cell)으로 나누고 구역마다 영업소(BS)를 둔다. 영업소들은 지역 본부(MSC)가 총괄하고, 본부는 다른 회사·우체국망(PSTN)과 연결된다. 내가 물건을 보낼 때는 가장 가까운 영업소에 맡기면 되지만(발신), 나한테 온 물건은 본부가 내가 어느 구역에 있는지 몰라서 모든 영업소에 \"장민준 씨 거기 있어요?\" 하고 방송한다(paging). 배달 중에 내가 이사를 가면 담당 영업소가 바뀐다(handoff). 해외로 가면 현지 제휴 택배사가 대신 배달한다(roaming).{/analogy}\n\n[[anim:cellular_architecture|cell 이 깔리고 → 각 cell 에 BS·MS → BS 들이 MSC 로 유선 연결 → MSC 가 PSTN 에 연결되는 순서로 구성 요소 4개를 머릿속에 그려라]]\n\n== p.2–4 — What we learned so far, Recap: WAN ==\n* p.2–3: 지금까지 배운 것 = [[mid:physical layer|Physical layer]](신호를 채널로 보냄) + [[mid:data-link layer|Data-link layer]]([[mid:DLC]] 오류 검출·정정, [[mid:MAC sublayer|MAC]] 매체 공유) → 그 두 계층 위의 실제 망 = '''[[mid:LAN|LAN]]'''([[mid:CH04 Ethernet|Ethernet]], [[mid:CH04 WiFi|WiFi]], [[mid:CH04 Bluetooth|Bluetooth]]). \"Another important network types?\" → '''Wide Area Networks (WANs)'''.\n* p.4 Recap: WAN = \"An interconnection of devices capable of communication\". LAN 과의 차이는 '''규모''' — \"A WAN has a '''wider geographical span''', spanning a town, a state, a country, or even the world\" → [[mid:WAN]].\n* p.4 왼쪽 그림(Forouzan)은 LAN 들이 '''point-to-point WAN'''(router–router, modem–modem)과 '''switched WAN''' 으로 이어진 모습, 오른쪽은 \"LAN — WAN(구름) — LAN\".\n\n{info}이번 챕터도 [[mid:physical layer|physical]]·[[mid:data-link layer|data-link]] 두 계층 이야기다. 교수: \"Of course, there are upper layers involved in WANs, but today we're going to focus on these two.\" 다음 주부터 network layer.{/info}\n\n== p.5–7 — Two broad categories ⭐ ==\n[[img:L10-07.png|p.7 Two broad categories — Wired WANs(telephone/cable) 와 Wireless WANs(cellular telephony 4G/5G · satellite networks Starlink/Starshield). 파란 상자 \"Focus of this lecture\" (필기본)|large]]\n\nLAN 에 wired(Ethernet)·wireless(WiFi) 가 있듯 WAN 도 둘로 나뉜다 → [[WAN 분류]].\n{|\n! 분류 || instance || 슬라이드 그림\n|-\n| '''Wired WANs''' || [[telephone network|Telephone networks]] · [[cable network|Cable networks]] || local loop → end offices → trunk → tandem offices → trunk → regional offices\n|-\n| '''Wireless WANs''' || [[cellular telephony|Cellular telephony]] (4G / '''5G''') · [[satellite network|Satellite networks]] ([[Starlink]] / Starshield) || macro BS·femto cell·D2D·M2M 이 섞인 5G 셀 그림, BBC \"How SpaceX satellites are used on the battlefield\"\n|}\n'''이번 강의의 focus 는 Wireless WANs''' (p.7 파란 상자).\n\n[[anim:wan_categories|WAN 이 wired(telephone·cable)와 wireless(cellular·satellite)로 갈라지는 트리를 따라가고, 마지막에 \"이번 강의 focus: wireless WAN\" 을 확인하라]]\n\n== p.8 — 1. Cellular Telephony ==\n{def}\"A '''wireless''' WAN that provides '''any type''' of communication.\" (p.8){/def}\n* any type = '''voice, text, data'''(image, video …) — 필기 그대로. 처음엔 voice 만, 그다음 text, 지금은 모든 종류 → [[cellular telephony]].\n\n== p.9–10 — Cellular system: cell · BS · MS · MSC ⭐⭐ ==\n[[img:L10-10.png|p.10 Cellular system — MS 와 BS 가 있는 cell(노란 육각형) → MSC → PSTN → stationary phone. 필기 \"wired phone도 wireless에 연결 가능\" (필기본)|large]]\n\n{def}\"Each cellular service area is divided into small regions called '''cells''' that consist of: '''Base Station (BS)''' · '''Mobile Station (MS)'''.\" (p.9)\n\"'''Mobile Switching Center (MSC)''' — Coordinates communication between '''all BSs and the central office'''.\" (p.10){/def}\n\n* '''[[cell]]''' — 서비스 지역을 잘게 나눈 작은 영역. 그래서 \"'''cell'''ular\" 다. 그림에서는 육각형.\n* '''[[base station]] (BS)''' — cell 안의 탑. 무선으로 MS 를 서비스하고, 유선으로 MSC 에 붙는다.\n* '''[[mobile station]] (MS)''' — 개별 사용자 기기(스마트폰).\n* '''[[MSC]]''' — 모든 BS 와 (유선 전화망의) central office 사이를 조정. 통화 연결·채널 할당·handoff 판단을 하는 '''두뇌'''.\n* '''[[PSTN]]''' (Public Switched Telephone Network) — MSC 가 붙는 기존 유선 전화망. 그래서 '''유선 전화(stationary phone)와 휴대폰이 서로 통화된다'''(p.10 필기 \"wired phone도 wireless에 연결 가능\").\n\n{tip}'''필기 속 질문: \"BS ↔ AP: Access point (동일 개념??)\"''' (p.9)\n'''역할로는 같은 개념이 맞다.''' 교수도 수업에서 \"The other name of base station could be '''AP, access point'''. … It is the same … '''interchangeable'''\" 라고 했다(🎙 8:26). 둘 다 ① 무선 단말(MS/station)이 붙는 '''고정된 접속점'''이고 ② 뒤쪽은 '''유선 infrastructure'''(BS → MSC, AP → [[mid:distribution system]])에 연결된다.\n다만 '''규모와 표준이 다르다''': AP 는 [[mid:IEEE 802.11]] WiFi 의 [[mid:BSS]] 중심(방·건물 하나, 수십 m), BS 는 cellular 표준(AMPS·GSM·4G…)의 cell 중심(수백 m~수 km). 그리고 셀룰러에는 BS 들 위에 '''MSC''' 라는 지휘소가 있어 handoff 를 '''이음새 없이''' 해 주지만, 802.11 은 BSS 사이 이동의 연속성을 보장하지 않는다 → 자세한 비교는 [[셀룰러와 WiFi 비교]].{/tip}\n\n== p.11 — Operation: Frequency Reuse Principle ⭐⭐⭐ ==\n[[img:L10-11.png|p.11 Frequency Reuse — (a) reuse factor 4, (b) reuse factor 7. 같은 번호 = 같은 frequency set. 필기 \"각 숫자가 frequency 하나\", 이웃한 두 '1' cell 에 ✗ (필기본)|large]]\n\n{def}\"'''Neighboring cells cannot use the same set of frequencies''' for communication — '''Interference''' for the users located near the cell boundaries. A '''frequency reuse pattern''' is a configuration of N cells. '''N is the reuse factor'''.\" (p.11){/def}\n\n* 그림의 숫자 1, 2, 3, … = '''frequency set'''(채널 묶음) 번호. 같은 번호 cell 끼리는 '''절대 붙어 있지 않다'''.\n* (a) N = 4: 4개 cell(1·2·3·4)이 한 패턴, 이 패턴이 바둑판처럼 반복. (b) N = 7: 7개 cell 이 한 패턴(가운데 1, 둘레 2–7).\n* 같은 set 을 쓰는 먼 cell 끼리 남는 약한 간섭 = [[co-channel interference]]. N 이 크면 같은 번호 cell 이 더 멀어져 간섭↓, 대신 cell 하나가 쓸 수 있는 채널 수(전체 ÷ N)↓ → [[reuse factor]].\n\n{tip}'''필기 속 질문: \"각 숫자가 frequency 하나\" / 붙어 있는 두 '1' 육각형에 ✗ \"??\"''' (p.11)\n① 숫자 하나는 주파수 '''한 개'''가 아니라 '''frequency set(주파수 대역, 즉 채널 여러 개의 묶음)''' 하나다. 교수: \"the number represents a '''frequency band''' — you can think of this one as f1, f4, f3, f2\"(🎙 11:37). 그 set 안의 채널들을 cell 안 사용자들이 나눠 쓴다.\n② 같은 번호 cell 두 개가 '''붙어 있으면 안 된다(✗ 가 맞다)'''. 경계에 선 사용자는 두 BS 의 같은 주파수 신호를 동시에 받아 섞이기 때문 — 교수: \"some '''edge devices on the border of cell''' could suffer from interferences from two base stations. It's very difficult to handle\"(🎙 12:15). 그래서 reuse 패턴은 같은 번호 사이에 반드시 다른 번호 cell 을 끼워 놓는다.{/tip}\n\n[[anim:frequency_reuse_hex|이웃 cell 이 같은 주파수를 쓰면 경계에서 ✗ → N=4 패턴 → N=7 패턴 → (예고) IS-95 는 N=1 로 넘어가는 순서를 보고, 같은 색 cell 사이 거리가 N 에 따라 어떻게 변하는지 보라]]\n\n[[sim:reuse_pattern]]\n\n== p.12 — Operation: Transmitting (making a call) ⭐⭐⭐ ==\n[[img:L10-12.png|p.12 Transmitting — MS → BS → MSC → Telephone central office → Called party, ⑦ Voice channel(초록). 필기 \"closest base station\", \"통신을 위해 BS, MSC, central office 등 infrastructure 필요\" (필기본)|large]]\n\n<pre class=\"txt\">\n① MS scans the band and sends the number on the '''strongest setup channel'''\n② BS relays the number to the MSC\n③ MSC forwards it to the telephone central office\n④ Central office connects the called party (if available)\n⑤ Result is relayed back to the MSC\n⑥ MSC assigns an '''unused voice channel'''; MS retunes\n⑦ Communication begins\n<\/pre>\n* ① \"strongest setup channel\" = 보통 '''가장 가까운 BS''' (p.12 필기 \"closest base station\"). 교수: \"'''This is very important — closest one.''' … the strongest channel, which is mostly the closest one\"(🎙 16:10).\n* ④ 상대가 통화 중이면 연결 안 됨(\"if available\").\n* ⑥ MS 는 setup channel 에서 할당받은 voice channel 로 주파수를 '''바꾼다(retunes)'''.\n→ 상세: [[통화 발신 과정]]\n\n[[anim:call_transmit|①–⑦ 을 따라 번호가 MS → BS → MSC → central office → 상대로 가고, 결과가 돌아와 ⑥ voice channel 이 할당되는 순간을 보라]]\n\n== p.13 — Operation: Receiving ⭐⭐⭐ ==\n[[img:L10-13.png|p.13 Receiving — Caller → central office → MSC → ② Paging(빨간 점선이 모든 cell 의 BS 로) → MS ③⑤ / ④⑥ → ⑦ Voice channel. 필기 \"위의 5~6번 과정이랑 다른 거임?\" (필기본)|large]]\n\n<pre class=\"txt\">\n① Central office sends the called number to the MSC\n② MSC sends query signals to '''every cell''' ('''[[paging]]''')\n③ MS responds; its location is found\n④ MSC transmits a ringing signal\n⑤ MS answers\n⑥ MSC assigns a voice channel\n⑦ Communication begins\n<\/pre>\n* 핵심 차이: 발신은 MS 가 '''자기 위치에서''' 시작하지만, 수신은 MSC 가 '''MS 가 어느 cell 에 있는지 모른다''' → 모든 cell 에 query = paging. 교수: \"at this moment, MSC is '''not aware of where the corresponding receiver is located'''\"(🎙 21:39).\n→ 상세: [[통화 수신 과정]] (필기 질문 \"위의 5~6번 과정이랑 다른 거임?\" 은 그 문서에서 답함)\n\n[[anim:call_receive|central office → MSC 다음에 paging 파동이 모든 cell 로 퍼지고, MS 가 응답해 위치가 확인된 뒤에야 ringing → voice channel 로 가는 순서를 보라]]\n\n[[sim:call_flow]]\n\n{|\n! 단계 || 발신 (p.12) || 수신 (p.13)\n|-\n| 시작 || ① MS 가 strongest setup channel 로 번호 송신 || ① central office 가 번호를 MSC 로\n|-\n| 위치 || MS 가 스스로 BS 를 고름 (위치 문제 없음) || ② '''paging''' — 모든 cell 에 query, ③ MS 응답으로 위치 확인\n|-\n| 상대 확인 || ③④ central office 가 상대 연결 (if available), ⑤ 결과가 MSC 로 || ④ ringing signal, ⑤ MS answers\n|-\n| 채널 || ⑥ MSC 가 '''unused voice channel''' 할당, MS retunes || ⑥ MSC 가 voice channel 할당\n|-\n| 끝 || ⑦ Communication begins || ⑦ Communication begins\n|}\n\n== p.14–16 — Operation: Handoff ⭐⭐⭐ ==\n{def}\"Definition: Process of '''transferring an active call from one BS to another''' '''without interrupting service''' as a user moves across cells.\" (p.14)\n\"To this end: '''MSC monitors the level of the signal every few seconds'''. If the strength of the signal diminishes: The MSC '''seeks a new cell''' that can better accommodate the communication. Then it '''changes the channel''' carrying the call.\" (p.15)\n\"'''Hard handoff''' — An MS only communicates '''with one BS'''. Used in '''early systems'''. '''Soft handoff''' — An MS can communicate '''with two BSs at the same time'''.\" (p.16){/def}\n\n[[img:L10-16.png|p.16 Hard handoff(Break before make — BS1 막대가 끝난 뒤 빨간 틈, 그다음 BS2) vs Soft handoff(Make before break — 초록 구간에서 두 막대 겹침). 필기 \"SRT, KTX ??\", \"break off connection ??\" (필기본)|large]]\n\n* 누가? '''MSC''' 가. 언제? '''every few seconds''' 신호 세기를 감시하다가 약해지면. 무엇을? 더 좋은 cell 을 찾아 '''통화를 싣는 채널을 바꾼다'''.\n* [[hard handoff]]: 한 번에 BS 하나 → 옛 BS 를 끊고(break) 새 BS 에 붙음(make). 1G 같은 '''early systems'''. 교수: \"'''nowadays we never use hard handoff'''\"(🎙 29:54).\n* [[soft handoff]]: 잠시 두 BS 와 동시에 통신 → 새 BS 에 먼저 붙고(make) 옛 BS 를 끊음(break). 2G [[IS-95]](CDMA) 부터 → [[IS-95 soft handoff]].\n\n{tip}'''필기 속 질문: \"Hand over (동일 개념)\"''' (p.14) — '''맞다, 같은 개념이다.''' 교수: \"in Korea it is also called hand-over. '''It is interchangeable''' … I prefer hand-off because it is easy to pronounce\"(🎙 26:17). handoff 는 북미식(AMPS·IS-95, Forouzan) 용어, '''handover''' 는 유럽·3GPP 식(GSM·LTE·5G 표준 문서) 용어다. → [[handoff]]{/tip}\n\n{tip}'''필기 속 질문: \"SRT, KTX ??\" (31:00 필기)''' — 교수(🎙 31:17): \"You may have some experience of '''slow communication speed while you are in KTX or SRT'''. This is because the trains are so fast that '''maintaining soft handoff is very difficult technically'''. And the coverage of base stations could be limited to some few kilometers, so it happens a lot … That is why you often experience some breakup of your connection.\" 즉 몇 km 짜리 cell 을 시속 300 km 로 지나면 handoff 가 '''아주 자주''' 일어난다. 그때 handoff 가 늦거나 실패하면 통화가 끊기거나 데이터가 느려진다. 교수는 10/6 (WiFi station mobility) 에서도 \"You may have some experience of disconnected or slow communication while you are in fast transportation such as '''KTX or SRT'''\" 라고 하며, 4G/5G 는 가장 가까운 BS 로 '''seamless''' 하게 넘겨 주는 매우 복잡한 표준(soft handoff)을 갖는다고 했다 → [[mid:station mobility]].{/tip}\n\n{tip}'''필기 속 질문: \"break off connection ??\"''' — \"break before make\" 의 '''break''' 가 바로 \"연결을 끊는다(break off the connection)\"는 뜻이다. Hard handoff 에서는 '''BS1 과의 연결을 먼저 끊고(break), 그다음 BS2 와 연결한다(make)''' → 그림의 빨간 틈 = 아주 짧은 끊김. Soft handoff 는 순서가 반대(make before break)라 틈이 없다 → [[hard handoff]].{/tip}\n\n[[anim:handoff_hard_soft|MS 가 BS1 → BS2 로 이동할 때 위 줄(hard: 막대 사이 빨간 틈)과 아래 줄(soft: 두 막대 겹침)을 비교하라]]\n\n[[sim:handoff_signal]]\n\n{info}슬라이드 순서는 p.14 → 15 → 16 이지만 필기 타임스탬프는 p.14(26:15) → p.16(27:15, 31:00) → p.15(32:30) 이다 — 교수가 \"it is more helpful to firstly see the illustration\"(🎙 26:55)이라며 hard/soft 그림을 먼저 설명하고 \"MSC monitors … every few seconds\" 로 돌아왔다. 그리고 \"'''every transition decision is made by MSC, not by MS'''\"(🎙 33:09).{/info}\n\n== p.17 — Operation: Roaming ⭐⭐ ==\n[[img:L10-17.png|p.17 Roaming — Provider A(home) 의 cell 에서 Provider B(neighbor) 의 cell 로 User moves, MSC A ↔ MSC B 사이 \"Roaming contract\" (필기본)|medium]]\n\n{def}\"A user can have access to communication or can be reached '''where there is coverage'''. A service provider usually has '''limited coverage'''. '''Neighboring service providers''' can provide '''extended coverage''' through a '''roaming contract'''.\" (p.17){/def}\n* handoff = 같은 통신사 안에서 cell → cell, roaming = '''통신사(provider) → 통신사'''. 해외 로밍이 대표적 → [[roaming]].\n\n[[anim:roaming_anim|MS 가 Provider A(home) cell 들을 벗어나 Provider B(neighbor) cell 로 들어갈 때 MSC A ↔ MSC B 사이 roaming contract 선이 켜지며 서비스가 이어지는 것을 보라]]\n\n== 🎙 실제 수업 기록 (10/20 화, 녹음본 기준) ==\n{info}녹음본 `1020_컴네.txt`(73분, whisper 영어 전사) 중 '''0:00 ~ 36:00''' 이 이 문서 범위(p.2–17)다. 36:06 부터는 1G 이후 세대 → [[CH05 1G–2G 셀룰러]]. 전사에서 깨진 용어는 슬라이드 기준으로 복원했다(\"WANN\"=WAN, \"Starship\"=Starlink/Starshield, \"MSG\"/\"MST\"/\"MHC\"=MSC, \"Handle\"/\"handbook\"=handoff, \"frequency review/view spectrum\"=frequency reuse/reuse factor, \"E2\"=D2D, \"PS\"/\"VS\"=BS).{/info}\n\n=== 시작 공지 (0:00~) ===\n* \"I'm planning to '''finish chapter 5 during this week''', and from the next week we'll move on to the third layer, which is the '''network layer''', one of the most important parts.\"\n* 중간고사 범위(physical·data-link 두 계층 + 그 위의 LAN: Ethernet·WiFi·Bluetooth)를 짚고, \"there are upper layers involved in WANs, but today we're going to focus on '''these two'''\" — 오늘도 두 계층으로 WAN 을 본다.\n\n=== WAN recap · 분류 (p.4–7, 1:40~6:00) ===\n* \"One important distinction to LAN is about its '''scale''', the physical scale … WAN is a wider geographical span. '''This is why we call it WAN'''.\" — 이름에서 개념(Wide Area). \"sometimes it spans a town, or a state, or even the world.\"\n* p.4 그림: \"connecting some distant LANs by deploying some point-to-point networks\".\n* \"Like LANs that have wired and wireless instances, WAN also has two broad categories of wired and wireless.\" wired = telephone·cable networks, wireless = cellular telephony·satellite networks.\n* Cellular: 이 방의 거의 모두가 '''5G''' 를 쓴다 — 교수 본인은 아직 4G 인데 불편이 없다며, 4G 도 advanced communication system 의 한 instance 라고.\n* Satellite: Starlink/Starshield 가 중요한 통신 시스템으로 쓰인다(슬라이드 BBC 전장 그림).\n* '''\"In this chapter, I would like to focus on this wireless WANs\"'''. Forouzan 교재는 두 가지 다 다루지만 '''오래된 책이라 4G·5G·Starlink 의 세부가 없다''' → \"I would like to present you about the '''trend of evolution of cellular systems''', then you would understand how 4G, or 5G, or beyond forms.\" (= p.18 이후 세대 파트의 목적)\n\n=== Cellular telephony · 구성 요소 (p.8–10, 6:00~10:20) ===\n* \"Any type means '''voice, text, or data''' … data can contain images, or video\" (p.8 필기와 일치). 처음엔 voice 중심 → text 등으로 확장 → \"Now, we can use all types of communication.\"\n* BS·MS: \"You would be familiar with these terminologies … in our wireless LANs, such as Wi-Fi and Bluetooth. Here, we use the '''same terminologies''' — base station, that serves some managing operations or communication, and mobile station, that represents an '''individual user'''.\"\n* '''\"The other name of base station could be AP, access point. … It is the same … interchangeable.\"''' 이 강의실 천장의 AP 가 \"the station that serves everyone in this room\" 이라고 예를 들었다 (8:26) → p.9 필기 질문 \"AP (동일 개념??)\" 의 답.\n* MSC: \"located in the middle of this illustration … serves to '''coordinate communication between base stations and the central office''' … organizing and managing devices in cellular systems.\" \"There are many different cellular systems, but they '''fundamentally have these kinds of structures'''.\" (9:06)\n* '''강조''': \"I would like to emphasize that '''even a wired phone can be connected to this wireless network'''. This is why we can receive some phone calls from some wired phone. They are physically connected to this cellular system.\" (9:48, p.10 필기)\n\n=== Frequency reuse (p.11, 10:20~14:40) ===\n* \"It looks complicated because it has some '''weird name''', but '''it is very simple'''.\" 무선 통신에는 interference 가 있으니 한 망이 어떤 frequency band 를 쓰면 다른 망은 '''다른 대역이나 다른 time slot''' 을 써야 한다 — 유선과 대비되는 무선의 fundamental property.\n* \"Here '''the number represents a frequency band''' — you can think of this one as f1, f4, f3, f2 …\" (11:37, 슬라이드 위 필기 f1–f4 의 출처). \"The important rule is that '''neighboring cells should use different frequency bands''' to avoid interference between cells.\"\n* \"Suppose that two cells use the same frequency band, then some '''edge devices on the border of cell''' could suffer from interferences from '''two base stations'''. It's very difficult to handle\" (12:15) → p.11 필기 ✗ \"??\" 의 답.\n* 왼쪽 그림: 대역 4 개 → N = 4, 오른쪽(더 큰 망): 7 개 → N = 7. \"Large networks could require larger frequency reuse [factor].\" (14:12)\n\n=== 발신 (p.12, 14:40~21:15) ===\n* 010-… 번호를 누르면 \"under the hood\" 에서: ① \"it firstly scans the frequency band, and sends the phone number to our '''closest base station'''. '''This is very important — closest one.''' In other words, … the '''strongest channel''', which is mostly the closest one.\" (15:53–16:28)\n* ② \"All base stations have their corresponding mobile switching center\" → BS 가 번호를 MSC 로 relay ③ MSC → central office ④ \"connects … if he or she is available\" — 상대가 통화 중이면 안 됨 ⑤ 결과가 MSC 로 ⑥ \"MSC assigns a channel, a '''voice channel, or it can be data channel in current''' cellular systems, and the mobile station '''tunes or switches its frequency band''' to the assigned one\" ⑦ communication begins.\n* '''강조 — infrastructure 의존''' (19:00): \"This connection is '''heavily dependent on the infrastructure'''. … Even if they look like operable without any infrastructure because we access them via wireless, their performance is heavily dependent on this infrastructure. … Without that, those services are almost impossible.\" 그래서 ad-hoc network 상의 무선 통신은 매우 어렵다.\n* 예: '''Ukraine''' 이 최근 미국의 정책 때문에 Starlink/Starshield 연결이 제한돼 데이터 통신과 '''드론 제어'''에 어려움을 겪고 있다 — infrastructure 의 제약이 곧 서비스의 제약 (20:21).\n\n=== 수신 (p.13, 21:15~25:10) ===\n* ① caller 의 central office 가 번호를 MSC 로. ② \"MSC sends query signals to every cell '''because at this moment, MSC is not aware of where the corresponding receiver is located'''.\" \"This is often called '''paging'''. Think about when you are trying to find something in your book, you keep '''forwarding your book pages'''.\" (22:09)\n* ③ MS 가 응답 → \"Now MSC realized that this MS is included in this base station.\" ④ \"MSC transmits a '''ringing signal''', which is a '''control signal''' to make a connection\" ⑤ MS answers ⑥ \"similar to the transmission procedure, MSC assigns a voice channel\".\n* '''다시 강조''': \"This reception is also heavily depending on the existence of infrastructure. '''Without this infrastructure, you cannot make even a single phone call.'''\" \"In cellular system, '''we never communicate device to device'''; we always make a communication via this infrastructure.\"\n* 기기끼리 직접 하는 특수한 통신 = '''D2D(device-to-device)''' — 예: Apple 기기 사이 mirroring. \"'''It is very inefficient''' compared to this infra-using communication.\" (24:13–24:57)\n\n=== Handoff (p.14 → p.16 → p.15, 25:10~33:20) ===\n* \"I think we studied handoff before our midterm\" — 10/6 [[mid:station mobility]] 에서 언급.\n* (26:17) \"This is handoff; in Korea it is also called '''hand-over'''. '''It is interchangeable''', hand-over or hand-off, but I prefer hand-off because it is easy to pronounce.\" → p.14 필기 \"Hand over (동일 개념)\" 확인.\n* \"It is more helpful to firstly see the illustration\" — 그래서 p.16 그림을 먼저 설명(필기 타임스탬프 p.14 26:15 → p.16 27:15 → p.15 32:30 와 일치). 질문: \"how we can experience '''contiguous seamless communication''' without any interruptions while moving around?\" → handoff 가 그것을 구현.\n* '''Hard handoff''' (28:02): \"if this mobile station moves from BS1 to BS2, then it firstly '''experiences a break of communication'''. … because in these cellular systems, MS can only communicate with one base station … it is '''inevitable''' … this is not that great. … often used in some early systems.\"\n* '''\"But nowadays, we never use hard handoff. In today's advanced communication systems, people always implement soft handoff\"''' (29:54) — MS 가 \"more than one BS at the same time\" 와 통신. 경계 지역에서 두 BS 와 연결을 맺어 두고, 전환이 일어나면 BS1 과의 채널을 끊는다. \"It is very hard to detect or experience some break of communication … almost agnostic to people.\"\n* '''KTX·SRT''' (31:17): \"You may have some experience of '''slow communication speed while you are in KTX or SRT'''. This is because the trains are so fast that '''maintaining soft handoff is very difficult technically'''. And the coverage of base stations could be limited to '''some few kilometers''', so it happens a lot when you are in some fast transportation. That is why you often experience some breakup of your connection.\" → p.16 필기 \"SRT, KTX ??\" 의 답.\n* p.15 (32:29): \"MSC monitors the signal level of each MS every few seconds … if the strength diminishes, MSC finds a new cell that can better serve … and changes the channel.\" '''\"Every transition decision is made by mobile switching center, not by mobile station.\"''' (33:09) ← 시험 포인트.\n\n=== Roaming (p.17, 33:23~36:00) ===\n* \"Everyone would have heard about roaming because we have to rely upon this one when we are about to '''travel'''.\"\n* home → neighbor 이동: neighbor 는 다른 service provider — \"instances of service provider can be '''LG U+, SK Telecom''' or AT&T\". \"Even if … under different service providers, we can enjoy our communication if they have some '''roaming contract'''. You can use the infra of another service provider.\"\n* 그래서 해외에서도 폰을 쓴다 — \"almost every big service provider has their roaming contract. All you have to do is just switching … or installing some '''eSIM''' … but some communication speed or efficiency could differ from your own network.\"\n* 36:06 \"From now on, I would like to present some specific cellular systems starting from the '''first generation'''\" → [[CH05 1G–2G 셀룰러]].\n\n== 시험 대비 핵심 요약 ==\n# '''WAN''' = LAN 보다 wider geographical span(town·state·country·world). 분류: '''Wired'''(telephone networks, cable networks) / '''Wireless'''(cellular telephony 4G/5G, satellite networks Starlink/Starshield). 이번 강의 focus = '''wireless WAN'''.\n# '''Cellular telephony''' = \"a wireless WAN that provides any type of communication\"(voice·text·data).\n# 서비스 지역 → '''cells''', 각 cell = '''BS + MS'''. '''MSC''' = \"coordinates communication between all BSs and the central office\". MSC 는 '''PSTN''' 에 연결 → 유선 전화와도 통화.\n# '''Frequency reuse''': \"Neighboring cells cannot use the same set of frequencies\" (경계 사용자 interference). 패턴 = N cells, '''N = reuse factor''' (그림 4, 7). N↑ → 간섭↓, cell 당 채널↓.\n# '''발신''': ① strongest setup channel(≈closest BS)로 번호 → ② BS→MSC → ③ MSC→central office → ④ 상대 연결(if available) → ⑤ 결과→MSC → ⑥ '''unused voice channel''' 할당, MS retunes → ⑦ 통화.\n# '''수신''': ① central office→MSC → ② '''paging'''(모든 cell 에 query; MSC 는 위치를 모름) → ③ MS 응답·위치 확인 → ④ ringing → ⑤ MS answers → ⑥ voice channel → ⑦ 통화.\n# '''Handoff''' = active call 을 BS → BS 로 \"without interrupting service\". '''MSC 가 every few seconds 신호 세기 감시''' → 약해지면 새 cell 탐색 → 채널 변경.\n# '''Hard handoff''' = MS 가 '''한 BS 와만''', early systems, '''break before make'''. '''Soft handoff''' = '''두 BS 와 동시에''', '''make before break'''.\n# '''Roaming''' = 통신사 coverage 는 제한적 → 이웃 통신사가 '''roaming contract''' 로 extended coverage.\n# 교수 강조: 셀룰러 통신은 '''infrastructure(BS·MSC·central office)에 heavily dependent''' — \"without this infrastructure, you cannot make even a single phone call\". 기기끼리 직접(D2D)은 비효율적.\n# 교수 강조: handoff 결정은 '''MSC''' 가 한다(MS 가 아님). 요즘 시스템은 '''항상 soft handoff'''.\n\n== 관련 문서 ==\n* 구조: [[WAN 분류]] · [[cellular telephony]] · [[cell]] · [[base station]] · [[mobile station]] · [[MSC]] · [[PSTN]] · [[uplink와 downlink]]\n* 동작: [[frequency reuse]] · [[reuse factor]] · [[co-channel interference]] · [[통화 발신 과정]] · [[통화 수신 과정]] · [[paging]] · [[handoff]] · [[hard handoff]] · [[soft handoff]] · [[roaming]]\n* 다른 WAN: [[telephone network]] · [[cable network]] · [[satellite network]] · [[Starlink]]\n* 비교: [[셀룰러와 WiFi 비교]] · [[mid:station mobility]] · [[mid:BSS]]\n* 다음: [[CH05 1G–2G 셀룰러]] → [[CH05 IS-95·3G·4G]] · [[셀룰러 세대]]"

 "WAN 분류": {

  "body": "'''WAN 분류''' 는 L10 p.5–7 의 \"'''Two broad categories'''\" 다. [[mid:LAN|LAN]] 에 유선(Ethernet)과 무선(WiFi·Bluetooth)이 있듯, [[mid:WAN|WAN]] 도 '''Wired WANs''' 와 '''Wireless WANs''' 두 갈래로 나뉜다. 이번 강의(CH05)의 focus 는 '''Wireless WANs''' 다.\n\n{def}\"Two broad categories — '''Wired WANs''': Telephone networks · Cable networks. '''Wireless WANs''': Cellular telephony (4G / 5G cellular systems) · Satellite Networks (Starlink / Starshield). — '''Focus of this lecture''' (Wireless WANs).\" (p.5–7)\n두 큰 분류 — 유선 WAN: 전화망·케이블망. 무선 WAN: 셀룰러(4G/5G)·위성망(Starlink/Starshield). 이번 강의는 무선 WAN.{/def}\n\n[[img:L10-07.png|p.7 Two broad categories — 왼쪽 위 telephone network 계층 그림, 가운데 5G 셀 그림, 오른쪽 BBC \"How SpaceX satellites are used on the battlefield\" (필기본)|large]]\n\n== 이름에서 개념 끌어내기 ==\n* '''WAN''' = '''W'''ide '''A'''rea '''N'''etwork. 교수: \"One important distinction to LAN is about its '''scale''' … WAN is a wider geographical span. '''This is why we call it WAN'''.\" (p.4 \"spanning a town, a state, a country, or even the world\")\n* 분류 기준은 '''전송 매체''' — 선(구리선·동축·광섬유)이냐, 전파(지상 BS·위성)냐.\n\n{|\n! 분류 || instance || 매체 / 그림 || 문서\n|-\n| Wired || Telephone networks || local loop → end office → trunk → tandem office → trunk → regional office || [[telephone network]]\n|-\n| Wired || Cable networks || (원래 TV 용) 동축·광섬유 || [[cable network]]\n|-\n| Wireless || Cellular telephony (4G / 5G) || 육각 cell 마다 BS || [[cellular telephony]] · [[CH05 셀룰러 동작]]\n|-\n| Wireless || Satellite networks (Starlink / Starshield) || 궤도 위성 || [[satellite network]] · [[Starlink]]\n|}\n\n[[anim:wan_categories|WAN 이 wired·wireless 로, 다시 telephone·cable / cellular·satellite 로 갈라지는 트리를 따라가라]]\n\n{analogy}🎭 '''도시 간 이동 수단.''' 고속도로·철도처럼 '''깔아 둔 길'''을 따라가는 방법(wired: 전화선, 케이블)과, 비행기·드론처럼 '''하늘로''' 가는 방법(wireless: 기지국 전파, 위성)이 있다. 어느 쪽이든 목적은 '''멀리 떨어진 동네(LAN)들을 잇는 것'''이다.{/analogy}\n\n{exam}🎯 교수(10/20): \"Like LANs that have wired and wireless instances, WAN also has two broad categories of wired and wireless.\" / \"In this chapter, I would like to '''focus on this wireless WANs'''.\" Forouzan 은 두 가지 다 다루지만 오래된 책이라 4G·5G·Starlink 세부가 없어서, 교수는 '''셀룰러 시스템의 진화 흐름'''을 보여 주겠다고 했다 → [[셀룰러 세대]].{/exam}\n\n{quiz}Wireless WAN 의 두 instance 를 슬라이드 표현대로 쓰시오. Wired WAN 은?{/quiz}\n{answer}Wireless: '''Cellular telephony'''(4G/5G cellular systems), '''Satellite networks'''(Starlink/Starshield). Wired: '''Telephone networks''', '''Cable networks''' (p.6–7).{/answer}\n\n== 관련 문서 ==\n* [[CH05 셀룰러 동작]] · [[cellular telephony]] · [[satellite network]] · [[telephone network]] · [[cable network]]\n* [[mid:WAN]] · [[mid:LAN]] · [[mid:point-to-point]]"

  "body": "'''Telephone network''' 는 [[WAN 분류|Wired WAN]] 의 첫 번째 instance 다. 원래 '''음성'''을 나르려고 100 년 넘게 깔아 온 유선 전화망이고, 슬라이드 p.5–7 오른쪽 위 그림이 그 계층 구조(local loop → end offices → trunk → tandem offices → trunk → regional offices)를 보여 준다. 셀룰러망의 [[MSC]] 가 연결되는 '''[[PSTN]]''' 이 바로 이것이다.\n\n{def}\"Wired WANs — '''Telephone networks''' · Cable networks.\" (p.5) 그림 라벨: \"'''Local loop''' · '''End offices''' · '''Trunk''' · '''Tandem offices''' · '''Regional offices'''\".\n유선 WAN 의 하나인 전화망. 가입자 전화는 local loop 로 end office 에, office 들끼리는 trunk 로 계층적으로 연결된다.{/def}\n\n[[img:L10-05.png|p.5 Wired WANs — Telephone networks 그림: 전화기들 →(Local loop)→ End offices →(Trunk)→ Tandem offices →(Trunk)→ Regional offices|medium]]\n\n== 이름에서 개념 끌어내기 (그림의 라벨 읽기) ==\n{|\n! 라벨 || 뜻\n|-\n| '''Local loop''' || 가입자 전화기와 가장 가까운 전화국(end office)을 잇는 선. 집마다 하나씩 \"고리(loop)\" 처럼 나가는 구리선\n|-\n| '''End office''' || 가입자가 직접 붙는 동네 전화국(= central office). 셀룰러 슬라이드 p.12–13 의 '''telephone central office''' 가 이 자리\n|-\n| '''Trunk''' || 전화국과 전화국 사이 굵은 간선. 여러 통화를 [[mid:multiplexing|multiplexing]] 해서 한꺼번에 나름 (나무의 '''줄기''')\n|-\n| '''Tandem office''' || end office 들 사이를 중계하는 교환국 (\"tandem\" = 앞뒤로 이어서)\n|-\n| '''Regional office''' || 지역 단위 최상위 교환국. 그림에서 가장 큰 원\n|}\n* 계층이 올라갈수록 원이 커진다 — 더 많은 통화를 모아서 처리한다는 뜻.\n* (Forouzan 보충 — 슬라이드에 없음) 전화망은 원래 '''circuit-switched'''(통화 동안 경로 하나를 독점)이고 음성 대역(약 4 kHz)용이다. 데이터를 싣기 위해 dial-up modem, DSL 이 나왔다 → [[circuit switching과 packet switching]].\n\n{analogy}🎭 '''강의 지류와 본류.''' 집집마다 나온 작은 시냇물(local loop)이 동네 저수지(end office)에 모이고, 굵은 강(trunk)을 따라 중계 댐(tandem office)을 거쳐 큰 호수(regional office)로 간다. 물(통화)이 많이 모일수록 강폭이 넓어진다.{/analogy}\n\n{info}셀룰러와의 관계: 휴대폰 통화도 결국 [[MSC]] 를 거쳐 이 유선 전화망([[PSTN]])의 central office 로 들어간다(p.12 ③). 그래서 '''유선 전화(stationary phone)와 휴대폰이 서로 통화된다'''(p.10 필기 \"wired phone도 wireless에 연결 가능\").{/info}\n\n== 관련 문서 ==\n* [[PSTN]] · [[WAN 분류]] · [[cable network]] · [[통화 발신 과정]] · [[MSC]]\n* [[mid:multiplexing]] · [[mid:TDM]]"

  "body": "'''Cable network''' 는 [[WAN 분류|Wired WAN]] 의 두 번째 instance 다. 슬라이드(p.5–7)에는 이름만 나오고 그림·설명은 없다 — 이번 강의의 focus 는 wireless WAN 이라 넘어갔다. 아래 설명은 '''(Forouzan 보충 — 슬라이드에 없음)'''.\n\n{def}\"Wired WANs — Telephone networks · '''Cable networks'''.\" (p.5)\n유선 WAN 의 하나인 케이블망. 원래 케이블 TV 방송을 나르던 동축 케이블망을 양방향 데이터망으로 쓴다.{/def}\n\n== 이름에서 개념 끌어내기 ==\n* '''cable''' = 케이블 '''TV''' 의 그 케이블(동축 케이블, coaxial cable). 전화망이 \"음성\"용으로 태어났다면, 케이블망은 \"'''TV 방송'''\"용으로 태어났다.\n* 그래서 원래는 '''한 방향'''(방송국 → 집)이었다. 데이터(인터넷)를 싣기 위해 양방향으로 바꾼 것이 오늘날의 케이블 인터넷.\n\n{|\n! || [[telephone network]] || cable network\n|-\n| 원래 목적 || 음성 통화 (양방향, 1:1) || TV 방송 (단방향, 1:다)\n|-\n| 매체 || 꼬임쌍선(local loop) || 동축 케이블 (+ 광섬유)\n|-\n| 대역폭 || 좁음 (음성 대역) || 넓음 (TV 채널 수백 개)\n|-\n| 데이터용 기술 (보충) || dial-up modem, DSL || cable modem (DOCSIS)\n|}\n\n* (Forouzan 보충) 1세대는 전부 동축 케이블이었고, 2세대 '''HFC(Hybrid Fiber-Coaxial)''' 는 방송국(head end)에서 동네까지는 광섬유, 동네에서 집까지만 동축을 쓴다. 넓은 대역을 [[mid:FDM]] 으로 잘라 TV 채널·하향 데이터·상향 데이터에 나눠 준다.\n\n{analogy}🎭 '''원래 수도관이던 것을 양방향 파이프로 개조.''' 정수장(방송국)에서 집으로만 물(TV 신호)을 보내던 굵은 관에, 집에서 위로 올려 보내는 가는 관을 덧붙여 양쪽으로 쓰게 만든 것이 케이블 인터넷이다.{/analogy}\n\n== 관련 문서 ==\n* [[WAN 분류]] · [[telephone network]] · [[CH05 셀룰러 동작]]\n* [[mid:FDM]] · [[mid:bandwidth]]"
 },

  "body": "'''Satellite network''' 는 [[WAN 분류|Wireless WAN]] 의 두 번째 instance 다. 지상 BS 대신 '''궤도 위의 위성'''이 중계기 역할을 한다. 슬라이드(p.6–7)의 예는 '''[[Starlink]] / Starshield''' 이고, 오른쪽 BBC 그림 \"How SpaceX satellites are used on the battlefield\" 가 전장에서의 쓰임을 보여 준다.\n\n{def}\"Wireless WANs — Cellular telephony · '''Satellite Networks''' — Starlink / Starshield.\" (p.6–7)\n무선 WAN 의 하나인 위성망. 예: SpaceX 의 Starlink(민간) / Starshield(정부·군용).{/def}\n\n[[img:L10-06.png|p.6 Wireless WANs — Cellular telephony(4G/5G), Satellite Networks(Starlink). 오른쪽 BBC 그림: ① 정찰 드론이 적 전차 위치 전송 → Starlink/Starshield → ② 지휘소가 부대에 알림 → ③ 드론 조종사가 공격 드론 조종 (필기본)|large]]\n\n== 이름에서 개념 끌어내기 ==\n* '''satellite''' = 위성. 기지국을 '''하늘 위에''' 띄워 놓은 셀룰러라고 생각하면 된다. 위성 하나의 커버리지(footprint)는 지상 cell 보다 훨씬 넓다.\n* 지상 infrastructure(BS·유선망)가 없거나 파괴된 곳 — 바다, 사막, 산간, '''전쟁터''' — 에서 강하다.\n\n(Forouzan 보충 — 슬라이드에 없음) 궤도 높이로 셋으로 나눈다:\n{|\n! 궤도 || 고도(대략) || 특징\n|-\n| GEO (Geostationary) || 약 35,786 km || 지구 자전과 같이 돌아 하늘에 '''멈춰 보임'''. 3 개면 지구 거의 전체. 대신 거리가 멀어 지연이 큼\n|-\n| MEO (Medium) || 수천~2 만 km || GPS 위성이 여기\n|-\n| LEO (Low) || 수백~2,000 km || 가깝다 → 지연 작음. 대신 빨리 지나가므로 '''위성 수천 개'''가 필요하고 위성 사이 handoff 가 계속 일어남. '''Starlink 가 LEO'''\n|}\n\n{info}교수(10/20 녹음 19:00–21:04)는 발신 절차 뒤에 \"wireless communications … are '''heavily dependent on this infrastructure'''\" 라고 강조하며, '''Ukraine''' 이 최근 미국의 정책 때문에 Starlink/Starshield 연결이 제한돼 데이터 통신과 '''드론 제어'''에 어려움을 겪는다는 예를 들었다. 슬라이드 BBC 그림(드론-위성-지휘소)과 같은 맥락이다.{/info}\n\n{analogy}🎭 '''아주 높은 곳에 세운 기지국 탑.''' 셀룰러 BS 가 동네 언덕 위 확성기라면, 위성은 성층권보다 훨씬 위에 띄운 확성기다. 한 번에 넓은 지역에 들리지만, 멀어서 말이 도착하는 데 시간이 걸린다(지연).{/analogy}\n\n\n== 관련 문서 ==\n* [[Starlink]] · [[WAN 분류]] · [[cellular telephony]] · [[handoff]]\n* [[mid:WAN]]"
 },
 "Starlink": {
  "title": "Starlink / Starshield (SpaceX 위성망)",
  "category": [
   "1강 셀룰러 동작",

  ],
  "body": "'''Starlink''' 는 SpaceX 가 운영하는 저궤도(LEO) [[satellite network]] 다. 슬라이드 p.6 은 Satellite Networks 의 예로 \"'''Starlink'''\" 를, p.7 은 \"'''Starlink / Starshield'''\" 를 적었다. '''Starshield''' 는 같은 기술의 정부·군용 버전이다. 슬라이드에는 이름과 BBC 그림만 있고, 아래 수치는 '''(일반 보충 — 슬라이드에 없음)'''.\n\n{def}\"Satellite Networks — '''Starlink''' / '''Starshield'''.\" (p.6–7)\nBBC 그림 제목: \"How SpaceX satellites are used on the battlefield\" — ① Spotter drone sends location of enemy tank ② Command centre alerts battlefield unit (Starlink/Starshield 경유) ③ Drone operator flies killer drone to target.{/def}\n\n[[img:L10-07.png|p.7 오른쪽 BBC 그림 — 드론 → Starlink/Starshield → 지휘소 → 부대. Satellite Networks 의 예 (필기본)|medium]]\n\n== 이름에서 개념 끌어내기 ==\n* '''Star + link''' — 별(하늘의 위성)들로 만든 연결. 수천 개의 작은 위성이 '''별자리(constellation)'''처럼 하늘을 덮는다.\n* '''Star + shield''' — 방패. 군·정부용(보안 강화) 버전이라 shield.\n* 녹음 전사에는 \"Starship\"(SpaceX 로켓 이름)으로 깨져 있지만, 슬라이드 기준으로 '''Starlink/Starshield''' 다.\n\n(보충) 특징\n* 고도 약 550 km 의 '''LEO''' — GEO(약 36,000 km)보다 수십 배 가까워 지연이 짧다.\n* 위성이 빠르게 지나가므로 사용자 단말은 몇 분마다 다른 위성으로 넘어간다 — 셀룰러의 [[handoff]] 를 하늘에서 하는 셈.\n* 지상 infrastructure 가 없거나 파괴된 곳에서도 접속이 된다 → 전쟁·재난 지역.\n\n{info}교수(10/20 녹음 19:00–21:04)는 발신 절차 뒤에 \"wireless communications … are '''heavily dependent on this infrastructure'''\" 라고 강조하며, '''Ukraine''' 이 최근 미국의 정책 때문에 Starlink/Starshield 연결이 제한돼 데이터 통신과 '''드론 제어'''에 어려움을 겪는다는 예를 들었다. 슬라이드 BBC 그림(드론-위성-지휘소)과 같은 맥락이다.{/info}\n\n{analogy}🎭 '''하늘을 지나가는 기지국 행렬.''' 셀룰러는 기지국이 땅에 고정되고 내가 움직이지만, Starlink 는 '''기지국(위성)이 머리 위를 줄지어 지나간다'''. 한 위성이 지평선 너머로 사라지기 전에 다음 위성이 와서 통신을 이어받는다.{/analogy}\n\n\n== 관련 문서 ==\n* [[satellite network]] · [[WAN 분류]] · [[handoff]] · [[CH05 셀룰러 동작]]"
 },
 "cellular telephony": {
  "title": "Cellular Telephony (셀룰러 이동통신)",
  "category": [
   "1강 셀룰러 동작",
   "용어"
  ],
  "body": "'''Cellular telephony''' 는 서비스 지역을 '''[[cell]]''' 로 나누고 cell 마다 [[base station]] 을 둔 '''무선 WAN''' 이다. 슬라이드 p.8 의 섹션 제목 \"'''1. Cellular Telephony'''\" 이고, 4G·5G 휴대폰망이 모두 여기에 속한다. 구조는 cell(BS + MS) → [[MSC]] → [[PSTN]].\n\n{def}\"1. Cellular Telephony — A '''wireless''' WAN that provides '''any type''' of communication.\" (p.8)\n\"Each cellular service area is divided into small regions called '''cells''' that consist of: Base Station (BS) · Mobile Station (MS). '''Mobile Switching Center (MSC)''' — Coordinates communication between all BSs and the central office.\" (p.9–10)\n어떤 종류의 통신이든 제공하는 무선 WAN. 서비스 지역을 cell 로 나누고, 각 cell 은 BS 와 MS 로, BS 들은 MSC 가 조정한다.{/def}\n\n[[img:L10-08.png|p.8 1. Cellular Telephony — \"any type\" 아래 필기: voice / text / data{image, video, …} (필기본)|medium]]\n\n== 이름에서 개념 끌어내기 ==\n* '''cellular''' = '''cell''' 로 이루어진. 넓은 지역을 하나의 큰 송신탑으로 덮지 않고 '''작은 cell 여러 개'''로 쪼갠다 — 그래야 같은 주파수를 멀리 떨어진 cell 에서 다시 쓸 수 있다([[frequency reuse]]).\n* '''telephony''' = 전화(음성). 이름에 \"전화\"가 남은 것은 처음엔 '''voice''' 만 했기 때문이다. 지금은 \"any type\" — 필기 그대로 '''voice, text, data(image, video, …)'''.\n* 교수(10/20): \"In the first time, the communications were focused on '''voice''', and it was expanded to '''text''' … Now, we can use '''all types''' of communication.\" → 이 확장이 곧 세대의 역사 → [[셀룰러 세대]].\n\n[[anim:cellular_architecture|cell → BS·MS → MSC → PSTN → stationary phone 순서로 셀룰러의 구성 요소가 등장하는 것을 보라]]\n\n{|\n! 구성 요소 || 역할 || 문서\n|-\n| cell || 서비스 지역을 나눈 작은 영역 (육각형) || [[cell]]\n|-\n| BS || cell 의 탑. 무선으로 MS, 유선으로 MSC || [[base station]]\n|-\n| MS || 사용자 기기 || [[mobile station]]\n|-\n| MSC || 모든 BS ↔ central office 조정 || [[MSC]]\n|-\n| PSTN || MSC 가 붙는 유선 전화망 || [[PSTN]]\n|}\n\n동작: [[frequency reuse]] · [[통화 발신 과정]] · [[통화 수신 과정]] · [[handoff]] · [[roaming]] — 전부 [[CH05 셀룰러 동작]] 에.\n\n{analogy}🎭 '''벌집.''' 넓은 판을 육각형 방(cell)으로 빽빽하게 나누고, 방마다 일벌(BS)이 한 마리씩 지킨다. 여왕벌(MSC)이 모든 방을 지휘한다. 방이 작을수록 같은 \"꿀(주파수)\"을 먼 방에서 또 쓸 수 있다.{/analogy}\n\n{quiz}슬라이드의 cellular telephony 정의를 쓰고, \"any type\" 이 무엇을 뜻하는지 쓰시오.{/quiz}\n{answer}\"A '''wireless WAN''' that provides '''any type of communication'''.\" (p.8) — any type = voice, text, data(image, video 등). 처음엔 voice 에서 시작해 확장됐다.{/answer}\n\n== 관련 문서 ==\n* [[CH05 셀룰러 동작]] · [[cell]] · [[base station]] · [[mobile station]] · [[MSC]] · [[PSTN]]\n* [[WAN 분류]] · [[셀룰러 세대]] · [[셀룰러와 WiFi 비교]]"
 },
 "cell": {
  "title": "Cell (셀)",
  "category": [
   "1강 셀룰러 동작",
   "용어"
  ],
  "body": "'''Cell''' 은 셀룰러 서비스 지역을 잘게 나눈 '''작은 영역'''이다. 각 cell 에는 [[base station]](BS) 하나와 그 안의 [[mobile station]](MS)들이 있다. 그림에서는 '''육각형'''으로 그린다. L10 p.9.\n\n{def}\"Each cellular service area is divided into '''small regions called cells''' that consist of: Base Station (BS) · Mobile Station (MS).\" (p.9)\n셀룰러 서비스 지역은 cell 이라는 작은 영역들로 나뉘고, 각 cell 은 BS 와 MS 로 구성된다.{/def}\n\n[[img:L10-09.png|p.9 Cellular system — 노란 육각형 Cell 안에 BS(탑)와 MS(폰), BS 는 MSC 에 유선 연결. 필기 \"AP: Access point (동일 개념??)\" (필기본)|medium]]\n\n== 이름에서 개념 끌어내기 ==\n* '''cell''' = 세포, 벌집의 방. 큰 몸(서비스 지역)을 이루는 '''작은 단위'''. 여기서 \"'''cell'''ular\" 라는 이름이 나왔다.\n* 왜 '''육각형'''? 원은 빈틈 없이 깔 수 없고, 정사각형은 꼭짓점 쪽이 BS 에서 너무 멀다. 육각형은 빈틈 없이 깔리면서 원에 가장 가깝다(실제 전파 범위는 대략 원). 그림의 관례이고 실제 cell 은 지형 따라 찌그러져 있다.\n* 왜 작게 나누나? 각 cell 의 BS 출력을 낮추고, 같은 주파수를 '''떨어진 cell 에서 다시 쓸 수 있게''' — [[frequency reuse]]. cell 이 작을수록 같은 주파수를 더 여러 번 재사용 → 수용 인원↑.\n\n{|\n! || cell (셀룰러) || [[mid:BSS|BSS]] (WiFi)\n|-\n| 중심 장비 || [[base station]] || AP (access point)\n|-\n| 크기 (대략) || 수백 m ~ 수 km || 수십 m (방·건물)\n|-\n| 이웃과의 관계 || 이웃 cell 은 다른 frequency set ([[reuse factor]] 패턴) || 겹치는 BSS 는 다른 채널을 고르는 것이 관례\n|-\n| 경계를 넘으면 || MSC 가 [[handoff]] || [[mid:station mobility|BSS-transition]] — 연속성 보장 안 함\n|}\n→ [[셀룰러와 WiFi 비교]]\n\n{analogy}🎭 '''학교의 반 편성.''' 전교생(서비스 지역의 사용자)을 반(cell)으로 나누고 반마다 담임(BS)을 배정한다. 학생(MS)은 자기 반 담임에게만 말한다. 학년주임(MSC)이 모든 담임을 조정한다. 전학(cell 이동)하면 담임이 바뀐다(handoff).{/analogy}\n\n[[anim:frequency_reuse_hex|육각 cell 이 바둑판처럼 깔리고, 이웃 cell 끼리 같은 주파수를 쓰면 경계에서 간섭이 생기는 장면부터 보라]]\n\n== 관련 문서 ==\n* [[cellular telephony]] · [[base station]] · [[mobile station]] · [[frequency reuse]] · [[handoff]]\n* [[셀룰러와 WiFi 비교]] · [[mid:BSS]]"
 },
 "base station": {
  "title": "Base Station (BS, 기지국)",
  "category": [
   "1강 셀룰러 동작",
   "용어"
  ],
  "body": "'''Base station(BS)''' 은 각 [[cell]] 안에 있는 고정된 송수신 탑이다. cell 안의 [[mobile station]](MS)과는 '''무선'''으로, [[MSC]] 와는 '''유선'''으로 연결된다. 즉 무선 구간과 유선 infrastructure 를 잇는 '''경계 장비'''다. L10 p.9–13.\n\n{def}\"Each cellular service area is divided into small regions called cells that consist of: '''Base Station (BS)''' · Mobile Station (MS).\" (p.9)\n\"② '''BS relays the number to the MSC'''\" (p.12, 발신)\n각 cell 은 BS 와 MS 로 구성된다. BS 는 MS 에게서 받은 것을 MSC 로 중계한다.{/def}\n\n[[img:L10-09.png|p.9 Cell 안의 BS(탑)와 MS — BS 는 MSC 에 유선으로 연결. 필기 \"Base Station (BS) ↔ AP: Access point (동일 개념??)\" (필기본)|medium]]\n\n== 이름에서 개념 끌어내기 ==\n* '''base''' = 기지(基地). 움직이는 MS 와 달리 '''한 자리에 고정된 근거지'''. '''station''' = 통신하는 장치(802.11·Bluetooth 에서도 쓴 그 station).\n* 그래서 \"고정된 station(BS)\" ↔ \"움직이는 station(MS)\" 의 짝이다.\n\n하는 일 (슬라이드에서 BS 가 등장하는 자리)\n* 발신 ②: MS 가 보낸 번호를 '''MSC 로 relay''' (p.12). MS 는 \"strongest setup channel\" = 보통 '''가장 가까운 BS'''(필기 \"closest base station\")를 고른다.\n* 수신 ②: MSC 의 paging query 를 '''자기 cell 에 방송''' (p.13 빨간 점선이 모든 BS 로).\n* handoff: 통화가 BS1 → BS2 로 넘어감 (p.14–16).\n* BS 자체는 판단하지 않는다 — 채널 할당·handoff 결정은 '''[[MSC]]''' 의 몫.\n\n{tip}'''필기 속 질문: \"Base Station (BS) ↔ AP: Access point (동일 개념??)\"''' (p.9)\n'''역할은 같다'''. 둘 다 무선 단말이 붙는 고정 접속점이고, 뒤쪽은 유선망(BS → MSC / AP → [[mid:distribution system]])에 연결된다. 교수도 \"The other name of base station could be '''AP, access point'''. … It is the same … '''interchangeable'''\" 이라며 강의실 천장의 AP 를 \"the station that serves everyone in this room\" 이라고 가리켰다(10/20 녹음 8:26).\n'''다른 점''': ① 표준 — AP 는 [[mid:IEEE 802.11]], BS 는 셀룰러(AMPS·GSM·IS-95·4G…). ② 범위 — AP 는 방·건물(수십 m), BS 는 수백 m~수 km. ③ 상위 지휘소 — BS 위에는 '''MSC''' 가 있어 이동 중 handoff 를 '''이음새 없이''' 해 주지만, 802.11 은 BSS 사이 이동의 연속성을 보장하지 않는다([[mid:station mobility]]). ④ 주파수 — 셀룰러는 면허 대역을 [[frequency reuse]] 로 계획 배치, WiFi 는 비면허 ISM 대역을 [[mid:CSMA/CA]] 로 경쟁. → [[셀룰러와 WiFi 비교]]{/tip}\n\n{analogy}🎭 '''동네 우체국 창구.''' 주민(MS)은 가장 가까운 창구(BS)에 편지를 낸다. 창구 직원은 내용을 판단하지 않고 본부(MSC)로 넘긴다. 어느 창구가 맡을지, 이사 가면 어디로 넘길지는 본부가 정한다.{/analogy}\n\n[[anim:cellular_architecture|각 cell 에 BS 가 서고, BS 들이 유선으로 MSC 에 모이는 장면을 보라]]\n\n== 관련 문서 ==\n* [[cell]] · [[mobile station]] · [[MSC]] · [[handoff]] · [[uplink와 downlink]]\n* [[셀룰러와 WiFi 비교]] · [[mid:BSS]] · [[mid:distribution system]]"
 },
