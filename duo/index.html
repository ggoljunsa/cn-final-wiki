s":["receive window와 rwnd"],"prof":true,"introCard":1},{"id":"u10g-09","type":"num","q":"지난 ACK (ackNo 4,001, rwnd 2,000). 새 ACK ackNo 가 5,001 이면 shrink 를 피하는 최소 rwnd 는?","answer":1000,"unit":"B","tol":0,"explain":"옛 오른쪽 벽 4,001 + 2,000 = 6,001. 5,001 + rwnd ≥ 6,001 → **1,000**.","src":"PS2 유형 · 11/24 과제","wiki":"send window","tags":["send window"],"prof":true,"introCard":1},{"id":"u10g-10","type":"mc","q":"400 B segment seq 2,001 · 2,401 · 2,801 · 3,201 · 3,601 중 2,401 만 사라졌다. sender 는 언제 재전송하나?","choices":["2,801 의 ACK 를 받자마자","3,201 의 ACK(둘째 duplicate)를 받고","3,601 의 ACK(셋째 duplicate 2,401)를 받고","time-out 때만"],"answer":2,"explain":"ACK 는 2,401(원래) → 2,401 dup1(2,801) → dup2(3,201) → dup3(3,601). 원래 + 같은 것 3 개 = **셋째 duplicate** 에서 fast retransmission. 재전송이 도착하면 ACK 4,001.","src":"PS2 유형 · 11/24 과제","wiki":"RTO와 fast retransmission","tags":["RTO와 fast retransmission"],"prof":true,"introCard":1},{"id":"u10g-11","type":"num","q":"ssthresh 12, cwnd 1 로 시작(slow start 는 ssthresh 를 넘지 않음). RTT 1 의 cwnd 를 1 로 셀 때 RTT 7 의 cwnd 는?","answer":14,"unit":"MSS","tol":0,"explain":"1, 2, 4, 8, 12(ssthresh 에서 멈춤), 13, **14**.","src":"PS2 유형 · 11/24 과제","wiki":"slow start","tags":["slow start"],"prof":true,"introCard":2},{"id":"u10g-12","type":"mc","q":"cwnd 14 에서 3 duplicate ACKs 가 왔다. Reno 의 새 ssthresh 와 cwnd 는?","choices":["7, 1","7, 10","14, 17","12, 15"],"answer":1,"explain":"ssthresh = 14/2 = 7, Reno 는 cwnd = ssthresh + 3 = **10** → fast recovery. Tahoe 였다면 (7, 1) → slow start.","src":"PS2 유형 · 11/24 과제","wiki":"Tahoe와 Reno","tags":["Tahoe와 Reno"],"prof":true,"introCard":2},{"id":"u10g-13","type":"mc","q":"Reno 에서 cwnd 10 일 때 time-out 이 났다. 새 값은?","choices":["ssthresh 5, cwnd 8","ssthresh 5, cwnd 1","ssthresh 10, cwnd 1","ssthresh 5, cwnd 5"],"answer":1,"explain":"time-out 은 Tahoe 와 같다 → ssthresh = 10/2 = 5, **cwnd = 1**, slow start.","src":"PS2 유형 · 11/24 과제","wiki":"Tahoe와 Reno","tags":["Tahoe와 Reno"],"prof":true,"introCard":2}],"intro":[{"title":"UDP header 와 TCP 번호","body":"UDP: 4 자리씩 끊어 10진 → data = total − 8 → 작은(well-known) port 쪽이 server. TCP: SYN·SYN+ACK 는 번호 1 개, ③ ACK 는 0 개 → 첫 data byte = ISN + 1. 다음 seq = 앞 seq + bytes, ACK = 연속 마지막 byte + 1.","img":"img/cn10-ps2-udp.png","imgAlt":"UDP header 네 칸","src":"CH09 p.34–36, 47–58 · PS2 4"},{"title":"window 와 재전송","body":"rwnd = buffer − 안 가져간 byte, 실제 window = min(rwnd, cwnd). 오른쪽 벽 = ackNo + rwnd 가 왼쪽으로 가면 shrink. 원래 ACK + 같은 ACK 3 개 = fast retransmission.","src":"CH09 p.65–77 · PS2 5(a)–(c)"},{"title":"cwnd: Tahoe 와 Reno","body":"slow start 두 배(ssthresh 넘지 않음) → CA +1. time-out: ssthresh = cwnd/2, cwnd = 1 (둘 다). 3 dupACKs: Tahoe 는 cwnd 1, Reno 는 cwnd = ssthresh + 3 → fast recovery.","src":"CH09 p.78–85 · PS2 5(d)"}]}]}]}]</script>
<script>
/* 한입 학습 — core logic shared by the app (browser), build.mjs, report.mjs, test.mjs.
   No DOM access here. Works as a plain <script> (sets globalThis.DuoCore) and as CommonJS. */
(function (root) {
  'use strict';

  var TYPES = ['mc', 'tf', 'cloze', 'match', 'order', 'sa', 'num'];
  var TYPE_KO = { mc: '객관식', tf: 'O/X', cloze: '빈칸', match: '짝 맞추기', order: '순서', sa: '단답', num: '계산' };
  var MIN = 60e3, DAY = 864e5;
  var BOX_DAYS = [0, 1, 2, 4, 8, 16];
  var LOG_CAP = 20000;

  /* ---------- dates (Asia/Seoul) ---------- */
  var dfmt = null;
  function dateKey(ms) {
    try {
      if (!dfmt) dfmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' });
      return dfmt.format(new Date(ms));
    } catch (e) {
      var d = new Date(ms + 9 * 3600e3);
      return d.toISOString().slice(0, 10);
    }
  }
  function shiftDay(key, delta) {
    var d = new Date(key + 'T12:00:00Z');
    d.setUTCDate(d.getUTCDate() + delta);
    return d.toISOString().slice(0, 10);
  }
  /** streak = consecutive days with lessons>0 ending today (or yesterday if today not yet done). */
  function calcStreak(days, today) {
    days = days || {};
    var k = today, n = 0;
    if (!(days[k] && days[k].lessons > 0)) k = shiftDay(k, -1);
    while (days[k] && days[k].lessons > 0) { n++; k = shiftDay(k, -1); }
    return n;
  }

  /* ---------- grading ---------- */
  function normSA(s) {
    return String(s == null ? '' : s).normalize('NFKC').trim().toLowerCase()
      .replace(/[.。]+$/, '')
      .replace(/[\s\-‐-―−·・•‧∙_]/g, '');
  }
  function parseNum(s, unit) {
    if (typeof s === 'number') return s;
    var t = String(s == null ? '' : s).normalize('NFKC').trim();
    if (unit) { var u = String(unit).trim(); if (u && t.toLowerCase().endsWith(u.toLowerCase())) t = t.slice(0, -u.length); }
    t = t.replace(/[,\s]/g, '').replace(/[−–]/g, '-').replace(/%$/, '');
    if (t === '') return NaN;
    var m = /^([-+]?[\d.]+(?:e[-+]?\d+)?)\/([-+]?[\d.]+(?:e[-+]?\d+)?)$/i.exec(t);
    if (m) return Number(m[1]) / Number(m[2]);
    m = /^([-+]?[\d.]+)\^([-+]?[\d.]+)$/.exec(t);
    if (m) return Math.pow(Number(m[1]), Number(m[2]));
    if (!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(t)) return NaN;
    return Number(t);
  }
  function numOk(item, given) {
    var g = parseNum(given, item.unit), a = Number(item.answer);
    if (!isFinite(g)) return false;
    var tol = item.tol == null ? 0.01 : Number(item.tol);
    if (tol === 0) return Math.abs(g - a) <= 1e-9 * Math.max(1, Math.abs(a));
    if (a === 0) return Math.abs(g) <= tol;
    return Math.abs(g - a) <= tol * Math.abs(a) + 1e-12;
  }
  function arrEq(a, b) {
    if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) if (String(a[i]).trim() !== String(b[i]).trim()) return false;
    return true;
  }
  /** match: given = list of attempted [left,right] pairs in tap order. ok iff no wrong attempt and every left matched. */
  function matchOk(item, given) {
    if (!Array.isArray(given)) return false;
    var map = {}; item.pairs.forEach(function (p) { map[p[0]] = p[1]; });
    var covered = {}, wrong = 0;
    given.forEach(function (p) { if (map[p[0]] === p[1]) covered[p[0]] = 1; else wrong++; });
    return wrong === 0 && Object.keys(covered).length === item.pairs.length;
  }
  function grade(item, given) {
    switch (item.type) {
      case 'mc': return Number(given) === item.answer && given !== null && given !== '';
      case 'tf': return given === item.answer;
      case 'cloze': return arrEq(given, item.answer);
      case 'match': return matchOk(item, given);
      case 'order': return arrEq(given, item.answer);
      case 'sa': {
        var g = normSA(given);
        if (!g) return false;
        return [item.answer].concat(item.alts || []).some(function (a) { return normSA(a) === g; });
      }
      case 'num': return numOk(item, given);
    }
    return false;
  }
  function clip(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  /** human-readable serialization of a user's answer (stored in the log, read by AI). */
  function serializeGiven(item, given) {
    switch (item.type) {
      case 'mc': return given == null ? '' : clip((item.choices[given] != null ? item.choices[given] : '?'), 120);
      case 'tf': return given === true ? 'O' : given === false ? 'X' : '';
      case 'cloze': return (given || []).join(' | ');
      case 'order': return (given || []).join(' → ');
      case 'match': {
        var map = {}; item.pairs.forEach(function (p) { map[p[0]] = p[1]; });
        var bad = (given || []).filter(function (p) { return map[p[0]] !== p[1]; });
        return bad.length ? '잘못 연결: ' + bad.map(function (p) { return p[0] + '→' + p[1]; }).join('; ') : '전부 맞게 연결';
      }
      default: return clip(given == null ? '' : given, 200);
    }
  }
  function answerText(item) {
    switch (item.type) {
      case 'mc': return item.choices[item.answer];
      case 'tf': return item.answer ? 'O (참)' : 'X (거짓)';
      case 'cloze': return item.answer.join(' | ');
      case 'order': return item.answer.join(' → ');
      case 'match': return item.pairs.map(function (p) { return p[0] + ' ↔ ' + p[1]; }).join('; ');
      case 'sa': return item.answer + (item.alts && item.alts.length ? ' (또는 ' + item.alts.join(', ') + ')' : '');
      case 'num': return item.answer + (item.unit ? ' ' + item.unit : '');
    }
    return '';
  }

  /* ---------- tap mode (no typing): choices for sa / num ---------- */
  function hash32(s) {
    var x = 2166136261 >>> 0; s = String(s);
    for (var i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 16777619) >>> 0; }
    return x;
  }
  /** deterministic PRNG (mulberry32) from a number or string seed */
  function rngFrom(seed) {
    var a = typeof seed === 'number' ? seed >>> 0 : hash32(seed);
    return function () {
      a = (a + 0x6D2B79F5) >>> 0; var t = a;
      t = Math.imul(t ^ t >>> 15, 1 | t); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  /** other items split into [same lesson, same unit, rest of course] (items carry _u/_l from flatItems) */
  function tiers(item, items) {
    var T = [[], [], []];
    (items || []).forEach(function (x) {
      if (x === item || (x.id === item.id && x._l === item._l)) return;
      T[x._l === item._l ? 0 : x._u === item._u ? 1 : 2].push(x);
    });
    return T;
  }
  /** sa → [answer, up to n-1 distractors]. Distractors: other sa answers (lesson → unit → course),
      then other term-like strings (mc choices, cloze bank, match terms). Never equal (after normSA) to answer/alts or each other. */
  function saChoices(item, items, n) {
    n = n || 4;
    var seen = {}, picked = [], rnd = rngFrom('sa:' + item.id);
    [item.answer].concat(item.alts || []).forEach(function (a) { seen[normSA(a)] = 1; });
    function take(list) {
      shuffle(list, rnd).forEach(function (s) {
        if (picked.length >= n - 1 || typeof s !== 'string' || s.length > 80) return;
        var k = normSA(s);
        if (!k || seen[k]) return;
        seen[k] = 1; picked.push(s);
      });
    }
    var T = tiers(item, items);
    T.forEach(function (t) { take(t.filter(function (x) { return x.type === 'sa'; }).map(function (x) { return x.answer; })); });
    T.forEach(function (t) {
      if (picked.length >= n - 1) return;
      var w = [];
      t.forEach(function (x) {
        if (x.type === 'mc') w = w.concat(x.choices);
        else if (x.type === 'cloze') w = w.concat(x.bank);
        else if (x.type === 'match') x.pairs.forEach(function (p) { w.push(p[0]); });
      });
      take(w);
    });
    return [String(item.answer)].concat(picked);
  }
  function decimals(x) {
    var s = String(x);
    if (/e/i.test(s)) return 6;
    var i = s.indexOf('.');
    return i < 0 ? 0 : Math.min(6, s.length - i - 1);
  }
  function fmtNum(v, dec) { return String(Number(Number(v).toFixed(dec))); }
  /** num → [answer label, up to n-1 distractor labels] ("20 bit"). Distractors: other num answers in the lesson with
      the same unit, then ×2 ÷2 +1 −1 ×10 ÷10 variants. Same sign as the answer, formatted with the answer's decimals,
      unique, and never inside the answer's tolerance. */
  function numChoices(item, items, n) {
    n = n || 4;
    var a = Number(item.answer), dec = decimals(a), unit = item.unit ? String(item.unit) : '';
    var seen = {}, out = [], rnd = rngFrom('num:' + item.id);
    seen[fmtNum(a, dec)] = 1;
    function push(v) {
      if (out.length >= n - 1 || !isFinite(v)) return;
      if ((a > 0 && v <= 0) || (a < 0 && v >= 0) || (a === 0 && v < 0)) return;
      if (dec === 0 && Math.abs(v - Math.round(v)) > 1e-9) return;
      var s = fmtNum(v, dec);

  /** tap-mode choices for sa/num, deterministic per (item, attempt#) */

    return shuffle(list, rngFrom(item.id + '#' + (attempt || 0)));

  /* ---------- scheduling (Leitner, SM-2-lite) ---------- */
  function schedule(stat, ok, now, item, givenStr) {
    var st = stat || { b: 0, d: 0, n: 0, c: 0, w: 0 };
    st.n = (st.n || 0) + 1; st.lt = now;
    var mult = item && item.prof ? 0.7 : 1;
    if (ok) {
      st.c = (st.c || 0) + 1;
      st.b = Math.min(5, (st.b || 0) + 1);
      st.d = now + Math.round(BOX_DAYS[st.b] * DAY * mult);
    } else {
      st.w = (st.w || 0) + 1;
      st.b = 0;
      st.d = now + 10 * MIN;
      st.lw = now;
      if (givenStr != null) { st.wa = (st.wa || []).concat([givenStr]).slice(-3); }
    }

  }
  function acc(st) { return st && st.n ? st.c / st.n : null; }

  function shuffle(arr, rnd) {
    rnd = rnd || Math.random;

    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  /** lesson session: unseen (content order) → due → weak → rest. */
  function pickLesson(items, stats, now, n, rnd) {
    n = n || 12; stats = stats || {};
    var unseen = [], due = [], weak = [], rest = [];
    items.forEach(function (it) {
      var st = stats[it.id];
      if (!st || !st.n) unseen.push(it);
      else if (st.d <= now) due.push(it);
      else if (acc(st) < 0.75) weak.push(it);
      else rest.push(it);
    });
    due.sort(function (a, b) { return (b.prof ? 1 : 0) - (a.prof ? 1 : 0) || stats[a.id].d - stats[b.id].d; });
    weak.sort(function (a, b) { return acc(stats[a.id]) - acc(stats[b.id]); });
    var tail = due.concat(weak, shuffle(rest, rnd));
    var out = unseen.slice(0, n);
    out = out.concat(tail.slice(0, n - out.length));

    var k = Math.min(unseen.length, n);
    return out.slice(0, k).concat(shuffle(out.slice(k), rnd));
  }
  /** course-wide due review. Falls back to weakest seen items when nothing is due. */
  function pickReview(items, stats, now, n) {
    n = n || 15; stats = stats || {};
    var seen = items.filter(function (it) { return stats[it.id] && stats[it.id].n; });
    var due = seen.filter(function (it) { return stats[it.id].d <= now; });
    due.sort(function (a, b) { return (b.prof ? 1 : 0) - (a.prof ? 1 : 0) || stats[a.id].d - stats[b.id].d; });
    if (due.length) return { items: due.slice(0, n), due: due.length, fallback: false };
    var weak = seen.slice().sort(function (a, b) { return acc(stats[a.id]) - acc(stats[b.id]) || (stats[a.id].lt - stats[b.id].lt); });

  }
  function dueCount(items, stats, now) {
    return items.filter(function (it) { var s = stats[it.id]; return s && s.n && s.d <= now; }).length;
  }
  /** wrong in last `days` days, most-wrong first. */
  function mistakes(log, now, days) {
    var since = now - (days || 7) * DAY, by = {};
    (log || []).forEach(function (e) {
      if (e.t < since || e.ok || e.r) return;
      var m = by[e.id] || (by[e.id] = { id: e.id, count: 0, last: 0, givens: [] });
      m.count++; m.last = Math.max(m.last, e.t);
      if (e.given && m.givens.indexOf(e.given) < 0) m.givens.push(e.given);

  }
  function weakTags(items, stats, minN) {

      .filter(function (x) { return x.n >= minN; })
      .sort(function (a, b) { return a.acc - b.acc || b.n - a.n; });

  /* ---------- content helpers ---------- */
  function flatItems(content) {

        (l.items || []).forEach(function (it) { out.push(Object.assign({ _u: u.id, _l: l.id }, it)); });
      });
    });

  }
  function makeOutline(content) {

    });
  }
  function makeMeta(content, onlyIds) {

    });
    return meta;
  }

  /* ---------- report (markdown, Korean) ---------- */
  function pct(c, n) { return n ? Math.round(100 * c / n) + '%' : '—'; }
  function fmtTime(ms) { var d = new Date(ms + 9 * 3600e3); return d.toISOString().slice(0, 16).replace('T', ' '); }
  function cell(s) { return String(s == null ? '' : s).replace(/\|/g, '\\|').replace(/\n/g, ' '); }
  /**

   *  - log entries {t,id,unit,lesson,ok,given,ms,r?}; r=1 marks an in-session retry (excluded from accuracy)

  function buildReport(ctx) {
    var now = ctx.now || Date.now();
    var log = (ctx.log || []).filter(function (e) { return !e.r; });
    var meta = ctx.meta || {}, outline = ctx.outline || [], g = ctx.global || {};
    var top = ctx.top || 10;
    var course = ctx.course || {};
    var L = [];
    var tot = log.length, ok = log.filter(function (e) { return e.ok; }).length;
    var itemIds = {}; log.forEach(function (e) { itemIds[e.id] = 1; });
    var totalItems = 0; outline.forEach(function (u) { u.lessons.forEach(function (l) { totalItems += l.n; }); });
    var today = dateKey(now);
    var days = g.days || {};

    L.push('# 한입 학습 리포트 — ' + (course.title || course.id || '?'));
    L.push('');
    L.push('생성: ' + fmtTime(now) + ' (KST) · 과목 id `' + (course.id || '?') + '`');
    L.push('');
    L.push('## 요약');
    L.push('- 첫 시도 기준 정답률: **' + pct(ok, tot) + '** (' + ok + '/' + tot + ')');
    L.push('- 풀어 본 문항: ' + Object.keys(itemIds).length + (totalItems ? ' / ' + totalItems : '') + '개');
    if (g.streak != null || g.xp != null) L.push('- 연속 학습: ' + (calcStreak(days, today)) + '일 · 총 XP ' + (g.xp || 0) + ' · 이 과목 XP ' + ((g.courses && g.courses[course.id] && g.courses[course.id].xp) || 0) + ' · 하루 목표 ' + (g.goal || 30) + ' XP (오늘 ' + ((days[today] && days[today].xp) || 0) + ')');
    var last7 = log.filter(function (e) { return e.t >= now - 7 * DAY; });
    var introL = 0; outline.forEach(function (u) { u.lessons.forEach(function (l) { if (l.intro) introL++; }); });
    if (introL || (ctx.intros || []).length) {
      var seenL = {}; (ctx.intros || []).forEach(function (e) { if (e.lesson) seenL[e.lesson] = 1; });
      L.push('- 개념 카드(📖) 본 레슨: ' + Object.keys(seenL).length + (introL ? ' / ' + introL : '') + '개 · 카드 열람 ' + (ctx.intros || []).length + '회');
    }
    L.push('- 최근 7일: ' + last7.length + '문항, 정답률 ' + pct(last7.filter(function (e) { return e.ok; }).length, last7.length));
    if (!tot) { L.push(''); L.push('_아직 기록이 없습니다._'); return L.join('\n'); }

    // per unit / lesson

    });

    var unitRows = outline.length ? outline.map(function (u) { return [u.id, u.title]; }) : Object.keys(byU).map(function (k) { return [k, k]; });
    unitRows.forEach(function (r) { var s = byU[r[0]]; L.push('| ' + cell(r[1]) + ' | ' + (s ? s.n : 0) + ' | ' + (s ? pct(s.c, s.n) : '—') + ' |'); });

    L.push('');
    L.push('## 레슨별 정답률 (시도한 레슨)');
    L.push('| 레슨 | 시도 | 정답률 |');
    L.push('|---|---:|---:|');
    var lessonTitle = {}, lessonOrder = [];
    outline.forEach(function (u) { u.lessons.forEach(function (l) { lessonTitle[l.id] = u.title + ' › ' + l.title; lessonOrder.push(l.id); }); });
    var lids = lessonOrder.length ? lessonOrder.filter(function (id) { return byL[id]; }) : Object.keys(byL);
    Object.keys(byL).forEach(function (id) { if (lids.indexOf(id) < 0) lids.push(id); });
    lids.forEach(function (id) { var s = byL[id]; L.push('| ' + cell(lessonTitle[id] || id) + ' | ' + s.n + ' | ' + pct(s.c, s.n) + ' |'); });

    // input mode (sa/num): key = typed recall, tap = 4지선다 (easier), self = 스스로 채점 / 카드
    var byM = {};
    log.forEach(function (e) { if (!e.mode) return; var x = byM[e.mode] || (byM[e.mode] = { n: 0, c: 0 }); x.n++; if (e.ok) x.c++; });
    if (byM.tap || byM.key || byM.self) {
      L.push('');
      L.push('## 입력 방식별 정답률 (단답·계산 문항, 카드)');
      L.push('| 방식 | 시도 | 정답률 |');
      L.push('|---|---:|---:|');
      [['key', '⌨ 직접 입력 (회상)'], ['tap', '👆 탭 4지선다 (재인 — 더 쉬움)'], ['self', '🙋 스스로 채점·카드']].forEach(function (r) { var x = byM[r[0]]; if (x) L.push('| ' + r[1] + ' | ' + x.n + ' | ' + pct(x.c, x.n) + ' |'); });
      L.push('');
      L.push('_탭 모드는 보기를 보고 고르는 재인 문제라 직접 쓰기보다 쉽다. 아래 오답·약점 순위에서 탭 모드 시도는 가중치 0.5 로 센다 (탭 모드 정답은 숙달의 약한 증거)._');
    }

    // most missed (tap-mode attempts weigh 0.5)
    var per = {};
    log.forEach(function (e) {
      var p = per[e.id] || (per[e.id] = { id: e.id, n: 0, w: 0, s: 0, tap: 0, givens: [], last: 0, lastOk: null });

      p.n++; if (e.mode === 'tap') p.tap++;
      if (!e.ok) { p.w++; p.s += wt; if (e.given && p.givens.indexOf(e.given) < 0) p.givens.push(e.given); }

      .sort(function (a, b) { return b.s - a.s || b.w - a.w || b.last - a.last; });
    L.push('');
    L.push('## 가장 많이 틀린 문항 (상위 ' + Math.min(top, missed.length) + ' / 틀린 적 있는 문항 ' + missed.length + '개)');

      var m = meta[p.id] || {};
      L.push('');
      L.push('### ' + (i + 1) + '. `' + p.id + '`' + (m.prof ? ' 🎙' : '') + (m.img ? ' [그림 있음]' : '') + ' — ' + p.w + '/' + p.n + '회 틀림' + (p.tap ? ' (그중 탭 모드 시도 ' + p.tap + '회)' : '') + (p.lastOk ? ' (마지막 시도는 정답)' : ''));
      if (m.q) L.push('- 문제 (' + (TYPE_KO[m.type] || m.type) + '): ' + m.q);
      L.push('- 내 오답: ' + (p.givens.length ? p.givens.slice(-4).map(function (x) { return '「' + x + '」'; }).join(', ') : '(기록 없음)'));
      if (m.answer != null) L.push('- 정답: ' + m.answer);
      if (m.explain) L.push('- 해설: ' + m.explain);
      var tail = [];
      if (m.src) tail.push('출처 ' + m.src);
      if (m.tags && m.tags.length) tail.push('태그 ' + m.tags.join(', '));
      if (m.wiki) tail.push('위키 `' + m.wiki + '`');
      if (tail.length) L.push('- ' + tail.join(' · '));

    // weak tags

    });

      .filter(function (x) { return x.n >= 2; }).sort(function (a, b) { return a.a - b.a || b.n - a.n; });
    if (tags.length) {
      L.push('');
      L.push('## 약점 태그 (정답률 낮은 순)');
      L.push('| 태그 | 시도(탭 0.5) | 정답률 |');
      L.push('|---|---:|---:|');
      tags.slice(0, 10).forEach(function (x) { L.push('| ' + cell(x.tag) + ' | ' + (Math.round(x.n * 10) / 10) + ' | ' + pct(x.c, x.n) + ' |'); });
    }

    // recent activity
    L.push('');
    L.push('## 최근 14일 활동');
    var actRows = [];
    for (var i = 13; i >= 0; i--) {
      var k = shiftDay(today, -i);
      var dayLog = log.filter(function (e) { return dateKey(e.t) === k; });

      if (dayLog.length || dx.xp) actRows.push('| ' + k + ' | ' + dayLog.length + ' | ' + pct(dayLog.filter(function (e) { return e.ok; }).length, dayLog.length) + ' | ' + (dx.xp || 0) + ' | ' + (dx.lessons || 0) + ' |');

    L.push('');
    L.push('## 추천 다음 학습');
    if (!rec.length) L.push('- 모든 레슨 정답률 80% 이상. 「오늘의 복습」으로 간격 복습 유지.');
    rec.slice(0, 5).forEach(function (r) { L.push('- ' + (lessonTitle[r.id] || r.id) + ' (`' + r.id + '`) — ' + r.why); });
    return L.join('\n');
  }

  /** focus / distraction / night stats from global.days {focusMs, leaves} + nights list. '' if nothing. */
  function focusSection(g, nights, now) {
    var days = (g && g.days) || {}, today = dateKey(now), rows = [], totMs = 0, totLeaves = 0;
    for (var i = 6; i >= 0; i--) {
      var k = shiftDay(today, -i), d = days[k];
      if (!d || !(d.focusMs || d.leaves)) continue;
      totMs += d.focusMs || 0; totLeaves += d.leaves || 0;

    }
    var ns = (nights || []).filter(function (n) { return n.t1 >= now - 7 * DAY; });
    if (!rows.length && !ns.length) return '';

    L.push('- 집중 학습 ' + Math.round(totMs / MIN) + '분 · 세션 중 앱 나감 ' + totLeaves + '회' + (totMs ? ' (시간당 ' + (totLeaves / (totMs / 3600e3)).toFixed(1) + '회)' : ''));
    if (rows.length) { L.push('| 날짜 | 집중 | 나감 |'); L.push('|---|---:|---:|'); L.push.apply(L, rows); }
    if (ns.length) {
      L.push('');
      L.push('누워서 모드 기록:');
      ns.slice(-7).forEach(function (n) {
        var tot = (n.known || 0) + (n.unknown || 0) + (n.qn || 0), good = (n.known || 0) + (n.qok || 0);
        L.push('- ' + fmtTime(n.t0) + ' · ' + n.min + '분 · 카드 ' + (n.seen || 0) + '장 (알았다 ' + (n.known || 0) + ' / 몰랐다 ' + (n.unknown || 0) + ')' + (n.qn ? ' · 퀴즈 ' + n.qok + '/' + n.qn : '') + ' · 자기평가 정답률 ' + pct(good, tot) + ' · 나감 ' + (n.leaves || 0) + '회' + (n.timer ? ' · 잠 타이머 ' + n.timer + '분' : ''));
      });
    }
    return L.join('\n');
  }
  /** courses: [{course, outline, meta, log}] → one combined markdown report */
  function buildHubReport(ctx) {

    L.push('# 포켓 스터디 전과목 리포트');
    L.push('');
    L.push('생성: ' + fmtTime(now) + ' (KST) · 연속 학습 ' + calcStreak(g.days || {}, dateKey(now)) + '일 · 총 XP ' + (g.xp || 0) + ' · 하루 목표 ' + (g.goal || 30) + ' XP');
    L.push('');
    L.push('## 과목별 요약');
    L.push('| 과목 | 시도 | 정답률 | 최근 7일 | 틀린 적 있는 문항 | XP |');
    L.push('|---|---:|---:|---:|---:|---:|');
    ctx.courses.forEach(function (c) {
      var log = (c.log || []).filter(function (e) { return !e.r; }), ok = log.filter(function (e) { return e.ok; }).length;
      var w = {}; log.forEach(function (e) { if (!e.ok) w[e.id] = 1; });

    if (CF.listen && window.speechSynthesis) speak(backSpeech(it), function () { cfLater(2500, cfNext); });
    else cfLater(HC.aSec * 1000, cfNext);
  }
  function cfNext() { if (!CF) return; clearTimeout(CF.timer); try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) { /* ignore */ } CF.i++; cfShow(); }
  function cfPause() {
    if (!CF) return;

      CF.paused = true; CF.remain = Math.max(500, (CF.deadline || Date.now()) - Date.now()); clearTimeout(CF.timer);
      try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) { /* ignore */ }
      renderCard();
    } else {
      CF.paused = false; CF.gen++;
      renderCard();
      var it = CF.deck[CF.i];
      if (it._intro) { if (CF.listen && window.speechSynthesis) speak(introSpeech(it), function () { cfLater(2500, cfNext); }); else cfLater(CF.remain, cfNext); return; }
      if (CF.phase === 'q') { if (CF.listen && window.speechSynthesis) speak(frontSpeech(it), function () { cfLater(HC.qSec * 1000, cfReveal); }); else cfLater(CF.remain, cfReveal); }
      else { if (CF.listen && window.speechSynthesis) speak(backSpeech(it), function () { cfLater(2500, cfNext); }); else cfLater(CF.remain, cfNext); }
    }
  }
  function cfMark(known) {
    if (!CF || CF.marked) return;
    var it = CF.deck[CF.i], cd = cdOf(it), now = Date.now();
    if (it._intro) return cfNext();
    CF.marked = true;
    var g = known ? '(카드) 알았다' : '(카드) 몰랐다';
    cd.log.push({ t: now, id: it.id, unit: it._u, lesson: it._l, ok: known, given: g, ms: now - CF.itemT0, m: 'card', mode: 'self', bed: 1 });
    cd.st[it.id] = D.schedule(cd.st[it.id], known, now, it, known ? null : g);
    saveCourse(cd); saveLog(cd);
    if (known) BED.known++; else { BED.unknown++; buzz(); }
    if (!known && CF.phase === 'q') { CF.paused = false; cfReveal(); return; } // 몰랐다 → 답을 보여 준 뒤 넘어감
    cfNext();
  }
  function renderCard() {

    var back = CF.phase === 'a' ? h('div', { class: 'cfback' },
      h('div', { class: 'cfans', html: '<b>정답</b> ' + md(D.answerText(it)) }),
      h('div', { class: 'cfexp', html: md(it.explain || '') }),
      h('div', { class: 'muted small' }, '📖 ' + (it.src || ''), it.prof ? ' · 🎙' : '')) : null;
    var root = h('div', { class: 'bedwrap card-flow' },
      h('div', { class: 'cftop' },
        h('span', { class: 'cbadge' }, cd.short), h('span', { class: 'muted small' }, (CF.listen ? '🎧 듣기' : '🃏 카드') + ' · ' + (CF.i + 1) + '번째'),
        h('span', { id: 'bedtimer', class: 'muted small' }, '')),
      h('div', { class: 'cfbody' }, cardFront(it), back),
      h('div', { class: 'bedctl' },
        h('div', { class: 'cfbar' }, h('i', { style: CF.paused ? 'width:50%' : '' })),
        h('div', { class: 'cfrow' },
          h('button', { class: 'cfb no', onclick: function () { cfMark(false); } }, '몰랐다'),
          h('button', { class: 'cfb pp', onclick: cfPause, 'aria-label': CF.paused ? '재생' : '일시정지' }, CF.paused ? '▶' : '⏸'),
          h('button', { class: 'cfb yes', onclick: function () { cfMark(true); } }, '알았다')),
        h('div', { class: 'row2' },
          h('button', { class: 'btn', onclick: function () { if (CF.phase === 'q') { CF.gen++; cfReveal(); } else cfNext(); } }, CF.phase === 'q' ? '정답 보기' : '⏭ 다음'),
          h('button', { class: 'btn', onclick: bedMenu }, '☰ 메뉴'))));
    setView(root);
    bedSecond();
  }
  function sleepEnd() {
    if (!BED || BED.slept) return;
    bedStopFlow();
    if (S) { endSessionTrack(); S = null; hideSheet(); closeModal(); }
    var n = recordNight();
    BED.slept = true;
    wake(false);
    document.body.classList.add('insession', 'sleeping');
    var tot = n.known + n.unknown + n.qn, good = n.known + n.qok;
    var root = h('div', { class: 'bedwrap sleep' },
      h('div', { class: 'bedtop' }, h('div', { class: 'moonbig' }, '🌙'), h('h2', null, '잘 자요'),
        h('div', { class: 'muted' }, '오늘 밤 ' + n.min + '분 공부했어요')),
      h('div', { class: 'tiles' }, tile('🃏 카드', n.seen + '장'), tile('🎯 정답률', tot ? Math.round(100 * good / tot) + '%' : '—'), tile('📝 퀴즈', n.qok + '/' + n.qn), tile('📵 나감', n.leaves + '회')),
      h('div', { class: 'bedctl' },
        h('button', { class: 'btn', onclick: function () { BED.slept = false; BED.recorded = false; BED.t0 = Date.now(); BED.activeMs = 0; BED.seen = BED.known = BED.unknown = BED.qn = BED.qok = BED.leaves = 0; wake(true); setTimer(10); bedMenu(); } }, '10분만 더'),
        h('button', { class: 'btn ghost', onclick: exitBed }, '나가기')));
    setView(root);
  }

  /* ---------- demo / test hooks ---------- */
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function makeGiven(it, correct) {
    switch (it.type) {
      case 'mc': return correct ? it.answer : (it.answer + 1) % it.choices.length;
      case 'tf': return correct ? it.answer : !it.answer;
      case 'cloze': if (correct) return it.answer.slice(); var w = it.bank.filter(function (b) { return it.answer.indexOf(b) < 0; }); return it.answer.map(function (a, i) { return w[i % Math.max(1, w.length)] || a; }).reverse();
      case 'match': return correct ? it.pairs.slice() : [[it.pairs[0][0], it.pairs[1][1]]].concat(it.pairs);
      case 'order': return correct ? it.answer.slice() : it.answer.slice().reverse();
      case 'sa': return correct ? it.answer : '모르겠음';
      case 'num': return correct ? String(it.answer) : String(it.answer * 2 + 1);
    }
  }
  function seedDemo() {
    var r = rng(7), now = Date.now();
    ORDER.forEach(function (cid, ci) {
      var cd = DATA[cid];
      var pick = cd.items.slice(0, Math.ceil(cd.items.length * (0.7 - ci * 0.12)));
      var log = [];
      pick.forEach(function (it) {
        var k = 1 + Math.floor(r() * 3);
        for (var j = 0; j < k; j++) {
          var ok = r() > (it.diff === 3 ? 0.55 : 0.3);
          log.push({ t: now - Math.floor(r() * 13) * DAY - Math.floor(r() * 5 * 3600e3), id: it.id, unit: it._u, lesson: it._l, ok: ok, given: D.serializeGiven(it, makeGiven(it, ok)), ms: 3000 + Math.floor(r() * 9000), m: 'lesson' });
        }
      });
      log.sort(function (a, b) { return a.t - b.t; });
      log.forEach(function (e) { cd.st[e.id] = D.schedule(cd.st[e.id], e.ok, e.t, cd.byId[e.id], e.ok ? null : e.given); });
      cd.log = log;
      cd.lessons.forEach(function (L) { var s = lessonStats(L); if (s.seen === s.total) cd.ls[L.l.id] = { c: 1 + Math.floor(r() * 3), best: 0.8, n: 2 }; });
      log.forEach(function (e) { var k = D.dateKey(e.t), d = G.days[k] || (G.days[k] = { xp: 0, lessons: 0 }); d.xp += e.ok ? 2 : 1; d.lessons = 1; d.byC = d.byC || {}; d.byC[cid] = (d.byC[cid] || 0) + (e.ok ? 2 : 1); d.focusMs = (d.focusMs || 0) + 40000; if (r() < 0.05) d.leaves = (d.leaves || 0) + 1; });
      touchCourse(cd); G.courses[cid].xp = log.length * 2; G.xp += log.length * 2;
    });
    var td = G.days[today()]; if (td) { td.xp = Math.min(td.xp, 18); var s = 0; Object.keys(td.byC || {}).forEach(function (c) { td.byC[c] = Math.min(td.byC[c], 6 - ORDER.indexOf(c)); s += td.byC[c]; }); td.xp = s; }
    NIGHTS.push({ t0: now - DAY - 40 * MIN, t1: now - DAY, min: 38, seen: 42, known: 30, unknown: 12, qn: 5, qok: 4, leaves: 2, timer: 30 });
    G.hearts = 3; G.heartsT = now - 10 * MIN;
    G.streak = D.calcStreak(G.days, today()); G.best = G.streak + 2;
  }
  function demoScreen(scr) {
    var type = P.get('type'), ok = P.get('ok') === '1';
    var cd = CUR;
    var it0 = P.get('item') ? cd.byId[P.get('item')] : type ? cd.items.filter(function (x) { return x.type === type; })[0] : cd.items[0];
    var L = it0 && cd.lessons.filter(function (x) { return x.l.id === it0._l; })[0];
    if (scr === 'lesson' || scr === 'feedback') {
      if (!L) return go('path');
      startLesson(L, it0, !P.get('showintro'));
      if (scr === 'feedback') submit(makeGiven(it0, ok));
      else if (P.get('self')) selfReveal();
      if (P.get('zoom') && it0.img) openZoom(it0.img, it0.imgAlt);
    } else if (scr === 'result') {
      renderResult({ xp: 22, base: 10, done: 5, combo: 2, perfect: 0, acc: 10 / 12, ms: 254000, maxCombo: 6, crownUp: 2, refill: false, lesson: true, leaves: 1, title: cd.lessons[0].l.title, goalHit: true });
    } else if (scr === 'hearts0') {
      G.hearts = 0; G.heartsT = Date.now(); go('path'); outOfHearts();
    } else if (scr === 'ai') { go(HUB ? 'today' : 'stats'); if (HUB) sendHubToAI(); else sendToAI(reportMd(cd), 'report'); }
    else if (scr === 'switcher') { go('path'); openSwitcher(); }
    else if (scr === 'bed') { enterBed(); setTimer(30); bedMenu(); }
    else if (scr === 'cards' || scr === 'listen') {
      enterBed(); setTimer(30); bedFlow(scr === 'listen');
      if (it0 && P.get('item')) { CF.deck.unshift(it0); CF.i = 0; BED.seen--; cfShow(); }
      if (P.get('phase') === 'a') cfReveal();
      cfPause();
    } else if (scr === 'sleep') {
      enterBed(); BED.t0 = Date.now() - 32 * MIN; BED.activeMs = 31 * MIN; BED.seen = 37; BED.known = 26; BED.unknown = 9; BED.qn = 6; BED.qok = 5; BED.leaves = 1; BED.timerMin = 30; sleepEnd();
    } else if (scr === 'intro') {
      var IL = cd.lessons.filter(function (x) { return P.get('lesson') ? x.l.id === P.get('lesson') : hasIntro(x); })[0];
      go('path');
      if (IL) openIntro(IL, P.get('card') === 'last' ? IL.l.intro.length - 1 : Number(P.get('card') || 0), P.get('reread') ? null : function () { startLesson(IL, null, true); });
    } else if (scr === 'bedintro') { enterBed(); setTimer(30); bedFlow(false, true); cfPause(); }
    else if (scr === 'wikiview') { go('path'); openWiki(cd.id, (cd.items.filter(function (x) { return x.wiki; })[0] || {}).wiki || ''); }
    else if (scr === 'focusbar') { FOCUS = { t0: Date.now(), target: 25 * MIN, activeMs: 7 * MIN, leaves: 2 }; renderFocusBar(); go(HUB ? 'today' : 'path'); }
    else if (scr === 'autoplay') {
      // end-to-end through the real flow (used by test.mjs)
      // intro: first start of a lesson with intro shows the deck; →… then Enter starts the questions
      var out0 = {}, IL0 = cd.lessons.filter(hasIntro)[0];
      if (IL0) {
        delete cd.intro.seen[IL0.l.id];
        startLesson(IL0);
        out0.introShown = !!$intro && !S;
        for (var ii = 0; ii < IL0.l.intro.length - 1; ii++) document.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
        out0.introLast = !!$intro && /문제 풀기 시작/.test($intro.textContent);
        document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
        var ilog = cd.intro.log[cd.intro.log.length - 1];
        out0.introThenLesson = !$intro && !!S && !!cd.intro.seen[IL0.l.id] && ilog.lesson === IL0.l.id && ilog.intro === true && ilog.cards === IL0.l.intro.length;
        S = null; go('path');
        startLesson(IL0); out0.introNotAgain = !$intro && !!S; S = null;
      }
      ORDER.forEach(function (c) { DATA[c].lessons.forEach(function (x) { DATA[c].intro.seen[x.l.id] = DATA[c].intro.seen[x.l.id] || 1; }); });
      var out = out0, L0 = cd.lessons[0], xp0 = G.xp, logN = cd.log.length, hearts0 = G.hearts, n = 0, wrongDone = false, seenIds = {};
      startLesson(L0);
      while (S && n < 200) {
        var cur = S.cur, ok1 = wrongDone || seenIds[cur.id] ? true : false;
        if (!wrongDone) wrongDone = true;
        seenIds[cur.id] = 1;
        submit(makeGiven(cur, ok1)); afterFeedback(); n++;
      }
      out.lessonDone = !S; out.steps = n; out.xpGain = G.xp - xp0; out.logAdded = cd.log.length - logN; out.heartsLost = hearts0 - G.hearts;
      out.crown = (cd.ls[L0.l.id] || {}).c || 0; out.resultShown = !!document.querySelector('.result');
      // tap mode: sa as choices → click the right one → Enter → Enter
      G.input = 'tap';
      var saIt = cd.items.filter(function (x) { return x.type === 'sa'; })[0];
      startLesson(cd.lessons.filter(function (x) { return x.l.id === saIt._l; })[0], saIt);
      var chs = document.querySelectorAll('.qbody .choice'); out.tapChoices = chs.length;
      for (var ci = 0; ci < chs.length; ci++) if (D.normSA(chs[ci].lastChild.textContent) === D.normSA(saIt.answer)) chs[ci].click();
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
      var lastE = cd.log[cd.log.length - 1]; out.tapLogged = lastE.id === saIt.id && lastE.mode === 'tap' && lastE.ok === true;
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
      out.sheetClosedByEnter = !$sheet.classList.contains('show');
      S = null;
      // self-grade on a num item, answered with key "2"
      var numIt = cd.items.filter(function (x) { return x.type === 'num'; })[0];
      startLesson(cd.lessons.filter(function (x) { return x.l.id === numIt._l; })[0], numIt);
      selfReveal();
      document.dispatchEvent(new KeyboardEvent('keydown', { key: '2', bubbles: true }));
      lastE = cd.log[cd.log.length - 1]; out.selfLogged = lastE.id === numIt.id && lastE.mode === 'self' && lastE.ok === true && lastE.given === '(self:ok)';
      S = null; G.input = 'key';
      // keyboard 1–4 on an mc item
      var mcIt = cd.items.filter(function (x) { return x.type === 'mc'; })[0];
      startLesson(cd.lessons.filter(function (x) { return x.l.id === mcIt._l; })[0], mcIt);
      document.dispatchEvent(new KeyboardEvent('keydown', { key: '3', bubbles: true }));
      out.keySelect = document.querySelectorAll('.qbody .choice')[2].classList.contains('sel');
      S = null;
      if (HUB) { var m = 0; startMixed(); var cs = {}; while (S && m < 100) { cs[S.cur._c] = 1; submit(makeGiven(S.cur, true)); afterFeedback(); m++; } out.mixedDone = !S && m > 0; out.mixedCourses = Object.keys(cs).length; out.byC = Object.keys((G.days[today()] || {}).byC || {}).length; }
      enterBed(); bedFlow(false); var cl = cd.log.length; cfMark(true); cfMark(false);
      out.bedKnown = BED.known; out.bedUnknown = BED.unknown; out.cardLogs = ORDER.reduce(function (a, c) { return a + DATA[c].log.filter(function (e) { return e.m === 'card'; }).length; }, 0);
      sleepEnd(); out.slept = !!(BED && BED.slept && document.querySelector('.sleep')); out.nights = NIGHTS.length;
      var rep = HUB ? hubReportMd() : reportMd(cd);
      out.reportHasIntro = /개념 카드\(📖\) 본 레슨: [1-9]/.test(rep);
      out.reportLen = rep.length; out.reportHasNight = /누워서 모드 기록/.test(rep); out.reportHasMissed = /가장 많이 틀린 문항/.test(rep);
      exitBed(); out.bedExited = !BED && !document.body.classList.contains('bed');
      out.payloadOk = !!payload(cd).report && payload(cd).log.length === cd.log.length;
      if (HUB) out.hubPayloadOk = hubPayload().schema === 'duo-hub/1';
      window.__autoplay = out;
    }
    else go(scr);
  }

  /* ---------- keyboard shortcuts (mouse/keyboard users) ---------- */
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var tag = (e.target && e.target.tagName) || '', typing = tag === 'INPUT' || tag === 'TEXTAREA';
    if ($zoom) { if (e.key === 'Escape') closeZoom(); return; }
    if ($intro) {
      if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); introGo(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); introGo(-1); }
      else if (e.key === 'Escape') finishIntro(true);
      return;
    }
    if ($modal.classList.contains('show') || $wiki.classList.contains('show')) return;
    if ($sheet.classList.contains('show')) {
      if (e.key === 'Enter' || e.key === ' ') { var cb = $sheet.querySelector('.btn'); if (cb) { e.preventDefault(); cb.click(); } }
      return;
    }
    if (typing) return;
    if (CF) {
      if (e.key === '1' || e.key === 'ArrowLeft') cfMark(false);
      else if (e.key === '2' || e.key === 'ArrowRight') cfMark(true);
      else if (e.key === ' ') { e.preventDefault(); cfPause(); }
      else if (e.key === 'Enter') { if (CF.phase === 'q') { CF.gen++; cfReveal(); } else cfNext(); }
      return;
    }
    if (!S) return;
    if (/^[1-9]$/.test(e.key)) {
      var selfBtns = document.querySelectorAll('.selfrow button');
      var btns = selfBtns.length ? selfBtns : document.querySelectorAll('.qbody .choice, .qbody .tf');
      var b = btns[Number(e.key) - 1];
      if (b && !b.disabled) { e.preventDefault(); b.click(); }
    } else if (e.key === 'Enter') {
      var c = document.querySelector('.lfoot .check');
      if (c && !c.disabled) { e.preventDefault(); c.click(); }
    }
  });

  /* ---------- boot ---------- */
  if (DEMO) { seedDemo(); if (P.get('input')) G.input = P.get('input'); if (P.get('bed')) enterBed(); }
  ORDER.forEach(function (c) { touchCourse(DATA[c]); });
  heartsNow(); saveG();
  var scr = P.get('screen');
  if (scr) demoScreen(scr); else go(current);
  if (!DEMO && SYNC.token && SYNC.repo) setTimeout(function () { syncNow(true); }, 1500);
  if (P.has('probe')) setTimeout(function () {
    var info = { sw: document.documentElement.scrollWidth, cw: document.documentElement.clientWidth, screen: scr, auto: window.__autoplay || null, imgOk: [].filter.call(document.images, function (i) { return i.complete && i.naturalWidth > 0; }).length, imgBroken: document.querySelectorAll('.qimg.broken').length };
    var pr = document.createElement('pre'); pr.id = 'probe'; pr.textContent = JSON.stringify(info);
    document.body.appendChild(pr);
    try { if (window.parent !== window) window.parent.postMessage({ duoProbe: info }, '*'); } catch (e) { /* ignore */ }
  }, 600);
  window.addEventListener('online', function () { if (current === 'wiki') renderWikiTab(); });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !DEMO) {
    navigator.serviceWorker.register('sw.js').catch(function () { /* offline cache optional */ });
  }
})();
