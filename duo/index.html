= 224. \"255.255.255.27\" 은 함정.","src":"CH07(2) p.18","wiki":"address mask","tags":["address mask"],"introCard":0},{"id":"u6b-04","type":"num","q":"167.199.170.82/27 이 속한 block 의 first address 마지막 byte 는?","answer":64,"tol":0,"explain":"82 = 0101 0010, AND 1110 0000 = 0100 0000 = **64** → 167.199.170.64.","src":"CH07(2) p.13–15","wiki":"Example 7.1","tags":["Example 7.1"],"prof":true,"img":"img/cn6-gen-u6b-04.png","imgAlt":"167.199.170.82/27 의 32 bits — prefix 는 파랑, suffix 는 분홍","introCard":1},{"id":"u6b-05","type":"num","q":"167.199.170.82/27 이 속한 block 의 last address 마지막 byte 는?","answer":95,"tol":0,"explain":"first 64 + 32 − 1 = **95** (= 82 OR 0001 1111).","src":"CH07(2) p.13–15","wiki":"Example 7.1","tags":["Example 7.1"],"img":"img/cn6-gen-u6b-04.png","imgAlt":"167.199.170.82/27 의 32 bits — prefix 는 파랑, suffix 는 분홍","introCard":1},{"id":"u6b-06","type":"num","q":"/27 block 의 주소 수 N 은?","answer":32,"unit":"개","tol":0,"explain":"N = 2^(32−27) = **32**.","src":"CH07(2) p.12","wiki":"block의 세 가지 정보","tags":["block의 세 가지 정보"],"diff":1,"introCard":0},{"id":"u6b-07","type":"cloze","q":"first address = address ___ mask, last address = address ___ NOT(mask) 이다.","answer":["AND","OR"],"bank":["AND","OR","XOR","NAND","ADD"],"explain":"first 는 suffix 를 0 으로(AND mask), last 는 suffix 를 1 로(OR NOT mask). 거꾸로 외우는 함정.","src":"CH07(2) p.18","wiki":"address mask","tags":["address mask"],"introCard":1},{"id":"u6b-08","type":"num","q":"PS1 4(a): 205.16.37.39/28 의 first address 마지막 byte 는?","answer":32,"tol":0,"explain":"39 = 0010 0111 AND 1111 0000 = 0010 0000 = **32**. block = .32–.47, N = 16.","src":"PS1 4(a)","wiki":"address mask","tags":["address mask"],"prof":true,"img":"img/cn6-gen-u6b-08.png","imgAlt":"205.16.37.39/28 의 32 bits — prefix 는 파랑, suffix 는 분홍","introCard":1},{"id":"u6b-09","type":"num","q":"PS1 4(a): 205.16.37.39/28 의 last address 마지막 byte 는?","answer":47,"tol":0,"explain":"32 + 16 − 1 = **47** (39 OR 0000 1111 = 0010 1111).","src":"PS1 4(a)","wiki":"address mask","tags":["address mask"],"prof":true,"img":"img/cn6-gen-u6b-08.png","imgAlt":"205.16.37.39/28 의 32 bits — prefix 는 파랑, suffix 는 분홍","introCard":1},{"id":"u6b-10","type":"num","q":"230.8.24.56/20 이 속한 block 의 first address 셋째 byte 는?","answer":16,"tol":0,"explain":"/20 → 셋째 byte 의 block 폭 2^(8−4) = 16. 24 이하 16 의 배수 최대 = **16** → 230.8.16.0 (last 230.8.31.255).","src":"CH07(2) p.19","wiki":"Example 7.3","tags":["Example 7.3"],"img":"img/cn6-gen-u6b-10.png","imgAlt":"230.8.24.56/20 의 32 bits — prefix 는 파랑, suffix 는 분홍","introCard":1},{"id":"u6b-11","type":"num","q":"230.8.24.56/26 이 속한 block 의 last address 마지막 byte 는?","answer":63,"tol":0,"explain":"/26 → 마지막 byte 폭 64, 56 → first .0, last **.63** → 230.8.24.0–230.8.24.63.","src":"CH07(2) p.19","wiki":"Example 7.3","tags":["Example 7.3"],"img":"img/cn6-gen-u6b-11.png","imgAlt":"230.8.24.56/26 의 32 bits — prefix 는 파랑, suffix 는 분홍","introCard":1},{"id":"u6b-12","type":"mc","q":"230.8.24.56 을 /29 로 보면 block 은?","choices":["230.8.24.48–.55","230.8.24.56–.63","230.8.24.0–.63","230.8.24.56–.57"],"answer":1,"explain":"/29 → 폭 8, 56 은 8 의 배수 → .56–.63. 주소는 같아도 /n 에 따라 block 이 다르다 (Ex 7.3).","src":"CH07(2) p.19","wiki":"Example 7.3","tags":["Example 7.3"],"diff":3,"introCard":2},{"id":"u6b-13","type":"tf","q":"주어진 주소(예: 167.199.170.82/27)가 곧 block 의 first address 다.","answer":false,"explain":"주어진 주소는 block 안의 **any** address. first 는 AND mask 로 구한다(.64).","src":"CH07(2) p.13","wiki":"Example 7.1","tags":["Example 7.1"],"introCard":0},{"id":"u6b-14","type":"num","q":"/22 의 mask 셋째 byte 는?","answer":252,"tol":0,"explain":"22 = 8 + 8 + 6 → 셋째 byte 1111 1100 = **252** → 255.255.252.0.","src":"CH07(2) p.18","wiki":"address mask","tags":["address mask"],"introCard":1},{"id":"u6b-15","type":"sa","q":"[PS1 4(a) 변형] For the address 10.20.30.150/26, find the address mask (dotted-decimal).","answer":"255.255.255.192","explain":"/26 → 26 개의 1: 11111111.11111111.11111111.11000000 = **255.255.255.192**. 마지막 byte 1100 0000 = 192.","src":"PS1 4(a) 변형","wiki":"address mask","tags":["address mask"],"prof":true,"introCard":1},{"id":"u6b-16","type":"num","q":"[PS1 4(a) 변형] 10.20.30.150/26 의 first address 마지막 byte 는? (2진수로 AND)","answer":128,"tol":0,"explain":"150 = 1001 0110, mask 1100 0000 → AND = 1000 0000 = **128**. first = 10.20.30.128. 검산: 128 ÷ 64 = 2 ✓, 128 ≤ 150.","src":"PS1 4(a) 변형","wiki":"block의 세 가지 정보","tags":["block의 세 가지 정보"],"prof":true,"img":"img/cn6-gen-u6b-16.png","imgAlt":"10.20.30.150/26 의 32 bits — prefix 는 파랑, suffix 는 분홍","introCard":1},{"id":"u6b-17","type":"num","q":"[PS1 4(a) 변형] 10.20.30.150/26 이 속한 block 의 last address 마지막 byte 는?","answer":191,"tol":0,"explain":"150 OR NOT(mask) = 1001 0110 OR 0011 1111 = 1011 1111 = **191**. 검산: 191 − 128 + 1 = 64 = 2^(32−26) ✓.","src":"PS1 4(a) 변형","wiki":"block의 세 가지 정보","tags":["block의 세 가지 정보"],"prof":true,"img":"img/cn6-gen-u6b-16.png","imgAlt":"10.20.30.150/26 의 32 bits — prefix 는 파랑, suffix 는 분홍","introCard":1}],"intro":[{"title":"classless (CIDR) 와 block","body":"block 크기 N = 2^(32−n), prefix 길이 n 은 0~32 어디든 → 주소만으로 n 을 알 수 없어 **slash notation** a.b.c.d/n 로 적는다. n 이 1 늘면 block 은 절반.","img":"img/cn7b-p11-block.png","imgAlt":"any address 에서 N, first, last 구하기","src":"CH07(2) p.9–12"},{"title":"mask 와 first / last","body":"mask = n 개의 1 + (32−n) 개의 0 (/27 = 255.255.255.224). **first = address AND mask**(suffix 를 0 으로), **last = address OR NOT(mask)**(suffix 를 1 로). 예: 167.199.170.82/27 → 82 = 0101 0010 → first .64, last .95.","img":"img/cn7b-p18-mask.png","imgAlt":"address mask 와 세 공식","src":"CH07(2) p.13–18"},{"title":"주소 하나 ≠ block","body":"같은 230.8.24.56 도 /16 이면 230.8.0.0–230.8.255.255, /26 이면 230.8.24.0–.63, /29 면 .56–.63 처럼 prefix 에 따라 다른 block 에 속한다. 항상 /n 을 함께 준다.","src":"CH07(2) p.19"}]},{"id":"u6c","title":"주소 할당과 subnetting","items":[{"id":"u6c-01","type":"mc","q":"ICANN 이 주소 block 을 할당하는 대상은?","choices":["개인 사용자","ISP·large organizations","모든 host","BS"],"answer":1,"explain":"ICANN → ISP·large org. 개인은 ISP 에서 받는다 (p.21).","src":"CH07(2) p.21","wiki":"ICANN","tags":["ICANN"],"introCard":0},{"id":"u6c-02","type":"match","q":"CIDR block 의 세 규칙","pairs":[["규칙 ①","주소 수 N 은 2 의 거듭제곱"],["규칙 ②","주소가 contiguous (연속)"],["규칙 ③","first address 가 N 으로 나누어떨어짐"],["18.14.12.0/22","302,910,464 = 1024 × 295,811 → 규칙 ③ 만족"]],"explain":"p.21: ① N 은 2 의 거듭제곱(suffix 비트로 딱 떨어지게) ② 주소가 빈틈없이 연속 ③ first address 가 N 으로 나누어떨어짐(= suffix 비트가 모두 0). ③ 을 어기면 first address AND mask 가 자기 자신이 아니게 된다. subnet 을 나눌 때도 같은 세 규칙.","src":"CH07(2) p.21–22","wiki":"CIDR","tags":["CIDR"],"introCard":0},{"id":"u6c-03","type":"num","q":"ISP 가 주소 1,000 개를 요청했다. 줄 수 있는 CIDR block 의 prefix 길이 n 은?","answer":22,"tol":0,"explain":"1000 → 2 의 거듭제곱으로 올려 1024 = 2^10 → n = 32 − 10 = **22**. \"prefix 10 bits\" 는 교수도 정정한 실수.","src":"CH07(2) p.22","wiki":"Example 7.4","tags":["Example 7.4"],"prof":true,"img":"img/cn7b-p22-ex74.png","imgAlt":"p.22 Example 7.4 풀이 — ② 의 n 값과 ③ 의 block 이 ? 로 가려져 있다","explainImg":"img/cn7b-p22-ex74-ans.png","introCard":0},{"id":"u6c-04","type":"tf","q":"주소 1,000 개 요청에 18.14.12.0/22 block 을 주었다. first address 가 1,024 로 나누어떨어지므로 유효한 CIDR block 이다.","answer":true,"explain":"18.14.12.0 = 302,910,464 = 1024 × 295,811 ✓.","src":"CH07(2) p.22","wiki":"Example 7.4","tags":["Example 7.4"],"img":"img/cn6-gen-u6c-04.png","imgAlt":"18.14.12.0/22 의 32 bits — prefix 는 파랑, suffix 는 분홍","introCard":0},{"id":"u6c-05","type":"mc","q":"PS1 4(b): CIDR block 의 first address 가 될 수 **없는** 것은?","choices":["200.1.4.0/22","200.1.6.0/22","150.20.33.96/27","모두 가능"],"answer":1,"explain":"/22 → 셋째 byte 폭 4. 6 은 4 의 배수가 아니다 (6 = 0000 01|10, host bit 에 1). 200.1.6.0 은 200.1.4.0/22 에 속한다.","src":"PS1 4(b)","wiki":"CIDR","tags":["CIDR"],"prof":true,"introCard":0},{"id":"u6c-06","type":"tf","q":"subnet 을 만들 때는 작은 요청부터 차례로 놓아도 된다.","answer":false,"explain":"**largest first**. 작은 것부터 놓으면 큰 subnet 의 first 가 그 크기의 배수가 안 되어 규칙 ③ 위반.","src":"CH07(2) p.23–26","wiki":"subnetting","tags":["subnetting"],"introCard":1},{"id":"u6c-07","type":"order","q":"14.24.74.0/24 를 120·60·10 개 요청의 subnet 으로 나눈다. 배치 순서를 놓으시오","answer":["120 → 128 (/25)","60 → 64 (/26)","10 → 16 (/28)"],"explain":"largest first: /25 .0–.127, /26 .128–.191, /28 .192–.207.","src":"CH07(2) p.24–26","wiki":"Example 7.5 subnet 설계","tags":["Example 7.5 subnet 설계"],"img":"img/cn7b-p25-ex75.png","imgAlt":"p.25 Example 7.5 표 — Need 120·60·10, Allocate 128·64·16 까지만 보이고 Prefix·First·Last address 열이 가려져 있다","explainImg":"img/cn7b-p25-ex75-ans.png","introCard":1},{"id":"u6c-08","type":"num","q":"14.24.74.0/24 (256 개) 에 subnet 128 + 64 + 16 개를 배치한 뒤 남는 주소 수는?","answer":48,"unit":"개","tol":0,"explain":"256 − 208 = **48** (.208–.255). 48 은 2 의 거듭제곱이 아니라 \"prefix not decided yet\".","src":"CH07(2) p.26","wiki":"Example 7.5 subnet 설계","tags":["Example 7.5 subnet 설계"],"img":"img/cn6-gen-u6c-08.png","imgAlt":"14.24.74.0/24 막대에 128·64·16 개 subnet, 남은 곳은 ?","introCard":1},{"id":"u6c-09","type":"sa","q":"14.24.74.0/24 를 120·60·10 개 요청에 큰 것부터 나눌 때, 10 개 요청 subnet 의 주소를 slash notation 으로 (first address/n)","answer":"14.24.74.192/28","explain":"128 + 64 = 192 다음에 16 개 → 14.24.74.192/28. 슬라이드 그림의 14.24.192.0/28 은 오타.","src":"CH07(2) p.26","wiki":"Example 7.5 subnet 설계","tags":["Example 7.5 subnet 설계"],"diff":3,"img":"img/cn7b-p26-subblocks.png","imgAlt":"p.26 Example 7.5 subblock 그림 — 세 번째(16 개) subblock 아래 주소가 ? 로 가려져 있다","explainImg":"img/cn7b-p26-subblocks-ans.png","introCard":1},{"id":"u6c-10","type":"num","q":"PS1 4(c): 130.56.16.0/22 에서 300 개 요청 subnet 의 prefix 는?","answer":23,"tol":0,"explain":"300 → 512 = 2^9 → /23 → 130.56.16.0/23 (16.0–17.255).","src":"PS1 4(c)","wiki":"subnetting","tags":["subnetting"],"prof":true,"introCard":1},{"id":"u6c-11","type":"num","q":"PS1 4(c): 300·200·100·50 요청(512+256+128+64)을 배치한 뒤 /22 에 남는 주소 수는?","answer":64,"unit":"개","tol":0,"explain":"1024 − 960 = **64** → 130.56.19.192/26 하나의 block 으로 쓸 수 있다(64 = 2^6, 시작이 64 의 배수).","src":"PS1 4(c)","wiki":"subnetting","tags":["subnetting"],"prof":true,"img":"img/cn6-gen-u6c-11.png","imgAlt":"130.56.16.0/22 막대에 512·256·128·64 개를 큰 것부터 배치, 남은 곳은 ?","introCard":1},{"id":"u6c-12","type":"cloze","q":"PS1 4(c): 130.56.16.0/22 를 300·200·100·50 개 요청에 큰 것부터(/23 130.56.16.0, /24 130.56.18.0, …) 나눌 때, 100 개 요청은 130.56.19.0/___, 50 개 요청은 130.56.19.___/26 이다.","answer":["25","128"],"bank":["25","128","24","192","64"],"explain":"/23 16.0, /24 18.0, /25 19.0–19.127, /26 19.128–19.191.","src":"PS1 4(c)","wiki":"subnetting","tags":["subnetting"],"prof":true,"diff":3,"img":"img/cn6-gen-u6c-11.png","imgAlt":"130.56.16.0/22 막대에 512·256·128·64 개를 큰 것부터 배치, 남은 곳은 ?","introCard":1},{"id":"u6c-13","type":"tf","q":"14.24.74.0/24 에 128 + 64 + 16 개를 배치하고 남은 48 개(14.24.74.208–255)는 CIDR block 하나(/n)로 묶어 쓸 수 있다.","answer":false,"explain":"48 은 2 의 거듭제곱이 아니다. 쓰려면 /28(16) + /27(32) 로 다시 쪼갠다.","src":"CH07(2) p.26","wiki":"Example 7.5 subnet 설계","tags":["Example 7.5 subnet 설계"],"img":"img/cn6-gen-u6c-13.png","imgAlt":"14.24.74.0/24 막대에 128·64·16 개 subnet 과 남은 48 개","introCard":1},{"id":"u6c-14","type":"mc","q":"[PS1 4(b) 변형] Which address can be the first address of a CIDR block?","choices":["172.16.12.0/21","10.0.0.144/27","172.16.8.0/21","10.0.0.204/29"],"answer":2,"explain":"first address 는 host 비트가 모두 0 = 주소가 block 크기로 나누어떨어져야 한다. /21 은 셋째 byte 기준 8 칸: 8 ÷ 8 ✓, 12 ÷ 8 ✗. /27 은 32 칸: 144 ÷ 32 = 4.5 ✗. /29 는 8 칸: 204 ÷ 8 = 25.5 ✗. → **172.16.8.0/21**.","src":"PS1 4(b) 변형","wiki":"CIDR","tags":["CIDR"],"prof":true,"introCard":2},{"id":"u6c-15","type":"sa","q":"[PS1 4(c) 변형] 200.10.32.0/22 를 250·120·60·30 개 요청에 큰 것부터 나눠 줄 때, 60 개 요청의 subblock 은? (x.x.x.x/n)","answer":"200.10.33.128/26","explain":"2 의 거듭제곱으로 올림: 256(/24) · 128(/25) · 64(/26) · 32(/27). 큰 것부터: 200.10.32.0/24 → 200.10.33.0/25 → **200.10.33.128/26** → 200.10.33.192/27. 시작 주소가 각 크기로 나누어떨어지는지 확인(33.128 = 8,576 ÷ 64 = 134 ✓).","src":"PS1 4(c) 변형","wiki":"subnetting","tags":["subnetting"],"prof":true,"img":"img/cn6-gen-u6c-15.png","imgAlt":"200.10.32.0/22 막대에 256·128·64·32 개를 큰 것부터 배치, 남은 곳은 ?","introCard":1},{"id":"u6c-16","type":"num","q":"[PS1 4(c) 변형] 200.10.32.0/22 를 250·120·60·30 개 요청에 큰 것부터(256·128·64·32) 나눠 준 뒤 남는 주소 수는?","answer":544,"unit":"개","tol":0,"explain":"1,024 − (256 + 128 + 64 + 32) = 1,024 − 480 = **544**. 544 는 2 의 거듭제곱이 아니라 CIDR block 하나로 묶을 수 없다 (Ex 7.5 의 48 과 같은 상황, PS1 4(c) 의 64 와는 반대).","src":"PS1 4(c) 변형","wiki":"subnetting","tags":["subnetting"],"prof":true,"img":"img/cn6-gen-u6c-15.png","imgAlt":"200.10.32.0/22 막대에 256·128·64·32 개를 큰 것부터 배치, 남은 곳은 ?","introCard":1}],"intro":[{"title":"CIDR block 의 세 규칙","body":"ICANN 이 ISP·큰 조직에 큰 block 을 준다. ① N 은 2 의 거듭제곱 ② 주소가 연속 ③ first address 가 N 으로 나누어떨어짐(= suffix 비트 모두 0). 1,000 개 요청 → 1,024 = 2^10 → n = 22.","img":"img/cn7b-p21-alloc.png","imgAlt":"ICANN → ISP → customers, CIDR 제약","src":"CH07(2) p.20–22"},{"title":"subnetting: 큰 것부터","body":"요청마다 2 의 거듭제곱으로 올림, n_sub = 32 − log2 N_sub, **가장 큰 것부터** 배치해야 시작 주소가 각 크기로 나누어떨어진다. 14.24.74.0/24 에 120·60·10 → .0/25, .128/26, .192/28, 남은 48 개는 2 의 거듭제곱이 아니라 block 하나가 못 된다.","img":"img/cn7b-p26-subblocks-ans.png","imgAlt":"14.24.74.0/24 를 /25, /26, /28 로 나눈 그림","src":"CH07(2) p.23–26 · PS1 4(c)"},{"title":"first address 판정 (PS1 4(b))","body":"a.b.c.d/n 이 block 의 first address 이려면 host 비트(32 − n 개)가 모두 0 = 주소가 block 크기로 나누어떨어져야 한다. /22 는 셋째 byte 가 4 의 배수(넷째 0), /27 은 넷째 byte 가 32 의 배수.","src":"PS1 4(b)"}]},{"id":"u6d","title":"Address aggregation","items":[{"id":"u6d-01","type":"mc","q":"address aggregation 의 뜻은?","choices":["subnet 을 더 잘게 나누기","작은 block 여러 개를 큰 block 하나로 묶어 광고 (summarization)","MAC 을 IP 로 바꾸기","IPv4 를 IPv6 로 바꾸기"],"answer":1,"explain":"= address/route summarization. forwarding table 이 작아진다.","src":"CH07(2) p.27–28","wiki":"address aggregation","tags":["address aggregation"],"introCard":0},{"id":"u6d-02","type":"num","q":"160.70.14.0/26, .64/26, .128/26, .192/26 네 block 을 하나로 묶어 광고할 block 의 prefix 길이는?","answer":24,"tol":0,"explain":"4 × 64 = 256 = 2^8 → /24 → **160.70.14.0/24**.","src":"CH07(2) p.28","wiki":"Example 7.6","tags":["Example 7.6"],"img":"img/cn7b-p28-ex76.png","imgAlt":"p.28 Example 7.6 — Block 1~4 (/26 네 개)가 ISP 로 모이고, ISP 가 광고하는 주소 범위가 ? 로 가려져 있다","explainImg":"img/cn7b-p28-ex76-ans.png","introCard":0},{"id":"u6d-03","type":"tf","q":"PS1 4(d)(ii): 140.24.7.0/26, .64/26, .128/26 세 개(192 주소)는 CIDR block 하나로 광고할 수 있다.","answer":false,"explain":"192 는 2 의 거듭제곱이 아니다. /24 로 광고하면 다른 ISP 의 .192/26 까지 덮는다 → {140.24.7.0/25, 140.24.7.128/26}.","src":"PS1 4(d)","wiki":"address aggregation","tags":["address aggregation"],"prof":true,"img":"img/cn6-gen-u6d-03.png","imgAlt":"140.24.7.0/24 안의 /26 네 칸 .0·.64·.128 (자기 것) 과 .192 (남의 것)","introCard":0},{"id":"u6d-04","type":"sa","q":"PS1 4(d)(ii): .0/26 과 .64/26 을 합친 block 은? (140.24.7.x/n 형식)","answer":"140.24.7.0/25","explain":"64 + 64 = 128, 시작 0 은 128 의 배수 → /25.","src":"PS1 4(d)","wiki":"address aggregation","tags":["address aggregation"],"prof":true,"img":"img/cn6-gen-u6d-03.png","imgAlt":"140.24.7.0/24 안의 /26 네 칸 .0·.64·.128 (자기 것) 과 .192 (남의 것)","introCard":0},{"id":"u6d-05","type":"cloze","q":"aggregation 의 prefix 는 묶이는 block 들의 ___ prefix 길이이고, 그 결과 forwarding table 이 ___ 진다.","answer":["공통","작아"],"bank":["공통","작아","가장 긴","커","무작위"],"explain":"0 = 00|000000, 64 = 01|…, 128 = 10|…, 192 = 11|… → 앞 24 bits 공통 → /24.","src":"CH07(2) p.28","wiki":"address aggregation","tags":["address aggregation"],"introCard":0},{"id":"u6d-06","type":"num","q":"regional ISP 가 받은 120.14.64.0/18 block 하나의 주소 수는?","answer":16384,"unit":"개","tol":0,"explain":"2^(32−18) = 2^14 = **16,384**. hierarchical routing: /30 → /23 → /20 → /18.","src":"CH07(2) p.68","wiki":"hierarchical routing","tags":["hierarchical routing"],"img":"img/cn7b-p68-ex722.png","imgAlt":"p.68 Example 7.22 hierarchical routing — Regional ISP 의 prefix 길이와 Total 이 ? 로 가려져 있다","explainImg":"img/cn7b-p68-ex722-ans.png","introCard":1},{"id":"u6d-07","type":"num","q":"/20 block 의 주소 수는?","answer":4096,"unit":"개","tol":0,"explain":"2^12 = **4,096**.","src":"CH07(2) p.68","wiki":"hierarchical routing","tags":["hierarchical routing"],"diff":1,"introCard":1},{"id":"u6d-08","type":"mc","q":"떨어진 곳에 있는 조직의 block 을 aggregation 과 함께 처리하는 방법은?","choices":["광고하지 않는다","별도 행(더 긴 prefix)으로 두고 longest match 로 처리","/0 으로 바꾼다","IPv6 로 옮긴다"],"answer":1,"explain":"p.66: 큰 block 은 하나로 광고하고, 예외 조직은 더 긴 prefix 행으로 → longest prefix match 가 그쪽을 고른다.","src":"CH07(2) p.66","wiki":"longest mask matching","tags":["longest mask matching"],"diff":3,"introCard":0},{"id":"u6d-09","type":"num","q":"/26 block 4 개를 묶으면 주소는 모두 몇 개?","answer":256,"unit":"개","tol":0,"explain":"4 × 2^6 = **256**.","src":"CH07(2) p.28","wiki":"Example 7.6","tags":["Example 7.6"],"diff":1,"introCard":0},{"id":"u6d-10","type":"tf","q":"aggregation 으로 묶으려면 block 들이 연속(contiguous)이고 합친 크기가 2 의 거듭제곱이며 시작이 그 크기의 배수여야 한다.","answer":true,"explain":"결국 CIDR block 세 규칙을 합친 block 에 적용하는 것이다.","src":"CH07(2) p.21,28","wiki":"address aggregation","tags":["address aggregation"],"diff":3,"introCard":0},{"id":"u6d-11","type":"match","q":"prefix 와 주소 수","pairs":[["/24","256"],["/25","128"],["/26","64"],["/28","16"]],"explain":"N = 2^(32−n).","src":"CH07(2) p.12","wiki":"block의 세 가지 정보","tags":["block의 세 가지 정보"],"diff":1,"introCard":0},{"id":"u6d-12","type":"sa","q":"[PS1 4(d) 변형] 10.1.1.0/27, 10.1.1.32/27, 10.1.1.64/27, 10.1.1.96/27 를 하나로 광고할 block 은? (x.x.x.x/n)","answer":"10.1.1.0/25","explain":"4 × 32 = 128 = 2^7 주소, 0 부터 연속, 0 ÷ 128 ✓ → prefix 32 − 7 = 25 → **10.1.1.0/25**. 넷째 byte 0·32·64·96 은 앞 1 bit(0)가 공통.","src":"PS1 4(d) 변형","wiki":"address aggregation","tags":["address aggregation"],"prof":true,"img":"img/cn6-gen-u6d-12.png","imgAlt":"/27 네 block 10.1.1.0·.32·.64·.96","introCard":0},{"id":"u6d-13","type":"mc","q":"[PS1 4(d)(ii) 변형] 10.1.1.0/27, 10.1.1.32/27, 10.1.1.64/27 세 block(10.1.1.96/27 은 다른 ISP 로 옮겨 감)을 정확히 덮는 가장 적은 block 집합은?","choices":["10.1.1.0/25","{10.1.1.0/26, 10.1.1.64/27}","{10.1.1.0/27, 10.1.1.32/26}","10.1.1.0/26"],"answer":1,"explain":"96 개는 2 의 거듭제곱이 아니라 block 하나는 불가. .0 + .32 → 64 개, 0 ÷ 64 ✓ → 10.1.1.0/26. 남은 .64/27 은 혼자. /25 는 남의 .96/27 까지 덮어 \"exactly\" 위반. ③ 은 .32/26 의 시작이 64 로 안 나누어떨어져 틀린 block.","src":"PS1 4(d) 변형","wiki":"address aggregation","tags":["address aggregation"],"prof":true,"img":"img/cn6-gen-u6d-13.png","imgAlt":"/27 네 칸 중 .0·.32·.64 는 남고 .96 은 다른 ISP","introCard":2}],"intro":[{"title":"address aggregation","body":"여러 작은 block 을 하나의 큰 block 으로 묶어 광고(route summarization) → 밖의 router 는 큰 block 의 prefix 하나만 알면 된다. 조건: 연속, 합이 2 의 거듭제곱, 시작이 그 크기의 배수. 160.70.14.0/26 × 4 → 160.70.14.0/24.","img":"img/cn7b-p28-ex76-ans.png","imgAlt":"Block 1~4 를 ISP 가 /24 하나로 광고","src":"CH07(2) p.27–28"},{"title":"떨어진 조직과 계층","body":"한 조직이 멀리 있으면 그 block 행을 따로 두고 longest mask 부터 비교한다. ISP 계층(regional /18 → local /20 → small /23 …)으로 나누면 forwarding table 이 작아진다. /n 의 주소 수 = 2^(32−n).","img":"img/cn7b-p68-ex722-ans.png","imgAlt":"Regional ISP 120.14.64.0/18 아래 local ISP 들","src":"CH07(2) p.63–68"},{"title":"묶을 수 없을 때 (PS1 4(d)(ii))","body":"남은 block 들의 합이 2 의 거듭제곱이 아니면 block 하나로 정확히 덮을 수 없다. 묶을 수 있는 것끼리(연속·크기 배수 시작)만 합쳐 가장 적은 block 집합을 만든다. 예: .0/26 + .64/26 = .0/25, .128/26 은 혼자.","src":"PS1 4(d)"}]}]},{"id":"u7","title":"7강 IPv4 데이터그램","desc":"header 필드 · hex 해석 · fragmentation(offset·M) · ICMPv4 · longest mask forwarding","lessons":[{"id":"u7a","title":"IPv4 header 필드","items":[{"id":"u7a-01","type":"mc","q":"IPv4 header 길이 범위는?","choices":["8 bytes 고정","20–60 bytes","40 bytes 고정","20–40 bytes"],"answer":1,"explain":"5 rows × 4 B = 20 B 기본 + options 최대 40 B → **20–60 B**. 40 B 고정은 IPv6 base header.","src":"CH07(2) p.31–32","wiki":"IPv4 datagram format","tags":["IPv4 datagram format"],"diff":1,"introCard":0},{"id":"u7a-02","type":"match","q":"필드와 단위","pairs":[["HLEN","4-byte 단위"],["total length","1-byte 단위 (header 포함)"],["fragmentation offset","8-byte 단위"],["TTL","hop 수 (라우터마다 −1)"]],"explain":"HLEN ×4, total ×1, offset ×8 — 단위가 다 다르다.","src":"CH07(2) p.33–46","wiki":"HLEN","tags":["HLEN"],"introCard":1},{"id":"u7a-03","type":"tf","q":"total length 는 data 부분의 길이만 센다.","answer":false,"explain":"total length 는 **header 포함**. data = total − HLEN × 4.","src":"CH07(2) p.34","wiki":"total length","tags":["total length"],"introCard":1},{"id":"u7a-04","type":"cloze","q":"HLEN 이 5 면 header 는 ___ bytes, 15 면 ___ bytes 다.","answer":["20","60"],"bank":["20","60","5","15","40"],"explain":"HLEN × 4. 4 bits 최대값 15 → 60 B.","src":"CH07(2) p.33","wiki":"HLEN","tags":["HLEN"],"diff":1,"img":"img/cn7b-p32-header-ans.png","imgAlt":"IPv4 header format: VER·HLEN·Service type·Total length / Identification·Flags·Fragmentation offset / TTL·Protocol·Header checksum / Source·Destination address / Options","introCard":1},{"id":"u7a-05","type":"match","q":"protocol field 값","pairs":[["1","ICMP"],["2","IGMP"],["6","TCP"],["17","UDP"],["89","OSPF"]],"explain":"protocol field = datagram 이 싣고 있는 상위 프로토콜.","src":"CH07(2) p.36","wiki":"protocol field","tags":["protocol field"],"img":"img/cn7b-p36-protocol.png","imgAlt":"p.36 protocol field 그림 — Transport 의 TCP·UDP, Network 의 ICMP·IGMP·OSPF 가 Payload 로 내려온다. 왼쪽 \"Some protocol values\" 상자가 ? 로 가려져 있다","explainImg":"img/cn7b-p36-protocol-ans.png","introCard":0},{"id":"u7a-06","type":"mc","q":"header checksum 에 대한 설명으로 옳은 것은?","choices":["payload 까지 검사","header 만 검사, 라우터마다 재계산","source 에서 한 번만 계산","오류를 정정한다"],"answer":1,"explain":"\"Checks errors in the header only … Recalculated at every router (e.g., TTL changes)\" (p.37).","src":"CH07(2) p.37","wiki":"header checksum","tags":["header checksum"],"introCard":2},{"id":"u7a-07","type":"sa","q":"header checksum 을 라우터마다 다시 계산해야 하는 이유가 되는, hop 마다 1 씩 줄어드는 필드는?","answer":"TTL","alts":["Time to live","time-to-live"],"explain":"TTL 이 바뀌면 header 가 바뀌니 checksum 도 새로 계산한다. fragmentation 이면 flags·offset·total length 도 바뀐다.","src":"CH07(2) p.35,37","wiki":"TTL","tags":["TTL"],"img":"img/cn7b-p32-header-ans.png","imgAlt":"IPv4 header format: VER·HLEN·Service type·Total length / Identification·Flags·Fragmentation offset / TTL·Protocol·Header checksum / Source·Destination address / Options","introCard":0},{"id":"u7a-08","type":"tf","q":"source·destination IP 주소는 경로 내내 바뀌지 않는다.","answer":true,"explain":"라우터는 next hop 으로 보내도 IP 주소 필드는 그대로 둔다 (바뀌는 건 frame 의 MAC).","src":"CH07(2) p.37","wiki":"IPv4 datagram format","tags":["IPv4 datagram format"],"introCard":2},{"id":"u7a-09","type":"mc","q":"TTL 이 0 이 되면?","choices":["다음 라우터로 그냥 보낸다","datagram 을 discard 하고 ICMP time exceeded(type 11) 를 source 로","TTL 을 64 로 재설정","destination 이 재조립"],"answer":1,"explain":"라우터마다 −1, 0 이면 discard → ICMP type 11. traceroute 가 이것을 이용한다.","src":"CH07(2) p.35","wiki":"TTL","tags":["TTL"],"introCard":2},{"id":"u7a-10","type":"sa","q":"IPv4 header 의 service type 필드가 지금은 무엇으로 해석되나? (영문)","answer":"DiffServ","alts":["Differentiated Services","differentiated services"],"explain":"Service type = DiffServ (p.33).","src":"CH07(2) p.33","wiki":"service type","tags":["service type"],"img":"img/cn7b-p32-header-ans.png","imgAlt":"IPv4 header format: VER·HLEN·Service type·Total length / Identification·Flags·Fragmentation offset / TTL·Protocol·Header checksum / Source·Destination address / Options","introCard":0},{"id":"u7a-11","type":"num","q":"total length 필드(16 bits)로 표현할 수 있는 datagram 최대 길이는?","answer":65535,"unit":"bytes","tol":0,"explain":"2^16 − 1 = **65,535** bytes (header 포함).","src":"CH07(2) p.34","wiki":"total length","tags":["total length"],"diff":1,"img":"img/cn7b-p32-header-ans.png","imgAlt":"IPv4 header format: VER·HLEN·Service type·Total length / Identification·Flags·Fragmentation offset / TTL·Protocol·Header checksum / Source·Destination address / Options","introCard":0},{"id":"u7a-12","type":"tf","q":"PS1 3(e): 앞 링크에서 payload 만 깨지고 header 는 멀쩡하면 IP 는 그 오류를 검출한다.","answer":false,"explain":"IP checksum 은 header 만 덮는다 → 검출 못 함. 책임은 transport layer(TCP/UDP checksum), hop 단위로는 data-link CRC.","src":"PS1 3(e)","wiki":"header checksum","tags":["header checksum"],"prof":true,"img":"img/cn5-gen-u5b-13.png","imgAlt":"Header 는 멀쩡하고 Payload 만 깨진 IPv4 datagram","introCard":2},{"id":"u7a-13","type":"match","q":"그림은 IPv4 header format 이다. 가린 필드 ①~⑤ 를 연결하시오","pairs":[["① (16 bits)","Identification"],["② (3 bits)","Flags"],["③ (13 bits)","Fragmentation offset"],["④ (8 bits)","Time-to-live"],["⑤ (16 bits)","Header checksum"]],"explain":"둘째 행 = fragmentation 3 형제(Identification 16 · Flags 3 · Fragmentation offset 13), 셋째 행 = TTL 8 · Protocol 8 · Header checksum 16. 비트 수가 행마다 32 로 맞는다.","src":"CH07(2) p.32","wiki":"IPv4 datagram format","tags":["IPv4 datagram format"],"img":"img/cn7b-p32-header.png","imgAlt":"p.32 IPv4 header format — 둘째·셋째 행 필드 이름 ①~⑤ 가 가려져 있다 (비트 수는 보인다)","explainImg":"img/cn7b-p32-header-ans.png","introCard":0}],"intro":[{"title":"IPv4 header","body":"header 20–60 bytes(5 rows × 4 B + options ≤ 40 B), datagram 최대 65,535 B. 첫 행 VER 4 · HLEN 4 · service type 8 · total length 16 / 둘째 행 identification 16 · flags 3 · fragmentation offset 13 / 셋째 행 TTL 8 · protocol 8 · header checksum 16 / source·destination address 32 씩.","img":"img/cn7b-p32-header-ans.png","imgAlt":"IPv4 header format","src":"CH07(2) p.31–32"},{"title":"단위가 다른 세 필드","body":"HLEN = 4-byte 단위(5 → 20 B, 15 → 60 B), total length = byte 단위 **header 포함**(data = total − HLEN × 4), fragmentation offset = **8-byte** 단위.","src":"CH07(2) p.33–34"},{"title":"TTL · protocol · checksum","body":"TTL: router 마다 1 감소, 0 이면 discard. protocol: ICMP 1, IGMP 2, TCP 6, UDP 17, OSPF 89. header checksum 은 **header 만** 덮고 매 router 에서 다시 계산(TTL 이 바뀌므로). source·destination 주소는 끝까지 그대로.","img":"img/cn7b-p36-protocol-ans.png","imgAlt":"protocol field 값","src":"CH07(2) p.35–37"}]},{"id":"u7b","title":"header hex 해석","items":[{"id":"u7b-01","type":"num","q":"IPv4 datagram 의 HLEN = 5, total length = 0x0028 이다. data 는 몇 bytes?","answer":20,"unit":"bytes","tol":0,"explain":"0x0028 = 40, header 5 × 4 = 20 → 40 − 20 = **20 B**.","src":"CH07(2) p.40","wiki":"Example 7.9 데이터 길이","tags":["Example 7.9 데이터 길이"],"img":"img/cn7b-p32-header-ans.png","imgAlt":"IPv4 header format: VER·HLEN·Service type·Total length / Identification·Flags·Fragmentation offset / TTL·Protocol·Header checksum / Source·Destination address / Options","introCard":0},{"id":"u7b-02","type":"mc","q":"IPv4 packet 의 첫 8 bits 가 0100 0010 이다. 수신자가 이 packet 을 버리는 이유는?","choices":["version 이 4 가 아니라서","HLEN 2 → 8 B \u003c 20 B 라 header 가 손상","TTL 이 0","protocol 오류"],"answer":1,"explain":"VER 0100 = 4 ✓. HLEN 0010 = 2 → 8 B 는 최소 20 B 보다 작다 → corrupted. 함정: version 때문이 아니다.","src":"CH07(2) p.39","wiki":"Example 7.7 버전 판정","tags":["Example 7.7 버전 판정"],"diff":3,"img":"img/cn7b-p39-ex77.png","imgAlt":"p.39 Example 7.7 — 첫 byte 0100 | 0010, VER = 4 ✓ 옆 HLEN 판정이 ? 로 가려져 있다","explainImg":"img/cn7b-p39-ex77-ans.png","introCard":0},{"id":"u7b-03","type":"num","q":"PS1 5(a): 45 00 00 54 … 에서 data 길이는? (HLEN 5, total 0x0054)","answer":64,"unit":"bytes","tol":0,"explain":"0x0054 = 84, header 20 → **64 B**.","src":"PS1 5(a)","wiki":"total length","tags":["total length"],"prof":true,"img":"img/cn7-gen-u7b-03.png","imgAlt":"IPv4 header 앞 10 bytes 45 00 00 54 1C 46 40 00 40 06 과 byte 번호·필드 묶음","introCard":0},{"id":"u7b-04","type":"num","q":"PS1 5(a): 9 번째 byte(TTL) 가 0x40 이면 앞으로 몇 hop 갈 수 있나?","answer":64,"unit":"hops","tol":0,"explain":"0x40 = 4 × 16 = **64**.","src":"PS1 5(a)","wiki":"TTL","tags":["TTL"],"prof":true,"img":"img/cn7-gen-u7b-03.png","imgAlt":"IPv4 header 앞 10 bytes 45 00 00 54 1C 46 40 00 40 06 과 byte 번호·필드 묶음","introCard":0},{"id":"u7b-05","type":"mc","q":"PS1 5(a): 10 번째 byte(protocol) 가 0x06 이면?","choices":["ICMP","UDP","TCP","IGMP"],"answer":2,"explain":"6 = TCP. UDP 는 17(= hex 11).","src":"PS1 5(a)","wiki":"protocol field","tags":["protocol field"],"prof":true,"diff":1,"img":"img/cn7-gen-u7b-03.png","imgAlt":"IPv4 header 앞 10 bytes 45 00 00 54 1C 46 40 00 40 06 과 byte 번호·필드 묶음","introCard":0},{"id":"u7b-06","type":"mc","q":"PS1 5(a): flags+offset 2 bytes 가 0x4000 이면?","choices":["M = 1, fragment 의 첫 조각","D = 1, M = 0, offset 0 → fragment 아님 (쪼개지 말 것)","offset 4000","reserved bit = 1"],"answer":1,"explain":"0100 0000 0000 0000 → reserved 0 | D 1 | M 0 | offset 0. D = 1 은 \"쪼개지 마\" 이지 fragment 라는 뜻이 아니다.","src":"PS1 5(a)","wiki":"flags D와 M","tags":["flags D와 M"],"prof":true,"diff":3,"img":"img/cn7-gen-u7b-03.png","imgAlt":"IPv4 header 앞 10 bytes 45 00 00 54 1C 46 40 00 40 06 과 byte 번호·필드 묶음","introCard":0},{"id":"u7b-07","type":"num","q":"IPv4 header hex 덤프 45 00 00 28 00 01 00 00 01 11 … 에서 10 번째 byte(protocol)가 0x11 이다. protocol 번호(10진)는?","answer":17,"tol":0,"explain":"0x11 = 17 → **UDP**. byte 번호는 1 부터 센다 (TTL = 9 번째, protocol = 10 번째).","src":"CH07(2) p.41","wiki":"Example 7.10 TTL과 protocol","tags":["Example 7.10 TTL과 protocol"],"img":"img/cn7-gen-u7b-07.png","imgAlt":"IPv4 header 앞 10 bytes 45 00 00 28 00 01 00 00 01 11 과 byte 번호·필드 묶음","introCard":0},{"id":"u7b-08","type":"tf","q":"IPv4 header 의 TTL 필드(9 번째 byte)가 0x01 이면 이 datagram 은 한 hop 만 더 갈 수 있다.","answer":true,"explain":"TTL 1 → 다음 라우터에서 0 → discard. Ex 7.10 은 TTL 1, protocol 2(IGMP).","src":"CH07(2) p.41","wiki":"Example 7.10 TTL과 protocol","tags":["Example 7.10 TTL과 protocol"],"img":"img/cn7-gen-u7b-07.png","imgAlt":"IPv4 header 앞 10 bytes 45 00 00 28 00 01 00 00 01 11 과 byte 번호·필드 묶음","introCard":0},{"id":"u7b-09","type":"num","q":"첫 byte 가 0x46 이면 header 길이는 몇 bytes?","answer":24,"unit":"bytes","tol":0,"explain":"0x46 → VER 4, HLEN 6 → 6 × 4 = **24 B** (options 4 B).","src":"CH07(2) p.33","wiki":"HLEN","tags":["HLEN"],"img":"img/cn7b-p32-header-ans.png","imgAlt":"IPv4 header format: VER·HLEN·Service type·Total length / Identification·Flags·Fragmentation offset / TTL·Protocol·Header checksum / Source·Destination address / Options","introCard":0},{"id":"u7b-10","type":"num","q":"HLEN 5, total length 0x05DC 이면 data 는 몇 bytes?","answer":1480,"unit":"bytes","tol":0,"explain":"0x05DC = 1500, − 20 = **1480 B** (Ethernet MTU 1500 꽉 찬 datagram).","src":"CH07(2) p.34","wiki":"total length","tags":["total length"],"img":"img/cn7b-p32-header-ans.png","imgAlt":"IPv4 header format: VER·HLEN·Service type·Total length / Identification·Flags·Fragmentation offset / TTL·Protocol·Header checksum / Source·Destination address / Options","introCard":0},{"id":"u7b-11","type":"order","q":"IPv4 header 의 앞 두 행 필드를 순서대로","answer":["VER","HLEN","Service type","Total length","Identification","Flags + Fragmentation offset"],"explain":"1 행: VER·HLEN·Service type·Total length / 2 행: Identification·Flags·Offset. 3 행 TTL·Protocol·Checksum.","src":"CH07(2) p.32","wiki":"IPv4 datagram format","tags":["IPv4 datagram format"],"introCard":0},{"id":"u7b-12","type":"cloze","q":"hex 덤프에서 TTL 은 ___ 번째 byte, protocol 은 ___ 번째 byte 다.","answer":["9","10"],"bank":["9","10","8","11","5"],"explain":"1 행 4 B + 2 행 4 B = 8 B 다음 → 9 = TTL, 10 = protocol.","src":"CH07(2) p.41","wiki":"Example 7.10 TTL과 protocol","tags":["Example 7.10 TTL과 protocol"],"img":"img/cn7b-p41-hex.png","imgAlt":"p.41 Example 7.10 — 45 00 00 28 00 01 00 00 01 02 와 byte 번호 1~10, 9·10 번째 아래 이름이 ? 로 가려져 있다","explainImg":"img/cn7b-p41-hex-ans.png","introCard":0},{"id":"u7b-13","type":"num","q":"[PS1 5(a) 변형] An IPv4 header begins with 46 00 01 2C 3A 10 20 05 0A 11 (hex). What is the header length in bytes?","answer":24,"unit":"bytes","tol":0,"explain":"첫 byte 0x46 = 0100 0110 → VER 4, HLEN 6 → 6 × 4 = **24 bytes** (options 4 B 포함).","src":"PS1 5(a) 변형","wiki":"HLEN","tags":["HLEN"],"prof":true,"img":"img/cn7-gen-u7b-13.png","imgAlt":"IPv4 header 앞 10 bytes 46 00 01 2C 3A 10 20 05 0A 11 과 byte 번호·필드 묶음","introCard":0},{"id":"u7b-14","type":"num","q":"[PS1 5(a) 변형] IPv4 header 가 46 00 01 2C 3A 10 20 05 0A 11 (hex) 로 시작한다. data(payload) 는 몇 bytes?","answer":276,"unit":"bytes","tol":0,"explain":"byte 3–4 = 0x012C = 300 = total length (header 포함). data = 300 − 24 = **276 bytes**.","src":"PS1 5(a) 변형","wiki":"total length","tags":["total length"],"prof":true,"img":"img/cn7-gen-u7b-13.png","imgAlt":"IPv4 header 앞 10 bytes 46 00 01 2C 3A 10 20 05 0A 11 과 byte 번호·필드 묶음","introCard":0},{"id":"u7b-15","type":"mc","q":"[PS1 5(a) 변형] IPv4 header 가 46 00 01 2C 3A 10 20 05 0A 11 (hex) 로 시작한다. byte 7–8 = 0x2005 다. 이 datagram 은?","choices":["fragment 아님 (D = 1)","first fragment","middle fragment, 첫 data byte 40","last fragment, 첫 data byte 5"],"answer":2,"explain":"0x2005 = 0010 0000 0000 0101 → 앞 3 bits 001 = (reserved 0, D 0, **M 1**), 나머지 13 bits = 5 → offset 5 → 첫 data byte 5 × 8 = 40. M = 1 이고 offset > 0 → **middle fragment**. offset 을 그대로 byte 번호로 쓰면 오답.","src":"PS1 5(a) 변형","wiki":"fragmentation offset","tags":["fragmentation offset"],"prof":true,"img":"img/cn7-gen-u7b-13.png","imgAlt":"IPv4 header 앞 10 bytes 46 00 01 2C 3A 10 20 05 0A 11 과 byte 번호·필드 묶음","introCard":0},{"id":"u7b-16","type":"mc","q":"[PS1 5(a) 변형] IPv4 header 가 46 00 01 2C 3A 10 20 05 0A 11 (hex) 로 시작한다. 9·10 번째 byte 가 0A 11 이다. 옳은 것은?","choices":["10 hops 더 갈 수 있고, payload 는 UDP","10 hops, TCP","1 hop, UDP","17 hops, ICMP"],"answer":0,"explain":"TTL = 0x0A = **10** hops, protocol = 0x11 = 17 = **UDP** (p.36: ICMP 1, IGMP 2, TCP 6, UDP 17, OSPF 89).","src":"PS1 5(a) 변형","wiki":"protocol field","tags":["protocol field"],"prof":true,"img":"img/cn7-gen-u7b-13.png","imgAlt":"IPv4 header 앞 10 bytes 46 00 01 2C 3A 10 20 05 0A 11 과 byte 번호·필드 묶음","introCard":0}],"intro":[{"title":"hex 덤프 읽기","body":"byte 1 = VER|HLEN (0x45 → 4, 5 → 20 B), byte 3–4 = total length, byte 5–6 = identification, byte 7–8 = flags(앞 3 bits: 0, D, M) + offset(13 bits), byte 9 = TTL, byte 10 = protocol.","img":"img/cn7b-p41-hex-ans.png","imgAlt":"Example 7.10: 9 번째 TTL, 10 번째 Protocol","src":"CH07(2) p.38–41 · PS1 5(a)"},{"title":"잘못된 header 판정","body":"첫 8 bits 0100 0010 → VER 4 는 맞지만 HLEN 2 → 8 B \u003c 최소 20 B → 손상, discard. data = total − HLEN×4 (예: 0x0028 = 40, header 20 → data 20).","img":"img/cn7b-p39-ex77-ans.png","imgAlt":"Example 7.7: VER = 4 ✓, HLEN = 2 → 8 B ✗","src":"CH07(2) p.39–40"},{"title":"hex → 10진, flags 해석","body":"hex 두 자리 = 1 byte: 0x40 = 64, 0x11 = 17, 0x0054 = 84. byte 7–8 을 2진으로 풀어 앞 3 bits(0, D, M) 와 뒤 13 bits(offset)로 나눈다: 0x4000 → D = 1, M = 0, offset 0 → fragment 아님. 0x2005 → M = 1, offset 5 → 첫 data byte 40.","src":"PS1 5(a)"}]},{"id":"u7c","title":"Fragmentation","items":[{"id":"u7c-01","type":"mc","q":"fragmentation 이 필요한 때는?","choices":["datagram 이 다음 링크의 MTU 보다 클 때","TTL 이 0 일 때","checksum 오류","destination 이 요청할 때"],"answer":0,"explain":"MTU = frame payload 최대 (Ethernet 1500). 이보다 크면 쪼갠다.","src":"CH07(2) p.42","wiki":"MTU","tags":["MTU"],"diff":1,"introCard":0},{"id":"u7c-02","type":"tf","q":"IPv4 에서는 fragment 를 라우터가 쪼갤 수 있지만 재조립은 destination 만 한다.","answer":true,"explain":"source 또는 어느 라우터나 쪼갤 수 있고, 여러 번 가능. reassembly 는 destination 만.","src":"CH07(2) p.43","wiki":"reassembly","tags":["reassembly"],"introCard":0},{"id":"u7c-03","type":"match","q":"(M, offset) 판정","pairs":[["M 0, offset 0","쪼개지지 않음"],["M 1, offset 0","first fragment"],["M 1, offset > 0","middle fragment"],["M 0, offset > 0","last fragment"]],"explain":"offset 0 ≠ 안 나뉨 — M 까지 봐야 한다.","src":"CH07(2) p.47","wiki":"Example 7.14 fragment 위치 판정","tags":["Example 7.14 fragment 위치 판정"],"img":"img/cn7b-p47-mbit.png","imgAlt":"p.47 Summary 표 — M bit·Offset 네 조합의 \"This packet is…\" 열이 가려져 있다","explainImg":"img/cn7b-p47-mbit-ans.png","introCard":1},{"id":"u7c-04","type":"num","q":"fragment 의 offset = 100, HLEN = 5, total length = 100 이다. 첫 data byte 번호는?","answer":800,"tol":0,"explain":"first = offset × 8 = **800**.","src":"CH07(2) p.48","wiki":"Example 7.16 첫·마지막 바이트","tags":["Example 7.16 첫·마지막 바이트"],"img":"img/cn7b-p48-ex716.png","imgAlt":"p.48 Example 7.16 막대 — data of this fragment: 80 bytes, 양 끝 byte 번호가 ? 로 가려져 있다","explainImg":"img/cn7b-p48-ex716-ans.png","introCard":2},{"id":"u7c-05","type":"num","q":"fragment 의 offset = 100, HLEN = 5, total length = 100 이다. 마지막 data byte 번호는?","answer":879,"tol":0,"explain":"data = 100 − 20 = 80 → last = 800 + 80 − 1 = **879** (880 ✗).","src":"CH07(2) p.48","wiki":"Example 7.16 첫·마지막 바이트","tags":["Example 7.16 첫·마지막 바이트"],"img":"img/cn7-gen-u7c-05.png","imgAlt":"fragment: header(offset 100, HLEN 5, total 100) + data, 첫·마지막 byte 는 ?","introCard":2},{"id":"u7c-06","type":"num","q":"PS1 5(b): M = 1, offset 185, HLEN 5, total 1,020 → 마지막 data byte 는?","answer":2479,"tol":0,"explain":"first = 185 × 8 = 1,480, data = 1,020 − 20 = 1,000 → last = 1,480 + 1,000 − 1 = **2,479**. middle fragment.","src":"PS1 5(b)","wiki":"fragmentation offset","tags":["fragmentation offset"],"prof":true,"img":"img/cn7-gen-u7c-06.png","imgAlt":"fragment: header(M 1, offset 185, HLEN 5, total 1,020) + data","introCard":1},{"id":"u7c-07","type":"num","q":"PS1 5(b): fragment 가 M = 1, offset 185, HLEN 5, total length 1,020 이다(data byte 1,480–2,479). 다음 fragment 의 offset 은?","answer":310,"tol":0,"explain":"(2,479 + 1) / 8 = **310**.","src":"PS1 5(b)","wiki":"fragmentation offset","tags":["fragmentation offset"],"prof":true,"diff":3,"img":"img/cn7-gen-u7c-07.png","imgAlt":"data 1,480–2,479 를 실은 fragment, 다음 offset 은 ?","introCard":1},{"id":"u7c-08","type":"num","q":"data 4,000 B 인 datagram 을 1,400 B 씩 쪼갰다. 둘째 fragment F2 (bytes 1400–2799) 의 offset 은?","answer":175,"tol":0,"explain":"1400 / 8 = **175**.","src":"CH07(2) p.46","wiki":"fragmentation offset","tags":["fragmentation offset"],"img":"img/cn7b-p45-offset.png","imgAlt":"p.45 fragmentation offset 그림 — Byte 0000~3999 datagram 이 0000–1399, 1400–2799, 2800–3999 세 fragment 로 나뉘고 아래 두 offset 이 가려져 있다","explainImg":"img/cn7b-p45-offset-ans.png","introCard":2},{"id":"u7c-09","type":"num","q":"4,000 B datagram 의 fragment F2 (bytes 1400–2799) 가 다른 router 에서 다시 F2.1 (1400–2199) 과 F2.2 (2200–2799) 로 나뉘었다. F2.2 의 offset 은?","answer":275,"tol":0,"explain":"항상 **원래 datagram 기준** → 2200 / 8 = **275**. \"F2 안에서 800 → 100\" 은 함정.","src":"CH07(2) p.46","wiki":"fragmentation offset","tags":["fragmentation offset"],"diff":3,"img":"img/cn7-gen-u7c-09.png","imgAlt":"0000–3999 datagram → F1·F2·F3, F2 가 다시 F2.1(1400–2199)·F2.2(2200–2799)","introCard":2},{"id":"u7c-10","type":"tf","q":"F2 를 다시 나눈 F2.2 의 M 은 0 이다.","answer":false,"explain":"F2.2 뒤에 원래 datagram 의 F3 가 남아 있으니 **M = 1**. M 도 원래 datagram 기준.","src":"CH07(2) p.46","wiki":"flags D와 M","tags":["flags D와 M"],"diff":3,"introCard":1},{"id":"u7c-11","type":"num","q":"MTU 1000 인 링크에서 (header 20 B) fragment 하나가 실을 수 있는 최대 data 는? (8 의 배수)","answer":976,"unit":"bytes","tol":0,"explain":"1000 − 20 = 980 → 8 의 배수로 내림 ⌊980/8⌋ × 8 = **976** (980/8 = 122.5 라 안 됨).","src":"CH07(2) p.45","wiki":"MTU","tags":["MTU"],"diff":3,"introCard":1},{"id":"u7c-12","type":"cloze","q":"fragment 들이 같은 datagram 에서 왔음을 알려 주는 필드는 ___, \"쪼개지 마\" 는 ___ bit 다.","answer":["Identification","D"],"bank":["Identification","D","M","TTL","Protocol"],"explain":"flags = [reserved | D | M]. D = 1 do not fragment, M = 1 more fragments.","src":"CH07(2) p.44","wiki":"identification field","tags":["identification field"],"introCard":1},{"id":"u7c-13","type":"order","q":"fragmentation 때 라우터가 하는 일","answer":["datagram 이 다음 MTU 보다 큼을 확인","data 를 8 의 배수 크기로 나눔","header 를 각 fragment 에 복사","flags·offset·total length 를 고치고 checksum 재계산","각 fragment 를 따로 forwarding"],"explain":"바뀌는 것: flags, offset, total length + checksum.","src":"CH07(2) p.43","wiki":"fragmentation","tags":["fragmentation"],"introCard":0},{"id":"u7c-14","type":"num","q":"4000 B data datagram 의 마지막 fragment F3 가 bytes 2800–3999 를 실을 때 offset 은?","answer":350,"tol":0,"explain":"2800 / 8 = **350**, M = 0.","src":"CH07(2) p.46","wiki":"fragmentation offset","tags":["fragmentation offset"],"img":"img/cn7b-p45-offset.png","imgAlt":"p.45 fragmentation offset 그림 — 아래 두 fragment 의 offset 이 가려져 있다","explainImg":"img/cn7b-p45-offset-ans.png","introCard":1},{"id":"u7c-15","type":"num","q":"[PS1 5(b) 변형] A fragment has M = 0, offset = 300, HLEN = 5, total length = 820. What is the number of its last data byte?","answer":3199,"tol":0,"explain":"첫 byte = 300 × 8 = 2,400. data = 820 − 5 × 4 = 800 bytes. 마지막 = 2,400 + 800 − 1 = **3,199**. M = 0 이고 offset > 0 → **last fragment** 라 원래 datagram 의 data 는 3,200 bytes.","src":"PS1 5(b) 변형","wiki":"fragmentation offset","tags":["fragmentation offset"],"prof":true,"img":"img/cn7-gen-u7c-15.png","imgAlt":"fragment: header(M 0, offset 300, HLEN 5, total 820) + data","introCard":1},{"id":"u7c-16","type":"sa","q":"[Term] \"Maximum payload size of a frame\", set by the network hardware and software. Give the term (약어).","answer":"MTU","alts":["Maximum Transfer Unit","Maximum Transmission Unit"],"explain":"p.42: MTU (Maximum Transfer Unit), 예: Ethernet LAN 1,500 bytes. datagram 이 MTU 보다 크면 fragmentation.","src":"CH07(2) p.42","wiki":"MTU","tags":["MTU"],"diff":1,"introCard":1}],"intro":[{"title":"왜·누가 fragmentation","body":"datagram 이 다음 링크의 **MTU**(frame payload 최대, Ethernet 1,500 B)보다 크면 쪼갠다. IPv4 는 source 나 경로의 아무 router 가 쪼개고(여러 번 가능), 재조립은 destination 만. 각 fragment 는 header 를 복사하고 flags·offset·total length·checksum 이 바뀐다.","src":"CH07(2) p.42–43"},{"title":"identification · D · M","body":"같은 datagram 의 fragment 는 **identification** 이 같다. flags: D(do not fragment) = 1 이면 쪼개지 마, **M(more fragments)** = 1 이면 뒤에 fragment 가 더 있음. (M, offset): (0,0) 안 나뉨, (1,0) first, (1,>0) middle, (0,>0) last.","img":"img/cn7b-p47-mbit-ans.png","imgAlt":"M bit · Offset 조합 표","src":"CH07(2) p.44, 47"},{"title":"offset 은 8-byte 단위","body":"offset = 이 fragment 의 첫 data byte ÷ 8 (원래 datagram 기준). 첫 byte = offset × 8, 마지막 byte = 첫 byte + (total − HLEN×4) − 1. 다음 fragment offset = (마지막 + 1) ÷ 8. 그래서 마지막이 아닌 fragment 의 data 는 8 의 배수.","img":"img/cn7b-p45-offset-ans.png","imgAlt":"0000–3999 를 offset 0, 175, 350 으로","src":"CH07(2) p.45–48 · PS1 5(b)"}]},{"id":"u7d","title":"ICMPv4 와 forwarding","items":[{"id":"u7d-01","type":"match","q":"ICMP type","pairs":[["3","destination unreachable"],["5","redirection"],["11","time exceeded"],["8 / 0","echo request / reply"],["13 / 14","timestamp request / reply"]],"explain":"error-reporting: 3·4·5·11·12, query: 8/0, 13/14.","src":"CH07(2) p.50–55","wiki":"ICMP error-reporting message","tags":["ICMP error-reporting message"],"img":"img/cn7b-p53-icmp.png","imgAlt":"p.53 ICMP error-reporting 표 — Type 3·4·5·11·12 의 Message 열이 가려져 있다","explainImg":"img/cn7b-p53-icmp-ans.png","introCard":0},{"id":"u7d-02","type":"tf","q":"ICMP 는 오류를 보고할 뿐 아니라 정정도 한다.","answer":false,"explain":"ICMP 는 **보고만**, 정정 ✗. 그리고 항상 **original source** 로 보낸다(datagram 에는 source·destination 주소만 있으므로).","src":"CH07(2) p.52","wiki":"ICMP error-reporting message","tags":["ICMP error-reporting message"],"introCard":0},{"id":"u7d-03","type":"mc","q":"ICMP 메시지는 어떻게 전달되나?","choices":["TCP segment 에 실린다","IP datagram 안에 실린다 (같은 network layer 의 companion)","Ethernet frame 에 직접","UDP 로"],"answer":1,"explain":"ICMPv4 = IP 의 companion. 메시지는 IP datagram 의 payload 로 실린다 (protocol 1).","src":"CH07(2) p.49","wiki":"ICMPv4","tags":["ICMPv4"],"introCard":0},{"id":"u7d-04","type":"cloze","q":"ICMP error message 의 data section 에는 원래 IP ___ 와 data 앞 ___ bytes 가 들어간다.","answer":["header","8"],"bank":["header","8","trailer","20","64"],"explain":"앞 8 bytes 에 port numbers 가 있어 source 가 어느 프로세스 것인지 안다 (p.52).","src":"CH07(2) p.52","wiki":"ICMP error-reporting message","tags":["ICMP error-reporting message"],"diff":3,"introCard":0},{"id":"u7d-05","type":"mc","q":"ping 이 쓰는 ICMP 메시지는?","choices":["time exceeded","echo request / reply (8 / 0)","redirection","timestamp"],"answer":1,"explain":"ping = echo request(8) / reply(0). traceroute 는 time exceeded 를 이용.","src":"CH07(2) p.53–55","wiki":"echo request와 ping","tags":["echo request와 ping"],"diff":1,"introCard":0},{"id":"u7d-06","type":"sa","q":"TTL 을 1, 2, 3 … 으로 늘려 보내며 time exceeded 를 받아 경로를 알아내는 도구는?","answer":"traceroute","alts":["tracert"],"explain":"TTL 이 0 이 되는 라우터마다 type 11 을 돌려보내니 경로의 라우터를 하나씩 알 수 있다.","src":"CH07(2) p.54","wiki":"time exceeded와 traceroute","tags":["time exceeded와 traceroute"],"introCard":0},{"id":"u7d-07","type":"mc","q":"forwarding table 에서 행을 비교하는 순서는?","choices":["짧은 mask 부터","긴 mask 부터 (longest prefix match), 마지막에 default","무작위","next hop 주소 순"],"answer":1,"explain":"dest AND mask == network address 를 긴 mask 부터 비교 → longest mask matching.","src":"CH07(2) p.57–60","wiki":"longest mask matching","tags":["longest mask matching"],"introCard":1},{"id":"u7d-08","type":"num","q":"destination 180.70.65.140 을 /26 mask 와 AND 하면 마지막 byte 는?","answer":128,"tol":0,"explain":"140 = 1000 1100 AND 1100 0000 = 1000 0000 = **128** ≠ 192 → /26 행 불일치.","src":"CH07(2) p.61–62","wiki":"Example 7.19–7.21 R1 포워딩","tags":["Example 7.19–7.21 R1 포워딩"],"img":"img/cn7b-p62-ex721.png","imgAlt":"p.62 Example 7.21 — /26·/25 행의 Destination AND mask 값과 Match? 열이 가려져 있다","explainImg":"img/cn7b-p62-ex721-ans.png","introCard":1},{"id":"u7d-09","type":"mc","q":"R1 의 forwarding table (긴 mask 부터): 180.70.65.192/26 → m2, 180.70.65.128/25 → m0, 201.4.22.0/24 → m3, 201.4.16.0/22 → m1, default → next hop 180.70.65.200, m2. destination 180.70.65.140 의 출력 interface 는?","choices":["m2","m0","m3","m1"],"answer":1,"explain":"/26: .128 ≠ .192 ✗ → /25: 140 AND 128 = 128 = .128 ✓ → **m0**.","src":"CH07(2) p.62","wiki":"Example 7.19–7.21 R1 포워딩","tags":["Example 7.19–7.21 R1 포워딩"],"prof":true,"img":"img/cn7-gen-u7d-09.png","imgAlt":"R1 forwarding table 표: 180.70.65.192/26 m2, 180.70.65.128/25 m0, 201.4.22.0/24 m3, 201.4.16.0/22 m1, default 180.70.65.200 m2","introCard":1},{"id":"u7d-10","type":"mc","q":"R1 의 forwarding table (긴 mask 부터): 180.70.65.192/26 → m2, 180.70.65.128/25 → m0, 201.4.22.0/24 → m3, 201.4.16.0/22 → m1, default → next hop 180.70.65.200, m2. destination 180.70.65.200 의 출력은?","choices":["m0","m2","m3","default"],"answer":1,"explain":"/26: 200 AND 192 = 192 ✓ → **m2**. /25 에도 맞지만 긴 mask 가 먼저.","src":"CH07(2) p.60","wiki":"longest mask matching","tags":["longest mask matching"],"diff":3,"img":"img/cn7-gen-u7d-09.png","imgAlt":"R1 forwarding table 표: 180.70.65.192/26 m2, 180.70.65.128/25 m0, 201.4.22.0/24 m3, 201.4.16.0/22 m1, default 180.70.65.200 m2","introCard":1},{"id":"u7d-11","type":"mc","q":"R1 의 forwarding table (긴 mask 부터): 180.70.65.192/26 → m2, 180.70.65.128/25 → m0, 201.4.22.0/24 → m3, 201.4.16.0/22 → m1, default → next hop 180.70.65.200, m2. destination 201.4.22.35 의 출력은?","choices":["m1","m3","m2","m0"],"answer":1,"explain":"/26·/25 는 180.70.65.x 라 ✗. /24: 201.4.22.35 AND 255.255.255.0 = 201.4.22.0 ✓ → **m3**.","src":"CH07(2) p.61","wiki":"Example 7.19–7.21 R1 포워딩","tags":["Example 7.19–7.21 R1 포워딩"],"img":"img/cn7-gen-u7d-09.png","imgAlt":"R1 forwarding table 표: 180.70.65.192/26 m2, 180.70.65.128/25 m0, 201.4.22.0/24 m3, 201.4.16.0/22 m1, default 180.70.65.200 m2","introCard":1},{"id":"u7d-12","type":"mc","q":"R1 의 forwarding table (긴 mask 부터): 180.70.65.192/26 → m2, 180.70.65.128/25 → m0, 201.4.22.0/24 → m3, 201.4.16.0/22 → m1, default → next hop 180.70.65.200, m2. destination 201.4.18.5 의 출력은?","choices":["m3","m1","m2","m0"],"answer":1,"explain":"/24 → 201.4.18.0 ≠ 201.4.22.0 ✗. /22: 18 AND 252 = 16 → 201.4.16.0 ✓ → **m1**.","src":"CH07(2) p.61","wiki":"longest mask matching","tags":["longest mask matching"],"diff":3,"img":"img/cn7-gen-u7d-09.png","imgAlt":"R1 forwarding table 표: 180.70.65.192/26 m2, 180.70.65.128/25 m0, 201.4.22.0/24 m3, 201.4.16.0/22 m1, default 180.70.65.200 m2","introCard":1},{"id":"u7d-13","type":"tf","q":"forwarding table 의 각 행에는 network address(block 의 첫 주소)가 들어간다.","answer":true,"explain":"표에는 network address/mask, next hop, interface. 개별 connection 주소가 아니다.","src":"CH07(2) p.56","wiki":"network address","tags":["network address"],"introCard":1},{"id":"u7d-14","type":"order","q":"라우터의 forwarding 판단 순서","answer":["destination address 추출","가장 긴 mask 행부터 dest AND mask 계산","network address 와 같으면 그 행 선택","모두 불일치면 default (0.0.0.0/0)","next hop·interface 로 내보냄"],"explain":"longest prefix match + default.","src":"CH07(2) p.57–60","wiki":"longest mask matching","tags":["longest mask matching"],"introCard":1},{"id":"u7d-15","type":"cloze","q":"ICMPv4 메시지의 두 분류는 ___ message 와 ___ message 다.","answer":["error-reporting","query"],"bank":["error-reporting","query","routing","flooding","control"],"explain":"error-reporting(3·4·5·11·12) vs query(8/0 echo, 13/14 timestamp).","src":"CH07(2) p.50","wiki":"ICMPv4","tags":["ICMPv4"],"introCard":0},{"id":"u7d-16","type":"sa","q":"그림은 TTL 이 hop 마다 줄어드는 상황이다. TTL 이 0 이 된 R3 가 datagram 을 버리고 Host 로 보내는 ? 메시지의 이름은? (영문)","answer":"time exceeded","alts":["time exceeded message","Time exceeded (type 11)"],"explain":"TTL 이 0 이 되면 router 가 datagram 을 discard 하고 **time exceeded (type 11)** ICMP error 를 original source 로 보낸다. traceroute 가 이것으로 경로를 알아낸다.","src":"CH07(2) p.54","wiki":"ICMP error-reporting message","tags":["ICMP error-reporting message"],"img":"img/cn7b-p54-ttl.png","imgAlt":"p.54 TTL running out — Host → R1(TTL=3) → R2(TTL=2) → R3(TTL=1 → 0, discard), R3 에서 Host 로 돌아가는 점선 메시지 이름이 ? 로 가려져 있다","explainImg":"img/cn7b-p54-ttl-ans.png","introCard":0},{"id":"u7d-17","type":"mc","q":"[변형] R1 의 forwarding table (긴 mask 부터): 180.70.65.192/26 → m2, 180.70.65.128/25 → m0, 201.4.22.0/24 → m3, 201.4.16.0/22 → m1, default → next hop 180.70.65.200, m2. destination 180.70.65.90 의 출력은?","choices":["m0","m1","m2 (default, next hop 180.70.65.200)","m3"],"answer":2,"explain":"/26: 90 AND 192 = 64 ≠ 192. /25: 90 AND 128 = 0 ≠ 128. /24·/22: 앞 두 byte 가 201.4 가 아니라 불일치. → 어느 행도 안 맞아 **default** (next hop 180.70.65.200, m2). 긴 mask 부터 차례로 비교한다.","src":"CH07(2) p.60–62","wiki":"longest mask matching","tags":["longest mask matching"],"img":"img/cn7-gen-u7d-09.png","imgAlt":"R1 forwarding table 표: 180.70.65.192/26 m2, 180.70.65.128/25 m0, 201.4.22.0/24 m3, 201.4.16.0/22 m1, default 180.70.65.200 m2","introCard":1}],"intro":[{"title":"ICMPv4","body":"IP 의 두 빈틈(error 보고·질의)을 채우는 companion 프로토콜, 메시지는 IP datagram 에 실린다. **error-reporting**: 3 destination unreachable, 4 source quench, 5 redirection, 11 time exceeded, 12 parameter problem — 보고만 하고 고치지 않으며 항상 original source 로. **query**: echo(8/0, ping), timestamp(13/14).","img":"img/cn7b-p53-icmp-ans.png","imgAlt":"ICMP error-reporting messages 표","src":"CH07(2) p.49–55"},{"title":"forwarding table 과 longest mask","body":"행 = network address(block 의 first address)/mask → next hop → interface. **긴 mask 부터** destination AND mask 를 계산해 행의 network address 와 같으면 그 행, 모두 아니면 default.","img":"img/cn7b-p56-fwdtable.png","imgAlt":"forwarding table 로 next hop 찾기","src":"CH07(2) p.56–61"},{"title":"Ex 7.21 풀이 모양","body":"R1 표(/26 180.70.65.192 m2, /25 180.70.65.128 m0, /24 201.4.22.0 m3, /22 201.4.16.0 m1, default m2), destination 180.70.65.140: /26 → .128 ≠ .192 ✗, /25 → .128 = .128 ✓ → m0.","img":"img/cn7b-p62-ex721-ans.png","imgAlt":"/26 no, /25 yes → m0","src":"CH07(2) p.62"}]},{"id":"u7e","title":"PS2 유형 연습 — forwarding · TTL · ICMP","items":[{"id":"u7e-01","type":"mc","q":"R2 표에서 목적지 172.30.9.100 의 처리는?","choices":["m0 로 직접 전달","m1 로 직접 전달","172.30.9.200 (m2)","default 172.30.9.140 (m1)"],"answer":0,"explain":"/26 두 줄: 100 AND 192 = 64 → .64 ≠ .128, .192 ✗. /25: 100 AND 128 = 0 → 172.30.9.0 ✓ → next hop \"-\" 이므로 **m0 로 직접 전달**.","src":"PS2 유형 · 11/24 과제","wiki":"Example 7.19–7.21 R1 포워딩","tags":["Example 7.19–7.21 R1 포워딩"],"prof":true,"img":"img/cn7-ps2-r2.png","imgAlt":"R2 forwarding table: 172.30.9.128/26 m1, 172.30.9.192/26 m2, 172.30.9.0/25 m0 (직접), 172.30.10.0/24 → 172.30.9.200 m2, 172.30.8.0/22 → 172.30.9.20 m0, default → 172.30.9.140 m1","introCard":0},{"id":"u7e-02","type":"mc","q":"같은 R2 표에서 172.30.10.33 의 next hop 과 interface 는?","choices":["172.30.9.20, m0","172.30.9.200, m2","직접, m2","172.30.9.140, m1"],"answer":1,"explain":"/26·/25: 셋째 byte 가 10 이라 ✗. /24: 172.30.10.0 ✓ → **172.30.9.200, m2**. /22 에도 맞지만 긴 prefix 가 먼저다.","src":"PS2 유형 · 11/24 과제","wiki":"longest mask matching","tags":["longest mask matching"],"prof":true,"img":"img/cn7-ps2-r2.png","imgAlt":"R2 forwarding table (위와 같음)","introCard":0},{"id":"u7e-03","type":"num","q":"같은 R2 표에서 172.30.11.5 를 /22 mask 로 AND 하면 셋째 byte 는?","answer":8,"tol":0,"explain":"11 = 0000 1011, 252 = 1111 1100 → 0000 1000 = **8** → 172.30.8.0 = /22 줄 ✓ → 172.30.9.20, m0.","src":"PS2 유형 · 11/24 과제","wiki":"longest mask matching","tags":["longest mask matching"],"prof":true,"img":"img/cn7-ps2-r2.png","imgAlt":"R2 forwarding table (위와 같음)","introCard":0},{"id":"u7e-04","type":"mc","q":"같은 R2 표에서 9.9.9.9 의 출력은?","choices":["m0","m2","default → 172.30.9.140, m1","버린다"],"answer":2,"explain":"172.30.x.x 줄은 모두 ✗ → **default** 줄(모든 주소와 맞음) → 172.30.9.140, m1.","src":"PS2 유형 · 11/24 과제","wiki":"forwarding table","tags":["forwarding table"],"prof":true,"img":"img/cn7-ps2-r2.png","imgAlt":"R2 forwarding table (위와 같음)","introCard":0},{"id":"u7e-05","type":"mc","q":"R2 표에서 /22 줄을 /24 줄보다 먼저 검사하면 172.30.10.33 은 어디로 나가나?","choices":["172.30.9.200, m2 (그대로)","172.30.9.20, m0 (틀린 길)","default","직접 m2"],"answer":1,"explain":"10 AND 252 = 8 → 172.30.8.0 이라 /22 에 먼저 걸린다 → **172.30.9.20, m0**. /22 block 이 /24 block 을 품고 있어서 긴 prefix 부터 봐야 한다(longest mask matching).","src":"PS2 유형 · 11/24 과제","wiki":"longest mask matching","tags":["longest mask matching"],"prof":true,"img":"img/cn7-ps2-r2.png","imgAlt":"R2 forwarding table (위와 같음)","introCard":0},{"id":"u7e-06","type":"num","q":"TTL = 4 로 보낸 datagram 이 6 개 라우터를 지나야 한다. 몇 번째 라우터가 버리나?","answer":4,"unit":"번째","tol":0,"explain":"라우터마다 1 씩: R1 3, R2 2, R3 1, R4 **0** → R4 가 버리고 source 로 time exceeded(type 11).","src":"PS2 유형 · 11/24 과제","wiki":"TTL","tags":["TTL"],"prof":true,"introCard":1},{"id":"u7e-07","type":"mc","q":"그때 버린 라우터가 보내는 ICMP 메시지와 받는 쪽은?","choices":["destination unreachable → 목적지","time exceeded (type 11) → 원래 source","time exceeded → 직전 라우터","redirection → source"],"answer":1,"explain":"TTL 0 → **time exceeded, type 11**. ICMP error 는 항상 원래 source 로 간다(datagram 에 source·destination 주소만 있으니까).","src":"PS2 유형 · 11/24 과제","wiki":"ICMPv4","tags":["ICMPv4"],"prof":true,"introCard":1},{"id":"u7e-08","type":"tf","q":"echo request / echo reply 는 ICMP error-reporting 메시지다.","answer":false,"explain":"아니다. **query** 메시지다(ping). error-reporting 은 destination unreachable·source quench·redirection·time exceeded·parameter problem.","src":"PS2 유형 · 11/24 과제","wiki":"echo request와 ping","tags":["echo request와 ping"],"prof":true,"introCard":1}],"intro":[{"title":"PS2 1번과 같은 모양 — longest prefix","body":"표는 긴 prefix → 짧은 prefix 순서. 위에서부터 **destination AND mask** 를 그 줄의 network address 와 비교하고 처음 맞는 줄에서 멈춘다. next hop \"-\" = 직접 연결(목적지로 바로), default 0.0.0.0/0 은 모든 주소와 맞는다. 짧은 prefix(/22)를 먼저 보면 그 안에 든 /24 주소가 틀린 길로 간다.","img":"img/cn7-ps2-r2.png","imgAlt":"R2 forwarding table","src":"CH07(2) rev p.56–62 · PS2 1(a)(b)"},{"title":"TTL 과 ICMP","body":"라우터마다 TTL −1, **0 이 되면 버리고** 원래 source 로 **time exceeded (type 11)**. data section 에는 원래 IP header + data 앞 8 bytes(port). echo request / reply 는 **query** 메시지(ping: 살아 있나, RTT).","src":"CH07(2) rev p.50–55 · PS2 1(c)"}]}]},{"id":"u8","title":"8강 IPv6","desc":"128-bit 주소 · zero compression · global unicast · EUI-64 · autoconfiguration · base header · fragmentation · 전환","lessons":[{"id":"u8a","title":"주소와 줄여 쓰기","items":[{"id":"u8a-01","type":"mc","q":"IPv6 로 옮기는 근본 이유는?","choices":["header 를 크게 하려고","IPv4 의 32-bit 주소 공간 부족","Ethernet 때문","TCP 를 없애려고"],"answer":1,"explain":"connection 마다 주소가 필요한데 2^32 로는 부족 → 128 bits.","src":"CH07(3) p.3","wiki":"IPv6","tags":["IPv6"],"diff":1,"introCard":0},{"id":"u8a-02","type":"num","q":"IPv6 주소 수는 IPv4 의 2^몇 배인가?","answer":96,"tol":0,"explain":"2^128 / 2^32 = **2^96** 배. \"bit 수 4 배 = 주소 수 4 배\" 는 함정.","src":"CH07(3) p.3","wiki":"IPv6 address","tags":["IPv6 address"],"introCard":0},{"id":"u8a-03","type":"cloze","q":"IPv6 주소는 ___ bits 이고, 16-bit section ___ 개를 colon 으로 나눠 hex 로 쓴다.","answer":["128","8"],"bank":["128","8","64","32","4"],"explain":"colon hexadecimal notation: 8 sections × 16 bits.","src":"CH07(3) p.4","wiki":"colon hexadecimal notation","tags":["colon hexadecimal notation"],"diff":1,"introCard":0},{"id":"u8a-04","type":"tf","q":"`::` 는 한 주소 안에서 여러 번 쓸 수 있다.","answer":false,"explain":"**한 번만**. 두 번 쓰면 숨은 0 section 을 어떻게 나눴는지 알 수 없다 (교수 06:18).","src":"1110 녹음 06:18","wiki":"zero compression","tags":["zero compression"],"prof":true,"introCard":1},{"id":"u8a-05","type":"tf","q":"zero compression 에서 `FFF0` 을 `FFF` 로 줄일 수 있다.","answer":false,"explain":"지울 수 있는 건 section **앞쪽(leading)** 0 뿐. FFF0 → FFF 는 값이 바뀐다.","src":"CH07(3) p.4","wiki":"zero compression","tags":["zero compression"],"introCard":1},{"id":"u8a-06","type":"num","q":"FDEC:74::B0FF:0:FFF0 에서 `::` 가 대신하는 0 section 은 몇 개?","answer":3,"unit":"개","tol":0,"explain":"보이는 section = FDEC, 74, B0FF, 0, FFF0 = 5 개 → 8 − 5 = **3**.","src":"CH07(3) p.4","wiki":"zero compression","tags":["zero compression"],"img":"img/cn7c-p04-zero.png","imgAlt":"p.4 zero compression 그림 — Original FDEC:0074:0000:0000:0000:B0FF:0000:FFF0, Abbreviated FDEC:74:0:0:0:B0FF:0:FFF0, More abbreviated 가 ? 로 가려져 있다","explainImg":"img/cn7c-p04-zero-ans.png","introCard":1},{"id":"u8a-07","type":"sa","q":"0000:0000:0000:0000:0000:0000:0000:0001 을 가장 짧게 쓰면?","answer":"::1","explain":"연속 0 section 7 개를 `::` 로, 0001 → 1.","src":"CH07(3) p.4","wiki":"zero compression","tags":["zero compression"],"diff":1,"introCard":1},{"id":"u8a-08","type":"sa","q":"2001:0DB8:0000:0000:0000:0000:0000:0001 을 가장 짧게 쓰면?","answer":"2001:DB8::1","alts":["2001:db8::1"],"explain":"0DB8 → DB8, 가운데 0 section 6 개 → `::`, 0001 → 1.","src":"CH07(3) p.4","wiki":"zero compression","tags":["zero compression"],"introCard":1},{"id":"u8a-09","type":"mc","q":"올바른 IPv6 표기는?","choices":["2001:DB8::1::1","FDEC:74::B0FF:0:FFF0","FDEC::74::B0FF","2001:DB8:G::1"],"answer":1,"explain":"`::` 두 번 ✗, G 는 hex 아님 ✗.","src":"CH07(3) p.4","wiki":"zero compression","tags":["zero compression"],"introCard":1},{"id":"u8a-10","type":"num","q":"주소 FDEC:BA98:74:3210:0:0:0:FFF0 에서 줄일 수 있는 연속 0 section 은 몇 개?","answer":3,"unit":"개","tol":0,"explain":"0:0:0 세 개 → FDEC:BA98:74:3210::FFF0.","src":"CH07(3) p.4","wiki":"zero compression","tags":["zero compression"],"introCard":1},{"id":"u8a-11","type":"tf","q":"section 안의 앞쪽 0 을 지우는 것과 연속 0 section 을 `::` 로 바꾸는 것은 둘 다 zero compression 규칙이다.","answer":true,"explain":"(1) leading zero 제거 (2) 연속 0 section → `::` 한 번.","src":"CH07(3) p.4","wiki":"zero compression","tags":["zero compression"],"diff":1,"introCard":1},{"id":"u8a-12","type":"sa","q":"IPv6 의 주소 표기법 이름은? (영문, colon … notation)","answer":"colon hexadecimal notation","alts":["colon hex notation","colon hexadecimal"],"explain":"IPv4 dotted-decimal 과 대비.","src":"CH07(3) p.4","wiki":"colon hexadecimal notation","tags":["colon hexadecimal notation"],"diff":1,"introCard":0},{"id":"u8a-13","type":"cloze","q":"IPv6 줄여 쓰기: section 의 ___ 0 을 지우고, 연속 0 section 은 `::` 로 ___ 만 바꾼다.","answer":["앞쪽","한 번"],"bank":["앞쪽","한 번","뒤쪽","두 번","모든"],"explain":"leading zero 만, `::` 는 한 주소에 한 번 (교수 06:18).","src":"CH07(3) p.4","wiki":"zero compression","tags":["zero compression"],"prof":true,"introCard":1},{"id":"u8a-14","type":"sa","q":"[변형] 2001:0DB8:0000:0000:0008:0800:200C:417A 를 가장 짧게 쓰면?","answer":"2001:DB8::8:800:200C:417A","explain":"section 앞쪽 0 지우기: 0DB8 → DB8, 0008 → 8, 0800 → 800 (뒤쪽 0 은 못 지운다). 연속 0 section 두 개 → `::` 한 번. → **2001:DB8::8:800:200C:417A**.","src":"CH07(3) p.4","wiki":"zero compression","tags":["zero compression"],"introCard":1}],"intro":[{"title":"IPv6 주소와 표기","body":"IPv4 의 32-bit 공간이 작아서 IPv6 = **128 bits**(2^96 배). colon hexadecimal: 16-bit section 8 개를 hex 4 자리로.","src":"CH07(3) p.3"},{"title":"zero compression","body":"① section 의 **앞쪽** 0 만 지운다(0074 → 74, FFF0 은 그대로). ② 연속된 0 section 을 `::` 로 — 주소당 **한 번만**. FDEC:0074:0000:0000:0000:B0FF:0000:FFF0 → FDEC:74::B0FF:0:FFF0.","img":"img/cn7c-p04-zero-ans.png","imgAlt":"Original → Abbreviated → More abbreviated","src":"CH07(3) p.4"},{"title":"IPv4 와 비교","body":"IPv4 는 dotted-decimal(32 bits, byte 4 개), IPv6 는 colon hexadecimal(128 bits, section 8 개). 주소 수는 2^128 / 2^32 = 2^96 배.","src":"CH07(3) p.3–4"}]},{"id":"u8b","title":"주소 종류 · global unicast · EUI-64","items":[{"id":"u8b-01","type":"match","q":"IPv6 주소 종류","pairs":[["unicast","1 대 1"],["anycast","group 이 주소 하나 공유, 가장 가까운 한 멤버에게"],["multicast","group 의 모든 멤버에게"],["broadcast","multicast 의 특수한 경우"]],"explain":"IPv6 에는 별도 broadcast 가 없다. anycast 주소는 unicast block 에서 받는다 (p.5–7).","src":"CH07(3) p.5–7","wiki":"unicast·anycast·multicast","tags":["unicast·anycast·multicast"],"introCard":0},{"id":"u8b-02","type":"cloze","q":"global unicast block 은 ___ 이고, 128 bits = routing prefix ___ + subnet 16 + interface ID ___ 이다.","answer":["2000::/3","48","64"],"bank":["2000::/3","48","64","FE80::/10","32","16"],"explain":"앞 3 bits 001. 48 + 16 + 64 = 128 (p.8–9).","src":"CH07(3) p.8–9","wiki":"global unicast address","tags":["global unicast address"],"img":"img/cn7c-p08-parts.png","imgAlt":"p.8 global unicast 세 부분 — Global routing prefix (n), Subnet (m), Interface ID (q) 의 비트 수가 ? 로 가려져 있다","explainImg":"img/cn7c-p08-parts-ans.png","introCard":1},{"id":"u8b-03","type":"tf","q":"interface ID 는 64 bits 이다.","answer":true,"explain":"교수 \"please remember\" (p.10).","src":"CH07(3) p.10","wiki":"interface ID","tags":["interface ID"],"prof":true,"introCard":1},{"id":"u8b-04","type":"num","q":"global unicast 의 subnet ID(16 bits)로 만들 수 있는 subnet 수는?","answer":65536,"unit":"개","tol":0,"explain":"2^16 = **65,536**.","src":"CH07(3) p.9","wiki":"global unicast address","tags":["global unicast address"],"diff":1,"introCard":1},{"id":"u8b-05","type":"num","q":"2000::/3 block 의 주소 수는 2^몇?","answer":125,"tol":0,"explain":"128 − 3 = **125**.","src":"CH07(3) p.8","wiki":"global unicast address","tags":["global unicast address"],"introCard":1},{"id":"u8b-06","type":"order","q":"48-bit MAC 을 64-bit interface ID 로 바꾸는 순서","answer":["MAC 을 앞 3 bytes / 뒤 3 bytes 로 나눈다","첫 byte 의 7 번째 bit(왼쪽부터)를 뒤집는다","가운데에 FFFE 를 넣는다","16-bit 씩 colon 으로 쓴다"],"explain":"F5-A9-23-11-9B-E2 → F7A9:23FF:FE11:9BE2.","src":"CH07(3) p.11–12","wiki":"EUI-64","tags":["EUI-64"],"img":"img/cn7c-p12-mac.png","imgAlt":"p.12 (b) 48-bit Ethernet MAC → 64-bit interface identifier 그림 — 가운데 added bits, 설명 문구가 ? 로 가려져 있다","explainImg":"img/cn7c-p12-mac-ans.png","introCard":1},{"id":"u8b-07","type":"sa","q":"Ethernet MAC F5-A9-23-11-9B-E2 로 만든 64-bit interface ID 는? (colon hex 4 section)","answer":"F7A9:23FF:FE11:9BE2","alts":["f7a9:23ff:fe11:9be2"],"explain":"F5 = 1111 0101 → 7 번째 bit 0 → 1 → 1111 0111 = F7. 가운데 FF FE 삽입.","src":"CH07(3) p.19–21","wiki":"Example 7.29","tags":["Example 7.29"],"prof":true,"img":"img/cn7c-p20-ex729.png","imgAlt":"p.20 Example 7.29 풀이 — Interface ID 와 link-local address 가 ? 로 가려져 있다","explainImg":"img/cn7c-p20-ex729-ans.png","introCard":2},{"id":"u8b-08","type":"mc","q":"MAC 첫 byte 가 F5 일 때 7 번째 bit 를 뒤집은 값은?","choices":["F4","F7","F1","FD"],"answer":1,"explain":"왼쪽부터 7 번째 bit = 값 2 자리. 0101 → 0111 = F7. 8 번째(맨 끝)를 뒤집은 F4 는 함정.","src":"CH07(3) p.11","wiki":"EUI-64","tags":["EUI-64"],"diff":3,"img":"img/cn7c-p12-mac-ans.png","imgAlt":"48-bit Ethernet MAC 을 64-bit interface identifier 로 바꾸는 그림 (7th bit 뒤집기, 가운데 added bits)","introCard":2},{"id":"u8b-09","type":"mc","q":"MAC 첫 byte 가 0A 이면 interface ID 첫 byte 는?","choices":["0A","08","0B","2A"],"answer":1,"explain":"0A = 0000 1010, 7 번째 bit 가 이미 1 → 0 으로 → 0000 1000 = **08**.","src":"CH07(3) p.11","wiki":"EUI-64","tags":["EUI-64"],"diff":3,"img":"img/cn7c-p12-mac-ans.png","imgAlt":"48-bit Ethernet MAC 을 64-bit interface identifier 로 바꾸는 그림 (7th bit 뒤집기, 가운데 added bits)","introCard":2},{"id":"u8b-10","type":"sa","q":"global routing prefix 3A21:1216:2165, subnet ID 1232, interface ID F7A9:23FF:FE11:9BE2 이면 global unicast address 는?","answer":"3A21:1216:2165:1232:F7A9:23FF:FE11:9BE2","alts":["3a21:1216:2165:1232:f7a9:23ff:fe11:9be2"],"explain":"prefix 48 + subnet 16 + IID 64. FE80 을 앞에 남기지 않는다.","src":"CH07(3) p.21","wiki":"Example 7.29","tags":["Example 7.29"],"prof":true,"img":"img/cn7c-p21-ex729.png","imgAlt":"p.21 Example 7.29 — 3A21:1216:2165 (48 bits) | 1232 (16 bits) | 64-bit interface ID 칸이 ? 로 가려져 있다","explainImg":"img/cn7c-p21-ex729-ans.png","introCard":1},{"id":"u8b-11","type":"tf","q":"EUI-64(이미 64 bits)를 interface ID 로 만들 때도 가운데에 FFFE 를 넣는다.","answer":false,"explain":"EUI-64 는 이미 64 bits → **7 번째 bit 만** 뒤집는다. FFFE 는 48-bit MAC 일 때만.","src":"CH07(3) p.12","wiki":"EUI-64","tags":["EUI-64"],"introCard":2},{"id":"u8b-12","type":"cloze","q":"link-local 주소 = ___ (10 bits) + 54 개 0 + 64-bit ___ 이다.","answer":["1111 1110 10","interface ID"],"bank":["1111 1110 10","interface ID","001","subnet ID","MAC"],"explain":"FE80::/10 + interface ID. Ex: FE80::F7A9:23FF:FE11:9BE2.","src":"CH07(3) p.15","wiki":"link-local address","tags":["link-local address"],"img":"img/cn7c-p15-linklocal.png","imgAlt":"p.15 link-local address (128 bits) — 10 bits 칸과 64 bits 칸이 ? 로 가려져 있고 가운데는 54 zeros","explainImg":"img/cn7c-p15-linklocal-ans.png","introCard":1},{"id":"u8b-13","type":"sa","q":"Ethernet MAC 00-1A-2B-3C-4D-5E 로 만든 64-bit interface ID 는? (colon hex 4 section)","answer":"021A:2BFF:FE3C:4D5E","alts":["21A:2BFF:FE3C:4D5E"],"explain":"① 첫 byte 00 = 0000 0000 → 7 번째 bit 를 뒤집어 0000 0010 = 02. ② 앞 3 bytes 02-1A-2B 와 뒤 3 bytes 3C-4D-5E 사이에 FFFE. → 021A:2BFF:FE3C:4D5E. 7th bit 를 안 뒤집거나 FFFE 를 빼먹는 것이 대표 실수.","src":"CH07(3) p.12, 19–20","wiki":"EUI-64","tags":["EUI-64"],"img":"img/cn7c-p12-mac-ans.png","imgAlt":"48-bit Ethernet MAC 을 64-bit interface identifier 로 바꾸는 그림 (7th bit 뒤집기, 가운데 added bits)","introCard":2},{"id":"u8b-14","type":"sa","q":"interface ID 021A:2BFF:FE3C:4D5E (MAC 00-1A-2B-3C-4D-5E) 로 만든 link-local address 는? (줄여 쓰기)","answer":"FE80::21A:2BFF:FE3C:4D5E","alts":["FE80::021A:2BFF:FE3C:4D5E"],"explain":"link-local = FE80::/10 + 54 zeros + 64-bit interface ID. 가운데 0 들을 `::` 로 줄이고 021A 의 앞 0 을 지우면 **FE80::21A:2BFF:FE3C:4D5E** (p.20 의 FE80::F7A9:23FF:FE11:9BE2 와 같은 꼴).","src":"CH07(3) p.15, 20","wiki":"link-local address","tags":["link-local address"],"img":"img/cn7c-p12-mac-ans.png","imgAlt":"48-bit Ethernet MAC 을 64-bit interface identifier 로 바꾸는 그림 (7th bit 뒤집기, 가운데 added bits)","introCard":2}],"intro":[{"title":"주소 종류","body":"unicast(한 interface), anycast(group 이 주소 하나 공유, 가장 가까운 하나에게), multicast(group 모두에게, broadcast 는 그 특수한 경우).","img":"img/cn7c-p06-types.png","imgAlt":"Unicast / Anycast / Multicast","src":"CH07(3) p.5–7"},{"title":"global unicast","body":"block 2000::/3(앞 3 bits 001, 2^125 주소). 128 bits = global routing prefix **48** + subnet ID **16**(2^16 subnet) + interface ID **64**.","img":"img/cn7c-p08-parts-ans.png","imgAlt":"Global routing prefix 48 · Subnet 16 · Interface ID 64","src":"CH07(3) p.8–10"},{"title":"MAC → interface ID (EUI-64)","body":"48-bit MAC: 첫 byte 의 **7 번째 bit 를 뒤집고**(F5 → F7, 00 → 02) 가운데(앞 3 bytes 와 뒤 3 bytes 사이)에 **FFFE** 를 넣는다. F5-A9-23-11-9B-E2 → F7A9:23FF:FE11:9BE2. 이미 64-bit 인 EUI-64 는 7th bit 만 뒤집는다.","img":"img/cn7c-p12-mac-ans.png","imgAlt":"48-bit Ethernet MAC → 64-bit interface identifier","src":"CH07(3) p.11–12, 19–20"},{"title":"link-local","body":"FE80::/10 (1111 1110 10) + 54 개 0 + 64-bit interface ID. 예: FE80::F7A9:23FF:FE11:9BE2.","img":"img/cn7c-p15-linklocal-ans.png","imgAlt":"link-local address 구성","src":"CH07(3) p.15"}]},{"id":"u8c","title":"Autoconfiguration 과 base header","items":[{"id":"u8c-01","type":"mc","q":"IPv6 autoconfiguration 의 핵심 (IPv4 와의 key difference)은?","choices":["DHCP 서버가 반드시 필요","host 가 서버 없이 스스로 주소를 만든다","admin 이 수동 설정","MAC 을 그대로 쓴다"],"answer":1,"explain":"IPv4 는 admin·DHCP 가 주소를 준다. IPv6 host 는 server 없이 스스로 (p.13).","src":"CH07(3) p.13","wiki":"autoconfiguration","tags":["autoconfiguration"],"introCard":0},{"id":"u8c-02","type":"order","q":"autoconfiguration 순서","answer":["FE80::/10 + interface ID 로 link-local 주소 생성","link 에서 unique 한지 확인","router solicitation 전송","router advertisement 로 global prefix + subnet ID 수신","interface ID 를 붙여 global unicast 완성"],"explain":"p.13–18. RA 에는 interface ID 가 없다 — host 가 붙인다.","src":"CH07(3) p.13–18","wiki":"autoconfiguration","tags":["autoconfiguration"],"img":"img/cn7c-p18-autoconf.png","imgAlt":"p.18 Host 와 Router 사이 메시지 ①(→)·②(←) 이름이 가려져 있고, 아래 Global prefix | Subnet ID | Interface ID (from host) = ③ Global unicast address","explainImg":"img/cn7c-p18-autoconf-ans.png","introCard":0},{"id":"u8c-03","type":"tf","q":"router advertisement 에는 host 의 interface ID 가 들어 있다.","answer":false,"explain":"RA 에는 **prefix + subnet ID** 만. interface ID 는 host 가 MAC 에서 만든다.","src":"CH07(3) p.17","wiki":"router solicitation과 advertisement","tags":["router solicitation과 advertisement"],"introCard":0},{"id":"u8c-04","type":"num","q":"IPv6 base header 의 고정 길이는 몇 bytes?","answer":40,"unit":"bytes","tol":0,"explain":"(4+8+20) + (16+8+8) + 128×2 = 320 bits = **40 B**. 그래서 HLEN 이 없다.","src":"CH07(3) p.23","wiki":"IPv6 base header","tags":["IPv6 base header"],"introCard":1},{"id":"u8c-05","type":"match","q":"IPv6 base header 필드와 bit 수","pairs":[["Version","4"],["Traffic class","8"],["Flow label","20"],["Payload length","16"],["Source address","128"]],"explain":"+ Next header 8, 주소 128 × 2.","src":"CH07(3) p.23–24","wiki":"IPv6 base header","tags":["IPv6 base header"],"introCard":1},{"id":"u8c-06","type":"tf","q":"IPv6 payload length 는 base header 를 포함한 길이다.","answer":false,"explain":"payload length 는 **base header 제외**. IPv4 total length 는 header 포함 — 반대.","src":"CH07(3) p.24","wiki":"IPv6 base header","tags":["IPv6 base header"],"introCard":1},{"id":"u8c-07","type":"sa","q":"IPv4 TTL 에 해당하는 IPv6 필드는?","answer":"Hop limit","alts":["hop limit","hoplimit"],"explain":"Hop limit 8 bits = TTL.","src":"CH07(3) p.24","wiki":"IPv6 base header","tags":["IPv6 base header"],"diff":1,"img":"img/cn7c-p24-fields.png","imgAlt":"p.24 IPv6 base header fields 표 — \"Same as TTL in IPv4\" 행의 Field 이름이 ? 로 가려져 있다","explainImg":"img/cn7c-p24-fields-ans.png","introCard":1},{"id":"u8c-08","type":"mc","q":"IPv6 에서 option 은 어떻게 처리하나?","choices":["base header 안 options 칸","extension header 로 분리하여 Next header 로 chain","TCP 가 처리","없앴다"],"answer":1,"explain":"base header 의 Next header 가 첫 extension header 를, 그것의 Next header 가 다음을 가리킨다.","src":"CH07(3) p.25","wiki":"extension header","tags":["extension header"],"introCard":2},{"id":"u8c-09","type":"match","q":"next header 코드","pairs":[["06","TCP"],["17","UDP"],["44","fragmentation"],["02","ICMPv6"],["59","no next header"]],"explain":"슬라이드 p.25: 00 hop-by-hop, 02 ICMPv6, 06 TCP, 17 UDP, 43 source routing, 44 fragmentation, 50 ESP, 51 AH, 59 null, 60 destination.","src":"CH07(3) p.25","wiki":"next header","tags":["next header"],"diff":3,"introCard":2},{"id":"u8c-10","type":"cloze","q":"IPv6 는 IPv4 의 TOS 를 없애고 8-bit ___ 와 20-bit ___ 를 넣었다.","answer":["traffic class","flow label"],"bank":["traffic class","flow label","HLEN","checksum","identification"],"explain":"p.22 IPv6 에서 바뀐 점. flow label 은 TCP flow control 과 다르다.","src":"CH07(3) p.22","wiki":"traffic class와 flow label","tags":["traffic class와 flow label"],"introCard":1},{"id":"u8c-11","type":"tf","q":"IPv6 base header 에는 header checksum 필드가 없다.","answer":true,"explain":"base header 필드는 Version·Traffic class·Flow label·Payload length·Next header·Hop limit·주소 두 개뿐.","src":"CH07(3) p.23","wiki":"IPv6 base header","tags":["IPv6 base header"],"diff":3,"introCard":1},{"id":"u8c-12","type":"tf","q":"autoconfiguration 은 DHCP 처럼 서버가 주소를 빌려준다.","answer":false,"explain":"서버가 없다. router 는 prefix 만 알려 주고 host 가 스스로 완성.","src":"CH07(3) p.13","wiki":"autoconfiguration","tags":["autoconfiguration"],"introCard":0},{"id":"u8c-13","type":"match","q":"그림은 IPv6 base header 다. 가린 필드 ①~⑤ 를 연결하시오","pairs":[["①","Traffic class"],["②","Flow label"],["③","Payload length"],["④","Next header"],["⑤","Hop limit"]],"explain":"첫 행 Version 4 · Traffic class 8 · Flow label 20 = 32 bits, 둘째 행 Payload length 16 · Next header 8 · Hop limit 8 = 32 bits, 그 뒤 source·destination 128 bits 씩 → 40 bytes 고정. IPv4 와 달리 checksum·fragmentation 필드가 없다.","src":"CH07(3) p.23–24","wiki":"IPv6 base header","tags":["IPv6 base header"],"img":"img/cn7c-p23-base.png","imgAlt":"p.23 IPv6 base header — 비트 눈금 0·4·12·16·24·31 과 Version 만 보이고 ①~⑤ 필드 이름이 가려져 있다","explainImg":"img/cn7c-p23-base-ans.png","introCard":1}],"intro":[{"title":"autoconfiguration","body":"IPv4 는 관리자나 DHCP 가 주소를 주지만 IPv6 host 는 **스스로** 만든다(server 불필요). ① FE80::/10 + interface ID 로 link-local ② link 에서 unique 확인 ③ router solicitation → router advertisement(global prefix + subnet ID) ④ 자기 interface ID 를 붙여 global unicast.","img":"img/cn7c-p18-autoconf-ans.png","imgAlt":"Router solicitation / advertisement 와 global unicast address","src":"CH07(3) p.13–18"},{"title":"IPv6 base header (40 B 고정)","body":"Version 4 · Traffic class 8 · Flow label 20 / Payload length 16(base header **제외**) · Next header 8 · Hop limit 8(= IPv4 TTL) / source·destination 128 씩. checksum 필드 없음. IPv4 의 TOS 대신 traffic class·flow label.","img":"img/cn7c-p23-base-ans.png","imgAlt":"IPv6 base header format","src":"CH07(3) p.22–24"},{"title":"extension header","body":"option 은 base header 밖의 extension header 로. 각 extension header 의 next header 가 다음 것을 가리키는 chain(06 TCP, 17 UDP, 44 fragmentation, 58 ICMPv6 …).","src":"CH07(3) p.25"}]},{"id":"u8d","title":"Fragmentation · ICMPv6 · 전환","items":[{"id":"u8d-01","type":"mc","q":"IPv4 와 IPv6 의 key difference 로 시험에 나올 수 있는 것은?","choices":["주소 길이","fragmentation — IPv6 는 source 만 쪼개고 라우터는 drop","checksum","TTL"],"answer":1,"explain":"\"may be asked in exams … please remember\" (1110 녹음 39:06–39:45).","src":"1110 녹음 39:19","wiki":"IPv6 fragmentation","tags":["IPv6 fragmentation"],"prof":true,"introCard":0},{"id":"u8d-02","type":"tf","q":"IPv6 라우터는 next MTU 보다 큰 packet 을 쪼개서 보낸다.","answer":false,"explain":"IPv6 라우터는 **drop**. 쪼갤 수 있는 것은 **source 만**. 재조립은 IPv4·IPv6 모두 destination.","src":"CH07(3) p.26","wiki":"IPv6 fragmentation","tags":["IPv6 fragmentation"],"prof":true,"introCard":0},{"id":"u8d-03","type":"match","q":"fragmentation 비교","pairs":[["IPv4 에서 쪼개는 주체","source 또는 라우터"],["IPv6 에서 쪼개는 주체","source 만"],["IPv6 라우터가 큰 packet 을 받으면","drop"],["재조립 (IPv4·IPv6)","destination"]],"explain":"p.26 표: IPv4 는 source 또는 아무 router 가 쪼개고, IPv6 는 **source 만** 쪼갠다. IPv6 router 는 next MTU 보다 큰 packet 을 **drop** 하고(ICMPv6 로 알림), 재조립은 둘 다 destination. 교수 1110 39:06 \"may be asked in exams … please remember\".","src":"CH07(3) p.26","wiki":"IPv4와 IPv6 비교","tags":["IPv4와 IPv6 비교"],"prof":true,"img":"img/cn7c-p26-frag.png","imgAlt":"p.26 IPv4 vs IPv6 fragmentation 표 — IPv6 열이 ? 로 가려져 있다","explainImg":"img/cn7c-p26-frag-ans.png","introCard":0},{"id":"u8d-04","type":"cloze","q":"ICMPv6 의 ___ 는 IPv4 의 ARP 를, ___ 는 IGMP 를 대신한다.","answer":["neighbor discovery","MLD"],"bank":["neighbor discovery","MLD","router advertisement","echo","DHCP"],"explain":"ND ≈ ARP, MLD ≈ IGMP. 거꾸로 외우지 말 것.","src":"CH07(3) p.27–28","wiki":"ICMPv6","tags":["ICMPv6"],"img":"img/cn7c-p28-icmpv6.png","imgAlt":"p.28 ICMPv6 messages 네 그룹 — Neighbor discovery·Group membership 아래 protocol 이름과 아래 설명 상자가 가려져 있다","explainImg":"img/cn7c-p28-icmpv6-ans.png","introCard":1},{"id":"u8d-05","type":"mc","q":"ICMPv6 가 통합한 IPv4 프로토콜은?","choices":["ICMP, ARP, IGMP","TCP, UDP","DHCP, DNS","RIP, OSPF"],"answer":0,"explain":"ICMPv6 = ICMP + ARP + IGMP. 네 그룹: error, informational, ND, group membership.","src":"CH07(3) p.27","wiki":"ICMPv6","tags":["ICMPv6"],"introCard":1},{"id":"u8d-06","type":"match","q":"IPv4 → IPv6 전환 방법","pairs":[["dual stack","host 가 IPv4·IPv6 를 둘 다 돌림"],["tunneling","IPv4 region 을 지날 때 IPv6 packet 을 IPv4 packet 에 encapsulate"],["header translation","IPv6 sender → IPv4-only receiver, 경계 라우터가 header 번역"],["dual stack 의 교수 평","simple but stupid, very effective"]],"explain":"tunneling 은 덧씌우고, translation 은 바꿔 쓴다 (p.30–32).","src":"CH07(3) p.30–32","wiki":"tunneling","tags":["tunneling"],"introCard":2},{"id":"u8d-07","type":"mc","q":"수신자가 IPv4 만 이해할 때 쓰는 전환 방법은?","choices":["dual stack","tunneling","header translation","autoconfiguration"],"answer":2,"explain":"수신자가 IPv6 를 모르면 덧씌워도 소용없다 → header 자체를 IPv4 로 번역. IPv6 전용 기능은 빠진다.","src":"CH07(3) p.32","wiki":"header translation","tags":["header translation"],"img":"img/cn7c-p32-trans.png","imgAlt":"p.32 IPv6 host — IPv6 region — (변환 지점) — IPv4 region — IPv4 host. 변환 지점에서 IPv6 header 가 IPv4 header 로 바뀐다","introCard":2},{"id":"u8d-08","type":"tf","q":"dual stack 은 단순하지만(simple but stupid) 매우 효과적인(very effective) 전환 방법이다.","answer":true,"explain":"host 가 두 스택을 다 돌리는 단순한 방법.","src":"CH07(3) p.30","wiki":"dual stack","tags":["dual stack"],"prof":true,"diff":1,"img":"img/cn7c-p30-dual.png","imgAlt":"p.30 host 안에 IPv4 와 IPv6 가 나란히 있고 Upper layers 아래로 IPv4 system·IPv6 system 양쪽과 통신하는 그림","introCard":2},{"id":"u8d-09","type":"order","q":"tunneling 과정","answer":["IPv6 packet 이 IPv4 region 입구에 도착","IPv4 packet 안에 encapsulate","IPv4 region 을 IPv4 로 통과","출구에서 decapsulate 해 IPv6 로 계속"],"explain":"덧씌웠다가 벗긴다.","src":"CH07(3) p.31","wiki":"tunneling","tags":["tunneling"],"introCard":2},{"id":"u8d-10","type":"tf","q":"IPv6 의 flow label 은 TCP 의 flow control 과 같은 기능이다.","answer":false,"explain":"flow label 은 같은 flow 의 packet 을 표시해 특별 처리하는 용도. TCP flow control(receive window)과 다르다.","src":"CH07(3) p.22–24","wiki":"traffic class와 flow label","tags":["traffic class와 flow label"],"introCard":2},{"id":"u8d-11","type":"sa","q":"IPv6 에서 ARP 를 대신하는 ICMPv6 기능의 이름은?","answer":"neighbor discovery","alts":["ND","neighbour discovery"],"explain":"ND ≈ ARP.","src":"CH07(3) p.28","wiki":"neighbor discovery","tags":["neighbor discovery"],"diff":1,"introCard":1},{"id":"u8d-12","type":"tf","q":"IPv4 와 IPv6 모두 재조립은 destination 에서 한다.","answer":true,"explain":"차이는 \"누가 쪼개나\" 뿐이다.","src":"CH07(3) p.26","wiki":"reassembly","tags":["reassembly"],"prof":true,"introCard":0},{"id":"u8d-13","type":"mc","q":"그림의 IPv4 → IPv6 전환 방법은?","choices":["dual stack","tunneling","header translation","NAT"],"answer":1,"explain":"IPv6 host 둘 사이에 IPv4 region 이 있고, 그 구간에서 IPv6 packet 이 **IPv4 header 로 한 번 더 싸여**(encapsulated) Tunnel 을 지난 뒤 나올 때 벗겨진다 → tunneling. header translation 은 header 자체를 바꾸고(p.32), dual stack 은 host 가 두 스택을 다 가진다(p.30).","src":"CH07(3) p.31","wiki":"tunneling","tags":["tunneling"],"img":"img/cn7c-p31-tunnel.png","imgAlt":"p.31 IPv6 host 두 대 사이 IPv4 region, 가운데 Tunnel 위에 IPv4 header + IPv6 header + Payload","introCard":2},{"id":"u8d-14","type":"tf","q":"[O/X] In IPv6, a router that receives a packet larger than the next MTU drops it; only the source can fragment. (If X, correct it.)","answer":true,"explain":"O. p.26 표: Who fragments? IPv6 = **Source only**, 큰 packet 을 받은 router 는 **Drops** it. 교수 1110 39:06: \"may be asked in exams … please remember\".","src":"CH07(3) p.26 · 1110 녹음 39:06","wiki":"IPv6 fragmentation","tags":["IPv6 fragmentation"],"prof":true,"introCard":0}],"intro":[{"title":"fragmentation: source only (시험 힌트)","body":"IPv6 는 **source 만** 쪼갠다. router 가 next MTU 보다 큰 packet 을 받으면 쪼개지 않고 **drop**(ICMPv6 로 알림). 재조립은 IPv4·IPv6 모두 destination. 교수: \"may be asked in exams\".","img":"img/cn7c-p26-frag-ans.png","imgAlt":"IPv4 vs IPv6 fragmentation 표","src":"CH07(3) p.26 · 1110 녹음 39:06"},{"title":"ICMPv6","body":"IPv4 의 ICMP·ARP·IGMP 를 하나로 합쳤다. **ND**(neighbor discovery) 가 ARP 를, **MLD** 가 IGMP 를 대신한다.","img":"img/cn7c-p28-icmpv6-ans.png","imgAlt":"ICMPv6 네 메시지 그룹 (ND, MLD)","src":"CH07(3) p.27–28"},{"title":"IPv4 → IPv6 전환 세 가지","body":"**dual stack**: host 가 IPv4·IPv6 스택을 둘 다(simple but very effective). **tunneling**: IPv4 region 을 지날 때 IPv6 packet 을 IPv4 header 로 싸고 나올 때 벗긴다. **header translation**: 수신자가 IPv4 만 알 때 header 자체를 바꿔 쓴다.","img":"img/cn7c-p31-tunnel.png","imgAlt":"IPv4 region 의 tunnel","src":"CH07(3) p.30–32"}]},{"id":"u8e","title":"PS2 유형 연습 — IPv6 주소 · EUI-64 · 차이점","items":[{"id":"u8e-01","type":"sa","q":"2001:0DB8:0000:00C0:0000:0000:0000:0F00 을 가장 짧게 쓰라.","answer":"2001:DB8:0:C0::F00","alts":["2001:db8:0:c0::f00"],"explain":"앞의 0 제거 → 2001:DB8:0:C0:0:0:0:F00. 가장 긴 0 줄(5–7 번째, 3 개)을 `::` 로 → **2001:DB8:0:C0::F00**. 4 번째의 0 하나는 그대로 둔다.","src":"PS2 유형 · 11/24 과제","wiki":"zero compression","tags":["zero compression"],"prof":true,"introCard":0},{"id":"u8e-02","type":"mc","q":"3FFE::12::7 이 잘못된 주소인 이유는?","choices":["16진수가 아니라서","`::` 를 두 번 써서 숨은 0 section 을 어떻게 나눌지 알 수 없어서","section 이 8 개보다 많아서","앞의 0 을 지워서"],"answer":1,"explain":"`::` 는 주소에 **한 번만** 쓸 수 있다(L14 p.4).","src":"PS2 유형 · 11/24 과제","wiki":"zero compression","tags":["zero compression"],"prof":true,"introCard":0},{"id":"u8e-03","type":"sa","q":"FE80::A:2 를
