c","q":"CDMA 가 사용자를 나누는 기준은?","choices":["주파수","시간 slot","code (같은 시간·같은 주파수)","cell"],"answer":2,"explain":"CDMA 는 frequency 도 time 도 아닌 **code** 로 나눈다. 모두 같은 시간·같은 주파수에서 동시에 보낸다.","src":"CH05(1) p.27","wiki":"CDMA","tags":["CDMA"],"introCard":0},{"id":"u3a-02","type":"cloze","q":"IS-95 는 신호를 넓게 퍼뜨리는 변조 기법 ___ 위에, 다중 접속 방식 ___ 를 얹었다.","answer":["DSSS","CDMA"],"bank":["DSSS","CDMA","FHSS","TDMA","GMSK"],"explain":"\"DSSS: a signal-spreading modulation technique / CDMA: an MA method based on DSSS\" (p.27).","src":"CH05(1) p.27","wiki":"DSSS","tags":["DSSS"],"introCard":2},{"id":"u3a-03","type":"sa","q":"DSSS 의 full term 은?","answer":"Direct-Sequence Spread Spectrum","alts":["Direct Sequence Spread Spectrum"],"explain":"DSSS = Direct-Sequence Spread Spectrum. 비트에 칩열을 곱해 대역을 넓힌다.","src":"CH05(1) p.27","wiki":"DSSS","tags":["DSSS"],"introCard":0},{"id":"u3a-04","type":"sa","q":"CDMA 의 full term 은?","answer":"Code-Division Multiple Access","alts":["Code Division Multiple Access"],"explain":"CDMA = Code-Division Multiple Access. 이름 그대로 사용자를 **code** 로 나누는(division) 다중 접속이다. FDMA 는 frequency, TDMA 는 time 으로 나눈다 — \"the name itself is very important\".","src":"CH05(1) p.27","wiki":"CDMA","tags":["CDMA"],"diff":1,"introCard":0},{"id":"u3a-05","type":"tf","q":"DSSS 로 신호를 넓은 대역에 퍼뜨리면 실어 나르는 정보량도 그만큼 늘어난다.","answer":false,"explain":"퍼뜨려도 **정보량은 같다** (교수 57:15). 넓히는 목적은 multiple access 와 간섭 회피다.","src":"CH05(1) p.27","wiki":"spread spectrum","tags":["spread spectrum"],"introCard":0},{"id":"u3a-06","type":"mc","q":"IS-95 채널 폭(1.228 MHz)이 AMPS(30 kHz)보다 훨씬 넓은 이유는?","choices":["사용자가 적어서","spreading (DSSS) 때문에","FM 을 써서","reuse factor 7 때문에"],"answer":1,"explain":"비트당 칩 64 개를 보내니 대역이 넓어진다. 그 넓은 채널을 여러 사용자가 code 로 함께 쓴다.","src":"CH05(1) p.27–30","wiki":"chip rate","tags":["chip rate"],"introCard":0},{"id":"u3a-07","type":"tf","q":"IS-95 는 North America 와 South Korea 에서 쓰인 2G 표준이다.","answer":true,"explain":"\"One of the dominant 2G standards in North America (and South Korea)\" (p.27).","src":"CH05(1) p.27","wiki":"IS-95","tags":["IS-95"],"diff":1,"introCard":2},{"id":"u3a-08","type":"mc","q":"Walsh code 끼리 성립해야 하는 성질은?","choices":["길이가 다르다","직교(내적 0) — 남의 신호가 수신 때 정확히 0 이 된다","모두 같은 값","랜덤"],"answer":1,"explain":"수신자가 자기 code 를 곱해 평균하면 다른 code 의 몫은 직교성 때문에 0 이 되고 자기 비트만 남는다.","src":"CH05(1) p.29","wiki":"Walsh code","tags":["Walsh code"],"introCard":1},{"id":"u3a-09","type":"num","q":"칩 4 개짜리 Walsh code A = (+1,+1,+1,+1), B = (+1,−1,+1,−1) 의 내적은?","answer":0,"tol":0,"explain":"1 − 1 + 1 − 1 = **0** → 직교. 그래서 A 의 수신자는 B 의 신호를 지울 수 있다.","src":"CH05(1) p.27","wiki":"Walsh code","tags":["Walsh code"],"introCard":1},{"id":"u3a-10","type":"num","q":"A = (+1,+1,+1,+1) 가 비트 1(+1), B = (+1,−1,+1,−1) 가 비트 0(−1) 을 보냈다. 합 신호를 A 로 복원(내적 ÷ 4)하면?","answer":1,"tol":0,"explain":"합 = (+1+(−1), +1+1, +1+(−1), +1+1) = (0, 2, 0, 2). A 와 내적 = 4, ÷ 4 = **+1** → 비트 1. B 의 몫은 사라졌다.","src":"CH05(1) p.27","wiki":"CDMA","tags":["CDMA"],"diff":3,"introCard":1},{"id":"u3a-11","type":"mc","q":"IS-95 의 CDMA 블록도(digitizer → error correcting → spreading → QPSK)를 공부할 때 꼭 기억할 핵심은?","choices":["모든 블록을 외워라","세부 블록은 몰라도 된다, code 로 공유한다는 것을 기억하라","GPS 동기화가 가장 중요하다","QPSK 를 유도하라"],"answer":1,"explain":"\"세부 블록은 몰라도 된다, code 로 공유한다는 것을 기억하라\" (64:45). GPS 동기화는 \"not that important\" (62:29).","src":"1020 녹음 64:45","wiki":"CDMA","tags":["CDMA"],"prof":true,"introCard":0},{"id":"u3a-12","type":"match","q":"multiple access 와 나누는 기준","pairs":[["FDMA","frequency"],["TDMA","time slot"],["CDMA","code"],["FDMA + TDMA","GSM·D-AMPS"]],"explain":"\"무엇으로 사용자를 나누나\" 가 세대 구분의 축이다.","src":"CH05(1) p.18–27","wiki":"CDMA","tags":["CDMA"],"diff":1,"introCard":0},{"id":"u3a-13","type":"sa","q":"[Term] \"A signal-spreading modulation technique.\" Give the term.","answer":"Direct-Sequence Spread Spectrum","alts":["DSSS","Direct Sequence Spread Spectrum"],"explain":"p.27 의 DSSS 정의. \"an MA method based on DSSS\" 는 CDMA 쪽 정의라 헷갈리지 않게 둘을 짝으로 기억한다.","src":"CH05(1) p.27","wiki":"DSSS","tags":["DSSS"],"introCard":0},{"id":"u3a-14","type":"mc","q":"그림 ①②③ (세로축 power, 가로축 frequency·time) 의 multiple access 를 차례로 고른 것은?","choices":["FDMA, TDMA, CDMA","TDMA, FDMA, CDMA","CDMA, TDMA, FDMA","FDMA, CDMA, TDMA"],"answer":0,"explain":"① frequency 축을 따라 칸이 나뉨 → FDMA. ② time 축을 따라 사용자(교수 필기 user 1·2·3)가 나뉨 → TDMA. ③ 같은 시간·같은 주파수에 층으로 겹침, 필기 code 1·2·3 → **CDMA**. \"무엇으로 나누나\" 가 세대 trend 의 축이다.","src":"CH05(1) p.27","wiki":"CDMA","tags":["CDMA"],"img":"img/cn5-p27-ma.png","imgAlt":"p.27 multiple access 그림 세 개 — 각 상자의 이름 ①②③ 이 가려져 있다 (교수 필기 user 1~3, code 1~3)","explainImg":"img/cn5-p27-ma-ans.png","introCard":0}],"intro":[{"title":"DSSS 와 CDMA","body":"**DSSS**(Direct-Sequence Spread Spectrum): 비트마다 chip 열을 곱해 넓은 대역에 퍼뜨리는 변조(정보량은 그대로). **CDMA**(Code-Division Multiple Access): DSSS 위에서 사용자를 **code** 로 나누는 다중 접속 — 모두 같은 시간·같은 주파수에 보낸다.","img":"img/cn5-p27-ma-ans.png","imgAlt":"FDMA / TDMA / CDMA 그림 (user, code 필기)","src":"CH05(1) p.27"},{"title":"Walsh code 의 직교성","body":"Walsh code 끼리 내적이 0(직교). 수신자가 합 신호에 자기 code 를 곱해 평균하면 남의 몫은 0 이 되고 자기 비트만 남는다. 예: A=(1,1,1,1), B=(1,−1,1,−1) 의 내적 0.","src":"CH05(1) p.27, 29"},{"title":"IS-95","body":"North America·**South Korea** 의 2G 표준, DSSS·CDMA 기반. 채널 폭 1.228 MHz 가 넓은 건 spreading 때문. 블록도의 세부보다 \"code 로 함께 쓴다\" 가 핵심.","src":"CH05(1) p.27 · 1020 녹음 64:45"}]},{"id":"u3b","title":"IS-95 forward·reverse","items":[{"id":"u3b-01","type":"tf","q":"IS-95 의 forward 는 BS → MS 방향이다.","answer":true,"explain":"forward = downlink = BS → MS. reverse = uplink = MS → BS.","src":"CH05(1) p.29","wiki":"IS-95 forward 전송","tags":["IS-95 forward 전송"],"prof":true,"diff":1,"introCard":0},{"id":"u3b-02","type":"order","q":"IS-95 forward 전송 단계를 순서대로","answer":["음성 → digitizer 9.6 kbps","error correcting·repeating·interleaving → 19.2 ksps","long code(ESN) 로 scramble","Walsh code (64 chips) 를 곱함 → 1.228 Mcps","QPSK 로 반송파에 실음"],"explain":"9.6 kbps → 19.2 ksps → long code ⊕ → ×64 Walsh → 1.2288 Mcps → QPSK (p.29).","src":"CH05(1) p.29","wiki":"IS-95 forward 전송","tags":["IS-95 forward 전송"],"introCard":0},{"id":"u3b-03","type":"num","q":"IS-95 forward: 19.2 ksps 에 Walsh code 64 chips 를 곱하면 chip rate 는? (Mcps, 소수 넷째 자리)","answer":1.2288,"unit":"Mcps","tol":0.0001,"explain":"19.2 k × 64 = 1,228.8 kcps = **1.2288 Mcps** ≈ 1.228 Mcps.","src":"CH05(1) p.29","wiki":"chip rate","tags":["chip rate"],"img":"img/cn5-p29-chiprate.png","imgAlt":"p.29 IS-95 forward 그림 — Σ 출력·long code generator 출력의 chip rate 와 FDMA 채널 폭이 ? 로 가려져 있다","explainImg":"img/cn5-p29-chiprate-ans.png","introCard":0},{"id":"u3b-04","type":"num","q":"IS-95 reverse: 28.8 ksps 를 6 symbol 씩 묶어 64-chip 으로 바꾸면 몇 kcps?","answer":307.2,"unit":"kcps","tol":0.0001,"explain":"28.8 k ÷ 6 = 4.8 k 묶음/s × 64 = **307.2 kcps**. 이후 long code 로 ×4 → 1.2288 Mcps.","src":"CH05(1) p.30","wiki":"IS-95 reverse 전송","tags":["IS-95 reverse 전송"],"diff":3,"img":"img/cn5-p30-reverse.png","imgAlt":"p.30 IS-95 reverse 그림 — 6 to 64 symbol modulation 출력 rate 가 ? 로 가려져 있다","explainImg":"img/cn5-p30-reverse-ans.png","introCard":1},{"id":"u3b-05","type":"num","q":"IS-95 reverse: 307.2 kcps 에 long code 칩 4 개씩을 곱하면? (Mcps)","answer":1.2288,"unit":"Mcps","tol":0.0001,"explain":"307.2 k × 4 = **1.2288 Mcps** — forward 와 같은 chip rate. 여기가 reverse 의 DSSS.","src":"CH05(1) p.30","wiki":"IS-95 reverse 전송","tags":["IS-95 reverse 전송"],"introCard":1},{"id":"u3b-06","type":"cloze","q":"forward 는 사용자를 ___ 로 나누고, reverse 는 ___ 로 나눈다.","answer":["Walsh code","long code"],"bank":["Walsh code","long code","pilot","GPS","time slot"],"explain":"forward: W0–W63 이 사용자 구분(점선 \"CDMA\"). reverse: Walsh code 는 6→64 변조용이고 사용자 구분은 ESN 의 long code(점선 \"DSSS\").","src":"CH05(1) p.29–30","wiki":"long code와 ESN","tags":["long code와 ESN"],"diff":3,"introCard":0},{"id":"u3b-07","type":"mc","q":"forward 의 digital channel 0 (W0) 의 용도는?","choices":["사용자 음성","pilot channel (all 1s)","paging","GPS"],"answer":1,"explain":"W0 = **pilot channel**. 모든 BS 가 계속 방송해 MS 가 이웃 cell 을 감지한다 → soft handoff.","src":"CH05(1) p.29","wiki":"pilot channel","tags":["pilot channel"],"img":"img/cn5-p29-pilot.png","imgAlt":"p.29 IS-95 forward 그림 — Digital channel 0 (W0, all 1s) 옆 괄호 이름이 ? 로 가려져 있다","explainImg":"img/cn5-p29-pilot-ans.png","introCard":0},{"id":"u3b-08","type":"tf","q":"IS-95 BS 들의 동기화는 MSC 가 맞춘다.","answer":false,"explain":"BS 들은 **GPS** 서비스로 동기화한다 (p.28). 교수: \"not that important\" 지만 함정으로 알아 둔다.","src":"CH05(1) p.28","wiki":"GPS 동기화","tags":["GPS 동기화"],"introCard":2},{"id":"u3b-09","type":"match","q":"IS-95 forward vs reverse","pairs":[["error correcting 후 19.2 ksps","forward (×2)"],["error correcting 후 28.8 ksps","reverse (×3)"],["pilot 이 있다","forward"],["사용자를 long code 로 구분","reverse"]],"explain":"reverse 는 MS 들의 도착 시각이 달라 Walsh 직교성이 깨지므로 long code 로 사용자를 나눈다.","src":"CH05(1) p.29–30","wiki":"IS-95 reverse 전송","tags":["IS-95 reverse 전송"],"diff":3,"introCard":0},{"id":"u3b-10","type":"tf","q":"IS-95 는 FDMA 를 전혀 쓰지 않는다.","answer":false,"explain":"25 MHz 대역을 1.228 MHz 채널 20 개로 나누는 것이 FDMA, 채널 안을 CDMA 로 나눈다.","src":"CH05(1) p.28","wiki":"IS-95 대역과 채널","tags":["IS-95 대역과 채널"],"introCard":2},{"id":"u3b-11","type":"sa","q":"IS-95 에서 MS 마다 고유한 long code 를 만드는 데 쓰는 식별 번호는? (약어)","answer":"ESN","alts":["Electronic Serial Number"],"explain":"ESN → Long code generator (1.228 Mcps). forward 에선 decimator 로 19.2 ksps 에 맞춰 scramble.","src":"CH05(1) p.29","wiki":"long code와 ESN","tags":["long code와 ESN"],"introCard":1},{"id":"u3b-12","type":"mc","q":"IS-95 의 최종 반송파 변조는?","choices":["FM","FSK","QPSK","GMSK"],"answer":2,"explain":"forward·reverse 모두 **QPSK** 로 1.228 MHz 아날로그 채널에 싣는다.","src":"CH05(1) p.29–30","wiki":"QPSK","tags":["QPSK"],"diff":1,"introCard":2},{"id":"u3b-13","type":"mc","q":"그림은 IS-95 forward(BS → MS) 전송이다. W0–W63 을 곱해 Σ 로 합치는 점선 상자 부분의 이름 ? 는?","choices":["CDMA","DSSS","FDMA","TDMA"],"answer":0,"explain":"forward 는 BS 가 64 개 digital channel 에 서로 다른 Walsh code(W0–W63)를 곱해 Σ 로 합친다 → 사용자를 code 로 나누는 **CDMA** 부분. 교수 필기 \"64 user\". 오른쪽 회색 상자가 FDMA(1.228 MHz 채널 20 개).","src":"CH05(1) p.29","wiki":"IS-95 forward 전송","tags":["IS-95 forward 전송"],"img":"img/cn5-p29-cdma.png","imgAlt":"p.29 IS-95 forward 그림 — W0·W1·…·W63 곱셈기를 둘러싼 점선 상자 위 이름이 ? 로 가려져 있다","explainImg":"img/cn5-p29-cdma-ans.png","introCard":0},{"id":"u3b-14","type":"mc","q":"그림은 IS-95 reverse(MS → BS) 전송이다. QPSK 들을 둘러싼 점선 상자 부분의 이름 ? 는?","choices":["DSSS","CDMA","TDMA","GMSK"],"answer":0,"explain":"reverse 는 각 MS 가 ESN 의 long code 로 신호를 퍼뜨려 1.228 Mcps 로 만든다 → **DSSS**. forward 의 \"CDMA\" 와 짝을 이룬다: forward 는 Walsh code 로 사용자 구분, reverse 는 long code(DSSS)로 구분. 왼쪽 아래 \"94 digital channels DSSS\".","src":"CH05(1) p.30","wiki":"IS-95 reverse 전송","tags":["IS-95 reverse 전송"],"diff":3,"img":"img/cn5-p30-dsss.png","imgAlt":"p.30 IS-95 reverse 그림 — QPSK 묶음을 둘러싼 점선 상자 위 이름이 ? 로 가려져 있다","explainImg":"img/cn5-p30-dsss-ans.png","introCard":1},{"id":"u3b-15","type":"num","q":"[Calc 변형] forward 채널에서 digitizer 출력이 8 kbps, error correcting 단계가 symbol 수를 2 배로 늘리고, Walsh code 가 64 chips 이면 chip rate 는? (Mcps)","answer":1.024,"unit":"Mcps","tol":0.0001,"explain":"8 kbps × 2 = 16 ksps → × 64 chips = 1,024 kcps = **1.024 Mcps**. 실제 IS-95 는 9.6 kbps → 19.2 ksps → 1.2288 Mcps.","src":"CH05(1) p.29","wiki":"chip rate","tags":["chip rate"],"introCard":0}],"intro":[{"title":"forward (downlink)","body":"음성 → 9.6 kbps → error correcting(×2) 19.2 ksps → ESN 의 long code 로 scramble → 64-chip **Walsh code** 곱(W0 = pilot, all 1s) → 1.2288 Mcps → Σ → QPSK. Walsh code 로 사용자를 나누는 **CDMA** 부분.","img":"img/cn5-p29-cdma-ans.png","imgAlt":"IS-95 forward: W0~W63 을 곱하는 CDMA 상자","src":"CH05(1) p.29"},{"title":"reverse (uplink)","body":"9.6 kbps → 28.8 ksps(×3) → 6 to 64 symbol modulation 307.2 kcps → long code chip ×4 → 1.2288 Mcps → QPSK. 사용자는 ESN 의 **long code**(DSSS)로 구분한다(도착 시각이 달라 Walsh 직교성이 깨지므로).","img":"img/cn5-p30-reverse-ans.png","imgAlt":"IS-95 reverse: 307.2 kcps, DSSS 상자","src":"CH05(1) p.30"},{"title":"band 와 동기화","body":"각 band 를 1.228 MHz 채널 20 개로 나누고(FDMA, provider 당 10 개) 채널 안을 CDMA 로. BS 들은 **GPS** 로 동기화. 최종 변조 QPSK.","img":"img/cn5-p28-is95band.png","imgAlt":"IS-95 bands, channels and synchronization","src":"CH05(1) p.28"}]},{"id":"u3c","title":"reuse 1 과 soft handoff","items":[{"id":"u3c-01","type":"mc","q":"IS-95 에서 이웃 cell 이 같은 주파수 band 를 쓸 수 있는 이유는?","choices":["cell 이 작아서","이웃 cell 의 간섭이 CDMA/DSSS 전송에 영향을 못 주기 때문","GPS 로 동기화해서","MSC 가 막아 줘서"],"answer":1,"explain":"\"The interference from neighboring cells cannot affect CDMA or DSSS transmission\" (p.31) → reuse factor normally **1**. 교수: CDMA 의 beauty.","src":"CH05(1) p.31","wiki":"IS-95 frequency reuse","tags":["IS-95 frequency reuse"],"prof":true,"introCard":2},{"id":"u3c-02","type":"cloze","q":"IS-95 의 frequency reuse factor 는 normally ___ 이고, soft handoff 는 ___ channel 덕분에 가능하다.","answer":["1","pilot"],"bank":["1","pilot","7","paging","control"],"explain":"reuse 1 + 모든 BS 의 pilot 방송 → MS 가 이웃 BS 를 감지해 soft handoff.","src":"CH05(1) p.31–32","wiki":"IS-95 soft handoff","tags":["IS-95 soft handoff"],"introCard":1},{"id":"u3c-03","type":"tf","q":"soft handoff 는 어느 시스템에서나 똑같이 가능하다.","answer":false,"explain":"IS-95 는 BS 가 **pilot channel** 을 계속 broadcast 하고, 이웃 cell 도 같은 주파수(reuse 1)라 MS 가 두 BS 와 동시에 붙을 수 있다.","src":"CH05(1) p.32","wiki":"IS-95 soft handoff","tags":["IS-95 soft handoff"],"introCard":1},{"id":"u3c-04","type":"order","q":"IS-95 soft handoff 흐름","answer":["모든 BS 가 pilot 을 계속 broadcast","MS 가 자기 cell 과 이웃 cell 의 pilot 을 감지","이웃 pilot 이 충분히 세지면 그 BS 와도 연결 (두 BS 동시)","옛 BS 신호가 약해지면 그 연결을 끊음"],"explain":"make before break. 새 연결을 먼저 만들고 옛 연결을 끊는다.","src":"CH05(1) p.32","wiki":"IS-95 soft handoff","tags":["IS-95 soft handoff"],"introCard":1},{"id":"u3c-05","type":"mc","q":"PS1 1(d): AMPS reuse 7 vs IS-95 reuse 1 의 이유로 옳은 짝은?","choices":["AMPS = CDMA, IS-95 = FDMA","AMPS = FDMA 라 경계 간섭 → 7 / IS-95 = CDMA·DSSS 라 간섭 영향 없음 → 1","둘 다 GPS 때문","둘 다 MSC 결정"],"answer":1,"explain":"AMPS 는 FDMA 라 이웃 cell 경계에서 같은 주파수가 간섭 → reuse 7. IS-95 는 CDMA·DSSS 라 이웃 간섭이 전송에 영향 없음 → reuse 1.","src":"PS1 1(d)","wiki":"frequency reuse","tags":["frequency reuse"],"prof":true,"introCard":0},{"id":"u3c-06","type":"tf","q":"PS1 1(e): hard handoff 에서는 MS 가 BS 하나와만 통신한다.","answer":true,"explain":"hard = BS 1 개와만(break before make), soft = BS 2 개와 동시에(make before break).","src":"PS1 1(e)","wiki":"hard handoff","tags":["hard handoff"],"prof":true,"diff":1,"introCard":1},{"id":"u3c-07","type":"mc","q":"IS-95 band 의 구조를 바르게 말한 것은?","choices":["band 를 1.228 MHz 채널 여러 개로 나누고(FDMA), 채널 하나를 여러 사용자가 code 로 나눠 쓴다(CDMA)","채널 하나에 사용자 한 명","채널을 8 개 time slot 으로 나눈다","band 를 나누지 않고 모든 provider 가 한 채널을 쓴다"],"answer":0,"explain":"p.28: 각 band 를 guard band 로 떨어진 1.228 MHz 채널 20 개로 나누고(FDMA, provider 당 10 개), 그 채널 안을 Walsh code·long code 로 나눈다(CDMA). 숫자(20·10)보다 **FDMA 위의 CDMA** 라는 구조가 핵심이다.","src":"CH05(1) p.28","wiki":"IS-95 대역과 채널","tags":["IS-95 대역과 채널"],"diff":1,"introCard":0},{"id":"u3c-08","type":"match","q":"handoff 와 관련 개념","pairs":[["pilot channel","MS 가 이웃 BS 를 감지하는 신호"],["MSC","handoff 결정"],["soft handoff","IS-95 가 쓰는 방식"],["hard handoff","early systems (AMPS 등)"]],"explain":"1강의 handoff 결정(MSC)과 3강의 pilot 을 묶어 기억한다.","src":"CH05(1) p.15–32","wiki":"soft handoff","tags":["soft handoff"],"introCard":1},{"id":"u3c-09","type":"tf","q":"reuse factor 1 이면 cell 마다 전체 주파수를 다 쓸 수 있어 cell 당 용량 면에서 유리하다.","answer":true,"explain":"cell 당 채널 = 전체 / N. N = 1 이면 나누지 않아도 된다. 간섭에 강한 CDMA 라서 가능.","src":"CH05(1) p.31","wiki":"IS-95 frequency reuse","tags":["IS-95 frequency reuse"],"diff":3,"introCard":0},{"id":"u3c-10","type":"sa","q":"IS-95 의 BS 가 모든 MS 가 듣도록 계속 방송하는 W0 채널의 이름은?","answer":"pilot channel","alts":["pilot"],"explain":"W0 (all 1s) = pilot channel. soft handoff 의 근거.","src":"CH05(1) p.29,32","wiki":"pilot channel","tags":["pilot channel"],"diff":1,"introCard":1},{"id":"u3c-11","type":"mc","q":"[PS1 1(d)] IS-95 의 frequency reuse factor 가 1 인 이유를 가장 정확히 말한 문장은?","choices":["The interference from neighboring cells cannot affect CDMA or DSSS transmission.","Neighboring cells cannot use the same set of frequencies for communication.","To provide synchronization, BSs use the service of GPS.","MSC monitors the level of the signal every few seconds."],"answer":0,"explain":"p.31 의 Why? 답. 둘째 보기는 AMPS(FDMA)가 reuse 7 인 이유(p.11)라 반대쪽 근거다. PS1 해설: \"cannot affect\" 를 그대로 쓰고 \"간섭이 아예 없다\" 고 쓰지는 않는다.","src":"PS1 1(d) · CH05(1) p.31","wiki":"IS-95 frequency reuse","tags":["IS-95 frequency reuse"],"prof":true,"introCard":0},{"id":"u3c-12","type":"cloze","q":"[PS1 1(e)] IS-95 에서는 모든 BS 가 ___ channel 로 계속 방송하고, MS 가 자기 cell 과 ___ cell 의 그 신호를 감지할 수 있어서 soft handoff 가 가능하다.","answer":["pilot","neighboring"],"bank":["pilot","neighboring","paging","control","home"],"explain":"p.32 두 문장: \"Every BS continuously broadcasts signals using its pilot channel\" + \"MS can detect the pilot signal from its cell and neighboring cells\".","src":"PS1 1(e) · CH05(1) p.32","wiki":"IS-95 soft handoff","tags":["IS-95 soft handoff"],"prof":true,"introCard":1},{"id":"u3c-13","type":"tf","q":"[O/X] In a soft handoff, the MS releases the channel of the old BS before it connects to the new BS. (If X, correct it.)","answer":false,"explain":"X. 설명한 것은 **hard handoff**(break before make). soft handoff 는 두 BS 와 동시에 통신하며 새 BS 를 먼저 잡고 옛 BS 를 놓는다(make before break).","src":"PS1 1(e) · CH05(1) p.16","wiki":"soft handoff","tags":["soft handoff"],"prof":true,"introCard":1}],"intro":[{"title":"reuse factor 1","body":"\"The interference from neighboring cells cannot affect CDMA or DSSS transmission\" → 이웃 cell 이 같은 band 를 쓸 수 있어 reuse factor normally **1**. AMPS 는 FDMA 라 7. N = 1 이면 cell 마다 전체 채널 사용.","src":"CH05(1) p.31"},{"title":"IS-95 soft handoff","body":"모든 BS 가 **pilot channel** 로 계속 방송하고, MS 가 자기 cell 과 이웃 cell 의 pilot 을 감지 → 이웃 BS 가 세지면 두 BS 와 동시에 연결(make before break). 같은 주파수(reuse 1)라 주파수를 바꿀 필요도 없다.","src":"CH05(1) p.32 · PS1 1(e)"},{"title":"handoff 관련 개념 정리","body":"handoff 결정은 MSC, IS-95 의 soft handoff 근거는 pilot channel, hard handoff 는 AMPS 같은 early systems. reuse 1 이라 이웃 BS 로 넘어갈 때 주파수를 바꿀 필요가 없다.","src":"CH05(1) p.15–32"}]},{"id":"u3d","title":"3G IMT-2000 과 4G","items":[{"id":"u3d-01","type":"tf","q":"IMT-2000 은 하나의 구체적인 3G 표준이다.","answer":false,"explain":"IMT-2000 은 ITU 가 낸 **blueprint** (요구사항)이지 actual standard 가 아니다. 그 아래 5 개 표준(IMT-DS, MC, TC, SC, FT).","src":"CH05(1) p.33","wiki":"IMT-2000","tags":["IMT-2000"],"prof":true,"introCard":0},{"id":"u3d-02","type":"mc","q":"2G → 3G 의 key point (main goal) 는?","choices":["analog → digital","universal personal communication — voice 를 넘어 text·data","all-IP","reuse 7 → 1"],"answer":1,"explain":"IMT-2000 의 main goal = universal personal communication. voice 에서 data 로.","src":"CH05(1) p.33","wiki":"3G","tags":["3G"],"introCard":0},{"id":"u3d-03","type":"sa","q":"IMT-2000 blueprint 를 낸 국제기구는? (약어)","answer":"ITU","alts":["International Telecommunication Union"],"explain":"ITU = International Telecommunication Union.","src":"CH05(1) p.33","wiki":"ITU","tags":["ITU"],"diff":1,"introCard":0},{"id":"u3d-04","type":"tf","q":"3G 는 packet-switched 만 지원한다.","answer":false,"explain":"3G(IMT-2000)는 **packet + circuit** 둘 다. all-IP packet-switched 는 4G.","src":"CH05(1) p.33,36","wiki":"circuit switching과 packet switching","tags":["circuit switching과 packet switching"],"introCard":0},{"id":"u3d-05","type":"match","q":"IMT-2000 표준과 정체","pairs":[["IMT-DS","W-CDMA (Europe, 한국 3G)"],["IMT-MC","CDMA 2000 (IS-95 진화, North America)"],["ITU","blueprint 발행"],["4G","all-IP packet-switched"]],"explain":"한국 3G 는 W-CDMA(IMT-DS). CDMA 2000 은 IS-95 의 개선판 (p.35).","src":"CH05(1) p.34–36","wiki":"IMT-2000 표준","tags":["IMT-2000 표준"],"introCard":1},{"id":"u3d-06","type":"mc","q":"IMT-2000 data rate 요구에서 가장 빠른 조건은?","choices":["moving vehicle","pedestrian","stationary user (office·home)","모두 같다"],"answer":2,"explain":"144 kbps(차량) \u003c 384 kbps(보행) \u003c 2 Mbps(정지). 숫자보다 \"빨리 움직일수록 느리다\" 는 경향.","src":"CH05(1) p.33","wiki":"IMT-2000","tags":["IMT-2000"],"diff":1,"introCard":0},{"id":"u3d-07","type":"cloze","q":"4G 는 ___ packet-switched 이고, 3G 는 packet 과 ___ switching 을 함께 지원한다.","answer":["all-IP","circuit"],"bank":["all-IP","circuit","analog","FDMA","TDMA"],"explain":"circuit → packet → all-IP 가 세대 trend 의 하나.","src":"CH05(1) p.33,36","wiki":"all-IP","tags":["all-IP"],"introCard":0},{"id":"u3d-08","type":"mc","q":"4G 에 기대되는 특징으로 맞지 **않는** 것은?","choices":["spectrally efficient, high capacity","heterogeneous network 간 smooth handoff","all-IP packet-switched","circuit switching 전용"],"answer":3,"explain":"4G 는 all-IP packet-switched. circuit 전용이 틀린 보기.","src":"CH05(1) p.36","wiki":"4G","tags":["4G"],"introCard":0},{"id":"u3d-09","type":"order","q":"세대별 핵심 변화를 순서대로","answer":["1G: analog voice","2G: digital voice","3G: voice + data (universal personal communication)","4G: all-IP packet-switched"],"explain":"analog → digital → data → all-IP. 교수가 강조한 trend.","src":"CH05(1) p.18–36","wiki":"셀룰러 세대","tags":["셀룰러 세대"],"introCard":2},{"id":"u3d-10","type":"tf","q":"세대가 갈수록 채널 bandwidth 가 넓어지는 경향이 있다.","answer":true,"explain":"30 kHz → 200 kHz → 1.228 MHz → 5 MHz(W-CDMA) 처럼 넓어진다. narrowband → wideband.","src":"CH05(1) p.18–36","wiki":"셀룰러 세대 비교표","tags":["셀룰러 세대 비교표"],"introCard":2},{"id":"u3d-11","type":"mc","q":"CDMA 2000 은 무엇의 진화인가?","choices":["GSM","IS-95","AMPS","W-CDMA"],"answer":1,"explain":"IMT-MC = CDMA 2000 = IS-95 의 개선판(North America). W-CDMA 는 GSM 계열 유럽·한국.","src":"CH05(1) p.35","wiki":"CDMA 2000","tags":["CDMA 2000"],"introCard":1},{"id":"u3d-12","type":"tf","q":"한국이 쓴 3G 는 W-CDMA 이다.","answer":true,"explain":"IMT-DS = W-CDMA (Europe, 한국 3G). 2G 는 IS-95.","src":"CH05(1) p.35","wiki":"W-CDMA","tags":["W-CDMA"],"diff":1,"introCard":1},{"id":"u3d-13","type":"cloze","q":"IMT-2000 은 ___ 가 낸 3G 의 ___ 이다.","answer":["ITU","blueprint"],"bank":["ITU","blueprint","IEEE","actual standard","ETRI"],"explain":"\"A blueprint of 3G issued by ITU\" — 실제 표준은 그 아래 IMT-DS·MC 등.","src":"CH05(1) p.33","wiki":"IMT-2000","tags":["IMT-2000"],"prof":true,"introCard":0},{"id":"u3d-14","type":"sa","q":"[Term] \"A blueprint of 3G issued by ITU.\" Give the term.","answer":"IMT-2000","alts":["IMT 2000","Internet Mobile Telecommunications 2000"],"explain":"p.33. 교수 필기 \"blueprint, not actual standard\" — 실제 표준은 IMT-DS(W-CDMA)·IMT-MC(CDMA 2000) 등 다섯 개.","src":"CH05(1) p.33","wiki":"IMT-2000","tags":["IMT-2000"],"prof":true,"introCard":0},{"id":"u3d-15","type":"mc","q":"그림은 IMT-2000 의 다섯 표준이다. 가린 multiple access 중 IMT-DS 와 IMT-MC 의 것은?","choices":["둘 다 CDMA","IMT-DS 는 TDMA, IMT-MC 는 CDMA","둘 다 TDMA & FDMA","IMT-DS 는 CDMA & TDMA"],"answer":0,"explain":"IMT-DS(W-CDMA, 한국 3G)·IMT-MC(CDMA 2000, IS-95 의 진화) 모두 **CDMA**. 교수가 빨간 상자로 묶은 두 개다. 나머지는 IMT-TC CDMA & TDMA, IMT-SC TDMA, IMT-FT TDMA & FDMA. 3G 의 주류가 CDMA 라는 trend 를 보는 그림.","src":"CH05(1) p.34–35","wiki":"IMT-2000 표준","tags":["IMT-2000 표준"],"img":"img/cn5-p35-imt.png","imgAlt":"p.35 Third generation 아래 IMT-DS·MC·TC·SC·FT 다섯 상자, 각 아래 multiple access 가 ? 로 가려져 있다","explainImg":"img/cn5-p35-imt-ans.png","introCard":1}],"intro":[{"title":"3G: IMT-2000","body":"ITU 가 낸 3G 의 **blueprint**(actual standard 아님). main goal = universal personal communication(voice → data). data rate: 차량 144 kbps \u003c 보행 384 kbps \u003c 정지 2 Mbps. packet + circuit 둘 다 지원.","img":"img/cn5-p33-imt2000.png","imgAlt":"IMT-2000 key features","src":"CH05(1) p.33"},{"title":"IMT-2000 의 다섯 표준","body":"IMT-DS = W-CDMA(Europe, 한국 3G, 5 MHz), IMT-MC = CDMA 2000(IS-95 의 진화, North America) — 둘 다 CDMA. 나머지 TC·SC·FT 는 TDMA 계열 혼합.","img":"img/cn5-p35-imt-ans.png","imgAlt":"IMT-DS·MC·TC·SC·FT 와 multiple access","src":"CH05(1) p.34–35"},{"title":"4G","body":"spectrally efficient, high capacity, heterogeneous network 사이 smooth handoff, 그리고 **all-IP packet-switched**. 세대 흐름: analog voice → digital voice → voice+data → all-IP, 채널 폭은 30 kHz → 200 kHz → 1.228 MHz → 5 MHz 로 넓어진다.","img":"img/cn5-p36-4g.png","imgAlt":"4G 에 기대되는 특징 목록","src":"CH05(1) p.36"}]}]},{"id":"u4","title":"4강 위성","desc":"구성·orbit · Kepler's law 계산 · GEO·MEO·LEO · 위성 uplink","lessons":[{"id":"u4a","title":"위성 network 구성과 orbit","items":[{"id":"u4a-01","type":"tf","q":"satellite network 도 cellular 처럼 any type of communication 을 제공하는 wireless WAN 이다.","answer":true,"explain":"p.2 정의가 cellular telephony(L10 p.8)와 글자 그대로 같다. 차이는 중계기가 땅 위 탑이냐 궤도의 위성이냐.","src":"CH05(2) p.2","wiki":"satellite network","tags":["satellite network"],"diff":1,"introCard":0},{"id":"u4a-02","type":"match","q":"Starlink 구성 segment 를 연결하시오","pairs":[["space segment","궤도의 위성 + ISL"],["user segment","집·폰의 user terminal"],["ground segment","gateway 안테나가 지상 Internet 에 붙는 곳"],["ISL","위성 ↔ 위성 링크"]],"explain":"p.3 그림: space / ground / user segment. ISL = Inter-Satellite Link.","src":"CH05(2) p.3","wiki":"satellite network 구성","tags":["satellite network 구성"],"img":"img/cn5b-p03-segments.png","imgAlt":"p.3 Starlink System Architecture — 세 segment 이름 ①②③ 이 가려져 있다","explainImg":"img/cn5b-p03-segments-ans.png","introCard":0},{"id":"u4a-03","type":"sa","q":"위성끼리 직접 잇는 링크 ISL 의 full term 은?","answer":"Inter-Satellite Link","alts":["Inter Satellite Link"],"explain":"ISL = Inter-Satellite Link. LEO 그림의 세 링크(UML·GWL·ISL) 중 하나.","src":"CH05(2) p.3,21","wiki":"ISL","tags":["ISL"],"introCard":0},{"id":"u4a-04","type":"match","q":"orbit 과 궤도면","pairs":[["equatorial orbit","적도면 위"],["inclined orbit","적도면에 기울어진 면"],["polar orbit","남극·북극을 지나는 면"],["LEO","polar 와 inclined orbit 을 쓴다"]],"explain":"p.4 의 세 orbit. GEO 는 equatorial, LEO 는 polar·inclined.","src":"CH05(2) p.4","wiki":"orbit","tags":["orbit"],"img":"img/cn5b-p04-orbits.png","imgAlt":"p.4 세 orbit 그림 — 아래 caption ①②③ 이 가려져 있다","explainImg":"img/cn5b-p04-orbits-ans.png","introCard":1},{"id":"u4a-05","type":"tf","q":"satellite network 의 node 는 위성뿐이다.","answer":false,"explain":"지상의 user terminal, gateway 도 node 다 (p.3).","src":"CH05(2) p.3","wiki":"satellite network 구성","tags":["satellite network 구성"],"introCard":0},{"id":"u4a-06","type":"mc","q":"GEO 위성이 도는 orbit 은?","choices":["polar","inclined","equatorial","random"],"answer":2,"explain":"\"The orbit occurs at the equatorial plane\" (p.16).","src":"CH05(2) p.16","wiki":"equatorial orbit","tags":["equatorial orbit"],"diff":1,"introCard":1},{"id":"u4a-07","type":"mc","q":"LEO 위성이 주로 쓰는 orbit 은?","choices":["equatorial 만","polar and inclined","geostationary","Van Allen belt 안"],"answer":1,"explain":"\"Polar and inclined orbits\" (p.20). equatorial 은 GEO.","src":"CH05(2) p.20","wiki":"polar orbit","tags":["polar orbit"],"introCard":1},{"id":"u4a-08","type":"cloze","q":"period of a satellite 는 위성이 지구를 ___ 바퀴 도는 시간이고 단위는 ___ 이다.","answer":["한","초"],"bank":["한","초","두","분","시간"],"explain":"Kepler 식의 period 단위는 seconds, distance 는 km (p.6).","src":"CH05(2) p.5–6","wiki":"period of a satellite","tags":["period of a satellite"],"diff":1,"introCard":4},{"id":"u4a-09","type":"match","q":"그림은 LEO 위성망이다. 링크·영역 이름과 뜻을 연결하시오","pairs":[["UML","위성 ↔ 사용자 폰"],["GWL","위성 ↔ 지상 gateway"],["ISL","위성 ↔ 위성"],["footprint","위성 하나가 지상에 비추는 영역"]],"explain":"UML = User Mobile Link, GWL = GateWay Link, ISL = Inter-Satellite Link (p.21).","src":"CH05(2) p.21","wiki":"UML과 GWL","tags":["UML과 GWL"],"img":"img/cn5b-p21-links.png","imgAlt":"p.21 LEO 그림 — 위성끼리 ①, 위성–폰 ②, 위성–gateway ③ 링크 이름이 가려져 있다","explainImg":"img/cn5b-p21-links-ans.png","introCard":3},{"id":"u4a-10","type":"tf","q":"위성에서도 uplink = MS → BS 로 정의한다.","answer":false,"explain":"위성 **uplink = Earth → satellite**, downlink = satellite → Earth (p.15). 셀룰러(MS → BS)와 짝지어 외운다.","src":"CH05(2) p.15","wiki":"uplink와 downlink","tags":["uplink와 downlink"],"prof":true,"introCard":2},{"id":"u4a-11","type":"mc","q":"SATCOM 주파수 표의 trend 로 옳은 것은?","choices":["모든 band 에서 downlink 주파수 > uplink","모든 band 에서 uplink 주파수 > downlink, band 가 높을수록 bandwidth ↑","bandwidth 는 모두 같다","L band 의 bandwidth 가 가장 크다"],"answer":1,"explain":"L 1.5/1.6 … Ka 20/30 GHz — uplink 가 항상 높고, L → Ka 로 bandwidth 15 → 3500 MHz.","src":"CH05(2) p.15","wiki":"SATCOM 주파수 대역","tags":["SATCOM 주파수 대역"],"img":"img/cn5b-p15-satcom.png","imgAlt":"p.15 SATCOM 주파수 표 — Band L·S·C·Ku·Ka 의 Downlink GHz, Uplink GHz, Bandwidth MHz","introCard":2},{"id":"u4a-12","type":"sa","q":"위성 통신에서 지상(Earth) → 위성 방향을 무엇이라 하나?","answer":"uplink","alts":["up link"],"explain":"Earth → satellite = uplink. 보내는 쪽이 땅이면 uplink.","src":"CH05(2) p.15","wiki":"uplink와 downlink","tags":["uplink와 downlink"],"prof":true,"diff":1,"introCard":2},{"id":"u4a-13","type":"cloze","q":"위성 통신에서 uplink 는 ___ → ___ 방향이다.","answer":["Earth","satellite"],"bank":["Earth","satellite","MS","BS","gateway"],"explain":"p.15: uplink = Earth → satellite. 셀룰러 uplink(MS → BS)와 짝지어 외운다.","src":"CH05(2) p.15","wiki":"uplink와 downlink","tags":["uplink와 downlink"],"prof":true,"introCard":2},{"id":"u4a-14","type":"mc","q":"그림 ①②③ 의 orbit 이름을 차례로 고른 것은?","choices":["equatorial, inclined, polar","polar, inclined, equatorial","inclined, equatorial, polar","equatorial, polar, inclined"],"answer":0,"explain":"① 적도를 따라 도는 **equatorial**(GEO 가 쓰는 면), ② 기울어진 **inclined**, ③ 남·북극을 지나는 **polar**. LEO 는 polar·inclined 를 쓴다 (p.20).","src":"CH05(2) p.4","wiki":"orbit","tags":["orbit"],"img":"img/cn5b-p04-orbits.png","imgAlt":"p.4 세 orbit 그림 — 아래 caption ①②③ 이 가려져 있다","explainImg":"img/cn5b-p04-orbits-ans.png","introCard":1},{"id":"u4a-15","type":"sa","q":"[Term] \"A combination of nodes, including satellites, that provides communication from one point on the Earth to another.\" Give the term.","answer":"satellite network","alts":["satellite networks"],"explain":"p.3 정의. node 에는 위성뿐 아니라 user terminal·gateway 도 들어간다는 점이 \"combination of nodes, including satellites\" 에 담겨 있다.","src":"CH05(2) p.3","wiki":"satellite network","tags":["satellite network"],"diff":1,"introCard":0}],"intro":[{"title":"satellite network 구성","body":"satellite 를 포함한 node 들의 조합으로 지구의 한 점에서 다른 점으로 통신. space segment(위성 + 위성끼리 **ISL**), user segment(user terminal), ground segment(gateway → Internet). user terminal·gateway 도 node.","img":"img/cn5b-p03-segments-ans.png","imgAlt":"Starlink System Architecture 의 세 segment","src":"CH05(2) p.2–3"},{"title":"orbit 세 가지","body":"equatorial(적도면, GEO), inclined(기울어진 면), polar(남·북극을 지남). LEO 는 polar·inclined 를 쓴다.","img":"img/cn5b-p04-orbits-ans.png","imgAlt":"equatorial / inclined / polar orbit","src":"CH05(2) p.4"},{"title":"위성 uplink / downlink","body":"위성 **uplink = Earth → satellite**, downlink = satellite → Earth. SATCOM 표에서 band 마다 uplink 주파수가 downlink 보다 높고, L → Ka 로 갈수록 bandwidth 가 커진다.","img":"img/cn5b-p15-satcom.png","imgAlt":"SATCOM 주파수 표","src":"CH05(2) p.15"},{"title":"LEO 그림의 링크","body":"UML(위성 ↔ 사용자 폰), GWL(위성 ↔ gateway), ISL(위성 ↔ 위성). 위성 하나가 지상에 비추는 영역 = footprint.","img":"img/cn5b-p21-links-ans.png","imgAlt":"LEO: ISL, UML, GWL, footprint","src":"CH05(2) p.21"},{"title":"period of a satellite","body":"위성이 지구를 **한 바퀴** 도는 데 걸리는 시간. Kepler 식에서 단위는 **초**(seconds), distance 는 km.","src":"CH05(2) p.5–6"}]},{"id":"u4b","title":"Kepler's law 계산","items":[{"id":"u4b-01","type":"cloze","q":"Kepler's law: Period [s] = ___ × distance^___ 이고 distance 는 ___ 부터 잰다.","answer":["1/100","1.5","지구 중심"],"bank":["1/100","1.5","지구 중심","100","2","지표면"],"explain":"Period = C × distance^1.5, C ≈ 1/100, distance [km] = 고도 + **6378**.","src":"CH05(2) p.6","wiki":"Kepler's law","tags":["Kepler's law"],"prof":true,"introCard":0},{"id":"u4b-02","type":"num","q":"달의 고도는 약 384,000 km 다. Kepler's law (Period = (1/100) × distance^1.5, distance 는 지구 중심부터 km, 지구 반지름 6,378 km) 로 구한 달의 주기는 약 몇 초? (천 단위 반올림 허용)","answer":2439090,"unit":"s","tol":0.001,"explain":"distance = 384,000 + 6378 = 390,378 → 390,378^1.5 ≈ 243,909,099 → ÷100 ≈ **2,439,090 s ≈ 1 month**.","src":"CH05(2) p.8","wiki":"Example 5.1 달의 주기","tags":["Example 5.1 달의 주기"],"prof":true,"img":"img/cn5b-p08-moon.png","imgAlt":"p.8 Example 5.1 풀이 — Period 식의 결과가 = ? 로 가려져 있다. 위쪽에 교수가 그린 r(지구 반지름) + d(고도) 그림","explainImg":"img/cn5b-p08-moon-ans.png","introCard":0},{"id":"u4b-03","type":"num","q":"고도 35,786 km 위성의 주기는 약 몇 초? (Period = (1/100) × distance^1.5, distance = 고도 + 6,378 km)","answer":86579,"unit":"s","tol":0.001,"explain":"35,786 + 6378 = 42,164 → 42,164^1.5 ≈ 8,657,903 → ÷100 ≈ **86,579 s ≈ 24 h** = 지구 자전 → geostationary.","src":"CH05(2) p.10","wiki":"Example 5.2 정지궤도 주기","tags":["Example 5.2 정지궤도 주기"],"prof":true,"img":"img/cn5b-p10-geo.png","imgAlt":"p.10 Example 5.2 풀이 — Period 식의 결과와 아래 해설 문단이 가려져 있다","explainImg":"img/cn5b-p10-geo-ans.png","introCard":0},{"id":"u4b-04","type":"num","q":"PS1 2(a): Starlink 고도 550 km 의 period 는 몇 분? (소수 첫째 자리)","answer":96.1,"unit":"min","tol":0.002,"explain":"d = 550 + 6378 = 6,928 → 6,928^1.5 ≈ 576,649 → ÷100 = 5,766 s → ÷60 ≈ **96.1 min**. LEO 90–120 min 안.","src":"PS1 2(a)","wiki":"Kepler's law","tags":["Kepler's law"],"prof":true,"introCard":1},{"id":"u4b-05","type":"num","q":"[함정] Starlink(550 km)의 주기를 반지름 6378 을 빼먹고 계산하면 약 몇 초가 나오나? (이 값으로 실수를 알아차리는 연습)","answer":129,"unit":"s","tol":0.01,"explain":"550^1.5 / 100 ≈ **129 s** ≈ 2 분. 2 분에 지구를 한 바퀴 도는 궤도는 있을 수 없으니 반지름을 빼먹었다는 신호다. 올바른 값은 6,928^1.5 / 100 ≈ 5,766 s ≈ 96 min (PS1 2(a)). 교수 필기의 그림처럼 distance = r(지구 반지름) + d(고도), 지구 **중심**부터 잰다.","src":"CH05(2) p.6–8 · PS1 2(a)","wiki":"Kepler's law","tags":["Kepler's law"],"diff":3,"introCard":0},{"id":"u4b-06","type":"num","q":"[PS1 2(b)] 주기가 24 h(86,400 s) 인 GEO 위성의 지표면 위 고도는 약 몇 km? (Period = C × distance^1.5, C = 1/100, 지구 반지름 6,378 km)","answer":35728,"unit":"km","tol":0.001,"explain":"d^1.5 = 8,640,000 → d = 8,640,000^(2/3) ≈ 42,106 km → h = 42,106 − 6378 ≈ **35,728 km** (35,786 과의 차이는 C 근사 때문).","src":"PS1 2(b)","wiki":"Example 5.2 정지궤도 주기","tags":["Example 5.2 정지궤도 주기"],"prof":true,"diff":3,"introCard":0},{"id":"u4b-07","type":"num","q":"MEO GPS 고도 약 18,000 km 의 period 는 약 몇 시간? (소수 첫째 자리)","answer":10.6,"unit":"h","tol":0.01,"explain":"18,000 + 6378 = 24,378 → ^1.5 ≈ 3,806,200 → ÷100 = 38,062 s → ÷3600 ≈ **10.6 h**.","src":"CH05(2) p.18","wiki":"period of a satellite","tags":["period of a satellite"],"introCard":0},{"id":"u4b-08","type":"num","q":"LEO 상한 2,000 km 의 period 는 약 몇 분? (정수)","answer":128,"unit":"min","tol":0.01,"explain":"8,378^1.5 / 100 ≈ 7,669 s ≈ **128 min**. 슬라이드 \"90 to 120 min\" 은 근사.","src":"CH05(2) p.20","wiki":"LEO","tags":["LEO"],"introCard":0},{"id":"u4b-09","type":"tf","q":"Kepler's law 에 따르면 높이 떠 있는 위성일수록 빨리 돈다.","answer":false,"explain":"주기 ∝ distance^1.5 → **높을수록 느리다** (LEO 90–120 min, GEO 24 h).","src":"CH05(2) p.6","wiki":"period of a satellite","tags":["period of a satellite"],"introCard":0},{"id":"u4b-10","type":"num","q":"distance 가 4 배가 되면 period 는 몇 배?","answer":8,"unit":"배","tol":0,"explain":"4^1.5 = 4 × √4 = **8 배**.","src":"CH05(2) p.6","wiki":"Kepler's law","tags":["Kepler's law"],"introCard":0},{"id":"u4b-11","type":"order","q":"Kepler 계산 순서","answer":["고도 h 를 읽는다","distance = h + 6378","distance^1.5 를 구한다","× 1/100 → 초","÷3600 → 시간 (또는 ÷60 → 분)"],"explain":"반지름 더하기가 2 단계. 빼먹으면 달 2,379,561 s 같은 오답.","src":"CH05(2) p.6–10","wiki":"Kepler's law","tags":["Kepler's law"],"introCard":0},{"id":"u4b-12","type":"num","q":"[PS1 2(c)] GEO 위성(고도 35,786 km)이 두 지상국 바로 위에 있다. Earth → 위성 → Earth one-way propagation delay 는 약 몇 ms? (c = 3×10^8 m/s)","answer":238.6,"unit":"ms","tol":0.002,"explain":"거리 = 2 × 35,786 km = 7.1572×10^7 m → ÷ 3×10^8 = 0.2386 s = **238.6 ms**. 여기선 반지름을 더하지 않는다(지표면–위성 거리).","src":"PS1 2(c)","wiki":"GEO","tags":["GEO"],"prof":true,"diff":3,"introCard":2},{"id":"u4b-13","type":"num","q":"[PS1 2(c)] LEO 위성(고도 550 km)이 두 지상국 바로 위에 있다. Earth → 위성 → Earth one-way propagation delay 는 약 몇 ms? (c = 3×10^8 m/s)","answer":3.67,"unit":"ms","tol":0.005,"explain":"2 × 550 km = 1.1×10^6 m ÷ 3×10^8 = **3.67 ms**. 그래서 video call 엔 LEO 가 적합.","src":"PS1 2(c)","wiki":"LEO","tags":["LEO"],"prof":true,"introCard":2},{"id":"u4b-14","type":"cloze","q":"Ex 5.2: distance = 35,786 + ___ = 42,164 km → period ≈ ___ h","answer":["6378","24"],"bank":["6378","24","6400","12","1"],"explain":"지구 반지름 6378 km 를 더한다. 86,579 s ≈ 24 h = 지구 자전 → geostationary.","src":"CH05(2) p.10","wiki":"Example 5.2 정지궤도 주기","tags":["Example 5.2 정지궤도 주기"],"prof":true,"introCard":0},{"id":"u4b-15","type":"num","q":"[PS1 2(a) 변형] A LEO satellite orbits at an altitude of 1,200 km. Using Kepler's law with C ≈ 1/100 and an Earth radius of 6,378 km, find its period in minutes. (소수 첫째 자리)","answer":110,"unit":"min","tol":0.005,"explain":"d = 1,200 + 6,378 = 7,578 km → √7,578 ≈ 87.05 → 7,578^1.5 ≈ 659,700 → ×1/100 ≈ 6,597 s → ÷60 ≈ **110 min**. LEO 의 90–120 min 안이라 검산이 된다.","src":"PS1 2(a) 변형","wiki":"Kepler's law","tags":["Kepler's law"],"prof":true,"introCard":0},{"id":"u4b-16","type":"num","q":"[PS1 2(b) 변형] 주기가 12 h(43,200 s) 인 위성의 지표면 위 고도는 약 몇 km? (Period = C × distance^1.5, C = 1/100, R = 6,378 km, 정수)","answer":20147,"unit":"km","tol":0.002,"explain":"d^1.5 = 43,200 × 100 = 4,320,000 → d = 4,320,000^(2/3) ≈ 26,525 km → h = 26,525 − 6,378 ≈ **20,147 km**. MEO(GPS 18,000 km 근처) 범위다. 구한 d 에서 반지름을 빼야 고도.","src":"PS1 2(b) 변형","wiki":"Kepler's law","tags":["Kepler's law"],"prof":true,"diff":3,"introCard":0},{"id":"u4b-17","type":"num","q":"[PS1 2(c) 변형] 고도 20,000 km 위성이 두 지상국 바로 위에 있다. Earth → satellite → Earth one-way propagation delay 는 약 몇 ms? (c = 3×10^8 m/s, 소수 첫째 자리)","answer":133.3,"unit":"ms","tol":0.002,"explain":"거리 = 2 × 20,000 km = 4×10^7 m → ÷ 3×10^8 = 0.1333 s = **133.3 ms**. 지연은 지표면–위성 거리라 반지름을 더하지 않는다 (Kepler 식과 반대).","src":"PS1 2(c) 변형","wiki":"MEO","tags":["MEO"],"prof":true,"introCard":2},{"id":"u4b-18","type":"mc","q":"[PS1 2(c)] distance 에 지구 반지름 6,378 km 를 더해야 하는 계산은?","choices":["Kepler's law 로 주기 구하기","위성 바로 아래 지상국까지 propagation delay 구하기","둘 다","둘 다 아니다"],"answer":0,"explain":"Kepler 식의 distance 는 지구 **중심**부터 잰 궤도 반지름이라 고도 + 6,378. propagation delay 는 전파가 실제로 지나가는 지표면–위성 거리(= 고도)를 쓴다. PS1 해설: \"Kepler 식에서는 지구 반지름을 더했고, 여기서는 더하지 않는다.\"","src":"PS1 2(a)·(c)","wiki":"Kepler's law","tags":["Kepler's law"],"prof":true,"diff":3,"introCard":0},{"id":"u4b-19","type":"order","q":"[PS1 2(b)] 주기 24 h 로 GEO 고도를 구하는 순서","answer":["Period = 24 × 3,600 = 86,400 s","d^1.5 = 86,400 × 100 = 8,640,000","d = 8,640,000^(2/3) ≈ 42,106 km","h = d − 6,378 ≈ 35,728 km"],"explain":"식을 거꾸로 풀고 마지막에 반지름을 뺀다. 35,786 km 와의 차이는 C ≈ 1/100 근사 때문이라는 한 줄을 답안에 적는다 (PS1 해설 ⚠️).","src":"PS1 2(b)","wiki":"Example 5.2 정지궤도 주기","tags":["Example 5.2 정지궤도 주기"],"prof":true,"introCard":1}],"intro":[{"title":"Kepler's law","body":"Period [s] = C × distance^1.5, C ≈ 1/100, distance [km] 는 **지구 중심부터** = 고도 + 6,378. 높을수록 느리다(distance 4 배 → 주기 8 배).","img":"img/cn5b-p06-kepler.png","imgAlt":"Kepler's law 와 단위","src":"CH05(2) p.5–6"},{"title":"예제: 달과 GEO","body":"달 384,000 km → (390,378)^1.5/100 ≈ 2,439,090 s ≈ 1 month. 35,786 km → (42,164)^1.5/100 ≈ 86,579 s ≈ 24 h = 지구 자전 → geostationary. 거꾸로 24 h 에서 고도를 구하면 d = 8,640,000^(2/3) ≈ 42,106 → h ≈ 35,728 km(C 근사 차이).","img":"img/cn5b-p08-moon-ans.png","imgAlt":"달 주기 풀이와 r + d 필기","src":"CH05(2) p.8–10 · PS1 2(a)(b)"},{"title":"propagation delay (PS1 2(c))","body":"두 지상국 바로 위 위성: one-way = 2 × 고도 ÷ c (3×10^8 m/s). 여기선 **반지름을 더하지 않는다**. LEO 550 km → 3.67 ms, GEO 35,786 km → 238.6 ms → interactive 응용엔 LEO.","src":"PS1 2(c)"}]},{"id":"u4c","title":"GEO · MEO · LEO","items":[{"id":"u4c-01","type":"match","q":"위성 범주와 key instance","pairs":[["GEO","정지궤도 (24 h)"],["MEO","GPS"],["LEO","Starlink"],["Van Allen belt","범주를 가르는 방사능 띠"]],"explain":"GEO 는 위성 방송, MEO 의 대표는 GPS, LEO 의 대표는 Starlink.","src":"CH05(2) p.16–21","wiki":"위성 세 범주","tags":["위성 세 범주"],"diff":1,"introCard":0},{"id":"u4c-02","type":"tf","q":"GEO 위성 한 기면 지구 전체를 덮을 수 있다.","answer":false,"explain":"line-of-sight 는 넓지만 지구 **curvature** 때문에 **최소 3 기, equidistant** 가 필요 (p.17).","src":"CH05(2) p.17","wiki":"GEO","tags":["GEO"],"img":"img/cn5b-p17-geo3.png","imgAlt":"p.17 지구(가운데 원)를 둘러싼 GEO 위성 그림","introCard":0},{"id":"u4c-03","type":"mc","q":"geostationary 의 뜻으로 옳은 것은?","choices":["위성이 실제로 멈춰 있다","주기가 지구 자전(24 h)과 같아 지구에 대해 멈춰 보인다","극궤도를 돈다","Van Allen belt 안에 있다"],"answer":1,"explain":"geo + stationary. 지구와 같은 속도로 돌아 땅에서 보면 한 점에 고정 → 접시 안테나를 고정할 수 있다.","src":"CH05(2) p.10,16","wiki":"geostationary","tags":["geostationary"],"introCard":0},{"id":"u4c-04","type":"tf","q":"MEO 는 두 Van Allen belt 사이에 있다.","answer":true,"explain":"MEO 의 자리 = Lower 와 Upper Van Allen belt 사이 (p.18).","src":"CH05(2) p.18","wiki":"MEO","tags":["MEO"],"introCard":0},{"id":"u4c-05","type":"mc","q":"Van Allen belt 안에 위성을 두지 않는 이유는?","choices":["너무 추워서","방사능 띠라 위성 전자장비를 망가뜨려서","주파수가 겹쳐서","GPS 가 있어서"],"answer":1,"explain":"Van Allen belt 는 하전 입자 방사능 띠. 고도 범주(GEO·MEO·LEO)를 가르는 경계가 된다.","src":"CH05(2) p.11–14","wiki":"Van Allen belt","tags":["Van Allen belt"],"introCard":0},{"id":"u4c-06","type":"sa","q":"GPS 가 거리 세 개로 위치를 정하는 방법은?","answer":"trilateration","explain":"trilateration = 알려진 점에서의 거리(변) 세 개로 교점(위치)을 찾는다. triangulation(각도) 과 구분.","src":"CH05(2) p.19","wiki":"trilateration","tags":["trilateration"],"img":"img/cn5b-p19-trilat.png","imgAlt":"p.19 GPS 위치 결정 그림 (a) 2차원 원 세 개, (b) 3차원 구 세 개 — caption 이 가려져 있다","explainImg":"img/cn5b-p19-trilat-ans.png","introCard":2},{"id":"u4c-07","type":"mc","q":"LEO 가 \"similar to the cellular telephone system\" 인 이유는?","choices":["BS 를 쓰기 때문","위성의 footprint 가 cell 역할을 하기 때문","MSC 가 있기 때문","GEO 와 같은 궤도라서"],"answer":1,"explain":"위성 하나가 지상에 비추는 영역 footprint 가 cell 처럼 동작. 다만 footprint 는 위성과 함께 **움직인다**.","src":"CH05(2) p.21","wiki":"footprint","tags":["footprint"],"introCard":0},{"id":"u4c-08","type":"mc","q":"PS1 2(d): LEO 에서 연속 서비스를 위해 필요한 cellular 동작은?","choices":["paging","roaming","handoff","frequency reuse"],"answer":2,"explain":"위성(footprint)이 ~96 min 주기로 빠르게 움직이므로 연결을 다음 위성으로 넘기는 **handoff** 가 필요. 셀룰러와 역할이 반대(위성이 움직임).","src":"PS1 2(d)","wiki":"LEO","tags":["LEO"],"prof":true,"introCard":3},{"id":"u4c-09","type":"cloze","q":"셀룰러는 cell 이 고정되고 ___ 가 움직이지만, LEO 는 ___ 가 위성과 함께 움직인다.","answer":["사용자","footprint"],"bank":["사용자","footprint","BS","MSC","gateway"],"explain":"LEO 의 handoff 는 위성이 움직여서 생긴다.","src":"CH05(2) p.21","wiki":"footprint","tags":["footprint"],"diff":3,"img":"img/cn5b-p21-footprint.png","imgAlt":"p.21 LEO 그림 — 위성 아래 점선 타원 두 개의 이름이 ? 로 가려져 있다","explainImg":"img/cn5b-p21-footprint-ans.png","introCard":0},{"id":"u4c-10","type":"tf","q":"GPS 는 하늘에 고정된 GEO 위성이다.","answer":false,"explain":"GPS 는 **MEO** 의 key instance (약 18,000 km, 24 기, trilateration).","src":"CH05(2) p.18","wiki":"GPS","tags":["GPS"],"introCard":0},{"id":"u4c-11","type":"mc","q":"Starlink 를 보통 LEO(621+ miles)보다 낮은 341 miles(≈550 km)에 띄우는 효과는?","choices":["지연이 짧아진다","주기가 24 h 가 된다","footprint 가 고정된다","Van Allen belt 를 통과한다"],"answer":0,"explain":"낮을수록 전파 거리가 짧아 지연이 준다 (p.21 그림).","src":"CH05(2) p.21","wiki":"Starlink","tags":["Starlink"],"introCard":0},{"id":"u4c-12","type":"order","q":"고도가 낮은 것부터","answer":["LEO","Lower Van Allen belt","MEO","Upper Van Allen belt","GEO"],"explain":"LEO(500–2000 km) \u003c lower belt \u003c MEO \u003c upper belt \u003c GEO(35,786 km).","src":"CH05(2) p.11–14","wiki":"위성 세 범주","tags":["위성 세 범주"],"img":"img/cn5b-p11-categories.png","imgAlt":"p.11 Three categories of satellites — 고도축 위 위성 층 ①②③ 과 띠 ④⑤ 의 이름이 가려져 있다","explainImg":"img/cn5b-p11-categories-ans.png","introCard":0},{"id":"u4c-13","type":"match","q":"범주와 특징","pairs":[["GEO","line-of-sight, 최소 3 기"],["MEO","trilateration"],["LEO","90–120 min 주기, footprint 이동"],["equatorial","GEO 의 궤도면"]],"explain":"숫자보다 핵심 단어로 구별한다.","src":"CH05(2) p.16–21","wiki":"위성 세 범주","tags":["위성 세 범주"],"introCard":0},{"id":"u4c-14","type":"tf","q":"IS-95 기지국은 GPS 위성의 시각을 받아 동기화한다.","answer":true,"explain":"p.28 \"To provide synchronization, BSs use the service of GPS.\" CDMA 는 모든 BS 가 같은 주파수를 쓰고 code 로 구분하므로 BS 들의 시각이 맞아야 한다. GPS 는 4강의 MEO 위성이다 (교수: 세부는 not that important).","src":"CH05(1) p.28","wiki":"GPS 동기화","tags":["GPS 동기화"],"diff":1,"introCard":2},{"id":"u4c-15","type":"cloze","q":"GEO 는 ___ orbit 을 돌며, 지구 전체를 덮으려면 최소 ___ 기가 필요하다.","answer":["equatorial","3"],"bank":["equatorial","3","polar","1","24"],"explain":"equatorial plane + curvature 때문에 equidistant 3 기 (p.16–17). 24 기는 GPS.","src":"CH05(2) p.16–17","wiki":"GEO","tags":["GEO"],"introCard":0},{"id":"u4c-16","type":"cloze","q":"MEO 의 대표는 ___ 이고, 위치는 ___ 로 정한다.","answer":["GPS","trilateration"],"bank":["GPS","trilateration","Starlink","triangulation","paging"],"explain":"GPS(약 18,000 km, 24 기)는 거리 세 개로 위치를 정하는 trilateration.","src":"CH05(2) p.18–19","wiki":"GPS","tags":["GPS"],"introCard":0},{"id":"u4c-17","type":"match","q":"그림은 고도에 따른 위성 범주다. ①~⑤ 를 연결하시오","pairs":[["①","GEO"],["②","MEO"],["③","LEO"],["④","Upper Van Allen belt"],["⑤","Lower Van Allen belt"]],"explain":"고도 0 위로 LEO(파랑) → Lower Van Allen belt(⑤) → MEO(초록, 5,000–15,000 km 띠) → Upper Van Allen belt(④) → GEO(35,786 km 점선). 범주는 두 방사능 띠를 피해 나뉜다. 교수 필기: GEO = 정지궤도.","src":"CH05(2) p.11–14","wiki":"위성 세 범주","tags":["위성 세 범주"],"img":"img/cn5b-p11-categories.png","imgAlt":"p.11 Three categories of satellites — ①~⑤ 이름이 가려져 있다","explainImg":"img/cn5b-p11-categories-ans.png","introCard":0},{"id":"u4c-18","type":"tf","q":"[PS1 2(d)] [O/X] A LEO user who does not move stays in view of the same satellite during a long call, so no handoff is needed. (If X, correct it.)","answer":false,"explain":"X. LEO 는 주기가 약 96 min 이라 사용자가 가만히 있어도 위성과 footprint 가 지나가 버린다. 연결을 다음 위성으로 넘기는 **handoff** 가 필요하다. 셀룰러는 MS 가 움직이고, LEO 는 위성(BS 역할)이 움직인다.","src":"PS1 2(d) · CH05(2) p.21","wiki":"LEO","tags":["LEO"],"prof":true,"introCard":3},{"id":"u4c-19","type":"mc","q":"[PS1 2(c)] video call 처럼 interactive 한 응용에 더 맞는 위성과 그 이유는?","choices":["GEO — 한 기로 넓게 덮어서","LEO — one-way 지연이 수 ms 로, GEO 의 약 239 ms 보다 훨씬 짧아서","GEO — 정지해 있어 handoff 가 없어서","MEO — GPS 가 있어서"],"answer":1,"explain":"LEO(550 km) one-way ≈ 3.67 ms, GEO(35,786 km) ≈ 238.6 ms (왕복 ≈ 477 ms). 수백 ms 지연은 대화에서 느껴진다. 비율 ≈ 35,786 / 550 ≈ 65 배.","src":"PS1 2(c)","wiki":"LEO","tags":["LEO"],"prof":true,"introCard":0}],"intro":[{"title":"GEO · MEO · LEO","body":"LEO(500–2,000 km, 90–120 min, Starlink) \u003c Lower Van Allen belt \u003c MEO(약 18,000 km, GPS 24 기) \u003c Upper belt \u003c GEO(35,786 km, equatorial, 24 h). 방사능 띠(Van Allen belt)를 피해 범주가 나뉜다.","img":"img/cn5b-p11-categories-ans.png","imgAlt":"고도축 위 LEO, MEO, GEO 와 두 Van Allen belt","src":"CH05(2) p.11–21"},{"title":"GEO 는 최소 3 기","body":"GEO 한 기는 line-of-sight 가 넓지만 지구 curvature 때문에 전체를 못 덮는다 → equidistant **3 기**. geostationary = 자전과 같은 주기라 땅에서 멈춰 보인다.","img":"img/cn5b-p17-geo3.png","imgAlt":"지구 둘레 GEO 위성 셋","src":"CH05(2) p.16–17"},{"title":"GPS 와 trilateration","body":"MEO 의 대표 GPS 는 알려진 위성까지의 **거리** 세 개로 위치를 정한다(trilateration, 각도로 하는 triangulation 과 다름). IS-95 BS 도 GPS 로 동기화.","img":"img/cn5b-p19-trilat-ans.png","imgAlt":"2차원·3차원 trilateration","src":"CH05(2) p.18–19"},{"title":"LEO 는 cellular 와 닮았다","body":"footprint 가 cell 처럼 동작하지만 위성과 함께 **움직인다** → 사용자가 가만히 있어도 다음 위성으로 넘기는 **handoff** 가 필요(PS1 2(d)). 낮게 띄울수록 지연이 짧다(Starlink 341 miles).","img":"img/cn5b-p21-footprint-ans.png","imgAlt":"LEO footprint","src":"CH05(2) p.20–21 · PS1 2(d)"}]}]},{"id":"u5","title":"5강 네트워크 계층","desc":"host-to-host delivery · IP 서비스 표 · routing vs forwarding · datagram vs VC · delay·throughput","lessons":[{"id":"u5a","title":"Network layer 와 IP 의 성질","items":[{"id":"u5a-01","type":"mc","q":"network layer 가 맡는 delivery 는?","choices":["process-to-process","host-to-host","node-to-node (한 링크)","bit-to-bit"],"answer":1,"explain":"network layer = **host-to-host** delivery. process-to-process 는 transport, 한 링크는 data link.","src":"CH07(1) p.3","wiki":"host-to-host delivery","tags":["host-to-host delivery"],"diff":1,"introCard":0},{"id":"u5a-02","type":"tf","q":"라우터는 transport layer 까지 프로토콜 스택을 가진다.","answer":false,"explain":"라우터는 **network layer 까지만** 가진다. 경로의 라우터가 패킷마다 next hop 을 고른다.","src":"CH07(1) p.3","wiki":"network layer","tags":["network layer"],"introCard":0},{"id":"u5a-03","type":"match","q":"계층과 데이터 단위","pairs":[["Transport","segment"],["Network","datagram"],["Data link","frame"],["Physical","bits"]],"explain":"Transport segment → Network datagram → Data link frame (p.4). \"network 의 단위는 frame\" 은 함정.","src":"CH07(1) p.4","wiki":"segment·datagram·frame","tags":["segment·datagram·frame"],"introCard":0},{"id":"u5a-04","type":"cloze","q":"IP 는 ___ (setup 없음) 이고 ___ (보장 없음) 서비스다.","answer":["connectionless","best effort"],"bank":["connectionless","best effort","connection-oriented","reliable","in order"],"explain":"IP = connectionless + best effort. 신뢰성은 TCP 가 맡는다.","src":"CH07(1) p.5","wiki":"best effort","tags":["best effort"],"introCard":1},{"id":"u5a-05","type":"tf","q":"IP 는 reliable 하다.","answer":false,"explain":"IP 는 **unreliable, best-effort** — corrupted·lost·out of order·delayed 가 모두 가능. 신뢰성은 TCP.","src":"CH07(2) p.29","wiki":"best effort","tags":["best effort"],"diff":1,"introCard":1},{"id":"u5a-06","type":"mc","q":"network layer 의 보조 프로토콜과 역할 짝으로 틀린 것은?","choices":["ICMP — error 보고","IGMP — multicast","ARP — address mapping","DHCP — routing 표 교환"],"answer":3,"explain":"DHCP 는 주소 자동 할당. routing 표 교환은 RIP·OSPF·BGP 같은 routing protocol.","src":"CH07(1) p.5","wiki":"보조 프로토콜","tags":["보조 프로토콜"],"introCard":1},{"id":"u5a-07","type":"mc","q":"network layer 와 transport layer 를 공부할 때 가장 중요하게 이해해야 할 것은?","choices":["각 계층의 header bit 수","각 계층의 역할·서비스","라우터 제조사","MTU 값"],"answer":1,"explain":"1027 녹음: \"각 역할·서비스가 가장 중요\".","src":"1027 녹음","wiki":"network layer","tags":["network layer"],"prof":true,"introCard":0},{"id":"u5a-08","type":"sa","q":"Internet 의 network layer 핵심 프로토콜 이름은? (약어)","answer":"IP","alts":["Internet Protocol"],"explain":"IP(Internet Protocol). 보조로 ICMP·IGMP·ARP·DHCP.","src":"CH07(1) p.5","wiki":"IP","tags":["IP"],"diff":1,"introCard":0},{"id":"u5a-09","type":"tf","q":"IP datagram 은 서로 독립적으로 처리된다 (connectionless).","answer":true,"explain":"setup 없이 datagram 마다 destination address 로 따로 forwarding.","src":"CH07(1) p.5","wiki":"connectionless","tags":["connectionless"],"introCard":1},{"id":"u5a-10","type":"mc","q":"source 에서 transport 의 segment 를 받아 header 를 붙이는 network layer 의 일은?","choices":["routing","packetizing (encapsulation)","flow control","reassembly"],"answer":1,"explain":"packetizing: source 가 encapsulate, destination 이 decapsulate.","src":"CH07(1) p.9","wiki":"packetizing","tags":["packetizing"],"introCard":0},{"id":"u5a-11","type":"tf","q":"라우터는 패킷을 decapsulate 해서 payload 를 확인한다.","answer":false,"explain":"\"Routers do not decapsulate\" — header 만 읽는다. 유일한 예외는 **fragmentation** (header 를 모든 fragment 에 복사).","src":"CH07(1) p.9","wiki":"packetizing","tags":["packetizing"],"introCard":2},{"id":"u5a-12","type":"cloze","q":"라우터가 datagram 을 건드리는 유일한 예외는 ___ 이며, 이때 ___ 를 모든 fragment 에 복사한다.","answer":["fragmentation","header"],"bank":["fragmentation","header","routing","payload","checksum"],"explain":"packet 이 너무 크면(MTU 초과) 쪼개고 header 를 각 조각에 복사.","src":"CH07(1) p.9","wiki":"fragmentation","tags":["fragmentation"],"introCard":0},{"id":"u5a-13","type":"sa","q":"[Term] \"Delivers packets host-to-host, from source to destination; routers on the path choose the best route for each packet.\" Which layer?","answer":"network layer","alts":["network"],"explain":"p.3 개관. host-to-host 가 열쇠말 — process-to-process 면 transport layer.","src":"CH07(1) p.3","wiki":"host-to-host delivery","tags":["host-to-host delivery"],"diff":1,"introCard":0},{"id":"u5a-14","type":"tf","q":"[O/X] IP is connectionless: there is no setup, and each datagram is handled independently.","answer":true,"explain":"p.4 \"Connectionless: no setup; each datagram is handled independently\". 교수 필기가 이 줄과 best effort 줄에 형광펜.","src":"CH07(1) p.4","wiki":"connectionless","tags":["connectionless"],"introCard":1}],"intro":[{"title":"network layer = host-to-host","body":"source host 에서 destination host 까지 packet 을 전달하고, 경로의 router 가 packet 마다 next hop 을 고른다. router 는 network layer 까지만 가진다. 단위: transport segment → network **datagram** → data link frame.","img":"img/cn7-p03-h2h.png","imgAlt":"Source host – R1 – R2 – R3 – Destination host","src":"CH07(1) p.3–4"},{"title":"IP 의 성질","body":"IP 는 **connectionless**(setup 없이 datagram 마다 따로) + **best effort**(손상·분실·순서 바뀜 가능, 신뢰성은 TCP). 보조 프로토콜: ICMP(error 보고), IGMP(multicast), ARP(address mapping), DHCP(주소 할당).","src":"CH07(1) p.4–5"},{"title":"packetizing","body":"source 가 header 를 붙여 encapsulate, destination 이 decapsulate. router 는 decapsulate 하지 않고 header 만 읽는다 — 예외는 **fragmentation**(header 를 모든 fragment 에 복사).","src":"CH07(1) p.8–9"}]},{"id":"u5b","title":"IP 서비스 표 · routing vs forwarding","items":[{"id":"u5b-01","type":"match","q":"Internet 의 IP 가 각 서비스를 제공하는가? (표의 빈칸)","pairs":[["packetizing","Yes"],["error control","Partly"],["flow control","No (TCP)"],["security","No (IPSec)"]],"explain":"packetizing·routing/forwarding Yes · error control Partly(header checksum 검출 + ICMP 보고) · flow·congestion·QoS·security No.","src":"CH07(1) p.18","wiki":"IP가 제공하는 서비스","tags":["IP가 제공하는 서비스"],"img":"img/cn7-p17-ipservice.png","imgAlt":"p.17 Network-Layer Services 표 — Error control 행의 \"IP provides?\" 와 설명이 가려져 있고 아래 네 행은 비어 있다","explainImg":"img/cn7-p17-ipservice-ans.png","introCard":1},{"id":"u5b-02","type":"tf","q":"IP 의 checksum 은 datagram 전체의 오류를 검출하고 고친다.","answer":false,"explain":"checksum 은 **header only**, **detect only (no recovery)**. 오류 보고는 ICMP → error control △ Partly.","src":"CH07(1) p.12","wiki":"IP의 error control","tags":["IP의 error control"],"img":"img/cn7-p13-checksum.png","imgAlt":"p.13 IP datagram 그림 — Header 아래 ①, Payload 아래 ② 의 표시가 가려져 있다","explainImg":"img/cn7-p13-checksum-ans.png","introCard":1},{"id":"u5b-03","type":"mc","q":"routing 과 forwarding 의 관계로 옳은 것은?","choices":["forwarding 이 표를 만들고 routing 이 쓴다","routing 이 표를 만들고 forwarding 이 패킷마다 쓴다","같은 말이다","routing 은 host 가 한다"],"answer":1,"explain":"\"Routing builds the table. Forwarding uses it, packet by packet.\" 교수 강조 (20:47).","src":"1027 녹음 20:47","wiki":"routing","tags":["routing"],"prof":true,"img":"img/cn7-p11-fwd.png","imgAlt":"p.11 forwarding table 그림 — 왼쪽 설명 두 줄이 ? 로 가려져 있다","explainImg":"img/cn7-p11-fwd-ans.png","introCard":0},{"id":"u5b-04","type":"sa","q":"도착한 패킷을 표를 보고 알맞은 출력 interface 로 내보내는 동작은?","answer":"forwarding","explain":"forwarding = 패킷 단위 동작. 경로를 계산해 표를 만드는 것은 routing.","src":"CH07(1) p.11","wiki":"forwarding","tags":["forwarding"],"prof":true,"diff":1,"introCard":0},{"id":"u5b-05","type":"cloze","q":"forwarding 의 기준 값은 datagram 방식에서 ___, virtual circuit 에서 ___ 이다.","answer":["destination address","label"],"bank":["destination address","label","source address","port","TTL"],"explain":"datagram: destination address, VC: label(VCI).","src":"CH07(1) p.11,23","wiki":"forwarding table","tags":["forwarding table"],"img":"img/cn7-p24-dgram-table.png","imgAlt":"p.24 datagram 방식 forwarding table — 첫째 열 이름과 왼쪽 화살표 이름이 ? 로 가려져 있다","explainImg":"img/cn7-p24-dgram-table-ans.png","introCard":0},{"id":"u5b-06","type":"mc","q":"flow control 과 congestion control 의 차이는?","choices":["같은 개념이다","flow = receiver buffer 보호, congestion = 망(라우터) 보호","flow = 망 보호, congestion = receiver 보호","둘 다 IP 가 한다"],"answer":1,"explain":"flow control 은 receiver 가 넘치지 않게(TCP receive window), congestion control 은 망이 넘치지 않게. IP 는 둘 다 안 한다.","src":"CH07(1) p.13–14","wiki":"flow control","tags":["flow control"],"introCard":1},{"id":"u5b-07","type":"tf","q":"congestion 이 생기면 라우터가 sender 에게 속도를 줄이라고 명령한다.","answer":false,"explain":"라우터는 **drop** 만 한다. 속도 조절은 TCP 가 한다 (p.14, 18).","src":"CH07(1) p.14","wiki":"congestion control","tags":["congestion control"],"introCard":2},{"id":"u5b-08","type":"order","q":"congestion 의 vicious cycle 순서","answer":["너무 많은 datagram","라우터 queue 가 차서 drop","sender 가 재전송 (duplicates)","traffic 이 더 늘어 congestion 악화"],"explain":"drop → 재전송 → 더 혼잡. 그래서 congestion control 이 필요하다.","src":"CH07(1) p.14","wiki":"congestion control","tags":["congestion control"],"img":"img/cn7-p14-cycle.png","imgAlt":"p.14 a vicious cycle 그림 — 세 상자 ①②③ 이 가려져 있다","explainImg":"img/cn7-p14-cycle-ans.png","introCard":1},{"id":"u5b-09","type":"mc","q":"QoS 와 security 에 대한 설명으로 옳은 것은?","choices":["둘 다 IP 가 직접 제공","QoS 는 upper layers, security 는 IPSec (IP 와 같은 계층의 다른 프로토콜)","QoS 는 IPSec 이 한다","security 는 ICMP 가 한다"],"answer":1,"explain":"QoS: network layer 는 untouched, upper layers 가 담당. security: IPSec — \"same layer as IP, but different from IP\".","src":"CH07(1) p.15–16","wiki":"IPSec","tags":["IPSec"],"introCard":1},{"id":"u5b-10","type":"tf","q":"IPSec 은 IP 와 같은 계층에 있는 별도의 프로토콜이다.","answer":true,"explain":"\"same layer as IP, but different from IP\" (p.16).","src":"CH07(1) p.16","wiki":"IPSec","tags":["IPSec"],"diff":1,"introCard":1},{"id":"u5b-11","type":"match","q":"기능과 담당","pairs":[["flow control","TCP (receive window)"],["congestion 시 속도 감소","TCP"],["오류 보고","ICMP"],["header 오류 검출","IP header checksum"]],"explain":"IP 는 검출만, 보고는 ICMP, 회복·속도 조절은 TCP.","src":"CH07(1) p.12–18","wiki":"IP가 제공하는 서비스","tags":["IP가 제공하는 서비스"],"introCard":1},{"id":"u5b-12","type":"tf","q":"forwarding table 이 필요한 것은 network 를 이어 붙이는 라우터뿐이다.","answer":true,"explain":"CH08 p.2: \"Only routers (which glue networks together) need forwarding tables\". routing 이 이 표를 만든다.","src":"CH08 p.2","wiki":"forwarding table","tags":["forwarding table"],"diff":1,"introCard":0},{"id":"u5b-13","type":"mc","q":"[PS1 3(e)] payload 만 직전 링크에서 깨지고 header 는 멀쩡한 datagram 이 router 에 왔다. 옳은 것은?","choices":["IP 가 checksum 으로 찾아내 버린다","IP 는 못 찾는다 — checksum 은 header 만 덮고, payload 오류는 목적지 transport layer 가 찾는다","IP 가 찾아서 재전송을 요청한다","router 가 payload 를 decapsulate 해 고친다"],"answer":1,"explain":"IPv4 checksum 은 **header only** (p.12 그림: header checked ✓, payload not checked by IP). header 는 매 hop 바뀌어(TTL 등) checksum 을 다시 계산해야 하니 작게 둔다. payload 는 TCP/UDP checksum(header + data)이 목적지에서 잡고, TCP 가 재전송한다.","src":"PS1 3(e) · CH07(1) p.12","wiki":"IP의 error control","tags":["IP의 error control"],"prof":true,"img":"img/cn5-gen-u5b-13.png","imgAlt":"Header 는 멀쩡하고 Payload 만 깨진 IPv4 datagram","introCard":1},{"id":"u5b-14","type":"mc","q":"그림은 IP datagram 과 header checksum 이 검사하는 범위다. ① 과 ② 는?","choices":["① checked ✓ ② not checked by IP","① not checked ② checked by IP","① encrypted ② compressed","① checked ② checked by TCP only"],"answer":0,"explain":"checksum 은 header 만 덮는다 → header 쪽 checked ✓, payload 쪽 not checked by IP. 그래서 IP 의 error control 은 △ Partly.","src":"CH07(1) p.12–13","wiki":"IP의 error control","tags":["IP의 error control"],"img":"img/cn7-p13-checksum.png","imgAlt":"p.13 IP datagram 그림 — Header 아래 ①, Payload 아래 ② 의 표시가 가려져 있다","explainImg":"img/cn7-p13-checksum-ans.png","introCard":1}],"intro":[{"title":"routing vs forwarding","body":"**routing** = 경로를 계산해 forwarding table 을 만든다. **forwarding** = packet 이 도착할 때마다 표에서 forwarding value(datagram: destination address, VC: label)를 찾아 해당 interface 로 내보낸다. \"Routing builds the table, forwarding uses it, packet by packet.\"","img":"img/cn7-p11-fwd-ans.png","imgAlt":"forwarding table 과 router","src":"CH07(1) p.10–11"},{"title":"IP 가 제공하는 서비스","body":"packetizing·routing/forwarding = Yes. error control = **Partly**(header checksum 으로 검출만 + ICMP 보고). flow control·congestion control·QoS·security = No(TCP, upper layers, IPSec).","img":"img/cn7-p17-ipservice-ans.png","imgAlt":"Network-layer services 표","src":"CH07(1) p.12–18"},{"title":"congestion 의 vicious cycle","body":"datagram 이 너무 많으면 router queue 가 차서 **drop** → sender 가 재전송(duplicates) → traffic 이 더 늘어 악화. router 는 drop 만 하고 속도 조절은 TCP 가 한다.","img":"img/cn7-p14-cycle-ans.png","imgAlt":"Too many datagrams → Routers drop → Senders resend","src":"CH07(1) p.14"}]},{"id":"u5c","title":"Datagram vs Virtual circuit","items":[{"id":"u5c-01","type":"tf","q":"인터넷(IP)은 virtual-circuit 방식이다.","answer":false,"explain":"IP 는 **datagram approach** (p.26).","src":"CH07(1) p.26","wiki":"datagram approach","tags":["datagram approach"],"diff":1,"introCard":1},{"id":"u5c-02","type":"match","q":"datagram vs virtual circuit","pairs":[["datagram","connectionless, setup 없음"],["virtual circuit","connection-oriented, setup 있음"],["datagram 의 결정 기준","destination address"],["VC 의 결정 기준","VCI (label)"]],"explain":"교수 \"key difference\" — VC 는 label(VCI)로 결정 (39:05).","src":"CH07(1) p.23–26","wiki":"virtual-circuit approach","tags":["virtual-circuit approach"],"prof":true,"img":"img/cn7-p26-dg-vc.png","imgAlt":"p.26 Datagram vs Virtual-Circuit 표 — Virtual circuit 열 전체가 ? 로 가려져 있다","explainImg":"img/cn7-p26-dg-vc-ans.png","introCard":1},{"id":"u5c-03","type":"tf","q":"datagram 방식에서도 패킷은 보낸 순서대로 도착한다.","answer":false,"explain":"패킷마다 따로 forwarding → 경로가 달라 **out of order** 가능. 순서 보장은 virtual circuit.","src":"CH07(1) p.23,26","wiki":"datagram approach","tags":["datagram approach"],"img":"img/cn7-p23-dgram.png","imgAlt":"p.23 connectionless (datagram) packet-switched network — 1~4 번 packet 이 서로 다른 경로로 가고, Receiver 앞 도착 순서 아래 이름표가 ? 로 가려져 있다","explainImg":"img/cn7-p23-dgram-ans.png","introCard":0},{"id":"u5c-04","type":"order","q":"virtual circuit 의 세 단계","answer":["setup","data transfer","teardown"],"explain":"VC 는 경로를 먼저 정하고(setup), 같은 경로로 보낸 뒤(data transfer), 해제(teardown).","src":"CH07(1) p.24","wiki":"virtual-circuit approach","tags":["virtual-circuit approach"],"introCard":1},{"id":"u5c-05","type":"sa","q":"virtual circuit 에서 패킷의 label 로 쓰는 식별자의 약어는?","answer":"VCI","alts":["Virtual Circuit Identifier"],"explain":"VCI = Virtual Circuit Identifier. 라우터는 destination address 가 아니라 VCI 로 결정.","src":"CH07(1) p.25","wiki":"VCI","tags":["VCI"],"introCard":1},{"id":"u5c-06","type":"mc","q":"PS1 3(d): 전송 중 라우터 하나가 고장났을 때 datagram 방식에서 아직 고장 지점 전인 패킷은?","choices":["모두 사라진다","routing 이 새 경로를 찾으면 다른 길로 도착 (순서가 바뀔 수 있음)","VC 를 새로 setup 해야 한다","sender 가 자동 재전송"],"answer":1,"explain":"datagram 은 패킷마다 목적지 주소로 길을 고르므로 다른 경로로 갈 수 있다. VC 는 circuit 이 끊겨 새로 setup 해야 한다.","src":"PS1 3(d)","wiki":"datagram approach","tags":["datagram approach"],"prof":true,"introCard":0},{"id":"u5c-07","type":"mc","q":"virtual circuit 방식에서 setup 된 경로에 있는 router 하나가 고장 나면, 아직 그 지점을 지나지 않은 패킷은?","choices":["다른 경로로 자동 우회","그 circuit 으로는 못 가고 새 VC 를 setup 해야 한다","순서가 바뀌어 도착","라우터가 저장했다가 보낸다"],"answer":1,"explain":"모든 패킷이 setup 된 한 경로를 따라가므로 circuit 이 끊기면 새로 setup.","src":"PS1 3(d)","wiki":"virtual-circuit approach","tags":["virtual-circuit approach"],"prof":true,"introCard":1},{"id":"u5c-08","type":"cloze","q":"out-of-order 도착은 패킷마다 ___ 가 다를 수 있는 ___ 방식에서만 생긴다.","answer":["경로","datagram"],"bank":["경로","datagram","VCI","virtual circuit","TTL"],"explain":"다른 경로 = 다른 delay → 늦게 보낸 것이 먼저 도착 가능.","src":"PS1 3(d)","wiki":"datagram approach","tags":["datagram approach"],"prof":true,"introCard":0},{"id":"u5c-09","type":"tf","q":"packet switching 에는 datagram approach 와 virtual-circuit approach 두 가지가 있다.","answer":true,"explain":"p.19–26: packet switching = datagram(connectionless, packet 마다 destination address 로 따로) vs virtual circuit(connection-oriented, setup 한 경로를 label 로). Internet 의 IP 는 datagram 쪽이다.","src":"CH07(1) p.21","wiki":"packet switching","tags":["packet switching"],"diff":1,"introCard":1},{"id":"u5c-10","type":"mc","q":"virtual circuit 의 장점은?","choices":["setup 이 없다","같은 경로라 in order 도착","라우터가 표를 안 쓴다","destination address 가 필요 없어 header 가 0"],"answer":1,"explain":"같은 경로 → in order. 대신 setup·teardown 이 필요하다.","src":"CH07(1) p.23","wiki":"virtual-circuit approach","tags":["virtual-circuit approach"],"introCard":1},{"id":"u5c-11","type":"tf","q":"virtual circuit 의 라우터도 destination address 로 next hop 을 결정한다.","answer":false,"explain":"VC 는 **label (VCI)** 로 결정. 교수 \"key difference\" (39:05).","src":"1027 녹음 39:05","wiki":"VCI","tags":["VCI"],"prof":true,"img":"img/cn7-p25-vc.png","imgAlt":"p.25 connection-oriented packet-switched network — 1~4 번 packet 이 모두 R1→R3→R4 의 같은 virtual circuit 을 따라간다","introCard":1},{"id":"u5c-12","type":"mc","q":"[PS1 3(d)] router 하나가 고장 났을 때, 그 router **안에** 있던 packet 은?","choices":["datagram 방식에서만 잃는다","VC 방식에서만 잃는다","두 방식 모두 잃는다 (network layer 는 다시 보내지 않음)","두 방식 모두 다른 경로로 살아난다"],"answer":2,"explain":"고장 순간 router 안의 packet 은 어느 방식이든 잃는다. 차이는 **아직 도착하지 않은 packet**: datagram 은 다른 경로로, VC 는 새 circuit setup 뒤에. PS1 해설: 이 줄을 빼면 한쪽이 완벽한 것처럼 써진다.","src":"PS1 3(d)","wiki":"datagram approach","tags":["datagram approach"],"prof":true,"introCard":2},{"id":"u5c-13","type":"mc","q":"그림은 datagram 과 virtual circuit 의 비교표다. 가린 Virtual circuit 열의 \"Router decides by\" 칸은?","choices":["Destination address","Label (VCI)","Source address","TTL"],"answer":1,"explain":"VC: Connection-oriented · Setup Yes(path is set up first) · **Label (VCI)** · Same path for all packets · In order. 교수: 이것이 key difference (39:05).","src":"CH07(1) p.26 · 1027 녹음 39:05","wiki":"VCI","tags":["VCI"],"prof":true,"img":"img/cn7-p26-dg-vc.png","imgAlt":"p.26 Datagram vs Virtual-Circuit 표 — Virtual circuit 열이 가려져 있다","explainImg":"img/cn7-p26-dg-vc-ans.png","introCard":1}],"intro":[{"title":"datagram approach (connectionless)","body":"packet 마다 독립, router 는 **destination address** 만 보고 결정 → 같은 message 의 packet 이 다른 경로로 가서 **out of order** 로 도착할 수 있다. Internet 의 IP 가 이 방식.","img":"img/cn7-p23-dgram-ans.png","imgAlt":"datagram network: 1~4 번 packet 이 다른 경로, out of order","src":"CH07(1) p.21–24"},{"title":"virtual circuit (connection-oriented)","body":"setup(경로 결정) → data transfer → teardown. 모든 packet 이 한 경로를 따르고 router 는 **label (VCI)** 로 결정 → in order. 경로 위 router 가 고장 나면 circuit 이 끊겨 새로 setup.","img":"img/cn7-p26-dg-vc-ans.png","imgAlt":"Datagram vs Virtual circuit 비교표","src":"CH07(1) p.25–26"},{"title":"router 고장 (PS1 3(d))","body":"고장 순간 router 안의 packet 은 두 방식 모두 잃는다. 남은 packet: datagram 은 routing 이 새 경로를 찾으면 다른 길로, VC 는 새 circuit 을 setup 해야 한다.","src":"PS1 3(d)"}]},{"id":"u5d","title":"Delay 와 throughput","items":[{"id":"u5d-01","type":"match","q":"delay 와 정의","pairs":[["transmission","packet length / rate (모든 비트를 링크에 올림)"],["propagation","distance / speed (한 비트가 건넘)"],["processing","장치 내부 처리"],["queuing","router queue 대기"]],"explain":"tr = L/R, pg = d/s, processing, queuing (load 따라 증가).","src":"CH07(1) p.29–32","wiki":"total delay 공식","tags":["total delay 공식"],"introCard":0},{"id":"u5d-02","type":"tf","q":"propagation delay 는 패킷이 길수록 길어진다.","answer":false,"explain":"propagation = 한 비트가 건너는 시간 = distance/speed — 패킷 길이와 무관. 길이에 비례하는 것은 transmission delay.","src":"CH07(1) p.30","wiki":"propagation delay","tags":["propagation delay"],"introCard":0},{"id":"u5d-03","type":"num","q":"거리 2,000 m, 전파 속도 2×10^8 m/s 일 때 propagation delay 는 몇 μs?","answer":10,"unit":"μs","tol":0,"explain":"2,000 / (2×10^8) = 10^-5 s = **10 μs** (p.30).","src":"CH07(1) p.30","wiki":"propagation delay","tags":["propagation delay"],"introCard":0},{"id":"u5d-04","type":"num","q":"1,500-byte packet, 10 Mbps 링크의 transmission delay 는 몇 ms?","answer":1.2,"unit":"ms","tol":0.001,"explain":"L = 1,500 × 8 = 12,000 bits → 12,000 / 10^7 = **1.2 ms**. bytes 를 bits 로 바꾸는 것을 잊지 말 것.","src":"PS1 3(a)","wiki":"transmission delay","tags":["transmission delay"],"prof":true,"introCard":0},{"id":"u5d-05","type":"cloze","q":"total delay = (n+1)(tr + pg + pr) + ___ × qu 이다. queuing 은 ___ 에서만 생기기 때문이다.","answer":["n","라우터"],"bank":["n","라우터","n+1","source","destination"],"explain":"교수: \"queuing delay is involved with routers, not with source and destination\" (50:43). \"이것만 기억\".","src":"1027 녹음 50:43","wiki":"total delay 공식","tags":["total delay 공식"],"prof":true,"img":"img/cn7-p33-total.png","imgAlt":"p.33 Total delay 공식 — Delay_qu 앞 계수가 ? 로 가려져 있다. 아래 Source–R1…Rn–Dest. 경로","explainImg":"img/cn7-p33-total-ans.png","introCard":1},{"id":"u5d-06","type":"num","q":"PS1 3(a): 라우터 3 개, tr 1.2 ms, pg 1.0 ms, pr 0.05 ms(라우터+목적지), qu 0.5 ms(라우터만). total delay 는 몇 ms?","answer":10.5,"unit":"ms","tol":0.001,"explain":"4 × (1.2 + 1.0 + 0.05) + 3 × 0.5 = 9.0 + 1.5 = **10.5 ms**. queuing 을 4 번 곱하면 11.0 (오답).","src":"PS1 3(a)","wiki":"total delay 공식","tags":["total delay 공식"],"prof":true,"introCard":1},{"id":"u5d-07","type":"num","q":"PS1 3(b): 1,500-byte packet, router 3 개, 링크 200 km·전파속도 2×10^8 m/s, processing 0.05 ms(router·목적지), queuing 0.5 ms(router) 인 경로에서 모든 링크가 100 Mbps 면 total delay 는 몇 ms?","answer":6.18,"unit":"ms","tol":0.001,"explain":"tr = 0.12 ms → 4 × (0.12 + 1.0 + 0.05) + 1.5 = 4.68 + 1.5 = **6.18 ms**. 가장 큰 성분은 propagation (4.0 ms).","src":"PS1 3(b)","wiki":"total delay 공식","tags":["total delay 공식"],"prof":true,"introCard":1},{"id":"u5d-08","type":"num","q":"n = 3, tr 0.8 ms, pg 1 ms, pr 0.05 ms, qu 2 ms 일 때 total delay (ms)?","answer":13.4,"unit":"ms","tol":0.001,"explain":"4 × (0.8 + 1 + 0.05) + 3 × 2 = 7.4 + 6 = **13.4 ms**. queuing 을 n+1 번 → 15.4 (✗), 링크를 n 개 → 11.55 (✗).","src":"공식 모음","wiki":"total delay 공식","tags":["total delay 공식"],"introCard":1},{"id":"u5d-09","type":"tf","q":"라우터가 n 개면 링크도 n 개다.","answer":false,"explain":"링크는 **n + 1** 개 (Source–R1 … Rn–Dest.).","src":"CH07(1) p.33","wiki":"total delay 공식","tags":["total delay 공식"],"diff":1,"introCard":1},{"id":"u5d-10","type":"num","q":"링크 rate 200, 100, 150 kbps 인 경로의 throughput 은 몇 kbps?","answer":100,"unit":"kbps","tol":0,"explain":"경로 throughput = 가장 느린 링크(bottleneck) = min(200, 100, 150) = **100 kbps**. 평균·합이 아니다.","src":"CH07(1) p.35","wiki":"bottleneck","tags":["bottleneck"],"img":"img/cn7-p36-bottleneck.png","imgAlt":"p.36 세 링크 경로(TR 200·100·150 Kbps)와 water-pipe analogy 의 Bottleneck","introCard":2},{"id":"u5d-11","type":"num","q":"PS1 3(c): 링크 10, 2, 5 Mbps 경로로 5 MB 파일을 보내는 시간은 몇 초?","answer":20,"unit":"s","tol":0,"explain":"throughput = 2 Mbps. 5 × 10^6 × 8 = 4×10^7 bits ÷ 2×10^6 = **20 s**.","src":"PS1 3(c)","wiki":"throughput","tags":["throughput"],"prof":true,"introCard":2},{"id":"u5d-12","type":"mc","q":"load 가 capacity 를 넘으면 throughput 은?","choices":["capacity 에 머문다","계속 증가","collapse (오히려 떨어진다)","0 에서 시작"],"answer":2,"explain":"drop·재전송으로 throughput 이 **collapse**. delay 는 capacity 근처에서 이미 급증 (p.38).","src":"CH07(1) p.38","wiki":"load와 성능","tags":["load와 성능"],"img":"img/cn7-p38-load-a.png","imgAlt":"p.38 (a) Delay as a function of load — capacity 근처에서 delay 가 치솟는다 (throughput 그래프 (b) 는 해설에)","explainImg":"img/cn7-p38-load.png","introCard":2},{"id":"u5d-13","type":"num","q":"1 GB 데이터를 300 Mbps 경로로 보내면 약 몇 초? (1 GB = 8×10^9 bits, 소수 첫째 자리)","answer":26.7,"unit":"s","tol":0.002,"explain":"8×10^9 / 3×10^8 ≈ **26.7 s** (DGIST 유선 일화).","src":"CH07(1) p.35","wiki":"throughput","tags":["throughput"],"introCard":2},{"id":"u5d-14","type":"cloze","q":"transmission delay = packet length ÷ ___, propagation delay = distance ÷ ___","answer":["transmission rate","propagation speed"],"bank":["transmission rate","propagation speed","queue length","hop count","MTU"],"explain":"tr 는 비트를 링크에 올리는 시간(L/R), pg 는 한 비트가 건너는 시간(d/s).","src":"CH07(1) p.29–30","wiki":"transmission delay","tags":["transmission delay"],"introCard":0},{"id":"u5d-15","type":"mc","q":"그림은 router 내부다. ① input queue 와 ② output queue 에서 생기는 delay 는?","choices":["processing delay","queuing delay","propagation delay","transmission delay"],"answer":1,"explain":"queue 에서 기다리는 시간 = **queuing delay** (Delay_qu). 가운데 Process 상자가 processing delay (Delay_pr). queuing 은 routers 에서만 생기고 traffic load 와 함께 늘어난다.","src":"CH07(1) p.31","wiki":"queuing delay","tags":["queuing delay"],"prof":true,"img":"img/cn7-p31-router.png","imgAlt":"p.31 Inside a router — input·output queue 아래 이름이 ①② 로 가려져 있다","explainImg":"img/cn7-p31-router-ans.png","introCard":0},{"id":"u5d-16","type":"num","q":"[PS1 3(a) 변형] A 1,000-byte packet crosses 2 routers. All links are 8 Mbps and 400 km long; propagation speed 2×10^8 m/s. Processing delay is 0.1 ms at each router and at the destination; queuing delay is 1 ms at each router. Total delay (ms)?","answer":11.3,"unit":"ms","tol":0.001,"explain":"n = 2 → 링크 3 개. tr = 8,000 bits / 8×10^6 = 1 ms, pg = 4×10^5 / 2×10^8 = 2 ms, pr = 0.1 ms. Total = 3 × (1 + 2 + 0.1) + 2 × 1 = 9.3 + 2 = **11.3 ms**. queuing 은 router 수(n = 2)만큼.","src":"PS1 3(a) 변형","wiki":"total delay 공식","tags":["total delay 공식"],"prof":true,"introCard":1},{"id":"u5d-17","type":"mc","q":"[PS1 3(b) 변형] 1,000-byte packet, router 2 개(링크 3 개), 링크 400 km·전파속도 2×10^8 m/s, processing 0.1 ms(router·목적지), queuing 1 ms(router) 인 경로에서 모든 링크를 80 Mbps 로 바꾸면 가장 큰 delay 성분은?","choices":["transmission (3 × 0.1 = 0.3 ms)","propagation (3 × 2 = 6 ms)","processing (0.3 ms)","queuing (2 ms)"],"answer":1,"explain":"rate 를 올리면 transmission 만 0.1 ms 로 준다. propagation 은 거리/속도라 rate 와 무관해 6 ms 그대로 → 가장 크다. 새 total = 3 × (0.1 + 2 + 0.1) + 2 = 8.6 ms.","src":"PS1 3(b) 변형","wiki":"propagation delay","tags":["propagation delay"],"prof":true,"introCard":0},{"id":"u5d-18","type":"num","q":"[PS1 3(c) 변형] Links of 50, 8 and 20 Mbps are in series. How many seconds to send a 12-MB file? (1 MB = 10^6 bytes)","answer":12,"unit":"s","tol":0,"explain":"throughput = min(50, 8, 20) = 8 Mbps (bottleneck). 12 × 10^6 × 8 = 9.6×10^7 bits ÷ 8×10^6 = **12 s**.","src":"PS1 3(c) 변형","wiki":"throughput","tags":["throughput"],"prof":true,"introCard":2},{"id":"u5d-19","type":"sa","q":"[Term] \"Time to put all bits of the packet on the link.\" Give the term.","answer":"transmission delay","alts":["transmission"],"explain":"p.29 정의. 한 비트가 링크를 건너는 시간은 propagation delay (p.30). 교수 그림: tr = push all bits out, pg = one bit crosses the link.","src":"CH07(1) p.29","wiki":"transmission delay","tags":["transmission delay"],"diff":1,"introCard":0}],"intro":[{"title":"delay 네 가지","body":"transmission = packet length / rate (모든 비트를 링크에 올림), propagation = distance / speed (한 비트가 건넘, 길이와 무관), processing = 장치 안 처리, queuing = router queue 대기(load 따라 증가). bytes 는 ×8 해서 bits 로.","img":"img/cn7-p29-delay.png","imgAlt":"transmission 과 propagation delay, 2,000 m 예","src":"CH07(1) p.28–31"},{"title":"total delay 공식","body":"router n 개 → 링크 n + 1 개. Total = (n+1)(tr + pg + pr) + **n** × qu — queuing 은 router 에서만(source·destination 제외). 예(PS1 3(a)): 4 × (1.2 + 1.0 + 0.05) + 3 × 0.5 = 10.5 ms.","img":"img/cn7-p33-total-ans.png","imgAlt":"Total delay 공식과 n + 1 links","src":"CH07(1) p.32–33 · PS1 3(a)(b)"},{"title":"throughput 과 load","body":"경로 throughput = 가장 느린 링크(bottleneck) = min. 파일 시간 = bits ÷ throughput. load 가 capacity 근처면 delay 가 치솟고, 넘으면 throughput 이 collapse.","img":"img/cn7-p36-bottleneck.png","imgAlt":"세 링크 경로와 water-pipe bottleneck","src":"CH07(1) p.34–38"}]}]},{"id":"u6","title":"6강 IPv4 주소","desc":"connection 식별 · classful · CIDR block 계산 · 할당·subnetting · aggregation","lessons":[{"id":"u6a","title":"주소와 classful","items":[{"id":"u6a-01","type":"tf","q":"IP 주소는 장비(device)마다 하나씩 붙는다.","answer":false,"explain":"IP 주소는 **connection** 마다 하나 — 라우터가 network 3 개에 붙으면 주소 3 개. 장비마다 하나는 MAC. 교수: \"the most crucial distinction\".","src":"CH07(2) p.3","wiki":"IPv4 address","tags":["IPv4 address"],"prof":true,"introCard":0},{"id":"u6a-02","type":"match","q":"주소 종류","pairs":[["MAC","physical address — device 식별"],["IP","logical address — connection 식별"],["prefix","network 부분"],["suffix","node(host) 부분"]],"explain":"IP = logical(connection), MAC = physical(device). prefix n bits = network, suffix 32−n = node.","src":"CH07(2) p.3,5","wiki":"logical address와 physical address","tags":["logical address와 physical address"],"introCard":0},{"id":"u6a-03","type":"num","q":"IPv4 address space 의 크기 2^32 는?","answer":4294967296,"unit":"개","tol":0,"explain":"2^32 = **4,294,967,296**.","src":"CH07(2) p.4","wiki":"address space","tags":["address space"],"diff":1,"introCard":0},{"id":"u6a-04","type":"sa","q":"128.11.3.31 을 hex 로 쓰면? (0x 없이 8 자리)","answer":"800B031F","alts":["0x800B031F"],"explain":"128 = 0x80, 11 = 0x0B, 3 = 0x03, 31 = 0x1F → **800B031F**.","src":"CH07(2) p.4","wiki":"dotted-decimal notation","tags":["dotted-decimal notation"],"introCard":0},{"id":"u6a-05","type":"match","q":"class 와 첫 byte 범위","pairs":[["A","0–127 (첫 bit 0)"],["B","128–191 (10)"],["C","192–223 (110)"],["D","224–239 multicast (1110)"],["E","240–255 reserved (1111)"]],"explain":"classful: 첫 비트들로 class 가 정해진다 (p.6).","src":"CH07(2) p.6","wiki":"classful addressing","tags":["classful addressing"],"introCard":1},{"id":"u6a-06","type":"mc","q":"class A 의 network 수가 2^8 이 아니라 2^7 = 128 인 이유는?","choices":["prefix 가 7 bits 라서","첫 bit 가 0 으로 고정되어 남은 7 bits 만 자유","reserved 때문","2^8 이 맞다"],"answer":1,"explain":"class A prefix 8 bits 중 첫 bit 가 0 으로 고정 → 2^7. B 2^14, C 2^21 (p.7 \"Why 2^7 and not 2^8?\").","src":"CH07(2) p.7","wiki":"classful addressing","tags":["classful addressing"],"img":"img/cn7b-p07-classful.png","imgAlt":"p.7 classful 표 — 아래 \"Why 2^7 and not 2^8?\" 뒤 설명이 ? 로 가려져 있다","explainImg":"img/cn7b-p07-classful-ans.png","introCard":1},{"id":"u6a-07","type":"num","q":"class B 의 network 개수는? (2^14)","answer":16384,"unit":"개","tol":0,"explain":"prefix 16 bits 중 앞 2 bits(10) 고정 → 2^14 = **16,384**. network 당 주소 2^16 = 65,536.","src":"CH07(2) p.7","wiki":"classful addressing","tags":["classful addressing"],"introCard":1},{"id":"u6a-08","type":"num","q":"class C network 하나의 주소 수는?","answer":256,"unit":"개","tol":0,"explain":"suffix 8 bits → 2^8 = **256**.","src":"CH07(2) p.7","wiki":"classful addressing","tags":["classful addressing"],"diff":1,"introCard":1},{"id":"u6a-09","type":"mc","q":"주소 145.14.20.8 의 class 는?","choices":["A","B","C","D"],"answer":1,"explain":"첫 byte 145 는 128–191 → **class B**.","src":"CH07(2) p.6","wiki":"classful addressing","tags":["classful addressing"],"diff":1,"introCard":1},{"id":"u6a-10","type":"mc","q":"classful addressing 의 address depletion 원인은?","choices":["class C 가 너무 커서","class A 는 너무 커서 대부분 미사용, C 는 너무 작아서","MAC 주소가 부족해서","IPv6 때문"],"answer":1,"explain":"A 블록은 너무 크고(낭비), C 는 너무 작아(부족) 주소가 빨리 소진됐다 → classless 로.","src":"CH07(2) p.8","wiki":"address depletion","tags":["address depletion"],"introCard":1},{"id":"u6a-11","type":"tf","q":"class A 막대 밑 \"2^31\" 은 비트 수를 뜻한다.","answer":false,"explain":"**주소 개수** (2^31 = 주소 공간의 50%). 필기에 \"bits\" 라고 적은 것은 정정.","src":"CH07(2) p.7","wiki":"classful addressing","tags":["classful addressing"],"diff":3,"introCard":1},{"id":"u6a-12","type":"cloze","q":"class A 는 주소 공간의 ___, class B 는 ___ 를 차지한다.","answer":["50%","25%"],"bank":["50%","25%","12.5%","6.25%","75%"],"explain":"A 50% · B 25% · C 12.5% · D·E 6.25% 씩.","src":"CH07(2) p.7","wiki":"classful addressing","tags":["classful addressing"],"introCard":1},{"id":"u6a-13","type":"tf","q":"prefix 는 network 를, suffix 는 그 network 안의 node 를 가리킨다 (two-level hierarchy).","answer":true,"explain":"p.5 two-level hierarchy (우편 주소처럼): 앞 n bits prefix 가 network 를, 뒤 32 − n bits suffix 가 그 안의 connection(node) 을 정한다. router 는 prefix 만 보고 network 까지 보낸다.","src":"CH07(2) p.5","wiki":"prefix와 suffix","tags":["prefix와 suffix"],"diff":1,"introCard":0},{"id":"u6a-14","type":"cloze","q":"IP 주소는 ___ 를, MAC 주소는 ___ 를 식별한다.","answer":["connection","device"],"bank":["connection","device","process","network","port"],"explain":"교수: \"the most crucial distinction\". process 를 고르는 것은 port (CH09).","src":"CH07(2) p.3","wiki":"logical address와 physical address","tags":["logical address와 physical address"],"prof":true,"introCard":0}],"intro":[{"title":"IPv4 주소","body":"32 bits, address space 2^32. 주소는 장비가 아니라 **connection** 에 붙는다(network 3 개에 붙은 router = 주소 3 개, 장비 식별은 MAC). 표기: binary, dotted-decimal, hex(128.11.3.31 = 800B031F). prefix(n bits) = network, suffix(32−n) = node.","src":"CH07(2) p.3–5"},{"title":"classful addressing","body":"첫 비트들로 class 결정: A 0(0–127, prefix 8), B 10(128–191, 16), C 110(192–223, 24), D 1110 multicast, E 1111 reserved. A 는 첫 bit 가 0 으로 고정이라 network 2^7 = 128 개. 공간의 A 50 %·B 25 %·C 12.5 %. A 는 너무 크고 C 는 너무 작아 address depletion.","img":"img/cn7b-p06-classful.png","imgAlt":"class A~E 의 prefix 와 first byte","src":"CH07(2) p.6–8"},{"title":"IP 주소 vs MAC 주소","body":"IP 주소 = logical address, **connection** 식별(router 가 network 3 개에 붙으면 주소 3 개). MAC 주소 = physical address, **device** 식별. prefix/suffix 는 우편 주소처럼 two-level hierarchy.","src":"CH07(2) p.3–5"}]},{"id":"u6b","title":"CIDR block 계산","items":[{"id":"u6b-01","type":"tf","q":"classless 주소도 첫 byte 만 보면 prefix 길이를 알 수 있다.","answer":false,"explain":"prefix 길이는 주소에 내장되지 않는다 → 반드시 **/n** (slash notation) 이 필요 (p.10, 19).","src":"CH07(2) p.10","wiki":"slash notation","tags":["slash notation"],"introCard":0},{"id":"u6b-02","type":"mc","q":"prefix 길이 n 이 1 늘어나면 block 크기는?","choices":["2 배","절반","그대로","1 증가"],"answer":1,"explain":"**longer prefix → smaller network**. N = 2^(32−n) 이라 n 이 1 늘면 절반.","src":"CH07(2) p.9","wiki":"classless addressing","tags":["classless addressing"],"introCard":0},{"id":"u6b-03","type":"sa","q":"/27 의 address mask 를 dotted-decimal 로?","answer":"255.255.255.224","explain":"27 개의 1 → 마지막 byte 11100000
