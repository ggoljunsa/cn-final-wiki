<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1fa463" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한입 학습">
<title>컴퓨터네트워크 기말 · 한입 학습</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
<style>
:root {
  --bg: #f6f7f4; --card: #ffffff; --fg: #1f2a24; --muted: #6b7570; --line: #e1e5df;
  --acc: #1fa463; --acc-d: #15804c; --acc-soft: #dff4e8;
  --red: #e5484d; --red-soft: #fde4e4; --gold: #f2b01e; --blue: #3478f6;
  --chip: #ffffff; --chip-b: #d7dcd5; --shadow: 0 2px 0 rgba(0,0,0,.08);
  --sa-t: env(safe-area-inset-top, 0px); --sa-b: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121614; --card: #1c221f; --fg: #e8ece9; --muted: #96a09a; --line: #2e3632;
    --acc: #2fc27a; --acc-d: #22955c; --acc-soft: #173826; --red: #ff6b6e; --red-soft: #3a1d1e;
    --gold: #f5c04a; --chip: #232a26; --chip-b: #3a443f; --shadow: 0 2px 0 rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); overflow-x: hidden; }
body { font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Noto Sans KR", sans-serif; word-break: keep-all; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; }
a { color: var(--blue); }
code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .9em; background: var(--line); padding: 0 4px; border-radius: 4px; }
.muted { color: var(--muted); } .small { font-size: 13px; } .center { text-align: center; } .hidden { display: none; }
#app { max-width: 560px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
#top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 6px;
  padding: calc(8px + var(--sa-t)) 12px 8px; background: var(--bg); border-bottom: 1px solid var(--line); }
.cswitch { border: 1px solid var(--line); background: var(--card); border-radius: 12px; min-height: 40px; padding: 0 10px; font-weight: 700; font-size: 14px; max-width: 42%; display: flex; align-items: center; cursor: pointer; }
.ctitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hstats { display: flex; align-items: center; gap: 8px; }
.hs { display: flex; align-items: center; gap: 2px; font-size: 15px; }
.hs b { font-variant-numeric: tabular-nums; }
.hs.goal { border: 0; background: none; padding: 0; min-width: 40px; min-height: 40px; justify-content: center; cursor: pointer; }
#view { flex: 1; padding: 12px 14px calc(84px + var(--sa-b)); }
#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; justify-content: center; background: var(--card); border-top: 1px solid var(--line); padding-bottom: var(--sa-b); }
#tabs button { flex: 1; max-width: 140px; min-height: 56px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); cursor: pointer; }
#tabs button i { font-style: normal; font-size: 22px; line-height: 1.1; }
#tabs button.on { color: var(--acc); font-weight: 700; }
body.insession #top, body.insession #tabs { display: none; }
body.insession #view { padding-bottom: 12px; }

/* buttons */
.btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 50px; margin: 8px 0 0; padding: 10px 16px; border-radius: 14px;
  border: 2px solid var(--chip-b); background: var(--card); font-weight: 700; font-size: 16px; text-decoration: none; color: var(--fg); cursor: pointer; box-shadow: var(--shadow); }
.btn.primary { background: var(--acc); border-color: var(--acc-d); color: #fff; }
.btn.danger { background: var(--red); border-color: var(--red); color: #fff; }
.btn.ghost { background: transparent; box-shadow: none; border-color: transparent; color: var(--muted); }
.btn.ghost.danger { color: var(--red); background: transparent; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
.row2 { display: flex; gap: 8px; } .row2 .btn { flex: 1; }
.link { border: 0; background: none; color: var(--blue); padding: 8px 0; min-height: 40px; cursor: pointer; }

/* path */
.exam { margin: 0 0 10px; }
.duecard { width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 12px 14px; margin-bottom: 12px; border-radius: 16px; border: 2px solid var(--gold); background: var(--card); cursor: pointer; }
.duecard span { font-size: 13px; color: var(--muted); }
.unit { margin-bottom: 18px; }
.uhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; color: #fff; background: var(--u); box-shadow: 0 3px 0 var(--ud); }
.utitle { font-weight: 800; font-size: 17px; } .udesc { font-size: 13px; opacity: .9; }
.uprog { font-weight: 700; font-size: 14px; background: rgba(255,255,255,.22); padding: 2px 10px; border-radius: 99px; white-space: nowrap; }
.hue0 { --u: #1fa463; --ud: #15804c; } .hue1 { --u: #3478f6; --ud: #2459bd; } .hue2 { --u: #b4579f; --ud: #87407a; }
.hue3 { --u: #e07a1f; --ud: #a95a14; } .hue4 { --u: #0f9fa8; --ud: #0b767c; } .hue5 { --u: #6f5bd6; --ud: #5243a5; }
.nodes { display: flex; flex-direction: column; align-items: center; padding: 14px 0 4px; }
.nwrap { position: relative; display: flex; flex-direction: column; align-items: center; width: 120px; margin: 6px 0; }
.node { width: 72px; height: 72px; border-radius: 50%; border: 0; cursor: pointer; position: relative; padding: 0;
  background: conic-gradient(var(--u) var(--p), var(--line) 0); display: flex; align-items: center; justify-content: center; }
.node > span { width: 60px; height: 60px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; color: var(--u); box-shadow: inset 0 -4px 0 rgba(0,0,0,.08); }
.node.done > span { background: var(--u); color: #fff; box-shadow: inset 0 -5px 0 var(--ud); }
.node.gold > span { background: var(--gold); color: #fff; }
.node.fresh { opacity: .75; }
.node.rec { animation: pulse 1.6s ease-in-out infinite; }
.node.rec > span { background: var(--u); color: #fff; box-shadow: inset 0 -5px 0 var(--ud); }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--u) 50%, transparent); } 50% { box-shadow: 0 0 0 10px transparent; } }
.bubble { position: absolute; top: -26px; background: var(--card); border: 2px solid var(--u); color: var(--u); font-weight: 800; font-size: 13px; padding: 1px 10px; border-radius: 10px; z-index: 1; }
.crown { position: absolute; top: 50px; right: 12px; font-size: 12px; font-weight: 800; background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 0 5px; }
.nlabel { font-size: 13px; text-align: center; margin-top: 4px; line-height: 1.25; max-width: 120px; }
.pend { text-align: center; margin: 10px 0; }
.lmeta { display: flex; flex-wrap: wrap; gap: 6px 12px; margin: 6px 0; font-size: 14px; }

/* modal / toast */
#modal { display: none; position: fixed; inset: 0; z-index: 20; }
#modal.show { display: block; }
.mback { position: absolute; inset: 0; background: rgba(0,0,0,.45); }
.mbox { position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; max-height: 88vh; overflow: auto; background: var(--card);
  border-radius: 20px 20px 0 0; padding: 18px 16px calc(16px + var(--sa-b)); animation: up .18s ease-out; }
.mbox h3 { margin: 4px 0 8px; font-size: 19px; }
.big { font-size: 56px; text-align: center; line-height: 1.2; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.crow { display: flex; justify-content: space-between; align-items: center; min-height: 52px; padding: 0 12px; margin: 6px 0; border-radius: 12px; border: 2px solid var(--line); color: var(--fg); text-decoration: none; font-weight: 700; }
.crow.me { border-color: var(--acc); background: var(--acc-soft); }
.crow .muted { font-weight: 400; font-size: 14px; }
#toast { position: fixed; left: 50%; bottom: calc(80px + var(--sa-b)); transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none; z-index: 30;
  background: #222; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: 90vw; transition: .2s; }
#toast.show { opacity: 1; transform: translateX(-50%); }
textarea.rep { width: 100%; height: 42vh; margin-top: 8px; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 8px; }

/* lesson */
.lesson { display: flex; flex-direction: column; min-height: calc(100vh - 24px - var(--sa-t) - var(--sa-b)); padding-top: var(--sa-t); }
.lbar { display: flex; align-items: center; gap: 10px; }
.x { width: 44px; height: 44px; border: 0; background: none; font-size: 22px; color: var(--muted); cursor: pointer; }
.prog { flex: 1; height: 16px; border-radius: 99px; background: var(--line); overflow: hidden; }
.pfill { height: 100%; background: var(--acc); border-radius: 99px; transition: width .3s; }
.lh { font-weight: 700; min-width: 44px; text-align: right; }
.qbody { flex: 1; padding: 10px 2px; }
.qtype { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; font-weight: 700; color: var(--acc); margin-bottom: 6px; }
.prof { color: #a35b00; background: #fff0d6; border-radius: 99px; padding: 0 8px; font-weight: 700; }
@media (prefers-color-scheme: dark) { .prof { color: #ffcf7a; background: #3a2c12; } }
.combo { color: var(--gold); } .again { color: var(--red); }
.q { font-size: 19px; font-weight: 700; line-height: 1.5; margin: 4px 0 16px; }
.choices { display: flex; flex-direction: column; gap: 10px; }
.choice { display: flex; align-items: center; gap: 10px; text-align: left; min-height: 56px; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--chip-b); background: var(--chip); cursor: pointer; box-shadow: var(--shadow); }
.choice.sel { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, var(--chip)); }
.cnum { flex: none; width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--chip-b); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--muted); }
.tfrow { display: flex; gap: 12px; }
.tf { flex: 1; min-height: 140px; border-radius: 18px; border: 2px solid var(--chip-b); background: var(--chip); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--shadow); }
.tfbig { font-size: 56px; font-weight: 900; line-height: 1; }
.tf.t .tfbig { color: var(--acc); } .tf.f .tfbig { color: var(--red); }
.tf.sel { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, var(--chip)); }
.bank { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
.chip { min-height: 48px; padding: 8px 14px; border-radius: 12px; border: 2px solid var(--chip-b); background: var(--chip); cursor: pointer; box-shadow: var(--shadow); font-size: 15px; text-align: left; max-width: 100%; }
.chip.used { visibility: hidden; }
.chip.mini { min-width: 48px; text-align: center; }
.cloze { line-height: 2.2; }
.slot { display: inline-block; min-width: 64px; min-height: 40px; margin: 2px 2px; padding: 2px 10px; border-radius: 10px; border: 2px solid var(--blue); background: color-mix(in srgb, var(--blue) 10%, var(--chip)); font-size: 15px; font-weight: 700; line-height: 1.4; vertical-align: middle; cursor: pointer; max-width: 100%; }
.slot.empty { border-style: dashed; border-color: var(--chip-b); background: transparent; color: var(--muted); font-weight: 400; }
.seq { min-height: 120px; display: flex; flex-direction: column; gap: 8px; padding: 10px; border: 2px dashed var(--chip-b); border-radius: 14px; }
.chip.step { display: flex; align-items: center; gap: 8px; width: 100%; border-color: var(--blue); }
.snum { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--blue); color: #fff; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.mcol { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.mitem { min-height: 56px; padding: 8px 10px; border-radius: 12px; border: 2px solid var(--chip-b); background: var(--chip); cursor: pointer; font-size: 14px; box-shadow: var(--shadow); text-align: center; }
.mitem.r { font-size: 13px; }
.mitem.sel { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 12%, var(--chip)); }
.mitem.ok { border-color: var(--acc); background: var(--acc-soft); opacity: .55; box-shadow: none; }
.mitem.bad { border-color: var(--red); background: var(--red-soft); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.inp { width: 100%; min-height: 54px; font-size: 18px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--chip-b); background: var(--chip); color: var(--fg); }
.inp:focus { outline: none; border-color: var(--blue); }
.inp.sm { min-height: 46px; font-size: 15px; }
.numrow { display: flex; gap: 8px; align-items: center; }
.numrow .inp { flex: 1; min-width: 0; }
.unit { font-weight: 700; color: var(--muted); }
.lfoot { position: sticky; bottom: 0; padding: 8px 0 calc(8px + var(--sa-b)); background: var(--bg); }
.lfoot .skip { margin-top: 0; min-height: 40px; }

/* feedback sheet */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; max-width: 560px; margin: 0 auto; transform: translateY(110%); transition: transform .2s ease-out;
  padding: 16px 16px calc(14px + var(--sa-b)); border-radius: 20px 20px 0 0; max-height: 75vh; overflow: auto; }
.sheet.show { transform: none; }
.sheet.ok { background: var(--acc-soft); } .sheet.bad { background: var(--red-soft); }
.shead { font-size: 21px; font-weight: 900; margin-bottom: 6px; }
.sheet.ok .shead { color: var(--acc-d); } .sheet.bad .shead { color: var(--red); }
@media (prefers-color-scheme: dark) { .sheet.ok .shead { color: var(--acc); } }
.sans, .sgiven { margin: 4px 0; } .sans b { color: var(--acc-d); } .sgiven b { color: var(--red); }
@media (prefers-color-scheme: dark) { .sans b { color: var(--acc); } }
.sexp { margin: 8px 0; font-size: 15px; }
.smeta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--muted); align-items: center; }
.smeta a { font-weight: 700; padding: 6px 0; }

/* result */
.result { text-align: center; padding: calc(30px + var(--sa-t)) 4px 10px; }
.result h2 { margin: 6px 0 10px; }
.pill { display: inline-block; margin: 4px; padding: 4px 12px; border-radius: 99px; background: var(--acc-soft); font-weight: 700; font-size: 14px; }
.pill.gold { background: #fff0c2; color: #7a5600; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0 8px; text-align: center; }
.tile { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px 6px; }
.tk { font-size: 13px; color: var(--muted); } .tv { font-size: 21px; font-weight: 800; }
.xpbreak { margin-bottom: 8px; }

/* pages */
.page h2 { margin: 4px 0 12px; }
.ptop { display: flex; align-items: center; gap: 8px; } .ptop h2 { margin: 4px 0; }
.back { border: 0; background: none; color: var(--blue); font-size: 16px; min-height: 44px; padding: 0 6px 0 0; cursor: pointer; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin: 12px 0; }
.ctop { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.badge { background: var(--acc-soft); color: var(--acc-d); font-weight: 800; font-size: 13px; padding: 1px 10px; border-radius: 99px; white-space: nowrap; }
.badge.red { background: var(--red-soft); color: var(--red); }
.tagrow { display: grid; grid-template-columns: minmax(0, 1.2fr) 1fr 44px; gap: 8px; align-items: center; width: 100%; min-height: 48px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; padding: 0; }
.tname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.tbar { display: block; height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.tbar i { display: block; height: 100%; background: var(--acc); border-radius: 99px; }
.tbar.wide { height: 12px; margin-top: 3px; }
.tpct { font-size: 13px; text-align: right; font-weight: 700; }
.ubar { margin: 10px 0; } .ulabel { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 10px 0 6px; }
.hm { aspect-ratio: 1; border-radius: 8px; background: var(--line); position: relative; display: flex; align-items: center; justify-content: center; font-size: 12px; }
.hm i { position: absolute; top: -2px; right: -2px; font-style: normal; font-size: 11px; }
.hm.l1 { background: color-mix(in srgb, var(--acc) 30%, var(--line)); } .hm.l2 { background: color-mix(in srgb, var(--acc) 55%, var(--line)); }
.hm.l3 { background: color-mix(in srgb, var(--acc) 80%, var(--line)); color: #fff; } .hm.l4 { background: var(--acc-d); color: #fff; }
.hm.today { outline: 2px solid var(--blue); }
.topmiss { padding: 10px 0; border-bottom: 1px solid var(--line); }
.tmq { display: flex; gap: 8px; font-weight: 600; font-size: 15px; }
.rank { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--red-soft); color: var(--red); font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.miss .mq { font-weight: 600; margin: 6px 0; }
.mexp { padding: 8px 10px; border-radius: 10px; background: var(--bg); font-size: 14px; }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 8px 0; }
.seg button { min-height: 46px; border-radius: 12px; border: 2px solid var(--chip-b); background: var(--chip); font-weight: 700; cursor: pointer; font-size: 14px; }
.seg button.on { border-color: var(--acc); background: var(--acc-soft); color: var(--acc-d); }
.chk { display: flex; align-items: center; gap: 8px; min-height: 44px; }
.chk input { width: 22px; height: 22px; }
.fld { display: block; margin: 8px 0; } .fld span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 2px; }
.warn { background: #fff4d6; color: #6b4b00; border-radius: 10px; padding: 8px 10px; }
@media (prefers-color-scheme: dark) { .warn { background: #3a2f12; color: #ffd98a; } .pill.gold { background: #3a2f12; color: #ffd98a; } }
.katex-display { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
#probe { display: none; }

/* ---------- hub / shared extras ---------- */
.hs.moon { border: 0; background: none; font-size: 20px; min-width: 40px; min-height: 40px; padding: 0; cursor: pointer; }
#top .cswitch { flex: 1 1 auto; min-width: 0; max-width: none; }
#top .hstats { flex: none; gap: 6px; }
#focusbar { display: none; }
#focusbar.show { display: flex; position: sticky; top: calc(57px + var(--sa-t)); z-index: 4; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 14px; background: var(--acc-soft); font-size: 14px; font-weight: 700; }
#focusbar button { border: 1px solid var(--chip-b); background: var(--card); border-radius: 10px; min-height: 36px; padding: 0 10px; cursor: pointer; }
body.insession #focusbar { display: none; }
.cchips { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 10px; padding-bottom: 2px; scrollbar-width: none; }
.cchips button { flex: none; min-height: 40px; padding: 0 14px; border-radius: 99px; border: 2px solid var(--chip-b); background: var(--chip); font-weight: 700; font-size: 14px; cursor: pointer; }
.cchips button.on { border-color: var(--acc); background: var(--acc-soft); color: var(--acc-d); }
.row2.slim { margin-bottom: 10px; } .row2.slim .btn { min-height: 42px; font-size: 14px; margin-top: 0; }
.cbadge { background: var(--line); color: var(--fg); border-radius: 99px; padding: 0 8px; font-size: 12px; font-weight: 700; }
.pill.red { background: var(--red-soft); color: var(--red); }
.card.hl { border: 2px solid var(--acc); }
.crow.big { width: 100%; background: var(--card); cursor: pointer; font: inherit; font-weight: 700; min-height: 60px; }
.wlink { border: 0; background: none; color: var(--blue); font-weight: 700; padding: 6px 0; min-height: 36px; cursor: pointer; font-size: 13px; }
/* today */
.hello { display: flex; justify-content: space-between; align-items: center; }
.hello h2 { margin: 2px 0 8px; font-size: 24px; }
.ddays { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 6px 0 12px; }
.dd { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 4px; text-align: center; min-width: 0; }
.ddn { font-weight: 900; font-size: 18px; color: var(--red); }
.ddc { font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ddd { font-size: 11px; }
.tbd { display: block; font-size: 10px; color: var(--gold); font-weight: 800; }
.btn.go { flex-direction: column; min-height: 78px; font-size: 20px; }
.btn.go small { font-size: 13px; font-weight: 600; opacity: .9; }
.split { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-top: 8px; }
.sp { border: 0; background: none; display: flex; flex-direction: column; align-items: center; cursor: pointer; padding: 4px 0; min-width: 0; }
.spn { font-size: 12px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.btn.bedbtn { background: #2b2118; color: #e6c48f; border-color: #3d2f22; }
.tiles.three { grid-template-columns: repeat(3, 1fr); }
ol.check { padding-left: 20px; margin: 8px 0; font-size: 14px; } ol.check li { margin: 6px 0; }
.wrow, .erow { display: grid; grid-template-columns: 1fr 90px 44px; gap: 8px; align-items: center; margin: 6px 0; font-size: 14px; }
.erow { grid-template-columns: 1fr 150px 64px; }
.wrow .inp, .erow .inp { min-height: 42px; padding: 6px 8px; min-width: 0; }
.seg.five { grid-template-columns: repeat(5, 1fr); }
/* wiki viewer */
#wiki { display: none; position: fixed; inset: 0; z-index: 25; background: var(--bg); flex-direction: column; }
#wiki.show { display: flex; }
#wiki iframe { flex: 1; width: 100%; border: 0; background: var(--card); }
.wbar { display: flex; align-items: center; gap: 8px; padding: calc(4px + var(--sa-t)) 8px 4px; border-bottom: 1px solid var(--line); background: var(--card); min-height: 48px; }
.wback { border: 0; background: none; color: var(--blue); font-weight: 700; min-height: 44px; padding: 0 8px; cursor: pointer; font-size: 16px; }
.wtitle { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 700; }
.wext { min-width: 44px; min-height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none; font-size: 20px; }
.woff { background: var(--red-soft); color: var(--red); padding: 10px 12px; font-size: 14px; border-radius: 10px; margin: 8px; }
/* ---------- bed mode: warm, dim, no pure white ---------- */
body.bed {
  --bg: #0a0705; --card: #140e0a; --fg: #c79a5e; --muted: #7a6142; --line: #2a1f16;
  --acc: #9c6a2a; --acc-d: #7a521f; --acc-soft: #20170e; --red: #a8553f; --red-soft: #24130d;
  --gold: #a87c2c; --blue: #b08447; --chip: #120c08; --chip-b: #33261a; --shadow: none;
  font-size: 19px; color-scheme: dark;
}
body.bed .btn.primary, body.bed .btn.danger, body.bed .node.done > span, body.bed .node.rec > span, body.bed .uhead { color: #120c08; }
body.bed .q { font-size: 23px; }
body.bed .choice, body.bed .chip, body.bed .mitem { font-size: 18px; }
body.bed code { background: #241a12; }
body.bed .lesson { justify-content: flex-end; }
body.bed .qbody { flex: 0 1 auto; margin-top: auto; }
body.bed #toast { background: #20170e; color: var(--fg); }
body.bed .prof { background: #2a1d0c; color: #b8893a; }
body.bed .warn { background: #241a0f; color: var(--fg); }
.bedwrap { display: flex; flex-direction: column; min-height: calc(100vh - 24px - var(--sa-t) - var(--sa-b)); padding-top: var(--sa-t); }
.bedtop { text-align: center; padding-top: 6vh; }
.bclock { font-size: 64px; font-weight: 300; letter-spacing: 2px; line-height: 1.1; }
.bedctl { margin-top: auto; padding-bottom: calc(6px + var(--sa-b)); }
.btn.tall { min-height: 76px; font-size: 18px; }
.card-flow .cftop { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; }
.cfbody { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 14px 4px; }
.cfq { font-size: 24px; font-weight: 700; line-height: 1.5; margin-bottom: 10px; }
.cflist { padding-left: 24px; margin: 4px 0; } .cflist li { margin: 4px 0; }
.cfback { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.cfans { font-size: 22px; margin-bottom: 8px; } .cfans b { color: var(--acc); margin-right: 6px; }
.cfexp { font-size: 17px; color: var(--muted); margin-bottom: 6px; }
.cfbar { height: 4px; background: var(--line); border-radius: 99px; overflow: hidden; margin-bottom: 10px; }
.cfbar i { display: block; height: 100%; width: 0; background: var(--acc); }
.cfrow { display: grid; grid-template-columns: 1fr 76px 1fr; gap: 10px; }
.cfb { min-height: 84px; border-radius: 18px; border: 2px solid var(--chip-b); background: var(--chip); font-size: 20px; font-weight: 800; cursor: pointer; color: var(--fg); }
.cfb.no { border-color: var(--red); color: var(--red); } .cfb.yes { border-color: var(--acc); color: var(--acc); }
.cfb.pp { font-size: 26px; }
.sleep { animation: dusk 2.5s ease-out both; }
.moonbig { font-size: 72px; filter: saturate(.5) brightness(.8); }
@keyframes dusk { from { opacity: 0; } to { opacity: 1; } }
body.sleeping { --fg: #8a6a40; --muted: #5a4630; }

/* ---------- 탭만으로 풀기 + mouse friendliness ---------- */
.modechip { margin-left: auto; border: 1px solid var(--chip-b); background: var(--chip); color: var(--fg); border-radius: 99px; min-height: 36px; padding: 0 12px; font-size: 13px; font-weight: 700; cursor: pointer; }
.selfans { background: var(--card); border: 2px solid var(--acc); border-radius: 14px; padding: 10px 12px; margin-bottom: 6px; font-size: 18px; }
.selfans b { color: var(--acc-d); }
.selfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.selfrow .btn { min-height: 64px; font-size: 18px; }
.lfoot .row2.slim { margin-bottom: 4px; }
.lfoot .row2.slim .btn { min-height: 44px; margin-top: 0; font-size: 14px; }
.seg.two { grid-template-columns: 1fr 1fr; }
body.bed .selfans b { color: var(--acc); }
@media (hover: hover) and (pointer: fine) {
  .choice:hover:not(:disabled), .tf:hover:not(:disabled), .mitem:hover:not(:disabled), .chip:hover:not(:disabled), .slot:hover,
  .seg button:hover, .cchips button:hover, .crow:hover, .modechip:hover, .cfb:hover { border-color: var(--blue); }
  .btn:hover:not(:disabled), .node:hover, .duecard:hover, .tagrow:hover, .sp:hover { filter: brightness(1.06); }
  body.bed .btn:hover:not(:disabled), body.bed .cfb:hover { filter: brightness(1.25); }
  .x:hover, .link:hover, .back:hover, .wlink:hover, .wback:hover { text-decoration: underline; }
}

/* ---------- question images ---------- */
.qimg { position: relative; margin: 4px 0 12px; border-radius: 12px; background: #f4f4f1; border: 1px solid var(--line); padding: 6px; text-align: center; }
.qimg img { display: block; margin: 0 auto; max-width: 100%; max-height: 42vh; object-fit: contain; border-radius: 8px; cursor: zoom-in; }
.qimg .zoomhint { position: absolute; right: 8px; bottom: 8px; font-size: 14px; background: rgba(0,0,0,.45); color: #f5f5f5; border-radius: 99px; padding: 1px 7px; pointer-events: none; }
.qimg.exp { margin: 6px 0 10px; }
.qimg.exp img { max-height: 32vh; }
.qimg.thumb { display: inline-block; padding: 3px; margin: 0 0 8px; }
.qimg.thumb img { max-height: 18vh; }
.qimg.broken { background: var(--card); }
.imgalt { padding: 14px 10px; font-size: 14px; color: var(--muted); text-align: left; }
@media (prefers-color-scheme: dark) { .qimg { background: #e9e9e4; border-color: transparent; } .qimg img { filter: brightness(.92); } }
body.bed .qimg { background: #c9c2b4; border-color: transparent; }
body.bed .qimg img { max-height: 35vh; filter: brightness(.8) sepia(.25); }
body.bed .qimg.thumb img { max-height: 16vh; }
body.bed .qimg.broken { background: var(--card); }
.cfbody .qimg { margin-bottom: 10px; }
#zoom { position: fixed; inset: 0; z-index: 60; background: rgba(8,8,8,.94); display: flex; flex-direction: column; }
#zoom .zbar { display: flex; align-items: center; gap: 8px; padding: calc(6px + var(--sa-t)) 10px 6px; color: #ddd; }
#zoom .zalt { flex: 1; min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#zoom .zbtn { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #555; background: #222; color: #eee; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }
#zoom .zwrap { flex: 1; overflow: auto; touch-action: pinch-zoom pan-x pan-y; -webkit-overflow-scrolling: touch; padding: 8px; }
#zoom .zwrap img { display: block; max-width: none; margin: 0 auto; background: #f4f4f1; border-radius: 6px; }
#zoom.fit .zwrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
body.bed #zoom .zwrap img { filter: brightness(.8) sepia(.25); background: #c9c2b4; }
.sheet { -webkit-overflow-scrolling: touch; }

/* ---------- 📖 intro cards ---------- */
#intro { position: fixed; inset: 0; z-index: 50; max-width: 560px; margin: 0 auto; background: var(--bg); overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: calc(8px + var(--sa-t)) 14px calc(10px + var(--sa-b)); }
#intro .ibar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
#intro .ititle { font-size: 14px; font-weight: 800; color: var(--acc-d); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#intro .iskip { flex: none; border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; min-height: 44px; padding: 0 6px; cursor: pointer; text-decoration: underline; }
#intro .idots { display: flex; align-items: center; gap: 6px; }
#intro .idots i { width: 8px; height: 8px; border-radius: 99px; background: var(--line); transition: width .2s; }
#intro .idots i.past { background: var(--acc-soft); border: 1px solid var(--acc); }
#intro .idots i.on { width: 22px; background: var(--acc); }
#intro .idots span { margin-left: auto; }
#intro .icard { flex: 1; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
#intro .icard h3 { margin: 4px 0 8px; font-size: 22px; }
#intro .ibody { font-size: 17px; line-height: 1.7; }
#intro .inav { position: sticky; bottom: 0; display: grid; grid-template-columns: 1fr 1.5fr; gap: 10px; background: var(--bg); padding-top: 4px; }
#intro .inav .btn { margin-top: 0; min-height: 56px; }
.qimg.intro img { max-height: 38vh; }
body.bed #intro .ititle { color: var(--acc); }
body.bed #intro .ibody { font-size: 19px; }
@media (prefers-color-scheme: dark) { #intro .ititle { color: var(--acc); } }
.nintro { position: absolute; left: -20px; top: 16px; width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; }
.cfrow.two { grid-template-columns: 76px 1fr; }
.cfexp.intro { color: var(--fg); font-size: 18px; line-height: 1.65; }
@media (hover: hover) and (pointer: fine) { .nintro:hover, #intro .iskip:hover { border-color: var(--blue); color: var(--fg); } }

 장치의 full term 은?","answer":"Mobile Switching Center","alts":["MSC"],"explain":"MSC(Mobile Switching Center)는 \"coordinates communication between all BSs and the central office\" (p.10). handoff 결정도 MSC 가 한다.","src":"CH05(1) p.10","wiki":"MSC","tags":["MSC"],"introCard":1},{"id":"u1a-06","type":"mc","q":"MSC 와 일반 유선 전화(stationary phone) 사이에 있는 망은?","choices":["PSTN","WLAN","ISL","HLR"],"answer":0,"explain":"그림에서 MSC 는 **PSTN(Public Switched Telephone Network)** 의 central office 에 붙고, 그 너머에 stationary phone 이 있다. HLR 은 GSM 의 위치 DB.","src":"CH05(1) p.9–10","wiki":"PSTN","tags":["PSTN"],"img":"img/cn5-p10-pstn.png","imgAlt":"p.10 cellular system 그림 — MSC 아래 stationary phone 과 이어진 타원의 이름이 ? 로 가려져 있다","explainImg":"img/cn5-p10-msc-pstn-ans.png","introCard":1},{"id":"u1a-07","type":"tf","q":"cellular 의 base station(BS) 과 WiFi 의 access point(AP) 는 역할 면에서 서로 바꿔 부를 수 있을 만큼(interchangeable) 비슷하다.","answer":true,"explain":"BS 는 WiFi 의 AP 역할(무선 단말을 유선망에 붙이는 중계)이다. 규모·표준·MSC 유무가 다를 뿐 (1020 녹음 8:39).","src":"1020 녹음 8:39","wiki":"셀룰러와 WiFi 비교","tags":["셀룰러와 WiFi 비교"],"prof":true,"introCard":2},{"id":"u1a-08","type":"mc","q":"cellular 망에서 두 휴대폰이 통화할 때 신호 경로로 옳은 것은?","choices":["MS ↔ MS 직접 통신이 기본","MS → BS → MSC → … → BS → MS (항상 infrastructure 경유)","MS → 위성 → MS","MS → AP → MS"],"answer":1,"explain":"cellular 는 항상 infrastructure(BS·MSC)를 거친다. 기기 간 직접 통신(D2D)은 특수하고 비효율적이라고 교수가 덧붙였다.","src":"CH05(1) p.9–10","wiki":"cellular telephony","tags":["cellular telephony"],"introCard":1},{"id":"u1a-09","type":"match","q":"구성요소와 역할을 연결하시오","pairs":[["BS","cell 안의 MS 와 무선으로 통신"],["MS","사용자 단말 (휴대폰)"],["MSC","BS 들과 central office 사이 조정"],["PSTN","유선 공중 전화망"]],"explain":"BS·MS 가 cell 을 이루고, MSC 가 BS 들을 묶어 PSTN 의 central office 에 잇는다.","src":"CH05(1) p.9–10","wiki":"MSC","tags":["MSC"],"diff":1,"introCard":1},{"id":"u1a-10","type":"tf","q":"모든 cellular 세대(1G~4G)는 cell = BS + MS, MSC 가 조정하는 기본 구조를 공유한다.","answer":true,"explain":"세대마다 multiple access 방식은 바뀌어도 cell·BS·MSC 구조는 공통이다 (p.9–10 정리).","src":"CH05(1) p.9–10","wiki":"cellular telephony","tags":["cellular telephony"],"introCard":1},{"id":"u1a-11","type":"mc","q":"5G 가 기지국(BS)을 훨씬 촘촘하게 두는 이유는?","choices":["주파수가 낮아져서","극고주파·huge bandwidth 신호는 attenuation 이 커서 BS 가 가까워야 빠르다","MSC 가 없어져서","CDMA 를 버려서"],"answer":1,"explain":"5G 는 huge bandwidth(높은 주파수)를 쓰는데 높은 주파수는 감쇠가 커서 **many base stations** 이 필요하다 (p.36 구두).","src":"CH05(1) p.36","wiki":"4G","tags":["4G"],"introCard":1},{"id":"u1a-12","type":"cloze","q":"cellular 의 단말과 기지국 관계는 WiFi 의 ___ 와 ___ 관계와 닮았다.","answer":["station","AP"],"bank":["station","AP","MSC","router","PSTN"],"explain":"MS ≈ WiFi station, BS ≈ AP. 교수: BS 와 AP 는 interchangeable.","src":"CH05(1) p.9","wiki":"셀룰러와 WiFi 비교","tags":["셀룰러와 WiFi 비교"],"diff":1,"introCard":1},{"id":"u1a-13","type":"mc","q":"그림(cellular system)의 ① 과 ② 를 바르게 짝지은 것은?","choices":["① MSC, ② PSTN","① PSTN, ② MSC","① BS, ② MSC","① MSC, ② HLR"],"answer":0,"explain":"① 은 BS(cell) 와 유선망 사이에서 모든 BS 를 조정하는 **Mobile Switching Center (MSC)**, ② 는 stationary phone 이 붙은 유선 공중망 **PSTN (Public Switched Telephone Network)**. 교수 필기: \"wired phone 도 wireless 에 연결 가능\" — MSC 가 그 다리다.","src":"CH05(1) p.10","wiki":"MSC","tags":["MSC"],"img":"img/cn5-p10-msc-pstn.png","imgAlt":"p.10 cellular system 그림 — MSC 자리 ①, PSTN 자리 ② 가 가려져 있다","explainImg":"img/cn5-p10-msc-pstn-ans.png","introCard":1},{"id":"u1a-14","type":"sa","q":"[Term] \"A wireless WAN that provides any type of communication.\" Give the term.","answer":"cellular telephony","alts":["cellular","cellular network"],"explain":"p.8 정의. \"any type\" 에 교수가 voice·text·data(image, video) 라고 적었다. 문제집 형식(영어 정의 → 용어).","src":"CH05(1) p.8","wiki":"cellular telephony","tags":["cellular telephony"],"diff":1,"introCard":0}],"intro":[{"title":"WAN 과 cellular telephony","body":"WAN 도 LAN 처럼 \"interconnection of devices\" 이고 차이는 **더 넓은 geographical span**(도시·나라·세계)뿐이다. Wired WAN = telephone·cable network, Wireless WAN = cellular telephony·satellite network(Starlink). **cellular telephony** = voice·text·data 등 any type of communication 을 주는 wireless WAN.","img":"img/cn5-p04-wan.png","imgAlt":"WAN 이 여러 LAN 을 잇는 그림","src":"CH05(1) p.4–8"},{"title":"cell = BS + MS, 그리고 MSC","body":"서비스 지역을 작은 **cell** 로 나누고, cell 마다 기지국 **BS**(Base Station)와 단말 **MS**(Mobile Station)가 있다. **MSC**(Mobile Switching Center)가 모든 BS 와 central office 사이를 조정하고, 그 너머 유선 공중망 **PSTN** 에 stationary phone 이 붙는다. 통화는 항상 BS·MSC 같은 infrastructure 를 거친다.","img":"img/cn5-p10-msc-pstn-ans.png","imgAlt":"Cell(BS, MS) – MSC – PSTN – stationary phone","src":"CH05(1) p.9–10"},{"title":"BS ≈ WiFi AP, 5G 는 BS 를 촘촘히","body":"BS 는 WiFi 의 AP 처럼 무선 단말을 유선망에 붙이는 중계라 역할 면에서 interchangeable 하다(MS ≈ station). 5G 는 huge bandwidth(높은 주파수)를 쓰는데 높은 주파수는 attenuation 이 커서 BS 를 훨씬 많이 둔다.","src":"CH05(1) p.9, 36 · 1020 녹음"}]},{"id":"u1b","title":"Frequency reuse","items":[{"id":"u1b-01","type":"tf","q":"이웃 cell 은 같은 주파수 set 을 써도 FDMA/TDMA 시스템에서 아무 문제가 없다.","answer":false,"explain":"\"Neighboring cells cannot use the same set of frequencies\" — cell **경계의 사용자**가 interference 를 받는다 (p.11). 예외는 CDMA(IS-95, reuse 1).","src":"CH05(1) p.11","wiki":"frequency reuse","tags":["frequency reuse"],"introCard":0},{"id":"u1b-02","type":"mc","q":"reuse factor N 의 뜻은?","choices":["cell 하나가 쓰는 주파수 개수","reuse pattern 을 이루는 cell 의 개수","BS 하나의 안테나 수","한 채널의 사용자 수"],"answer":1,"explain":"\"A frequency reuse pattern is a configuration of N cells. **N is the reuse factor**.\" 주파수 개수가 아니라 cell 개수다.","src":"CH05(1) p.11","wiki":"reuse factor","tags":["reuse factor"],"introCard":0},{"id":"u1b-03","type":"mc","q":"reuse factor N 이 커지면?","choices":["같은 주파수를 쓰는 cell 사이 거리가 멀어져 간섭이 준다","같은 주파수 cell 이 더 가까워진다","cell 당 채널이 늘어난다","아무 변화가 없다"],"answer":0,"explain":"N 개 cell 이 주파수를 나눠 가지니 N 이 클수록 같은 주파수 cell 이 멀어진다(간섭↓). 대신 cell 당 채널 = 전체/N 으로 줄어든다.","src":"CH05(1) p.11","wiki":"reuse factor","tags":["reuse factor"],"diff":3,"introCard":0},{"id":"u1b-04","type":"cloze","q":"이웃 cell 이 같은 주파수를 쓰면 cell ___ 근처 사용자가 ___ 를 받는다.","answer":["boundary","interference"],"bank":["boundary","interference","center","handoff","paging"],"explain":"\"Interference for the users located near the cell boundaries\" (p.11). 이것을 co-channel interference 라 부른다.","src":"CH05(1) p.11","wiki":"co-channel interference","tags":["co-channel interference"],"introCard":0},{"id":"u1b-05","type":"num","q":"voice 채널 395 개를 reuse factor 7 로 나누면 cell 하나가 쓰는 채널은 약 몇 개? (내림)","answer":56,"unit":"개","tol":0,"explain":"cell 당 채널 = 전체 / N = 395 / 7 = 56.4 → **56**. (AMPS provider 당 voice 395 개; 이 값은 파생값이며 슬라이드에 직접 없다.)","src":"CH05(1) p.11,19","wiki":"reuse factor","tags":["reuse factor"],"introCard":1},{"id":"u1b-06","type":"num","q":"전체 채널 420 개, reuse factor 4 이면 cell 당 채널 수는?","answer":105,"unit":"개","tol":0,"explain":"cell 당 = 420 / 4 = **105**. N 이 7 이면 60 으로 줄어든다 — 간섭을 줄이는 대가.","src":"CH05(1) p.11","wiki":"reuse factor","tags":["reuse factor"],"introCard":1},{"id":"u1b-07","type":"tf","q":"그림 (b) 의 reuse pattern 에서 같은 번호(= 같은 주파수 set)를 쓰는 cell 끼리는 서로 맞닿아 있지 않다.","answer":true,"explain":"그림 (b) 는 1~7 번 cell 7 개가 한 묶음(reuse factor 7)이고, 같은 번호는 **다른 묶음**에만 있어 서로 떨어져 있다. 그래서 cell 경계의 사용자가 같은 주파수를 양쪽에서 받는 interference 가 없다. (a) 는 N = 4. 교수 필기: 각 숫자가 frequency set 하나, 이웃한 1-1 은 X.","src":"CH05(1) p.11","wiki":"frequency reuse","tags":["frequency reuse"],"diff":1,"img":"img/cn5-p11-reuse.png","imgAlt":"p.11 reuse pattern 그림 두 개 — 아래 caption 의 N 값이 가려져 있다","explainImg":"img/cn5-p11-reuse-ans.png","introCard":0},{"id":"u1b-08","type":"mc","q":"reuse factor 1 (모든 이웃 cell 이 같은 주파수) 이 가능한 시스템은?","choices":["AMPS","D-AMPS","GSM","IS-95"],"answer":3,"explain":"IS-95 는 CDMA/DSSS 라 이웃 cell 간섭이 전송에 영향을 못 준다 → reuse factor **1**. AMPS(FDMA)·D-AMPS·GSM(TDMA+FDMA)는 불가.","src":"CH05(1) p.31","wiki":"IS-95 frequency reuse","tags":["IS-95 frequency reuse"],"introCard":0},{"id":"u1b-09","type":"sa","q":"같은 주파수를 쓰는 서로 다른 cell 사이의 간섭을 무엇이라 하나?","answer":"co-channel interference","alts":["cochannel interference"],"explain":"같은(co-) 채널을 쓰는 cell 끼리 생기는 간섭. frequency reuse 원칙은 이것을 피하려는 것이다.","src":"CH05(1) p.11","wiki":"co-channel interference","tags":["co-channel interference"],"introCard":0},{"id":"u1b-10","type":"mc","q":"세대 trend 로 본 reuse factor 의 변화는?","choices":["1 → 7","7 → 1","항상 7","항상 1"],"answer":1,"explain":"1G AMPS reuse 7 → CDMA(IS-95) reuse 1. \"숫자보다 trend\" — 간섭에 강한 방식으로 옮겨 가며 reuse factor 가 1 이 됐다.","src":"CH05(1) p.18–36","wiki":"셀룰러 세대","tags":["셀룰러 세대"],"introCard":0},{"id":"u1b-11","type":"tf","q":"reuse factor 를 키우면 cell 하나가 쓸 수 있는 채널 수도 늘어난다.","answer":false,"explain":"반대. cell 당 채널 = 전체 채널 / N 이라 N 이 크면 줄어든다. 간섭↓ 대신 용량↓의 trade-off.","src":"CH05(1) p.11","wiki":"reuse factor","tags":["reuse factor"],"diff":3,"introCard":0},{"id":"u1b-12","type":"cloze","q":"frequency reuse pattern 은 ___ 개 cell 의 구성이고, 그 개수를 ___ 라 한다.","answer":["N","reuse factor"],"bank":["N","reuse factor","1","handoff","pilot"],"explain":"\"A frequency reuse pattern is a configuration of N cells. N is the reuse factor.\" (p.11)","src":"CH05(1) p.11","wiki":"reuse factor","tags":["reuse factor"],"introCard":0},{"id":"u1b-13","type":"num","q":"그림 (b) 의 reuse pattern 에서 reuse factor N 은? (한 묶음의 cell 수를 센다)","answer":7,"tol":0,"explain":"번호 1~7 이 한 묶음 → **N = 7** (AMPS 의 reuse factor). (a) 는 1~4 로 N = 4. reuse factor = \"configuration of N cells\" 의 N 이다.","src":"CH05(1) p.11","wiki":"reuse factor","tags":["reuse factor"],"img":"img/cn5-p11-reuse.png","imgAlt":"p.11 reuse pattern 그림 — 노랑·분홍·연두 묶음의 cell 에 1~7 번호, N 값은 가려져 있다","explainImg":"img/cn5-p11-reuse-ans.png","introCard":0},{"id":"u1b-14","type":"num","q":"[Calc] A provider has 840 voice channels and uses a frequency reuse factor of 7. How many channels can each cell use?","answer":120,"unit":"개","tol":0,"explain":"cell 당 = 전체 / N = 840 / 7 = **120**. N 개 cell 이 전체 채널을 나눠 가진다.","src":"CH05(1) p.11","wiki":"reuse factor","tags":["reuse factor"],"introCard":0},{"id":"u1b-15","type":"num","q":"[Calc] 같은 provider(840 채널)가 reuse factor 를 7 에서 4 로 줄이면 cell 당 채널은 몇 개 늘어나나?","answer":90,"unit":"개","tol":0,"explain":"N = 4 → 840 / 4 = 210, N = 7 → 120. 210 − 120 = **90** 개 증가. 대신 같은 주파수 cell 이 가까워져 co-channel interference 가 커진다 (trade-off).","src":"CH05(1) p.11","wiki":"reuse factor","tags":["reuse factor"],"diff":3,"introCard":1},{"id":"u1b-16","type":"tf","q":"[O/X] Increasing the reuse factor N reduces co-channel interference but also reduces the number of channels available in each cell.","answer":true,"explain":"N↑ → 같은 주파수 cell 사이 거리↑(간섭↓), cell 당 채널 = 전체/N ↓. 둘을 한 문장에 묶은 문제집형 O/X.","src":"CH05(1) p.11","wiki":"reuse factor","tags":["reuse factor"],"introCard":0}],"intro":[{"title":"frequency reuse 원칙","body":"이웃 cell 이 같은 주파수 set 을 쓰면 cell **경계**의 사용자가 양쪽 신호를 받아 interference(co-channel interference)가 생긴다. 그래서 N 개 cell 을 한 묶음(**reuse pattern**)으로 주파수를 나눠 쓰고, 이 N 이 **reuse factor**.","img":"img/cn5-p11-reuse-ans.png","imgAlt":"reuse factor 4 와 7 의 cell 묶음","src":"CH05(1) p.11"},{"title":"N 의 trade-off","body":"cell 당 채널 = 전체 채널 / N. N 이 크면 같은 주파수 cell 이 멀어져 간섭↓, 대신 cell 당 채널↓. AMPS(FDMA)는 N = 7, CDMA(IS-95)는 간섭에 강해 N = 1 → 세대 trend 는 7 → 1.","src":"CH05(1) p.11, 19, 31"},{"title":"그림 읽기: 같은 번호 = 같은 주파수","body":"reuse pattern 그림에서 번호 하나가 frequency set 하나다. 같은 번호 cell 은 서로 다른 묶음에만 있어 떨어져 있고, 이웃 cell 끼리 같은 번호(1–1)는 금지. 같은 주파수를 쓰는 cell 사이 간섭 = co-channel interference.","src":"CH05(1) p.11"}]},{"id":"u1c","title":"통화 발신·수신","items":[{"id":"u1c-01","type":"order","q":"통화 **발신** 과정을 순서대로 놓으시오","answer":["MS 가 band 를 scan 해 가장 강한 setup channel 로 번호 전송","BS 가 번호를 MSC 로 전달","MSC 가 central office 로 전달","central office 가 상대를 연결하고 결과 회신","MSC 가 voice channel 배정, MS retune 후 통화"],"explain":"p.12 순서: MS → BS → MSC → central office → 결과 회신 → MSC 가 voice channel 배정. 처음 보내는 곳이 \"가장 강한(closest) setup channel\" 인 것이 교수 강조.","src":"CH05(1) p.12","wiki":"통화 발신 과정","tags":["통화 발신 과정"],"prof":true,"img":"img/cn5-p12-call.png","imgAlt":"p.12 발신 그림 — MS, BS, MSC, Telephone central office, Called party 사이 ①~⑦ 화살표 (설명 목록은 잘라 냄)","introCard":0},{"id":"u1c-02","type":"mc","q":"발신 때 MS 가 번호를 보내는 채널은?","choices":["아무 BS 의 voice channel","가장 강한(strongest) setup channel","paging channel","MSC 와 직접 연결된 유선"],"answer":1,"explain":"MS 는 band 를 scan 해 **strongest setup channel** (= closest BS) 로 보낸다. 교수: \"very important\" (16:10).","src":"1020 녹음 16:10","wiki":"통화 발신 과정","tags":["통화 발신 과정"],"prof":true,"introCard":0},{"id":"u1c-03","type":"order","q":"통화 **수신** 과정을 순서대로 놓으시오","answer":["central office 가 번호를 MSC 로 보냄","MSC 가 모든 cell 에 query (paging)","MS 가 응답 → 위치 파악","MSC 가 ringing 신호 전송","MS 가 answer → voice channel 배정"],"explain":"p.13: central office → MSC → paging → MS 응답 → ringing → answer → 채널 배정 → 통화.","src":"CH05(1) p.13","wiki":"통화 수신 과정","tags":["통화 수신 과정"],"img":"img/cn5-p13-recv.png","imgAlt":"p.13 수신 그림 — Caller, central office, MSC, 세 cell 과 MS 사이 ①~⑦ 화살표 (설명 목록은 잘라 냄)","introCard":1},{"id":"u1c-04","type":"mc","q":"수신 때 MSC 가 모든 cell 에 paging 을 보내는 이유는?","choices":["보안 때문에","MSC 가 MS 의 위치(어느 cell)를 모르기 때문에","handoff 를 위해","reuse factor 가 1 이라서"],"answer":1,"explain":"발신은 MS 가 먼저 연락하니 위치를 알지만, 수신은 MS 가 어느 cell 에 있는지 모르므로 **모든 cell 에 query** 한다.","src":"CH05(1) p.13","wiki":"paging","tags":["paging"],"introCard":1},{"id":"u1c-05","type":"tf","q":"전화를 받을 때도 걸 때처럼 MS 가 먼저 BS 에 신호를 보내며 시작한다.","answer":false,"explain":"수신은 central office → MSC 쪽에서 시작하고, MSC 가 paging 으로 MS 를 찾는다. MS 는 paging 에 **응답**할 뿐이다.","src":"CH05(1) p.13","wiki":"통화 수신 과정","tags":["통화 수신 과정"],"introCard":2},{"id":"u1c-06","type":"cloze","q":"발신과 비교한 수신 과정만의 단계는 위치를 찾는 ___ 와 벨을 울리는 ___ 이다.","answer":["paging","ringing"],"bank":["paging","ringing","scan","retune","handoff"],"explain":"수신은 위치를 찾는 paging 과 벨을 울리는 ringing 이 추가된다. scan 은 발신 쪽.","src":"CH05(1) p.12–13","wiki":"통화 수신 과정","tags":["통화 수신 과정"],"introCard":0},{"id":"u1c-07","type":"sa","q":"MSC 가 MS 를 찾으려고 모든 cell 에 query 신호를 보내는 절차의 이름은?","answer":"paging","explain":"p.13 ② \"MSC sends query signals to every cell (paging)\".","src":"CH05(1) p.13","wiki":"paging","tags":["paging"],"diff":1,"img":"img/cn5-p13-paging.png","imgAlt":"p.13 수신 그림 — MSC 에서 세 cell 로 가는 빨간 점선 ② 의 이름표가 ? 로 가려져 있다","explainImg":"img/cn5-p13-paging-ans.png","introCard":0},{"id":"u1c-08","type":"mc","q":"발신 과정에서 voice channel 을 배정하는 주체는?","choices":["MS","BS","MSC","central office"],"answer":2,"explain":"상대 연결 결과가 돌아오면 **MSC** 가 voice channel 을 배정하고 MS 가 그 채널로 retune 한다.","src":"CH05(1) p.12","wiki":"통화 발신 과정","tags":["통화 발신 과정"],"introCard":0},{"id":"u1c-09","type":"tf","q":"발신 과정에서 central office 는 상대(called party)가 받을 수 있으면 연결한다.","answer":true,"explain":"p.12 ④ \"Central office connects the called party (if available)\".","src":"CH05(1) p.12","wiki":"통화 발신 과정","tags":["통화 발신 과정"],"diff":1,"introCard":0},{"id":"u1c-10","type":"cloze","q":"수신: central office 가 번호를 ___ 로 보내면, 그것이 모든 cell 에 ___ 를 보낸다.","answer":["MSC","paging"],"bank":["MSC","paging","BS","MS","ringing"],"explain":"central office → MSC → paging(모든 cell). 이후 MS 응답으로 위치를 안다.","src":"CH05(1) p.13","wiki":"통화 수신 과정","tags":["통화 수신 과정"],"introCard":0},{"id":"u1c-11","type":"mc","q":"MS 가 \"가장 강한 setup channel\" 을 고르는 것은 결국 무엇을 고르는 셈인가?","choices":["가장 먼 BS","가장 가까운(closest) BS","MSC","다른 provider"],"answer":1,"explain":"신호가 가장 강하다 = 보통 가장 가깝다. 교수가 \"closest\" 라고 바꿔 말했다.","src":"1020 녹음 16:10","wiki":"통화 발신 과정","tags":["통화 발신 과정"],"prof":true,"introCard":0},{"id":"u1c-12","type":"sa","q":"그림은 cellular 망에서 전화를 거는(발신) 과정이다. 가린 상자 ? 의 이름은? (약어)","answer":"MSC","alts":["Mobile Switching Center"],"explain":"② BS 가 번호를 **MSC** 로 relay → ③ MSC 가 telephone central office 로 forward → ⑤ 결과가 MSC 로 돌아오고 → ⑥ MSC 가 voice channel 배정. 교수 필기: \"통신을 위해 BS, MSC, central office 등 infrastructure 필요\".","src":"CH05(1) p.12","wiki":"통화 발신 과정","tags":["통화 발신 과정"],"img":"img/cn5-p12-msc.png","imgAlt":"p.12 발신 그림 — BS 와 Telephone central office 사이 파란 상자가 ? 로 가려져 있다","explainImg":"img/cn5-p12-msc-ans.png","introCard":0},{"id":"u1c-13","type":"mc","q":"그림은 cellular 망에서 전화를 받는(수신) 과정이다. ④ 화살표(MSC → MS)로 MSC 가 보내는 것은?","choices":["ringing signal","paging query","가장 강한 setup channel 의 번호","roaming contract"],"answer":0,"explain":"p.13 순서: ① central office → MSC ② paging(모든 cell) ③ MS 응답(위치 파악) ④ **MSC transmits a ringing signal** ⑤ MS answers ⑥ voice channel 배정 ⑦ 통화. ③⑤ 는 MS → MSC, ④⑥ 은 MSC → MS 화살표다.","src":"CH05(1) p.13","wiki":"통화 수신 과정","tags":["통화 수신 과정"],"img":"img/cn5-p13-recv.png","imgAlt":"p.13 수신 그림 — MS 와 MSC 사이 ③⑤(→)·④⑥(←) 화살표","introCard":1},{"id":"u1c-14","type":"mc","q":"[객관식] Which step appears when receiving a call but NOT when making a call?","choices":["MSC assigns a voice channel","MSC sends query signals to every cell (paging)","The telephone central office is involved","The MS communicates through a BS"],"answer":1,"explain":"발신은 MS 가 먼저 BS 에 연락하니 위치를 이미 안다. 수신은 MSC 가 MS 위치를 몰라 **paging** 을 해야 한다. 나머지 셋은 양쪽에 다 있다.","src":"CH05(1) p.12–13","wiki":"paging","tags":["paging"],"introCard":1}],"intro":[{"title":"발신(making a call)","body":"① MS 가 band 를 scan 해 **가장 강한 setup channel**(= closest BS)로 번호 전송 ② BS → MSC ③ MSC → telephone central office ④ central office 가 상대 연결 ⑤ 결과가 MSC 로 ⑥ MSC 가 unused voice channel 배정, MS retune ⑦ 통화.","img":"img/cn5-p12-call.png","imgAlt":"발신: MS–BS–MSC–central office–called party, ①~⑦","src":"CH05(1) p.12"},{"title":"수신(receiving a call)","body":"① central office 가 번호를 MSC 로 ② MSC 가 **모든 cell 에 query(paging)** — MS 위치를 모르니까 ③ MS 응답 → 위치 파악 ④ MSC 가 ringing signal ⑤ MS answer ⑥ voice channel 배정 ⑦ 통화. 발신에 없는 단계 = paging·ringing.","img":"img/cn5-p13-paging-ans.png","imgAlt":"수신: central office → MSC → 세 cell 로 paging","src":"CH05(1) p.13"},{"title":"발신과 수신의 차이","body":"발신은 MS 가 먼저 연락하니 위치를 안다. 수신은 MSC 가 MS 위치를 몰라 모든 cell 에 paging 하고, 응답이 오면 ringing 을 보낸다. 둘 다 마지막에 MSC 가 voice channel 을 배정한다.","src":"CH05(1) p.12–13"}]},{"id":"u1d","title":"Handoff · roaming · uplink/downlink","items":[{"id":"u1d-01","type":"tf","q":"handoff 와 handover 는 서로 다른 절차다.","answer":false,"explain":"같은 개념의 두 이름이다 (교수 26:27).","src":"1020 녹음 26:27","wiki":"handoff","tags":["handoff"],"prof":true,"diff":1,"introCard":0},{"id":"u1d-02","type":"mc","q":"handoff 를 결정하는 주체는?","choices":["MS","BS","MSC","central office"],"answer":2,"explain":"**MSC** 가 every few seconds 신호 레벨을 감시하다가 약해지면 새 cell·채널을 찾는다. 교수: \"made by MSC, not by MS\" (33:09).","src":"1020 녹음 33:09","wiki":"handoff","tags":["handoff"],"prof":true,"introCard":0},{"id":"u1d-03","type":"match","q":"handoff 종류와 특징을 연결하시오","pairs":[["hard handoff","BS 하나와만 통신"],["soft handoff","두 BS 와 동시에 통신"],["break before make","hard handoff"],["make before break","soft handoff"]],"explain":"hard = 하나와만, 끊고 잇기(early systems). soft = 둘과 동시에, 잇고 끊기(오늘날).","src":"CH05(1) p.16","wiki":"soft handoff","tags":["soft handoff"],"img":"img/cn5-p16-handoff.png","imgAlt":"p.16 handoff 그림 두 개 — BS1·BS2 연결 시간 막대, 아래 설명과 caption 이 가려져 있다","explainImg":"img/cn5-p16-handoff-ans.png","introCard":1},{"id":"u1d-04","type":"tf","q":"오늘날 시스템은 주로 hard handoff 를 쓴다.","answer":false,"explain":"hard 는 early systems. 교수: \"nowadays we never use hard handoff\" (29:54). 지금은 soft.","src":"1020 녹음 29:54","wiki":"hard handoff","tags":["hard handoff"],"prof":true,"introCard":0},{"id":"u1d-05","type":"cloze","q":"handoff 는 active call 을 ___ 없이 한 BS 에서 다른 BS 로 넘기는 것이고, 결정은 ___ 가 한다.","answer":["interrupting","MSC"],"bank":["interrupting","MSC","MS","paging","roaming"],"explain":"정의: \"transferring an active call from one BS to another without interrupting service\" (p.14). 결정은 MSC.","src":"CH05(1) p.14–15","wiki":"handoff","tags":["handoff"],"introCard":0},{"id":"u1d-06","type":"mc","q":"KTX·SRT 처럼 고속 이동 중 통화·데이터가 느려지는 이유로 정리본이 든 것은?","choices":["paging 이 실패해서","고속 이동 시 soft handoff 를 유지하기 어려워서","roaming 계약이 없어서","reuse factor 가 7 이라서"],"answer":1,"explain":"cell 을 빨리 지나가면 두 BS 와 동시에 붙는 soft handoff 를 유지하기 어렵다 (교수 예시).","src":"CH05(1) p.16","wiki":"soft handoff","tags":["soft handoff"],"introCard":1},{"id":"u1d-07","type":"mc","q":"roaming 의 뜻은?","choices":["같은 provider 안에서 cell 을 옮기는 것","다른 service provider 구역에서 roaming contract 로 서비스를 받는 것","BS 를 바꾸는 것","MSC 가 paging 하는 것"],"answer":1,"explain":"provider coverage 는 제한적이라 이웃 provider 와 **roaming contract** 로 확장한다. 같은 망의 cell 이동은 handoff.","src":"CH05(1) p.17","wiki":"roaming","tags":["roaming"],"img":"img/cn5-p17-roaming.png","imgAlt":"p.17 roaming 그림 — MSC A(Provider A home) 와 MSC B(Provider B neighbor) 사이 점선 위 이름표가 ? 로 가려져 있다","explainImg":"img/cn5-p17-roaming-ans.png","introCard":2},{"id":"u1d-08","type":"tf","q":"downlink 는 MS 가 BS 로 보내는 방향이다.","answer":false,"explain":"**downlink = forward = BS → MS**, uplink = reverse = MS → BS. 교수: \"uplink/downlink 는 외워라\".","src":"1020 녹음 40:00","wiki":"uplink와 downlink","tags":["uplink와 downlink"],"prof":true,"introCard":3},{"id":"u1d-09","type":"match","q":"방향 용어를 연결하시오 (cellular)","pairs":[["downlink","BS → MS"],["uplink","MS → BS"],["forward","downlink 와 같은 방향"],["reverse","uplink 와 같은 방향"]],"explain":"downlink = forward = BS → MS / uplink = reverse = MS → BS. 교수가 꼭 외우라고 한 짝.","src":"CH05(1) p.19","wiki":"uplink와 downlink","tags":["uplink와 downlink"],"prof":true,"img":"img/cn5-p19-amps-band.png","imgAlt":"p.19 AMPS bands 그림 — 두 band 사이 화살표 ①(BS 쪽 band → MS), ②(MS 쪽 band → BS) 의 이름이 가려져 있다","explainImg":"img/cn5-p19-amps-band-ans.png","introCard":3},{"id":"u1d-10","type":"sa","q":"cellular 에서 MS → BS 방향을 forward/reverse 중 무엇이라 부르나?","answer":"reverse","alts":["reverse link"],"explain":"MS → BS = uplink = **reverse**. BS → MS = downlink = forward.","src":"CH05(1) p.19","wiki":"uplink와 downlink","tags":["uplink와 downlink"],"prof":true,"introCard":3},{"id":"u1d-11","type":"tf","q":"거의 모든 cellular 시스템은 uplink 와 downlink 에 서로 다른 주파수 band 를 쓴다.","answer":true,"explain":"AMPS 824–849/869–894 MHz, GSM 890–915/935–960 MHz 처럼 방향마다 band 가 다르다 (p.19, 24).","src":"CH05(1) p.19,24","wiki":"uplink와 downlink","tags":["uplink와 downlink"],"introCard":3},{"id":"u1d-12","type":"mc","q":"MSC 가 handoff 를 위해 하는 일은?","choices":["MS 의 요청을 기다린다","every few seconds 신호 레벨을 감시하고, 약해지면 더 나은 새 cell 을 찾아 채널을 바꾼다","모든 cell 에 paging 한다","roaming contract 를 맺는다"],"answer":1,"explain":"p.15: MSC 가 몇 초마다 신호 세기를 monitor → 약해지면 새 cell 을 찾고 채널을 바꾼다.","src":"CH05(1) p.15","wiki":"handoff","tags":["handoff"],"introCard":0},{"id":"u1d-13","type":"mc","q":"그림 ①·② 는 두 handoff 방식의 BS1·BS2 연결 시간이다. 오늘날(IS-95 이후) 쓰는 방식과 가린 막대 설명으로 옳은 것은?","choices":["① — break before make","② — make before break","① — make before break","② — break before make"],"answer":1,"explain":"② 는 BS1·BS2 막대가 **겹친다** → 두 BS 와 동시에 통신 = soft handoff = make before break. ① 은 BS1 이 끝난 뒤 BS2 가 시작(빈틈) = hard handoff = break before make, early systems. 교수: \"nowadays we never use hard handoff\".","src":"CH05(1) p.16","wiki":"soft handoff","tags":["soft handoff"],"prof":true,"img":"img/cn5-p16-handoff.png","imgAlt":"p.16 handoff 그림 — ①·② 각각 BS1·BS2 연결 시간 막대, 아래 설명이 가려져 있다","explainImg":"img/cn5-p16-handoff-ans.png","introCard":1},{"id":"u1d-14","type":"cloze","q":"그림은 AMPS 의 두 band 다. ① (BS 쪽 band → MS) 은 ___ communication = ___, ② (MS 쪽 band → BS) 는 ___ communication = ___ 이다.","answer":["Forward","downlink","Reverse","uplink"],"bank":["Forward","downlink","Reverse","uplink","crosslink","sidelink"],"explain":"① \"Forward communication: base to mobile\" = **downlink**, ② \"Reverse communication: mobile to base\" = **uplink**. 교수: 세대별 숫자는 외우지 말되 **uplink/downlink 는 외워라** (40:00). 교수 필기의 BS(△)·MS(□) 그림: Down ↓, up ↑.","src":"CH05(1) p.19 · 1020 녹음 40:00","wiki":"uplink와 downlink","tags":["uplink와 downlink"],"prof":true,"img":"img/cn5-p19-amps-band.png","imgAlt":"p.19 AMPS bands 그림 — 화살표 ①·② 의 이름이 가려져 있다","explainImg":"img/cn5-p19-amps-band-ans.png","introCard":3},{"id":"u1d-15","type":"sa","q":"[Term] \"Process of transferring an active call from one BS to another without interrupting service as a user moves across cells.\" Give the term.","answer":"handoff","alts":["handover","hand off"],"explain":"p.14 정의 그대로. handover 와 같은 말이다 (교수 26:27).","src":"CH05(1) p.14","wiki":"handoff","tags":["handoff"],"diff":1,"introCard":0}],"intro":[{"title":"handoff (= handover)","body":"통화 중인 call 을 끊김 없이 한 BS 에서 다른 BS 로 넘기는 것. **MSC** 가 몇 초마다 신호 세기를 감시하다 약해지면 더 나은 cell 을 찾아 채널을 바꾼다(MS 가 아니라 MSC 가 결정).","src":"CH05(1) p.14–15"},{"title":"hard vs soft handoff","body":"**hard**: BS 하나와만 통신, 옛 BS 를 놓고 새 BS 를 잡음(break before make), early systems. **soft**: 두 BS 와 동시에 통신, 새 BS 를 먼저 잡음(make before break), 오늘날. 고속 이동(KTX)에선 soft 유지가 어렵다.","img":"img/cn5-p16-handoff-ans.png","imgAlt":"hard / soft handoff 의 BS1·BS2 연결 시간","src":"CH05(1) p.16"},{"title":"roaming","body":"provider 의 coverage 는 제한적이라, 이웃 provider 와 **roaming contract** 를 맺어 그 구역에서도 서비스를 받게 한다. 같은 provider 안에서 cell 을 옮기는 건 handoff.","img":"img/cn5-p17-roaming-ans.png","imgAlt":"Provider A 와 B 의 MSC 사이 roaming contract","src":"CH05(1) p.17"},{"title":"uplink / downlink (외울 것)","body":"**downlink = forward = BS → MS**, **uplink = reverse = MS → BS**. 방향마다 다른 band 를 쓰고, AMPS·GSM 모두 낮은 쪽 band 를 MS 가 보낸다. 교수: 세대별 숫자는 외우지 말되 uplink/downlink 는 외워라.","img":"img/cn5-p19-amps-band-ans.png","imgAlt":"AMPS 두 band 와 forward/reverse 화살표","src":"CH05(1) p.19"}]}]},{"id":"u2","title":"2강 1G–2G","desc":"세대 trend · AMPS(FDMA) · D-AMPS · GSM 구조와 270.8 kbps","lessons":[{"id":"u2a","title":"세대 trend 와 AMPS","items":[{"id":"u2a-01","type":"mc","q":"cellular 세대(1G~4G)를 공부할 때 각 세대의 세부 숫자보다 중요하게 이해해야 할 것은?","choices":["각 세대의 채널 폭","세대별 진화 trend (analog → digital, voice → data, narrowband → wideband)","AMPS 채널 수","GSM bit rate"],"answer":1,"explain":"\"I'm not going to recommend you to memorize all these specific numbers … understand how communication systems evolve across generations\" (41:54). 숫자를 묻는 OX 는 안 낸다고 했다.","src":"1020 녹음 41:54","wiki":"셀룰러 세대","tags":["셀룰러 세대"],"prof":true,"introCard":0},{"id":"u2a-02","type":"order","q":"multiple access 방식의 세대 변화를 순서대로 놓으시오","answer":["FDMA (1G AMPS)","TDMA + FDMA (2G D-AMPS, GSM)","CDMA (2G IS-95)","all-IP packet-switched (4G)"],"explain":"FDMA → TDMA(+FDMA) → CDMA → 3G IMT-2000(packet+circuit) → 4G all-IP. 교수가 강조한 trend.","src":"CH05(1) p.18–36","wiki":"셀룰러 세대","tags":["셀룰러 세대"],"introCard":0},{"id":"u2a-03","type":"tf","q":"AMPS 는 이름처럼 advanced 한 디지털 시스템이다.","answer":false,"explain":"AMPS(Advanced Mobile Phone System)는 **analog** 1G 시스템이다. 교수: \"it is not advanced, but it is named\".","src":"CH05(1) p.18","wiki":"AMPS","tags":["AMPS"],"introCard":1},{"id":"u2a-04","type":"mc","q":"AMPS 가 link 안에서 채널을 나누는 방식은?","choices":["TDMA","FDMA","CDMA","CSMA/CA"],"answer":1,"explain":"\"AMPS uses **FDMA** to separate channels in a link\" (p.18). 30 kHz 채널마다 사용자 한 명.","src":"CH05(1) p.18","wiki":"FDMA","tags":["FDMA"],"diff":1,"introCard":1},{"id":"u2a-05","type":"cloze","q":"AMPS 의 voice channel 은 ___ 로, control channel 은 ___ 로 변조한다.","answer":["FM","FSK"],"bank":["FM","FSK","QPSK","GMSK","AM"],"explain":"voice = 아날로그 FM, control = **FSK**(10 kbps 디지털 데이터). \"AMPS 는 analog\" 여도 control 은 이미 digital.","src":"CH05(1) p.20","wiki":"AMPS control channel","tags":["AMPS control channel"],"img":"img/cn5-p20-amps-tx.png","imgAlt":"p.20 AMPS transmission 그림 — 3 kHz voice 와 10 kbps control 이 들어가는 변조 상자 ①·② 가 가려져 있다. 오른쪽은 30 kHz 채널을 나눈 FDMA 25-MHz band","explainImg":"img/cn5-p20-amps-tx-ans.png","introCard":1},{"id":"u2a-06","type":"tf","q":"AMPS 에서 824–849 MHz 는 BS 가 송신하는 대역이다.","answer":false,"explain":"824–849 MHz 는 **MS 가 송신**(reverse/uplink). BS 는 869–894 MHz 로 송신(forward/downlink).","src":"CH05(1) p.19","wiki":"AMPS 대역과 채널","tags":["AMPS 대역과 채널"],"introCard":1},{"id":"u2a-07","type":"match","q":"AMPS(1G) band 의 항목과 뜻을 연결하시오","pairs":[["824–849 MHz","MS → BS (reverse)"],["869–894 MHz","BS → MS (forward)"],["30 kHz","채널 하나의 폭"],["reuse factor 7","같은 주파수 set 을 7 cell 묶음마다 다시 씀"]],"explain":"숫자 자체보다 **방향**이 핵심이다: MS 가 보내는 band(낮은 쪽) = reverse = uplink, BS 가 보내는 band = forward = downlink. 교수는 세대별 수치를 외울 필요는 없다고 했지만 uplink/downlink 는 외우라고 했다.","src":"CH05(1) p.19","wiki":"AMPS 대역과 채널","tags":["AMPS 대역과 채널"],"introCard":1},{"id":"u2a-08","type":"num","q":"AMPS band 25 MHz 를 30 kHz 채널로 나누면 약 몇 개? (반올림)","answer":833,"unit":"개","tol":0,"explain":"25,000 kHz / 30 kHz = 833.3 → 약 **833**. 슬라이드 표기는 \"made of 832 30-kHz analog channels\" (832 × 30 kHz = 24.96 MHz). 두 provider 가 나눠 416 씩. band 폭 ÷ 채널 폭 = 채널 수 라는 원리 확인용이고, 숫자 자체는 암기 대상이 아니다 (교수 41:54).","src":"CH05(1) p.19","wiki":"AMPS 대역과 채널","tags":["AMPS 대역과 채널"],"introCard":1},{"id":"u2a-09","type":"num","q":"AMPS 832 채널을 두 provider 가 나누면 provider 당 몇 채널?","answer":416,"unit":"개","tol":0,"explain":"832 / 2 = **416**. 그중 21 개가 control, 395 개가 voice.","src":"CH05(1) p.19","wiki":"AMPS 대역과 채널","tags":["AMPS 대역과 채널"],"diff":1,"introCard":1},{"id":"u2a-10","type":"num","q":"AMPS provider 당 416 채널 중 control 21 개를 빼면 voice 채널은?","answer":395,"unit":"개","tol":0,"explain":"416 − 21 = **395** voice 채널.","src":"CH05(1) p.19","wiki":"AMPS control channel","tags":["AMPS control channel"],"diff":1,"introCard":1},{"id":"u2a-11","type":"mc","q":"AMPS 의 reuse factor 는?","choices":["1","4","7","12"],"answer":2,"explain":"AMPS(FDMA)는 이웃 cell 간섭 때문에 reuse factor **7**. CDMA 는 1.","src":"CH05(1) p.20","wiki":"reuse factor","tags":["reuse factor"],"diff":1,"introCard":1},{"id":"u2a-12","type":"tf","q":"AMPS 는 North America 의 대표적 analog cellular system 이다.","answer":true,"explain":"\"One of the leading analog cellular systems in North America\" (p.18).","src":"CH05(1) p.18","wiki":"1G","tags":["1G"],"diff":1,"introCard":1},{"id":"u2a-13","type":"cloze","q":"1G AMPS 는 ___ 시스템이고 ___ 로 채널을 나눈다.","answer":["analog","FDMA"],"bank":["analog","FDMA","digital","CDMA","TDMA"],"explain":"AMPS = analog + FDMA. 2G 에서 digital 로, multiple access 는 TDMA·CDMA 로 바뀐다.","src":"CH05(1) p.18","wiki":"AMPS","tags":["AMPS"],"diff":1,"introCard":1},{"id":"u2a-14","type":"tf","q":"[O/X] In AMPS, voice channels are digitized before transmission. (If X, correct it.)","answer":false,"explain":"X. AMPS 의 voice 는 **FM** 으로 변조한 아날로그(3 kHz voice → 30 kHz analog). control channel 만 10 kbps 디지털을 FSK 로 싣는다 (p.20, 교수 필기 \"Digital communication\"). 음성 디지털화(7.95 kbps)는 D-AMPS 부터.","src":"CH05(1) p.20","wiki":"AMPS control channel","tags":["AMPS control channel"],"introCard":1},{"id":"u2a-15","type":"cloze","q":"그림은 GSM 의 두 band 다. 890–915 MHz band(①)는 ___ band = ___, 935–960 MHz band(②)는 ___ band = ___ 이다.","answer":["Reverse","uplink","Forward","downlink"],"bank":["Reverse","uplink","Forward","downlink","Paging","sidelink"],"explain":"p.24 \"Forward (Downlink): BS → MS, Reverse (Uplink): BS ← MS\". AMPS(p.19)와 똑같이 **낮은 쪽 band 를 MS 가 보낸다**(uplink). 교수 필기도 위 band 옆 uplink, 아래 band 옆 downlink. 숫자 대신 방향을 외운다 (교수 40:00).","src":"CH05(1) p.24 · 1020 녹음 40:00","wiki":"uplink와 downlink","tags":["uplink와 downlink"],"prof":true,"img":"img/cn5-p24-gsm-band.png","imgAlt":"p.24 GSM bands — 890–915 MHz band ① 과 935–960 MHz band ② 의 이름이 가려져 있다 (Band = 25 MHz = 124 channels, Channel 200 kHz)","explainImg":"img/cn5-p24-gsm-band-ans.png","introCard":2}],"intro":[{"title":"세대 trend 가 핵심","body":"숫자보다 진화 방향: analog → digital, voice → data, narrowband → wideband, circuit → packet(all-IP). multiple access 는 FDMA(1G) → TDMA+FDMA(2G D-AMPS·GSM) → CDMA(2G IS-95, 3G) → 4G all-IP.","src":"CH05(1) p.18–36 · 1020 녹음 41:54"},{"title":"AMPS (1G)","body":"North America 의 **analog** 시스템, 채널을 **FDMA**(30 kHz 채널당 한 명)로 나눈다. voice 는 FM(아날로그), control 은 10 kbps 디지털을 FSK 로. band 는 방향마다 25 MHz(832 채널), 두 provider 가 416 씩(21 개 control), reuse factor 7.","img":"img/cn5-p20-amps-tx-ans.png","imgAlt":"AMPS transmission: voice → FM, control → FSK, FDMA 25-MHz band","src":"CH05(1) p.18–20"},{"title":"AMPS·GSM 의 두 band","body":"AMPS: 824–849 MHz = MS 송신(reverse/uplink), 869–894 MHz = BS 송신(forward/downlink). GSM: 890–915 MHz = reverse(uplink), 935–960 MHz = forward(downlink).","img":"img/cn5-p24-gsm-band-ans.png","imgAlt":"GSM reverse/forward band","src":"CH05(1) p.19, 24"}]},{"id":"u2b","title":"D-AMPS 와 TDMA","items":[{"id":"u2b-01","type":"mc","q":"D-AMPS 는 AMPS 와 비교해 어떤 대역을 쓰나?","choices":["완전히 새 대역","AMPS 와 같은 bands and channels","ISM 대역","위성 대역"],"answer":1,"explain":"D-AMPS 는 AMPS 의 digital 진화로 **같은 band·채널**을 쓰되 음성을 디지털화해 TDMA 로 3 명을 싣는다.","src":"CH05(1) p.21","wiki":"D-AMPS","tags":["D-AMPS"],"introCard":0},{"id":"u2b-02","type":"cloze","q":"D-AMPS 는 음성을 ___ kbps 로 디지털화하고, 세 채널을 ___ 로 합친다.","answer":["7.95","TDMA"],"bank":["7.95","TDMA","13","FDMA","CDMA"],"explain":"\"Voice channel is digitized to 7.95 kbps. Three digital voice channels are combined using TDMA (48.6 kbps with overhead)\" (p.21).","src":"CH05(1) p.21","wiki":"7.95 kbps 디지털 음성","tags":["7.95 kbps 디지털 음성"],"introCard":0},{"id":"u2b-03","type":"num","q":"D-AMPS 한 30 kHz 채널의 순수 음성 데이터 합(3 사용자 × 7.95 kbps)은?","answer":23.85,"unit":"kbps","tol":0.001,"explain":"3 × 7.95 = **23.85 kbps**. overhead 를 넣으면 48.6 kbps.","src":"CH05(1) p.21","wiki":"D-AMPS","tags":["D-AMPS"],"introCard":0},{"id":"u2b-04","type":"mc","q":"D-AMPS 의 multiple access 를 가장 정확히 말한 것은?","choices":["순수 TDMA","순수 FDMA","TDMA + FDMA hybrid","CDMA"],"answer":2,"explain":"30 kHz 채널을 FDMA 로 나누고, 채널 안을 TDMA 로 3 명이 나눈다 → **hybrid**.","src":"CH05(1) p.21–22","wiki":"TDMA","tags":["TDMA"],"introCard":0},{"id":"u2b-05","type":"tf","q":"D-AMPS 는 2G 이다.","answer":true,"explain":"2G 의 첫 예 = Digital AMPS (\"The evolution of the analog AMPS into a digital system\").","src":"CH05(1) p.21","wiki":"2G","tags":["2G"],"diff":1,"introCard":0},{"id":"u2b-06","type":"sa","q":"D-AMPS 가 디지털 데이터를 싣는 변조 방식은? (약어)","answer":"QPSK","alts":["Quadrature Phase Shift Keying"],"explain":"정리본: D-AMPS 는 QPSK. GSM 은 GMSK, AMPS voice 는 FM.","src":"CH05(1) p.22","wiki":"D-AMPS","tags":["D-AMPS"],"introCard":0},{"id":"u2b-07","type":"match","q":"시스템과 multiple access 를 연결하시오","pairs":[["AMPS","FDMA"],["D-AMPS","30 kHz FDMA 채널 안에 TDMA 3 명"],["GSM","200 kHz FDMA 채널 안에 8 slot TDMA"],["IS-95","CDMA (+ FDMA 채널)"]],"explain":"GSM 도 D-AMPS 처럼 hybrid. IS-95 도 25 MHz 를 1.228 MHz 채널로 나누는 FDMA 위에 CDMA.","src":"CH05(1) p.18–31","wiki":"셀룰러 세대","tags":["셀룰러 세대"],"introCard":0},{"id":"u2b-08","type":"mc","q":"2G 로 넘어오며 바뀐 핵심은?","choices":["analog → digital","digital → analog","packet → circuit","CDMA → FDMA"],"answer":0,"explain":"1G = analog, 2G = **digital** (D-AMPS, GSM, IS-95). voice → data 는 3G 의 key point.","src":"CH05(1) p.21","wiki":"2G","tags":["2G"],"diff":1,"introCard":1},{"id":"u2b-09","type":"tf","q":"TDMA 는 같은 주파수 채널을 시간 slot 으로 나눠 여러 사용자가 번갈아 쓴다.","answer":true,"explain":"TDMA = time division. D-AMPS 는 30 kHz 채널 하나를 3 개 slot 으로.","src":"CH05(1) p.21","wiki":"TDMA","tags":["TDMA"],"diff":1,"introCard":0},{"id":"u2b-10","type":"cloze","q":"1G 는 ___ 로 사용자를 나누고, D-AMPS 는 여기에 ___ 를 더했다.","answer":["frequency","time slot"],"bank":["frequency","time slot","code","cell","packet"],"explain":"FDMA = 주파수, TDMA = 시간 slot, CDMA = code. \"무엇으로 사용자를 나누나\" 가 세대 구분의 축.","src":"CH05(1) p.18–21","wiki":"FDMA","tags":["FDMA"],"introCard":0},{"id":"u2b-11","type":"num","q":"D-AMPS 가 AMPS 의 30 kHz 채널 하나에 싣는 사용자 수는 AMPS 의 몇 배?","answer":3,"unit":"배","tol":0,"explain":"AMPS 는 채널당 1 명, D-AMPS 는 TDMA 로 3 명 → **3 배**.","src":"CH05(1) p.21","wiki":"D-AMPS","tags":["D-AMPS"],"diff":1,"introCard":0},{"id":"u2b-12","type":"cloze","q":"D-AMPS 는 AMPS 와 ___ band 를 쓰면서 음성을 ___ 해 한 채널에 3 명을 싣는다.","answer":["같은","디지털화"],"bank":["같은","디지털화","다른","FM 변조","spreading"],"explain":"same bands and channels + 7.95 kbps 디지털 음성 + TDMA 3 명.","src":"CH05(1) p.21","wiki":"D-AMPS","tags":["D-AMPS"],"introCard":0},{"id":"u2b-13","type":"num","q":"[Calc] D-AMPS 는 음성 3 개(각 7.95 kbps)를 TDMA 로 묶어 overhead 포함 48.6 kbps 로 보낸다. 48.6 kbps 중 순수 음성 데이터의 비율은 몇 %? (소수 첫째 자리)","answer":49.1,"unit":"%","tol":0.002,"explain":"3 × 7.95 = 23.85 kbps → 23.85 / 48.6 = 0.4907 → **49.1 %**. 나머지 절반은 overhead. PS1 1(c) 의 GSM 효율(38.4 %)과 같은 계산 틀이다.","src":"CH05(1) p.21","wiki":"D-AMPS","tags":["D-AMPS"],"diff":3,"introCard":0}],"intro":[{"title":"D-AMPS (2G)","body":"analog AMPS 의 **digital** 진화. AMPS 와 같은 band·30 kHz 채널을 쓰되 음성을 **7.95 kbps** 로 디지털화하고 세 사용자를 **TDMA** 로 묶어(overhead 포함 48.6 kbps) QPSK 로 싣는다 → FDMA + TDMA hybrid, 채널당 3 명.","img":"img/cn5-p22-damps.png","imgAlt":"AMPS(voice analog) 와 D-AMPS(voice digitized, TDMA) 비교","src":"CH05(1) p.21–22"},{"title":"무엇으로 사용자를 나누나","body":"FDMA = frequency, TDMA = time slot, CDMA = code. 1G → 2G 의 핵심 변화는 analog → digital.","src":"CH05(1) p.18–27"},{"title":"TDMA 의 원리","body":"TDMA 는 같은 주파수 채널을 시간 slot 으로 나눠 여러 사용자가 번갈아 쓴다. D-AMPS 는 30 kHz 채널 하나를 3 slot 으로 → AMPS(채널당 1 명)의 3 배.","src":"CH05(1) p.21"}]},{"id":"u2c","title":"GSM 구조와 bit rate","items":[{"id":"u2c-01","type":"tf","q":"GSM 은 한국 2G 표준이다.","answer":false,"explain":"GSM 은 **European** 표준. 한국 2G 는 IS-95(CDMA).","src":"CH05(1) p.23","wiki":"GSM","tags":["GSM"],"introCard":0},{"id":"u2c-02","type":"mc","q":"GSM 의 multiple access 는?","choices":["순수 TDMA","TDMA + FDMA","CDMA","FDMA 만"],"answer":1,"explain":"124 개 200 kHz 채널을 FDMA 로 나누고, 각 채널을 8 slot TDMA 로 → hybrid. \"GSM 은 순수 TDMA\" 는 함정.","src":"CH05(1) p.24–25","wiki":"GSM","tags":["GSM"],"introCard":0},{"id":"u2c-03","type":"order","q":"GSM 의 구조를 작은 것부터 큰 것 순으로","answer":["slot (156.25 bits)","frame (8 slots)","multiframe (26 frames, 120 ms)"],"explain":"slot ⊂ frame ⊂ multiframe. 이 포함 관계만 알면 bit rate 계산이 바로 된다.","src":"CH05(1) p.25","wiki":"GSM multiframe","tags":["GSM multiframe"],"introCard":0},{"id":"u2c-04","type":"num","q":"GSM channel bit rate = 26 × 8 × 156.25 bits / 120 ms 는 몇 kbps? (소수 첫째 자리)","answer":270.8,"unit":"kbps","tol":0.001,"explain":"8 × 156.25 = 1250 bits/frame → × 26 = 32,500 bits/multiframe → / 0.120 s = 270,833 bps ≈ **270.8 kbps**.","src":"CH05(1) p.25 · PS1 1(a)","wiki":"GSM channel bit rate","tags":["GSM channel bit rate"],"prof":true,"img":"img/cn5-p25-gsm.png","imgAlt":"p.25 GSM 전송 그림 — 8 users 의 13 kbps digitizer, TDMA multiframe(26 frames, 120 ms), 그 출력 bit rate 가 ? 로 가려져 있다","explainImg":"img/cn5-p25-gsm-ans.png","introCard":2},{"id":"u2c-05","type":"num","q":"GSM 사용자 한 명(slot 하나)의 rate 는? (270.8 kbps / 8, kbps, 소수 둘째 자리)","answer":33.85,"unit":"kbps","tol":0.002,"explain":"270.833 / 8 = **33.85 kbps**. frame 의 8 slot 중 한 사용자가 1 slot.","src":"PS1 1(b)","wiki":"GSM channel bit rate","tags":["GSM channel bit rate"],"prof":true,"introCard":2},{"id":"u2c-06","type":"num","q":"GSM 순수 user data: slot 당 65 bits, 26 frame 중 24 개가 traffic frame 이면 user data rate 는? (kbps)","answer":13,"unit":"kbps","tol":0.001,"explain":"24 × 65 = 1,560 bits / 0.120 s = 13,000 bps = **13 kbps**. 33.85 kbps 대비 효율 38.4 %.","src":"PS1 1(c)","wiki":"GSM channel bit rate","tags":["GSM channel bit rate"],"prof":true,"img":"img/cn5-p26-multiframe.png","imgAlt":"p.26 GSM multiframe components — 65 bits user data, 114 bits, 156.25 bits slot, frame = 8 slots, 1 multiframe = 26 frames (24 traffic + 2 control), 120 ms","introCard":1},{"id":"u2c-07","type":"num","q":"GSM multiframe 하나의 bit 수(26 × 8 × 156.25)는?","answer":32500,"unit":"bits","tol":0,"explain":"156.25 × 8 = 1250, × 26 = **32,500 bits**.","src":"CH05(1) p.25","wiki":"GSM multiframe","tags":["GSM multiframe"],"introCard":1},{"id":"u2c-08","type":"cloze","q":"GSM 은 slot 당 ___ bits, frame 당 ___ slots, multiframe 당 ___ frames 이다.","answer":["156.25","8","26"],"bank":["156.25","8","26","120","124","64"],"explain":"p.25. 120 은 multiframe 길이(ms), 124 는 채널 수. (계산 원리 이해용 수치)","src":"CH05(1) p.25","wiki":"GSM 프레임 구조","tags":["GSM 프레임 구조"],"introCard":1},{"id":"u2c-09","type":"match","q":"GSM 수치와 의미를 연결하시오","pairs":[["200 kHz","채널 하나의 폭"],["124","방향당 채널 수"],["120 ms","multiframe 길이"],["GMSK","270.8 kbps 를 200 kHz 에 싣는 변조"]],"explain":"270.8 kbps → GMSK → 200 kHz 아날로그 채널 → 124 채널을 FDMA 로 (p.25).","src":"CH05(1) p.24–25","wiki":"GSM 대역","tags":["GSM 대역"],"introCard":0},{"id":"u2c-10","type":"num","q":"GSM band 25 MHz 를 200 kHz 채널로 나누면?","answer":125,"unit":"개","tol":0,"explain":"25,000 / 200 = 125. 슬라이드는 guard 를 빼고 방향당 **124** 채널.","src":"CH05(1) p.24","wiki":"GSM 대역","tags":["GSM 대역"],"introCard":0},{"id":"u2c-11","type":"tf","q":"GSM 은 analog 신호(GMSK 반송파)로 전송하므로 analog communication 시스템이다.","answer":false,"explain":"\"analog 신호로 전송\" ≠ \"analog communication\". 정보는 digital 이고 반송파에 실을 때만 아날로그 파형이다 → GSM 은 **digital** 2G.","src":"CH05(1) p.25","wiki":"GMSK","tags":["GMSK"],"diff":3,"introCard":0},{"id":"u2c-12","type":"mc","q":"GSM 구조에서 MSC 에 붙은 데이터베이스 HLR 의 full name 은?","choices":["Home Location Register","High Level Router","Handoff Link Relay","Host Location Record"],"answer":0,"explain":"HLR = Home Location Register (슬라이드 표기 \"HRL- Home Loaction Register\" 는 오타). 별도 설명은 없다.","src":"CH05(1) p.23","wiki":"HLR","tags":["HLR"],"diff":1,"introCard":0},{"id":"u2c-13","type":"tf","q":"GSM 의 26 frame 중 24 개는 traffic, 2 개는 control 이다.","answer":true,"explain":"공식 모음: 26 frame (24 traffic + 2 control). PS1 1(c) 의 효율 계산에 쓴다.","src":"CH05(1) p.25","wiki":"GSM multiframe","tags":["GSM multiframe"],"introCard":1},{"id":"u2c-14","type":"cloze","q":"GSM bit rate = 26 × 8 × 156.25 bits ÷ ___ ms ≈ ___ kbps","answer":["120","270.8"],"bank":["120","270.8","200","33.85","124"],"explain":"multiframe 32,500 bits 를 120 ms 에 보낸다 → 270.8 kbps. 33.85 는 사용자 한 명 몫.","src":"CH05(1) p.25","wiki":"GSM channel bit rate","tags":["GSM channel bit rate"],"prof":true,"introCard":2},{"id":"u2c-15","type":"cloze","q":"GSM 은 270.8 kbps 를 ___ 로 변조해 ___ kHz 채널에 싣는다.","answer":["GMSK","200"],"bank":["GMSK","200","QPSK","30","FM"],"explain":"p.25 그림: 270.8 kbps → GMSK → 200 kHz. 30 kHz·FM 은 AMPS, QPSK 는 D-AMPS·IS-95.","src":"CH05(1) p.25","wiki":"GMSK","tags":["GMSK"],"img":"img/cn5-p25-gmsk.png","imgAlt":"p.25 GSM 전송 그림 — 270.8 kbps 다음 변조 상자 ① 과 채널 폭 ② 가 가려져 있다","explainImg":"img/cn5-p25-gmsk-ans.png","introCard":0},{"id":"u2c-16","type":"cloze","q":"그림은 GSM slot 하나의 구성이다. 65 bits = ①___, 114 bits = user data plus ②___, 156.25 bits = user data plus error control bits and ③___ 이다.","answer":["User data","error control bits","TDMA control bits"],"bank":["User data","error control bits","TDMA control bits","pilot bits","guard bits"],"explain":"안쪽부터 user data 65 → error control 을 붙여 114 → TDMA control 을 붙여 156.25 bits = slot 하나. PS1 1(c) 에서 \"65 of 156.25 bits are user data\" 가 이 그림이다.","src":"CH05(1) p.26","wiki":"GSM multiframe","tags":["GSM multiframe"],"prof":true,"img":"img/cn5-p26-slot.png","imgAlt":"p.26 GSM multiframe components — 65·114·156.25 bits 상자 옆 설명 ①②③ 이 가려져 있다","explainImg":"img/cn5-p26-slot-ans.png","introCard":1},{"id":"u2c-17","type":"num","q":"[PS1 1(a) 변형] A TDMA system uses 160 bits per slot, 8 slots per frame and 25 frames per multiframe. One multiframe lasts 100 ms. Find the channel bit rate (kbps).","answer":320,"unit":"kbps","tol":0.001,"explain":"1 multiframe = 25 × 8 × 160 = 32,000 bits. ÷ 0.100 s = 320,000 bps = **320 kbps**. 공식: (1/multiframe 시간) × frames × slots × bits/slot — PS1 1(a) 와 같은 틀.","src":"PS1 1(a) 변형","wiki":"GSM channel bit rate","tags":["GSM channel bit rate"],"prof":true,"introCard":2},{"id":"u2c-18","type":"num","q":"[PS1 1(b) 변형] A TDMA system uses 160 bits per slot, 8 slots per frame, 25 frames per multiframe, 100 ms per multiframe. One user gets one slot in every frame. Find the bit rate of one user before removing overhead (kbps).","answer":40,"unit":"kbps","tol":0.001,"explain":"25 frame × 1 slot × 160 bits = 4,000 bits / 0.100 s = 40,000 bps = **40 kbps** = 320 / 8.","src":"PS1 1(b) 변형","wiki":"GSM channel bit rate","tags":["GSM channel bit rate"],"prof":true,"introCard":2},{"id":"u2c-19","type":"num","q":"[PS1 1(c) 변형] slot 160 bits 중 60 bits 가 user data 이고, 25 frame 중 23 개가 traffic frame 이다. 사용자 한 명의 user data rate 는? (kbps)","answer":13.8,"unit":"kbps","tol":0.001,"explain":"user data bits / multiframe = 23 × 60 = 1,380 bits → ÷ 0.100 s = **13.8 kbps**. control frame 에는 user data 가 없으니 25 가 아니라 23 을 곱한다.","src":"PS1 1(c) 변형","wiki":"GSM channel bit rate","tags":["GSM channel bit rate"],"prof":true,"introCard":1},{"id":"u2c-20","type":"num","q":"[PS1 1(c) 변형] 160 bits/slot, 8 slots/frame, 25 frames/multiframe(100 ms) 인 TDMA 에서 한 사용자 몫은 40 kbps, 그중 user data 는 13.8 kbps 다. user data 효율은 몇 % 인가? (소수 첫째 자리)","answer":34.5,"unit":"%","tol":0.002,"explain":"13.8 / 40 = 0.345 → **34.5 %**. 검산: (60/160) × (23/25) = 0.375 × 0.92 = 0.345 ✓. 나머지는 error control·TDMA control bits·control frame.","src":"PS1 1(c) 변형","wiki":"GSM channel bit rate","tags":["GSM channel bit rate"],"prof":true,"introCard":1},{"id":"u2c-21","type":"order","q":"[PS1 1(a)] GSM channel bit rate 를 구하는 순서로 놓으시오","answer":["slot 하나 = 156.25 bits","frame = 8 slots → 1,250 bits","multiframe = 26 frames → 32,500 bits","÷ 120 ms → 270.8 kbps"],"explain":"작은 단위부터 곱해 올라가고 마지막에 multiframe 시간으로 나눈다. 단위 포함 관계 slot ⊂ frame ⊂ multiframe 이 그대로 식이 된다.","src":"PS1 1(a) · CH05(1) p.25","wiki":"GSM channel bit rate","tags":["GSM channel bit rate"],"prof":true,"introCard":2},{"id":"u2c-22","type":"tf","q":"[PS1 1(a)] channel bit rate 를 구할 때는 26 frame 중 control frame 2 개를 빼고 24 개만 곱한다.","answer":false,"explain":"X. control frame 도 채널 위를 지나가는 비트라 **channel rate 에는 26 개 모두** 넣는다 (270.8 kbps). 24 를 쓰는 것은 user data rate(1(c), 13 kbps)를 구할 때뿐이다.","src":"PS1 1(a)·(c)","wiki":"GSM multiframe","tags":["GSM multiframe"],"prof":true,"introCard":2}],"intro":[{"title":"GSM 구조","body":"European 2G 표준. 방향당 25 MHz 를 **200 kHz** 채널 124 개로(FDMA), 채널 하나를 **8 slot TDMA** 로 나눈다 → TDMA + FDMA hybrid. 데이터베이스 HLR = Home Location Register.","img":"img/cn5-p25-gsm-ans.png","imgAlt":"GSM: 8 users → TDMA multiframe 270.8 kbps → GMSK → 200 kHz 채널","src":"CH05(1) p.23–25"},{"title":"slot ⊂ frame ⊂ multiframe","body":"slot = **156.25 bits**(user data 65 + error control → 114 + TDMA control), frame = 8 slots, multiframe = 26 frames(24 traffic + 2 control) = **120 ms**.","img":"img/cn5-p26-multiframe.png","imgAlt":"GSM multiframe components","src":"CH05(1) p.26"},{"title":"bit rate 계산 (PS1 1)","body":"channel rate = frames × slots × bits ÷ multiframe 시간 = 26 × 8 × 156.25 / 0.120 s = **270.8 kbps** (control frame 도 포함). 한 사용자 = ÷ 8 = 33.85 kbps. user data = 24 × 65 / 0.120 = 13 kbps → 효율 38.4 %.","src":"CH05(1) p.25 · PS1 1(a)–(c)"}]}]},{"id":"u3","title":"3강 CDMA–4G","desc":"DSSS·CDMA · IS-95 forward/reverse · reuse 1·soft handoff · IMT-2000 · 4G all-IP","lessons":[{"id":"u3a","title":"DSSS 와 CDMA","items":[{"id":"u3a-01","type":"m
