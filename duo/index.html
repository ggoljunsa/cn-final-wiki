 줄이지 않은 형태로 쓰라.","answer":"FE80:0000:0000:0000:0000:0000:000A:0002","alts":["fe80:0000:0000:0000:0000:0000:000a:0002"],"explain":"보이는 section 3 개 → 0000 이 5 개 숨어 있다 → **FE80:0000:0000:0000:0000:0000:000A:0002**.","src":"PS2 유형 · 11/24 과제","wiki":"colon hexadecimal notation","tags":["colon hexadecimal notation"],"prof":true,"introCard":0},{"id":"u8e-04","type":"sa","q":"MAC 6A-1F-22-90-AB-07 의 interface ID(EUI-64)는?","answer":"681F:22FF:FE90:AB07","alts":["681f:22ff:fe90:ab07"],"explain":"6A = 0110 1010 → 왼쪽 7 번째 bit 를 뒤집어 0110 1000 = 68. 가운데 FFFE → **681F:22FF:FE90:AB07**.","src":"PS2 유형 · 11/24 과제","wiki":"EUI-64","tags":["EUI-64"],"prof":true,"introCard":1},{"id":"u8e-05","type":"mc","q":"같은 host 의 link-local 주소는?","choices":["FE80::6A1F:22FF:FE90:AB07","FE80::681F:22FF:FE90:AB07","FF02::681F:22FF:FE90:AB07","2001::681F:22FF:FE90:AB07"],"answer":1,"explain":"link-local = FE80::/10 + 0 + interface ID → **FE80::681F:22FF:FE90:AB07**. 7 번째 bit 를 뒤집은 68 을 써야 한다.","src":"PS2 유형 · 11/24 과제","wiki":"link-local address","tags":["link-local address"],"prof":true,"introCard":0},{"id":"u8e-06","type":"sa","q":"router 가 global prefix 2001:DB8:4A2 와 subnet ID 0007 을 알려 줬다. 같은 host 의 global unicast 주소는? (축약형)","answer":"2001:DB8:4A2:7:681F:22FF:FE90:AB07","alts":["2001:db8:4a2:7:681f:22ff:fe90:ab07"],"explain":"prefix(48) + subnet(16) + interface ID(64) → 2001:0DB8:04A2:0007:681F:22FF:FE90:AB07 → **2001:DB8:4A2:7:681F:22FF:FE90:AB07**.","src":"PS2 유형 · 11/24 과제","wiki":"global unicast address","tags":["global unicast address"],"prof":true,"introCard":1},{"id":"u8e-07","type":"mc","q":"IPv6 라우터가 다음 MTU 보다 큰 datagram 을 받으면?","choices":["조각내서 보낸다","버린다 (조각은 source 만 낸다)","destination 에 재조립을 요청한다","header 를 줄인다"],"answer":1,"explain":"IPv6 는 **source 만** fragmentation 한다. 라우터는 **drop**. IPv4 는 source 나 아무 라우터나 나눈다(L14 p.26, 교수 \"may be asked in exams\").","src":"PS2 유형 · 11/24 과제","wiki":"IPv6 fragmentation","tags":["IPv6 fragmentation"],"prof":true,"introCard":2},{"id":"u8e-08","type":"match","q":"IPv4 의 역할과 IPv6 에서 그것을 맡은 것","pairs":[["TTL","hop limit"],["ARP","neighbor discovery (ND)"],["IGMP","MLD"]],"explain":"hop limit 은 base header 의 8-bit 칸(L14 p.24), ND·MLD 는 ICMPv6 메시지 묶음(p.28).","src":"PS2 유형 · 11/24 과제","wiki":"ICMPv6","tags":["ICMPv6"],"prof":true,"introCard":2},{"id":"u8e-09","type":"mc","q":"IPv6 망 두 곳이 IPv4 만 되는 ISP 로만 이어져 있다. 알맞은 전환 방법은?","choices":["dual stack","tunneling","header translation","NAT"],"answer":1,"explain":"**tunneling**: IPv4 구간에 들어갈 때 IPv6 packet 을 IPv4 packet 에 넣고(encapsulate) 나올 때 꺼낸다(L14 p.31).","src":"PS2 유형 · 11/24 과제","wiki":"tunneling","tags":["tunneling"],"prof":true,"introCard":2}],"intro":[{"title":"줄이기 · 펴기","body":"section 앞의 0 을 지우고, **가장 긴** 0 줄 하나만 `::`. `::` 두 번은 무효(숨은 0 개수를 나눌 수 없다). 펼 때는 8 − 보이는 section 수만큼 0000.","src":"CH07(3) p.4 · PS2 2(a)"},{"title":"EUI-64 → link-local → global","body":"첫 byte 를 2진수로 써서 **왼쪽 7 번째 bit** 를 뒤집고 가운데 FFFE → interface ID. link-local = FE80:: + IID. global = prefix(48) + subnet(16) + IID(64).","img":"img/cn7c-p12-mac-ans.png","imgAlt":"48-bit MAC → 64-bit interface ID","src":"CH07(3) p.10–21 · PS2 2(b)"},{"title":"IPv4 와 다른 점","body":"IPv6 라우터는 큰 datagram 을 **버린다**(fragment 는 source 만). TTL → **hop limit**, ARP → **ND**, IGMP → **MLD**. IPv4 만 되는 구간을 건너려면 **tunneling**.","src":"CH07(3) p.24–31 · PS2 2(c)"}]}]},{"id":"u9","title":"9강 라우팅","desc":"least-cost tree · Bellman-Ford·DV · count to infinity · link state·Dijkstra · path vector · RIP·OSPF·BGP","lessons":[{"id":"u9a","title":"Least-cost 와 Bellman-Ford","items":[{"id":"u9a-01","type":"mc","q":"인터넷을 graph 로 볼 때 node 와 edge 는?","choices":["node = host, edge = cable","node = router, edge = network (cost 붙음)","node = AS, edge = BGP","node = packet, edge = link"],"answer":1,"explain":"weighted graph: node = router, edge = network, cost. best route = least-cost route.","src":"CH08 p.4","wiki":"least-cost routing","tags":["least-cost routing"],"diff":1,"introCard":0},{"id":"u9a-02","type":"num","q":"router 7 개인 graph 에서 least-cost tree 는 모두 몇 개?","answer":7,"unit":"개","tol":0,"explain":"라우터마다 자기를 root 로 한 tree 하나 → **7 개**.","src":"CH08 p.5","wiki":"least-cost tree","tags":["least-cost tree"],"diff":1,"introCard":0},{"id":"u9a-03","type":"cloze","q":"Bellman-Ford 식: D_xy = min(D_xy, ___ + ___). 앞 칸은 x → 이웃 z 의 link cost, 뒤 칸은 z 가 알려 준 z → y least cost.","answer":["c_xz","D_zy"],"bank":["c_xz","D_zy","D_xz","c_zy","D_yx"],"explain":"x 에서 이웃 z 까지 link cost + z 가 말한 z→y least cost.","src":"CH08 p.7","wiki":"Bellman-Ford equation","tags":["Bellman-Ford equation"],"introCard":1},{"id":"u9a-04","type":"num","q":"x 의 이웃 a(c=3), b(c=1), $D_{ay}=4$, $D_{by}=7$ 이면 $D_{xy}$ 는?","answer":7,"tol":0,"explain":"min(3 + 4, 1 + 7) = min(7, 8) = **7**, 첫 hop 은 a. link 가 싼 b 가 아니라 **합**이 싼 쪽.","src":"CH08 p.7","wiki":"Bellman-Ford equation","tags":["Bellman-Ford equation"],"introCard":1},{"id":"u9a-05","type":"num","q":"그림 (a): B 의 벡터 [A2, B0, C5, D∞, E4, F∞, G∞] 에 A 의 벡터 [A0, B2, C∞, D3, E∞, F∞, G∞] 가 도착했다 ($c_{BA}=2$). B 의 D 칸 새 값은?","answer":5,"tol":0,"explain":"min(∞, 2 + 3) = **5**. B 는 A 를 거쳐 D 로 가는 길을 처음 알게 된다.","src":"CH08 p.11","wiki":"Bellman-Ford equation","tags":["Bellman-Ford equation"],"img":"img/cn8-p11-dv.png","imgAlt":"p.11 DV 갱신 표 두 개 — (a) Old B·A 벡터, (b) Old B·E 벡터, 두 New B 열이 ? 로 가려져 있다","explainImg":"img/cn8-p11-dv-ans.png","introCard":2},{"id":"u9a-06","type":"num","q":"그림 (b): B 가 E 의 벡터를 받았다 ($c_{BE}=4$, E 에서 F 까지 2, B 의 F 칸은 ∞). B 의 F 칸 새 값은?","answer":6,"tol":0,"explain":"min(∞, 4 + 2) = **6**.","src":"CH08 p.11","wiki":"Bellman-Ford equation","tags":["Bellman-Ford equation"],"img":"img/cn8-p11-dv.png","imgAlt":"p.11 DV 갱신 표 두 개 — 두 New B 열이 ? 로 가려져 있다","explainImg":"img/cn8-p11-dv-ans.png","introCard":2},{"id":"u9a-07","type":"num","q":"X 의 현재 벡터 칸 $D_{XY}=9$. 이웃 Z($c_{XZ}=2$)가 $D_{ZY}=5$ 를 보냈다. 갱신 후 $D_{XY}$ 는?","answer":7,"tol":0,"explain":"min(9, 2 + 5) = **7** → next hop 이 Z 로 바뀐다.","src":"CH08 p.7,11","wiki":"distance vector routing","tags":["distance vector routing"],"introCard":1},{"id":"u9a-08","type":"num","q":"X 의 $D_{XY}=6$. 이웃 Z($c_{XZ}=4$)가 $D_{ZY}=3$ 을 보냈다. 갱신 후 값은?","answer":6,"tol":0,"explain":"min(6, 4 + 3 = 7) = **6** → 그대로.","src":"CH08 p.7","wiki":"distance vector routing","tags":["distance vector routing"],"introCard":1},{"id":"u9a-09","type":"match","q":"distance vector 용어","pairs":[["distance vector","root 에서 모든 node 까지 least cost 1-D 배열"],["초기 벡터","이웃만 값, 나머지 ∞"],["보내는 대상","이웃에게만"],["갱신 시점","asynchronously"]],"explain":"DV routing 의 네 가지 성질 (p.8–10).","src":"CH08 p.8–10","wiki":"distance vector","tags":["distance vector"],"introCard":1},{"id":"u9a-10","type":"tf","q":"distance vector routing 에서 node 는 처음부터 전체 network 의 지도를 가진다.","answer":false,"explain":"처음엔 **이웃**까지 cost 만 알고 나머지는 ∞. 이웃의 벡터를 받으며 채워 간다. global information 이 없는 것이 근본 한계.","src":"CH08 p.10","wiki":"distance vector","tags":["distance vector"],"introCard":0},{"id":"u9a-11","type":"order","q":"DV 한 번의 갱신 흐름","answer":["이웃 z 의 벡터 도착","벡터의 모든 칸에 $c_{xz}$ 를 더함","칸마다 자기 값과 min","바뀌면 자기 벡터를 이웃에게 보냄"],"explain":"`X[ ] = min(X[ ], c_XZ + Z[ ])` (p.11).","src":"CH08 p.11","wiki":"distance vector routing","tags":["distance vector routing"],"introCard":2},{"id":"u9a-12","type":"mc","q":"routing 과 forwarding 을 다시 정리하면?","choices":["routing = 패킷 단위 전달","routing = forwarding table 을 만든다, forwarding = 그 표를 패킷마다 쓴다","둘 다 host 가 한다","forwarding 이 Bellman-Ford 를 돌린다"],"answer":1,"explain":"CH08 첫 정리와 CH07 (1) 의 교수 문장이 같다.","src":"CH08 p.2","wiki":"routing","tags":["routing"],"diff":1,"introCard":0},{"id":"u9a-13","type":"num","q":"[Calc] x 의 이웃 a(c=2), b(c=5), c(c=1) 이고 $D_{ay}=6$, $D_{by}=2$, $D_{cy}=8$ 이다. Bellman-Ford 로 $D_{xy}$ 는?","answer":7,"tol":0,"explain":"이웃마다 c + D 를 더해 최소: a 2 + 6 = 8, b 5 + 2 = **7**, c 1 + 8 = 9 → min = 7 (b 경유). link cost 가 가장 작은 c 를 고르는 것은 함정.","src":"CH08 p.7","wiki":"Bellman-Ford equation","tags":["Bellman-Ford equation"],"prof":true,"introCard":1},{"id":"u9a-14","type":"tf","q":"[O/X] At boot, a node in distance-vector routing already knows the least cost to every node in the network. (If X, correct it.)","answer":false,"explain":"X. 부팅 때는 **이웃**까지의 link cost 만 알고 나머지는 ∞ (rudimentary vector, p.10). 이웃과 벡터를 주고받으며(exchange) Bellman-Ford 로 채워 간다.","src":"CH08 p.10","wiki":"distance vector","tags":["distance vector"],"introCard":1}],"intro":[{"title":"least-cost routing","body":"internet = weighted graph(node = router, edge = network, cost). 각 router 는 자기를 root 로 모든 node 로 가는 **least-cost tree** 를 가진다(router 7 개 → tree 7 개). routing 이 forwarding table 을 만들고 forwarding 이 쓴다.","img":"img/cn8-p04-graph.png","imgAlt":"weighted graph A~G","src":"CH08 p.2–5"},{"title":"Bellman-Ford 와 distance vector","body":"D_xy = min over 이웃 z (c_xz + D_zy). distance vector = root 에서 모든 node 까지 least cost 의 1-D 배열. 부팅 때는 이웃 link cost 만, 나머지 ∞.","img":"img/cn8-p09-dv.png","imgAlt":"A 의 least-cost tree 와 distance vector","src":"CH08 p.7–10"},{"title":"벡터를 받았을 때","body":"이웃 z 의 벡터가 오면 칸마다 X[y] = min(X[y], c_xz + Z[y]). 바뀌면 자기 벡터를 이웃에게 보낸다. 예: B 가 A 의 벡터를 받고 c_BA = 2 → B[D] = min(∞, 2 + 3) = 5.","img":"img/cn8-p11-dv-ans.png","imgAlt":"B 가 A·E 의 벡터를 받아 갱신","src":"CH08 p.11"}]},{"id":"u9b","title":"Count to infinity 와 대책","items":[{"id":"u9b-01","type":"cloze","q":"distance vector 의 성질: good news travels ___, bad news travels ___.","answer":["fast","slow"],"bank":["fast","slow","never","twice","backward"],"explain":"비용 감소는 빨리 퍼지고, 링크 고장(증가)은 느리게 퍼진다 → count to infinity.","src":"CH08 p.12","wiki":"count to infinity와 two-node loop","tags":["count to infinity와 two-node loop"],"introCard":0},{"id":"u9b-02","type":"order","q":"two-node loop 진행 (A–B–X, X 링크 고장)","answer":["A 가 X 고장을 알고 X = 16(∞)","A 가 알리기 전 B 의 stale \"X = 2\" 를 받음","A: min(16, 1 + 2) = 3","B: A 의 3 을 받아 4","서로 1 씩 올리며 16 까지 반복"],"explain":"A 가 16 을 바로 적는 건 맞다. 문제는 그 뒤 B 의 낡은 값을 믿는 것 (p.13).","src":"CH08 p.13","wiki":"count to infinity와 two-node loop","tags":["count to infinity와 two-node loop"],"img":"img/cn8-p13-loop.png","imgAlt":"p.13 two-node loop 그림 (a) Before failure ~ (e) Finally — A·B 의 X 행 cost 가 1·2 → 16 → 3 → 4 … 로 바뀐다","introCard":2},{"id":"u9b-03","type":"num","q":"two-node loop (X–A, A–B cost 모두 1): 고장 뒤 A 가 3 을 적는 것부터 A·B 가 둘 다 16(∞) 이 될 때까지 갱신은 모두 몇 번?","answer":15,"unit":"번","tol":0,"explain":"A 3, B 4, A 5 … 15 까지 13 번 + B 16, A 16 = **15 번**. link cost 2 면 A 5, B 7 … 로 8 번, cost 3 이면 5 번.","src":"공식 모음 · CH08 p.13","wiki":"count to infinity와 two-node loop","tags":["count to infinity와 two-node loop"],"diff":3,"introCard":2},{"id":"u9b-04","type":"tf","q":"RIP 에서 16 은 무한대(∞)를 뜻한다.","answer":true,"explain":"max hop 15, 16 = ∞. 그래서 RIP 은 작은 AS 에만.","src":"CH08 p.13,31","wiki":"hop count","tags":["hop count"],"diff":1,"introCard":1},{"id":"u9b-05","type":"mc","q":"split horizon 의 규칙은?","choices":["배운 이웃에게만 알린다","배운 이웃에게는 그 경로를 되돌려 알리지 않는다","모든 이웃에게 ∞ 로 알린다","flooding 한다"],"answer":1,"explain":"\"배운 이웃에게만 말하지 않는다\" — 다른 이웃에게는 말한다. timer 로 삭제.","src":"CH08 p.14","wiki":"split horizon","tags":["split horizon"],"introCard":1},{"id":"u9b-06","type":"mc","q":"poison reverse 의 규칙은?","choices":["알리지 않는다","배운 이웃에게도 알리되 값을 ∞ 로","값을 반으로","LSP 를 보낸다"],"answer":1,"explain":"split horizon 의 변형: 말하되 ∞ 로 → 상대가 그 길을 쓰지 않게.","src":"CH08 p.15","wiki":"poison reverse","tags":["poison reverse"],"img":"img/cn8-p15-poison.png","imgAlt":"p.15 X–A 링크가 끊긴 뒤 B 가 A 에게 보내는 메시지 상자가 ? 로 가려져 있다","explainImg":"img/cn8-p15-poison-ans.png","introCard":1},{"id":"u9b-07","type":"tf","q":"split horizon 과 poison reverse 를 쓰면 세 node 이상 loop 도 항상 막을 수 있다.","answer":false,"explain":"둘 다 **3 개 이상 node** 에서는 보장 못 한다 → three-node instability.","src":"CH08 p.16","wiki":"three-node instability","tags":["three-node instability"],"introCard":1},{"id":"u9b-08","type":"sa","q":"세 node 사이에서 split horizon 으로도 count to infinity 가 생기는 문제의 이름은?","answer":"three-node instability","alts":["three node instability"],"explain":"다른 이웃에게는 말하기 때문에 우회로가 생긴다.","src":"CH08 p.16","wiki":"three-node instability","tags":["three-node instability"],"introCard":0},{"id":"u9b-09","type":"mc","q":"DV 의 불안정이 생기는 근본 원인으로 정리본이 든 것은?","choices":["link cost 가 커서","각 node 에 global information 이 없어서","UDP 를 써서","Dijkstra 를 써서"],"answer":1,"explain":"이웃의 말만 믿으니 stale 값을 걸러낼 수 없다 → link state routing 으로.","src":"CH08 p.17","wiki":"link state routing","tags":["link state routing"],"introCard":0},{"id":"u9b-10","type":"match","q":"대책과 설명","pairs":[["split horizon","배운 쪽으로 되돌려 말하지 않음"],["poison reverse","되돌려 말하되 ∞"],["16","RIP 의 ∞"],["three-node instability","두 대책의 한계"]],"explain":"split horizon = 배운 이웃에게는 그 경로를 말하지 않음, poison reverse = 말하되 ∞ 로(\"나를 거쳐 가지 마\"). RIP 은 16 을 ∞ 로 써서 count to infinity 를 16 에서 끊는다. 그래도 node 가 셋 이상이면 다른 이웃을 돌아오는 소식 때문에 three-node instability 가 남는다 (p.14–16).","src":"CH08 p.13–16","wiki":"split horizon","tags":["split horizon"],"introCard":1},{"id":"u9b-11","type":"tf","q":"two-node loop 에서 문제는 A 가 고장을 알고도 16 을 적지 않는 것이다.","answer":false,"explain":"A 는 16 을 바로 적는다. 그 뒤 B 의 stale 값(X = 2)을 믿어 3 이 되는 것이 문제.","src":"CH08 p.13","wiki":"count to infinity와 two-node loop","tags":["count to infinity와 two-node loop"],"diff":3,"introCard":0}],"intro":[{"title":"good news fast, bad news slow","body":"비용 감소는 빨리 퍼지지만 link 가 끊기면(cost 증가) 이웃의 **오래된(stale)** 경로를 믿어 서로 값을 키워 가는 **count to infinity**. two-node loop: A 와 B 가 서로를 거쳐 X 로 간다고 믿는다.","img":"img/cn8-p13-loop.png","imgAlt":"two-node loop (a)~(e)","src":"CH08 p.12–13"},{"title":"split horizon · poison reverse","body":"**split horizon**: 경로를 배운 이웃에게는 그 경로를 알리지 않는다. **poison reverse**: 알리되 cost ∞(\"나를 거쳐 가지 마\"). RIP 은 16 = ∞. 그래도 node 셋 이상이면 **three-node instability**.","img":"img/cn8-p15-poison-ans.png","imgAlt":"B → A: \"X = ∞\"","src":"CH08 p.14–16"},{"title":"count to infinity 계산","body":"X–A–B 에서 X 링크가 끊기면 A 는 B 의 옛 벡터(X 까지 2)를 믿고 3, B 는 4, A 는 5 … 로 1 씩 번갈아 올라간다. RIP 은 16 = ∞ 에서 멈춘다(hop 15 까지만 유효).","img":"img/cn8-p13-loop.png","imgAlt":"two-node loop 진행","src":"CH08 p.13"}]},{"id":"u9c","title":"Link state 와 Dijkstra","items":[{"id":"u9c-01","type":"tf","q":"link state routing 에서는 모든 node 가 같은 LSDB 를 가진다.","answer":true,"explain":"LSDB 는 2-D 표, link 가 없으면 ∞. 모두가 같은 지도를 갖고 각자 Dijkstra.","src":"CH08 p.18","wiki":"LSDB","tags":["LSDB"],"introCard":0},{"id":"u9c-02","type":"tf","q":"LSDB 의 칸에는 least cost 가 들어간다.","answer":false,"explain":"LSDB 의 칸은 **link cost**. least cost 는 Dijkstra 로 계산한 결과.","src":"CH08 p.18","wiki":"LSDB","tags":["LSDB"],"diff":3,"img":"img/cn8-p18-lsdb.png","imgAlt":"p.18 (a) weighted graph A–G 와 (b) Link state database 7×7 표 (노란 칸은 ∞)","introCard":0},{"id":"u9c-03","type":"order","q":"flooding 과정","answer":["이웃과 greeting 으로 link 상태 파악","LSP 를 만들어 모든 interface 로 전송","받은 LSP 가 newer 면 보관하고 forward","아니면 discard"],"explain":"단점: traffic, congestion (p.19).","src":"CH08 p.19","wiki":"flooding과 LSP","tags":["flooding과 LSP"],"img":"img/cn8-p19-flood.png","imgAlt":"p.19 각 node 의 (Node, Cost) LSP 표가 빨간 화살표로 모든 interface 에 퍼지는 그림","introCard":1},{"id":"u9c-04","type":"sa","q":"link state routing 에서 각 node 가 자기 link 정보를 담아 flooding 하는 패킷은? (약어)","answer":"LSP","alts":["Link State Packet","link-state packet"],"explain":"LSP = Link State Packet.","src":"CH08 p.19","wiki":"flooding과 LSP","tags":["flooding과 LSP"],"diff":1,"introCard":0},{"id":"u9c-05","type":"order","q":"Dijkstra 알고리즘 단계","answer":["Init: 자기를 root, cost 는 LSDB 의 자기 행","Select: tree 밖에서 root 에 가장 가까운 node 추가","Update: 남은 node 의 cost 재계산","모든 node 가 들어갈 때까지 반복"],"explain":"p.20. 교수는 절차 네 줄과 예제 순서만 짚었다.","src":"CH08 p.20","wiki":"Dijkstra algorithm","tags":["Dijkstra algorithm"],"introCard":2},{"id":"u9c-06","type":"mc","q":"그래프 A–B 2, A–D 3, B–C 5, B–E 4, D–E 5, E–F 2, C–F 4, C–G 3, F–G 1 (무향) 에서 root A 로 Dijkstra 를 돌릴 때 tree 에 들어가는 순서는?","choices":["B, D, E, C, F, G","B, C, D, E, F, G","D, B, E, F, C, G","B, D, C, E, F, G"],"answer":0,"explain":"Init A → B(2) → D(3) → E(6) → C(7) → F(8) → G(9).","src":"CH08 p.21–25","wiki":"Dijkstra algorithm","tags":["Dijkstra algorithm"],"prof":true,"img":"img/cn8-p25-dijkstra.png","imgAlt":"p.25 Dijkstra root A — Initialization 과 Iteration 1~3 (Iteration 4~6 은 해설에)","explainImg":"img/cn8-p25-dijkstra-full.png","introCard":3},{"id":"u9c-07","type":"num","q":"그래프 A–B 2, A–D 3, B–C 5, B–E 4, D–E 5, E–F 2, C–F 4, C–G 3, F–G 1 (무향) 에서 root A 로 Dijkstra 를 돌리면 G 의 최종 cost 는?","answer":9,"tol":0,"explain":"Iter 4 에 C 경유 7 + 3 = 10, Iter 5 에 F 경유 8 + 1 = **9** 로 바뀐다 (\"paths may change\").","src":"CH08 p.24–25","wiki":"Dijkstra algorithm","tags":["Dijkstra algorithm"],"prof":true,"img":"img/cn8-p04-graph.png","imgAlt":"무향 weighted graph A–G: A–B 2, A–D 3, B–C 5, B–E 4, D–E 5, E–F 2, C–F 4, C–G 3, F–G 1","introCard":3},{"id":"u9c-08","type":"num","q":"그래프 A–B 2, A–D 3, B–C 5, B–E 4, D–E 5, E–F 2, C–F 4, C–G 3, F–G 1 (무향) 에서 root A 로 Dijkstra 를 돌린다. Iteration 1 에 B(2) 를 tree 에 넣은 뒤 C 의 임시 cost 는?","answer":7,"tol":0,"explain":"B 의 이웃 갱신: C = 2 + 5 = **7**, E = 2 + 4 = 6.","src":"CH08 p.21","wiki":"Dijkstra algorithm","tags":["Dijkstra algorithm"],"img":"img/cn8-p04-graph.png","imgAlt":"무향 weighted graph A–G: A–B 2, A–D 3, B–C 5, B–E 4, D–E 5, E–F 2, C–F 4, C–G 3, F–G 1","introCard":3},{"id":"u9c-09","type":"num","q":"그래프 A–B 2, A–D 3, B–C 5, B–E 4, D–E 5, E–F 2, C–F 4, C–G 3, F–G 1 (무향) 에서 root A 로 Dijkstra 를 돌린다. B(2) 다음 Iteration 2 에 D(3) 를 넣을 때 E 의 값(이미 B 경유 6)은?","answer":6,"tol":0,"explain":"E via D = 3 + 5 = 8 > 6 → **6** 유지.","src":"CH08 p.22","wiki":"Dijkstra algorithm","tags":["Dijkstra algorithm"],"img":"img/cn8-p04-graph.png","imgAlt":"무향 weighted graph A–G: A–B 2, A–D 3, B–C 5, B–E 4, D–E 5, E–F 2, C–F 4, C–G 3, F–G 1","introCard":3},{"id":"u9c-10","type":"num","q":"그래프 A–B 2, A–D 3, B–C 5, B–E 4, D–E 5, E–F 2, C–F 4, C–G 3, F–G 1 (무향) 에서 root B 로 Dijkstra 를 돌리면 G 의 최종 cost 는?","answer":7,"tol":0,"explain":"B → A 2, E 4, C 5, D 5, F 6, G = min(5 + 3, 6 + 1) = **7**.","src":"위키 Dijkstra algorithm mini","wiki":"Dijkstra algorithm","tags":["Dijkstra algorithm"],"diff":3,"img":"img/cn8-p04-graph.png","imgAlt":"p.4 weighted graph — A–B 2, A–D 3, B–C 5, B–E 4, D–E 5, E–F 2, C–F 4, C–G 3, F–G 1","introCard":3},{"id":"u9c-11","type":"order","q":"root B 로 돌릴 때 B 다음으로 tree 에 들어가는 순서 (동점은 알파벳 순)","answer":["A","E","C","D","F","G"],"explain":"A(2) → E(4) → C(5)·D(5) 동점 C 먼저 → F(6) → G(7).","src":"위키 Dijkstra algorithm mini","wiki":"Dijkstra algorithm","tags":["Dijkstra algorithm"],"diff":3,"introCard":3},{"id":"u9c-12","type":"cloze","q":"Dijkstra update: D(v) = min(D(v), ___ + c(u,v)). 여기서 u 는 방금 tree 에 넣은 ___ 이다.","answer":["D(u)","node"],"bank":["D(u)","node","D(v)","link","LSP"],"explain":"Bellman-Ford 와 같은 모양. 차이는 가장 가까운 node 하나를 골라 그 이웃만 갱신.","src":"CH08 p.20","wiki":"Dijkstra algorithm","tags":["Dijkstra algorithm"],"introCard":2},{"id":"u9c-13","type":"mc","q":"link state routing 의 단점은?","choices":["count to infinity","flooding 으로 인한 traffic·congestion","policy 를 못 씀","larger messages"],"answer":1,"explain":"count to infinity 는 DV 의 문제, larger messages 는 PV.","src":"CH08 p.19","wiki":"flooding과 LSP","tags":["flooding과 LSP"],"introCard":1},{"id":"u9c-14","type":"num","q":"[Dijkstra 변형] 그림의 그래프에서 root 를 D 로 하면 C 의 최종 cost 는?","answer":10,"tol":0,"explain":"D0 → A3 · E5 (이웃). A 추가 → B = 3 + 2 = 5. B·E(5 동점) 추가 → C = 5 + 5 = 10, F = 5 + 2 = 7. F 추가 → G = 8, C = min(10, 7 + 4) = 10. G 추가 → C = min(10, 8 + 3) = 10. → **C = 10**.","src":"CH08 p.20–25","wiki":"Dijkstra algorithm","tags":["Dijkstra algorithm"],"diff":3,"img":"img/cn8-p04-graph.png","imgAlt":"p.4 weighted graph — A–B 2, A–D 3, B–C 5, B–E 4, D–E 5, E–F 2, C–F 4, C–G 3, F–G 1","introCard":3},{"id":"u9c-15","type":"num","q":"[Dijkstra 변형] 그림의 그래프에서 root 를 D 로 하면 G 의 최종 cost 는?","answer":8,"tol":0,"explain":"D → E(5) → F(7) → G(8). 다른 길 D → A → B → C → G 는 3 + 2 + 5 + 3 = 13. → **8**.","src":"CH08 p.20–25","wiki":"Dijkstra algorithm","tags":["Dijkstra algorithm"],"img":"img/cn8-p04-graph.png","imgAlt":"p.4 weighted graph — A–B 2, A–D 3, B–C 5, B–E 4, D–E 5, E–F 2, C–F 4, C–G 3, F–G 1","introCard":3},{"id":"u9c-16","type":"sa","q":"[Term] \"A 2-D table: each cell = cost of that link (∞ if no link); every node keeps the same one.\" Give the term (약어).","answer":"LSDB","alts":["link-state database","link state database"],"explain":"p.18 LSDB (link-state database). least cost 가 아니라 **link 하나의 cost** 가 들어간다. least cost 는 각 node 가 LSDB 로 Dijkstra 를 돌려 얻는다.","src":"CH08 p.18","wiki":"LSDB","tags":["LSDB"],"diff":1,"introCard":0}],"intro":[{"title":"link state 와 LSDB","body":"모든 node 가 전체 지도 **LSDB**(2-D 표, 칸 = 그 link 의 cost, 없으면 ∞)를 똑같이 가진다. least cost 가 아니라 link cost.","img":"img/cn8-p18-lsdb.png","imgAlt":"weighted graph 와 link state database","src":"CH08 p.17–18"},{"title":"flooding","body":"이웃과 greeting 으로 link 상태 파악 → **LSP**(link state packet)를 만들어 모든 interface 로 → 받은 LSP 가 내 것보다 newer 면 보관·전달, 아니면 버림. 단점: traffic.","img":"img/cn8-p19-flood.png","imgAlt":"LSP 표가 모든 방향으로 퍼지는 그림","src":"CH08 p.19"},{"title":"Dijkstra","body":"Init: 자기를 root, cost 는 LSDB 의 자기 행. Select: tree 밖에서 root 에 **가장 가까운** node 를 넣는다. Update: D(v) = min(D(v), D(u) + c(u,v)). 모든 node 가 들어갈 때까지 반복.","img":"img/cn8-p20-dijkstra.png","imgAlt":"Init → Add the closest node → Update","src":"CH08 p.20"},{"title":"예제: root A","body":"그래프 A–B 2, A–D 3, B–C 5, B–E 4, D–E 5, E–F 2, C–F 4, C–G 3, F–G 1. 넣는 순서 B(2), D(3), E(6), C(7), F(8), G(9).","img":"img/cn8-p25-dijkstra-full.png","imgAlt":"root A 의 Iteration 1~6","src":"CH08 p.21–25"}]},{"id":"u9d","title":"Path vector 와 비교표","items":[{"id":"u9d-01","type":"mc","q":"path vector routing 이 least cost 대신 쓰는 기준은?","choices":["hop count","policy (untrusted node 회피, ISP 비즈니스)","Dijkstra","MTU"],"answer":1,"explain":"source 가 policy 로 경로를 고른다. 이웃과 whole path 를 교환.","src":"CH08 p.26–27","wiki":"path vector routing","tags":["path vector routing"],"introCard":0},{"id":"u9d-02","type":"num","q":"그림: least-cost 경로 S-B-D 의 cost 가 2 인데, B 를 믿지 못해 policy 로 S-A-C-D (cost 6) 를 골랐다. policy 때문에 더 드는 cost 는?","answer":4,"tol":0,"explain":"6 − 2 = **4**. cost 가 커도 policy(예: B 를 믿지 않음) 때문에 S-A-C-D 를 고른다.","src":"CH08 p.27","wiki":"path vector routing","tags":["path vector routing"],"img":"img/cn8-p27-policy.png","imgAlt":"p.27 S–A–C–D (파란 굵은 선) 와 S–B–D (빨간 점선) — 두 경로의 이름표가 ? 로 가려져 있다","explainImg":"img/cn8-p27-policy-ans.png","introCard":0},{"id":"u9d-03","type":"match","q":"알고리즘과 대표 프로토콜","pairs":[["RIP","distance vector"],["OSPF","link state"],["BGP","path vector"],["Dijkstra","OSPF router 가 tree 를 만드는 알고리즘"]],"explain":"DV·LS 는 AS 안, PV 는 AS 사이.","src":"CH08 p.28","wiki":"라우팅 알고리즘 비교","tags":["라우팅 알고리즘 비교"],"diff":1,"introCard":1},{"id":"u9d-04","type":"match","q":"알고리즘과 경로 선택 방식","pairs":[["distance vector","Bellman-Ford"],["link state","Dijkstra"],["path vector","policy 기반 선택"],["link state 의 전송 대상","everyone (flooding)"]],"explain":"DV·PV 는 이웃에게만, link state 만 모두에게(flooding).","src":"CH08 p.28","wiki":"라우팅 알고리즘 비교","tags":["라우팅 알고리즘 비교"],"introCard":0},{"id":"u9d-05","type":"match","q":"알고리즘과 단점","pairs":[["distance vector","count to infinity"],["link state","flooding traffic"],["path vector","larger messages"],["count to infinity 의 대책","split horizon · poison reverse"]],"explain":"p.28 비교표 Weak point 행: DV 는 이웃의 오래된 벡터를 믿어 count to infinity, LS 는 LSP 를 모두에게 flooding 해서 traffic, PV 는 경로 전체를 실어 보내 메시지가 크다. \"무엇을·누구에게 보내나\" 행과 짝지어 보면 원인이 보인다.","src":"CH08 p.28","wiki":"라우팅 알고리즘 비교","tags":["라우팅 알고리즘 비교"],"img":"img/cn8-p28-compare.png","imgAlt":"p.28 Comparison of Routing Algorithms 표 — Weak point 행이 ? 로 가려져 있다","explainImg":"img/cn8-p28-compare-ans.png","introCard":0},{"id":"u9d-06","type":"tf","q":"link state 의 \"To whom\" 은 neighbors only 다.","answer":false,"explain":"link state 는 **everyone (flooding)**. DV·PV 만 neighbors only.","src":"CH08 p.28","wiki":"라우팅 알고리즘 비교","tags":["라우팅 알고리즘 비교"],"introCard":1},{"id":"u9d-07","type":"cloze","q":"distance vector 는 ___ 를, link state 는 ___ 를, path vector 는 whole path 를 보낸다.","answer":["vector","LSP"],"bank":["vector","LSP","LSDB","segment","policy"],"explain":"무엇을 보내나(What) 행.","src":"CH08 p.28","wiki":"라우팅 알고리즘 비교","tags":["라우팅 알고리즘 비교"],"introCard":0},{"id":"u9d-08","type":"mc","q":"intra-AS 와 inter-AS 에서 쓰이는 알고리즘 짝으로 옳은 것은?","choices":["DV·LS → inter-AS, PV → intra-AS","DV·LS → intra-AS, PV → inter-AS","모두 intra-AS","모두 inter-AS"],"answer":1,"explain":"RIP·OSPF 는 AS 안(IGP), BGP 는 AS 사이(EGP).","src":"CH08 p.28,30","wiki":"intra-AS와 inter-AS routing","tags":["intra-AS와 inter-AS routing"],"introCard":2},{"id":"u9d-09","type":"tf","q":"algorithm(Bellman-Ford·Dijkstra 같은 저수준 절차)과 protocol(RIP·OSPF·BGP 처럼 algorithm 을 쓰는 규칙 묶음)은 구분해야 한다.","answer":true,"explain":"Bellman-Ford·Dijkstra 는 algorithm, RIP·OSPF 는 protocol.","src":"CH08 정리 (교수 구분)","wiki":"라우팅 알고리즘 비교","tags":["라우팅 알고리즘 비교"],"prof":true,"diff":1,"introCard":1},{"id":"u9d-10","type":"mc","q":"path vector 에서 경로 정보를 받은 node 가 loop 를 피할 수 있는 이유는?","choices":["TTL 이 있어서","whole path 에 자기가 있으면 그 경로를 버리면 되므로","flooding 해서","hop count 가 16 이라서"],"answer":1,"explain":"경로 전체를 받으니 자기 이름이 있는지 보면 된다 (whole path 교환의 장점).","src":"CH08 p.26","wiki":"path vector routing","tags":["path vector routing"],"diff":3,"introCard":0},{"id":"u9d-11","type":"mc","q":"Bellman-Ford 를 쓰는 것은?","choices":["distance vector","link state","path vector","flooding"],"answer":0,"explain":"DV = Bellman-Ford, LS = Dijkstra, PV = policy.","src":"CH08 p.28","wiki":"라우팅 알고리즘 비교","tags":["라우팅 알고리즘 비교"],"diff":1,"introCard":0}],"intro":[{"title":"path vector routing","body":"least cost 가 아니라 **policy**(신뢰·보안·사업)로 경로를 고른다. 이웃과 **경로 전체**를 주고받고, 받은 경로에 자기가 있으면 loop 라 버린다. ISP 사이(BGP)용.","img":"img/cn8-p27-policy-ans.png","imgAlt":"least cost (2) 지만 B 를 피한 policy route (6)","src":"CH08 p.26–27"},{"title":"세 알고리즘 비교","body":"DV: 벡터를 이웃에게, Bellman-Ford, 약점 count to infinity, RIP. LS: LSP 를 모두에게(flooding), Dijkstra, 약점 flooding traffic, OSPF. PV: 경로를 이웃에게, policy, 약점 큰 메시지, BGP. DV·LS 는 AS 안, PV 는 AS 사이.","img":"img/cn8-p28-compare-ans.png","imgAlt":"Comparison of Routing Algorithms 표","src":"CH08 p.28"},{"title":"algorithm vs protocol","body":"algorithm = 저수준 절차(Bellman-Ford, Dijkstra, policy 선택), protocol = 그 위의 규칙 묶음(RIP = DV, OSPF = LS, BGP = PV). intra-AS 는 DV·LS(RIP·OSPF), inter-AS 는 PV(BGP).","src":"CH08 p.28–30"}]},{"id":"u9e","title":"AS 와 RIP · OSPF · BGP","items":[{"id":"u9e-01","type":"mc","q":"hierarchical routing 을 쓰는 이유는?","choices":["보안","scalability + administrative autonomy","MTU","QoS"],"answer":1,"explain":"인터넷이 너무 커서 하나의 routing 으로는 안 되고, ISP 마다 관리 정책이 다르다.","src":"CH08 p.30","wiki":"autonomous system","tags":["autonomous system"],"introCard":0},{"id":"u9e-02","type":"sa","q":"하나의 ISP 처럼 한 관리 주체가 운영하는 network 묶음은? (약어)","answer":"AS","alts":["autonomous system"],"explain":"AS = Autonomous System.","src":"CH08 p.30","wiki":"autonomous system","tags":["autonomous system"],"diff":1,"introCard":0},{"id":"u9e-03","type":"cloze","q":"RIP 의 cost 는 ___ 이고 최대값은 ___ 이다.","answer":["hop count","15"],"bank":["hop count","15","weight","16","delay"],"explain":"hop count = 지나는 network 수, max 15, 16 = ∞.","src":"CH08 p.31","wiki":"hop count","tags":["hop count"],"introCard":1},{"id":"u9e-04","type":"mc","q":"RIP hop count 를 셀 때 맞는 것은?","choices":["출발 라우터 쪽 network 도 센다","목적지까지 지나는 network 수 (출발 라우터 쪽 network 는 안 셈)","라우터 수","link cost 합"],"answer":1,"explain":"p.31 예: R3 1, R2 2, R1 3.","src":"CH08 p.31","wiki":"hop count","tags":["hop count"],"diff":3,"img":"img/cn8-p31-rip.png","imgAlt":"p.31 Source(N1)–R1–N2–R2–N3–R3–Destination(N4) 그림 — R3·R2·R1 에서 N4 까지 세 화살표의 hop 수가 ? 로 가려져 있다","explainImg":"img/cn8-p31-rip-ans.png","introCard":1},{"id":"u9e-05","type":"match","q":"프로토콜과 전송","pairs":[["RIP","UDP 520, 30 s 마다"],["BGP","TCP 179"],["OSPF","link state, Dijkstra"],["RIP metric","hop count"]],"explain":"녹음의 \"13 seconds\" 는 오인식, 30 s.","src":"CH08 p.31–37","wiki":"RIP","tags":["RIP"],"introCard":1},{"id":"u9e-06","type":"tf","q":"RIP 라우터는 같은 next router 에서 온 소식이면 cost 가 올라가도 받아들인다.","answer":true,"explain":"RIP 교체 규칙 ③. (① 새 경로 ② 더 낮은 cost ③ 더 높아도 같은 next router)","src":"CH08 p.32","wiki":"RIP","tags":["RIP"],"diff":3,"introCard":1},{"id":"u9e-07","type":"num","q":"RIP: 이웃이 목적지 net1 까지 hop 2 라고 보내 왔다. 이 라우터가 표에 적을 hop 은?","answer":3,"tol":0,"explain":"받으면 **+1** → 3.","src":"CH08 p.32","wiki":"RIP","tags":["RIP"],"introCard":1},{"id":"u9e-08","type":"mc","q":"OSPF 의 metric 은?","choices":["hop count 만","weight (throughput·RTT·reliability 등)","policy","TTL"],"answer":1,"explain":"OSPF 는 link state 기반, metric = weight, Dijkstra.","src":"CH08 p.34","wiki":"OSPF","tags":["OSPF"],"introCard":2},{"id":"u9e-09","type":"num","q":"그림의 OSPF 경로에서 지나는 network weight 를 더해 R1 에서 N4 까지 12, R2 에서 N4 까지 7 이면 그 차이는?","answer":5,"tol":0,"explain":"weight 합: R3 4, R2 7, R1 12 → 12 − 7 = 5 (R1 과 R2 사이 network weight).","src":"CH08 p.34","wiki":"OSPF","tags":["OSPF"],"img":"img/cn8-p34-ospf.png","imgAlt":"p.34 N1(cost 4)–R1–N2(5)–R2–N3(3)–R3–N4(4) 그림 — 세 Total cost 가 ? 로 가려져 있다","explainImg":"img/cn8-p34-ospf-ans.png","introCard":2},{"id":"u9e-10","type":"cloze","q":"OSPF 는 큰 AS 를 ___ 로 나눠 그 안에서만 flooding 하고, 중심은 area ___ (backbone) 이다.","answer":["area","0"],"bank":["area","0","AS","1","subnet"],"explain":"area border router · AS boundary router.","src":"CH08 p.35","wiki":"OSPF area","tags":["OSPF area"],"introCard":2},{"id":"u9e-11","type":"mc","q":"BGP4 에 대한 설명으로 옳은 것은?","choices":["link state 기반","인터넷의 유일한 interdomain 프로토콜, path vector","UDP 520 사용","AS 안에서만 쓴다"],"answer":1,"explain":"BGP4 = path vector(policy). OSPF(link state)와 섞지 말 것.","src":"CH08 p.36","wiki":"BGP4","tags":["BGP4"],"introCard":0},{"id":"u9e-12","type":"match","q":"eBGP 와 iBGP","pairs":[["eBGP","서로 다른 AS 의 border router 끼리"],["iBGP","같은 AS 안의 router 쌍"],["BGP 전송","TCP 179"],["BGP 의 기반","path vector routing"]],"explain":"p.37: eBGP 는 서로 다른 AS 의 border router 끼리(물리적으로 연결), iBGP 는 같은 AS 안 어느 router 쌍이든 — border 가 배운 경로를 AS 전체에 퍼뜨린다. 둘 다 TCP 179 위의 logical 연결이다.","src":"CH08 p.37","wiki":"eBGP와 iBGP","tags":["eBGP와 iBGP"],"img":"img/cn8-p37-bgp.png","imgAlt":"p.37 AS 1(R1·R2·R3)과 AS 2(R4·R5·R6) — AS 안은 파란 점선, R1–R4 는 빨간 실선이고 그 이름이 ? 로 가려져 있다","explainImg":"img/cn8-p37-bgp-ans.png","introCard":2},{"id":"u9e-13","type":"tf","q":"RIP 은 hop 15 제한 때문에 작은 AS 에 알맞다.","answer":true,"explain":"16 = ∞ 라 지름이 큰 AS 에는 못 쓴다.","src":"CH08 p.31","wiki":"RIP","tags":["RIP"],"diff":1,"introCard":1},{"id":"u9e-14","type":"cloze","q":"intra-AS routing 의 예는 RIP·___, inter-AS routing 의 예는 ___ 이다.","answer":["OSPF","BGP"],"bank":["OSPF","BGP","ICMP","ARP","DHCP"],"explain":"intradomain(IGP): RIP·OSPF / interdomain(EGP): BGP (p.30).","src":"CH08 p.30","wiki":"intra-AS와 inter-AS routing","tags":["intra-AS와 inter-AS routing"],"img":"img/cn8-p30-as.png","imgAlt":"p.30 AS 1·AS 2 그림 — AS 안 routing 이름 두 개와 AS 사이 routing 이름이 ? 로 가려져 있다","explainImg":"img/cn8-p30-as-ans.png","introCard":0}],"intro":[{"title":"hierarchical routing 과 AS","body":"하나의 protocol 로는 표가 너무 크고(scalability) ISP 마다 관리하고 싶어 한다(administration) → **AS**(autonomous system). AS 안 = intra-AS(RIP, OSPF), AS 사이 = inter-AS(BGP).","img":"img/cn8-p30-as-ans.png","imgAlt":"AS 1, AS 2 와 intra / inter-AS","src":"CH08 p.29–30"},{"title":"RIP","body":"distance vector 기반. cost = **hop count** = 목적지 host 까지 지나는 network 수(최대 15, 16 = ∞ → 작은 AS 용). 이웃의 표를 받으면 +1 하고 next router 를 보낸 쪽으로. UDP 520, 30 초마다.","img":"img/cn8-p31-rip-ans.png","imgAlt":"R1 3 hops, R2 2 hops, R3 1 hop","src":"CH08 p.31–33"},{"title":"OSPF 와 BGP4","body":"OSPF: link state + Dijkstra, metric = weight(throughput·RTT·reliability), 큰 AS 는 area 로 나눠 그 안에서만 flooding(중심 backbone area 0). BGP4: 유일한 inter-domain protocol, path vector, TCP 179. eBGP = 다른 AS 의 border router 끼리, iBGP = 같은 AS 안 router 쌍.","img":"img/cn8-p37-bgp-ans.png","imgAlt":"AS 1·AS 2 사이 eBGP, 안쪽 iBGP","src":"CH08 p.34–37"}]},{"id":"u9f","title":"PS2 유형 연습 — Dijkstra · Bellman-Ford · RIP","items":[{"id":"u9f-01","type":"order","q":"그림의 그래프에서 A 를 root 로 Dijkstra 를 돌릴 때 tree 에 들어가는 순서","answer":["A","B","C","D","E","F"],"explain":"A(0) → B(2) → C(5: A–B–C, 직접 6 보다 쌈) → D(7: C 경유, B 경유 9) → E(9) → F(10: D 경유, E 경유 11).","src":"PS2 유형 · 11/24 과제","wiki":"Dijkstra algorithm","tags":["Dijkstra algorithm"],"prof":true,"img":"img/cn9-ps2-graph.png","imgAlt":"6-router 그래프: A–B 2, A–C 6, B–C 3, B–D 7, C–D 2, C–E 4, D–E 5, D–F 3, E–F 2","introCard":0},{"id":"u9f-02","type":"num","q":"같은 그래프에서 A 에서 D 까지 least cost 는?","answer":7,"tol":0,"explain":"A–B–C–D = 2 + 3 + 2 = **7**. A–B–D = 9, A–C–D = 8.","src":"PS2 유형 · 11/24 과제","wiki":"Dijkstra algorithm","tags":["Dijkstra algorithm"],"prof":true,"img":"img/cn9-ps2-graph.png","imgAlt":"6-router 그래프 (위와 같음)","introCard":0},{"id":"u9f-03","type":"mc","q":"A 의 forwarding table 에서 C 로 가는 줄의 next hop 은?","choices":["C (직접 link 6)","B (A–B–C = 5)","D","E"],"answer":1,"explain":"직접 link 6 보다 B 를 거치는 2 + 3 = 5 가 싸다 → next hop **B**. PS2 에서도 같은 함정이 나온다.","src":"PS2 유형 · 11/24 과제","wiki":"least-cost tree","tags":["least-cost tree"],"prof":true,"img":"img/cn9-ps2-graph.png","imgAlt":"6-router 그래프 (위와 같음)","introCard":0},{"id":"u9f-04","type":"num","q":"A 에서 F 까지 least cost 는?","answer":10,"tol":0,"explain":"A–B–C–D–F = 2 + 3 + 2 + 3 = **10**. E 를 거치면 9 + 2 = 11.","src":"PS2 유형 · 11/24 과제","wiki":"Dijkstra algorithm","tags":["Dijkstra algorithm"],"prof":true,"img":"img/cn9-ps2-graph.png","imgAlt":"6-router 그래프 (위와 같음)","introCard":0},{"id":"u9f-05","type":"num","q":"A 의 이웃은 B(cost 2)와 C(cost 6)뿐이다. B 의 벡터에서 E = 7, C 의 벡터에서 E = 4. Bellman-Ford 로 A 의 E 까지 cost 는?","answer":9,"tol":0,"explain":"min(2 + 7, 6 + 4) = min(9, 10) = **9**, next hop B.","src":"PS2 유형 · 11/24 과제","wiki":"Bellman-Ford equation","tags":["Bellman-Ford equation"],"prof":true,"introCard":1},{"id":"u9f-06","type":"num","q":"X–A cost 3, A–B cost 2 인 줄에서 X–A 가 끊겼다. B 의 옛 값(X = 5)이 먼저 A 에 오면 A 가 새로 적는 X 까지 cost 는?","answer":7,"tol":0,"explain":"A 는 B 를 거치면 된다고 믿는다: 2 + 5 = **7**. 그 뒤 B 9, A 11 … 2 씩 올라가 16(∞)까지 간다(two-node loop). split horizon 이면 B 는 A 에게 X 를 알리지 않는다.","src":"PS2 유형 · 11/24 과제","wiki":"count to infinity와 two-node loop","tags":["count to infinity와 two-node loop"],"prof":true,"introCard":1},{"id":"u9f-07","type":"mc","q":"RIP: R 의 줄 (N1, D, 2) 에 이웃 D 가 \"N1 3\" 을 보냈다. 새 줄은?","choices":["(N1, D, 2) 유지","(N1, D, 4) — 같은 next router 라 교체","(N1, D, 3)","(N1, -, 4)"],"answer":1,"explain":"3 + 1 = 4 > 2 지만 **같은 next router(D)** 에서 온 소식이라 규칙 ③ 으로 받아들인다 → (N1, D, 4).","src":"PS2 유형 · 11/24 과제","wiki":"RIP","tags":["RIP"],"prof":true,"img":"img/cn9-ps2-rip.png","imgAlt":"R 의 표와 D 가 보낸 cost: N1 D 2 / 3, N2 A 6 / 2, N3 - 1 / 4, N4 D 4 / 15, N6 없음 / 5","introCard":2},{"id":"u9f-08","type":"mc","q":"같은 표에서 N2 (A, 6) 와 N4 (D, 4) 는 각각 어떻게 되나?","choices":["N2 유지, N4 유지","N2 → (D, 3) 규칙 ②, N4 → (D, 16 = ∞) 규칙 ③","N2 → (D, 3), N4 유지","N2 유지, N4 → (D, 15)"],"answer":1,"explain":"N2: 2 + 1 = 3 \u003c 6 → 더 싸서 교체(②). N4: 15 + 1 = **16 = ∞**, 같은 next router D → 교체(③), unreachable.","src":"PS2 유형 · 11/24 과제","wiki":"RIP","tags":["RIP"],"prof":true,"img":"img/cn9-ps2-rip.png","imgAlt":"R 의 표와 D 가 보낸 cost (위와 같음)","introCard":2},{"id":"u9f-09","type":"mc","q":"같은 표에서 N3 (−, 1) 과 N6 은?","choices":["N3 → (D, 5), N6 추가 (D, 6)","N3 유지, N6 추가 (D, 6)","N3 유지, N6 무시","N3 → (D, 4), N6 (D, 5)"],"answer":1,"explain":"N3: 4 + 1 = 5 > 1 이고 next router 도 다르니 유지. N6: 처음 보는 목적지 → 규칙 ① 로 **(N6, D, 6)** 추가.","src":"PS2 유형 · 11/24 과제","wiki":"RIP","tags":["RIP"],"prof":true,"img":"img/cn9-ps2-rip.png","imgAlt":"R 의 표와 D 가 보낸 cost (위와 같음)","introCard":2},{"id":"u9f-10","type":"match","q":"상황과 알맞은 라우팅 프로토콜","pairs":[["router 몇 대인 작은 회사망","RIP"],["link 마다 delay 기반 weight, area 로 나눈 큰 AS","OSPF"],["두 ISP 사이, 특정 AS 를 정책으로 피해야 함","BGP"]],"explain":"RIP = hop count(최대 15), OSPF = link state + weight + area, BGP = AS 사이 유일한 path vector(policy).","src":"PS2 유형 · 11/24 과제","wiki":"라우팅 알고리즘 비교","tags":["라우팅 알고리즘 비교"],"prof":true,"introCard":2}],"intro":[{"title":"Dijkstra 표 만들기","body":"Init(root 의 이웃 cost) → tree 밖에서 가장 작은 것 Select → 그 node 를 거쳐 싸지는 이웃만 Update. 칸마다 cost(previous). next hop = tree 에서 root 다음 node — **직접 link 보다 돌아가는 길이 싼 경우**를 조심.","img":"img/cn9-ps2-graph.png","imgAlt":"6-router 그래프","src":"CH08 p.20–25 · PS2 3(a)"},{"title":"Bellman-Ford 와 two-node loop","body":"$D_{xy} = \\min(c_{xa} + D_{ay}, …)$ 를 목적지마다. link 가 끊기면 이웃의 옛(stale) 값을 믿어 link cost 씩 올라가 16 까지 간다. split horizon = 배운 이웃에게는 안 알림, poison reverse = ∞ 로 알림.","src":"CH08 p.7, 13–15 · PS2 3(b)(c)"},{"title":"RIP 갱신 세 규칙","body":"받은 cost + 1, next router = 보낸 이웃. ① 새 목적지 → 추가 ② 더 쌈 → 교체 ③ 더 비싸도 **같은 next router** 면 교체. 15 + 1 = 16 = ∞.","img":"img/cn9-ps2-rip.png","imgAlt":"R 의 표와 D 가 보낸 cost","src":"CH08 p.31–32 · PS2 3(d)"}]}]},{"id":"u10","title":"10강 Transport (CH09)","desc":"process-to-process · port·socket · error control·sliding window · UDP · TCP seq/ack·header · handshake · FIN·half close · window · flow·congestion","lessons":[{"id":"u10a","title":"Transport 서비스와 port","items":[{"id":"u10a-01","type":"mc","q":"transport layer 가 맡는 delivery 는?","choices":["host-to-host","process-to-process","node-to-node","network-to-network"],"answer":1,"explain":"network layer 가 host 까지 데려다 주면, transport layer 가 그 host 의 올바른 **process** 에 넘긴다 (p.4, 8).","src":"CH09 p.4–8","wiki":"transport layer","introCard":0},{"id":"u10a-02","type":"match","q":"주소와 고르는 대상","pairs":[["IP address","host 를 고른다"],["port number","host 안의 process 를 고른다"],["socket address","IP address + port"],["연결 하나","client socket + server socket 한 쌍"]],"explain":"p.10–12: IP address 가 host 를, port number 가 그 host 안의 process 를 고른다. 둘을 합친 socket address 가 process 하나의 주소이고, 연결 하나는 client socket address + server socket address 한 쌍으로 정해진다.","src":"CH09 p.10–12","wiki":"socket address","introCard":0},{"id":"u10a-03","type":"tf","q":"client 는 보통 1023 보다 큰 임시(ephemeral) port 를 쓰고, server 는 고정된 well-known port 를 쓴다.","answer":true,"explain":"교수: \"please remember that client uses a temporary port number\" (1117 13:04). server 는 client 가 찾아올 수 있게 well-known port.","src":"1117 녹음 13:04 · CH09 p.9","prof":true,"wiki":"port number","introCard":1},{"id":"u10a-04","type":"mc","q":"port number 의 범위는?","choices":["0–255","0–1023","0–65,535","1–65,536"],"answer":2,"explain":"port 는 16 bits → **0–65,535** (p.9).","src":"CH09 p.9","diff":1,"wiki":"port number","introCard":0},{"id":"u10a-05","type":"match","q":"ICANN 의 port 범위","pairs":[["0–1023","well-known (ICANN 이 할당·관리)"],["1024–49,151","registered (중복 방지용 등록만)"],["49,152–65,535","dynamic / private (임시로 자유롭게)"],["13","Daytime server 의 well-known port"]],"explain":"p.11: 0–1023 well-known 은 ICANN 이 할당·관리(server 용), 1024–49,151 registered 는 할당은 안 하고 중복 방지를 위해 등록만, 49,152–65,535 dynamic/private 는 누구나 임시로(client 의 ephemeral port). Daytime 13 은 well-known.","src":"CH09 p.11","wiki":"CH09 전송 계층과 UDP","introCard":1},{"id":"u10a-06","type":"num","q":"registered port 범위 1024–49,151 에는 port 가 몇 개?","answer":48128,"unit":"개","tol":0,"explain":"49,151 − 1024 + 1 = **48,128**.","src":"CH09 p.11","wiki":"CH09 전송 계층과 UDP","introCard":1},{"id":"u10a-07","type":"mc","q":"Daytime client(ephemeral port 52000)가 server(well-known port 13)에 요청을 보낸다. 요청 segment 의 (src, dst) port 는?","choices":["(13, 52000)","(52000, 13)","(13, 13)","(52000, 52000)"],"answer":1,"explain":"요청: src 52000(ephemeral) → dst 13(well-known). 응답은 거꾸로 src 13 → dst 52000 (p.9).","src":"CH09 p.9","prof":true,"img":"img/cn9-p10-daytime.png","imgAlt":"p.10 Daytime client(왼쪽)와 server(오른쪽) transport layer — 오가는 두 packet 의 port 칸이 ? 로 가려져 있다","explainImg":"img/cn9-p10-daytime-ans.png","wiki":"segment","introCard":1},{"id":"u10a-08","type":"cloze","q":"송신 측의 ___ 는 여러 process 의 메시지를 받아들이고, 수신 측의 ___ 는 port 로 각 process 에 나눠 준다.","answer":["multiplexing","demultiplexing"],"bank":["multiplexing","demultiplexing","encapsulation","flooding","routing"],"explain":"p.14. 교수는 \"sender 가 multiplexing\" 을 짚었다 (1117 18:41).","src":"CH09 p.14 · 1117 녹음 18:41","prof":true,"wiki":"CH09 전송 계층과 UDP","introCard":0},{"id":"u10a-09","type":"match","q":"transport layer 의 packet 이름","pairs":[["UDP","user datagram"],["TCP","segment"],["IP","datagram"],["data link","frame"]],"explain":"교수: key difference 중 하나가 unit of data — UDP 는 user datagram, TCP 는 segment (1119 12:49).","src":"CH09 p.13,40 · 1119 녹음 12:49","prof":true,"wiki":"transport layer","introCard":2},{"id":"u10a-10","type":"sa","q":"IP address 와 port number 를 합친 것을 무엇이라 하나?","answer":"socket address","alts":["socket"],"explain":"Socket address = IP address + port number (p.12).","src":"CH09 p.12","diff":1,"wiki":"socket address","introCard":0},{"id":"u10a-11","type":"tf","q":"transport layer 는 network layer 의 host-to-host delivery 위에 만들어진다.","answer":true,"explain":"\"Builds on the network layer's host-to-host delivery\" (p.4).","src":"CH09 p.4","diff":1,"wiki":"transport layer","introCard":0},{"id":"u10a-12","type":"mc","q":"UDP 와 TCP 를 짧게 비교한 것으로 옳은 것은?","choices":["UDP: connection-oriented, reliable","UDP: connectionless, unreliable, simple / TCP: connection-oriented, reliable","둘 다 connectionless","TCP 는 port 를 안 쓴다"],"answer":1,"explain":"p.5. TCP 는 flow·error·congestion control 까지 한다.","src":"CH09 p.5","diff":1,"wiki":"UDP","introCard":2},{"id":"u10a-13","type":"num","q":"[Ex 변형] UDP header 가 0045 E7A1 0024 A3F0 (hex) 이다. data 는 몇 bytes?","answer":28,"unit":"bytes","tol":0,"explain":"total length = 0x0024 = 36 bytes (header 포함). data = 36 − 8 = **28 bytes**. p.36 예제와 같은 순서(src·dst·length·checksum 각 2 bytes)로 끊어 읽는다.","src":"CH09 p.34–36","wiki":"Example UDP header 읽기","tags":["Example UDP header 읽기"],"prof":true,"img":"img/cn10-gen-u10a-13.png","imgAlt":"UDP header 네 칸: 0045 | E7A1 | 0024 | A3F0","introCard":2},{"id":"u10a-14","type":"mc","q":"[Ex 변형] UDP header 0045 E7A1 0024 A3F0 (src 0x0045 = 69, dst 0xE7A1 = 59,297) 의 방향은?","choices":["client → server","server → client","알 수 없다","router → host"],"answer":1,"explain":"source port 69 가 well-known(0–1023), destination 59,297 은 dynamic(49,152–65,535, ephemeral) → **server → client** (응답). p.36 은 거꾸로 dst 가 13 이라 client → server 였다.","src":"CH09 p.9–11, 36","wiki":"port number 범위","tags":["port number 범위"],"prof":true,"img":"img/cn10-gen-u10a-13.png","imgAlt":"UDP header 네 칸: 0045 | E7A1 | 0024 | A3F0","introCard":1}],"intro":[{"title":"process-to-process delivery","body":"network layer 가 host 까지 데려다 주면 transport layer 가 그 host 의 올바른 **process** 에 넘긴다. IP address 가 host 를, **port number**(16 bits, 0–65,535)가 process 를 고른다. 둘을 합친 것이 socket address.","img":"img/cn9-p12-socket.png","imgAlt":"IP address 200.23.56.8 + port 69 = socket address","src":"CH09 p.4–12"},{"title":"port 범위와 client/server","body":"ICANN: 0–1023 well-known(server, 예 Daytime 13), 1024–49,151 registered, 49,152–65,535 dynamic/private. client 는 임시 **ephemeral** port(예 52000), server 는 well-known port. 요청 src 52000 → dst 13, 응답은 반대.","img":"img/cn9-p11-ports.png","imgAlt":"ICANN 의 세 port 범위","src":"CH09 p.9–11"},{"title":"mux/demux 와 UDP·TCP","body":"송신 측 multiplexing(여러 process → 하나), 수신 측 demultiplexing(port 로 나눠 줌). UDP = connectionless·unreliable·simple(단위 user datagram), TCP = connection-oriented·reliable(단위 segment).","src":"CH09 p.5, 13–14"}]},{"id":"u10b","title":"Error control · sliding window · 연결 방식","items":[{"id":"u10b-01","type":"order","q":"transport layer 의 error control 이 해야 할 일 세 가지를, 받은 packet 을 checksum 으로 검사하는 일부터 시작해 놓으시오","answer":["손상된 packet 을 검출하고 버린다","잃어버린 packet 을 찾아 다시 보낸다","중복을 버리고, 순서가 바뀐 packet 은 빠진 것이 올 때까지 buffer"],"explain":"p.16. 참여하는 것은 송·수신 transport layer 뿐.","src":"CH09 p.16","wiki":"transport layer","introCard":1},{"id":"u10b-02","type":"num","q":"sequence number 필드가 m = 3 bits 면 쓸 수 있는 가장 큰 번호는?","answer":7,"tol":0,"explain":"0 … 2^m − 1 = 0 … 7, 그 다음은 0 으로 wrap around (modulo 2^m).","src":"CH09 p.17","wiki":"sequence number","introCard":1},{"id":"u10b-03","type":"num","q":"m = 4 bits sequence number 로 쓸 수 있는 번호는 모두 몇 개?","answer":16,"unit":"개","tol":0,"explain":"2^4 = 16 (0–15). sliding window 를 원(circle)으로 그리는 이유.","src":"CH09 p.17,22","wiki":"sequence number","introCard":1},{"id":"u10b-04","type":"num","q":"m = 3 일 때 번호 6 다음으로 3 개를 더 보내면 마지막 번호는?","answer":1,"tol":0,"explain":"7, 0, 1 → **1** (modulo 8 wrap around).","src":"CH09 p.17","diff":3,"wiki":"CH09 전송 계층과 UDP","introCard":1},{"id":"u10b-05","type":"mc","q":"송신자가 packet 을 다시 보내는 기준은?","choices":["수신자가 NAK 을 보낼 때만","packet 마다 시작한 timer 가 ACK 전에 만료될 때","매 RTT 마다 무조건","라우터가 요청할 때"],"answer":1,"explain":"p.18–21: 수신자는 성한 packet 에 ACK, 손상 packet 은 그냥 버림. 송신자는 timer 만료 시 재전송.","src":"CH09 p.18–21","wiki":"CH09 TCP","introCard":2},{"id":"u10b-06","type":"tf","q":"수신자는 손상된(corrupted) packet 을 받으면 NAK 을 보낸다.","answer":false,"explain":"\"Corrupted packets are simply discarded\" — 그냥 버린다. 송신자의 timer 가 재전송을 이끈다.","src":"CH09 p.18","wiki":"CH09 TCP","introCard":1},{"id":"u10b-07","type":"cloze","q":"duplicate packet 은 ___ 되고, out-of-order packet 은 버려지거나 ___ 된다.","answer":["discard","저장"],"bank":["discard","저장","재전송","ACK","routing"],"explain":"p.21: Duplicates: discarded / Out-of-order: discarded or stored.","src":"CH09 p.21","diff":3,"wiki":"CH09 TCP","introCard":1},{"id":"u10b-08","type":"mc","q":"sliding window 의 뜻은?","choices":["수신 buffer 전체","송신자가 ACK 없이 보내 둘 수 있는(outstanding) sequence number 범위","TTL 범위","port 범위"],"answer":1,"explain":"보낸 packet 은 ACK 될 때까지 window 안에 머물고, ACK 가 오면 window 가 slide 한다 (p.22).","src":"CH09 p.22","wiki":"sequence number","introCard":2},{"id":"u10b-09","type":"tf","q":"sliding window 에서는 앞 packet 의 ACK 를 받기 전에도 window 안의 다음 packet 을 이어 보낼 수 있다.","answer":true,"explain":"\"the important point is that we didn't receive acknowledgement packets … We just send\" (1117 34:51).","src":"1117 녹음 34:51","prof":true,"wiki":"sliding window","introCard":2},{"id":"u10b-10","type":"match","q":"연결 방식","pairs":[["connectionless (UDP)","chunk 마다 독립, 순서가 바뀔 수 있음"],["connection-oriented (TCP)","먼저 logical connection 설정 → in order → tear down"],["congestion","load > capacity"],["congestion control","load 를 capacity 아래로 유지"]],"explain":"p.27–29: connectionless(UDP)는 chunk 마다 독립이라 순서가 바뀌어 도착할 수 있다. connection-oriented(TCP)는 먼저 logical connection 을 세우고 순서대로 넘긴 뒤 끊는다(p.29 의 Message 2 hold). 둘 다 IP 위에서 돌지만 연결 관리는 transport layer 가 한다.","src":"CH09 p.27–29","wiki":"UDP","introCard":3},{"id":"u10b-11","type":"mc","q":"network 에서 congestion 이 생기는 이유는?","choices":["port 가 부족해서","라우터·스위치에 queue(buffer)가 있어 load 가 capacity 를 넘으면 차기 때문","MTU 가 작아서","checksum 오류"],"answer":1,"explain":"queue full → long delay, dropped packets, 재전송이 상황을 악화 (CH07 (1) vicious cycle 과 같은 그림).","src":"CH09 p.27","wiki":"congestion control","tags":["congestion control"],"introCard":0},{"id":"u10b-12","type":"tf","q":"flow control 은 sending process ↔ sender TL, sender TL ↔ receiver TL 두 곳에서 buffer 로 구현된다.","answer":true,"explain":"p.15: buffer 가 차면 상대에게 멈추라고 알린다. 두 곳 모두 **push** 구간이다. receiving TL → receiving process 는 process 가 가져가는(pull) 구간이라 flow control 이 필요 없다 — 교수 11/24: \"Remember that flow control is needed between these, while not these\".","src":"CH09 p.15 · 🎙 11/24 44:04–46:24","wiki":"전송 계층 flow control","tags":["전송 계층 flow control"],"prof":true,"img":"img/cn9-p15-buffers.png","imgAlt":"p.15 Sender(Producer/Consumer)·Receiver buffer 그림 — Messages are pushed, Packets are pushed, Messages are pulled, 빨간 Flow control 화살표 두 개","introCard":0}],"intro":[{"title":"flow control: push 와 pull","body":"producer 가 consumer 보다 빨리 **push** 하면 buffer 가 넘친다 → 차면 \"멈춰\" 라고 알린다. sending process → sender TL, sender TL → receiver TL 두 곳(모두 push). receiver TL → process 는 process 가 가져가는(pull) 구간이라 필요 없다.","img":"img/cn9-p15-buffers.png","imgAlt":"Sender·Receiver buffer 와 Flow control","src":"CH09 p.15 · 1124 녹음 45:22"},{"title":"error control 과 sequence number","body":"손상 packet 검출·버림, 분실 packet 재전송, 중복 버림, 순서 바뀐 packet 은 빠진 것이 올 때까지 buffer — 송·수신 transport layer 만 참여. m-bit sequence number 는 0 ~ 2^m − 1 을 쓰고 다시 0 으로 wrap around(modulo 2^m).","img":"img/cn9-p17-seqno.png","imgAlt":"m = 3: 0 … 7 다음 0","src":"CH09 p.16–17"},{"title":"ACK·timer·sliding window","body":"수신자는 잘 온 packet 에 ACK(손상된 건 그냥 버림), 송신자는 timer 가 만료되면 재전송. **sliding window** = 송신자가 ACK 없이 outstanding 으로 둘 수 있는 번호 범위 — ACK 전에도 window 안은 계속 보낸다.","img":"img/cn9-p22-sliding.png","imgAlt":"m = 4 의 원형 sliding window","src":"CH09 p.18–26"},{"title":"connectionless vs connection-oriented, congestion","body":"connectionless(UDP)는 chunk 마다 독립이라 순서가 바뀔 수 있고, connection-oriented(TCP)는 연결 → 순서대로 → 해제. congestion = load 가 capacity 를 넘어 router·switch 의 queue 가 차는 것.","img":"img/cn9-p27-congestion.png","imgAlt":"router queue 가 차는 congestion","src":"CH09 p.27–29"}]},{"id":"u10c","title":"UDP","items":[{"id":"u10c-01","type":"cloze","q":"UDP = IP + ___ + a ___ — 그게 거의 전부다.","answer":["port numbers","checksum"],"bank":["port numbers","checksum","ACK","window","sequence number"],"explain":"p.33: \"UDP = IP + port numbers + a checksum. That's about it.\"","src":"CH09 p.33","wiki":"port number","introCard":0},{"id":"u10c-02","type":"num","q":"UDP header 는 몇 bytes 인가?","answer":8,"unit":"bytes","tol":0,"explain":"고정 8 bytes = 2-byte 필드 4 개 (source port, destination port, total length, checksum).","src":"CH09 p.34","diff":1,"wiki":"UDP header","introCard":0},{"id":"u10c-03","type":"order","q":"UDP header 필드 순서","answer":["Source port","Destination port","Total length","Checksum"],"explain":"p.34: 8-byte 고정 header = Source port · Destination port · Total length · Checksum, 각 16 bits. 그래서 hex 덤프를 4 자리씩 끊으면 이 순서대로 읽힌다(p.36 CB84 | 000D | 001C | 001C).","src":"CH09 p.34","img":"img/cn9-p34-udp.png","imgAlt":"p.34 UDP header format — 0·16·31 비트 눈금 아래 네 필드 ①~④ 이름이 가려져 있다","explainImg":"img/cn9-p34-udp-ans.png","wiki":"UDP header","introCard":0},{"id":"u10c-04","type":"num","q":"UDP header 가 CB84 000D 001C 001C (hex) 다. source port (10진)는?","answer":52100,"tol":0,"explain":"0xCB84 = 52,100 (ephemeral → client).","src":"CH09 p.36","prof":true,"img":"img/cn9-p36-udpsol.png","imgAlt":"p.36 UDP header CB84 | 000D | 001C | 001C 와 Solution a~f 의 답이 ? 로 가려져 있다","explainImg":"img/cn9-p36-udpsol-ans.png","wiki":"UDP header","introCard":0},{"id":"u10c-05","type":"num","q":"UDP header 가 CB84 000D 001C 001C (hex) 다. data 길이는 몇 bytes?","answer":20,"unit":"bytes","tol":0,"explain":"total length 0x001C = 28 − header 8 = **20 B**.","src":"CH09 p.36","prof":true,"img":"img/cn9-p36-udpsol.png","imgAlt":"p.36 UDP header 와 Solution a~f 의 답이 가려져 있다","explainImg":"img/cn9-p36-udpsol-ans.png","wiki":"UDP header","introCard":0},{"id":"u10c-06","type":"mc","q":"UDP header 가 CB84 000D 001C 001C (hex), dst port 0x000D = 13 이다. 방향과 process 는?","choices":["server → client, Echo","client → server, Daytime","server → client, Daytime","client → server, DNS"],"answer":1,"explain":"destination 이 well-known port 13 → client → server, port 13 = Daytime (p.36).","src":"CH09 p.36","prof":true,"wiki":"UDP header","img":"img/cn10-gen-u10c-06.png","imgAlt":"UDP header 네 칸: CB84 | 000D | 001C | 001C","introCard":0},{"id":"u10c-07","type":"num","q":"UDP header 의 destination port 가 0x0035 면 10진으로?","answer":53,"tol":0,"explain":"0x35 = 3 × 16 + 5 = **53** (well-known 범위).","src":"CH09 p.34–36","diff":3,"wiki":"UDP header","img":"img/cn10-gen-u10c-07.png","imgAlt":"UDP header 네 칸 중 destination port 0035","introCard":0},{"id":"u10c-08","type":"match","q":"UDP 가 제공하는가?","pairs":[["flow control","no (window 없음)"],["error control","optional checksum 만, ACK·재전송 없음"],["congestion control","none"],["multiplexing / demultiplexing","yes (port)"]],"explain":"p.37: UDP 는 window 가 없어 flow control ✗, checksum 은 있지만 ACK·재전송이 없어 error control 은 검출만, 연결 설정이 없어 congestion control ✗. \"UDP = IP + port numbers + a checksum\" 이 그대로 표가 된다.","src":"CH09 p.37","wiki":"UDP","introCard":2},{"id":"u10c-09","type":"tf","q":"UDP checksum 은 UDP header 와 data 만 덮는다.","answer":false,"explain":"checksum 은 **pseudoheader + UDP header + data**. pseudoheader = IP header 일부(주소, protocol, length).","src":"CH09 p.38","wiki":"pseudoheader","introCard":0},{"id":"u10c-10","type":"match","q":"UDP 의 대표 용도","pairs":[["simple request-response","DNS"],["real-time interactive","voice / video call"],["route update","RIP"],["management","SNMP"]],"explain":"p.39: 짧은 request-response(DNS)는 연결 설정이 오히려 부담, real-time(음성·영상)은 늦게 오는 재전송보다 손실이 낫다, RIP 같은 route update 는 주기적이라 하나쯤 잃어도 된다. 공통점: 신뢰성보다 단순함·지연이 중요.","src":"CH09 p.39","wiki":"RIP","tags":["RIP"],"introCard":2},{"id":"u10c-11","type":"mc","q":"real-time media 에 UDP 가 좋은 이유는?","choices":["재전송으로 신뢰성 보장","error control 이 없어 재전송을 기다리지 않는다","window 가 커서","connection setup 이 길어서"],"answer":1,"explain":"p.39: no error control → no waiting for a resent part. 교수: delay-sensitive 응용에 적합 (1119 13:10).","src":"CH09 p.39 · 1119 녹음 13:10","prof":true,"wiki":"UDP","introCard":0},{"id":"u10c-12","type":"num","q":"UDP total length 필드의 최대값(16 bits)은?","answer":65535,"unit":"bytes","tol":0,"explain":"2^16 − 1 = 65,535. 실제로는 한 IP datagram 에 들어가야 하므로 65,535 − IP header 이하 (p.34).","src":"CH09 p.34","diff":3,"wiki":"UDP","introCard":0},{"id":"u10c-13","type":"match","q":"UDP vs TCP","pairs":[["UDP header","8 bytes"],["TCP header","20–60 bytes"],["UDP 단위","user datagram (message)"],["TCP 단위","byte stream → segments"]],"explain":"p.40 비교표: UDP header 8 B 고정 vs TCP 20–60 B, 단위는 user datagram(message 경계 유지) vs segment(byte stream). TCP 는 연결·순서·재전송·flow·congestion control 을 위해 header 가 크다.","src":"CH09 p.40","prof":true,"wiki":"user datagram","introCard":0},{"id":"u10c-14","type":"cloze","q":"UDP 는 연결 면에서 ___ 하고, 신뢰성 면에서 ___ 한 transport protocol 이다.","answer":["connectionless","unreliable"],"bank":["connectionless","unreliable","connection-oriented","reliable","full-duplex"],"explain":"\"Connectionless, unreliable transport protocol\" (p.33). 나머지는 TCP 의 성질.","src":"CH09 p.33","wiki":"UDP","introCard":0}],"intro":[{"title":"UDP = IP + port numbers + checksum","body":"connectionless, unreliable, very simple. header **8 bytes** 고정: source port · destination port · total length(header + data) · checksum, 각 16 bits.","img":"img/cn9-p34-udp-ans.png","imgAlt":"UDP user datagram 과 header format","src":"CH09 p.33–34"},{"title":"UDP header 읽기","body":"4 hex 자리씩 끊는다: CB84 000D 001C 001C → src 0xCB84 = 52,100(ephemeral → client), dst 13(well-known Daytime → client → server), total 28 → data 28 − 8 = 20.","img":"img/cn9-p36-udpsol-ans.png","imgAlt":"UDP header 읽기 풀이","src":"CH09 p.35–36"},{"title":"UDP 의 서비스와 용도","body":"flow control ✗(window 없음), error control 은 checksum 검출만(ACK·재전송 ✗), congestion control ✗. checksum 은 pseudoheader(IP 주소 등)까지 덮는다. 용도: DNS 같은 짧은 request-response, real-time 음성·영상, RIP. UDP header 8 B vs TCP 20–60 B.","src":"CH09 p.37–40"}]},{"id":"u10d","title":"TCP 기초 — byte stream, seq·ack, header","items":[{"id":"u10d-01","type":"order","q":"TCP connection 의 세 phase","answer":["connection establishment","data transfer (both directions)","connection termination"],"explain":"p.42: connection establishment(three-way handshake) → data transfer(양방향, piggyback) → connection termination(FIN, half close 가능). UDP 에는 앞뒤 두 phase 가 없다.","src":"CH09 p.42","diff":1,"wiki":"TCP","introCard":0},{"id":"u10d-02","type":"tf","q":"TCP 의 sequence number 와 acknowledgment number 는 segment 개수를 센다.","answer":false,"explain":"**bytes** 를 센다 (p.47). 방향마다 따로, 시작은 0 ~ 2^32 − 1 사이 random.","src":"CH09 p.47","wiki":"acknowledgment number","introCard":1},{"id":"u10d-03","type":"num","q":"첫 byte 10,001, 1,000 B segment 5 개로 보낼 때 셋째 segment 의 sequence number 는?","answer":12001,"tol":0,"explain":"10,001 → 11,001 → **12,001** → 13,001 → 14,001 (p.48–49).","src":"CH09 p.49","prof":true,"img":"img/cn9-p49-seq.png","imgAlt":"p.49 다섯 segment 의 Sequence Number·Range 표 — Segment 3·5 의 값이 ? 로 가려져 있다","explainImg":"img/cn9-p49-seq-ans.png","wiki":"sequence number","introCard":1},{"id":"u10d-04","type":"num","q":"첫 byte 번호 10,001, 1,000 B segment 5 개로 보낼 때 다섯째 segment 의 sequence number 는?","answer":14001,"tol":0,"explain":"10,001 + 4 × 1,000 = **14,001**.","src":"CH09 p.49","prof":true,"img":"img/cn9-p49-seq.png","imgAlt":"p.49 다섯 segment 표 — Segment 3·5 의 값이 가려져 있다","explainImg":"img/cn9-p49-seq-ans.png","wiki":"sequence number","introCard":1},{"id":"u10d-05","type":"num","q":"첫 byte 번호 10,001, 1,000 B segment 5 개로 보낼 때 다섯째 segment 의 마지막 byte 번호는?","answer":15000,"tol":0,"explain":"14,001 + 1,000 − 1 = **15,000** (= 10,001 + 5,000 − 1).","src":"CH09 p.49","diff":3,"wiki":"segment","img":"img/cn10-gen-u10d-05.png","imgAlt":"1,000 B segment 5 개, 첫 byte 10,001","introCard":1},{"id":"u10d-06","type":"num","q":"수신자가 byte 5,642 까지 다 받았다. 보내는 ACK number 는?","answer":5643,"tol":0,"explain":"ACK number = 다음에 기대하는 byte = **5,643** (cumulative, p.50).","src":"CH09 p.50","prof":true,"img":"img/cn9-p50-ack.png","imgAlt":"p.50 received: bytes … 5640, 5641, 5642 다음 칸(next expected)과 ACK number 가 ? 로 가려져 있다","explainImg":"img/cn9-p50-ack-ans.png","wiki":"CH09 TCP","introCard":2},{"id":"u10d-07","type":"cloze","q":"ACK number 는 다음에 ___ byte 번호이고 ___ 이다 (그 앞은 모두 받음).","answer":["기대하는","cumulative"],"bank":["기대하는","cumulative","받은","selective","random"],"explain":"p.50. SACK 은 option 으로 덧붙는 보충 정보.","src":"CH09 p.50","wiki":"CH09 TCP","introCard":2},{"id":"u10d-08","type":"num","q":"TCP HLEN 필드가 8 이면 header 는 몇 bytes?","answer":32,"unit":"bytes","tol":0,"explain":"HLEN 은 4-byte word 단위 → 8 × 4 = **32 B** (options 12 B). 범위 5–15 → 20–60 B. IPv4 HLEN 과 같은 단위.","src":"CH09 p.52","wiki":"HLEN","tags":["HLEN"],"img":"img/cn9-p51-tcphdr-ans.png","imgAlt":"TCP header format: ports, sequence number, acknowledgment number, HLEN·reserved·flags·window size, checksum·urgent pointer","introCard":3},{"id":"u10d-09","type":"match","q":"TCP control flag","pairs":[["SYN","sequence number 동기화 (연결 설정)"],["ACK","ack number 가 유효"],["FIN","연결 종료"],["RST","연결 reset (abort)"],["URG","urgent pointer 가 유효"]],"explain":"6 개 1-bit flag: URG ACK PSH RST SYN FIN (p.53).","src":"CH09 p.53","img":"img/cn9-p53-flags.png","imgAlt":"p.53 URG·ACK·PSH·RST·SYN·FIN 여섯 flag 와 그 설명 열이 ? 로 가려진 표","explainImg":"img/cn9-p53-flags-ans.png","wiki":"sequence number","introCard":3},{"id":"u10d-10","type":"mc","q":"TCP header 의 window size 필드(16 bits)가 알리는 것은?","choices":["congestion window","receive window (rwnd), bytes 단위, 최대 65,535","segment 개수","TTL"],"answer":1,"explain":"p.54. checksum 은 UDP 와 같은 방식(pseudoheader 포함).","src":"CH09 p.54","wiki":"pseudoheader","introCard":3},{"id":"u10d-11","type":"tf","q":"TCP 는 full-duplex 라 양방향 데이터가 동시에 흐르고, 양 끝에 send·receive buffer 가 있다.","answer":true,"explain":"p.46: full-duplex = 양방향 동시. 그래서 방향마다 send buffer 와 receive buffer 가 있고, window 도 방향마다 send·receive 두 개씩 모두 4 개다 (p.62, 교수 11/24 28:18).","src":"CH09 p.46","diff":1,"wiki":"TCP","introCard":0},{"id":"u10d-12","type":"mc","q":"TCP 가 byte stream 을 segment 로 묶는 이유는?","choices":["IP 는 byte stream 이 아니라 packet 을 보내므로","UDP 와 호환","port 가 없어서","MTU 가 없어서"],"answer":0,"explain":"\"IP sends packets, not a byte stream\" (p.45). segment 크기는 서로 다를 수 있다.","src":"CH09 p.45","wiki":"segment","introCard":0},{"id":"u10d-13","type":"sa","q":"TCP 의 첫 segment 에 붙는 random sequence number 의 이름은? (약어)","answer":"ISN","alts":["initial sequence number"],"explain":"ISN = Initial Sequence Number (p.48).","src":"CH09 p.48","diff":1,"wiki":"sequence number","introCard":1},{"id":"u10d-14","type":"cloze","q":"segment 의 sequence number 는 그 segment 의 ___ byte 번호이고, 다음 segment 는 이전 seq + 이전 segment 가 실은 ___ 수다.","answer":["첫","byte"],"bank":["첫","byte","마지막","segment","packet"],"explain":"p.48: seq = number of its first byte, next = previous seq + bytes carried.","src":"CH09 p.48","wiki":"sequence number","introCard":1},{"id":"u10d-15","type":"match","q":"그림은 TCP header 다. 가린 필드 ①~⑤ 를 연결하시오","pairs":[["① (32 bits)","Sequence number"],["② (32 bits)","Acknowledgment number"],["③ (4 bits)","HLEN"],["④ (16 bits)","Window size"],["⑤ (16 bits)","Urgent pointer"]],"explain":"행 순서: ports(16+16) → sequence number 32 → acknowledgment number 32 → HLEN 4 · Reserved 6 · flags 6 · window size 16 → checksum 16 · urgent pointer 16 → options. 기본 20 bytes, 최대 60 bytes.","src":"CH09 p.51–54","wiki":"TCP segment format","tags":["TCP segment format"],"img":"img/cn9-p51-tcphdr.png","imgAlt":"p.51 TCP header — Source/Destination port 아래 필드 이름 ①~⑤ 가 가려져 있다 (비트 수는 보인다)","explainImg":"img/cn9-p51-tcphdr-ans.png","introCard":3},{"id":"u10d-16","type":"num","q":"[변형] 3,000-byte file 을 첫 byte 번호 2,001 로, 1,000 bytes 씩 segment 3 개로 보낸다. 셋째 segment 의 sequence number 는?","answer":4001,"tol":0,"explain":"seq = 그 segment 의 첫 byte: 2,001 → 3,001 → **4,001**. 셋째 segment 는 4,001–5,000 을 싣는다.","src":"CH09 p.48–49","wiki":"TCP sequence number와 ISN","tags":["TCP sequence number와 ISN"],"prof":true,"img":"img/cn10-gen-u10d-16.png","imgAlt":"1,000 B segment 3 개, 첫 byte 2,001","introCard":1},{"id":"u10d-17","type":"num","q":"[변형] 3,000-byte file (첫 byte 2,001) 을 1,000 B segment 3 개로 보냈고 수신자가 모두 받았다. 보내는 ACK number 는?","answer":5001,"tol":0,"explain":"마지막 byte 5,000 까지 받았으니 다음에 기대하는 byte = **5,001** (cumulative).","src":"CH09 p.50","wiki":"acknowledgment number","tags":["acknowledgment number"],"prof":true,"img":"img/cn10-gen-u10d-16.png","imgAlt":"1,000 B segment 3 개, 첫 byte 2,001","introCard":1}],"intro":[{"title":"TCP 서비스","body":"full-duplex(양방향, 끝마다 send·receive buffer), connection-oriented(연결 → 전송 → 종료), reliable(ACK), byte stream 을 segment 로 묶어 보낸다.","src":"CH09 p.42–46"},{"title":"sequence number 는 byte 를 센다","body":"segment 의 seq = 그 segment 의 **첫 byte** 번호. 첫 segment 는 random ISN. 다음 seq = 이전 seq + 이전 byte 수. 예: 첫 byte 10,001, 1,000 B × 5 → 10,001, 11,001, 12,001, 13,001, 14,001.","img":"img/cn9-p49-seq-ans.png","imgAlt":"다섯 segment 의 sequence number 와 range","src":"CH09 p.47–49"},{"title":"ACK number (cumulative)","body":"ACK number = **다음에 기대하는 byte** 번호 = 받은 마지막 byte + 1, 그 앞은 모두 받았다는 뜻(cumulative). 5,642 까지 받음 → ACK 5,643.","img":"img/cn9-p50-ack-ans.png","imgAlt":"received … 5642 → ACK 5643","src":"CH09 p.50"},{"title":"TCP header","body":"기본 20 B(최대 60): ports 16+16 / sequence 32 / acknowledgment 32 / HLEN 4(4-byte 단위) · reserved 6 · flags 6(URG ACK PSH RST SYN FIN) · window size 16(rwnd, bytes) / checksum 16 · urgent pointer 16 / options.","img":"img/cn9-p51-tcphdr-ans.png","imgAlt":"TCP segment format","src":"CH09 p.51–54"}]},{"id":"u10e","title":"TCP 연결 · flow · error · congestion","items":[{"id":"u10e-01","type":"order","q":"three-way handshake","answer":["client: SYN (seq = 8000)","server: SYN + ACK (seq = 15000, ack = 8001)","client: ACK (seq = 8001, ack = 15001)"],"explain":"SYN 과 SYN+ACK 은 seq 번호 1 개씩 소비, 마지막 ACK 은 소비하지 않는다 (p.56). 교수: \"this is very important\" — SYN = synchronization, 방향마다 번호를 따로 맞춘다(full-duplex).","src":"CH09 p.56 · 🎙 11/24 10:04","prof":true,"img":"img/cn9-p56-handshake.png","imgAlt":"p.56 Client–Server 시퀀스 — ① SYN (seq = 8000), ② SYN + ACK (seq = 15000, ?), ③ ACK (seq ?) 로 일부가 가려져 있다","explainImg":"img/cn9-p56-handshake-ans.png","wiki":"three-way handshake","introCard":0},{"id":"u10e-02","type":"num","q":"client SYN 의 seq 가 8000 이면 server SYN+ACK 의 ack number 는?","answer":8001,"tol":0,"explain":"SYN 이 seq 1 개를 쓰므로 8000 + 1 = **8001**. 마지막 ACK 는 번호를 안 써서 client 의 첫 data 도 seq 8001 로 시작한다.","src":"CH09 p.56 · 🎙 11/24 10:04","prof":true,"diff":3,"img":"img/cn9-p56-handshake.png","imgAlt":"p.56 three-way handshake 시퀀스 — ② 의 ack 와 ③ 의 값이 ? 로 가려져 있다","explainImg":"img/cn9-p56-handshake-ans.png","wiki":"CH09 TCP","introCard":0},{"id":"u10e-03","type":"tf","q":"server 는 passive open, client 는 active open 을 한다.","answer":true,"explain":"server 는 받을 준비(passive), client 가 연결을 원함(active) (p.56). 교수: passive open 이 먼저 — 준비된 server 만 응답할 수 있다 (11:00).","src":"CH09 p.56 · 🎙 11/24 11:00","prof":true,"diff":1,"wiki":"CH09 전송 계층과 UDP","introCard":0},{"id":"u10e-04","type":"mc","q":"SYN flooding attack 의 결과는?","choices":["server 가 half-open 연결로 자원을 다 써서 진짜 client 를 거부 (DoS)","client 의 port 가 고갈","라우터가 drop","checksum 실패"],"answer":0,"explain":"가짜 source IP 로 SYN 을 대량 전송 → server 가 TCB·timer 를 할당한 채 SYN+ACK 의 답을 기다림(half-open) → table full → 진짜 client 거절 (p.58). 교수: three-way handshake 의 **crucial drawback**, denial-of-service 의 한 예.","src":"CH09 p.58 · 🎙 11/24 14:58–17:30","prof":true,"img":"img/cn9-p58-synflood.png","imgAlt":"p.58 Attacker 가 SYN × many 를 Server 로 보내고 Real client 는 refused — Server 안 칸들의 이름이 ? 로 가려져 있다","explainImg":"img/cn9-p58-synflood-ans.png","wiki":"SYN flooding attack","introCard":1},{"id":"u10e-05","type":"cloze","q":"실제 send window 크기 = min(수신자가 알린 ___, 망 상태를 반영한 ___) 이다.","answer":["rwnd","cwnd"],"bank":["rwnd","cwnd","ssthresh","MSS","RTO"],"explain":"rwnd = 수신자(flow), cwnd = 망(congestion) (p.78).","src":"CH09 p.78","wiki":"congestion control","tags":["congestion control"],"introCard":2},{"id":"u10e-06","type":"num","q":"rwnd = 3000 B, cwnd = 2000 B 면 실제 window 는?","answer":2000,"unit":"bytes","tol":0,"explain":"min(3000, 2000) = **2000** — 이번엔 망 쪽(cwnd)이 제한.","src":"CH09 p.78","wiki":"cwnd","introCard":2},{"id":"u10e-07","type":"num","q":"수신 buffer 4000 B 중 아직 process 가 가져가지 않은 byte 가 1500 이면 rwnd 는?","answer":2500,"unit":"bytes","tol":0,"explain":"rwnd = buffer size − bytes waiting to be pulled = 4000 − 1500 = **2500** (p.65).","src":"CH09 p.65","wiki":"flow control","tags":["flow control"],"introCard":2},{"id":"u10e-08","type":"mc","q":"receiver 가 rwnd = 0 을 보낸 뒤 deadlock 을 막는 방법은?","choices":["sender 가 영원히 기다림","sender 가 1-byte probe segment 를 보냄","RST 전송","window 를 음수로"],"answer":1,"explain":"window shutdown → probing (p.70). 새 광고가 잃어버려졌을 때를 대비.","src":"CH09 p.70","wiki":"segment","introCard":2},{"id":"u10e-09","type":"num","q":"silly window: 1 byte data 를 IP header 20 B + TCP header 20 B 로 보내면 overhead 비율은 약 몇 %? (소수 첫째 자리)","answer":97.6,"unit":"%","tol":0.01,"explain":"40 / 41 ≈ **97.6 %** (슬라이드 \"97% overhead\"). 41-byte datagram 에 data 는 1 byte 뿐.","src":"CH09 p.71","wiki":"TCP","introCard":2},{"id":"u10e-10","type":"match","q":"silly window syndrome 대책","pairs":[["sender 가 원인","Nagle's algorithm"],["receiver 가 원인","Clark's solution (full segment 나 buffer 절반이 빌 때까지 rwnd = 0)"],["다른 receiver 대책","ACK 지연"],["silly window syndrome","아주 작은 segment 가 오가는 문제"]],"explain":"p.71: sender 가 1 byte 씩 만들어 보내면 Nagle — 첫 조각은 보내고, 다음은 ACK 가 오거나 full segment 가 될 때까지 모은다. receiver 가 1 byte 씩 소비하면 Clark — full segment 나 buffer 절반이 빌 때까지 rwnd = 0, 또는 ACK 를 늦춘다(delayed ACK). 1 B data 에 header 40 B 면 overhead 97 %.","src":"CH09 p.71","wiki":"silly window syndrome","introCard":2},{"id":"u10e-11","type":"mc","q":"fast retransmission 이 일어나는 조건은?","choices":["time-out","three duplicate ACKs (원래 ACK + 같은 것 3 개)","rwnd = 0","FIN 수신"],"answer":1,"explain":"duplicate ACK 는 뒤의 segment 는 도착했고 하나만 빠졌다는 신호 → time-out 을 기다리지 않고 바로 재전송 (p.74, 77).","src":"CH09 p.74","wiki":"segment","introCard":3},{"id":"u10e-12","type":"match","q":"Tahoe vs Reno 반응","pairs":[["time-out (Tahoe·Reno)","ssthresh = cwnd/2, cwnd = 1 → slow start"],["3 dup ACKs (Tahoe)","time-out 과 같음"],["3 dup ACKs (Reno)","ssthresh = cwnd/2, cwnd = ssthresh + 3 → fast recovery"],["fast recovery 중 duplicate ACK 마다","cwnd = cwnd + 1"]],"explain":"p.81: time-out 은 둘 다 강한 신호 → ssthresh = cwnd/2, cwnd = 1 MSS 로 slow start. 3 duplicate ACKs 는 Tahoe 는 time-out 과 똑같이, Reno 는 약한 신호로 보고 cwnd = ssthresh + 3 으로 fast recovery. 차이는 3 dup ACKs 쪽뿐이다.","src":"CH09 p.81","wiki":"fast recovery","introCard":4},{"id":"u10e-13","type":"num","q":"Reno: cwnd = 16 MSS 에서 3 duplicate ACKs 를 받으면 새 cwnd 는? (MSS)","answer":11,"unit":"MSS","tol":0,"explain":"ssthresh = 16/2 = 8, cwnd = 8 + 3 = **11** → fast recovery.","src":"CH09 p.81","diff":3,"wiki":"fast recovery","introCard":4},{"id":"u10e-14","type":"num","q":"slow start 에서 cwnd = 1 MSS 로 시작하면 3 RTT 뒤 cwnd 는? (ssthresh 미도달)","answer":8,"unit":"MSS","tol":0,"explain":"매 RTT 2 배: 1 → 2 → 4 → **8** (exponential). ssthresh 에 닿으면 congestion avoidance(+1 MSS/RTT).","src":"CH09 p.79–80","wiki":"congestion avoidance","introCard":4},{"id":"u10e-15","type":"tf","q":"TCP 는 time-out 을 three duplicate ACKs 보다 더 강한 congestion 신호로 본다.","answer":true,"explain":"time-out = strong sign (segment 들이 사라짐), 3 dup ACKs = lighter sign (p.78).","src":"CH09 p.78","wiki":"segment","introCard":4}],"intro":[{"title":"three-way handshake","body":"server 가 passive open 해 두면 client 가 active open: ① SYN(seq 8000, 번호 1 개 씀) ② SYN + ACK(seq 15000, ack 8001, 번호 1 개) ③ ACK(seq 8001, ack 15001, 번호 안 씀). 교수: \"very important\".","img":"img/cn9-p56-handshake-ans.png","imgAlt":"Client–Server 의 ① SYN ② SYN+ACK ③ ACK","src":"CH09 p.56–57 · 1124 녹음 10:04"},{"title":"SYN flooding","body":"가짜 source IP 로 SYN 을 대량 → server 가 TCB·timer 를 할당한 채 답 없는 half-open 으로 기다림 → table full → 진짜 client 거절(DoS). handshake 의 crucial drawback.","img":"img/cn9-p58-synflood-ans.png","imgAlt":"Attacker 의 SYN × many 와 half-open 칸","src":"CH09 p.58"},{"title":"rwnd · cwnd · silly window","body":"실제 send window = min(rwnd, cwnd). rwnd = buffer − 아직 안 가져간 byte. rwnd = 0 이면 1-byte probe 로 deadlock 방지. 1 byte 씩 보내면 header 40 B 라 overhead 97 % → Nagle(sender), Clark·delayed ACK(receiver).","img":"img/cn9-p71-silly.png","imgAlt":"Silly window syndrome 과 97% overhead","src":"CH09 p.65–71"},{"title":"fast retransmission","body":"재전송 계기 둘: time-out, 또는 **three duplicate ACKs**(같은 ACK 가 세 번 더) → timer 를 기다리지 않고 바로 재전송.","img":"img/cn9-p77-fastrx.png","imgAlt":"세 번째 duplicate ACK 뒤 fast retransmission","src":"CH09 p.74–77"},{"title":"congestion control","body":"slow start: cwnd = 1 MSS 에서 RTT 마다 2 배 → ssthresh 에서 congestion avoidance(+1 MSS/RTT). time-out(강한 신호): ssthresh = cwnd/2, cwnd = 1. 3 dup ACKs: Tahoe 는 time-out 과 같게, Reno 는 cwnd = ssthresh + 3 으로 fast recovery.","img":"img/cn9-p79-slowstart.png","imgAlt":"slow start: cwnd 1 → 2 → 4 → 8","src":"CH09 p.78–81"}]},{"id":"u10f","title":"연결 관리 · window · flow control (11/24 수업)","items":[{"id":"u10f-01","type":"mc","q":"그림의 TCP data transfer 에서 server 가 data(15001–17000)를 보내는 segment 에 ack 10001 을 함께 실었다. 이것을 무엇이라 하나?","choices":["piggybacking","half close","fast retransmission","probing"],"answer":0,"explain":"\"an ACK can **piggyback** on a data segment going the same way\" (p.59). 따로 ACK segment 를 보내지 않고 같은 방향 data 에 얹어 보낸다. 교수 11/24 18:35.","src":"CH09 p.59 · 🎙 11/24 18:35","wiki":"CH09 TCP","tags":["CH09 TCP"],"prof":true,"img":"img/cn9-p59-data.png","imgAlt":"p.59 Data transfer 시퀀스 — Connection Establishment 와 Termination 사이 client·server segment 네 개 (seq·ack·rwnd 표시)","introCard":0},{"id":"u10f-02","type":"cloze","q":"그림은 TCP 연결 종료다. client FIN (seq x, ack y) → server FIN + ACK (seq y, ack ___) → client ACK (seq x + 1, ack ___).","answer":["x + 1","y + 1"],"bank":["x + 1","y + 1","x","y","y + 2"],"explain":"FIN 은 data 가 없어도 **번호 1 개**를 쓴다 → 상대는 x + 1 로 확인. server 의 FIN 도 1 개 → client 는 y + 1 로 확인. 마지막 ACK 는 번호를 안 쓰고 seq x + 1. 교수 11/24 19:49.","src":"CH09 p.60–61 · 🎙 11/24 19:49","wiki":"connection termination과 half close","tags":["connection termination과 half close"],"prof":true,"img":"img/cn9-p61-fin.png","imgAlt":"p.61 종료 three-way handshake — FIN(seq x, ack y), FIN + ACK(seq y, ack ?), ACK(?) 로 가려져 있다","explainImg":"img/cn9-p61-fin-ans.png","introCard":1},{"id":"u10f-03","type":"num","q":"[변형] TCP client 가 보낸 마지막 data byte 번호가 2,000 이고 FIN 에 data 가 없다. server 의 FIN + ACK 에 적힐 ack number 는?","answer":2002,"tol":0,"explain":"FIN 의 seq = 다음 번호 2,001. FIN 이 번호 1 개를 쓰므로 ack = 2,001 + 1 = **2,002**. \"FIN 은 data 가 없으니 번호를 안 쓴다\" 고 생각하면 2,001 (오답).","src":"CH09 p.60 · 🎙 11/24 19:49","wiki":"connection termination과 half close","tags":["connection termination과 half close"],"prof":true,"diff":3,"introCard":1},{"id":"u10f-04","type":"mc","q":"half close 의 예인 정렬(sorting) 서비스(client 가 data 를 보내면 server 가 정렬해 돌려줌)에서 일어나는 일은?","choices":["server 가 먼저 FIN 을 보낸다","client 가 data 를 다 보내고 FIN → server 는 ACK 만 보내고 정렬 결과를 계속 보낸 뒤 자기 FIN","양쪽이 동시에 RST 를 보낸다","client 가 FIN 뒤에도 data 를 계속 보낸다"],"answer":1,"explain":"half close = 한쪽만 보내기를 멈추고 받기는 계속. 정렬은 data 를 다 받아야 시작할 수 있으니 client 가 먼저 FIN(보내기 끝), server 는 ACK 로 그 방향만 닫고 결과를 보낸 뒤 자기 FIN. 교수 11/24 24:19.","src":"CH09 p.60 · 🎙 11/24 19:49–28:18","wiki":"connection termination과 half close","tags":["connection termination과 half close"],"prof":true,"introCard":1},{"id":"u10f-05","type":"num","q":"양방향(two-way) TCP 연결 하나에는 window 가 모두 몇 개인가?","answer":4,"unit":"개","tol":0,"explain":"\"TCP keeps two windows per direction (send + receive)\" → 방향 2 × window 2 = **4**. 교수 11/24 28:18.","src":"CH09 p.62 · 🎙 11/24 28:18","wiki":"send window","tags":["send window"],"prof":true,"introCard":2},{"id":"u10f-06","type":"mc","q":"TCP 의 retransmission timer 는 몇 개를 쓰나?","choices":["segment 마다 하나","message 마다 하나","connection 마다 하나","byte 마다 하나"],"answer":2,"explain":"\"TCP uses **one** retransmission timer per connection\" (p.63). 교수: \"per connection, not per message or not per packet\" (11/24 37:49–38:30). p.62 그림의 Timer 하나.","src":"CH09 p.63 · 🎙 11/24 37:49","wiki":"ACK와 retransmission timer","tags":["ACK와 retransmission timer"],"prof":true,"img":"img/cn9-p62-sendwin.png","imgAlt":"p.62 send window 그림 — 200 까지 acked, 201–260 outstanding(Sf), 261–300 usable(Sn), 오른쪽 위 Timer 하나, 아래 Left wall·Right wall 의 Closes·Shrinks·Opens","introCard":2},{"id":"u10f-07","type":"tf","q":"[O/X] Flow control is needed where data is pushed (sending process → sender TL, sender TL → receiver TL), but not where the receiving process pulls data from its TL. (If X, correct it.)","answer":true,"explain":"O. push 하는 쪽은 받는 쪽 buffer 를 넘칠 수 있으니 feedback(①②→⑤④)이 필요하다. pull 은 받는 쪽이 자기 속도로 가져가니 필요 없다. 교수 11/24: \"Remember that flow control is needed between these, while not these\" (45:22).","src":"CH09 p.66 · 🎙 11/24 44:04–46:24","wiki":"전송 계층 flow control","tags":["전송 계층 flow control"],"prof":true,"img":"img/cn9-p66-pushpull.png","imgAlt":"p.66 Producer/Consumer 그림 — Messages are pushed(1), Segments are pushed(2), Messages are pulled(3), Flow control feedback(4, 5)","introCard":4},{"id":"u10f-08","type":"match","q":"그림의 window 처럼, TCP window 의 열림·닫힘 네 사건을 연결하시오","pairs":[["receive window 닫힘 (왼벽 →)","수신 측에 byte 가 도착할 때"],["receive window 열림 (오른벽 →)","process 가 byte 를 가져갈(pull) 때"],["send window 닫힘 (왼벽 →)","새 ACK 가 도착할 때"],["send window 열림 (오른벽 →)","광고된 rwnd 가 허락할 때"]],"explain":"closes = left wall 이 오른쪽으로, opens = right wall 이 오른쪽으로. receive window 는 도착(close)·소비(open), send window 는 ACK(close)·rwnd(open). 교수 11/24 46:24–50:15.","src":"CH09 p.67 · 🎙 11/24 46:24–50:15","wiki":"receive window와 rwnd","tags":["receive window와 rwnd"],"prof":true,"img":"img/cn9-p67-openclose.png","imgAlt":"p.67 window 그림 — 왼쪽 빨간 화살표와 오른쪽 파란 화살표의 이름이 ? 로 가려져 있다","explainImg":"img/cn9-p67-openclose-ans.png","introCard":3},{"id":"u10f-09","type":"num","q":"TCP receiver 의 buffer 는 800 B 다. SYN+ACK 로 rwnd 800 을 알린 뒤 200 B 를 받고(아직 안 가져감), 다시 300 B 를 받으면서 process 가 100 B 를 가져갔다. 이때 알리는 rwnd 는?","answer":400,"unit":"B","tol":0,"explain":"rwnd = buffer − 아직 안 가져간 byte = 800 − (200 + 300 − 100) = **400** (p.68 ⑦ ACK 601, rwnd 400). 오른쪽 벽 = ackNo + rwnd = 601 + 400 = 1,001.","src":"CH09 p.65, 68 · 🎙 11/24 54:53","wiki":"receive window와 rwnd","tags":["receive window와 rwnd"],"prof":true,"introCard":4},{"id":"u10f-10","type":"mc","q":"그림처럼 TCP 가 rwnd 를 주고받으며 window 를 여닫는 flow control 의 key point 는?","choices":["window size 는 sender 와 receiver 사이에 synchronize 되어야 한다","rwnd 는 항상 buffer 크기와 같다","sender 가 rwnd 를 정한다","window 는 segment 개수로 센다"],"answer":0,"explain":"\"the key point is that window sizes should be **synchronized** between sender and receiver\" (11/24 54:53, 56:15). receiver 가 ACK 마다 rwnd 를 알리면 sender 가 그에 맞춰 send window 를 연다·닫는다. window 는 byte 단위.","src":"CH09 p.68 · 🎙 11/24 54:53","wiki":"receive window와 rwnd","tags":["receive window와 rwnd"],"prof":true,"img":"img/cn9-p68-flowex.png","imgAlt":"p.68 flow control example — client(왼쪽)·server(오른쪽) 노란 칸에 ①~⑧ segment 와 window 변화","introCard":4}],"intro":[{"title":"data transfer 와 piggyback","body":"양방향으로 data 가 흐르고, ACK 는 같은 방향 data segment 에 얹어(**piggyback**) 보낸다. 예: server 가 data 15001–17000 을 보내며 ack 10001 을 함께 싣는다.","img":"img/cn9-p59-data.png","imgAlt":"Data transfer: segment 의 seq·ack·rwnd","src":"CH09 p.59 · 1124 녹음 18:35"},{"title":"연결 종료와 half close","body":"FIN(seq x) → FIN + ACK(seq y, ack x + 1) → ACK(seq x + 1, ack y + 1). FIN 은 data 가 없어도 **번호 1 개**를 쓴다. half close: 한쪽만 보내기를 멈추고 받기는 계속(정렬 서비스: client FIN 뒤에도 server 는 결과를 보낸다). RST = abort.","img":"img/cn9-p61-fin-ans.png","imgAlt":"종료 three-way handshake 의 seq·ack","src":"CH09 p.60–61 · 1124 녹음 19:49–28:18"},{"title":"window: 방향마다 둘, timer 는 연결당 하나","body":"방향마다 send + receive window → 양방향 연결에 **4 개**. window 는 byte 단위. send window: acked | outstanding(Sf~) | usable(Sn~) | 아직 못 보냄. retransmission timer 는 segment 마다가 아니라 **connection 마다 하나**.","img":"img/cn9-p62-sendwin.png","imgAlt":"send window 와 Timer, closes / shrinks / opens","src":"CH09 p.62–63 · 1124 녹음 28:18, 37:49"},{"title":"window 의 열림·닫힘","body":"closes = 왼벽이 오른쪽으로, opens = 오른벽이 오른쪽으로. receive window: byte 도착 시 close, process 가 가져가면 open. send window: 새 ACK 로 close, 광고된 rwnd 가 허락하면 open.","img":"img/cn9-p67-openclose-ans.png","imgAlt":"window 의 closes / opens","src":"CH09 p.64–67 · 1124 녹음 46:24–50:15"},{"title":"flow control 예와 synchronize","body":"rwnd = buffer − 안 가져간 byte. buffer 800: 200 받음 → rwnd 600, 300 더 받고 100 소비 → 400, 200 더 소비 → 600. 오른벽 = ackNo + rwnd. 핵심: window size 는 sender 와 receiver 사이에 **synchronize** 된다. flow control 은 push 구간에만.","img":"img/cn9-p68-flowex.png","imgAlt":"flow control example ①~⑧","src":"CH09 p.65–68 · 1124 녹음 54:53"}]},{"id":"u10g","title":"PS2 유형 연습 — UDP · TCP 번호 · window · cwnd","items":[{"id":"u10g-01","type":"num","q":"UDP header 0050 C8A4 0040 0000 의 destination port 는? (10진)","answer":51364,"tol":0,"explain":"0xC8A4 = 12·4096 + 8·256 + 10·16 + 4 = **51364** → dynamic/private(49,152–65,535).","src":"PS2 유형 · 11/24 과제","wiki":"Example UDP header 읽기","tags":["Example UDP header 읽기"],"prof":true,"img":"img/cn10-ps2-udp.png","imgAlt":"UDP header 네 칸: 0050 | C8A4 | 0040 | 0000","introCard":0},{"id":"u10g-02","type":"num","q":"같은 header 의 data 길이는? (bytes)","answer":56,"unit":"B","tol":0,"explain":"total 0x0040 = 64 → 64 − 8 = **56**. checksum 0000 은 계산하지 않았다는 뜻(optional).","src":"PS2 유형 · 11/24 과제","wiki":"UDP header","tags":["UDP header"],"prof":true,"img":"img/cn10-ps2-udp.png","imgAlt":"UDP header 네 칸 (위와 같음)","introCard":0},{"id":"u10g-03","type":"mc","q":"같은 header 의 방향은?","choices":["client → server","server → client","알 수 없다","server → server"],"answer":1,"explain":"source 0x0050 = 80 은 well-known(HTTP), destination 51364 는 ephemeral → **server → client**.","src":"PS2 유형 · 11/24 과제","wiki":"ephemeral port와 well-known port","tags":["ephemeral port와 well-known port"],"prof":true,"img":"img/cn10-ps2-udp.png","imgAlt":"UDP header 네 칸 (위와 같음)","introCard":0},{"id":"u10g-04","type":"num","q":"client ISN 3,500, server ISN 21,000. handshake 셋째 segment(ACK)의 ack number 는?","answer":21001,"tol":0,"explain":"① SYN seq 3,500 ② SYN+ACK seq 21,000 ack 3,501 ③ ACK seq 3,501 ack **21,001**. SYN 이 번호 1 개를 썼다.","src":"PS2 유형 · 11/24 과제","wiki":"three-way handshake","tags":["three-way handshake"],"prof":true,"introCard":0},{"id":"u10g-05","type":"num","q":"이어서 client 가 1,200 · 800 · 2,000 bytes segment 를 보낸다. 셋째 segment 의 sequence number 는?","answer":5501,"tol":0,"explain":"첫 data byte = 3,501 (③ ACK 는 번호를 안 씀). 3,501 → 4,701 → **5,501**. 마지막 byte 는 7,500.","src":"PS2 유형 · 11/24 과제","wiki":"TCP sequence number와 ISN","tags":["TCP sequence number와 ISN"],"prof":true,"introCard":0},{"id":"u10g-06","type":"num","q":"위에서 둘째 segment(800 B)만 사라졌다. 셋째를 받은 server 의 ACK number 는?","answer":4701,"tol":0,"explain":"cumulative ACK: 연속으로 받은 마지막 byte 4,700 → **4,701** (셋째는 out of order 로 저장).","src":"PS2 유형 · 11/24 과제","wiki":"acknowledgment number","tags":["acknowledgment number"],"prof":true,"introCard":0},{"id":"u10g-07","type":"mc","q":"SYN flooding 에서 끝내 오지 않는 handshake 단계는?","choices":["① SYN","② SYN + ACK","③ client 의 마지막 ACK","모두 온다"],"answer":2,"explain":"가짜 source 라 SYN + ACK 에 아무도 답하지 않는다 → **③ ACK** 가 안 와서 half-open 이 쌓이고 자원이 바닥난다(DoS).","src":"PS2 유형 · 11/24 과제","wiki":"SYN flooding attack","tags":["SYN flooding attack"],"prof":true,"introCard":0},{"id":"u10g-08","type":"num","q":"receive buffer 6,000 B, 받고 ACK 한 byte 4,000, process 가 가져간 byte 2,500. rwnd 는?","answer":4500,"unit":"B","tol":0,"explain":"안 가져간 byte = 4,000 − 2,500 = 1,500 → rwnd = 6,000 − 1,500 = **4,500**. cwnd 가 3,000 이면 실제 window = min = 3,000.","src":"PS2 유형 · 11/24 과제","wiki":"receive window와 rwnd","tag
